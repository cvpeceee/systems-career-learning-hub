<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeetCode-Style Interview Prep — Chandra Vig</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--panel2:#16223b;--ink:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--hl:#f59e0b;--ok:#22c55e;--bad:#ef4444;--vio:#a78bfa;--line:#26344f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--acc)}header{position:sticky;top:0;z-index:5;background:#0b1220ee;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:17px}nav a{display:inline-block;white-space:nowrap;margin-right:12px;text-decoration:none;font-weight:600}main{max-width:1100px;margin:0 auto;padding:14px}.tag{display:inline-block;background:#1e293b;border-radius:10px;padding:2px 9px;margin:2px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.plain{background:#172554;border:1px solid #3b82f6;border-radius:12px;padding:12px 14px;margin:10px 0}.plain h4{margin:0 0 4px;color:var(--acc)}
.term{color:var(--mut);font-size:14px}.pill{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;margin:2px}
.Easy{color:var(--ok)}.Medium{color:var(--hl)}.Hard{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.item:hover{border-color:var(--acc)}button,select,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.pri{background:#0369a1;border-color:#0ea5e9}button:disabled{opacity:.45}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button.on{background:#0369a1}
pre.code{background:#0a0f1c;border:1px solid var(--line);border-radius:10px;padding:8px 0;overflow:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0;max-height:520px}
pre.code .ln{display:block;padding:0 10px 0 0;white-space:pre}pre.code .ln.cur{background:#78350f;outline:1px solid var(--hl)}pre.code .no{display:inline-block;width:34px;color:#475569;text-align:right;margin-right:10px;user-select:none}
.kw{color:#c084fc}.cm{color:#64748b;font-style:italic}.st{color:#86efac}.nu{color:#fbbf24}
.viz{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.vbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
.vname{font-size:12px;color:var(--mut);margin-bottom:4px;font-family:ui-monospace,monospace}
.cells{display:flex;flex-wrap:wrap;gap:3px}.cell{min-width:34px;height:34px;padding:0 5px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#1e293b;border:1px solid #475569;font:600 14px ui-monospace,monospace;position:relative;transition:all .25s}
.cell.ch{background:var(--hl);color:#111;border-color:#fde68a;transform:translateY(-3px)}.cell.pt{outline:2px solid var(--vio)}.cell .ix{position:absolute;bottom:-15px;font-size:10px;color:#64748b}
.cell .pp{position:absolute;top:-17px;font-size:10px;color:var(--vio);white-space:nowrap;font-weight:700}.cellrow{padding-top:16px;padding-bottom:14px}
.chip{display:inline-block;background:#1e293b;border:1px solid #475569;border-radius:8px;padding:2px 8px;margin:2px;font:13px ui-monospace,monospace;transition:all .25s}.chip.ch{background:var(--hl);color:#111}
.frames{display:flex;flex-direction:column-reverse;gap:6px}.frame{min-width:0;overflow-wrap:anywhere;border:1px solid #475569;border-radius:8px;padding:6px 8px;background:#132036;animation:pop .25s}.frame.top{border-color:var(--hl);box-shadow:0 0 0 1px var(--hl)}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}.frame h5{margin:0 0 3px;font:600 13px ui-monospace,monospace;color:var(--hl)}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
@media(max-width:800px){.split{grid-template-columns:minmax(0,1fr)}body{font-size:15px}}
textarea{width:100%;min-height:260px;background:#0a0f1c;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.5 ui-monospace,monospace}
.lock{border:1px dashed var(--hl);border-radius:12px;padding:14px;text-align:center;color:var(--mut)}
.timer{font:700 22px ui-monospace,monospace;color:var(--hl)}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left;vertical-align:top;font-size:14px}
td code,li code{font-size:13px}.note{color:var(--acc);font-weight:700;min-height:24px}.status{font-size:12px;padding:1px 7px;border-radius:999px}.st-solved{background:#14532d}.st-review{background:#78350f}
svg text{fill:var(--ink);font:600 13px system-ui}.small{font-size:13px;color:var(--mut)}canvas{max-width:100%;height:auto;border-radius:10px;background:#0f172a}video{width:100%;border-radius:10px;background:#000}
.arch rect{fill:#16223b;stroke:#475569;stroke-width:2;rx:10}.arch .on rect{stroke:var(--hl);fill:#3b2a08}.arch .dead rect{stroke:var(--bad);fill:#3f1111}.arch line{stroke:#475569;stroke-width:2}
[data-a=cap],#arch,[data-a=frames]{scroll-margin-top:70px}
</style></head><body>
<header><b>🧩 Interview Prep</b><nav><a href="#home">Home</a><a href="#coding">Coding</a><a href="#design">Design</a><a href="#companies">Companies</a><a href="#concepts">Concepts</a><a href="#mock">Mock interview</a><a href="#progress">Progress</a></nav></header>
<main id="app">Loading…</main>
<script src="data.js"></script><script src="player.js"></script><script src="app.js"></script>
</body></html>
