<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--acc)}header{position:sticky;top:0;z-index:5;background:#0b1220ee;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:17px}nav a{display:inline-block;margin-right:12px;text-decoration:none;font-weight:600;cursor:pointer}main{max-width:1000px;margin:0 auto;padding:14px}

.jar{background:#1c1917;border:1px solid #a16207;border-radius:12px;padding:10px 14px}.jar dt{color:var(--hl);font-weight:700}.jar dd{margin:0 0 6px 0;color:#e7e5e4}
.tag{display:inline-block;background:#1e293b;border-radius:10px;padding:2px 9px;margin:2px;font-size:13px;color:var(--vio)}

.done{color:var(--ok)}pre{background:#020617;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:13px;white-space:pre-wrap}
code{background:#1e293b;border-radius:4px;padding:0 4px;font-size:.92em}pre code{background:none;padding:0}

#sv{overflow-x:auto}.anim svg{min-width:600px;width:100%;height:auto;background:#020617;border-radius:10px;border:1px solid var(--line)}.cap{min-height:2.6em;margin:6px 0;color:var(--hl);font-weight:600}
.bar{height:8px;background:#1e293b;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);transition:width .4s}
.st{font-size:13px;padding:2px 8px;border-radius:8px;display:inline-block}.V{background:#14532d}.P{background:#713f12}.N{background:#7f1d1d}
input[type=search]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px;width:100%;font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.fade{animation:pop .35s ease}
.chip{border-bottom:2px dotted var(--hl);color:#fde68a;cursor:pointer;font-weight:600}.chip:hover,.chip:focus{background:#422006;outline:none;border-radius:4px}
.chipx{display:block;font-weight:400;margin:6px 0 8px;padding:8px 10px;background:#1c1917;border:1px solid #a16207;border-radius:8px;font-size:14px;color:#e7e5e4;animation:pop .25s ease}.chipx b{color:var(--hl)}.chipx i{color:#bbf7d0;font-style:normal}

<script>
const D={"lessons": [{"id": "role", "t": "Your two roles, decoded", "tag": "Start here", "an": "Think of a conference-room camera bar as a restaurant. The diners (Zoom/Teams apps) only see the dining room. You work in the kitchen and the basement: the stoves (chips), the wiring (<span class=\"chip\" tabindex=\"0\" data-k=\"driver\">drivers<\/span>), the delivery door (USB) and the rules for who may enter (security). The postings call this 'below the <span class=\"chip\" tabindex=\"0\" data-k=\"framework\">framework<\/span> layer'.", "j": [], "d": "<p>Both postings (Austin, Poly/HP) describe the same product family: <b>Android- and Linux-based video conferencing devices<\/b>. The USB role adds one hard requirement: <i>\"In depth, hands-on, and extensive experience and knowledge on the full USB software stack is must-have.\"<\/i><\/p>\n<h4>What 'full USB stack' means on a conferencing device<\/h4><ul>\n<li><b>Device side<\/b> (the bar plugs into a laptop and shows up as webcam + mic + speaker + buttons). Follow the path one piece at a time:<ol><li>The <b><span class=\"chip\" tabindex=\"0\" data-k=\"udc\">UDC<\/span><\/b>, the chip's USB \"front desk\" that answers the laptop. On Qualcomm and NXP chips it is usually a <b><span class=\"chip\" tabindex=\"0\" data-k=\"dwc3\">DWC3<\/span><\/b>, a ready-made design bought from Synopsys.<\/li><li>The Linux <b><span class=\"chip\" tabindex=\"0\" data-k=\"gadget\">gadget<\/span><\/b> framework: the board puts on a \"webcam costume\". You describe the costume in <b><span class=\"chip\" tabindex=\"0\" data-k=\"configfs\">configfs<\/span><\/b> by making folders and writing small files.<\/li><li>The standard functions: <b><span class=\"chip\" tabindex=\"0\" data-k=\"uvc\">UVC<\/span><\/b> (\"I am a webcam\"), <b><span class=\"chip\" tabindex=\"0\" data-k=\"uac\">UAC2<\/span><\/b> (\"I am a mic and speaker\") and <b><span class=\"chip\" tabindex=\"0\" data-k=\"hid\">HID<\/span><\/b> (\"these are buttons\"). Every laptop already speaks these, so no driver install is needed.<\/li><li>A normal (user-space) <b>UVC streaming app<\/b> that hands camera frames to the gadget when the laptop asks for video.<\/li><li>Android's <b>USB <span class=\"chip\" tabindex=\"0\" data-k=\"hal\">HAL<\/span><\/b>, which switches the port between conferencing, file-transfer and debug modes.<\/li><\/ol>Tap any dotted word for its meaning and an everyday picture.<\/li>\n<li><b>Host side<\/b> (the device hosts peripherals: extension mics, touch controllers, USB-C displays): <span class=\"chip\" tabindex=\"0\" data-k=\"xhci\">xHCI<\/span>, hub driver, class drivers, power budgeting.<\/li>\n<li><b><span class=\"chip\" tabindex=\"0\" data-k=\"typec\">Type-C<\/span>/<span class=\"chip\" tabindex=\"0\" data-k=\"pd\">PD<\/span><\/b>: role swaps (host vs device), <span class=\"chip\" tabindex=\"0\" data-k=\"altmode\">alternate modes<\/span> (DisplayPort over USB-C), cable orientation.<\/li>\n<li><b><span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">Firmware<\/span> update<\/b> over USB (<span class=\"chip\" tabindex=\"0\" data-k=\"dfu\">DFU<\/span>) and the <span class=\"chip\" tabindex=\"0\" data-k=\"mcu\">MCU<\/span> firmware inside accessories.<\/li><\/ul>\n<h4>Shared responsibilities (both postings)<\/h4><ol>\n<li>Design and develop firmware for Android/Linux devices.<\/li><li>Build platform capabilities below the framework.<\/li><li>Lead secure, scalable, high-performance embedded C/C++.<\/li><li>Define architecture, standards, best practices with cross-functional teams.<\/li><li>Troubleshoot complex system-level issues.<\/li><li>Planning, documentation, testing strategy.<\/li><li>Mentor junior engineers.<\/li><li>Agile/lean continuous improvement.<\/li><\/ol>\n<p><b>Plus areas:<\/b> Networking/<span class=\"chip\" tabindex=\"0\" data-k=\"wifi\">Wi-Fi<\/span>, Security, USB, <span class=\"chip\" tabindex=\"0\" data-k=\"h264\">H.264<\/span>/H.265/<span class=\"chip\" tabindex=\"0\" data-k=\"svc\">SVC<\/span>, <span class=\"chip\" tabindex=\"0\" data-k=\"hdmi\">HDMI<\/span>, Bluetooth, Android internals and Linux.<\/p>\n<p>Your current work with NXP, Lontium HDMI bridges, Qualcomm and Ambarella vendor drivers maps directly onto 'HDMI', 'troubleshoot system-level issues' and '<span class=\"chip\" tabindex=\"0\" data-k=\"bsp\">BSP<\/span>'. This course fills in the rest and focuses on the senior behaviors (lead, define standards, mentor) that the postings repeat.<\/p>", "anim": ["flow", "The stack you own, top to bottom", ["Apps (Teams/Zoom rooms)", "Android framework services", "HAL + native daemons (your code)", "Linux kernel drivers (your code)", "Bootloader / secure boot (your code)", "SoC + bridges + USB PHY (vendor silicon)"], ["Users only see this", "Java system services call HALs", "AIDL HALs, camera/audio/USB daemons", "V4L2, ALSA, USB gadget, I2C bridges", "ROM \u2192 SPL \u2192 U-Boot/ABL \u2192 kernel", "Qualcomm/NXP/Ambarella, Lontium bridge"]], "q": [["Which layer does 'below the framework layer' NOT include?", "The app layer (Teams/Zoom). Everything from HALs down is yours."], ["What is the one must-have in the USB posting?", "Deep, hands-on knowledge of the full USB software stack (device, host, class drivers, Android USB HAL, debugging)."]], "lab": null, "video": "v01-roles-decoded", "vdur": 629.7, "terms": ["driver", "framework", "udc", "dwc3", "gadget", "configfs", "uvc", "uac", "hid", "hal", "xhci", "typec", "pd", "altmode", "firmware", "dfu", "mcu", "wifi", "h264", "svc", "hdmi", "bsp", "kernel", "bootloader", "secureboot", "soc", "phy", "aidl", "v4l2", "alsa", "i2c", "rom", "uboot"]}, {"id": "cpp", "t": "Embedded C/C++ craft that seniors are judged on", "tag": "C/C++", "an": "Writing <span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">firmware<\/span> is like cooking on a boat: the same recipe, but the floor moves (<span class=\"chip\" tabindex=\"0\" data-k=\"irq\">interrupts<\/span>), the pantry is tiny (RAM) and if you spill (memory bug) nobody can come fix it once you sail (shipped devices).", "j": [["volatile", "Tells the compiler a value can change outside normal code (hardware register). It does NOT make code thread-safe."], ["Memory barrier", "An instruction that stops the CPU/compiler from reordering memory accesses across it."], ["RAII", "C++ idiom: a resource is released in the destructor, so cleanup happens automatically."]], "d": "<h4>Rules that prevent most field bugs<\/h4><ul>\n<li><b>Register access<\/b>: use <code>readl()/writel()<\/code> in the <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span> (they include the right barriers); in bare metal use <code>volatile<\/code> pointers plus explicit barriers (<code>__DMB()<\/code> on ARM) around <span class=\"chip\" tabindex=\"0\" data-k=\"dma\">DMA<\/span> buffers.<\/li>\n<li><b><span class=\"chip\" tabindex=\"0\" data-k=\"isr\">ISR<\/span> rules<\/b>: no blocking, no malloc, no printf; record and defer. Share data through lock-free single-producer/single-consumer rings (Lab 08) or with interrupts briefly disabled.<\/li>\n<li><b>Atomics &amp; ordering<\/b>: use C11 <code>stdatomic<\/code> acquire/release: the producer writes data, then <i>releases<\/i> the index; the consumer <i>acquires<\/i> the index, then reads data.<\/li>\n<li><b>Integer hygiene<\/b>: USB lengths are little-endian 16-bit (<code>wTotalLength<\/code>); always bounds-check <span class=\"chip\" tabindex=\"0\" data-k=\"descriptor\">descriptor<\/span> lengths from the wire (a malformed descriptor is a classic security bug).<\/li>\n<li><b>C++ in firmware<\/b>: RAII for fds/locks/mmaps in <span class=\"chip\" tabindex=\"0\" data-k=\"hal\">HAL<\/span> daemons, <code>std::unique_ptr<\/code> with custom deleters, avoid exceptions/RTTI where the build forbids them, prefer <code>std::array<\/code>/<code>std::span<\/code>, <code>constexpr<\/code> tables for descriptors.<\/li>\n<li><b>Tooling<\/b>: build with <code>-Wall -Wextra -Werror<\/code>; run <span class=\"chip\" tabindex=\"0\" data-k=\"sanit\">ASan<\/span>/UBSan/TSan on host-buildable parts; static analysis (clang-tidy, Coverity, cppcheck); in the kernel <code>sparse<\/code>, <code>checkpatch.pl<\/code>, KASAN, lockdep.<\/li><\/ul>\n<h4>Senior signal<\/h4><p>Make host-testable seams: put protocol logic (descriptor parsing, state machines, CRC/image checks) in plain C files with no hardware calls, and unit-test them on the PC with sanitizers in <span class=\"chip\" tabindex=\"0\" data-k=\"ci\">CI<\/span>. Every lab in this course follows that pattern.<\/p>", "anim": ["seq", "ISR \u2192 task handoff through a lock-free ring", ["Hardware", "ISR", "Ring", "Task"], [[0, 1, "IRQ fires"], [1, 2, "write data[head]"], [1, 2, "release head++"], [1, 0, "ack IRQ, return fast"], [3, 2, "acquire head"], [2, 3, "read data[tail]"], [3, 2, "release tail++"]]], "q": [["Does volatile make a shared counter thread-safe?", "No. It only stops the compiler caching it. You still need atomics or locks for read-modify-write."], ["Why must the producer update head AFTER writing the slot (release)?", "Otherwise the consumer could see the new head and read a slot that isn't written yet."]], "lab": "08-isr-ring-buffer", "video": "v02-embedded-cpp", "vdur": 319.4, "terms": ["firmware", "irq", "kernel", "dma", "isr", "descriptor", "hal", "sanit", "ci"]}, {"id": "drvmodel", "t": "The Linux driver model: bus, device, driver, probe", "tag": "Kernel", "an": "A wedding seating plan: guests (devices) arrive with name tags (IDs). Ushers (buses) read the tag and walk them to the right table host (<span class=\"chip\" tabindex=\"0\" data-k=\"driver\">driver<\/span>). When a match happens the host 'greets' them: that greeting is <span class=\"chip\" tabindex=\"0\" data-k=\"probe\">probe()<\/span>.", "j": [["Module", "A .ko file loaded into the running kernel with insmod/modprobe."], ["devm_*", "Device-managed allocators: freed automatically when the device is unbound."], ["Char device", "A device read/written as a byte stream via /dev, e.g. /dev/ttyACM0."]], "d": "<h4>Core objects<\/h4><ul><li><code>struct bus_type<\/code> (platform, i2c, spi, usb, pci) owns <code>match()<\/code>.<\/li><li><code>struct device<\/code>: a thing that exists (from <span class=\"chip\" tabindex=\"0\" data-k=\"dt\">DT<\/span>, ACPI, USB <span class=\"chip\" tabindex=\"0\" data-k=\"enum\">enumeration<\/span>).<\/li><li><code>struct device_driver<\/code>: the code that can run it. Match tables: <code>of_device_id<\/code> (DT compatible), <code>i2c_device_id<\/code>, <code>usb_device_id<\/code>.<\/li><\/ul>\n<h4>Lifecycle<\/h4><p>register driver \u2192 bus match \u2192 <code>probe()<\/code> \u2192 device usable \u2192 <code>remove()<\/code> on unbind. If a dependency (regulator, clock, <span class=\"chip\" tabindex=\"0\" data-k=\"gpio\">GPIO<\/span>) isn't ready, return <code>-EPROBE_DEFER<\/code>; the <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span> retries later. Use <code>dev_err_probe()<\/code> so deferrals don't spam logs. Check <code>/sys/kernel/debug/devices_deferred<\/code> when a device never appears: this is one of the most common bring-up bugs.<\/p>\n<h4>User interfaces from a driver<\/h4><ul><li><b>Char/misc device<\/b> with <code>file_operations<\/code> (read/write/<span class=\"chip\" tabindex=\"0\" data-k=\"sysfs\">ioctl<\/span>/poll/mmap).<\/li><li><b>sysfs attributes<\/b> (<code>DEVICE_ATTR_RO<\/code>, <code>sysfs_emit<\/code>) for one-value-per-file knobs.<\/li><li><b>Subsystem frameworks<\/b> instead of raw char devs whenever possible: <span class=\"chip\" tabindex=\"0\" data-k=\"v4l2\">V4L2<\/span> for video, <span class=\"chip\" tabindex=\"0\" data-k=\"alsa\">ALSA<\/span> for audio, input for buttons, USB <span class=\"chip\" tabindex=\"0\" data-k=\"gadget\">gadget<\/span> for device-mode USB. Reviewers (and upstream) will push back on custom ioctls when a <span class=\"chip\" tabindex=\"0\" data-k=\"framework\">framework<\/span> exists.<\/li><\/ul>\n<h4>Concurrency<\/h4><p>Any file op can run concurrently from multiple processes. Lab 01 protects its buffer with a <span class=\"chip\" tabindex=\"0\" data-k=\"spinlock\">mutex<\/span>; <code>copy_to_user/copy_from_user<\/code> can sleep (page faults), so never call them while holding a spinlock.<\/p>", "anim": ["seq", "Driver binding and probe", ["Firmware/DT", "Bus core", "Driver", "Userspace"], [[0, 1, "device registered (compatible=poly,...)"], [2, 1, "driver registered (of_match_table)"], [1, 1, "match(): compatible strings equal"], [1, 2, "probe(dev)"], [2, 1, "needs GPIO not ready \u2192 -EPROBE_DEFER"], [1, 2, "retry probe later \u2192 0"], [2, 3, "/dev node + sysfs attrs appear"], [3, 2, "open/read/write/ioctl"]]], "q": [["A driver's probe returns -EPROBE_DEFER. Is that an error?", "Not necessarily: it means a dependency isn't ready yet; the core retries. It becomes a bug only if the dependency never arrives (check devices_deferred)."], ["Why can't you call copy_from_user under a spinlock?", "It may sleep on a page fault, and sleeping with a spinlock held can deadlock."]], "lab": "01-chardev-sysfs", "video": "v03-driver-model", "vdur": 382.7, "terms": ["driver", "probe", "dt", "enum", "gpio", "kernel", "sysfs", "v4l2", "alsa", "gadget", "framework", "spinlock", "module", "firmware", "userspace"]}, {"id": "dt", "t": "Device Tree, platform drivers, I2C/SPI/GPIO, regmap", "tag": "Kernel", "an": "The <span class=\"chip\" tabindex=\"0\" data-k=\"dt\">device tree<\/span> is the house blueprint handed to the electrician (<span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span>): it says which room has which socket, wired to which breaker. The kernel can't 'see' an <span class=\"chip\" tabindex=\"0\" data-k=\"hdmi\">HDMI<\/span> bridge on <span class=\"chip\" tabindex=\"0\" data-k=\"i2c\">I2C<\/span>; the blueprint has to say it is there.", "j": [["compatible", "The DT string the kernel uses to pick the driver, e.g. \"lontium,lt9611\"."], ["Overlay", "A DT patch applied on top of the base tree, e.g. for an add-on board."], ["pinctrl", "Configures which function a SoC pin has (GPIO, I2C, UART)."]], "d": "<h4>Typical bridge node (Lontium-style)<\/h4><pre>&amp;i2c3 {\n  hdmi-bridge@3b {\n    compatible = \"lontium,lt9611\";\n    reg = &lt;0x3b&gt;;                 /* I2C address */\n    interrupts-extended = &lt;&amp;tlmm 50 IRQ_TYPE_EDGE_FALLING&gt;;\n    reset-gpios = &lt;&amp;tlmm 52 GPIO_ACTIVE_HIGH&gt;;\n    vdd-supply = &lt;&amp;vreg_1p8&gt;;\n    ports { port@0 { reg=&lt;0&gt;; endpoint { remote-endpoint = &lt;&amp;dsi0_out&gt;; }; }; };\n  };\n};<\/pre>\n<p>The <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">driver<\/span> then calls <code>devm_gpiod_get(dev,\"reset\",...)<\/code>, <code>devm_regulator_get(dev,\"vdd\")<\/code>, <code>devm_regmap_init_i2c()<\/code>, and links into the <span class=\"chip\" tabindex=\"0\" data-k=\"drm\">DRM<\/span> bridge chain through the <code>ports<\/code> graph.<\/p>\n<h4>Bus cheat sheet<\/h4><ul><li><b>I2C<\/b>: 2 wires, addressed, slow (100k-1MHz); bridges, PMICs, sensors, touch. Debug: <code>i2cdetect -y 3<\/code>, <code>i2cget<\/code>, check pull-ups and NACKs on a logic analyzer.<\/li><li><b><span class=\"chip\" tabindex=\"0\" data-k=\"spi\">SPI<\/span><\/b>: 4 wires, faster, full-duplex; flash, some displays/<span class=\"chip\" tabindex=\"0\" data-k=\"codec\">codecs<\/span>.<\/li><li><b><span class=\"chip\" tabindex=\"0\" data-k=\"gpio\">GPIO<\/span><\/b>: reset lines, enable pins, <span class=\"chip\" tabindex=\"0\" data-k=\"irq\">interrupts<\/span>. Watch <code>GPIO_ACTIVE_LOW<\/code>: the gpiod API uses <i>logical<\/i> values, so active-low is handled for you.<\/li><\/ul>\n<h4>Vendor-<span class=\"chip\" tabindex=\"0\" data-k=\"bsp\">BSP<\/span> reality<\/h4><p>Vendor trees (Qualcomm, NXP, Ambarella) carry many out-of-tree bindings. Senior practice: document every binding you add (YAML schema under Documentation/devicetree/bindings), run <code>make dtbs_check<\/code>, and keep board-specific values in DT instead of #ifdefs in C.<\/p>", "anim": ["flow", "From blueprint to running driver", ["board.dts written", "dtc \u2192 board.dtb", "Bootloader loads dtb + kernel", "Kernel unflattens tree", "platform/i2c device created", "Driver matched by compatible", "probe(): gpio/regulator/regmap"], ["source text", "binary blob", "U-Boot: bootm/booti with fdt addr", "of_platform_populate()", "one struct device per node", "of_match_table", "resources come from DT properties"]], "q": [["Your bridge never probes and there's no error in dmesg. First two checks?", "Is the node status=\"okay\" and does compatible exactly match the driver table? Then check /sys/kernel/debug/devices_deferred for a missing regulator/GPIO."], ["Why use gpiod logical values instead of raw levels?", "DT flags (ACTIVE_LOW) invert automatically, so the driver code stays board-independent."]], "lab": "02-platform-dt", "video": "v04-device-tree", "vdur": 415.7, "terms": ["dt", "kernel", "hdmi", "i2c", "driver", "drm", "spi", "codec", "gpio", "irq", "bsp", "bootloader", "dtb", "regmap", "soc", "uart", "probe", "uboot"]}, {"id": "irq", "t": "Interrupts, threaded IRQs, workqueues, DMA, locking", "tag": "Kernel", "an": "An <span class=\"chip\" tabindex=\"0\" data-k=\"irq\">interrupt<\/span> is a doorbell. The <span class=\"chip\" tabindex=\"0\" data-k=\"isr\">top half<\/span> is answering the door and signing for the package in seconds. The <span class=\"chip\" tabindex=\"0\" data-k=\"workqueue\">bottom half<\/span> (<span class=\"chip\" tabindex=\"0\" data-k=\"threadedirq\">threaded IRQ<\/span> or workqueue) is unpacking it later in the kitchen, where you're allowed to take your time.", "j": [["Top half", "The hard IRQ handler: runs with interrupts masked, must be very short, cannot sleep."]], "d": "<h4>Choosing a context<\/h4><table><tr><th>Need<\/th><th>Use<\/th><\/tr><tr><td>Device on <span class=\"chip\" tabindex=\"0\" data-k=\"i2c\">I2C<\/span> (bridge <span class=\"chip\" tabindex=\"0\" data-k=\"edid\">HPD<\/span>, touch)<\/td><td><code>devm_request_threaded_irq(..., NULL, thread_fn, IRQF_ONESHOT, ...)<\/code>: I2C sleeps, so it must be threaded.<\/td><\/tr><tr><td><span class=\"chip\" tabindex=\"0\" data-k=\"mmio\">MMIO<\/span> status register<\/td><td>Hard handler reads/acks, wakes thread or NAPI/tasklet.<\/td><\/tr><tr><td>Long jobs, retries, timers<\/td><td><code>schedule_work<\/code> / <code>delayed_work<\/code>.<\/td><\/tr><\/table>\n<h4>Locking map<\/h4><ul><li>Data shared with a hard IRQ: <code>spin_lock_irqsave<\/code>.<\/li><li>Process-context only: <code>mutex<\/code>.<\/li><li>Single counters/flags: <code>atomic_t<\/code>, <code>READ_ONCE/WRITE_ONCE<\/code>.<\/li><li>Turn on <code>CONFIG_PROVE_LOCKING<\/code> (lockdep) in debug builds: it reports deadlock risks before they happen.<\/li><\/ul>\n<h4><span class=\"chip\" tabindex=\"0\" data-k=\"dma\">DMA<\/span> essentials<\/h4><p>Use the DMA API, never physical addresses by hand: <code>dma_alloc_coherent<\/code> for small control rings, <code>dma_map_single/dma_map_sg<\/code> plus <code>dma_sync_*<\/code> for streaming buffers (cache maintenance on ARM!). For camera/video frames, buffers move between <span class=\"chip\" tabindex=\"0\" data-k=\"v4l2\">V4L2<\/span>, the GPU and <span class=\"chip\" tabindex=\"0\" data-k=\"codec\">codec<\/span> as <b>dma-buf<\/b> fds with zero copy. Missing cache sync shows up as 'green stripes' or stale lines in video.<\/p>\n<h4>Teardown order<\/h4><p>On remove: disable the IRQ source, <code>free_irq<\/code>/devm, then <code>cancel_work_sync<\/code>, then free memory. Lab 03 shows <code>timer_delete_sync<\/code> then <code>cancel_work_sync<\/code>: wrong order can let the timer requeue work after you cancel it.<\/p>", "anim": ["seq", "HDMI hot-plug interrupt on an I2C bridge", ["Bridge chip", "GIC/IRQ core", "Hard handler", "IRQ thread", "DRM core"], [[0, 1, "HPD pin falls"], [1, 2, "mask line, call handler"], [2, 1, "return IRQ_WAKE_THREAD"], [1, 3, "wake thread"], [3, 0, "I2C read status (sleeps)"], [3, 0, "I2C write clear"], [3, 4, "drm_bridge_hpd_notify()"], [3, 1, "IRQ_HANDLED, unmask (ONESHOT)"]]], "q": [["Why IRQF_ONESHOT for an I2C device's level IRQ?", "The line stays masked until the thread finishes; otherwise a level IRQ would refire forever before the thread can clear it over I2C."], ["Video shows stale stripes only on ARM board, not x86. Suspect?", "Missing DMA cache maintenance (dma_sync_* or wrong buffer type): x86 DMA is coherent, many ARM paths aren't."]], "lab": "03-irq-workqueue", "video": "v05-irq-dma", "vdur": 384.0, "terms": ["irq", "isr", "workqueue", "threadedirq", "i2c", "edid", "mmio", "dma", "v4l2", "codec", "kernel", "spinlock", "hdmi", "drm"]}, {"id": "boot", "t": "Boot chain, U-Boot/ABL and secure boot", "tag": "Boot", "an": "Booting is a relay race. The <span class=\"chip\" tabindex=\"0\" data-k=\"rom\">boot ROM<\/span> (burned into the chip) runs first and hands the baton to a small loader, which hands it to <span class=\"chip\" tabindex=\"0\" data-k=\"uboot\">U-Boot<\/span> (or Qualcomm's ABL), which hands it to the <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span>, which hands it to <span class=\"chip\" tabindex=\"0\" data-k=\"init\">init<\/span>. In <span class=\"chip\" tabindex=\"0\" data-k=\"secureboot\">secure boot<\/span>, every runner checks the next runner's ID badge (signature) before passing the baton.", "j": [["SPL / XBL", "A tiny first-stage loader that sets up DRAM. XBL is Qualcomm's."], ["Chain of trust", "Each stage verifies the signature of the next before running it."]], "d": "<h4>Typical stages<\/h4><ol><li>ROM loads first stage from eMMC/UFS/<span class=\"chip\" tabindex=\"0\" data-k=\"spi\">SPI<\/span> flash (fuses decide boot source and whether signatures are required).<\/li><li>SPL/XBL: clocks, PMIC, DDR training.<\/li><li>Trusted <span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">firmware<\/span> (ARM <span class=\"chip\" tabindex=\"0\" data-k=\"tee\">TF-A<\/span>, BL31) and optionally a TEE (OP-TEE / QTEE).<\/li><li>U-Boot or ABL: reads env, picks <span class=\"chip\" tabindex=\"0\" data-k=\"ab\">A/B<\/span> slot, loads kernel + <span class=\"chip\" tabindex=\"0\" data-k=\"dtb\">DTB<\/span> (+ initramfs), passes cmdline.<\/li><li>Kernel: decompress, early console (<code>earlycon<\/code>), <span class=\"chip\" tabindex=\"0\" data-k=\"probe\">probe<\/span> <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">drivers<\/span>, mount root.<\/li><li>init (systemd/busybox on Linux, Android <code>init<\/code>).<\/li><\/ol>\n<h4>U-Boot skills to practice<\/h4><ul><li>Console: <code>printenv<\/code>, <code>setenv bootargs<\/code>, <code>mmc dev; mmc read<\/code>, <code>fdt addr; fdt print /soc<\/code>, <code>booti $kernel_addr - $fdt_addr<\/code>.<\/li><li>Board code + <span class=\"chip\" tabindex=\"0\" data-k=\"dt\">DT<\/span> in U-Boot is separate from the kernel's: keep them in sync.<\/li><li>Fastboot in <span class=\"chip\" tabindex=\"0\" data-k=\"bootloader\">bootloader<\/span> for flashing; <code>ums<\/code> to expose eMMC as USB mass storage.<\/li><\/ul>\n<h4>Bring-up debugging<\/h4><p>No output? Check <span class=\"chip\" tabindex=\"0\" data-k=\"uart\">UART<\/span> pins/baud first, then add <code>earlycon<\/code> and <code>keep_bootcon<\/code>, <code>initcall_debug<\/code>, and in a hang use <span class=\"chip\" tabindex=\"0\" data-k=\"jtag\">JTAG<\/span> to read the PC. 'Starting kernel ...' then silence is usually wrong DTB, wrong load address, or console not enabled in DT.<\/p>\n<h4>Secure boot<\/h4><p>Public key hash blown into fuses \u2192 ROM verifies first stage \u2192 each stage verifies the next \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"avb\">AVB<\/span> verifies Android partitions with dm-verity. Plus anti-rollback counters (see Lab 09). Never ship debug keys; keep signing in a controlled <span class=\"chip\" tabindex=\"0\" data-k=\"ci\">CI<\/span> step, not on laptops.<\/p>", "anim": ["flow", "Secure boot relay", ["Boot ROM (fused key hash)", "SPL / XBL: DDR init", "TF-A BL31 + TEE", "U-Boot / ABL: pick slot A/B", "Linux kernel + DTB", "init \u2192 services", "AVB/dm-verity guards system"], ["verifies SPL signature", "verifies next image", "secure monitor", "verifies boot.img/vbmeta", "earlycon, probe drivers", "Android init or systemd", "blocks tampered blocks at read time"]], "q": [["Kernel prints nothing after 'Starting kernel'. Three likely causes?", "Wrong/missing DTB for the board, wrong load address/compression, console/UART not enabled or wrong console= in bootargs. Use earlycon to see more."], ["What protects against flashing an old, signed but vulnerable image?", "Anti-rollback: a version counter in fuses/RPMB that images must be \u2265 to boot."]], "lab": "09-dfu-ab-image", "video": "v06-boot-chain", "vdur": 359.5, "terms": ["rom", "uboot", "kernel", "init", "secureboot", "spi", "firmware", "tee", "ab", "dtb", "probe", "driver", "dt", "bootloader", "uart", "jtag", "avb", "ci", "soc"]}, {"id": "yocto", "t": "Yocto, Buildroot and living with vendor BSPs", "tag": "Build", "an": "A <span class=\"chip\" tabindex=\"0\" data-k=\"bsp\">BSP<\/span> is a vendor's meal kit: everything in the box, pre-measured, but for their kitchen. <span class=\"chip\" tabindex=\"0\" data-k=\"yocto\">Yocto<\/span> is your recipe book that says 'take the kit, swap the sauce, add our spices' as layers, so you can repeat the same meal next year with a new kit.", "j": [["Layer (meta-*)", "A folder of recipes and appends; e.g. meta-qcom, meta-freescale, meta-poly."], ["bbappend", "Modifies another layer's recipe without editing it."], ["Downstream / upstream", "Upstream is the main kernel.org project; downstream is a vendor or company fork."]], "d": "<h4>Yocto day-to-day<\/h4><pre>source oe-init-build-env build\nbitbake core-image-minimal           # or your product image\nbitbake -c devshell linux-yourboard  # shell inside the kernel recipe's workdir\nbitbake -c menuconfig virtual/kernel\ndevtool modify linux-yourboard       # edit source, then devtool finish to emit patches\nbitbake -e myapp | grep ^SRC_URI=     # see final variable values<\/pre>\n<p>Keep company changes in <code>meta-company<\/code> with <code>.bbappend<\/code> files and <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span> <code>.cfg<\/code> fragments; never edit vendor layers in place. Pin layer revisions (kas/repo manifests) so builds are reproducible.<\/p>\n<p><b>Try without hardware:<\/b> <code>MACHINE=qemuarm64 bitbake core-image-minimal &amp;&amp; runqemu qemuarm64 nographic<\/code> (needs ~50-100 GB disk and several hours the first time; not run on our box).<\/p>\n<h4>Vendor BSP strategy (NXP, Qualcomm, Ambarella)<\/h4><ul><li>Track which vendor release you're on, and keep your patches as a numbered series on top (rebases become mechanical).<\/li><li>Before patching a vendor <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">driver<\/span>, search upstream: often the fix exists. Prefer backporting upstream commits (with <code>Fixes:<\/code> tags) to inventing your own.<\/li><li>File vendor tickets with a minimal repro, kernel version, register dumps, logs, and an ask. That is a senior skill that saves weeks.<\/li><li>Keep a 'BSP delta' document: what you changed, why, and whether it's upstreamable.<\/li><\/ul>", "anim": ["flow", "How an image is assembled", ["poky + vendor layers (meta-qcom/meta-freescale)", "meta-company (bbappends, cfg fragments)", "BitBake parses recipes", "fetch \u2192 patch \u2192 configure \u2192 compile", "package (ipk/rpm/deb)", "rootfs + kernel + dtb \u2192 image (wic)", "flash / runqemu"], ["vendor BSP kit", "your spices, no in-place edits", "dependency graph", "per recipe tasks, sstate cache", "per-package outputs", "sdcard/eMMC image", "test it"]], "q": [["You need to change one kernel config option for the product. Where?", "A .cfg fragment in your layer's linux bbappend, not by editing the vendor defconfig in place."], ["Why keep vendor patches as a numbered series?", "So moving to the next vendor BSP release is a rebase with clear conflicts, and each patch has a reason and upstream status."]], "lab": null, "video": "v07-yocto-bsp", "vdur": 274.9, "terms": ["bsp", "yocto", "kernel", "driver", "buildroot"]}, {"id": "v4l2", "t": "Camera pipeline: V4L2, media controller, ALSA/ASoC audio", "tag": "Media", "an": "<span class=\"chip\" tabindex=\"0\" data-k=\"v4l2\">V4L2<\/span> is a cafeteria tray system: you hand the kitchen (<span class=\"chip\" tabindex=\"0\" data-k=\"driver\">driver<\/span>) empty trays (buffers), it fills them with frames and puts them on the counter, you take one, eat (process/encode), and hand it back. If you're slow to hand back trays, the kitchen drops frames.", "j": [["Subdevice", "/dev/v4l-subdevN: a block inside the pipeline (sensor, bridge) with its own formats."], ["vivid", "A virtual V4L2 test driver; lets you test camera code without a camera."]], "d": "<h4>Capture loop (Lab 07)<\/h4><p><code>QUERYCAP \u2192 S_FMT \u2192 REQBUFS \u2192 QUERYBUF+mmap \u2192 QBUF all \u2192 STREAMON \u2192 loop{DQBUF; use; QBUF} \u2192 STREAMOFF<\/code>. For zero copy into an encoder, export buffers with <code>VIDIOC_EXPBUF<\/code> (<span class=\"chip\" tabindex=\"0\" data-k=\"dma\">dma-buf<\/span> fd) or use <code>V4L2_MEMORY_DMABUF<\/code>.<\/p>\n<h4>Conference-camera pipeline<\/h4><p>Sensor (MIPI <span class=\"chip\" tabindex=\"0\" data-k=\"csi\">CSI<\/span>-2) \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"soc\">SoC<\/span> CSI receiver \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"isp\">ISP<\/span> (Qualcomm Spectra, Ambarella's ISP) \u2192 scaler \u2192 encoder (<span class=\"chip\" tabindex=\"0\" data-k=\"h264\">H.264<\/span>/H.265) or straight to USB <span class=\"chip\" tabindex=\"0\" data-k=\"uvc\">UVC<\/span> (<span class=\"chip\" tabindex=\"0\" data-k=\"yuv\">YUY2<\/span>/NV12/MJPEG). <span class=\"chip\" tabindex=\"0\" data-k=\"hdmi\">HDMI<\/span>-in uses a bridge (Lontium/Toshiba) as a V4L2 subdevice that reports timings (<code>VIDIOC_QUERY_DV_TIMINGS<\/code>) and <span class=\"chip\" tabindex=\"0\" data-k=\"edid\">EDID<\/span>.<\/p>\n<p>Useful commands: <code>v4l2-ctl --list-devices<\/code>, <code>--list-formats-ext<\/code>, <code>--stream-mmap --stream-count=100<\/code> (prints fps), <code>media-ctl -p<\/code>, <code>v4l2-compliance -d /dev/video0<\/code> (run it on every driver change).<\/p>\n<h4>Audio<\/h4><p>Conferencing lives or dies on audio: echo cancellation needs <b>mic and speaker on the same clock<\/b> or with known drift. Watch for XRUNs (<code>aplay -v<\/code>, <code>/proc/asound/card*/pcm*/sub*/status<\/code>), period/buffer sizes, and sample-rate mismatches between USB <span class=\"chip\" tabindex=\"0\" data-k=\"uac\">UAC<\/span> (host clock) and I2S <span class=\"chip\" tabindex=\"0\" data-k=\"codec\">codecs<\/span> (local clock): asynchronous UAC with feedback <span class=\"chip\" tabindex=\"0\" data-k=\"endpoint\">endpoints<\/span> exists for exactly this.<\/p>\n<p>On Android, these sit under Camera HAL3 (<code>android.hardware.camera.provider<\/code>) and Audio <span class=\"chip\" tabindex=\"0\" data-k=\"hal\">HAL<\/span>; same <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span> APIs underneath.<\/p>", "anim": ["seq", "V4L2 buffer ping-pong", ["App", "V4L2 core", "Driver/DMA"], [[0, 1, "REQBUFS 4, mmap"], [0, 1, "QBUF #0..#3 (empty trays)"], [0, 1, "STREAMON"], [2, 2, "DMA fills #0, IRQ"], [2, 1, "vb2_buffer_done(#0)"], [1, 0, "DQBUF \u2192 #0 (full)"], [0, 0, "encode / send over UVC"], [0, 1, "QBUF #0 back"]]], "q": [["Frame rate halves under load but driver has no errors. Where to look?", "The app holds buffers too long (not QBUF'ing back), or too few buffers; check sequence gaps in DQBUF'd buffers."], ["Why does UAC audio drift against a local I2S codec?", "Different clocks: host USB SOF clock vs local crystal. Use async UAC with a feedback endpoint or resampling."]], "lab": "07-v4l2-capture", "video": "v08-v4l2-alsa", "vdur": 384.7, "terms": ["v4l2", "driver", "dma", "csi", "soc", "isp", "h264", "uvc", "yuv", "hdmi", "edid", "uac", "codec", "endpoint", "hal", "kernel", "mc", "alsa", "irq"]}, {"id": "codec", "t": "Video codecs (H.264/H.265/SVC) and HDMI on a conferencing device", "tag": "Media", "an": "A <span class=\"chip\" tabindex=\"0\" data-k=\"codec\">codec<\/span> is like describing a movie scene over the phone: send one full picture (<span class=\"chip\" tabindex=\"0\" data-k=\"iframe\">I-frame<\/span>), then only describe what moved (P/B-frames). <span class=\"chip\" tabindex=\"0\" data-k=\"svc\">SVC<\/span> is sending the description in layers so a slow listener can stop after the first layer and still get the gist.", "j": [["I/P/B frames", "I: self-contained; P: predicted from earlier; B: from earlier and later."], ["GOP", "Group of pictures: frames between I-frames."], ["HPD", "Hot Plug Detect: HDMI pin signaling a display was connected."]], "d": "<h4>Why it matters below the <span class=\"chip\" tabindex=\"0\" data-k=\"framework\">framework<\/span><\/h4><ul><li>Hardware encoders are <span class=\"chip\" tabindex=\"0\" data-k=\"v4l2\">V4L2<\/span> M2M devices (stateful or stateless) or vendor APIs (Qualcomm/Ambarella SDKs). You tune bitrate control (CBR/VBR), GOP, IDR on demand (when a participant joins), slice size for packet loss, and latency (no B-frames for real-time).<\/li><li><b>SVC/simulcast<\/b>: video meetings send several layers; temporal layers let an SFU (selective forwarding server) drop frames per participant. Your <span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">firmware<\/span> must expose layer controls and keep timestamps exact.<\/li><li>Measure glass-to-glass latency: camera exposure \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"isp\">ISP<\/span> \u2192 encoder \u2192 USB/network. Budget each stage.<\/li><\/ul>\n<h4><span class=\"chip\" tabindex=\"0\" data-k=\"hdmi\">HDMI<\/span> path (your Lontium experience)<\/h4><ul><li>HDMI-out: DSI/DPI from <span class=\"chip\" tabindex=\"0\" data-k=\"soc\">SoC<\/span> \u2192 bridge (e.g. LT9611) \u2192 HDMI. <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">Driver<\/span> is a <span class=\"chip\" tabindex=\"0\" data-k=\"drm\">DRM<\/span> bridge; <span class=\"chip\" tabindex=\"0\" data-k=\"edid\">EDID<\/span> read over DDC (<span class=\"chip\" tabindex=\"0\" data-k=\"i2c\">I2C<\/span>); mode validation against bridge limits.<\/li><li>HDMI-in (laptop sharing): bridge \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"csi\">CSI<\/span>-2 \u2192 V4L2. Handle source-change events (<code>V4L2_EVENT_SOURCE_CHANGE<\/code>), re-query timings, restart streaming.<\/li><li>Common bugs: EDID not re-read after hot-plug, HPD debounce, pixel clock out of range, color space (RGB vs YCbCr, limited vs full range) causing washed-out images, <span class=\"chip\" tabindex=\"0\" data-k=\"hdcp\">HDCP<\/span> failures on certain TVs.<\/li><\/ul>", "anim": ["flow", "Glass-to-glass latency budget", ["Sensor exposure", "ISP processing", "Scaler / composition", "H.264/H.265 encode", "Packetize (RTP) / or UVC", "Network / USB", "Decode + display"], ["~8-33 ms", "few ms", "few ms", "1 frame or less (no B-frames)", "slice-based helps", "jitter buffer", "receiver side"]], "q": [["A participant joins mid-call and sees gray for 5 s. Fix?", "Send an IDR (keyframe) on request (PLI/FIR) instead of waiting for the next periodic I-frame."], ["Image looks washed out on one TV only. Suspect?", "RGB quantization range mismatch (limited vs full) or YCbCr/RGB choice from EDID/AVI infoframe."]], "lab": null, "video": "v09-codecs-hdmi", "vdur": 324.3, "terms": ["codec", "iframe", "svc", "framework", "v4l2", "firmware", "isp", "hdmi", "soc", "driver", "drm", "edid", "i2c", "csi", "hdcp", "h264", "uvc"]}, {"id": "usb1", "t": "USB fundamentals: speeds, packets, endpoints, transfers, descriptors", "tag": "USB", "an": "USB is a strict classroom. The host is the teacher: nobody speaks unless asked. Each device has numbered mailboxes (<span class=\"chip\" tabindex=\"0\" data-k=\"endpoint\">endpoints<\/span>). Control mail is for paperwork, <span class=\"chip\" tabindex=\"0\" data-k=\"bulk\">bulk<\/span> for big parcels that can wait, <span class=\"chip\" tabindex=\"0\" data-k=\"irq\">interrupt<\/span> for small urgent notes checked on a schedule, <span class=\"chip\" tabindex=\"0\" data-k=\"isoc\">isochronous<\/span> for a live radio broadcast where late is as bad as lost.", "j": [["Host / device", "The host (PC, hub controller) starts every transaction; devices only answer."], ["Interface / alt setting", "A function (e.g. video streaming); alt settings let it switch bandwidth (alt0 = zero bandwidth)."], ["Microframe", "125 \u00b5s time slot in high-speed USB (8 per 1 ms frame)."]], "d": "<h4>Speeds<\/h4><p>Low 1.5 Mb/s, Full 12 Mb/s, High 480 Mb/s (USB 2.0), SuperSpeed 5 Gb/s, SuperSpeed+ 10/20 Gb/s (USB 3.x). USB 3 adds separate SuperSpeed wires and companion <span class=\"chip\" tabindex=\"0\" data-k=\"descriptor\">descriptors<\/span> (<code>bMaxBurst<\/code>, <code>Mult<\/code>).<\/p>\n<h4>Transfer types<\/h4><table><tr><th>Type<\/th><th>Guarantee<\/th><th>Conference device use<\/th><\/tr><tr><td>Control<\/td><td>reliable, EP0<\/td><td><span class=\"chip\" tabindex=\"0\" data-k=\"enum\">enumeration<\/span>, <span class=\"chip\" tabindex=\"0\" data-k=\"uvc\">UVC<\/span> controls (brightness, PTZ), <span class=\"chip\" tabindex=\"0\" data-k=\"uac\">UAC<\/span> volume<\/td><\/tr><tr><td>Bulk<\/td><td>reliable, leftover bandwidth<\/td><td><span class=\"chip\" tabindex=\"0\" data-k=\"cdc\">CDC<\/span> serial, mass storage, <span class=\"chip\" tabindex=\"0\" data-k=\"adb\">ADB<\/span>, <span class=\"chip\" tabindex=\"0\" data-k=\"mtp\">MTP<\/span>, sometimes UVC bulk mode<\/td><\/tr><tr><td>Interrupt<\/td><td>reliable, bounded latency<\/td><td><span class=\"chip\" tabindex=\"0\" data-k=\"hid\">HID<\/span> buttons, UVC status<\/td><\/tr><tr><td>Isochronous<\/td><td>reserved bandwidth, no retries<\/td><td>UVC video, UAC audio<\/td><\/tr><\/table>\n<h4>Bandwidth math (high-speed isoc)<\/h4><p><code>wMaxPacketSize<\/code> bits 0-10 = bytes per transaction (\u22641024), bits 11-12 = extra transactions per microframe. 1024 \u00d7 3 \u00d7 8000/s = 24.576 MB/s \u2248 196 Mb/s max for one HS isoc endpoint. A 1080p30 <span class=\"chip\" tabindex=\"0\" data-k=\"yuv\">YUY2<\/span> stream needs 1920\u00d71080\u00d72\u00d730 = 124 MB/s \u2192 impossible on USB 2 isoc, so conference cameras send MJPEG/<span class=\"chip\" tabindex=\"0\" data-k=\"h264\">H.264<\/span> over USB 2 or use USB 3.<\/p>\n<h4>Descriptor hierarchy<\/h4><p>Device \u2192 Configuration (wTotalLength covers everything below) \u2192 [IAD groups interfaces of one function] \u2192 Interface (alt settings) \u2192 class-specific descriptors \u2192 Endpoints. Lab 04 parses this exactly; in our <span class=\"chip\" tabindex=\"0\" data-k=\"qemu\">QEMU<\/span> run it parsed the real descriptors of the <span class=\"chip\" tabindex=\"0\" data-k=\"gadget\">gadget<\/span> from Lab 06.<\/p>", "anim": ["seq", "One high-speed microframe (125 \u00b5s)", ["Host", "Isoc EP (video)", "Interrupt EP (HID)", "Bulk EP (serial)"], [[0, 1, "IN token \u2192 1024 B"], [0, 1, "IN token \u2192 1024 B"], [0, 1, "IN token \u2192 1024 B (mult=3)"], [0, 2, "IN token (interval due) \u2192 NAK/data"], [0, 3, "IN \u2192 bulk fills leftover time"], [0, 0, "next microframe"]]], "q": [["Why does a USB 2 webcam send MJPEG for 1080p30?", "Uncompressed YUY2 1080p30 needs ~124 MB/s; one HS isoc endpoint maxes around 24.6 MB/s."], ["What does alt setting 0 with zero endpoints mean for UVC streaming?", "Zero bandwidth: the interface reserves nothing until the host selects a streaming alt setting."]], "lab": "04-usb-descriptor-parser", "video": "v10-usb-fundamentals", "vdur": 289.3, "terms": ["endpoint", "bulk", "irq", "isoc", "descriptor", "enum", "uvc", "uac", "cdc", "adb", "mtp", "hid", "yuv", "h264", "qemu", "gadget"]}, {"id": "usbenum", "t": "Enumeration and chapter 9 requests", "tag": "USB", "anim": ["seq", "USB enumeration, step by step", ["Host (xHCI + hub)", "Device (UDC + gadget)"], [[1, 0, "attach: D+ pull-up"], [0, 1, "bus reset; HS chirp"], [0, 1, "GET_DESCRIPTOR(DEVICE, 64) @ addr 0"], [1, 0, "18-byte device desc (bMaxPacketSize0)"], [0, 1, "SET_ADDRESS(7)"], [1, 0, "status ACK \u2192 now addr 7"], [0, 1, "GET_DESCRIPTOR(CONFIG, 9)"], [1, 0, "wTotalLength = 107"], [0, 1, "GET_DESCRIPTOR(CONFIG, 107)"], [0, 1, "GET_DESCRIPTOR(STRING ...)"], [0, 1, "SET_CONFIGURATION(1)"], [1, 0, "endpoints live; class drivers bind"]]], "an": "<span class=\"chip\" tabindex=\"0\" data-k=\"enum\">Enumeration<\/span> is a new employee's first morning: show up at the front desk (attach), get a temporary visitor badge (address 0), tell HR your basics (device <span class=\"chip\" tabindex=\"0\" data-k=\"descriptor\">descriptor<\/span>), receive an employee number (SET_ADDRESS), hand in the full r\u00e9sum\u00e9 (configuration), and get assigned to a team (SET_CONFIGURATION).", "j": [["Chapter 9", "The USB spec chapter defining standard requests and device states."]], "d": "<h4>Device states<\/h4><p>Attached \u2192 Powered \u2192 Default (addr 0 after reset) \u2192 Address \u2192 Configured (\u2192 Suspended when bus idles &gt;3 ms). Lab 05 simulates this and the retry path when SET_ADDRESS fails.<\/p>\n<h4>Reading host logs<\/h4><pre>usb 1-1: new high-speed USB device number 2 using xhci_hcd\nusb 1-1: device descriptor read/64, error -71     \u2190 -EPROTO: signal integrity / timing\nusb 1-1: device not accepting address 2, error -71\nusb 1-1: unable to enumerate USB device<\/pre>\n<p><b>-71 (EPROTO)<\/b> usually means electrical problems (cable, <span class=\"chip\" tabindex=\"0\" data-k=\"vbus\">VBUS<\/span>, <span class=\"chip\" tabindex=\"0\" data-k=\"phy\">PHY<\/span> tuning, missing ESD/termination), or device <span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">firmware<\/span> too slow to respond. <b>-110 (ETIMEDOUT)<\/b>: device stopped answering. <b>-32 (EPIPE)<\/b>: <span class=\"chip\" tabindex=\"0\" data-k=\"stall\">STALL<\/span>, often an unsupported request.<\/p>\n<h4>What the device side must get right<\/h4><ul><li>Answer EP0 within spec timing (status stage \u2264 50 ms for most requests, SET_ADDRESS settle 2 ms).<\/li><li>Return exactly wLength or less; a short packet ends the data stage.<\/li><li>wTotalLength must equal the real size; Windows is less forgiving than Linux.<\/li><li>Microsoft OS descriptors / BOS descriptor for USB 2.1+ and WinUSB auto-install.<\/li><li>Re-enumeration when switching functions (Android mode switch: unbind <span class=\"chip\" tabindex=\"0\" data-k=\"udc\">UDC<\/span>, change functions, rebind).<\/li><\/ul>\n<p><b>Windows check:<\/b> USBView and the Windows USB ETW trace; <b>macOS:<\/b> <code>ioreg -p IOUSB -l<\/code>. Conference devices must work on all three hosts: keep a host-matrix test.<\/p>", "q": [["dmesg shows 'device descriptor read/64, error -71'. First suspects?", "Electrical/PHY: cable, connector, VBUS, PHY tuning parameters, or the UDC not running yet when D+ is pulled up."], ["Why does the host read only 9 bytes of the config descriptor first?", "To learn wTotalLength, then request the full set in one read."]], "lab": "05-usb-enum-sim", "video": "v11-usb-enumeration", "vdur": 623.0, "terms": ["enum", "descriptor", "vbus", "phy", "firmware", "stall", "udc", "setup", "endpoint", "driver", "xhci", "gadget"]}, {"id": "usbclass", "t": "USB classes for conferencing: UVC, UAC, HID, CDC", "tag": "USB", "an": "Classes are standard job descriptions. If your device says 'I'm a <span class=\"chip\" tabindex=\"0\" data-k=\"uvc\">UVC<\/span> camera', every OS already has an employee handbook (built-in <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">driver<\/span>) for that role, so no custom driver install. That is why conference bars 'just work' when plugged into any laptop.", "j": [["Probe/Commit", "UVC negotiation where host and device agree on format, frame size, interval and max payload."]], "d": "<h4>UVC in depth<\/h4><ul><li><b>VideoControl interface<\/b>: units/terminals topology (Camera Terminal for PTZ/exposure, Processing Unit for brightness, Extension Units for vendor features like auto-framing).<\/li><li><b>VideoStreaming interface<\/b>: formats and frames; alt settings with different <span class=\"chip\" tabindex=\"0\" data-k=\"isoc\">isoc<\/span> packet sizes.<\/li><li><b>Probe/Commit<\/b>: host sends PROBE SET_CUR, device answers GET_CUR with <code>dwMaxPayloadTransferSize<\/code>, host COMMITs, then selects an alt setting that fits. Bugs here = 'camera opens but black'.<\/li><li><b>Payload header<\/b>: every packet begins with a 2-12 byte header: FID toggles per frame, EOF bit ends a frame, optional PTS/SCR timestamps (needed for A/V sync).<\/li><\/ul>\n<h4><span class=\"chip\" tabindex=\"0\" data-k=\"uac\">UAC<\/span><\/h4><p>UAC1 (full-speed era, works everywhere), UAC2 (high-speed, higher rates, clock entities), UAC3 (power saving, BADD). Choose sync type: async with feedback EP is best for a device with its own crystal. Volume/mute controls via Feature Unit.<\/p>\n<h4><span class=\"chip\" tabindex=\"0\" data-k=\"hid\">HID<\/span> for conferencing<\/h4><p>Teams/Zoom certification needs Telephony page (0x0B) controls: hook switch, phone mute, LEDs (host \u2192 device output reports) so the device mute light follows the app. Report <span class=\"chip\" tabindex=\"0\" data-k=\"descriptor\">descriptor<\/span> mistakes = buttons ignored on one OS.<\/p>\n<h4><span class=\"chip\" tabindex=\"0\" data-k=\"composite\">Composite<\/span> devices<\/h4><p>Combine functions with IADs (device class 0xEF/0x02/0x01). Order interfaces carefully; changing interface numbers between <span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">firmware<\/span> versions breaks Windows' cached drivers (it caches by VID/PID/bcdDevice/interface number). Bump bcdDevice when descriptors change.<\/p>", "anim": ["seq", "UVC probe/commit then streaming", ["Host uvcvideo", "Device UVC function", "Userspace UVC app"], [[0, 1, "SET_CUR PROBE (format, frame, interval)"], [1, 2, "event: setup request"], [2, 1, "fill probe struct (maxPayload)"], [0, 1, "GET_CUR PROBE"], [0, 1, "SET_CUR COMMIT"], [0, 1, "SET_INTERFACE alt=1 (bandwidth)"], [1, 2, "STREAMON event"], [2, 1, "queue frames (V4L2 output)"], [1, 0, "isoc payloads: header FID/EOF + data"]]], "q": [["Camera enumerates but app shows black. What part of UVC to inspect first?", "Probe/commit values (maxPayload vs chosen alt), whether the gadget app queued frames after STREAMON, payload header FID/EOF bits."], ["After a firmware update, Windows shows the camera with a yellow bang. Likely cause?", "Descriptors changed without bumping bcdDevice/PID; Windows applied a cached driver config to the new layout."]], "lab": null, "video": "v12-usb-classes", "vdur": 340.0, "terms": ["uvc", "driver", "isoc", "uac", "hid", "descriptor", "composite", "firmware", "yuv", "h264", "cdc", "enum", "gadget", "probe", "userspace", "v4l2"]}, {"id": "gadget", "t": "Linux USB gadget stack: UDC, composite, configfs, FunctionFS, Android USB HAL", "tag": "USB", "an": "<span class=\"chip\" tabindex=\"0\" data-k=\"configfs\">configfs<\/span> is a LEGO baseplate. Each USB function (camera, mic, serial, buttons) is a brick. You stack the bricks into a configuration and then 'plug the baseplate into the wall' by writing the controller name into the <span class=\"chip\" tabindex=\"0\" data-k=\"udc\">UDC<\/span> file. Unplug = write empty string.", "j": [["libcomposite", "Kernel library that combines several functions into one device."], ["dummy_hcd", "A virtual host+device controller pair in software, for testing gadgets on one PC."]], "d": "<h4>Stack layers<\/h4><p>UDC <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">driver<\/span> (dwc3, chipidea, cdns3) \u2192 <code>udc-core<\/code> \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"composite\">composite<\/span> (<code>libcomposite<\/code>) \u2192 function drivers (<code>usb_f_uvc, usb_f_uac2, usb_f_hid, usb_f_acm, usb_f_ncm, usb_f_fs<\/code>) \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"userspace\">userspace<\/span> (<span class=\"chip\" tabindex=\"0\" data-k=\"uvc\">UVC<\/span> streaming app, adbd, mtp) \u2192 Android USB <span class=\"chip\" tabindex=\"0\" data-k=\"hal\">HAL<\/span> (<code>android.hardware.usb.gadget<\/code>) and <span class=\"chip\" tabindex=\"0\" data-k=\"init\">init<\/span> scripts that write configfs.<\/p>\n<h4>Lab 06, verified<\/h4><p>On a stock Debian 6.12 <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span> in <span class=\"chip\" tabindex=\"0\" data-k=\"qemu\">QEMU<\/span>, the script created a composite <span class=\"chip\" tabindex=\"0\" data-k=\"gadget\">gadget<\/span> and bound it to dummy_hcd; the host side <span class=\"chip\" tabindex=\"0\" data-k=\"enum\">enumerated<\/span> it: <code>cdc_acm 1-1:1.0: ttyACM0<\/code>, <code>hid-generic ... USB HID v1.01 Device [Lab Corp Lab Conference Cam]<\/code>. UVC + <span class=\"chip\" tabindex=\"0\" data-k=\"uac\">UAC2<\/span> failed to bind with -EINVAL because <b>dummy_hcd has no <span class=\"chip\" tabindex=\"0\" data-k=\"isoc\">isochronous<\/span> support<\/b>: a real lesson. Test isoc functions on a real board (<span class=\"chip\" tabindex=\"0\" data-k=\"dwc3\">DWC3<\/span>) or with a USB analyzer.<\/p>\n<h4>UVC gadget specifics<\/h4><p><code>usb_f_uvc<\/code> creates a <span class=\"chip\" tabindex=\"0\" data-k=\"v4l2\">V4L2<\/span> <i>output<\/i> device on the gadget side; a userspace app (e.g. the open-source uvc-gadget / libcamera uvc-gadget, or your product's daemon) handles UVC events (<span class=\"chip\" tabindex=\"0\" data-k=\"probe\">probe<\/span>/commit, STREAMON) and queues frames from the <span class=\"chip\" tabindex=\"0\" data-k=\"isp\">ISP<\/span>/encoder. Tune <code>streaming_maxpacket<\/code>, <code>streaming_maxburst<\/code> (USB 3), <code>streaming_interval<\/code>.<\/p>\n<h4>Android<\/h4><ul><li>The <span class=\"chip\" tabindex=\"0\" data-k=\"framework\">framework<\/span> sets <code>sys.usb.config<\/code>/calls the USB gadget HAL (<code>setCurrentUsbFunctions<\/code>); vendor init .rc files or the HAL write configfs.<\/li><li><span class=\"chip\" tabindex=\"0\" data-k=\"adb\">ADB<\/span> and <span class=\"chip\" tabindex=\"0\" data-k=\"mtp\">MTP<\/span> are <span class=\"chip\" tabindex=\"0\" data-k=\"functionfs\">FunctionFS<\/span> functions served by adbd/MtpServer.<\/li><li>Typec HAL (<code>android.hardware.usb<\/code>) reports port roles and handles role swap.<\/li><\/ul>\n<h4>DWC3 debugging<\/h4><p><code>/sys/kernel/debug/usb/&lt;dwc3&gt;/<\/code> has regdump, link_state, ep queues; enable tracepoints: <code>echo 1 &gt; /sys/kernel/tracing/events/dwc3/enable<\/code> then read <code>trace<\/code> to see every ep0 request and TRB completion.<\/p>", "anim": ["flow", "configfs gadget build (Lab 06)", ["mkdir usb_gadget/polydemo", "write idVendor/idProduct/strings", "mkdir configs/c.1", "mkdir functions/uvc.0 uac2.0 acm.0 hid.0", "ln -s functions \u2192 configs/c.1", "echo dummy_udc.0 > UDC", "host enumerates"], ["gadget object created", "device descriptor values", "configuration + MaxPower", "function instances", "compose the configuration", "bind = D+ pull-up", "ttyACM0 + hidraw0 appear"]], "q": [["Gadget bind fails with -22 on dummy_hcd only when UVC is included. Why?", "dummy_hcd doesn't support isochronous endpoints; UVC/UAC2 need isoc. Use a real UDC."], ["How does Android expose ADB over the same port as your camera function?", "adbd implements ADB in userspace through FunctionFS (ffs.adb), linked into the same composite configuration."]], "lab": "06-configfs-uvc-uac-gadget", "video": "v13-usb-gadget", "vdur": 524.6, "terms": ["configfs", "udc", "driver", "composite", "userspace", "uvc", "hal", "init", "kernel", "qemu", "gadget", "enum", "uac", "isoc", "dwc3", "v4l2", "probe", "isp", "framework", "adb", "mtp", "functionfs", "soc", "endpoint", "descriptor"]}, {"id": "usbdbg", "t": "USB host side, Type-C/PD, DFU, and USB debugging", "tag": "USB", "an": "Debugging USB without a capture is like debugging a phone call by only hearing one side. <span class=\"chip\" tabindex=\"0\" data-k=\"usbmon\">usbmon<\/span>/Wireshark lets you hear the host's side; a hardware analyzer (Beagle, Ellisys, Total Phase) is a wiretap on the cable that hears both sides plus the electrical layer.", "j": [["Type-C / PD", "USB-C connector and Power Delivery protocol over the CC wire: negotiates voltage/current, data roles and alternate modes."]], "d": "<h4>Capture workflow (host PC)<\/h4><pre>sudo modprobe usbmon\nlsusb -t                     # find bus number\nsudo wireshark -i usbmon1    # or: sudo tshark -i usbmon1 -w cam.pcapng\n# filters: usb.device_address==7 ; usb.setup.bRequest==6 ; usb.transfer_type==0x00 (isoc)<\/pre>\n<p>Windows: USBPcap + Wireshark. For <span class=\"chip\" tabindex=\"0\" data-k=\"isoc\">isoc<\/span> video problems (dropped frames, short packets, FID errors), a hardware analyzer is worth it: usbmon sees URBs, not wire-level retries, chirps or link power states.<\/p>\n<h4>Common failures and first moves<\/h4><table><tr><th>Symptom<\/th><th>Check<\/th><\/tr><tr><td><span class=\"chip\" tabindex=\"0\" data-k=\"enum\">Enumeration<\/span> -71<\/td><td><span class=\"chip\" tabindex=\"0\" data-k=\"phy\">PHY<\/span> tuning, cable, <span class=\"chip\" tabindex=\"0\" data-k=\"vbus\">VBUS<\/span>, eye diagram, D+ pull-up timing<\/td><\/tr><tr><td>Works on Linux, not Windows<\/td><td>wTotalLength, string <span class=\"chip\" tabindex=\"0\" data-k=\"descriptor\">descriptors<\/span>, BOS/MS OS descriptors, bcdDevice caching<\/td><\/tr><tr><td>Video stutters on some laptops<\/td><td>isoc bandwidth contention with other devices on same <span class=\"chip\" tabindex=\"0\" data-k=\"xhci\">xHCI<\/span>, alt setting too large, <span class=\"chip\" tabindex=\"0\" data-k=\"lpm\">LPM<\/span> (U1/U2) exit latency<\/td><\/tr><tr><td>Device drops after <span class=\"chip\" tabindex=\"0\" data-k=\"pm\">suspend<\/span><\/td><td>remote wakeup, VBUS session, PM runtime in <span class=\"chip\" tabindex=\"0\" data-k=\"udc\">UDC<\/span> <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">driver<\/span><\/td><\/tr><tr><td>Charging but no data on USB-C<\/td><td><span class=\"chip\" tabindex=\"0\" data-k=\"cc\">CC<\/span> orientation mux, role (<span class=\"chip\" tabindex=\"0\" data-k=\"drd\">DRD<\/span>) state, <span class=\"chip\" tabindex=\"0\" data-k=\"pd\">PD<\/span> contract, <span class=\"chip\" tabindex=\"0\" data-k=\"typec\">Type-C<\/span> <span class=\"chip\" tabindex=\"0\" data-k=\"hal\">HAL<\/span><\/td><\/tr><\/table>\n<h4>Type-C and PD<\/h4><p>CC pins detect attach and orientation; the PD controller (often TI TPS65xx, or <span class=\"chip\" tabindex=\"0\" data-k=\"soc\">SoC<\/span>-integrated) negotiates power and data role and DisplayPort alt mode. Linux: <code>typec<\/code> class (<code>/sys/class/typec<\/code>), <code>tcpm<\/code> for TCPCI chips, <code>ucsi<\/code> for <span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">firmware<\/span>-managed controllers. Data role swap = UDC unbind \u2194 xHCI start in the DRD driver.<\/p>\n<h4><span class=\"chip\" tabindex=\"0\" data-k=\"dfu\">DFU<\/span> and firmware delivery<\/h4><p>DFU 1.1: DFU_DNLOAD blocks \u2192 GET_STATUS polling \u2192 manifest \u2192 reset. Many products use vendor <span class=\"chip\" tabindex=\"0\" data-k=\"hid\">HID<\/span> or <span class=\"chip\" tabindex=\"0\" data-k=\"bulk\">bulk<\/span> protocols instead; whichever, enforce: signed images, version/anti-rollback, <span class=\"chip\" tabindex=\"0\" data-k=\"ab\">A/B<\/span> or fallback, power-loss safety, and resumable transfers (Lab 09). On Linux hosts test with <code>dfu-util -l<\/code>, <code>dfu-util -D fw.bin<\/code>.<\/p>", "anim": ["seq", "USB-C attach and role decision", ["Laptop (DFP)", "CC / PD controller", "Device SoC (DRD)"], [[0, 1, "Rp on CC: I am a source/host"], [1, 1, "detect orientation (CC1/CC2), set mux"], [1, 0, "PD: request 20V/3A contract"], [1, 2, "role = device (UFP)"], [2, 2, "DRD switches to gadget, start UDC"], [2, 0, "D+ pull-up \u2192 enumeration"], [1, 0, "optional: DP alt mode enter"]]], "q": [["usbmon shows URBs complete fine but the analyzer shows many retries. Why does usbmon not show them?", "usbmon sits at the URB level in the host driver; link-level retries and PHY events happen below it."], ["Why bump bcdDevice when descriptors change?", "Windows caches device configuration by VID/PID/bcdDevice; a new value forces fresh enumeration handling."]], "lab": null, "video": "v14-usb-debug-typec", "vdur": 426.1, "terms": ["usbmon", "isoc", "enum", "phy", "vbus", "descriptor", "xhci", "lpm", "pm", "udc", "driver", "cc", "drd", "pd", "typec", "hal", "soc", "firmware", "dfu", "hid", "bulk", "ab", "kernel", "altmode", "urb", "gadget"]}, {"id": "android", "t": "Android below the framework: AOSP, Treble, HALs, init, SELinux, GKI", "tag": "Android", "an": "<span class=\"chip\" tabindex=\"0\" data-k=\"treble\">Treble<\/span> is like a building with a fixed electrical panel. Google can replace the apartment (Android <span class=\"chip\" tabindex=\"0\" data-k=\"framework\">framework<\/span>) without rewiring the walls (vendor <span class=\"chip\" tabindex=\"0\" data-k=\"hal\">HALs<\/span> and <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">drivers<\/span>), as long as both sides use the standard plugs (versioned HAL interfaces).", "j": [["init.rc", "Android init's script language: services, triggers, properties."]], "d": "<h4>Partitions<\/h4><p><code>boot<\/code> (<span class=\"chip\" tabindex=\"0\" data-k=\"gki\">GKI<\/span> <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span> + generic ramdisk), <code>init_boot<\/code>, <code>vendor_boot<\/code> (vendor ramdisk, <span class=\"chip\" tabindex=\"0\" data-k=\"dtb\">DTB<\/span>, vendor modules for first stage), <code>system<\/code>, <code>system_ext<\/code>, <code>product<\/code>, <code>vendor<\/code>, <code>odm<\/code>, <code>vendor_dlkm<\/code> (vendor <span class=\"chip\" tabindex=\"0\" data-k=\"module\">kernel modules<\/span>), <code>vbmeta<\/code>. With <span class=\"chip\" tabindex=\"0\" data-k=\"ab\">A/B<\/span>, each has _a/_b.<\/p>\n<h4>Boot<\/h4><p><span class=\"chip\" tabindex=\"0\" data-k=\"bootloader\">Bootloader<\/span> \u2192 kernel \u2192 first-stage <span class=\"chip\" tabindex=\"0\" data-k=\"init\">init<\/span> (mounts, loads vendor_boot modules) \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"selinux\">SELinux<\/span> policy load \u2192 second-stage init parses <code>/system/etc/init<\/code>, <code>/vendor/etc/init/*.rc<\/code> \u2192 servicemanager, hwservicemanager \u2192 HAL services (class hal) \u2192 zygote \u2192 system_server.<\/p>\n<h4>Writing a vendor HAL (Lab 11 files)<\/h4><ul><li>Define <code>IUsbCamControl.aidl<\/code> with <code>@VintfStability<\/code>; Soong <code>aidl_interface<\/code> with ndk backend; freeze versions (<code>m vendor.poly.usbcam-update-api<\/code>, <code>-freeze-api<\/code>).<\/li><li>Implement the service in C++ (NDK backend, <code>AServiceManager_addService<\/code>), add to <span class=\"chip\" tabindex=\"0\" data-k=\"vintf\">VINTF<\/span> manifest fragment.<\/li><li>init .rc fragment to start it, file_contexts + .te policy so it can run and touch <span class=\"chip\" tabindex=\"0\" data-k=\"configfs\">configfs<\/span>.<\/li><\/ul>\n<h4>SELinux workflow<\/h4><p><code>adb logcat | grep avc<\/code> or <code>dmesg | grep avc<\/code> \u2192 understand each denial \u2192 add the narrowest rule \u2192 never ship permissive. <code>audit2allow<\/code> is a starting point, not an answer; neverallow rules (<span class=\"chip\" tabindex=\"0\" data-k=\"cts\">CTS<\/span>/VTS) will reject broad grants.<\/p>\n<h4>GKI rules<\/h4><p>No vendor changes to the core kernel image; your drivers become modules using the stable KMI symbol list. If you need a new exported symbol, it must be requested upstream to Android Common Kernel. Plan for this when porting vendor <span class=\"chip\" tabindex=\"0\" data-k=\"bsp\">BSP<\/span> drivers.<\/p>\n<h4>Daily commands<\/h4><pre>adb shell getprop | grep usb ; adb shell dumpsys usb ; adb shell lshal / service list\nadb shell cat /proc/cmdline ; adb shell dmesg -w ; adb logcat -b all\nm -j vendorimage ; fastboot flash vendor_a vendor.img ; adb remount (userdebug)<\/pre>", "anim": ["flow", "Android boot path", ["Bootloader (ABL) + AVB", "Kernel (GKI) + vendor_boot modules", "First-stage init: mount, load modules", "SELinux policy loaded", "Second-stage init: *.rc", "servicemanager + vendor HALs", "zygote \u2192 system_server \u2192 apps"], ["verifies vbmeta", "generic kernel, vendor .ko", "/vendor, /system mounted", "enforcing", "on early-init / init / boot triggers", "your IUsbCamControl starts", "framework calls your HAL"]], "q": [["Your HAL starts but can't write configfs. Log shows 'avc: denied { write }'. Fix?", "Add a narrow allow for the HAL domain on configfs files/dirs in vendor sepolicy; don't make the domain permissive."], ["Why can't you just patch the GKI kernel for a vendor driver?", "GKI must stay generic; vendor code must be modules against the stable KMI, upstreamed to ACK if core changes are needed."]], "lab": "11-android-hal-init-sepolicy", "video": "v15-android-platform", "vdur": 349.9, "terms": ["treble", "framework", "hal", "driver", "gki", "kernel", "dtb", "module", "ab", "bootloader", "init", "selinux", "vintf", "configfs", "cts", "bsp", "aosp", "aidl", "hidl", "uboot", "avb"]}, {"id": "rtos", "t": "MCU and RTOS firmware, TinyUSB, bare-metal", "tag": "MCU", "an": "An <span class=\"chip\" tabindex=\"0\" data-k=\"rtos\">RTOS<\/span> is an ER triage nurse: every tick, the most urgent ready patient is seen. Priority inversion is when the heart-attack patient waits because a sprained-ankle patient holds the only stretcher and the flu patient keeps getting seen instead.", "j": [["Priority inheritance", "Temporarily raising a low task holding a mutex to the waiter's priority."], ["Watchdog", "A timer that resets the chip unless software 'kicks' it regularly."], ["Linker script", "Says where code/data go in flash and RAM."]], "d": "<h4>Where <span class=\"chip\" tabindex=\"0\" data-k=\"mcu\">MCUs<\/span> appear in conferencing gear<\/h4><p>Mic pods, touch controllers, <span class=\"chip\" tabindex=\"0\" data-k=\"pd\">PD<\/span> controllers, camera motor/PTZ, power sequencing, LED rings. Many have their own USB stack (<span class=\"chip\" tabindex=\"0\" data-k=\"tinyusb\">TinyUSB<\/span>, vendor stacks) and their own <span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">firmware<\/span> update path driven by the main <span class=\"chip\" tabindex=\"0\" data-k=\"soc\">SoC<\/span>.<\/p>\n<h4>RTOS essentials<\/h4><ul><li><span class=\"chip\" tabindex=\"0\" data-k=\"isr\">ISR<\/span> \u2192 queue/semaphore \u2192 task; never block in ISRs (use <code>xQueueSendFromISR<\/code> and yield).<\/li><li><span class=\"chip\" tabindex=\"0\" data-k=\"spinlock\">Mutex<\/span> (with inheritance) for shared resources; binary semaphore for signaling. Lab 10 shows inversion: HIGH finishes at tick 11 without inheritance, tick 5 with it.<\/li><li>Stack sizing (<code>uxTaskGetStackHighWaterMark<\/code>), heap fragmentation, watchdog per task health.<\/li><\/ul>\n<h4>TinyUSB<\/h4><p>Callbacks: <code>tud_descriptor_device_cb<\/code>, <code>tud_descriptor_configuration_cb<\/code>, class callbacks (<code>tud_hid_set_report_cb<\/code>, <code>tud_audio_*<\/code>), and call <code>tud_task()<\/code> from a task/main loop; the DCD port runs in the USB ISR. TinyUSB examples build for many boards; to run without hardware, build the host-side unit tests (Ceedling) or use its examples under a simulator. (Not run on our box.)<\/p>\n<h4>Bare-metal bring-up<\/h4><p>Reset vector \u2192 copy .data, zero .bss \u2192 clocks \u2192 <code>main<\/code>. Debug with <span class=\"chip\" tabindex=\"0\" data-k=\"jtag\">SWD<\/span>/JTAG (OpenOCD + gdb), check hardfault registers (CFSR, HFSR, MMFAR, BFAR on Cortex-M) to find the faulting address.<\/p>", "anim": ["seq", "Priority inversion vs inheritance", ["LOW (holds mutex)", "MED", "HIGH (USB task)"], [[0, 0, "LOW takes mutex"], [2, 0, "HIGH wants mutex \u2192 blocks"], [1, 1, "no inheritance: MED preempts LOW, runs long"], [2, 2, "HIGH stuck (inversion)"], [0, 0, "with inheritance: LOW boosted to HIGH"], [0, 2, "LOW releases mutex"], [2, 2, "HIGH runs immediately"]]], "q": [["What famous mission had a priority inversion bug?", "Mars Pathfinder (1997): fixed remotely by enabling priority inheritance on a VxWorks mutex."], ["Cortex-M hard fault: which registers tell you the bad address?", "CFSR flags plus MMFAR (memory manage) or BFAR (bus fault) when their valid bits are set; stacked PC tells the instruction."]], "lab": "10-rtos-scheduler-sim", "video": "v16-rtos-tinyusb", "vdur": 293.5, "terms": ["rtos", "mcu", "pd", "tinyusb", "firmware", "soc", "isr", "spinlock", "jtag"]}, {"id": "debug", "t": "Debugging toolbox: JTAG, gdb, ftrace, perf, oops decoding", "tag": "Debug", "an": "Debugging is detective work. dmesg is the witness statement, <span class=\"chip\" tabindex=\"0\" data-k=\"ftrace\">ftrace<\/span> is the CCTV timeline, perf is the traffic counter, <span class=\"chip\" tabindex=\"0\" data-k=\"jtag\">JTAG<\/span> is freezing time and walking around the crime scene, and an <span class=\"chip\" tabindex=\"0\" data-k=\"oops\">oops<\/span> is the chalk outline telling you exactly where it happened.", "j": [["Oops", "A kernel error report with registers and call trace; may or may not panic."], ["perf", "Sampling profiler for CPU hotspots and events."], ["addr2line / faddr2line", "Turn a function+offset into a source line."]], "d": "<h4>Decode the sample oops (Lab 12)<\/h4><ol><li><b>Type<\/b>: NULL pointer dereference at virtual address 0x18 \u2192 a field at offset 0x18 of a NULL struct pointer.<\/li><li><b>Where<\/b>: <code>pc : polybridge_hpd_work+0x3c/0x120 [polybridge]<\/code>, in a <span class=\"chip\" tabindex=\"0\" data-k=\"workqueue\">workqueue<\/span> (<code>Workqueue: events polybridge_hpd_work<\/code>).<\/li><li><b>Line<\/b>: <code>./scripts/faddr2line polybridge.ko polybridge_hpd_work+0x3c<\/code> (needs the <span class=\"chip\" tabindex=\"0\" data-k=\"module\">.ko<\/span> with debug info), or <code>gdb polybridge.ko -ex 'list *(polybridge_hpd_work+0x3c)'<\/code>.<\/li><li><b>Theory<\/b>: the work ran after remove()/before <span class=\"chip\" tabindex=\"0\" data-k=\"probe\">probe<\/span> finished set a pointer (e.g. <code>bridge-&gt;connector<\/code>). Fix by cancel_work_sync in remove and only scheduling after <span class=\"chip\" tabindex=\"0\" data-k=\"init\">init<\/span> completes.<\/li><li><b>Tainted: O<\/b> means out-of-tree module loaded: expected for vendor <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">drivers<\/span>, but note it in bug reports.<\/li><\/ol>\n<h4>ftrace recipes<\/h4><pre>cd /sys/kernel/tracing\necho function_graph > current_tracer; echo 'dwc3_*' > set_ftrace_filter; echo 1 > tracing_on\necho 1 > events/irq/enable ; echo 1 > events/v4l2/enable ; cat trace_pipe\ntrace-cmd record -e dwc3 -e xhci-hcd -p function_graph -g uvc_v4l2_qbuf<\/pre>\n<h4>perf<\/h4><p><code>perf top<\/code>, <code>perf record -g -a sleep 10; perf report<\/code> for CPU hogs (e.g. memcpy in a <span class=\"chip\" tabindex=\"0\" data-k=\"uvc\">UVC<\/span> path \u2192 use <span class=\"chip\" tabindex=\"0\" data-k=\"dma\">dma-buf<\/span>). <code>perf sched latency<\/code> for scheduling delays in audio threads.<\/p>\n<h4>Other weapons<\/h4><ul><li><code>dynamic_debug<\/code>: <code>echo 'module dwc3 +p' &gt; /sys/kernel/debug/dynamic_debug/control<\/code>.<\/li><li><span class=\"chip\" tabindex=\"0\" data-k=\"sanit\">KASAN<\/span>/KCSAN/lockdep debug builds; <code>kmemleak<\/code>.<\/li><li>pstore/ramoops to keep logs across reboots; kdump on larger systems.<\/li><li>JTAG (Lauterbach TRACE32, OpenOCD) for hangs before console and for multi-core lockups.<\/li><li>Android: <code>bugreport<\/code>, tombstones (<code>/data/tombstones<\/code>) for native crashes, <code>simpleperf<\/code>, Perfetto traces.<\/li><\/ul>", "anim": ["flow", "Reading an oops", ["'Unable to handle NULL pointer at 0x18'", "ESR / Mem abort info", "Modules linked in / Tainted", "pc: function+offset [module]", "Call trace (workqueue)", "faddr2line \u2192 source line", "Root cause + fix + regression test"], ["what: NULL->field@0x18", "data abort, EL1", "which out-of-tree code was loaded", "where exactly", "how we got there", "exact line", "cancel_work_sync in remove()"]], "q": [["NULL deref 'at virtual address 0x18' means?", "Code read a member at offset 0x18 through a NULL struct pointer."], ["Which tool shows every DWC3 ep0 request and TRB completion?", "The dwc3 tracepoints in ftrace (events/dwc3)."]], "lab": "12-oops-decoding", "video": "v17-debugging-oops", "vdur": 318.1, "terms": ["ftrace", "jtag", "oops", "workqueue", "module", "probe", "init", "driver", "uvc", "dma", "sanit", "kernel", "dwc3"]}, {"id": "pm", "t": "Power management, networking, Wi-Fi/BT and security", "tag": "Platform", "an": "Power management is turning off lights in empty rooms without plunging a busy room into darkness. Security is locks on every door, including the side door (debug ports) the builders used.", "j": [["System suspend", "Whole-system sleep (suspend-to-RAM)."], ["USB LPM / U1/U2", "USB link power states; exit latency can glitch isoc streams."], ["cfg80211/mac80211", "Linux Wi-Fi frameworks; BlueZ (Linux) / Fluoride-Gabeldorsche (Android) for Bluetooth."]], "d": "<h4>Power<\/h4><ul><li>Implement <code>runtime_suspend/resume<\/code> and system <code>suspend/resume<\/code> in <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">drivers<\/span>; balance <code>pm_runtime_get_sync/put<\/code> (unbalanced counts keep devices awake or off).<\/li><li>Debug: <code>/sys/kernel/debug/wakeup_sources<\/code>, <code>/sys/power/pm_test<\/code>, <code>no_console_suspend<\/code>, <code>cat /sys/devices/.../power/runtime_status<\/code>.<\/li><li>USB: selective <span class=\"chip\" tabindex=\"0\" data-k=\"pm\">suspend<\/span>, remote wakeup for button press, <span class=\"chip\" tabindex=\"0\" data-k=\"lpm\">LPM<\/span> disable quirks when streams glitch.<\/li><\/ul>\n<h4>Networking / <span class=\"chip\" tabindex=\"0\" data-k=\"wifi\">Wi-Fi<\/span> / BT<\/h4><p>Conferencing devices are network appliances: know <code>ip<\/code>, <code>ethtool<\/code>, <code>tcpdump<\/code>, <span class=\"chip\" tabindex=\"0\" data-k=\"qos\">QoS<\/span>/DSCP marking for RTP, VLANs, 802.1X for enterprise networks, <code>iw<\/code>/<code>wpa_supplicant<\/code>, Wi-Fi <span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">firmware<\/span> load paths (<code>/lib/firmware<\/code>), BT HCI over <span class=\"chip\" tabindex=\"0\" data-k=\"uart\">UART<\/span>/USB (<code>btmon<\/code> to capture). BT audio (HFP/A2DP/LE Audio) for headsets paired to room systems.<\/p>\n<h4>Security<\/h4><ul><li>Lock <span class=\"chip\" tabindex=\"0\" data-k=\"jtag\">JTAG<\/span>/UART in production (fuses, auth debug), disable <span class=\"chip\" tabindex=\"0\" data-k=\"adb\">adb<\/span> in user builds.<\/li><li>Parse every USB/<span class=\"chip\" tabindex=\"0\" data-k=\"hdmi\">HDMI<\/span>/network input as hostile: <span class=\"chip\" tabindex=\"0\" data-k=\"descriptor\">descriptor<\/span> lengths, <span class=\"chip\" tabindex=\"0\" data-k=\"edid\">EDID<\/span> blocks, <span class=\"chip\" tabindex=\"0\" data-k=\"hid\">HID<\/span> reports (fuzz them: syzkaller has USB fuzzing via raw-<span class=\"chip\" tabindex=\"0\" data-k=\"gadget\">gadget<\/span>).<\/li><li>Secrets in <span class=\"chip\" tabindex=\"0\" data-k=\"tee\">TEE<\/span>/keystore, not files. Signed updates, verified boot, <span class=\"chip\" tabindex=\"0\" data-k=\"avb\">dm-verity<\/span>, <span class=\"chip\" tabindex=\"0\" data-k=\"selinux\">SELinux<\/span> enforcing.<\/li><li><span class=\"chip\" tabindex=\"0\" data-k=\"sbom\">SBOM<\/span> + CVE tracking for <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span> and vendor <span class=\"chip\" tabindex=\"0\" data-k=\"bsp\">BSP<\/span>; plan monthly security patch merges.<\/li><\/ul>", "anim": ["flow", "Runtime PM of a camera sensor", ["App opens /dev/video0", "pm_runtime_get_sync()", "resume: regulators on, clocks, reset release", "stream", "app closes", "pm_runtime_put_autosuspend()", "suspend after delay: clocks/regulators off"], ["usage count 1", "driver callback", "power sequence from datasheet", "usage>0 keeps it on", "usage count 0", "autosuspend timer", "saves power, avoids flapping"]], "q": [["Video stutters only when nothing else is plugged into the laptop. Hypothesis?", "USB link power management (U1/U2/LPM) kicking in between transfers; exit latency hurts isoc. Test with LPM disabled."], ["Why fuzz USB descriptors and EDID parsing?", "They come from untrusted external devices; malformed input is a classic memory-corruption attack path."]], "lab": null, "video": "v18-power-net-security", "vdur": 347.7, "terms": ["driver", "pm", "lpm", "wifi", "qos", "firmware", "uart", "jtag", "adb", "hdmi", "descriptor", "edid", "hid", "gadget", "tee", "avb", "selinux", "sbom", "kernel", "bsp", "isoc"]}, {"id": "ota", "t": "OTA/DFU updates, testing and CI for firmware", "tag": "Quality", "an": "Updating <span class=\"chip\" tabindex=\"0\" data-k=\"firmware\">firmware<\/span> in the field is replacing an airplane engine mid-flight: you keep one good engine running (slot A), install the new one (slot B), test it, and if it coughs you switch back automatically.", "j": [["HIL", "Hardware-in-the-loop: automated tests on real boards in a rack."], ["VTS/CTS", "Android Vendor/Compatibility Test Suites."], ["KUnit / kselftest", "Kernel unit tests and self tests."], ["Bisect", "Binary search through commits to find which one broke something."]], "d": "<h4>Update design checklist (Lab 09 demonstrates)<\/h4><ul><li>Verify integrity (CRC/hash) and authenticity (signature) before switching.<\/li><li>Anti-rollback version check.<\/li><li>Boot counter + watchdog \u2192 automatic fallback; mark 'successful' only after health checks (Android: <code>update_engine<\/code> + <code>bootctrl<\/code> <span class=\"chip\" tabindex=\"0\" data-k=\"hal\">HAL<\/span> markBootSuccessful).<\/li><li>Accessory firmware (<span class=\"chip\" tabindex=\"0\" data-k=\"mcu\">MCU<\/span>, <span class=\"chip\" tabindex=\"0\" data-k=\"pd\">PD<\/span> controller, camera module) updated from the main <span class=\"chip\" tabindex=\"0\" data-k=\"soc\">SoC<\/span> with the same guarantees, and version compatibility matrix.<\/li><li>Power-loss testing: cut power at every stage in <span class=\"chip\" tabindex=\"0\" data-k=\"ci\">HIL<\/span>.<\/li><\/ul>\n<h4>Testing strategy (a senior deliverable)<\/h4><ol><li><b>Unit<\/b>: host-built C/C++ logic with sanitizers (like Labs 04/05/08/09/10). KUnit for <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span> helpers.<\/li><li><b>Virtual<\/b>: <span class=\"chip\" tabindex=\"0\" data-k=\"qemu\">QEMU<\/span> runs (our Lab 00 harness), dummy_hcd <span class=\"chip\" tabindex=\"0\" data-k=\"gadget\">gadget<\/span> tests, vivid camera tests, v4l2-compliance.<\/li><li><b>HIL rack<\/b>: real devices + USB switch hubs (e.g. programmable), <span class=\"chip\" tabindex=\"0\" data-k=\"hdmi\">HDMI<\/span> generators/analyzers, power relays; nightly <span class=\"chip\" tabindex=\"0\" data-k=\"enum\">enumerate<\/span>-1000-times tests on Windows/macOS/Linux hosts.<\/li><li><b>Certification<\/b>: Teams/Zoom device certification, USB-IF compliance (USB3CV, C
