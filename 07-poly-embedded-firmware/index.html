hapter 9 tests), Android <span class=\"chip\" tabindex=\"0\" data-k=\"cts\">CTS<\/span>/VTS for GMS builds.<\/li><li><b>Field telemetry<\/b>: crash/<span class=\"chip\" tabindex=\"0\" data-k=\"oops\">oops<\/span> collection, enumeration failures, frame-drop counters.<\/li><\/ol>\n<h4>CI<\/h4><p>Every merge: build all products, run unit + QEMU tests, static analysis, checkpatch; nightly: HIL. Keep flaky-test dashboards; flakes hide real regressions. Use <code>git bisect run<\/code> with an automated test to find regressions fast.<\/p>", "anim": ["seq", "A/B update with automatic rollback", ["Update agent", "Bootloader", "Slot A (good)", "Slot B (new)"], [[0, 3, "write image to inactive B"], [0, 3, "verify hash + signature + version"], [0, 1, "set B active, tries=3"], [1, 3, "boot B"], [3, 1, "no markBootSuccessful (crash)"], [1, 3, "retry ... tries=0"], [1, 2, "fallback to A"], [2, 0, "report failure telemetry"]]], "q": [["When should a device mark the new slot successful?", "Only after post-boot health checks pass (key services, USB enumerates, camera streams), not just when the kernel boots."], ["Why run enumerate-1000-times tests on several host OSes?", "Enumeration timing and descriptor handling bugs are intermittent and host-specific."]], "lab": "09-dfu-ab-image", "video": "v19-ota-testing", "vdur": 302.1, "terms": ["firmware", "hal", "mcu", "pd", "soc", "ci", "kernel", "qemu", "gadget", "hdmi", "enum", "cts", "oops", "ab", "descriptor", "bootloader"]}, {"id": "senior", "t": "Growing to senior/staff in this team", "tag": "Career", "an": "A senior engineer fixes the hard bug. A staff engineer makes sure the whole team stops creating that class of bug: by changing the design, the tools, or the process.", "j": [["Design doc", "A written proposal with context, options, trade-offs, decision, rollout and test plan."], ["Blast radius", "How many products/users a change can affect."], ["Lean/agile", "Small batches, fast feedback, remove waste (waiting, rework)."], ["Brag doc", "Your own running log of impact with evidence."]], "d": "<h4>The postings' senior verbs, turned into habits<\/h4><table><tr><th>Posting says<\/th><th>Do this<\/th><\/tr><tr><td>Lead secure, scalable, high-performance C/C++<\/td><td>Own one subsystem end to end (e.g. USB <span class=\"chip\" tabindex=\"0\" data-k=\"gadget\">gadget<\/span>/<span class=\"chip\" tabindex=\"0\" data-k=\"uvc\">UVC<\/span> path). Publish its architecture page, performance budget and threat model.<\/td><\/tr><tr><td>Define architecture, standards, best practices<\/td><td>Write a 'USB <span class=\"chip\" tabindex=\"0\" data-k=\"descriptor\">descriptor<\/span> and <span class=\"chip\" tabindex=\"0\" data-k=\"composite\">composite<\/span> rules' standard and a <span class=\"chip\" tabindex=\"0\" data-k=\"driver\">driver<\/span> review checklist; get it adopted.<\/td><\/tr><tr><td>Troubleshoot complex system-level issues<\/td><td>Be the person who brings the analyzer trace and the root-cause write-up; keep a public debugging playbook.<\/td><\/tr><tr><td>Planning, docs, testing strategy<\/td><td>Propose the test pyramid for your area (unit \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"qemu\">QEMU<\/span> \u2192 <span class=\"chip\" tabindex=\"0\" data-k=\"ci\">HIL<\/span>); land CI jobs.<\/td><\/tr><tr><td>Mentor<\/td><td>Run a monthly 'deep dive' session; pair on bugs; review with teaching comments.<\/td><\/tr><tr><td>Agile/lean<\/td><td>Measure something (build time, flake rate, time-to-root-cause) and improve it.<\/td><\/tr><\/table>\n<h4>Showing impact<\/h4><ul><li>Quantify: '1080p30 UVC dropped frames from 2.1% to 0.05% on Windows hosts', '<span class=\"chip\" tabindex=\"0\" data-k=\"enum\">enumeration<\/span> failures in field telemetry down 80%', '<span class=\"chip\" tabindex=\"0\" data-k=\"bsp\">BSP<\/span> rebase time from 3 weeks to 4 days'.<\/li><li>Write it down weekly in a brag doc; share short updates with your manager.<\/li><li>Vendor relations: clear, reproducible tickets to Qualcomm/NXP/Ambarella/Lontium; track SLAs; that visibility is staff-level work.<\/li><li>Upstream when allowed (with legal/manager approval): a few <span class=\"chip\" tabindex=\"0\" data-k=\"kernel\">kernel<\/span> patches with your name build external credibility.<\/li><\/ul>", "anim": ["flow", "From fixing to multiplying", ["Fix the bug", "Write the root-cause note", "Add a regression test", "Add a checklist/CI rule", "Teach it (deep dive)", "Change the design so the class of bug can't happen"], ["senior baseline", "shared knowledge", "never again here", "never again anywhere", "team capability", "staff impact"]], "q": [["What turns a bug fix into staff-level impact?", "Preventing the whole class of bug for the team: design change, tooling/CI rule, standard, and teaching."], ["Give one measurable USB-area metric you could own.", "Enumeration success rate across host matrix, frame-drop rate, time-to-first-frame, or update failure rate."]], "lab": null, "video": "v20-senior-staff", "vdur": 255.8, "terms": ["gadget", "uvc", "descriptor", "composite", "driver", "qemu", "ci", "enum", "bsp", "kernel"]}], "labs": [{"id": "00-qemu-harness", "t": "Run all kernel labs safely inside QEMU", "cmd": "./run_all_in_qemu.sh", "what": "Boots your distro kernel in QEMU with a tiny busybox initramfs and runs labs 01/02/03/04/06/07 inside it. A crash kills only the VM.", "exp": "=== LAB01 polychar\nhello-poly\n=== LAB07 vivid\nframe  4 seq=4 bytes=614400 dt=200.1ms\nOK\n=== LAB06 gadget\nbound: /sys/bus/usb/drivers/cdc_acm/1-1:1.0\nbound: /sys/bus/usb/drivers/usbhid/1-1:1.2\n=== DONE", "status": "VERIFIED (Debian 13, kernel 6.12.113, QEMU TCG)"}, {"id": "01-chardev-sysfs", "t": "Misc char device + sysfs + ioctl", "cmd": "make\nsudo insmod polychar.ko   # better: inside the QEMU harness\necho hello-poly > /dev/polychar\ncat /dev/polychar\ncat /sys/class/misc/polychar/writes\nsudo rmmod polychar", "what": "Implements read/write/ioctl with a mutex, a read-only sysfs counter, auto /dev node via miscdevice.", "exp": "hello-poly\n1", "status": "VERIFIED in QEMU (built with 0 warnings)"}, {"id": "02-platform-dt", "t": "Platform driver matched from a DT overlay", "cmd": "make\ndtc -@ -I dts -O dtb -o polyplat.dtbo polyplat-overlay.dts\n# on an arm64 board/QEMU virt with overlays: apply dtbo, then\nsudo insmod polyplat.ko ; dmesg | grep polyplat", "what": "probe() reads poly,lanes and an optional reset GPIO with devm_ helpers and dev_err_probe.", "exp": "polyplat polybridge: probed: lanes=2 reset=yes   (expected on DT hardware)", "status": "PARTIAL: module builds + loads in QEMU x86; overlay compiles with dtc; probe() not exercised (x86 has no DT)"}, {"id": "03-irq-workqueue", "t": "Top half / bottom half with a timer as fake IRQ", "cmd": "make\nsudo insmod polyirq.ko ; sleep 2 ; sudo rmmod polyirq\ndmesg | grep polyirq", "what": "Atomic-context handler defers to a workqueue; correct teardown order.", "exp": "polyirq: bottom half drained 1 events (total 1)\npolyirq: bottom half drained 1 events (total 2)\npolyirq: bottom half drained 1 events (total 3)", "status": "VERIFIED in QEMU"}, {"id": "04-usb-descriptor-parser", "t": "Parse USB descriptors like lsusb -v", "cmd": "make && ./usbdesc\n# real device:\nsudo cat /sys/bus/usb/devices/1-1/descriptors > d.bin ; ./usbdesc d.bin", "what": "Walks device/config/IAD/interface/endpoint descriptors, decodes isoc mult bits, validates lengths.", "exp": "CONFIG  wTotalLength=99 bNumInterfaces=4 ...\n  IAD   first=0 count=2 class=Video(UVC)\n    EP 0x81 IN  Isochronous maxpkt=1024 mult=3 interval=1\nOK: parsed 99 bytes", "status": "VERIFIED (ASan/UBSan) + on real gadget descriptors in QEMU"}, {"id": "05-usb-enum-sim", "t": "Enumeration state machine", "cmd": "make && ./enumsim\n./enumsim fail-address", "what": "Host/device ch9 sequence with a SET_ADDRESS failure and reset/retry path.", "exp": "device: DEFAULT -> ADDRESS ...\ndevice: ADDRESS -> CONFIGURED (endpoints enabled; class drivers may bind)", "status": "VERIFIED (ASan/UBSan)"}, {"id": "06-configfs-uvc-uac-gadget", "t": "Composite gadget with configfs + dummy_hcd", "cmd": "sudo FUNCS=\"acm.0 hid.0\" ./make_gadget.sh   # on dummy_hcd\nsudo ./make_gadget.sh                     # real UDC: uvc.0 uac2.0 acm.0\nsudo ./teardown.sh", "what": "Builds UVC (YUY2 640x480@30), UAC2 48 kHz stereo, ACM serial and a HID telephony-style report.", "exp": "usb 1-1: Product: Lab Conference Cam\ncdc_acm 1-1:1.0: ttyACM0: USB ACM device\nhid-generic ...: USB HID v1.01 Device [Lab Corp Lab Conference Cam]", "status": "PARTIAL: ACM+HID VERIFIED in QEMU on dummy_hcd; UVC/UAC2 bind fails on dummy_hcd (-EINVAL, no isoc) -> needs real UDC; teardown.sh syntax-checked only"}, {"id": "07-v4l2-capture", "t": "V4L2 mmap streaming capture", "cmd": "make\nsudo modprobe vivid\n./v4l2cap /dev/video0 30", "what": "The QUERYCAP/S_FMT/REQBUFS/QBUF/DQBUF loop every camera stack uses.", "exp": "driver=vivid card=vivid\nformat 640x480 fourcc=YUYV sizeimage=614400\nframe  0 seq=0 bytes=614400 ...\nOK", "status": "VERIFIED against vivid in QEMU; also cross-compiles for arm64"}, {"id": "08-isr-ring-buffer", "t": "Lock-free SPSC ring (ISR\u2192task)", "cmd": "make && ./ring\ngcc -fsanitize=thread -pthread -o ring_tsan ring.c && ./ring_tsan", "what": "Acquire/release ring, 2M items, checks order.", "exp": "OK 2000000 items in order, no loss", "status": "VERIFIED (ASan/UBSan + TSan clean)"}, {"id": "09-dfu-ab-image", "t": "Firmware image verify + A/B rollback", "cmd": "make && ./fwimg", "what": "CRC32, magic/size checks, anti-rollback, boot-try fallback.", "exp": "crc32(\"123456789\")=0xCBF43926\n  reject: CRC mismatch (corrupt download)\n  bootloader falls back to A\n  reject: rollback v4 < v5\nRESULT active=A", "status": "VERIFIED (ASan/UBSan)"}, {"id": "10-rtos-scheduler-sim", "t": "Priority inversion & inheritance", "cmd": "make && ./sched", "what": "Tick scheduler with a mutex; compares HIGH-task latency.", "exp": "WITHOUT inheritance: ... HIGH finished at tick 11\nWITH    inheritance: ... HIGH finished at tick 5", "status": "VERIFIED (ASan/UBSan)"}, {"id": "11-android-hal-init-sepolicy", "t": "AIDL vendor HAL + init.rc + SELinux", "cmd": "# inside an AOSP tree (device/vendor dir):\nm vendor.poly.usbcam-update-api\nm vendor.poly.usbcam-V1-ndk\n# flash, then: adb shell service list | grep usbcam", "what": "Templates: IUsbCamControl.aidl, Android.bp, .rc fragment, .te policy, file_contexts.", "exp": "(on device) vendor.poly.usbcam.IUsbCamControl/default: [...]", "status": "NOT VERIFIED: needs an AOSP checkout (~300 GB). Templates only; service implementation is an exercise"}, {"id": "12-oops-decoding", "t": "Decode a kernel oops", "cmd": "Read sample_oops.txt, then answer the lesson questions.\n./scripts/faddr2line yourmodule.ko func+0x3c   # on a real build", "what": "Annotated NULL-deref oops from a workqueue.", "exp": "pc : polybridge_hpd_work+0x3c/0x120 [polybridge]", "status": "Exercise (sample oops is illustrative, written for this lab)"}], "glossary": [{"k": "udc", "t": "UDC", "m": "USB Device Controller: the chip block that lets a gadget answer a laptop over USB.", "a": "The front desk of a hotel: every guest request (the laptop) arrives there first.", "ls": [0, 10, 12, 13]}, {"k": "dwc3", "t": "DWC3 (Synopsys IP)", "m": "A ready-made USB controller design that Synopsys sells and many Qualcomm and NXP chips include.", "a": "A front desk bought from a furniture catalogue: many hotels have the same model, so one driver fits them all.", "ls": [0, 12, 16]}, {"k": "gadget", "t": "Gadget (Linux USB gadget)", "m": "Linux's name for the device side of USB: the board pretends to be a webcam, mic or keyboard to a laptop.", "a": "An actor in costume: the same board can play \"webcam\" or \"keyboard\" depending on the costume it wears.", "ls": [0, 2, 9, 10, 11, 12, 13, 17, 18, 19]}, {"k": "configfs", "t": "configfs", "m": "A special folder tree where you build a USB gadget by creating folders and writing small files.", "a": "Building with LEGO by making folders: each folder is a brick (a function), and linking them snaps the toy together.", "ls": [0, 12, 14]}, {"k": "functionfs", "t": "FunctionFS", "m": "A way for a normal program, not kernel code, to implement one USB function of a gadget.", "a": "Letting a contractor run one counter of the shop instead of hiring a full-time employee.", "ls": [12]}, {"k": "composite", "t": "Composite device", "m": "One USB device that offers several functions at once, like camera plus mic plus buttons.", "a": "A multi-tool: one handle, several blades.", "ls": [11, 12, 19]}, {"k": "uvc", "t": "UVC", "m": "USB Video Class: the standard \"I am a webcam\" language every computer already understands.", "a": "A universal power plug for cameras: plug in anywhere and it just works, no driver install.", "ls": [0, 7, 8, 9, 11, 12, 16, 19]}, {"k": "uac", "t": "UAC / UAC2", "m": "USB Audio Class (version 2 is the modern one): the standard \"I am a mic or speaker\" language.", "a": "The same universal plug idea as the webcam language, but for sound.", "ls": [0, 7, 9, 11, 12]}, {"k": "hid", "t": "HID", "m": "Human Interface Device: the standard language for buttons, keyboards and mice, also used for mute and call buttons.", "a": "The universal remote-control language: any computer knows what \"button pressed\" means.", "ls": [0, 9, 11, 13, 17]}, {"k": "cdc", "t": "CDC / ACM", "m": "Communications Device Class: a standard USB serial port or network link, handy for debug consoles.", "a": "A walkie-talkie channel built into the cable for engineers to talk to the device.", "ls": [9, 11]}, {"k": "mtp", "t": "MTP", "m": "Media Transfer Protocol: how a phone shows its photos as files on a computer.", "a": "A librarian handing you books one at a time instead of letting you into the stacks.", "ls": [9, 12]}, {"k": "xhci", "t": "xHCI", "m": "Extensible Host Controller Interface: the standard USB host controller in laptops and in our boards when they act as host.", "a": "The hotel manager who calls guests, as opposed to the front desk that answers them.", "ls": [0, 10, 13]}, {"k": "endpoint", "t": "Endpoint", "m": "A numbered mailbox on a USB device; each data stream uses its own.", "a": "Numbered pigeonholes in an office: mail for video goes in one slot, audio in another.", "ls": [7, 9, 10, 12]}, {"k": "descriptor", "t": "Descriptor", "m": "A small table of facts the device reports about itself: who made it, what it can do.", "a": "A business card plus resume the device hands over when it is first plugged in.", "ls": [1, 9, 10, 11, 12, 13, 17, 18, 19]}, {"k": "enum", "t": "Enumeration", "m": "The first conversation after plug-in where the laptop learns what the device is and gives it an address.", "a": "A new employee's first morning: show ID, get a badge number, hand in a resume, get assigned a desk.", "ls": [2, 9, 10, 11, 12, 13, 18, 19]}, {"k": "isoc", "t": "Isochronous transfer", "m": "A USB transfer type with guaranteed timing but no retries, used for live video and audio.", "a": "A live TV broadcast: always on time, and a dropped frame is simply skipped, never resent.", "ls": [9, 11, 12, 13, 17]}, {"k": "bulk", "t": "Bulk transfer", "m": "A USB transfer type that is reliable but has no timing promise, used for files and updates.", "a": "Parcel post: everything arrives intact, but not at a promised minute.", "ls": [9, 13]}, {"k": "setup", "t": "SETUP packet / control transfer", "m": "The eight-byte question the host sends on endpoint zero to start every control conversation.", "a": "The short form you fill in at a counter before anything else happens.", "ls": [10]}, {"k": "stall", "t": "STALL", "m": "The device's way of saying \"I can't do that request.\"", "a": "A clerk holding up a hand: \"not at this counter.\"", "ls": [10]}, {"k": "vbus", "t": "VBUS", "m": "The 5-volt power wire in a USB cable; seeing it tells the device a host is attached.", "a": "The doorbell wire: when it carries power, someone is at the door.", "ls": [10, 13]}, {"k": "drd", "t": "DRD / OTG", "m": "Dual-role device: one USB port that can switch between being host and being device.", "a": "A person who can be either the customer or the shopkeeper depending on who walks in.", "ls": [13]}, {"k": "phy", "t": "PHY", "m": "The physical-layer circuit that turns bits into electrical signals on the wire.", "a": "The voice box that turns your thoughts into sound waves.", "ls": [0, 10, 13]}, {"k": "typec", "t": "USB Type-C", "m": "The reversible USB connector; it also negotiates power and roles through its extra pins.", "a": "A smart socket that works either way up and agrees on who powers whom before turning on.", "ls": [0, 13]}, {"k": "pd", "t": "PD (Power Delivery)", "m": "USB Power Delivery: the conversation over the Type-C cable that agrees on voltage, current and roles.", "a": "Two people agreeing how much to pay before handing over goods.", "ls": [0, 13, 15, 18]}, {"k": "cc", "t": "CC pins", "m": "The configuration-channel wires in a Type-C cable used to detect orientation and talk Power Delivery.", "a": "The cable's private phone line for negotiating before the main road opens.", "ls": [13]}, {"k": "altmode", "t": "Alternate mode", "m": "Using some Type-C wires to carry another signal, such as DisplayPort video, instead of USB data.", "a": "A multi-lane road where some lanes are temporarily given to buses.", "ls": [0, 13]}, {"k": "dfu", "t": "DFU", "m": "Device Firmware Upgrade: a standard way to send new firmware into a device over USB.", "a": "A car driving onto a service ramp so the mechanic can swap the engine software.", "ls": [0, 13]}, {"k": "usbmon", "t": "usbmon", "m": "A Linux feature that records every USB packet so you can read them in Wireshark.", "a": "A security camera pointed at the USB cable.", "ls": [13]}, {"k": "urb", "t": "URB", "m": "USB Request Block: the kernel's envelope for one USB transfer request on the host side.", "a": "A filled-in courier slip attached to each package.", "ls": [13]}, {"k": "lpm", "t": "LPM / U1 / U2", "m": "Link power management: USB links nap between packets to save power.", "a": "Lights on a motion sensor that switch off when the hallway is empty.", "ls": [13, 17]}, {"k": "hal", "t": "HAL", "m": "Hardware Abstraction Layer: a fixed interface Android calls, which the device maker implements for its hardware.", "a": "A standard wall socket: Android plugs into the same socket, and each maker wires the house behind it.", "ls": [0, 1, 7, 12, 13, 14, 18]}, {"k": "aidl", "t": "AIDL", "m": "Android Interface Definition Language: the file that describes the calls between two Android processes.", "a": "A menu both the waiter and the kitchen agree on, so orders are never misunderstood.", "ls": [0, 14]}, {"k": "hidl", "t": "HIDL", "m": "The older Android interface language that AIDL replaced for hardware services.", "a": "Last year's menu format, still found in older restaurants.", "ls": [14]}, {"k": "treble", "t": "Treble", "m": "Android's split between Google's system part and the vendor's hardware part, so each can update separately.", "a": "A building with a fixed wall between the landlord's floors and the tenant's floors.", "ls": [14]}, {"k": "gki", "t": "GKI", "m": "Generic Kernel Image: one Google-built Linux kernel shared by many devices, with vendor drivers loaded as modules.", "a": "A standard car chassis from the factory, with each brand bolting on its own parts.", "ls": [14]}, {"k": "vintf", "t": "VINTF", "m": "The vendor interface manifest: the list that says which hardware services a device provides.", "a": "A restaurant's posted list of dishes it promises to serve.", "ls": [14]}, {"k": "selinux", "t": "SELinux", "m": "Security-Enhanced Linux: rules that say exactly which program may touch which file or device, even as root.", "a": "Keycards in an office: even the boss's card only opens the doors it is programmed for.", "ls": [14, 17]}, {"k": "init", "t": "init / .rc files", "m": "The first user program Android starts; its .rc files say which services start and when.", "a": "The stage manager with a script that says who walks on stage and when.", "ls": [5, 12, 14, 16]}, {"k": "aosp", "t": "AOSP", "m": "Android Open Source Project: the public Android source code a device maker builds from.", "a": "The public recipe book every Android kitchen starts from.", "ls": [14]}, {"k": "adb", "t": "adb", "m": "Android Debug Bridge: the command-line tool that gives an engineer a shell and logs on a device.", "a": "A service hatch into the device for the technician.", "ls": [9, 12, 17]}, {"k": "cts", "t": "CTS / VTS", "m": "Android's Compatibility and Vendor Test Suites, which a device must pass to ship with Google apps.", "a": "The driving test every new car model must pass before it can be sold.", "ls": [14, 18]}, {"k": "framework", "t": "Framework layer", "m": "On Android, the Java system services apps talk to, like the camera and USB services.", "a": "The dining room of a restaurant: diners (apps) only ever see this room.", "ls": [0, 2, 8, 12, 14]}, {"k": "kernel", "t": "Kernel", "m": "The core of the operating system that controls memory, devices and which program runs.", "a": "The building manager who owns every key and decides who uses which room.", "ls": [0, 1, 2, 3, 4, 5, 6, 7, 12, 13, 14, 16, 17, 18, 19]}, {"k": "driver", "t": "Driver", "m": "Kernel code that knows how to operate one kind of hardware.", "a": "A translator who speaks one specific machine's language.", "ls": [0, 2, 3, 5, 6, 7, 8, 10, 11, 12, 13, 14, 16, 17, 19]}, {"k": "firmware", "t": "Firmware", "m": "Software that runs close to hardware, usually stored in flash memory on the device.", "a": "The instincts built into an animal: low-level behaviour that is there from birth.", "ls": [0, 1, 2, 5, 8, 10, 11, 13, 15, 17, 18]}, {"k": "userspace", "t": "User space", "m": "Where normal programs run, outside the kernel, protected from crashing the whole system.", "a": "The public area of a building, separate from the staff-only control room.", "ls": [2, 11, 12]}, {"k": "module", "t": "Kernel module", "m": "A piece of kernel code that can be loaded or removed while the system runs.", "a": "A plug-in cartridge for a game console.", "ls": [2, 14, 16]}, {"k": "probe", "t": "probe()", "m": "The driver function the kernel calls when it finds a device that matches the driver.", "a": "The first handshake when a translator is introduced to the person they will translate for.", "ls": [2, 3, 5, 11, 12, 16]}, {"k": "dt", "t": "Device tree", "m": "A text map of the hardware on a board (which chips, on which pins and addresses) that the kernel reads at boot.", "a": "The floor plan of a house, so the electrician knows where every socket is without digging into walls.", "ls": [2, 3, 5]}, {"k": "dtb", "t": "DTB / overlay", "m": "The compiled, binary form of the device tree that the bootloader hands to the kernel; an overlay patches it.", "a": "The printed floor plan; an overlay is a sticky note added on top.", "ls": [3, 5, 14]}, {"k": "i2c", "t": "I2C", "m": "A simple two-wire bus that lets a processor talk to small chips like sensors and HDMI bridges.", "a": "A classroom where the teacher calls each student by number and they answer one at a time.", "ls": [0, 3, 4, 8]}, {"k": "spi", "t": "SPI", "m": "A fast four-wire bus for chips like flash memory and displays.", "a": "A dedicated phone line to each chip instead of a shared classroom.", "ls": [3, 5]}, {"k": "gpio", "t": "GPIO", "m": "General-purpose input/output: a single pin software can switch on or off, or read.", "a": "A light switch the software can flip or check.", "ls": [2, 3]}, {"k": "uart", "t": "UART", "m": "A simple serial port, often the first console you see when a board boots.", "a": "A tin-can telephone straight into the board.", "ls": [3, 5, 17]}, {"k": "regmap", "t": "regmap", "m": "A kernel helper that reads and writes a chip's registers over I2C or SPI with caching.", "a": "A shared notebook of a chip's settings so you do not re-ask the c u can test kernels without real hardware.", "a": "A flight simulator for software.", "ls": [9, 12, 18, 19]}, {"k": "codec", "t": "Codec", "m": "Software or hardware that compresses and decompresses video or audio.", "a": "Vacuum-packing clothes for travel, then unpacking them at the hotel.", "ls": [3, 4, 7, 8]}, {"k": "h264", "t": "H.264 / H.265", "m": "Standard video compression formats; H.265 needs about half the bits of H.264 for the same quality.", "a": "Two generations of vacuum-packing: the newer one squeezes tighter.", "ls": [0, 7, 8, 9, 11]}, {"k": "iframe", "t": "I-frame / keyframe", "m": "A complete picture in a video stream; the frames between only store changes.", "a": "A full photo every so often, with sticky notes of changes in between.", "ls": [8]}, {"k": "svc", "t": "SVC", "m": "Scalable Video Coding: video sent in layers so a slow receiver can drop layers instead of the whole picture.", "a": "A layered cake: a guest with little appetite takes just the bottom layer.", "ls": [0, 8]}, {"k": "hdmi", "t": "HDMI", "m": "The common cable standard for sending video and audio to TVs and monitors.", "a": "A garden hose for pictures and sound.", "ls": [0, 3, 4, 7, 8, 17, 18]}, {"k": "edid", "t": "EDID / HPD", "m": "EDID is the screen's description of what it can show; hot-plug detect (HPD) is the wire that says a screen is connected.", "a": "A guest's dietary card (EDID) and the doorbell that says they arrived (HPD).", "ls": [4, 7, 8, 17]}, {"k": "hdcp", "t": "HDCP", "m": "A copy-protection handshake on video links.", "a": "A ticket check at the cinema door.", "ls": [8]}, {"k": "drm", "t": "DRM / KMS", "m": "The Linux display system (Direct Rendering Manager) that drives screens and outputs.", "a": "The stage lighting desk that decides what appears on each screen.", "ls": [3, 4, 8]}, {"k": "mcu", "t": "MCU", "m": "Microcontroller: a small, low-power chip with its own memory, running firmware without a full operating system.", "a": "A pocket calculator compared d of bulk traffic.", "a": "An ambulance lane on the highway.", "ls": [17]}, {"k": "sbom", "t": "SBOM / CVE", "m": "A software bill of materials lists every component; a CVE is a published security bug in one.", "a": "An ingredients label, and a product-recall notice for one ingredient.", "ls": [17]}, {"k": "pm", "t": "Runtime PM / suspend", "m": "Turning parts of the device off when idle and back on when needed.", "a": "Motion-sensor lights for each room of the house.", "ls": [13, 17]}]};
const $=s=>document.querySelector(s);const GL=Object.fromEntries(D.glossary.map(g=>[g.k,g]));const app=$('#app');

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function bar(){const n=D.lessons.filter(l=>prog[l.id]).length;return `<div class="card"><b>Progress:</b> ${n}/${D.lessons.length} lessons done<div class="bar"><i style="width:${100*n/D.lessons.length}%"></i></div></div>`}
function home(){app.innerHTML=`<div class="fade"><div class="plain"><h4>Start with a picture</h4>A conference-room camera bar is a small restaurant. Teams and Zoom are the diners. You run the kitchen and the basement: the chips, the wiring (drivers), the delivery door (USB), and the locks (security). This academy teaches every room of that building, with labs you can run on a normal Linux PC.</div>
${bar()}<div class="card"><h3>Built from your two Poly/HP postings (Austin)</h3><p><b>Linux/Android Embedded Firmware Developer</b> (5+ yrs) and <b>Senior Embedded USB Firmware Developer</b> (10+ yrs; <i>full USB software stack is a must-have</i>). Both: Android/Linux video-conferencing firmware below the framework, secure high-performance embedded C/C++, system-level troubleshooting, architecture/standards, testing strategy, mentoring, agile/lean. Pluses: Networking/Wi-Fi, Security, USB, H.264/H.265/SVC, HDMI, Bluetooth, Android internals.</p>
<p>${D.lessons.length} lessons · ${D.labs.length} hands-on labs · 20 narrated videos · animated diagrams · tap-to-reveal quizzes · progress saved in this browser.</p><button class="pri" onclick="go('lessons')">Open lessons →</button> <button onclick="go('plan')">See the 30/60/90 plan</button></div></div>`}
function lessons(){app.innerHTML=`<div class="fade">${bar()}<input type="search" id="s" placeholder="Search lessons (e.g. UVC, SELinux, DMA)"><div class="grid" id="g"></div></div>`;const r=()=>{const k=$('#s').value.toLowerCase();$('#g').innerHTML=D.lessons.map((l,i)=>[l,i]).filter(([l])=>!k||JSON.stringify(l).toLowerCase().includes(k)).map(([l,i])=>`<div class="card lcard" onclick="lesson(${i})"><span class="tag">${l.tag}</span> ${prog[l.id]?'<span class="done">✔ done</span>':''}<h3 style="margin:6px 0">${i+1}. ${l.t}</h3><div style="color:var(--mut);font-size:14px">${esc(l.an.slice(0,120))}…</div></div>`).join('')};$('#s').oninput=r;r()}

function labs(){app.innerHTML=`<div class="fade"><div class="plain"><h4>How to run labs</h4>Clone the repo on a Linux PC (Debian/Ubuntu). Userspace labs need only gcc + make. Kernel labs: use the QEMU harness (Lab 00) so a bug can't crash your machine. Status badges show exactly what was tested on our build box.</div>${D.labs.map(labCard).join('')}</div>`}
function plan(){app.innerHTML=`<div class="fade"><div class="plain"><h4>The idea</h4>Your first 90 days are like learning a new city: first the main roads (build, flash, debug one bug), then the neighborhoods (own a subsystem), then you start giving directions to others (standards, mentoring).</div>
<div class="card"><h3>Days 1–30: Learn the house</h3><ul><li>Build, flash and boot every product variant yourself; write the missing steps into the team wiki.</li><li>Lessons 1–6 + Labs 00–05. Map your product's boot chain, partitions, USB topology (device + host ports) and which vendor BSP release each product uses.</li><li>Fix 2–3 small bugs end to end, including a regression test.</li><li>Meet: USB, camera/ISP, audio, Android platform, QA/HIL, and vendor FAEs.</li></ul></div>
<div class="card"><h3>Days 31–60: Own a slice</h3><ul><li>Lessons 7–14 + Labs 06–07. Pick one area (USB gadget/UVC path is the best fit for the USB role) and become its go-to person.</li><li>Capture a full enumeration and a streaming session on a hardware analyzer; write a 'how our USB works' page.</li><li>Add one automated test (enumeration loop on 3 host OSes, or v4l2-compliance in CI).</li></ul></div>
<div class="card"><h3>Days 61–90: Raise the bar</h3><ul><li>Lessons 15–20 + Labs 08–12. Write a design doc for one improvement (e.g. faster UVC start, A/B accessory updates, USB descriptor standard).</li><li>Run your first team deep-dive session; review with teaching comments.</li><li>Agree 2 measurable goals with your manager for months 4–12.</li></ul></div>
<div class="card"><h3>Months 4–12: Toward staff</h3><ul><li>Own cross-product architecture for your area; lead a feature from design to field telemetry.</li><li>Reduce one class of bugs team-wide (tooling/CI/standard).</li><li>Lead vendor escalations; consider 1–3 upstream patches (with approval).</li><li>Mentor 1–2 engineers; keep a weekly brag doc with numbers.</li></ul><p>Full plan with weekly cadence: <a href="LEARNING_PLAN.md">LEARNING_PLAN.md</a></p><p>🎓 Udemy: exact sections to watch (~30 h must-watch, mapped to each phase): <a href="UDEMY_PICKS.md">UDEMY_PICKS.md</a></p></div></div>`}
function quiz(){const all=D.lessons.flatMap((l,i)=>l.q.map(q=>[i,...q])).sort(()=>Math.random()-.5).slice(0,10);app.innerHTML=`<div class="fade"><div class="plain"><h4>Mixed drill</h4>10 random questions. Answer out loud first, then tap.</div><div class="card">${all.map(([i,q,a])=>`<div class="q" onclick="this.classList.toggle('open')"><span class="tag">${D.lessons[i].tag}</span> ${q}<div class="ans">✅ ${a} <a href="#" onclick="event.stopPropagation();lesson(${i});return false">(lesson ${i+1})</a></div></div>`).join('')}<button class="pri" onclick="quiz()">New set</button></div></div>`}
