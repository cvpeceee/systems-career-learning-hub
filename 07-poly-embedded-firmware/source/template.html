<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poly Embedded Firmware Academy — Linux/Android + USB</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--panel2:#16223b;--ink:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--hl:#f59e0b;--ok:#22c55e;--bad:#ef4444;--vio:#a78bfa;--line:#26344f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--acc)}header{position:sticky;top:0;z-index:5;background:#0b1220ee;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:17px}nav a{display:inline-block;margin-right:12px;text-decoration:none;font-weight:600;cursor:pointer}main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.plain{background:#172554;border:1px solid #3b82f6;border-radius:12px;padding:12px 14px;margin:10px 0}.plain h4{margin:0 0 4px;color:var(--acc)}
.jar{background:#1c1917;border:1px solid #a16207;border-radius:12px;padding:10px 14px}.jar dt{color:var(--hl);font-weight:700}.jar dd{margin:0 0 6px 0;color:#e7e5e4}
.tag{display:inline-block;background:#1e293b;border-radius:10px;padding:2px 9px;margin:2px;font-size:13px;color:var(--vio)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lcard{cursor:pointer;transition:transform .15s}.lcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.done{color:var(--ok)}pre{background:#020617;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:13px;white-space:pre-wrap}
code{background:#1e293b;border-radius:4px;padding:0 4px;font-size:.92em}pre code{background:none;padding:0}
table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow:auto}td,th{border:1px solid var(--line);padding:6px;vertical-align:top}th{background:var(--panel2)}
button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:15px;cursor:pointer;margin:3px}button.pri{background:#0369a1;border-color:#0ea5e9}
.q{border-left:3px solid var(--vio);padding:6px 10px;margin:8px 0;background:var(--panel2);border-radius:6px}.ans{display:none;color:#bbf7d0;margin-top:6px}.q.open .ans{display:block}
#sv{overflow-x:auto}.anim svg{min-width:600px;width:100%;height:auto;background:#020617;border-radius:10px;border:1px solid var(--line)}.cap{min-height:2.6em;margin:6px 0;color:var(--hl);font-weight:600}
.bar{height:8px;background:#1e293b;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);transition:width .4s}
.st{font-size:13px;padding:2px 8px;border-radius:8px;display:inline-block}.V{background:#14532d}.P{background:#713f12}.N{background:#7f1d1d}
input[type=search]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px;width:100%;font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.fade{animation:pop .35s ease}
.chip{border-bottom:2px dotted var(--hl);color:#fde68a;cursor:pointer;font-weight:600}.chip:hover,.chip:focus{background:#422006;outline:none;border-radius:4px}
.chipx{display:block;font-weight:400;margin:6px 0 8px;padding:8px 10px;background:#1c1917;border:1px solid #a16207;border-radius:8px;font-size:14px;color:#e7e5e4;animation:pop .25s ease}.chipx b{color:var(--hl)}.chipx i{color:#bbf7d0;font-style:normal}
.wtk{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}.wtk div{background:#1c1917;border:1px solid #57534e;border-radius:10px;padding:8px 10px;font-size:14px}.wtk b{color:var(--hl)}.wtk i{color:#bbf7d0;font-style:normal;display:block;margin-top:3px}
details.wt{background:#1c1917;border:1px solid #a16207;border-radius:12px;padding:10px 14px;margin:10px 0}details.wt summary{cursor:pointer;font-weight:700;color:var(--hl)}
</style></head><body>
<header><b>🎥 Poly Firmware Academy</b><nav><a data-v="home">Home</a><a data-v="lessons">Lessons</a><a data-v="videos">Videos</a><a data-v="labs">Labs</a><a data-v="plan">Plan</a><a data-v="quiz">Quiz mix</a><a data-v="glossary">Glossary</a></nav></header>
<main id="app"></main>
<script>
const D=/*DATA*/;
const $=s=>document.querySelector(s);const GL=Object.fromEntries(D.glossary.map(g=>[g.k,g]));const app=$('#app');
const prog=JSON.parse(localStorage.getItem('polyprog')||'{}');const save=()=>localStorage.setItem('polyprog',JSON.stringify(prog));
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function bar(){const n=D.lessons.filter(l=>prog[l.id]).length;return `<div class="card"><b>Progress:</b> ${n}/${D.lessons.length} lessons done<div class="bar"><i style="width:${100*n/D.lessons.length}%"></i></div></div>`}
function home(){app.innerHTML=`<div class="fade"><div class="plain"><h4>Start with a picture</h4>A conference-room camera bar is a small restaurant. Teams and Zoom are the diners. You run the kitchen and the basement: the chips, the wiring (drivers), the delivery door (USB), and the locks (security). This academy teaches every room of that building, with labs you can run on a normal Linux PC.</div>
${bar()}<div class="card"><h3>Built from your two Poly/HP postings (Austin)</h3><p><b>Linux/Android Embedded Firmware Developer</b> (5+ yrs) and <b>Senior Embedded USB Firmware Developer</b> (10+ yrs; <i>full USB software stack is a must-have</i>). Both: Android/Linux video-conferencing firmware below the framework, secure high-performance embedded C/C++, system-level troubleshooting, architecture/standards, testing strategy, mentoring, agile/lean. Pluses: Networking/Wi-Fi, Security, USB, H.264/H.265/SVC, HDMI, Bluetooth, Android internals.</p>
<p>${D.lessons.length} lessons · ${D.labs.length} hands-on labs · 20 narrated videos · animated diagrams · tap-to-reveal quizzes · progress saved in this browser.</p><button class="pri" onclick="go('lessons')">Open lessons →</button> <button onclick="go('plan')">See the 30/60/90 plan</button></div></div>`}
function lessons(){app.innerHTML=`<div class="fade">${bar()}<input type="search" id="s" placeholder="Search lessons (e.g. UVC, SELinux, DMA)"><div class="grid" id="g"></div></div>`;const r=()=>{const k=$('#s').value.toLowerCase();$('#g').innerHTML=D.lessons.map((l,i)=>[l,i]).filter(([l])=>!k||JSON.stringify(l).toLowerCase().includes(k)).map(([l,i])=>`<div class="card lcard" onclick="lesson(${i})"><span class="tag">${l.tag}</span> ${prog[l.id]?'<span class="done">✔ done</span>':''}<h3 style="margin:6px 0">${i+1}. ${l.t}</h3><div style="color:var(--mut);font-size:14px">${esc(l.an.slice(0,120))}…</div></div>`).join('')};$('#s').oninput=r;r()}
function lesson(i){const l=D.lessons[i];const lab=l.lab?D.labs.find(x=>x.id==l.lab):null;scrollTo(0,0);
app.innerHTML=`<div class="fade"><span class="tag">${l.tag}</span><h2>${i+1}. ${l.t}</h2>
<details class="wt" open><summary>📖 Words to know in this lesson (${l.terms.length}) · tap any dotted word in the text to expand it</summary><div class="wtk" style="margin-top:8px">${l.terms.map(k=>{const g=GL[k];return `<div><b>${esc(g.t)}</b>: ${esc(g.m)}<i>Like: ${esc(g.a)}</i></div>`}).join('')}${l.j.map(([a,b])=>`<div><b>${a}</b>: ${b}</div>`).join('')}</div></details>
<div class="plain"><h4>Plain analogy first</h4>${l.an}</div>
<div class="card"><h3>🎬 Narrated video (${mmss(l.vdur)})</h3>${vtag(l)}</div>
<div class="card anim"><h3>▶ Animated: ${l.anim[1]}</h3><div id="sv"></div><div class="cap" id="cap">Press Play or Step.</div><button class="pri" id="play">▶ Play</button><button id="step">Step</button><button id="rst">Reset</button></div>
<div class="card">${l.d}</div>
${lab?labCard(lab):''}
<div class="card"><h3>Check yourself (tap to reveal)</h3>${l.q.map(([q,a])=>`<div class="q" onclick="this.classList.toggle('open')"><b>Q.</b> ${q}<div class="ans">✅ ${a}</div></div>`).join('')}</div>
<div class="card"><button class="pri" onclick="prog['${l.id}']=!prog['${l.id}'];save();lesson(${i})">${prog[l.id]?'✔ Marked done (tap to undo)':'Mark lesson done'}</button>
${i>0?`<button onclick="lesson(${i-1})">← Prev</button>`:''}${i<D.lessons.length-1?`<button onclick="lesson(${i+1})">Next →</button>`:''}</div></div>`;anim(l.anim)}
function vtag(l){return `<video controls preload="none" playsinline style="width:100%;border-radius:10px;background:#000" poster="" src="videos/${l.video}.mp4"><track kind="subtitles" srclang="en" label="English" src="videos/${l.video}.vtt"></video>`}
function mmss(s){return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')}
function videos(){app.innerHTML=`<div class="fade"><div class="plain"><h4>Narrated videos</h4>One video per lesson: analogy first, words defined, then the mechanism step by step, then a recap. Captions are burned in and timed from the same narration track as the animation. Download the whole folder so the videos/ files sit next to index.html.</div>${D.lessons.map((l,i)=>`<div class="card"><h3>${i+1}. ${l.t} <span class="tag">${mmss(l.vdur)}</span></h3>${vtag(l)}<button onclick="lesson(${i})">Open lesson →</button></div>`).join('')}</div>`}
function labCard(b){const c=b.status.startsWith('VERIFIED')?'V':b.status.startsWith('PARTIAL')?'P':'N';return `<div class="card"><h3>🧪 Lab ${b.id.slice(0,2)}: ${b.t}</h3><span class="st ${c}">${b.status}</span><p>${b.what}</p><p>Folder: <a href="labs/${b.id}/">labs/${b.id}/</a></p><b>Run</b><pre>${esc(b.cmd)}</pre><b>Expected output</b><pre>${esc(b.exp)}</pre></div>`}
function labs(){app.innerHTML=`<div class="fade"><div class="plain"><h4>How to run labs</h4>Clone the repo on a Linux PC (Debian/Ubuntu). Userspace labs need only gcc + make. Kernel labs: use the QEMU harness (Lab 00) so a bug can't crash your machine. Status badges show exactly what was tested on our build box.</div>${D.labs.map(labCard).join('')}</div>`}
function plan(){app.innerHTML=`<div class="fade"><div class="plain"><h4>The idea</h4>Your first 90 days are like learning a new city: first the main roads (build, flash, debug one bug), then the neighborhoods (own a subsystem), then you start giving directions to others (standards, mentoring).</div>
<div class="card"><h3>Days 1–30: Learn the house</h3><ul><li>Build, flash and boot every product variant yourself; write the missing steps into the team wiki.</li><li>Lessons 1–6 + Labs 00–05. Map your product's boot chain, partitions, USB topology (device + host ports) and which vendor BSP release each product uses.</li><li>Fix 2–3 small bugs end to end, including a regression test.</li><li>Meet: USB, camera/ISP, audio, Android platform, QA/HIL, and vendor FAEs.</li></ul></div>
<div class="card"><h3>Days 31–60: Own a slice</h3><ul><li>Lessons 7–14 + Labs 06–07. Pick one area (USB gadget/UVC path is the best fit for the USB role) and become its go-to person.</li><li>Capture a full enumeration and a streaming session on a hardware analyzer; write a 'how our USB works' page.</li><li>Add one automated test (enumeration loop on 3 host OSes, or v4l2-compliance in CI).</li></ul></div>
<div class="card"><h3>Days 61–90: Raise the bar</h3><ul><li>Lessons 15–20 + Labs 08–12. Write a design doc for one improvement (e.g. faster UVC start, A/B accessory updates, USB descriptor standard).</li><li>Run your first team deep-dive session; review with teaching comments.</li><li>Agree 2 measurable goals with your manager for months 4–12.</li></ul></div>
<div class="card"><h3>Months 4–12: Toward staff</h3><ul><li>Own cross-product architecture for your area; lead a feature from design to field telemetry.</li><li>Reduce one class of bugs team-wide (tooling/CI/standard).</li><li>Lead vendor escalations; consider 1–3 upstream patches (with approval).</li><li>Mentor 1–2 engineers; keep a weekly brag doc with numbers.</li></ul><p>Full plan with weekly cadence: <a href="LEARNING_PLAN.md">LEARNING_PLAN.md</a></p><p>🎓 Udemy: exact sections to watch (~30 h must-watch, mapped to each phase): <a href="UDEMY_PICKS.md">UDEMY_PICKS.md</a></p></div></div>`}
function quiz(){const all=D.lessons.flatMap((l,i)=>l.q.map(q=>[i,...q])).sort(()=>Math.random()-.5).slice(0,10);app.innerHTML=`<div class="fade"><div class="plain"><h4>Mixed drill</h4>10 random questions. Answer out loud first, then tap.</div><div class="card">${all.map(([i,q,a])=>`<div class="q" onclick="this.classList.toggle('open')"><span class="tag">${D.lessons[i].tag}</span> ${q}<div class="ans">✅ ${a} <a href="#" onclick="event.stopPropagation();lesson(${i});return false">(lesson ${i+1})</a></div></div>`).join('')}<button class="pri" onclick="quiz()">New set</button></div></div>`}
let timer=null;
function anim(a){clearInterval(timer);const sv=$('#sv'),cap=$('#cap');let k=-1;
 if(a[0]==='seq'){const lanes=a[2],msgs=a[3],W=760,lw=W/lanes.length,H=60+msgs.length*34+20;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui" font-size="13">`;
  lanes.forEach((n,i)=>{const x=lw*i+lw/2;s+=`<rect x="${x-lw/2+6}" y="6" width="${lw-12}" height="34" rx="8" fill="#16223b" stroke="#38bdf8"/><text x="${x}" y="28" fill="#e2e8f0" text-anchor="middle">${n}</text><line x1="${x}" y1="40" x2="${x}" y2="${H-6}" stroke="#334155" stroke-dasharray="4 4"/>`});
  msgs.forEach(([f,t,txt],j)=>{const y=62+j*34,x1=lw*f+lw/2,x2=lw*t+lw/2;const self=f===t;
   s+=`<g id="m${j}" opacity=".12">`+(self?`<path d="M${x1} ${y-8} h40 v16 h-40" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="${x1+46}" y="${y+4}" fill="#fde68a">${esc(txt)}</text>`:`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/><text x="${(x1+x2)/2}" y="${y-6}" fill="#fde68a" text-anchor="middle">${esc(txt)}</text>`)+`</g>`});
  s+=`<circle id="dot" r="7" fill="#22c55e" cx="-20" cy="-20"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f59e0b"/></marker></defs></svg>`;sv.innerHTML=s;
  var stepf=()=>{if(k>=msgs.length-1){clearInterval(timer);cap.textContent='Done. Reset to replay.';return}k++;const [f,t,txt]=msgs[k];$('#m'+k).setAttribute('opacity','1');cap.textContent=`Step ${k+1}/${msgs.length}: ${lanes[f]} → ${lanes[t]}: ${txt}`;
   const dot=$('#dot'),y=62+k*34,x1=lw*f+lw/2,x2=f===t?x1+40:lw*t+lw/2;let p=0;const mv=()=>{p+=.06;dot.setAttribute('cx',x1+(x2-x1)*Math.min(p,1));dot.setAttribute('cy',y);if(p<1)requestAnimationFrame(mv)};mv()}}
 else{const items=a[2],sub=a[3],W=760,H=items.length*58+12;let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui" font-size="14">`;
  items.forEach((n,i)=>{const y=8+i*58;s+=`<g id="b${i}" opacity=".25"><rect x="20" y="${y}" width="${W-40}" height="44" rx="10" fill="#16223b" stroke="#38bdf8" stroke-width="2"/><text x="40" y="${y+20}" fill="#e2e8f0" font-weight="700">${i+1}. ${esc(n)}</text><text x="40" y="${y+37}" fill="#94a3b8" font-size="12">${esc(sub[i])}</text></g>`;if(i<items.length-1)s+=`<path d="M${W/2} ${y+44} v14" stroke="#475569" stroke-width="2"/>`});
  sv.innerHTML=s+'</svg>';var stepf=()=>{if(k>=items.length-1){clearInterval(timer);cap.textContent='Done. Reset to replay.';return}if(k>=0)$('#b'+k).querySelector('rect').setAttribute('stroke','#38bdf8');k++;const g=$('#b'+k);g.setAttribute('opacity','1');g.querySelector('rect').setAttribute('stroke','#f59e0b');cap.textContent=`${items[k]}: ${sub[k]}`}}
 $('#play').onclick=()=>{clearInterval(timer);stepf();timer=setInterval(stepf,1500)};$('#step').onclick=()=>{clearInterval(timer);stepf()};$('#rst').onclick=()=>anim(a)}
function glossary(){app.innerHTML=`<div class="fade"><div class="plain"><h4>Glossary</h4>Every term used in the lessons and videos: a one-line meaning and an everyday picture. Tap a lesson number to open it.</div><input type="search" id="gs" placeholder="Search terms (e.g. UDC, configfs, HAL)"><div id="gl"></div></div>`;const r=()=>{const k=$('#gs').value.toLowerCase();$('#gl').innerHTML=D.glossary.filter(g=>g.ls.length&&(!k||(g.t+g.m+g.a).toLowerCase().includes(k))).sort((a,b)=>a.t.localeCompare(b.t)).map(g=>`<div class="card" style="margin:8px 0;padding:10px 14px"><b style="color:var(--hl)">${esc(g.t)}</b>: ${esc(g.m)}<div style="color:#bbf7d0">Like: ${esc(g.a)}</div><div class="small" style="font-size:13px;color:var(--mut)">Lessons: ${g.ls.map(i=>`<a onclick="lesson(${i})">${i+1}</a>`).join(' · ')}</div></div>`).join('')};$('#gs').oninput=r;r()}
document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const n=c.nextElementSibling;if(n&&n.classList.contains('chipx')){n.remove();return}const g=GL[c.dataset.k];c.insertAdjacentHTML('afterend',`<span class="chipx"><b>${esc(g.t)}</b>: ${esc(g.m)} <i>Like: ${esc(g.a)}</i></span>`)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('chip'))e.target.click()});
function go(v){({home,lessons,labs,plan,quiz,videos,glossary})[v]();scrollTo(0,0)}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>go(a.dataset.v));
if(location.hash)document.head.insertAdjacentHTML("beforeend","<style>.fade{animation:none}</style>");const h=location.hash.match(/^#l(\d+)(?:s(\d+))?$/);if(h){lesson(+h[1]-1);for(let i=0;i<(+h[2]||0);i++)$('#step').click()}else if(location.hash==='#labs')labs();else if(location.hash==='#videos')videos();else if(location.hash==='#glossary')glossary();else home();
</script></body></html>
