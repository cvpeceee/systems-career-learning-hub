<style>
:root{--bg:#0b1220;--panel:#111a2e;--panel2:#16223b;--ink:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--hl:#f59e0b;--ok:#22c55e;--bad:#ef4444;--vio:#a78bfa;--line:#26344f}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

aside a{display:block;padding:4px 8px;border-radius:6px;text-decoration:none;color:var(--ink)}aside a:hover{background:var(--panel2)}aside a.cur{background:#0c4a6e}aside a .ck{color:var(--ok);font-weight:700}

<script>
const D={"chapters": [{"t": "Start here", "b": "What the job is, how this course works, and Python for C++/Java engineers.", "h": "~1 h"}, {"t": "How LLMs work", "b": "Tokens, next-token prediction, sampling, context windows, embeddings, hallucination.", "h": "~2 h"}, {"t": "Using LLM APIs well", "b": "Messages and roles, streaming, structured output, prompt and context engineering.", "h": "~1.7 h"}, {"t": "Tools and agents", "b": "Tool calling, the agent loop from scratch, patterns, state and memory.", "h": "~2.5 h"}, {"t": "RAG end to end", "b": "Chunking, embeddings, vector databases, hybrid search, reranking, retrieval evals.", "h": "~2 h"}, {"t": "Model Context Protocol", "b": "What MCP is, and building a server and client with the official SDK.", "h": "~1.3 h"}, {"t": "Frameworks", "b": "An honest comparison, and LangGraph hands-on with checkpoints and interrupts.", "h": "~1.3 h"}, {"t": "Multi-agent and long-running", "b": "Orchestrator-worker, handoffs, human approval, durable execution.", "h": "~1.1 h"}, {"t": "Evals and observability", "b": "Golden sets, regression gates, LLM-as-judge pitfalls, tracing.", "h": "~1.7 h"}, {"t": "Safety and security", "b": "Prompt injection, the lethal trifecta, permissions, sandboxing, guardrails, PII.", "h": "~1.2 h"}, {"t": "Production", "b": "Retries, rate limits, fallbacks, caching, routing, deployment, monitoring.", "h": "~1.7 h"}, {"t": "Fine-tuning and local models", "b": "When to fine-tune, LoRA, distillation, running open-weight models.", "h": "~0.6 h"}, {"t": "Capstones and interviews", "b": "Three portfolio projects, system design, coding drills, Q&A, your story.", "h": "~3 h"}], "lessons": [{"id": "role", "ch": 0, "t": "What an Agentic AI Engineer actually builds", "mins": 15, "why": "explain the job in one sentence, name the skills postings ask for, and know how this course gets you there.", "an": "<p>Think of a field service company. A <b>technician<\/b> gets a ticket (\"unit 17 keeps rebooting\"), opens a toolbox, tries something, looks at the result, and decides what to do next until the ticket is closed.<\/p>\n<p>An agent is that technician made of software: a language model that reads the ticket and decides which tool to use next, plus <i>your code<\/i>, which owns the toolbox, runs every tool, enforces the rules and keeps the records. <b>Your job as an Agentic AI Engineer is to build the toolbox, the rules, the records and the tests<\/b>, so the technician is useful and cannot do damage.<\/p>", "d": "<h3>The job in one sentence<\/h3>\n<p>You build software in which a large language model (LLM) chooses some of the steps, and you make that software <b>reliable, measurable, safe and affordable<\/b> enough to run for real users.<\/p>\n<p>That second half is most of the work. A demo agent takes an afternoon. A production agent takes testing, tracing, permissions, retries and cost control: classic engineering, which you already know.<\/p>\n\n<h3>What real postings ask for<\/h3>\n<p>We read twelve current postings (Chapter 12 and the Skills map tab list them with links). Almost every one asks for the same core list:<\/p>\n<ul>\n<li><b>Strong Python<\/b> and normal software craft: testing, typing, async code, code review.<\/li>\n<li><b>LLM APIs<\/b>: messages, structured output, tool calling, streaming.<\/li>\n<li><b>Agent building<\/b>: the loop, state, memory, planning, stopping rules, human approval steps.<\/li>\n<li><b>RAG<\/b>: chunking, embeddings, hybrid search, reranking, vector databases.<\/li>\n<li><b>MCP<\/b>: designing tools and building MCP servers.<\/li>\n<li><b>One framework in depth<\/b>, LangGraph most often, plus awareness of the others.<\/li>\n<li><b>Evals and observability<\/b>: golden sets, LLM-as-judge, regression gates, tracing.<\/li>\n<li><b>Security<\/b>: prompt injection, least privilege, PII handling, guardrails.<\/li>\n<li><b>Production<\/b>: containers, cloud, retries, rate limits, cost and latency trade-offs.<\/li>\n<\/ul>\n<p>The course has one chapter per line of that list.<\/p>\n\n<h3>What you already have<\/h3>\n<div class=\"fw\"><b>Your firmware edge.<\/b> You already think in state machines, timeouts, retries, watchdogs, bounded buffers, interfaces you cannot trust, and \"what happens when this fails at 3 a.m. in the field\". Those are exactly the habits that separate a production agent engineer from a prompt tinkerer. Each lesson points out the link.<\/div>\n\n<h3>What you do NOT need<\/h3>\n<ul>\n<li>You will not train models, and you do not need calculus. We use models through an API, the way you use a vendor's silicon through its datasheet.<\/li>\n<li>You do not need to memorise every framework. Postings ask for depth in one and the judgement to pick.<\/li>\n<\/ul>\n\n<h3>How this course works<\/h3>\n<ol>\n<li>Every lesson opens with an everyday picture. Then comes the precise meaning.<\/li>\n<li>Highlighted words can be tapped for a definition, and the Words-to-know box lists them all.<\/li>\n<li>Each chapter has a runnable Python lab. The labs use a <b>fake LLM<\/b> so tests pass offline with no API key. The README shows how to switch to a real model.<\/li>\n<li>Core concepts have narrated videos.<\/li>\n<li>The last chapter is the job hunt itself: three portfolio projects, worked system-design answers, a coding drill and Q&amp;A.<\/li>\n<\/ol>\n<div class=\"key\"><b>Realistic pace:<\/b> about 8–10 hours a week for 12 weeks (see the Plan tab). Build the labs and at least two capstones before you apply. Interviewers ask \"show me something you built\".<\/div>", "q": [{"q": "Which part of an agent actually executes a tool such as \"reboot device\"?", "o": ["The language model", "Your application code", "The MCP protocol itself", "The vector database"], "a": 1, "w": "The model only <i>asks<\/i> for a tool call in structured text. Your code decides whether to allow it, runs it, and returns the result. That is why permissions live in your code."}, {"q": "Which skill appears in almost every agentic engineering posting besides Python?", "o": ["Training models from scratch", "Evals and testing of LLM behaviour", "CUDA kernel writing (low-level GPU programming)", "Mobile UI design"], "a": 1, "w": "Evaluation (golden sets, regression tests, LLM-as-judge) shows up across nearly all postings because it is how teams prove an agent works."}], "th": [["Write the job in one sentence in your own words, then compare with the one above.", "Something like: \"I build systems where an LLM chooses some steps, and I make them reliable, safe, testable and cheap enough for production.\""]], "terms": ["model", "llm", "agent", "trace", "retry", "async", "api", "structured", "tool", "toolcall", "streaming", "state", "rag", "chunk", "embedding", "hybrid", "rerank", "vdb", "vector", "mcp", "mcphost", "framework", "langgraph", "eval", "observ", "golden", "judge", "regression", "pinj", "prompt", "leastpriv", "pii", "guardrail", "docker", "ratelimit", "latency", "ai", "agentic"], "anim": null, "lab": null, "video": {"id": "a01-what-agent-engineers-build", "t": "What an agent engineer actually builds", "dur": "6:56"}}, {"id": "python", "ch": 0, "t": "Python for a C++/Java engineer, in one sitting", "mins": 40, "why": "read and write the Python used in every lab: venv, dicts, f-strings, type hints, dataclasses, Pydantic, decorators, async/await and pytest.", "an": "<p>Moving from C++ to Python is like moving from hand-wiring a board to using a breadboard with labelled jumpers. You lose some control and speed. You gain enormous iteration speed, and for agent work most of the time is spent waiting on the network anyway.<\/p>\n<p>The industry writes agents in Python (TypeScript is second), because every model provider ships its first and best library for Python.<\/p>", "d": "<h3>1. Projects and packages<\/h3>\n<pre><code>python3 -m venv .venv          # private package folder for this project\nsource .venv/bin/activate      # Windows: .venv\\Scripts\\activate\npip install -r requirements.txt\npython -m pytest -q            # run the tests<\/code><\/pre>\n<div class=\"fw\"><b>Analogy:<\/b> the virtual environment is a per-project sysroot. pip is the package manager, a bit like apt but scoped to that sysroot.<\/div>\n\n<h3>2. The core types you will see constantly<\/h3>\n<pre><code>msg = {\"role\": \"user\", \"content\": \"hi\"}     # dict: like std::unordered_map / HashMap\nhistory = [msg]                              # list: like std::vector / ArrayList\nhistory.append({\"role\": \"assistant\", \"content\": \"hello\"})\nname = \"unit-17\"; n = 3\nprint(f\"{name} rebooted {n} times\")         # f-string: formatted string, like std::format\nfor i, m in enumerate(history):              # index + item\n    print(i, m[\"role\"])\nroles = [m[\"role\"] for m in history]         # list comprehension: map in one line<\/code><\/pre>\n<p>Agent code is mostly dicts and lists, because LLM APIs speak JSON, and JSON maps directly onto them: <code>json.loads(text)<\/code> gives you dicts and lists, and <code>json.dumps(obj)<\/code> goes back.<\/p>\n\n<h3>3. Type hints and dataclasses<\/h3>\n<pre><code>from dataclasses import dataclass\n\n@dataclass\nclass Step:\n    tool: str\n    args: dict\n    ok: bool = True\n\ndef run(step: Step) -> str:\n    return f\"ran {step.tool}\"<\/code><\/pre>\n<div class=\"py\"><b>Python note:<\/b> <code>tool: str<\/code> is a hint, not a compile-time check. Python will happily pass an int. That is why libraries such as Pydantic exist: they check at run time. <code>@dataclass<\/code> writes the constructor and printing code for you, like a C++ aggregate with free <code>operator==<\/code>.<\/div>\n\n<h3>4. Pydantic: a struct that validates itself<\/h3>\n<pre><code>from typing import Literal\nfrom pydantic import BaseModel\n\nclass Triage(BaseModel):\n    severity: Literal[\"low\", \"medium\", \"high\"]\n    component: str\n\nt = Triage.model_validate_json('{\"severity\": \"high\", \"component\": \"usb\"}')\nprint(t.severity)                      # \"high\"\nTriage.model_json_schema()             # the matching JSON Schema, ready to send to an LLM\nTriage.model_validate_json('{\"severity\": \"urgent\", \"component\": \"usb\"}')  # raises ValidationError<\/code><\/pre>\n<p>You will use this pattern everywhere. It describes what you want from the model, and it checks what you got back.<\/p>\n\n<h3>5. Decorators<\/h3>\n<pre><code>TOOLS = {}\ndef tool(fn):                 # a function that receives a function\n    TOOLS[fn.__name__] = fn   # register it\n    return fn\n\n@tool                         # same as: search_logs = tool(search_logs)\ndef search_logs(unit: int, pattern: str) -> list[str]:\n    \"\"\"Search one unit's logs for a pattern.\"\"\"\n    ...<\/code><\/pre>\n<div class=\"fw\"><b>Analogy:<\/b> like a macro that adds your ISR to the vector table. Agent libraries use <code>@tool<\/code> (or <code>@function_tool<\/code>, <code>@mcp.tool()<\/code>) and read the function's type hints and docstring (the text in triple quotes) to build the tool description for the model.<\/div>\n\n<h3>6. async / await<\/h3>\n<pre><code>import asyncio\n\nasync def ask(q: str) -> str:\n    await asyncio.sleep(1)          # stands in for a network call to the model\n    return q.upper()\n\nasync def main():\n    a, b = await asyncio.gather(ask(\"x\"), ask(\"y\"))   # both run concurrently: ~1 s total, not 2\n    print(a, b)\n\nasyncio.run(main())<\/code><\/pre>\n<div class=\"fw\"><b>Analogy:<\/b> cooperative tasks on one core. <code>await<\/code> is \"block on this queue and let another task run\". It does not create threads. That is perfect for agents, which spend most of their time waiting on the network.<\/div>\n\n<h3>7. Exceptions and context managers<\/h3>\n<pre><code>try:\n    data = json.loads(reply)\nexcept json.JSONDecodeError as e:\n    data = None                       # handle and move on\nwith open(\"trace.jsonl\", \"a\") as f:   # 'with' closes the file automatically (RAII)\n    f.write(json.dumps(event) + \"\\n\")<\/code><\/pre>\n\n<h3>8. Tests with pytest<\/h3>\n<pre><code># test_tools.py: any function named test_* is a test\ndef test_search_finds_watchdog():\n    assert \"watchdog\" in search_logs(17, \"watchdog\")[0]<\/code><\/pre>\n<p>Run <code>python -m pytest -q<\/code>. A bare <code>assert<\/code> is enough, and pytest prints both sides when it fails.<\/p>\n\n<h3>Gotchas that bite C++/Java people<\/h3>\n<ul>\n<li>Indentation is syntax. Use 4 spaces and never mix in tabs.<\/li>\n<li>Never use a mutable default argument: write <code>def f(x=None)<\/code>, not <code>def f(x=[])<\/code>, because the list is shared between calls.<\/li>\n<li>Integers never overflow; floats are C doubles.<\/li>\n<li><code>is<\/code> compares identity (like comparing pointers). Use <code>==<\/code> for values.<\/li>\n<li>Everything is a reference. <code>b = a<\/code> on a list does not copy; use <code>a.copy()<\/code>.<\/li>\n<\/ul>\n<p><b>TypeScript in one line:<\/b> it is JavaScript with type annotations, and agent SDKs for it (OpenAI Agents SDK, the MCP SDK, LangGraph.js) mirror the Python ones closely. Where it matters we show it.<\/p>", "q": [{"q": "What does <code>@dataclass<\/code> above a class do?", "o": ["Makes fields private", "Generates the constructor, equality and printing code from the field list", "Enforces types at run time", "Makes the class thread-safe"], "a": 1, "w": "It generates boilerplate. It does <i>not<\/i> check types at run time. Pydantic does that."}, {"q": "You call two model APIs with <code>await asyncio.gather(a(), b())<\/code>. Each takes 2 s. Roughly how long does it take?", "o": ["4 s", "2 s", "1 s", "It depends on the number of CPU cores"], "a": 1, "w": "Both waits overlap on one thread, so about 2 s. Cores do not matter because the time is spent waiting on the network, not computing."}, {"q": "Why do agent libraries care about your function's type hints and docstring?", "o": ["For speed", "They turn them into the tool's JSON Schema and description that the model reads", "Python requires them", "For logging"], "a": 1, "w": "<code>unit: int<\/code> becomes <code>{\"type\":\"integer\"}<\/code> in the schema, and the docstring becomes the description the model uses to choose the tool."}], "lab": "Lab 00 (<code>labs/00-setup<\/code>): follow the setup in <code>labs/README.md<\/code>, then write a three-line <code>ask()<\/code> that sends one message to the fake model. The tests also confirm your Python version and packages.", "terms": ["venv", "agent", "llm", "api", "json", "typehint", "pydantic", "model", "decorator", "vector", "tool", "async", "sdk", "oaisdk", "mcp", "langgraph"], "th": [], "anim": null, "video": null}, {"id": "nexttoken", "ch": 1, "t": "What an LLM really is: next-token prediction", "mins": 30, "why": "explain tokens, next-token prediction, and why \"the model knows things\" is the wrong mental model.", "an": "<p>Your phone keyboard suggests the next word. Tap the middle suggestion over and over and it writes a whole (silly) sentence.<\/p>\n<p>An LLM is that same idea, trained on a huge share of the public internet, books and code, with billions of tuned numbers instead of a small table. It has one job: <b>given the text so far, guess the next piece of text<\/b>. It does that job well enough that answering questions, writing code and calling tools all fall out of it.<\/p>", "d": "<h3>Step 1: text becomes tokens<\/h3>\n<p>The model never sees letters. A fixed program called the tokenizer cuts text into tokens: common words are one token, and rare words or error codes are split into pieces. Each token becomes an integer ID.<\/p>\n<div class=\"fw\"><b>Firmware link:<\/b> it is a framing layer, like a USB packet or UART frame. The model can only \"speak\" in its own units. That is why it can struggle to count the letters in a word, because it never saw the letters.<\/div>\n<p>A common rule of thumb for English text is about 4 characters, or three quarters of a word, per token. Code and other languages use more tokens. <b>Everything is priced and limited in tokens.<\/b><\/p>\n\n<h3>Step 2: one forward pass gives probabilities<\/h3>\n<p>The model reads all the tokens so far and outputs a score (logit) for <i>every<\/i> token in its vocabulary. A softmax step turns those scores into a probability distribution: \"fail\" 41%, \"reset\" 21%, and so on.<\/p>\n<p>Inside, it is a transformer, a neural network whose attention layers let each token weigh every earlier token. You do not need the maths to build agents, but you should be able to say this sentence in an interview.<\/p>\n\n<h3>Step 3: pick one, append, repeat<\/h3>\n<p>One token is chosen (how is the next lesson), appended to the text, and the <b>whole thing runs again<\/b>. A 300-token reply means 300 passes. This explains three facts you will meet every day:<\/p>\n<ul>\n<li><b>Output is slower and pricier than input.<\/b> Input tokens are processed in one parallel pass. Output tokens are made one at a time, and providers price output tokens several times higher.<\/li>\n<li><b>Streaming is natural.<\/b> Each token exists as soon as it is chosen, so APIs can send them as they come.<\/li>\n<li><b>The model has no plan beyond the next token<\/b> unless it writes the plan out as text. That is why \"think step by step\" helps.<\/li>\n<\/ul>\n\n<h3>How a next-word guesser becomes an assistant<\/h3>\n<ol>\n<li><b>Pre-training<\/b>: predict the next token on trillions of tokens of text. The result is a \"base model\" that continues any text.<\/li>\n<li><b>Post-training<\/b>: further training on example conversations and on human (or AI) preference ratings, so it continues text <i>as a helpful assistant would<\/i>, follows instructions and emits tool calls in a set format.<\/li>\n<\/ol>\n<p>A chat is therefore still a document being continued: <code>[system rules] [user turn] [assistant turn] ...<\/code> with special marker tokens between the turns. The API hides the markers, but it is all one token sequence.<\/p>\n\n<h3>The mental model that keeps you out of trouble<\/h3>\n<div class=\"key\"><b>An LLM produces plausible text, not looked-up facts.<\/b> Plausible is usually correct for well-known things and often wrong for rare, recent or private things. Your engineering job is to feed it the right facts (RAG, tools) and to check what it outputs (schemas, evals).<\/div>", "anim": "nexttoken", "q": [{"q": "A reply is 400 tokens long. How many times does the model run its forward pass to produce it?", "o": ["Once", "About 400 times, once per output token", "4 times", "It depends on the temperature"], "a": 1, "w": "Generation is a loop: one pass per new token, each time over the whole text so far. Caching inside the provider makes the later passes cheaper, but it is still one token per step."}, {"q": "Why might an LLM miscount the letter \"r\" in \"strawberry\"?", "o": ["It is a bug in the tokenizer", "It sees tokens (chunks), not individual letters", "Temperature is too high", "Its context window is too small"], "a": 1, "w": "The word reaches the model as one or a few token IDs. Letter-level facts are not directly visible to it."}, {"q": "Which is usually priced higher per token?", "o": ["Input tokens", "Output tokens", "They are always equal", "Neither, pricing is per request"], "a": 1, "w": "Output tokens are produced one at a time, so providers charge several times more for them. Check your provider's pricing page for exact numbers."}], "th": [["Using only this lesson, explain to a colleague why an LLM can write a working C function but invent a wrong register address for your SoC.", "C functions are everywhere in the training text, so a plausible continuation is usually right. Your SoC's register map is rare or private, so a plausible-looking address is a guess. Give it the datasheet (RAG) or a lookup tool."]], "terms": ["token", "model", "tokenizer", "logits", "softmax", "prob", "transformer", "nn", "attention", "agent", "streaming", "api", "training", "ai", "tool", "toolcall", "llm", "rag", "schema", "eval"], "lab": null, "video": {"id": "a02-how-llms-generate", "t": "How a language model writes, one token at a time", "dur": "6:22"}}, {"id": "sampling", "ch": 1, "t": "Temperature, sampling, context window, cost and latency", "mins": 30, "why": "choose temperature and token limits on purpose, size a context window, and estimate cost and latency before you build.", "an": "<p>Picture a weighted die with one face per candidate token. <b>Temperature<\/b> changes the weights: near zero, one face is so heavy it almost always wins; turn it up and the other faces start winning more often.<\/p>\n<p>The <b>context window<\/b> is the microcontroller's RAM. Everything the model should consider in this call must fit: rules, history, documents and the reply itself. If it doesn't fit, it doesn't exist.<\/p>", "d": "<h3>Choosing the next token<\/h3>\n<ul>\n<li><b>Greedy decoding<\/b>: always take the top token. Repeatable for the same input, but can loop or sound flat.<\/li>\n<li><b>Sampling<\/b>: roll the die using the probabilities.<\/li>\n<li><b>Temperature<\/b> divides the logits before the softmax. Below 1 sharpens the distribution, above 1 flattens it.<\/li>\n<li><b>Top-p<\/b> keeps only the most likely tokens that together cover p (for example 0.9) and drops the long tail of weird options.<\/li>\n<\/ul>\n<p>Try it in the widget below: drag the temperature to 0.1 and sample several times (almost always the same token), then to 1.8 (variety, and nonsense creeps in).<\/p>\n<div class=\"key\"><b>Practical defaults:<\/b> use low temperature (0–0.3) for extraction, classification, tool-heavy agents and code. Use moderate temperature for brainstorming and writing. Two caveats: some reasoning models fix or ignore temperature, and even temperature 0 is <i>not guaranteed<\/i> to be identical run to run, because server-side batching and floating-point order vary. Design and test as if outputs vary, because they do.<\/div>\n\n<h3>The context window<\/h3>\n<p>Every model has a maximum context, today often 128k to 1M tokens for large hosted models. Three engineering consequences:<\/p>\n<ol>\n<li><b>Cost scales with input size on every call.<\/b> An agent that re-sends a 30k-token history at each of 10 steps pays for 300k input tokens.<\/li>\n<li><b>Bigger is not automatically better.<\/b> Research such as \"Lost in the Middle\" (Liu et al., 2023) found models use facts at the start and end of a long context better than facts buried in the middle. Curating context beats dumping everything in.<\/li>\n<li><b>Output is also capped<\/b> by max output tokens. If the reply hits the cap, the stop reason tells you it was cut off. Check it, especially for JSON, which becomes invalid when cut.<\/li>\n<\/ol>\n\n<h3>Latency: what users feel<\/h3>\n<ul>\n<li><b>TTFT<\/b> (time to first token) grows with input length and model size.<\/li>\n<li><b>Output speed<\/b> (tokens per second) multiplied by reply length gives the rest. A 500-token answer at 50 tokens/s adds 10 s.<\/li>\n<li>An agent's latency is the <b>sum of every model call and tool call<\/b> in its loop. Five steps of 3 s each is a 15 s task, which is why we stream progress and run independent steps in parallel.<\/li>\n<\/ul>\n<div class=\"fw\"><b>Firmware link:<\/b> this is a timing budget. Measure p50 and p95 (the time half and 95% of requests beat) per step, just like ISR latency, and give every step a timeout.<\/div>\n\n<h3>Cost: a back-of-envelope you should be able to do in an interview<\/h3>\n<p>cost per task = Σ over model calls of (input tokens × input price + output tokens × output price).<\/p>\n<p>Use the calculator in Chapter 10 with your provider's real prices. The point is the <b>shape<\/b>: agents multiply input tokens by the number of steps, so trimming context and cutting steps is usually the biggest lever.<\/p>", "anim": "ctxbudget", "lab": "Lab 01 (<code>labs/01-llm-basics<\/code>): implement softmax with temperature, top-p filtering and sampling, train a tiny bigram next-token model on a few device-log sentences, and estimate token cost.", "q": [{"q": "You need the model to extract fields from invoices into JSON. Which temperature makes most sense?", "o": ["0–0.3", "1.0", "1.5–2.0", "Temperature does not matter for JSON"], "a": 0, "w": "Extraction wants the most likely, consistent answer. Combine low temperature with structured output (next chapter)."}, {"q": "Your agent's replies sometimes end mid-JSON. What do you check first?", "o": ["The temperature", "The stop reason, which likely says the max output token limit was hit", "The tokenizer", "The embedding model"], "a": 1, "w": "A cut-off reply reports a \"max tokens\" or \"incomplete\" stop reason. Raise the limit, ask for shorter output, or use strict structured output."}, {"q": "Each step of an 8-step agent sends ~20k input tokens and gets ~300 output tokens. Roughly how many input tokens are billed per task?", "o": ["20k", "160k", "2.4k", "300"], "a": 1, "w": "8 × 20k = 160k input tokens. History re-sent at every step dominates agent cost, so prompt caching and trimming matter (Chapter 10)."}], "terms": ["token", "greedy", "sampling", "temp", "logits", "softmax", "topp", "tool", "agent", "reasoning", "model", "ctx", "lim", "maxtok", "stopreason", "json", "latency", "ttft", "toolcall", "slo", "params"], "th": [], "video": null}, {"id": "embed", "ch": 1, "t": "Embeddings and vector similarity: meaning as coordinates", "mins": 30, "why": "explain what an embedding is, compute cosine similarity by hand, and know when embedding search beats grep (and when it loses).", "an": "<p>Imagine a map where every sentence has GPS coordinates, and sentences that <i>mean<\/i> similar things are placed close together. \"USB device not detected\" sits next to \"host does not enumerate the gadget\", even though they share almost no words. A recipe sits in another city.<\/p>\n<p>An <b>embedding<\/b> is those coordinates: a list of numbers produced by an embedding model. Searching by meaning becomes \"find the nearest points on the map\".<\/p>", "d": "<h3>What it is, precisely<\/h3>\n<p>An embedding model takes text and returns a vector of a fixed size, often several hundred to a few thousand dimensions, for example <code>float v[1024]<\/code>. It was trained so that texts with similar meaning get vectors that point in similar directions.<\/p>\n<p>It is a different model from the chat LLM. It is smaller, cheaper and does one thing.<\/p>\n\n<h3>Measuring \"close\": cosine similarity<\/h3>\n<p>cos(a, b) = (a · b) / (|a| × |b|). The dot product is divided by both lengths, so only the <i>direction<\/i> counts. The result is 1 for the same direction, 0 for unrelated, and −1 for opposite.<\/p>\n<pre><code>import math\ndef cosine(a: list[float], b: list[float]) -> float:\n    dot = sum(x * y for x, y in zip(a, b))\n    return dot / (math.sqrt(sum(x*x for x in a)) * math.sqrt(sum(y*y for y in b)))\n\ncosine([1, 0], [1, 0])   # 1.0\ncosine([1, 0], [0, 1])   # 0.0\ncosine([3, 4], [6, 8])   # 1.0  (same direction, different length)<\/code><\/pre>\n<div class=\"py\"><b>Python note:<\/b> <code>zip(a, b)<\/code> walks two lists in lockstep, like two iterators advanced together. For real workloads you would use numpy: <code>a @ b / (norm(a) * norm(b))<\/code>. Many embedding APIs return vectors already scaled to length 1, and then cosine is just the dot product.<\/div>\n\n<h3>Getting real embeddings<\/h3>\n<pre><code>from openai import OpenAI\nclient = OpenAI()\nr = client.embeddings.create(model=EMBED_MODEL, input=[\"USB device not detected\", \"host won't enumerate\"])\nvecs = [d.embedding for d in r.data]<\/code><\/pre>\n<p>Other providers and open-weight embedding models work the same way: text in, vector out. <b>Rule:<\/b> vectors from different embedding models are not comparable. If you switch models, you re-embed everything.<\/p>\n\n<h3>Where embeddings shine, and where they fail<\/h3>\n<div class=\"tbl\"><table><tr><th>Good at<\/th><th>Bad at<\/th><\/tr>\n<tr><td>Paraphrases: \"won't charge\" ≈ \"fails to take power\"<\/td><td>Exact identifiers: error <code>-71<\/code>, part number <code>LT6911UXC<\/code>, a function name<\/td><\/tr>\n<tr><td>Cross-wording search over docs, tickets, logs<\/td><td>Negation and fine logic: \"supports USB 3\" vs \"does not support USB 3\" can land close<\/td><\/tr>\n<tr><td>Grouping and deduplicating similar items<\/td><td>Very short queries with little meaning to embed<\/td><\/tr><\/table><\/div>\n<p>That right-hand column is why production search is usually <b>hybrid<\/b> (embeddings plus keyword search), which is Chapter 4.<\/p>\n<div class=\"fw\"><b>Firmware link:<\/b> think of an embedding as a feature vector from a DSP front end, with similarity search as matched filtering. It is great at \"sounds like\", but you still need an exact-match path for IDs.<\/div>", "anim": "embed", "q": [{"q": "Two vectors are [2, 0] and [5, 0]. Their cosine similarity is…", "o": ["0.4", "1.0", "0", "2.5"], "a": 1, "w": "Same direction, so 1.0. Length does not matter for cosine."}, {"q": "Your team swapped to a newer embedding model for new documents only. Search quality collapsed. Why?", "o": ["The new model is worse", "Old and new vectors live in different \"maps\" and cannot be compared, so re-embed everything", "Cosine only works on short text", "The vector database is full"], "a": 1, "w": "Each embedding model defines its own coordinate system. Mixing them makes distances meaningless."}, {"q": "A user searches for \"error -71\". Pure embedding search returns generic USB articles. What is the usual fix?", "o": ["Higher temperature", "Add keyword search (BM25) and merge results: hybrid search", "Use bigger chunks", "Use a reasoning model"], "a": 1, "w": "Exact tokens like error codes are what keyword search is best at. Hybrid search merges both lists."}], "lab": "Lab 02 (<code>labs/02-embeddings<\/code>): implement cosine similarity and nearest-neighbour search over a small offline embedder, then (optionally) swap in a real embedding API.", "terms": ["embedding", "model", "vector", "dim", "llm", "cosine", "api", "openweight", "bm25"], "th": [], "video": {"id": "a03-embeddings", "t": "Embeddings: searching by meaning", "dur": "5:14"}}, {"id": "halluc", "ch": 1, "t": "Why models hallucinate, and what they are good and bad at", "mins": 25, "why": "predict where an LLM will fail, and pick the right mitigation (grounding, tools, schemas, evals) instead of hoping.", "an": "<p>Picture a brilliant colleague with no internet access and a habit: when they don't know something, they don't say \"I don't know\". They give the most plausible-sounding answer, confidently.<\/p>\n<p>That is not lying. It is exactly what a next-token predictor does when it has no real signal: it emits the most typical-looking continuation. That confident wrong answer is called a <b>hallucination<\/b>.<\/p>", "d": "<h3>Why it happens<\/h3>\n<ul>\n<li><b>The objective is plausibility.<\/b> Training rewards text that looks like the training data, not text that was checked.<\/li>\n<li><b>Rare and private facts are weakly stored.<\/b> Famous facts appear thousands of times; your SoC's errata appear zero times.<\/li>\n<li><b>Knowledge cutoff.<\/b> The model knows nothing newer than its training data unless you supply it.<\/li>\n<li><b>Pressure to answer.<\/b> Assistant-style training often makes answering more likely than refusing.<\/li>\n<\/ul>\n\n<h3>The reliability map<\/h3>\n<div class=\"tbl\"><table><tr><th>Usually strong<\/th><th>Usually weak without help<\/th><\/tr>\n<tr><td>Summarising and rewriting text you provide<\/td><td>Exact facts it was not given: versions, prices, register addresses<\/td><\/tr>\n<tr><td>Extracting fields into a schema<\/td><td>Arithmetic on long numbers, counting<\/td><\/tr>\n<tr><td>Writing common code and explaining errors<\/td><td>Recent events after the cutoff<\/td><\/tr>\n<tr><td>Classifying, routing, choosing a tool<\/td><td>Long chains of steps with no checking<\/td><\/tr>\n<tr><td>Following a clear format with examples<\/td><td>Knowing when it does not know<\/td><\/tr><\/table><\/div>\n\n<h3>Mitigations that work (in order of power)<\/h3>\n<ol>\n<li><b>Grounding<\/b>: put the real source text in the prompt (RAG) and require citations of chunk IDs. Then <i>verify the citations exist<\/i> in code.<\/li>\n<li><b>Tools for facts and maths<\/b>: let the model call <code>get_device_status()<\/code> or a calculator instead of remembering.<\/li>\n<li><b>Allow \"I don't know\"<\/b> explicitly in instructions, and make it an allowed value in the schema (for example <code>\"answer\": null, \"reason\": \"not in sources\"<\/code>).<\/li>\n<li><b>Structured output and validation<\/b>, so malformed or out-of-range answers are caught by code.<\/li>\n<li><b>Evals<\/b> that measure the hallucination rate on your own cases (Chapter 8), so you know whether a change helped.<\/li>\n<\/ol>\n<div class=\"warn\"><b>What does NOT reliably work:<\/b> writing \"do not hallucinate\" in the prompt, or asking the model \"are you sure?\" and trusting the answer. Checks must come from outside the model: sources, tools, validators and tests.<\/div>\n<div class=\"fw\"><b>Firmware link:<\/b> treat model output like data from an untrusted bus. Bounds-check it, validate it and never act on it blindly, just as you never trust a descriptor length from the wire.<\/div>", "q": [{"q": "Which is the strongest defence against an agent inventing a device's firmware version?", "o": ["\"Never make things up\" in the system prompt", "A get_device_status tool and an instruction to report only tool results", "Lower temperature", "A bigger model"], "a": 1, "w": "Give it a source of truth. Prompts and temperature reduce the problem but don't remove it."}, {"q": "An answer cites chunk \"doc-7#3\", but your retrieval only returned doc-2 and doc-5. What should your code do?", "o": ["Trust it; the model knows", "Flag or reject the answer: the citation is fabricated", "Raise the temperature and retry", "Nothing"], "a": 1, "w": "Citations are checkable. Verifying them in code is a cheap, strong guard."}], "th": [["List three tasks in your current firmware job where an LLM would be reliable, and three where it would need tools or grounding.", "Reliable: summarising a long dmesg, drafting a commit message from a diff, explaining a compiler error. Needs help: the exact DWC3 register for a quirk (datasheet RAG), the build status of a branch (CI tool), whether a fix is in release 3.8.1 (release-notes search)."]], "terms": ["training", "cutoff", "model", "schema", "routing", "tool", "grounding", "prompt", "rag", "citation", "chunk", "structured", "eval", "halluc", "token"], "anim": null, "lab": null, "video": null}, {"id": "apis", "ch": 2, "t": "Calling an LLM API: messages, roles, streaming", "mins": 35, "why": "make a real call to the OpenAI and Anthropic APIs, hold a multi-turn conversation, stream output and read the stop reason.", "an": "<p>Calling an LLM is like a stateless RPC to a very smart server that has amnesia. Each request must carry the whole conversation so far, every time. There is no \"session\" on its side unless you use a feature that stores it for you.<\/p>\n<p>The request is a <b>transcript<\/b>: lines tagged with who said them (system, user, assistant, tool). The reply is the next line.<\/p>", "d": "<h3>Message roles<\/h3>\n<ul>\n<li><b>system<\/b> (called <code>instructions<\/code> in OpenAI's Responses API, <code>system<\/code> in Anthropic's Messages API) holds your rules: role, tone, format, what tools are for. Users don't see it.<\/li>\n<li><b>user<\/b> is what the person typed.<\/li>\n<li><b>assistant<\/b> holds the model's previous replies, which you resend.<\/li>\n<li><b>tool<\/b> results are what your code sends back after running a tool (Chapter 3).<\/li>\n<\/ul>\n\n<h3>Your first call, two providers<\/h3>\n<pre><code># pip install openai   ;  export OPENAI_API_KEY=...\nfrom openai import OpenAI\nclient = OpenAI()\nresp = client.responses.create(\n    model=MODEL,                      # pick a current model name from the provider's model list\n    instructions=\"You are a terse firmware assistant.\",\n    input=\"What does USB error -71 usually mean on Linux?\",\n)\nprint(resp.output_text)<\/code><\/pre>\n<pre><code># pip install anthropic ;  export ANTHROPIC_API_KEY=...\nimport anthropic\nclient = anthropic.Anthropic()\nmsg = client.messages.create(\n    model=MODEL, max_tokens=500,\n    system=\"You are a terse firmware assistant.\",\n    messages=[{\"role\": \"user\", \"content\": \"What does USB error -71 usually mean on Linux?\"}],\n)\nprint(msg.content[0].text, msg.stop_reason)<\/code><\/pre>\n<div class=\"py\"><b>Python note:<\/b> <code>OpenAI()<\/code> reads the key from the environment, so never paste keys into code. <code>MODEL<\/code> is a string such as the provider's current model ID. We deliberately don't hard-code one because names change every few months.<\/div>\n\n<h3>Multi-turn: you keep the history<\/h3>\n<pre><code>history = [{\"role\": \"user\", \"content\": \"My bar fails to enumerate.\"}]\nreply = call_model(history)                       # your wrapper around either SDK\nhistory.append({\"role\": \"assistant\", \"content\": reply})\nhistory.append({\"role\": \"user\", \"content\": \"It only happens after suspend.\"})\nreply = call_model(history)                       # the model sees all 3 messages<\/code><\/pre>\n<p>OpenAI's Responses API can also store the conversation server-side (<code>previous_response_id<\/code>), which saves resending. Knowing that the model itself is stateless is still what lets you debug, trim and test conversations.<\/p>\n\n<h3>Streaming<\/h3>\n<pre><code># Anthropic\nwith client.messages.stream(model=MODEL, max_tokens=500, messages=history) as s:\n    for text in s.text_stream:\n        print(text, end=\"\", flush=True)\n\n# OpenAI Responses\nfor event in client.responses.create(model=MODEL, input=\"...\", stream=True):\n    if event.type == \"response.output_text.delta\":\n        print(event.delta, end=\"\", flush=True)<\/code><\/pre>\n<p>Under the hood this is SSE (server-sent events): one HTTP response that keeps delivering small chunks. Streaming cuts <i>perceived<\/i> latency, since the first words appear at TTFT, but not total time.<\/p>\n\n<h3>Read the reply's metadata, every time<\/h3>\n<ul>\n<li><b>Stop reason<\/b>: finished, hit max tokens, or wants a tool.<\/li>\n<li><b>Usage<\/b>: input and output token counts. Log them for cost tracking.<\/li>\n<li><b>Errors<\/b>: 429 means rate limited (retry with backoff); 5xx means a provider problem (retry); 400 means your request is wrong (do not retry).<\/li>\n<\/ul>\n<div class=\"key\"><b>Engineering habit:<\/b> wrap the SDK in one small function of your own (<code>call_model(messages, tools, schema)<\/code>). Tests can swap in a fake, you can switch providers, and retries and logging live in one place. Every lab in this course does this.<\/div>", "q": [{"q": "Your chatbot \"forgets\" what the user said two turns ago. Most likely cause?", "o": ["The model's memory is full", "Your code isn't resending the earlier messages", "Temperature too low", "The tokenizer dropped them"], "a": 1, "w": "The API is stateless. If you don't send the history (or use a server-side conversation feature), the model never sees it."}, {"q": "The API returns HTTP 400. Should you retry automatically?", "o": ["Yes, with backoff", "No: the request itself is invalid, so fix it", "Yes, immediately, 10 times", "Only at night"], "a": 1, "w": "4xx (except 429, and sometimes 408) means your request is wrong; retrying sends the same bad request. Retry 429 and 5xx with backoff."}, {"q": "What does streaming improve?", "o": ["Total generation time", "Time until the user sees the first words", "Accuracy", "Cost"], "a": 1, "w": "The total time is the same, but users see progress at TTFT instead of waiting for the end."}], "lab": "Lab 03 (<code>labs/03-llm-api-structured<\/code>) builds your provider-agnostic <code>call_model()<\/code> wrapper with a fake backend, plus real OpenAI/Anthropic adapters you can switch on with an environment variable.", "terms": ["roles", "api", "tool", "model", "stateless", "streaming", "sse", "http", "chunk", "latency", "ttft", "metafilter", "stopreason", "token", "ratelimit", "retry", "backoff", "sdk", "llm"], "th": [], "anim": null, "video": {"id": "a04-calling-a-model", "t": "Calling a model API, and getting reliable output", "dur": "5:09"}}, {"id": "structured", "ch": 2, "t": "Structured output: making the model fill in a form", "mins": 30, "why": "get machine-readable JSON reliably using schemas, strict modes, validation and a repair loop.", "an": "<p>Ask a new hire to \"write up the bug\" and you get an essay. Hand them a form with labelled boxes (severity, component, summary) and you get something the next system can process.<\/p>\n<p><b>Structured output<\/b> is the form: you give the model a JSON Schema and it must reply with JSON that fits. It is how LLM output becomes input to normal code.<\/p>", "d": "<h3>Three levels of \"please reply in JSON\"<\/h3>\n<ol>\n<li><b>Ask nicely<\/b> in the prompt and parse. This works most of the time, which is not good enough: you will get prose around the JSON, trailing commas, or missing fields.<\/li>\n<li><b>JSON mode<\/b> guarantees syntactically valid JSON, but not your fields.<\/li>\n<li><b>Schema-constrained (strict) output<\/b>: the provider constrains generation so only tokens that keep the JSON valid against your schema can be picked. This is the best option when your provider and schema support it.<\/li>\n<\/ol>\n\n<h3>Define once with Pydantic, use everywhere<\/h3>\n<pre><code>from typing import Literal\nfrom pydantic import BaseModel, Field\n\nclass Triage(BaseModel):\n    severity: Literal[\"low\", \"medium\", \"high\"]\n    component: Literal[\"usb\", \"camera\", \"audio\", \"network\", \"other\"]\n    summary: str = Field(description=\"One sentence, under 25 words\")\n    needs_human: bool<\/code><\/pre>\n<pre><code># OpenAI: parse straight into the class\nresp = client.responses.parse(model=MODEL, input=log_text, text_format=Triage)\nt: Triage = resp.output_parsed\n\n# Anthropic: pass the JSON Schema in output_config\nmsg = client.messages.create(model=MODEL, max_tokens=400, messages=[{\"role\": \"user\", \"content\": log_text}],\n    output_config={\"format\": {\"type\": \"json_schema\", \"schema\": Triage.model_json_schema()}})\nt = Triage.model_validate_json(msg.content[0].text)<\/code><\/pre>\n<p>Strict modes support only part of JSON Schema. Each provider documents its limits (for example, which keywords are allowed and that all fields must be required). Keep schemas simple: flat objects, enums and short descriptions.<\/p>\n\n<h3>Always validate anyway, and repair once<\/h3>\n<pre><code>def get_structured(messages, model_cls, retries=2):\n    for attempt in range(retries + 1):\n        text = call_model(messages)\n        try:\n            return model_cls.model_validate_json(text)\n        except ValidationError as e:\n            messages = messages + [\n                {\"role\": \"assistant\", \"content\": text},\n                {\"role\": \"user\", \"content\": f\"That JSON was invalid: {e}. Reply with corrected JSON only.\"}]\n    raise RuntimeError(\"model never produced valid output\")<\/code><\/pre>\n<div class=\"fw\"><b>Firmware link:<\/b> this is a CRC check plus a NAK (negative acknowledgement) and resend, with a retry limit, so a bad sender cannot hang you.<\/div>\n\n<h3>Schema design tips that change results<\/h3>\n<ul>\n<li><b>Enums beat free text<\/b> for anything code will branch on.<\/li>\n<li><b>Field descriptions are prompt text.<\/b> The model reads them, so write them carefully.<\/li>\n<li><b>Order matters.<\/b> Put a short <code>reasoning<\/code> field <i>before<\/i> the decision field if you want the model to think before choosing, because generation runs left to right.<\/li>\n<li><b>Allow \"unknown\"<\/b> (a null or an <code>\"other\"<\/code> enum) so the model is not forced to invent.<\/li>\n<\/ul>", "anim": "structured", "q": [{"q": "JSON mode is on, but your code crashes because \"component\" is missing. Why?", "o": ["JSON mode is broken", "JSON mode guarantees valid JSON syntax, not your schema's fields", "Temperature too high", "The model is too small"], "a": 1, "w": "Use schema-constrained output where available, and always validate with Pydantic."}, {"q": "You want the model to weigh evidence before picking severity. Where do you put a \"reasoning\" field?", "o": ["After severity", "Before severity", "In a separate call", "Nowhere; reasoning is hidden"], "a": 1, "w": "Generation goes left to right, so a reasoning field before the decision lets the decision depend on it. (Reasoning models also think internally.)"}], "lab": "Lab 03 tests: validate fake-model outputs against a Pydantic schema and implement the repair loop (invalid JSON → error message → corrected reply).", "terms": ["json", "prompt", "schema", "token", "pydantic", "retry", "model", "llm", "structured"], "th": [], "video": null}, {"id": "prompting", "ch": 2, "t": "Prompt and context engineering that actually works", "mins": 35, "why": "write system prompts and tool descriptions that measurably improve results, and know which \"prompt tricks\" are folklore.", "an": "<p>A prompt is a work order for a contractor who is brilliant, literal and has never been to your site. Vague orders get confident guesses. Good orders state the goal, the constraints, what \"done\" looks like, and include an example of a finished job.<\/p>\n<p><b>Context engineering<\/b> is the larger job: deciding what goes into the context window on each call, including instructions, tools, retrieved facts and trimmed history.<\/p>", "d": "<h3>A system prompt template that works<\/h3>\n<pre><code>You are a USB-stack triage assistant for HP Poly video bars.\n\nGoal: given kernel logs, identify the most likely failing component and next diagnostic step.\n\nRules:\n- Use only the log lines and tool results provided. If evidence is missing, say what you need.\n- Never suggest flashing firmware; a human does that.\n- Quote the exact log lines that support your conclusion.\n\nOutput: JSON matching the provided schema. Keep \"summary\" under 25 words.\n\nExample:\nInput: \"dwc3 a600000.usb: timed out waiting for SETUP phase\"\nOutput: {\"component\": \"usb\", \"severity\": \"high\", \"summary\": \"Device controller stuck before control transfer\", ...}<\/code><\/pre>\n<p>Notice the parts: <b>role, goal, rules (including what to do when unsure), output format, one example<\/b>.<\/p>\n\n<h3>Techniques with real evidence behind them<\/h3>\n<ul>\n<li><b>Be specific and explicit.<\/b> State length, audience, format and what to avoid. This is the biggest win.<\/li>\n<li><b>Few-shot examples<\/b>: 1–5 short, varied examples of input and output. Make them vary, or the model copies their quirks.<\/li>\n<li><b>Give it room to think<\/b> on multi-step problems: \"first list the relevant log lines, then conclude\". This is chain of thought. Reasoning models do it internally, so don't micro-manage them.<\/li>\n<li><b>Separate instructions from data<\/b> with clear delimiters (XML-style tags like <code>&lt;logs&gt;...&lt;/logs&gt;<\/code> are common). This helps quality and is a small, partial safety aid (Chapter 9).<\/li>\n<li><b>Put long documents first and the question last<\/b> in very long prompts. Providers recommend this for long-context use.<\/li>\n<li><b>Prompt chaining<\/b>: split a hard task into steps with code checks in between, instead of one mega-prompt.<\/li>\n<\/ul>\n<h3>Folklore to ignore<\/h3>\n<ul><li>Bribes, threats, \"you are the world's best expert\", or ALL CAPS shouting. Results are inconsistent, and modern models over-react to shouting.<\/li>\n<li>Trusting a prompt change because one example looked better. <b>Measure it on an eval set<\/b> (Chapter 8).<\/li><\/ul>\n\n<h3>Tool descriptions are prompts too<\/h3>\n<p>When the model picks the wrong tool, the fix is usually the tool's name, description or parameter descriptions, not the system prompt. Compare:<\/p>\n<pre><code>BAD : name=\"query\", description=\"Runs a query\"\nGOOD: name=\"search_device_logs\",\n      description=\"Search kernel/app logs of ONE device by regex. Use for questions about errors,\n                   reboots or crashes on a specific unit. Returns at most 50 matching lines, newest first.\",\n      parameters: unit_id (integer, the unit's serial-suffix ID), pattern (regex), since (ISO time, optional)<\/code><\/pre>\n\n<h3>Context engineering: the agent-era skill<\/h3>\n<p>In an agent, the context is rebuilt on every step. Decide deliberately:<\/p>\n<ul><li>Which tools are visible <i>now<\/i>? Fewer, well-described tools mean better choices.<\/li>\n<li>How much history to keep, and when to summarise older turns (compaction)?<\/li>\n<li>Which retrieved chunks, how many, and in what order?<\/li>\n<li>What state to inject: the plan, the step count, what has been tried already.<\/li><\/ul>\n<div class=\"fw\"><b>Firmware link:<\/b> this is like deciding what goes in a tiny SRAM on every context switch. Load what this step needs and evict the rest.<\/div>", "q": [{"q": "Your agent keeps calling <code>reboot_device<\/code> when users ask about logs. Best first fix?", "o": ["Add \"DON'T REBOOT!!!\" to the system prompt", "Rewrite both tools' names and descriptions to state exactly when to use each, and gate reboot behind approval", "Raise temperature", "Switch frameworks"], "a": 1, "w": "Tool selection is driven by the tool descriptions. Destructive tools should also need approval regardless of wording."}, {"q": "You changed the prompt and three examples look better. What next?", "o": ["Ship it", "Run the eval set and compare pass rates with the old prompt", "Ask the model if it is better", "Increase max tokens"], "a": 1, "w": "Three examples are anecdotes. A golden set shows whether it helped overall and whether anything broke."}], "th": [["Rewrite this vague prompt: \"Summarise this log.\"", "\"You are a firmware engineer's assistant. Summarise the kernel log below for an on-call engineer in at most 5 bullet points: the first error, the subsystem, any repeated pattern with counts, and the last state before reboot. Quote exact lines. If no error is present, say so. &lt;log&gt;...&lt;/log&gt;\""]], "terms": ["sysprompt", "prompt", "roles", "state", "fewshot", "model", "cot", "reasoning", "chaining", "eval", "tool", "ctxeng", "agent", "compaction", "chunk", "ctx"], "anim": null, "lab": null, "video": null}, {"id": "tools", "ch": 3, "t": "Tool calling: letting the model ask your code to act", "mins": 35, "why": "define tools with JSON Schema, run the request → execute → return loop with both major APIs, and handle tool errors properly.", "an": "<p>The model is a dispatcher on the radio. It cannot touch anything. It can only say \"Unit 4, check the pressure gauge at site 17.\" A <b>technician<\/b> (your code) does the actual work and radios back the reading.<\/p>\n<p><b>Tool calling<\/b> (also called function calling) is that radio protocol: the model replies with a structured request to call one of the functions you listed, your code runs it, and you send the result back.<\/p>", "d": "<h3>The four moves<\/h3>\n<ol><li><b>Describe<\/b> each tool: name, description and a JSON Schema for its arguments.<\/li>\n<li><b>The model requests<\/b>: instead of text, it returns <code>name + arguments<\/code> and the stop reason says \"tool use\".<\/li>\n<li><b>You execute<\/b>: validate arguments, check permissions, run the function, catch errors.<\/li>\n<li><b>You return<\/b> the result as a tool message and call the model again.<\/li><\/ol>\n\n<h3>OpenAI Responses API<\/h3>\n<pre><code>tools = [{\n  \"type\": \"function\", \"name\": \"get_device_status\",\n  \"description\": \"Get online state and firmware version of one device.\",\n  \"parameters\": {\"type\": \"object\",\n                 \"properties\": {\"device_id\": {\"type\": \"integer\"}},\n                 \"required\": [\"device_id\"], \"additionalProperties\": False},\n}]\ninputs = [{\"role\": \"user\", \"content\": \"Is device 42 online?\"}]\nresp = client.responses.create(model=MODEL, input=inputs, tools=tools)\nfor item in resp.output:\n    if item.type == \"function_call\":\n        args = json.loads(item.arguments)               # arguments arrive as a JSON string\n        result = get_device_status(**args)\n        inputs += [item, {\"type\": \"function_call_output\", \"call_id\": item.call_id,\n                          \"output\": json.dumps(result)}]\nresp = client.responses.create(model=MODEL, input=inputs, tools=tools)\nprint(resp.output_text)<\/code><\/pre>\n\n<h3>Anthropic Messages API<\/h3>\n<pre><code>tools = [{\"name\": \"get_device_status\", \"description\": \"Get online state and firmware version of one device.\",\n          \"input_schema\": {\"type\": \"object\", \"properties\": {\"device_id\": {\"type\": \"integer\"}}, \"required\": [\"device_id\"]}}]\nmsgs = [{\"role\": \"user\", \"content\": \"Is device 42 online?\"}]\nr = client.messages.create(model=MODEL, max_tokens=500, tools=tools, messages=msgs)\nif r.stop_reason == \"tool_use\":\n    msgs.append({\"role\": \"assistant\", \"content\": r.content})   # keep the model's tool request\n    results = [{\"type\": \"tool_result\", \"tool_use_id\": b.id, \"content\": json.dumps(get_device_status(**b.input))}\n               for b in r.content if b.type == \"tool_use\"]\n    msgs.append({\"role\": \"user\", \"content\": results})\n    r = client.messages.create(model=MODEL, max_tokens=500, tools=tools, messages=msgs)<\/code><\/pre>\n<div class=\"py\"><b>Python note:<\/b> <code>get_device_status(**args)<\/code> unpacks a dict into keyword arguments, so <code>{\"device_id\": 42}<\/code> becomes <code>device_id=42<\/code>.<\/div>\n<p>The shapes differ slightly, but the protocol is identical. Both can request <b>several tool calls in one reply<\/b> (parallel calls). Run independent ones concurrently and return every result, matched by its ID.<\/p>\n\n<h3>Handling failure like an engineer<\/h3>\n<ul>\n<li><b>Bad arguments<\/b>: validate against the schema. On failure, return the error <i>to the model<\/i> as the tool result (\"device_id must be an integer\"). Models usually self-correct on the next turn.<\/li>\n<li><b>Tool crashed or timed out<\/b>: return a short error result (and set the error flag if the API has one). Don't crash the whole agent, and don't hide the error.<\/li>\n<li><b>Huge results<\/b>: truncate or summarise before returning. A 2 MB log in the context window costs money and buries the signal.<\/li>\n<li><b>Dangerous tools<\/b> (write, delete, flash, pay, send): require human approval or a policy check in code (Chapter 9).<\/li>\n<\/ul>\n<div class=\"fw\"><b>Firmware link:<\/b> a tool is an ioctl. Validate every argument from user space, return error codes instead of panicking, and keep the dangerous ioctls behind a capability check.<\/div>\n\n<h3>Tool design checklist<\/h3>\n<ul><li>Use few, well-named tools with clear boundaries. Ten overlapping tools confuse the model.<\/li>\n<li>Write descriptions that say <i>when<\/i> to use each tool and what it returns.<\/li>\n<li>Prefer IDs and enums over free text in arguments.<\/li>\n<li>Return compact, structured results, with the next useful ID included.<\/li>\n<li>Make write tools <b>idempotent<\/b> where possible (pass a request ID), because retries happen.<\/li><\/ul>", "anim": "toolcall", "q": [{"q": "The model requests <code>get_device_status({\"device_id\": \"forty-two\"})<\/code>. What should your code do?", "o": ["Crash", "Guess 42", "Return a tool result saying device_id must be an integer, and let the model retry", "Silently skip the call"], "a": 2, "w": "Validation errors go back to the model as the tool result. It sees the error and corrects itself."}, {"q": "Who executes the tool?", "o": ["The provider's servers", "The model", "Your application code", "The user"], "a": 2, "w": "With custom function tools, your code runs them. (Providers also offer some hosted tools, such as web search, that run on their side.)"}, {"q": "The model returned two tool calls in one reply. What must you send back?", "o": ["Only the first result", "Both results, each matched to its call ID", "A new user message", "Nothing until the user replies"], "a": 1, "w": "Every tool request needs a matching result, linked by its ID, or the next API call fails or the model gets confused."}], "lab": "Lab 04 (<code>labs/04-tool-calling<\/code>): build a tool registry that generates JSON Schema from Python type hints, validates arguments, and turns exceptions into tool-error results.", "terms": ["tool", "json", "schema", "model", "stopreason", "api", "toolcall", "agent", "ctx", "compaction", "idem", "retry"], "th": [], "video": {"id": "a05-tool-calling", "t": "Tool calling: how a model asks your code to act", "dur": "3:49"}}, {"id": "loop", "ch": 3, "t": "The agent loop, from scratch, with no framework", "mins": 45, "why": "write a complete, safe agent loop in about 60 lines: tools, state, step and cost limits, tracing and a final answer.", "an": "<p>Every firmware main loop looks the same: read inputs, decide, act, repeat until told to stop, with a watchdog in case something hangs.<\/p>\n<p>An agent is the same main loop with an LLM doing the \"decide\" step: <b>call the model → if it requested tools, run them and append the results → call the model again → stop when it gives a final answer or a limit is hit.<\/b> Everything else is detail.<\/p>", "d": "<h3>The whole thing<\/h3>\n<pre><code>from dataclasses import dataclass, field\n\n@dataclass\nclass AgentState:\n    messages: list = field(default_factory=list)\n    steps: int = 0\n    tokens: int = 0\n    trace: list = field(default_factory=list)\n\ndef run_agent(goal: str, llm, tools: dict, max_steps=8, max_tokens=50_000) -> str:\n    s = AgentState(messages=[{\"role\": \"system\", \"content\": SYSTEM},\n                             {\"role\": \"user\", \"content\": goal}])\n    while True:\n        if s.steps >= max_steps:   return \"Stopped: step limit reached. Partial findings: ...\"\n        if s.tokens >= max_tokens: return \"Stopped: token budget reached.\"\n        reply = llm(s.messages, tools=[t.schema for t in tools.values()])\n        s.steps += 1; s.tokens += reply.usage\n        s.messages.append(reply.as_message())\n        if not reply.tool_calls:                       # no tool requested: this is the answer\n            s.trace.append((\"final\", reply.text))\n            return reply.text\n        for call in reply.tool_calls:                  # run every requested tool\n            tool = tools.get(call.name)\n            try:\n                out = tool.run(**call.args) if tool else f\"error: unknown tool {call.name}\"\n            except Exception as e:\n                out = f\"error: {type(e).__name__}: {e}\"\n            s.trace.append((\"tool\", call.name, call.args, str(out)[:200]))\n            s.messages.append({\"role\": \"tool\", \"tool_call_id\": call.id, \"content\": str(out)[:4000]})<\/code><\/pre>\n<div class=\"py\"><b>Python note:<\/b> <code>field(default_factory=list)<\/code> gives each AgentState its own new list. A plain <code>= []<\/code> default would be shared between instances (the mutable-default gotcha).<\/div>\n\n<h3>What each line protects you from<\/h3>\n<ul>\n<li><b>max_steps<\/b>: a model that keeps calling tools forever. This is the watchdog.<\/li>\n<li><b>Token or cost budget<\/b>: a runaway bill. Every step re-sends the history.<\/li>\n<li><b>Unknown tool / exception → error string<\/b>: one bad call doesn't kill the run, and the model can recover.<\/li>\n<li><b>Truncating results<\/b>: one huge tool output blowing the context window.<\/li>\n<li><b>trace<\/b>: the ability to answer \"why did it do that?\" later (Chapter 8).<\/li>\n<\/ul>\n\n<h3>Stopping conditions, completely<\/h3>\n<ol><li><b>Natural<\/b>: the model replies with no tool calls.<\/li>\n<li><b>Hard limits<\/b>: steps, tokens or cost, and wall-clock time.<\/li>\n<li><b>Explicit<\/b>: a <code>finish(answer)<\/code> tool. This is useful when you need the final answer in a structured shape.<\/li>\n<li><b>External<\/b>: the user cancels, or a human rejects an approval.<\/li>\n<li><b>Loop detection<\/b>: the same tool with the same arguments three times in a row means stop or nudge.<\/li><\/ol>\n<p>When a hard limit fires, return what was learned so far plus \"stopped because…\". Don't return a silent failure.<\/p>\n\n<h3>Why build it by hand first?<\/h3>\n<p>Every framework (LangGraph, OpenAI Agents SDK and the rest) is this loop with extras: persistence, tracing UI, handoffs. Interviewers regularly ask you to write it on a whiteboard, and when a framework misbehaves you need to know what it is doing underneath.<\/p>\n<div class=\"fw\"><b>Firmware link:<\/b> <code>while(1){ read(); decide(); act(); kick_watchdog(); }<\/code>. The LLM is the decide() call, and you still own the watchdog.<\/div>", "anim": "agentloop", "q": [{"q": "Which line most directly prevents an infinite agent loop?", "o": ["Truncating tool output", "The max_steps check", "The system prompt", "Catching exceptions"], "a": 1, "w": "A hard step limit is the watchdog. Pair it with a token or cost budget and a time limit."}, {"q": "A tool raises an exception mid-run. Best behaviour?", "o": ["Crash the agent", "Return the error text as the tool result so the model can adapt, and record it in the trace", "Retry forever", "Hide it and return an empty string"], "a": 1, "w": "Errors are information. The model often tries a different approach, and the trace keeps the evidence."}, {"q": "The step limit is reached. What should the agent return?", "o": ["Nothing", "An exception with no context", "The partial findings plus a clear \"stopped because step limit\" message", "A random answer"], "a": 2, "w": "Fail loudly but usefully. Partial results with a reason are far better than silence."}], "lab": "Lab 05 (<code>labs/05-agent-from-scratch<\/code>): implement this loop against a scripted fake LLM. Tests check final answers, step limits, unknown-tool handling, exceptions, loop detection and the trace.", "video": {"id": "a06-agent-loop", "t": "The agent loop, and the guard rails that make it safe", "dur": "5:25"}, "terms": ["model", "tool", "token", "ctx", "trace", "stopcond", "toolcall", "framework", "langgraph", "oaisdk", "agent", "sdk", "handoff", "llm"], "th": []}, {"id": "patterns", "ch": 3, "t": "Workflows vs agents, and the patterns that matter", "mins": 35, "why": "choose between a fixed workflow and an agent, and name and sketch prompt chaining, routing, parallelisation, orchestrator-workers, evaluator-optimiser, ReAct and plan-and-execute.", "an": "<p>An <b>assembly line<\/b> is fast, cheap and predictable, but it only builds one thing. A <b>craftsman<\/b> handles anything, but is slower and you cannot predict exactly what they will do.<\/p>\n<p>LLM systems sit on that same spectrum. A workflow is the assembly line: your code decides the path and the LLM fills in steps. An agent is the craftsman: the LLM decides the path. <b>Start as far toward the assembly line as the problem allows.<\/b><\/p>", "d": "<p>This lesson follows the vocabulary of Anthropic's widely cited engineering post <i>Building effective agents<\/i> (December 2024). Interviewers use these names.<\/p>\n<h3>Workflow patterns (your code controls the flow)<\/h3>\n<ul>\n<li><b>Prompt chaining<\/b>: step A's output feeds step B, with code checks between steps. Example: extract errors from the log → classify them → draft the ticket.<\/li>\n<li><b>Routing<\/b>: a cheap classifier picks the handler. Example: \"billing\" → billing prompt, \"USB\" → firmware prompt with log tools. Easy requests can go to a small model.<\/li>\n<li><b>Parallelisation<\/b>: run independent calls at once and combine them. Example: three reviewers check security, style and correctness in parallel; or run the same check three times and vote.<\/li>\n<li><b>Orchestrator-workers<\/b>: an LLM splits a task into subtasks it decides at run time, workers do them, and it merges the results. This is the bridge to multi-agent (Chapter 7).<\/li>\n<li><b>Evaluator-optimiser<\/b>: one call drafts, another critiques against criteria, and you loop until it passes or hits a limit. This is also called reflection.<\/li>\n<\/ul>\n\n<h3>Agent patterns (the LLM controls the flow)<\/h3>\n<ul>\n<li><b>ReAct<\/b> (Yao et al., 2022): alternate a short thought, an action (tool call) and an observation. Modern tool-calling APIs are essentially ReAct built in. The loop you just wrote <i>is<\/i> a ReAct agent.<\/li>\n<li><b>Plan-and-execute<\/b>: first produce an explicit plan (a list of steps), then execute the steps, re-planning when one fails. You get a visible plan a human can approve, fewer expensive \"big model\" calls (a cheaper model can execute steps), and easier progress tracking.<\/li>\n<\/ul>\n<pre><code>plan = llm_structured(f\"Goal: {goal}. Write 3-6 concrete steps.\", schema=Plan)\nfor step in plan.steps:\n    result = run_agent(step.description, llm, tools, max_steps=4)   # small ReAct loop per step\n    done.append((step, result))\n    if \"error\" in result.lower():\n        plan = replan(goal, done)                                     # adjust the remaining steps<\/code><\/pre>\n\n<h3>Choosing: the questions to ask<\/h3>\n<div class=\"tbl\"><table><tr><th>Question<\/th><th>If yes → lean to…<\/th><\/tr>\n<tr><td>Can I write the steps down in advance?<\/td><td>Workflow<\/td><\/tr>\n<tr><td>Do the steps depend on what earlier steps found?<\/td><td>Agent<\/td><\/tr>\n<tr><td>Is a wrong action costly or irreversible?<\/td><td>Workflow, or agent with approvals<\/td><\/tr>\n<tr><td>Is latency or cost tight?<\/td><td>Workflow (fewer calls)<\/td><\/tr>\n<tr><td>Is the input space open-ended (any question about any device)?<\/td><td>Agent<\/td><\/tr><\/table><\/div>\n<div class=\"key\"><b>Interview line:<\/b> \"I start with the simplest thing: one well-prompted call with retrieval. I add workflow steps when I can see a fixed structure, and I make it an agent only where the path truly depends on intermediate results. Then I measure each step's value with evals.\"<\/div>\n<div class=\"fw\"><b>Firmware link:<\/b> a workflow is a fixed state machine. An agent is a state machine whose transition function is an LLM. You would never let the LLM choose transitions on a safety path without guards, and the same applies here.<\/div>", "anim": "flow", "animdata": {"title": "Evaluator-optimiser in action", "items": [["Draft", "Generator writes a release note from the commit list."], ["Critique", "Evaluator checks against criteria: every user-visible change listed, no internal jargon, under 150 words. Result: \"missing the USB fix in commit a1b2\"."], ["Revise", "Generator revises using the critique."], ["Re-check", "Evaluator passes it, or the loop stops after 3 rounds and flags a human."]]}, "q": [{"q": "Support tickets fall into 4 known categories, each with a fixed handling procedure. Best design?", "o": ["A fully autonomous multi-agent system", "Routing: classify, then run the fixed procedure for that category", "One giant prompt", "Fine-tuning"], "a": 1, "w": "Known categories with fixed procedures make routing to workflows cheaper, faster and easier to test."}, {"q": "Which is a key benefit of plan-and-execute over pure ReAct?", "o": ["It never needs tools", "The plan is explicit, so it can be shown, approved and tracked, and steps can use cheaper models", "It always uses fewer tokens", "It doesn't need stopping conditions"], "a": 1, "w": "Making the plan visible helps humans, monitoring and cost. It still needs limits and re-planning."}], "th": [["Your manager asks for \"an agent that writes the weekly firmware status report from Jira and Git\". Workflow or agent? Sketch it.", "Mostly a workflow: (1) code fetches the week's tickets and merged commits, (2) one LLM call groups them by area, (3) one call drafts the report in a fixed template, (4) an evaluator call checks every ticket is mentioned. No open-ended tool choice is needed."]], "terms": ["citation", "agent", "workflow", "chaining", "prompt", "routing", "tool", "model", "orchworker", "llm", "multiagent", "reflection", "react", "toolcall", "api", "plan", "latency", "eval", "state"], "lab": null, "video": null}, {"id": "memory", "ch": 3, "t": "State, memory and context management", "mins": 35, "why": "design short-term and long-term memory, keep long conversations within the context window, and pass state cleanly between steps.", "an": "<p>A technician on a long job keeps a <b>notepad<\/b> for today: what they tried and what they saw. That is short-term memory. The company keeps a <b>service history database<\/b> for every unit: last year's repairs and the customer's preferences. That is long-term memory, and someone must decide what is worth writing into it and look it up next time.<\/p>", "d": "<h3>Three kinds of \"memory\", and where each lives<\/h3>\n<div class=\"tbl\"><table><tr><th>Kind<\/th><th>Where it lives<\/th><th>Example<\/th><\/tr>\n<tr><td><b>Agent state<\/b><\/td><td>Your program's variables / a checkpoint store<\/td><td>Step count, current plan, IDs found so far, approval status<\/td><\/tr>\n<tr><td><b>Short-term memory<\/b><\/td><td>The message list sent to the model<\/td><td>This conversation's turns and tool results<\/td><\/tr>\n<tr><td><b>Long-term memory<\/b><\/td><td>A database (rows, documents or vectors)<\/td><td>\"User prefers logs in UTC\", \"unit 17 had a PHY fix in March\"<\/td><\/tr><\/table><\/div>\n<p>The model itself remembers nothing between calls. All memory is your code choosing what to put in the next prompt.<\/p>\n\n<h3>Keeping short-term memory inside the window<\/h3>\n<ol>\n<li><b>Sliding window<\/b>: keep the system prompt and the last N turns. It is simple, but it forgets early facts.<\/li>\n<li><b>Summarise (compaction)<\/b>: when history passes a threshold, replace the old turns with a model-written summary of decisions, facts and open questions. Keep the recent turns verbatim.<\/li>\n<li><b>Clear old tool results<\/b>: a 3,000-line log from step 2 rarely matters at step 9. Keep a one-line note (\"searched unit 17 logs: 3 watchdog hits at 23:12\").<\/li>\n<li><b>Notes / scratchpad file<\/b>: let the agent write key findings to a notes tool and re-read them. Long-running coding agents use this.<\/li>\n<\/ol>\n<pre><code>def compact(messages, llm, keep_last=6, limit_tokens=30_000):\n    if count_tokens(messages) < limit_tokens: return messages\n    system, old, recent = messages[0], messages[1:-keep_last], messages[-keep_last:]\n    summary = llm([{\"role\": \"user\", \"content\":\n        \"Summarise for continuing this task: decisions made, facts found (with IDs), open questions.\\n\"\n        + render(old)}]).text\n    return [system, {\"role\": \"user\", \"content\": f\"[Summary of earlier work]\\n{summary}\"}] + recent<\/code><\/pre>\n<p>Careful: never cut between a tool request and its result. APIs reject orphaned tool results.<\/p>\n\n<h3>Long-term memory, done responsibly<\/h3>\n<ul>\n<li><b>Write path<\/b>: after a session, extract durable facts as structured records (subject, fact, source, date). Don't dump whole transcripts.<\/li>\n<li><b>Read path<\/b>: at the start of a task, retrieve relevant memories (by user, device ID, or semantic search) and inject a short \"Known facts\" block.<\/li>\n<li><b>Hygiene<\/b>: memories go stale and can be wrong. Store their source and date, let users view and delete them, and never store secrets or unnecessary PII.<\/li>\n<li><b>Security<\/b>: a memory written from untrusted content can carry an injected instruction into future sessions. Treat memory as untrusted input too.<\/li>\n<\/ul>\n<div class=\"fw\"><b>Firmware link:<\/b> registers (context window) versus flash (database). Writing to flash is deliberate, wears out (gets stale), and needs a format plus a version.<\/div>\n\n<h3>State between steps: make it explicit<\/h3>\n<p>Keep a typed state object (dataclass or Pydantic) with the plan, discovered IDs, counters and flags, instead of hoping the model re-reads it from chat history. Frameworks like LangGraph formalise exactly this, with a typed state that every node reads and updates and that gets checkpointed.<\/p>", "q": [{"q": "A user told your agent in turn 2 to \"always use UTC\", and by turn 40 it forgets. Best fix?", "o": ["Bigger model", "Keep durable instructions in state or long-term memory and inject them each call, or include them in the compaction summary", "Raise temperature", "Restart the chat"], "a": 1, "w": "Durable preferences shouldn't depend on old turns surviving trimming. Store them and inject them explicitly."}, {"q": "Why is \"store every full transcript and retrieve it later\" a poor long-term memory design?", "o": ["It is illegal", "It retrieves noisy, stale, possibly injected text and wastes tokens; extracted, dated facts work better", "Transcripts can't be embedded", "It is too fast"], "a": 1, "w": "Curated facts with sources and dates are smaller, clearer and auditable."}], "lab": "Lab 05 also includes <code>trim_history()<\/code> and <code>compact()<\/code> exercises that must never split a tool call from its result.", "terms": ["agent", "state", "checkpoint", "stm", "model", "tool", "ltm", "vector", "prompt", "sysprompt", "compaction", "api", "durable", "semantic", "pii", "pinj", "ctx", "pydantic", "framework", "langgraph", "graph"], "th": [], "anim": null, "video": null}, {"id": "rag1", "ch": 4, "t": "RAG part 1: ingest, chunk, embed, store", "mins": 40, "why": "build the offline half of a RAG system: load documents, chunk them sensibly, embed them and index them with metadata.", "an": "<p>An open-book exam has two skills: <b>finding the right pages fast<\/b>, then <b>writing an answer from them<\/b>. RAG (retrieval-augmented generation) is exactly that: search your documents first, paste the best passages into the prompt, and ask the model to answer only from them.<\/p>\n<p>This lesson is the library work done before the exam: cutting the books into findable passages and building the index.<\/p>", "d": "<h3>Why RAG exists<\/h3>\n<ul><li>The model doesn't know your private docs, recent changes or exact specs.<\/li>\n<li>Putting <i>all<\/i> docs in every prompt is too expensive and hurts quality (remember \"lost in the middle\").<\/li>\n<li>RAG keeps knowledge <b>current<\/b> (re-index, don't retrain) and <b>checkable<\/b> (citations).<\/li><\/ul>\n\n<h3>The ingestion pipeline<\/h3>\n<ol>\n<li><b>Load and clean<\/b>: PDFs, wiki and HTML pages, tickets, code. Strip navigation junk, keep headings and tables. Messy extraction is the most common silent RAG failure, so look at what you extracted.<\/li>\n<li><b>Attach metadata<\/b>: source URL, title, section, product, version, date and access rights. You will filter on these later.<\/li>\n<li><b>Chunk<\/b>: split into passages.<\/li>\n<li><b>Embed<\/b> each chunk.<\/li>\n<li><b>Index<\/b>: write vector, text and metadata to a vector database, plus a keyword index for hybrid search.<\/li>\n<\/ol>\n\n<h3>Chunking: the decision that matters most<\/h3>\n<ul>\n<li><b>Size<\/b>: commonly a few hundred tokens (for example 200–800). Small chunks match precisely but lose context. Big ones keep context but blur the match and cost tokens. Tune it with retrieval evals (part 3).<\/li>\n<li><b>Boundaries<\/b>: split on structure first (headings, sections, functions in code), then paragraphs, then sentences. Never cut mid-sentence if you can help it.<\/li>\n<li><b>Overlap<\/b>: repeat a little (for example 10–20%) between neighbours so facts on a boundary survive.<\/li>\n<li><b>Context headers<\/b>: prepend the document title and section path to each chunk (\"USB Guide › Enumeration › Errors\"). Chunks often don't make sense alone, and this cheap trick helps both embedding and answering.<\/li>\n<\/ul>\n<pre><code>def chunk(text: str, size=800, overlap=120) -> list[str]:\n    \"\"\"Greedy paragraph packing with character overlap (a simple, solid baseline).\"\"\"\n    paras, chunks, cur = [p.strip() for p in text.split(\"\\n\\n\") if p.strip()], [], \"\"\n    for p in paras:\n        if len(cur) + len(p) + 2 <= size:\n            cur = f\"{cur}\\n\\n{p}\" if cur else p\n        else:\n            if cur: chunks.append(cur)\n            cur = (cur[-overlap:] + \"\\n\\n\" + p) if cur and overlap else p\n    if cur: chunks.append(cur)\n    return chunks<\/code><\/pre>\n\n<h3>Vector databases: what to pick<\/h3>\n<p>A vector database stores embeddings and answers \"nearest k vectors to this one\" fast, using approximate nearest neighbour indexes (HNSW is the usual one).<\/p>\n<ul>\n<li><b>pgvector<\/b> (a PostgreSQL extension) is a great default if you already run Postgres: SQL, filters, transactions and backups in one place.<\/li>\n<li><b>Qdrant, Weaviate, Milvus, Pinecone<\/b> are dedicated engines, with strengths at large scale and with built-in hybrid search.<\/li>\n<li><b>Chroma<\/b> or an in-memory index suits prototypes and tests.<\/li>\n<li><b>OpenSearch / Elasticsearch<\/b> fit when you already run them for keyword search and want vectors alongside.<\/li>\n<\/ul>\n<pre><code>-- pgvector: create, insert, query (cosine distance operator is &lt;=&gt;)\nCREATE EXTENSION IF NOT EXISTS vector;\nCREATE TABLE chunks (id bigserial PRIMARY KEY, doc text, section text, product text, body text, emb vector(1024));\nCREATE INDEX ON chunks USING hnsw (emb vector_cosine_ops);\nSELECT id, body FROM chunks WHERE product = 'videobar' ORDER BY emb &lt;=&gt; $1 LIMIT 20;<\/code><\/pre>\n<div class=\"fw\"><b>Firmware link:<\/b> ingestion is your build pipeline (sources → artefacts), and the index is the flashe
