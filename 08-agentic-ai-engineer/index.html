d image. Version it: record which embedding model and chunker produced it, so you can rebuild reproducibly.<\/div>", "anim": "chunker", "q": [{"q": "Retrieved chunks often start with \"It also supports…\" and the answers are vague. Cheapest strong fix?", "o": ["A bigger LLM", "Prepend document title / section headers to each chunk, and split on structure", "Lower temperature", "Remove overlap"], "a": 1, "w": "Chunks that lost their context embed and read poorly. Context headers and structure-aware splitting fix much of this."}, {"q": "Why store metadata like product and version with each chunk?", "o": ["For decoration", "To filter searches (e.g. only firmware 3.8 docs, only docs this user may see)", "Embeddings need it", "It speeds up the LLM"], "a": 1, "w": "Metadata filters make retrieval precise and enforce access control."}], "lab": "Lab 06 (<code>labs/06-rag-pipeline<\/code>) part A: implement the overlapping chunker. The vector index with metadata filters is provided (you built one in Lab 02).", "terms": ["rag", "model", "prompt", "lim", "citation", "ingest", "metafilter", "chunk", "vector", "vdb", "hybrid", "token", "eval", "embedding", "ann", "bm25"], "th": [], "video": {"id": "a07-rag", "t": "RAG: answers grounded in your own documents", "dur": "6:35"}}, {"id": "rag2", "ch": 4, "t": "RAG part 2: hybrid search, reranking and grounded answers", "mins": 40, "why": "combine keyword and vector search with RRF, add a reranker, and generate answers that cite their sources.", "an": "<p>For a hard question you might ask two people: the <b>parts clerk<\/b>, who finds exact part numbers instantly but has no idea what \"won't charge\" means, and the <b>veteran tech<\/b>, who understands meaning but forgets part numbers. You merge their suggestions, then a <b>senior engineer<\/b> reads the top few carefully and picks the best.<\/p>\n<p>That is hybrid search (clerk plus tech), rank fusion (the merge) and reranking (the senior engineer).<\/p>", "d": "<h3>Keyword search: BM25<\/h3>\n<p>BM25 is the classic ranking formula behind search engines. It scores a passage higher for containing the query words, especially <i>rare<\/i> words, with diminishing returns for repetition and a correction for long passages. It is unbeatable for error codes, part numbers, function names and acronyms.<\/p>\n\n<h3>Merging two ranked lists: reciprocal rank fusion<\/h3>\n<p>BM25 scores and cosine similarities are on different scales, so you cannot just add them. RRF uses only ranks: score(d) = Σ 1/(k + rank of d in each list), with k commonly 60 (from Cormack et al., 2009).<\/p>\n<pre><code>def rrf(*ranked_lists: list[str], k: int = 60) -> list[str]:\n    score = {}\n    for lst in ranked_lists:\n        for rank, doc_id in enumerate(lst, start=1):\n            score[doc_id] = score.get(doc_id, 0.0) + 1.0 / (k + rank)\n    return sorted(score, key=score.get, reverse=True)\n\nrrf([\"A\", \"C\", \"E\"], [\"B\", \"A\", \"D\"])   # ['A', 'B', 'C', ...]: A is decent in both lists, so it wins<\/code><\/pre>\n<div class=\"py\"><b>Python note:<\/b> <code>*ranked_lists<\/code> accepts any number of arguments as a tuple, like C varargs but type-safe. <code>sorted(score, key=score.get)<\/code> sorts the dict's keys by their values.<\/div>\n\n<h3>Reranking<\/h3>\n<p>The first-stage search uses a <b>bi-encoder<\/b>: query and passages are embedded separately, which is fast enough for millions of passages. A <b>cross-encoder reranker<\/b> reads the query and each candidate <i>together<\/i> and outputs one relevance score. It is much more accurate and much slower, so run it on the top 20–50 candidates only and keep the best 3–8.<\/p>\n<p>Options include hosted rerank APIs (for example Cohere and Voyage AI offer them) and open models you can self-host, or simply an LLM scoring relevance (slower and pricier).<\/p>\n\n<h3>More retrieval levers<\/h3>\n<ul><li><b>Metadata filters<\/b>: product, version, date, permissions. Apply them <i>inside<\/i> the search, not afterwards.<\/li>\n<li><b>Query rewriting<\/b>: have an LLM turn \"it dies after sleep??\" into \"device fails to resume from suspend\" and maybe 2–3 variants, then search all of them.<\/li>\n<li><b>Agentic retrieval<\/b>: give the agent a <code>search_docs<\/code> tool and let it search repeatedly, refining its query. Slower, but much better for multi-part questions.<\/li><\/ul>\n\n<h3>Generating the grounded answer<\/h3>\n<pre><code>SYSTEM = \"\"\"Answer using ONLY the sources below. Cite sources like [S2] after each claim.\nIf the sources do not contain the answer, say \"Not found in the documentation\" and stop.\"\"\"\ncontext = \"\\n\\n\".join(f\"[S{i+1}] ({c.doc} › {c.section})\\n{c.body}\" for i, c in enumerate(top_chunks))\nanswer = llm([{\"role\": \"system\", \"content\": SYSTEM},\n              {\"role\": \"user\", \"content\": f\"&lt;sources&gt;\\n{context}\\n&lt;/sources&gt;\\n\\nQuestion: {q}\"}]).text\ncited = set(re.findall(r\"\\[S(\\d+)\\]\", answer))\nassert all(1 &lt;= int(n) &lt;= len(top_chunks) for n in cited), \"fabricated citation\"<\/code><\/pre>\n<div class=\"key\"><b>Production checklist:<\/b> hybrid search + filters → rerank → 3–8 chunks with IDs → \"answer only from sources\" with an allowed \"not found\" → verify citations in code → log the trace (query, chunk IDs, answer) for evals.<\/div>", "anim": "hybrid", "q": [{"q": "Why not just add the BM25 score and the cosine similarity together?", "o": ["It's too slow", "They are on different, incomparable scales; RRF combines ranks instead", "Cosine can be negative", "BM25 is deprecated"], "a": 1, "w": "Raw scores aren't comparable across methods. Rank-based fusion avoids calibrating them."}, {"q": "Why not run the cross-encoder reranker over the entire corpus?", "o": ["It is inaccurate", "It must read query and passage together for each pair, which is far too slow for millions of passages", "It needs a GPU", "It only works on code"], "a": 1, "w": "Cross-encoders cost one model pass per (query, passage) pair, so use them on the shortlist only."}, {"q": "Docs mention firmware 3.6, 3.7 and 3.8. A user on 3.8 gets an answer from 3.6 docs. Best fix?", "o": ["Bigger chunks", "A version metadata filter applied during retrieval", "Higher temperature", "More overlap"], "a": 1, "w": "Filtering by version inside the search guarantees the candidates are relevant to the user's version."}], "lab": "Lab 06 part B: implement BM25, RRF fusion, a reranker stage and a grounded answer with citation checking (offline fake model).", "terms": ["bm25", "rrf", "cosine", "rerank", "xenc", "api", "ai", "model", "llm", "metafilter", "agentic", "agent", "tool", "grounding", "hybrid", "chunk", "citation", "trace", "eval"], "th": [], "video": null}, {"id": "rag3", "ch": 4, "t": "RAG part 3: measuring retrieval and answer quality", "mins": 30, "why": "build a small retrieval golden set and compute recall@k and MRR, and separately measure answer faithfulness, so tuning is driven by numbers.", "an": "<p>When a RAG answer is wrong, there are two suspects: the <b>librarian<\/b> (retrieval brought the wrong pages) or the <b>writer<\/b> (the model misused good pages). You cannot fix what you cannot locate, so measure each one separately.<\/p>", "d": "<h3>Step 1: a retrieval golden set<\/h3>\n<p>Collect 30–100 real questions (from tickets, Slack, engineers). For each one, record the IDs of the chunk(s) that contain the answer. That is it. It takes an afternoon, and it is the most valuable RAG asset you will build.<\/p>\n<pre><code>GOLD = [\n  {\"q\": \"what does error -71 mean during enumeration\", \"relevant\": {\"usb-errors#2\"}},\n  {\"q\": \"how do I recover a bar stuck in DFU mode\",     \"relevant\": {\"dfu-guide#4\", \"dfu-guide#5\"}},\n]<\/code><\/pre>\n\n<h3>Step 2: retrieval metrics<\/h3>\n<ul><li><b>Recall@k<\/b>: the fraction of the relevant chunks that appear in the top k. If recall@5 is low, the answer is often <i>not even in the prompt<\/i>, and no prompt tweak can fix that.<\/li>\n<li><b>MRR<\/b> (mean reciprocal rank): 1/rank of the first relevant hit, averaged over queries. It rewards putting the right chunk at the top.<\/li><\/ul>\n<pre><code>def recall_at_k(retrieved: list[str], relevant: set[str], k: int) -> float:\n    return len(set(retrieved[:k]) &amp; relevant) / len(relevant)\n\ndef reciprocal_rank(retrieved: list[str], relevant: set[str]) -> float:\n    for i, doc in enumerate(retrieved, start=1):\n        if doc in relevant: return 1.0 / i\n    return 0.0<\/code><\/pre>\n<p>Now every change (chunk size, hybrid on or off, a reranker, a new embedding model) becomes a table of numbers instead of a feeling.<\/p>\n\n<h3>Step 3: answer quality, separately<\/h3>\n<ul><li><b>Faithfulness (groundedness)<\/b>: is every claim supported by the retrieved chunks? It is usually scored by an LLM judge given the answer plus the chunks (Chapter 8 covers judge pitfalls).<\/li>\n<li><b>Answer correctness<\/b>: does it match a reference answer? Use exact facts where possible, and a judge with a rubric otherwise.<\/li>\n<li><b>Citation validity<\/b>: are cited IDs real, and do they contain the claim? This is partly checkable in code.<\/li>\n<li><b>\"Not found\" behaviour<\/b>: include questions whose answer is <i>not<\/i> in the docs. The right output is a refusal.<\/li><\/ul>\n<p>Open-source evaluation libraries such as RAGAS and DeepEval package these metrics. Knowing how to compute them yourself is what interviewers probe.<\/p>\n\n<h3>Diagnosis table<\/h3>\n<div class=\"tbl\"><table><tr><th>Recall@k<\/th><th>Faithfulness<\/th><th>Likely problem → fix<\/th><\/tr>\n<tr><td>Low<\/td><td>any<\/td><td>Retrieval: chunking, hybrid search, query rewriting, metadata filters, embedding model<\/td><\/tr>\n<tr><td>High<\/td><td>Low<\/td><td>Generation: prompt (\"only from sources\"), fewer/better-ordered chunks, reranking, model choice<\/td><\/tr>\n<tr><td>High<\/td><td>High, but users unhappy<\/td><td>Wrong questions in your golden set; go read real user traces<\/td><\/tr><\/table><\/div>", "q": [{"q": "Recall@5 is 0.45 on your golden set. A teammate proposes rewriting the answer prompt. Your response?", "o": ["Great idea", "The answer is missing from the prompt more than half the time; fix retrieval first", "Lower temperature", "Add more few-shot examples"], "a": 1, "w": "If the evidence isn't retrieved, generation can't use it. Fix retrieval first."}, {"q": "For one query the relevant chunks are {a, b}, and the top-3 retrieved are [c, a, d]. Recall@3 and reciprocal rank?", "o": ["0.5 and 0.5", "1.0 and 1.0", "0.5 and 1.0", "0.33 and 0.5"], "a": 0, "w": "One of two relevant chunks was found: recall 0.5. The first relevant hit is at rank 2: reciprocal rank 1/2."}], "lab": "Lab 06 part C: compute recall@k and MRR for keyword-only, vector-only and hybrid retrieval on the provided golden set, and assert hybrid wins.", "terms": ["golden", "chunk", "rag", "recallk", "prompt", "rerank", "embedding", "model", "faith", "llm", "rubric", "citation", "eval", "hybrid", "metafilter", "trace"], "th": [], "anim": null, "video": null}, {"id": "mcp1", "ch": 5, "t": "MCP: the USB of AI tools", "mins": 30, "why": "explain what MCP is and why it exists, name hosts, clients and servers, transports and the three server primitives, and describe the current protocol flow.", "an": "<p>Before USB, every printer, mouse and scanner had its own port and its own driver for every computer. USB fixed that: <b>one standard plug<\/b>, and any device works with any host.<\/p>\n<p>Before MCP, every AI app needed custom code for every tool (GitHub, Jira, your log server). The Model Context Protocol is the standard plug: you write <b>one MCP server<\/b> for your tools, and any MCP-capable app (IDE assistants, chat apps, your own agent) can use it.<\/p>", "d": "<h3>The cast<\/h3>\n<ul>\n<li><b>Host<\/b>: the AI application the user runs, such as an IDE assistant, a desktop chat app or your own agent service.<\/li>\n<li><b>Client<\/b>: the connector inside the host. One client talks to one server.<\/li>\n<li><b>Server<\/b>: your program, which offers capabilities. It can be a local process or a remote web service.<\/li>\n<\/ul>\n<div class=\"fw\"><b>Firmware link:<\/b> host = laptop, client = one port on its USB host controller, server = the plugged-in device. A host can have many clients connected to many servers at once.<\/div>\n\n<h3>What a server can offer<\/h3>\n<div class=\"tbl\"><table><tr><th>Primitive<\/th><th>Who decides to use it<\/th><th>Example<\/th><\/tr>\n<tr><td><b>Tools<\/b><\/td><td>The model (via tool calling)<\/td><td><code>search_logs(unit, pattern)<\/code>, <code>create_ticket(...)<\/code><\/td><\/tr>\n<tr><td><b>Resources<\/b><\/td><td>The app or user (attach as context)<\/td><td><code>device://17/status<\/code>, a config file, a datasheet<\/td><\/tr>\n<tr><td><b>Prompts<\/b><\/td><td>The user (pick from a menu)<\/td><td>\"Triage unit N\" template<\/td><\/tr><\/table><\/div>\n\n<h3>On the wire<\/h3>\n<ul><li>Messages are <b>JSON-RPC 2.0<\/b>: a request with <code>id<\/code>, <code>method<\/code> and <code>params<\/code>; a response with the same <code>id<\/code> and a <code>result<\/code> or <code>error<\/code>.<\/li>\n<li><b>Transports<\/b>: <b>stdio<\/b> (the host launches your server as a child process and talks over stdin/stdout; used for local tools) and <b>Streamable HTTP<\/b> (the client POSTs to one URL; used for remote, shared servers, normally with OAuth for authorisation).<\/li>\n<li>Key methods: <code>tools/list<\/code>, <code>tools/call<\/code>, <code>resources/list<\/code>, <code>resources/read<\/code>, <code>prompts/list<\/code>, <code>prompts/get<\/code>.<\/li><\/ul>\n\n<h3>Spec versions: know both<\/h3>\n<p>The MCP specification is versioned by date. The current revision, <b>2026-07-28<\/b>, made the protocol <b>stateless<\/b>. There is no handshake: each request carries its protocol version and client capabilities in <code>_meta<\/code>, and servers must implement <code>server/discover<\/code> so clients can ask about versions and capabilities up front. The previous revision (<b>2025-11-25<\/b>), which many servers still run, opened every connection with an <code>initialize<\/code> request and a <code>notifications/initialized<\/code> message. In an interview, say you know both. The SDKs handle the difference for you.<\/p>\n<p>The current spec also deprecated the client-side features Roots, Sampling and Logging, and moved long-running \"tasks\" into an optional extension.<\/p>\n\n<h3>Why it matters for the job<\/h3>\n<ul><li>Postings increasingly list \"build MCP servers\" and \"tool schema design\" as requirements. Several say their MCP server is already in production.<\/li>\n<li>MCP turns your internal APIs into something every agent in the company can use, so one server you build is reused by every team's agents instead of each team writing its own integration.<\/li>\n<li>It concentrates risk: a server is arbitrary code execution offered to a model. The spec tells hosts to obtain user consent before invoking tools and to treat tool descriptions from untrusted servers as untrusted (more in Chapter 9).<\/li><\/ul>\n\n<h3>MCP vs A2A<\/h3>\n<p>MCP connects an agent to <b>tools and data<\/b>. A2A (Agent2Agent, a protocol Google started that is now under the Linux Foundation) connects <b>agents to other agents<\/b>, which may be built by other teams or vendors. You will mostly build MCP. Know that A2A exists.<\/p>", "anim": "mcpseq", "q": [{"q": "Your log-search tool should be usable from an IDE assistant, a desktop chat app and your team's own agent. What do you build?", "o": ["Three separate plugins", "One MCP server exposing a search_logs tool", "A fine-tuned model", "A vector database"], "a": 1, "w": "Write once, plug in anywhere: that is the point of MCP."}, {"q": "Which transport fits a server shared by the whole company over the network?", "o": ["stdio", "Streamable HTTP", "Bluetooth", "Shared memory"], "a": 1, "w": "stdio is for local child processes. Remote shared servers use Streamable HTTP, usually with OAuth."}, {"q": "In the 2026-07-28 MCP spec, what replaced the initialize handshake?", "o": ["Nothing; it is still required", "Per-request version and capabilities in _meta, plus an optional server/discover call", "A WebSocket upgrade", "OAuth"], "a": 1, "w": "The protocol became stateless. Older servers (2025-11-25) still use initialize, and SDKs negotiate."}], "terms": ["ai", "agent", "tool", "model", "toolcall", "prompt", "json", "jsonrpc", "stdio", "shttp", "http", "oauth", "mcp", "stateless", "sdk", "sampling", "mcphost", "schema", "api", "a2a"], "th": [], "lab": null, "video": {"id": "a08-mcp", "t": "MCP: one standard plug for AI tools", "dur": "5:36"}}, {"id": "mcp2", "ch": 5, "t": "Build an MCP server and client in Python", "mins": 45, "why": "write a working MCP server with tools, a resource and a prompt using the official Python SDK (v2), connect a client over stdio, and test it.", "an": "<p>Writing an MCP server with the official SDK feels like writing a small USB gadget function with configfs: you declare what you offer (tools, resources, prompts), and the framework handles the protocol, enumeration and message framing.<\/p>", "d": "<h3>Setup<\/h3>\n<pre><code>pip install \"mcp[cli]\"       # official SDK; version 2.x at the time of writing<\/code><\/pre>\n<div class=\"warn\"><b>Version note:<\/b> in SDK v1 the server class was <code>FastMCP<\/code> (<code>from mcp.server.fastmcp import FastMCP<\/code>). SDK v2 renamed it <code>MCPServer<\/code>. Many blog posts still show v1. The code below was run with v2.3.0 in this course's lab.<\/div>\n\n<h3>The server: fleet_server.py<\/h3>\n<pre><code>from mcp.server import MCPServer\n\nmcp = MCPServer(\"fleet-tools\")\n\n@mcp.tool()\ndef search_logs(unit: int, pattern: str, limit: int = 20) -> list[str]:\n    \"\"\"Search ONE unit's logs for lines containing `pattern` (case-insensitive).\n    Use for questions about errors, reboots or crashes. Returns newest lines first.\"\"\"\n    lines = load_logs(unit)                       # your real data source\n    hits = [l for l in reversed(lines) if pattern.lower() in l.lower()]\n    return hits[:limit]\n\n@mcp.tool()\ndef get_firmware_history(unit: int) -> list[dict]:\n    \"\"\"Firmware versions installed on a unit, newest first, with ISO timestamps.\"\"\"\n    return load_fw_history(unit)\n\n@mcp.resource(\"device://{unit}/status\")\ndef device_status(unit: int) -> str:\n    \"\"\"Current status summary of a unit.\"\"\"\n    return render_status(unit)\n\n@mcp.prompt()\ndef triage(unit: int) -> str:\n    \"\"\"Start a reboot triage for a unit.\"\"\"\n    return f\"Find why unit {unit} rebooted. Use search_logs and get_firmware_history; quote evidence.\"\n\nif __name__ == \"__main__\":\n    mcp.run()          # stdio by default; mcp.run(transport=\"streamable-http\") to serve over HTTP<\/code><\/pre>\n<p>Notice what you didn't write: no JSON Schema and no protocol handling. <code>unit: int<\/code> becomes <code>{\"type\": \"integer\"}<\/code> in the tool's <code>inputSchema<\/code>, the docstring becomes the description the model reads, and a wrongly typed argument is rejected with an error result (<code>isError: true<\/code>) before your function runs.<\/p>\n<div class=\"key\"><b>Rule for stdio servers:<\/b> never <code>print()<\/code> to stdout. stdout <i>is<\/i> the protocol channel, so log to stderr instead.<\/div>\n\n<h3>The client<\/h3>\n<pre><code>import asyncio, sys\nfrom mcp import Client, StdioServerParameters\n\nasync def main():\n    server = StdioServerParameters(command=sys.executable, args=[\"fleet_server.py\"])\n    async with Client(server) as client:                    # launches the server as a child process\n        tools = await client.list_tools()\n        print([t.name for t in tools.tools])\n        r = await client.call_tool(\"search_logs\", {\"unit\": 17, \"pattern\": \"watchdog\"})\n        print(r.structured_content, r.is_error)\n        print(await client.read_resource(\"device://17/status\"))\n\nasyncio.run(main())<\/code><\/pre>\n<p>In tests you can pass the <code>mcp<\/code> server object straight to <code>Client(mcp)<\/code> and it connects in-process, with no subprocess. The lab uses both ways.<\/p>\n\n<h3>Wiring MCP tools into your agent loop<\/h3>\n<pre><code>tools = (await client.list_tools()).tools\nllm_tools = [{\"type\": \"function\", \"name\": t.name, \"description\": t.description,\n              \"parameters\": t.input_schema} for t in tools]      # MCP schema → LLM tool definition\n# in the loop, for each tool call the model makes:\nresult = await client.call_tool(call.name, call.args)\ntool_message = result.structured_content or \"\\n\".join(c.text for c in result.content if c.type == \"text\")<\/code><\/pre>\n<p>Frameworks do this mapping for you. The OpenAI Agents SDK, the Claude Agent SDK and LangChain's MCP adapters can all attach MCP servers directly.<\/p>\n\n<h3>TypeScript, briefly<\/h3>\n<p>The official TypeScript SDK (<code>@modelcontextprotocol/sdk<\/code>) has the same shape: create a server, register tools with a schema (it uses the Zod validation library), and connect a stdio or HTTP transport. Teams with Node backends often write servers in it.<\/p>\n\n<h3>Testing and debugging<\/h3>\n<ul><li><b>MCP Inspector<\/b> (<code>mcp dev fleet_server.py<\/code>, from the <code>[cli]<\/code> extra) opens a UI to list and call your tools by hand.<\/li>\n<li>Unit-test tool functions directly, and integration-test through <code>Client(mcp)<\/code>.<\/li>\n<li>Design for the model: small, clear tools, compact results, helpful error messages and deterministic ordering.<\/li><\/ul>", "q": [{"q": "Your stdio MCP server works in tests but the host shows garbled protocol errors. Likely cause?", "o": ["Wrong Python version", "A print() statement writing to stdout, which corrupts the JSON-RPC stream", "Missing GPU", "Too many tools"], "a": 1, "w": "On stdio, stdout carries protocol messages only. Log to stderr."}, {"q": "Where does the MCP SDK get the tool's input schema?", "o": ["You must write JSON Schema by hand", "From the function's type hints (and defaults); the docstring becomes the description", "From the model", "From the function name only"], "a": 1, "w": "Type hints → JSON Schema, docstring → description. Write both carefully, because the model reads them."}], "lab": "Lab 07 (<code>labs/07-mcp-server-client<\/code>): a fleet MCP server with three tools (one with side effects), a resource and a prompt, plus a client that feeds MCP tools into your agent loop, tested in-process and over a real stdio subprocess with the official <code>mcp<\/code> v2 SDK. These tests run the real protocol, not a mock.", "terms": ["sdk", "json", "schema", "tool", "model", "stdio", "mcp", "agent", "loop", "framework", "oaisdk", "claudesdk", "langchain", "mcphost", "http", "graph", "compaction", "prompt"], "th": [], "anim": null, "video": null}, {"id": "frameworks", "ch": 6, "t": "Agent frameworks, honestly compared (and when to use none)", "mins": 35, "why": "describe what LangGraph, the OpenAI Agents SDK, the Claude Agent SDK, CrewAI, Microsoft Agent Framework, LlamaIndex and Google ADK are each for, and justify a choice in an interview.", "an": "<p>Choosing an agent framework is like choosing between a hand-rolled super-loop, FreeRTOS and embedded Linux. Each adds features and constraints. The right answer depends on the product, and \"none yet\" is often correct for a first version.<\/p>", "d": "<h3>What every framework gives you<\/h3>\n<p>The loop you wrote in Chapter 3, plus some of: tool plumbing from type hints, typed state, persistence (checkpoints), human-approval pauses, streaming, tracing, multi-agent handoffs and MCP integration.<\/p>\n\n<h3>The main options (late 2026)<\/h3>\n<div class=\"tbl\"><table><tr><th>Framework<\/th><th>Core idea<\/th><th>Reach for it when<\/th><th>Watch out for<\/th><\/tr>\n<tr><td><b>LangGraph<\/b> (LangChain team; Python and JS)<\/td><td>An agent is an explicit graph: nodes, conditional edges, a typed state, checkpointers, <code>interrupt()<\/code> for human input, durable execution<\/td><td>Stateful, long-running, auditable workflows with HITL. The framework named most often in the postings we read<\/td><td>More concepts to learn, and verbose for tiny agents<\/td><\/tr>\n<tr><td><b>OpenAI Agents SDK<\/b> (Python, TS)<\/td><td>Few primitives: Agent, Runner, tools, handoffs, guardrails, sessions, built-in tracing<\/td><td>Fast, clean agents and handoffs, especially on OpenAI models (other providers are supported via adapters)<\/td><td>Less explicit control flow than a graph<\/td><\/tr>\n<tr><td><b>Claude Agent SDK<\/b> (Python, TS)<\/td><td>The Claude Code harness as a library: file, shell and web tools, permission modes, hooks, subagents, MCP<\/td><td>Agents that operate on files, repos or a computer (coding, log digging, ops), on Claude models<\/td><td>Tied to Anthropic models. Its tools can edit files and run shell commands, so you must configure permissions and sandboxing<\/td><\/tr>\n<tr><td><b>CrewAI<\/b> (Python)<\/td><td>Role-based \"crews\" of agents with tasks, plus event-driven Flows<\/td><td>Quick multi-role prototypes and business workflows<\/td><td>Role-play abstractions can hide what is actually sent to the model<\/td><\/tr>\n<tr><td><b>Microsoft Agent Framework<\/b> (Python, .NET)<\/td><td>Successor to AutoGen and Semantic Kernel (1.0 in April 2026): agents, graph workflows, multi-agent patterns, MCP and A2A<\/td><td>.NET/Azure shops and enterprise integration<\/td><td>AutoGen itself is archived. Don't start new work on it (a community fork, AG2, continues)<\/td><\/tr>\n<tr><td><b>LlamaIndex<\/b> (Python, TS)<\/td><td>Data first: loaders, indexing and retrieval, plus agents and workflows<\/td><td>RAG-heavy systems over many document types<\/td><td>Overlaps with your own retrieval code. Use the parts you need<\/td><\/tr>\n<tr><td><b>Google ADK<\/b> (Python, others)<\/td><td>Agent Development Kit: agents, tools and multi-agent support, integrated with Gemini and Google Cloud<\/td><td>Google Cloud / Gemini shops<\/td><td>Best fit inside Google's ecosystem<\/td><\/tr><\/table><\/div>\n\n<h3>The same agent in two frameworks<\/h3>\n<pre><code># OpenAI Agents SDK\nfrom agents import Agent, Runner, function_tool\n\n@function_tool\ndef search_logs(unit: int, pattern: str) -> list[str]:\n    \"\"\"Search one unit's logs for a pattern.\"\"\"\n    return find(unit, pattern)\n\ntriage = Agent(name=\"Triage\", instructions=\"Find why a unit rebooted. Quote evidence.\",\n               tools=[search_logs], model=MODEL)\nprint(Runner.run_sync(triage, \"Why did unit 17 reboot?\", max_turns=8).final_output)<\/code><\/pre>\n<pre><code># Claude Agent SDK: an agent that can read a repo, with tools restricted\nfrom claude_agent_sdk import query, ClaudeAgentOptions\nopts = ClaudeAgentOptions(allowed_tools=[\"Read\", \"Grep\", \"Glob\"], permission_mode=\"default\",\n                          max_turns=10, cwd=\"/src/firmware\")\nasync for message in query(prompt=\"Why does test_usb_resume fail? Cite file:line.\", options=opts):\n    print(message)<\/code><\/pre>\n<p>LangGraph gets its own hands-on lesson next.<\/p>\n\n<h3>When NOT to use a framework<\/h3>\n<ul><li>One or two LLM calls, or a fixed workflow. Plain code plus your <code>call_model()<\/code> wrapper is clearer.<\/li>\n<li>When you cannot explain what the framework sends to the model. Debugging blind is expensive.<\/li>\n<li>When its abstractions fight your requirements (custom persistence, strict latency budgets).<\/li><\/ul>\n<div class=\"key\"><b>How to answer \"which framework would you use?\"<\/b>: \"It depends on three things: whether I need durable state and human approval (then LangGraph or a durable engine), which model provider we're on (the vendor SDKs fit their own models best), and how much control flow is fixed. I prototype the loop by hand to learn the problem, then adopt the framework that removes the most code I'd otherwise have to maintain, and I keep my tools as MCP servers so they're portable.\"<\/div>", "q": [{"q": "A team needs agent runs that pause for manager approval for up to 3 days and survive deploys. Which framework feature matters most?", "o": ["Role-play agents", "Persistent checkpoints plus interrupt/resume (e.g. LangGraph), or a durable execution engine", "Prompt templates", "Built-in vector store"], "a": 1, "w": "Long pauses need state persisted outside the process and an explicit resume."}, {"q": "Starting a brand-new project, would you pick AutoGen today?", "o": ["Yes, it is the newest", "No: Microsoft archived it; Microsoft Agent Framework is the successor", "Only in Java", "Only with GPUs"], "a": 1, "w": "AutoGen and Semantic Kernel merged into Microsoft Agent Framework (1.0 in April 2026). AutoGen is no longer maintained by Microsoft."}], "terms": ["framework", "tool", "typehint", "state", "checkpoint", "streaming", "trace", "multiagent", "agent", "handoff", "mcp", "langgraph", "langchain", "graph", "durable", "workflow", "hitl", "oaisdk", "sdk", "guardrail", "model", "claudesdk", "subagent", "sandbox", "crewai", "roles", "maf", "a2a", "llamaindex", "rag", "adk", "llm", "latency", "mcphost"], "th": [], "anim": null, "lab": null, "video": null}, {"id": "langgraph", "ch": 6, "t": "LangGraph hands-on: state, routing, checkpoints and interrupts", "mins": 45, "why": "build a LangGraph agent with typed state, conditional routing, a checkpointer and a human-approval interrupt, and resume it.", "an": "<p>LangGraph is \"write your agent as a state machine diagram, with save points\". Nodes are the bubbles, edges are the arrows, a typed state struct flows through, and a checkpointer saves the struct after every bubble, so you can stop, wait for a person, crash or redeploy, and carry on from exactly there.<\/p>", "d": "<h3>The pieces<\/h3>\n<ul><li><b>State<\/b>: a <code>TypedDict<\/code> (or Pydantic model) holding everything the graph knows.<\/li>\n<li><b>Nodes<\/b>: plain functions <code>state → partial update<\/code>.<\/li>\n<li><b>Edges<\/b>: fixed (<code>add_edge<\/code>) or conditional (<code>add_conditional_edges<\/code>, where a function looks at the state and returns the next node's name).<\/li>\n<li><b>Checkpointer<\/b>: saves state after each step, keyed by a <code>thread_id<\/code>. Use <code>InMemorySaver<\/code> for tests, and SQLite or Postgres savers in production.<\/li>\n<li><b><code>interrupt()<\/code><\/b>: pauses the graph inside a node and returns a value to the caller. You resume with <code>Command(resume=...)<\/code>.<\/li><\/ul>\n\n<h3>A firmware-rollout agent with an approval gate<\/h3>\n<pre><code>from typing import TypedDict\nfrom langgraph.graph import StateGraph, START, END\nfrom langgraph.checkpoint.memory import InMemorySaver\nfrom langgraph.types import interrupt, Command\n\nclass S(TypedDict, total=False):\n    request: str\n    plan: dict          # e.g. {\"version\": \"3.8.2\", \"devices\": 40}\n    approved: bool\n    result: str\n\ndef make_plan(s: S) -> S:\n    return {\"plan\": llm_plan(s[\"request\"])}          # an LLM call returning structured output\n\ndef needs_approval(s: S) -> str:\n    return \"approve\" if s[\"plan\"][\"devices\"] > 1 else \"execute\"\n\ndef approve(s: S) -> S:\n    decision = interrupt({\"question\": \"Approve rollout?\", \"plan\": s[\"plan\"]})   # pauses here\n    return {\"approved\": decision[\"approved\"], \"plan\": decision.get(\"plan\", s[\"plan\"])}\n\ndef execute(s: S) -> S:\n    if s.get(\"approved\") is False: return {\"result\": \"rejected; nothing flashed\"}\n    return {\"result\": flash(s[\"plan\"])}\n\ng = StateGraph(S)\ng.add_node(\"plan\", make_plan); g.add_node(\"approve\", approve); g.add_node(\"execute\", execute)\ng.add_edge(START, \"plan\")\ng.add_conditional_edges(\"plan\", needs_approval, {\"approve\": \"approve\", \"execute\": \"execute\"})\ng.add_edge(\"approve\", \"execute\"); g.add_edge(\"execute\", END)\napp = g.compile(checkpointer=InMemorySaver())\n\ncfg = {\"configurable\": {\"thread_id\": \"rollout-42\"}}\nfirst = app.invoke({\"request\": \"Roll 3.8.2 to building 3\"}, cfg)\nprint(first[\"__interrupt__\"])                        # the pending question, shown to a human\nfinal = app.invoke(Command(resume={\"approved\": True, \"plan\": {\"version\": \"3.8.2\", \"devices\": 2}}), cfg)\nprint(final[\"result\"])<\/code><\/pre>\n<div class=\"py\"><b>Python note:<\/b> <code>TypedDict<\/code> describes a dict's keys and types for tools and editors, but at run time it is still a plain dict. <code>total=False<\/code> means keys may be missing.<\/div>\n\n<h3>Things that trip people up<\/h3>\n<ul><li><b>When resumed, the interrupted node re-runs from its start.<\/b> Code before <code>interrupt()<\/code> runs again, so keep side effects after the interrupt or make them idempotent.<\/li>\n<li>The same <code>thread_id<\/code> is the same run. A new id starts fresh.<\/li>\n<li>Nodes return <i>updates<\/i>, which are merged into the state. For lists such as messages, use a reducer (the prebuilt <code>MessagesState<\/code> appends instead of overwriting).<\/li>\n<li>LangGraph also has prebuilt agents and higher-level helpers. Learn the graph API first, so you understand what the helpers do.<\/li><\/ul>\n<div class=\"fw\"><b>Firmware link:<\/b> this is a state machine with a journal. <code>interrupt()<\/code> works like a task blocking on a semaphore whose stack has been saved to flash, and the checkpointer is the journal that makes resume-after-reset possible.<\/div>", "anim": "hitl", "q": [{"q": "After resuming, a \"send notification\" call placed before interrupt() in the same node fires twice. Why?", "o": ["A LangGraph bug", "On resume the interrupted node re-executes from the top, so put side effects after interrupt() or make them idempotent", "The checkpointer is broken", "Two thread IDs were used"], "a": 1, "w": "Resume replays the node. This is documented behaviour, so design for it."}, {"q": "What ties a resumed invoke() to the paused run?", "o": ["The node name", "The same thread_id in the config, with a checkpointer", "The model name", "Nothing; it always starts over"], "a": 1, "w": "Checkpoints are stored per thread_id. Same id + checkpointer = continue."}], "lab": "Lab 08 (<code>labs/08-langgraph-hitl<\/code>): the rollout graph above with a fake planner. Tests cover approve, edit and reject paths, the no-approval path for a single device, and resuming from the checkpoint, with real LangGraph and no API key.", "terms": ["state", "pydantic", "model", "graph", "checkpoint", "agent", "tool", "idem", "langgraph", "api"], "th": [], "video": {"id": "a09-human-approval", "t": "Human approval and resume with LangGraph", "dur": "4:56"}}, {"id": "multi", "ch": 7, "t": "Multi-agent systems: when several agents beat one", "mins": 35, "why": "describe supervisor/orchestrator-worker, handoff and parallel fan-out designs, know when multi-agent helps or hurts, and build an orchestrator from scratch.", "an": "<p>One brilliant generalist with forty tools and a desk buried in paperwork makes mistakes. A small team (a lead who splits the work, plus specialists who each see only their own files) often does better, <b>as long as the hand-offs are clean<\/b>. Hand-offs are where teams, human or AI, lose information.<\/p>", "d": "<h3>Why split at all?<\/h3>\n<ul><li><b>Context isolation<\/b>: each worker starts with a fresh context holding only its subtask, so nothing gets buried.<\/li>\n<li><b>Tool focus<\/b>: three agents with five tools each choose better than one agent with fifteen.<\/li>\n<li><b>Parallelism<\/b>: independent research threads run at the same time.<\/li>\n<li><b>Different models<\/b>: a strong model for planning, cheaper ones for workers.<\/li><\/ul>\n\n<h3>The common designs<\/h3>\n<ul><li><b>Supervisor / orchestrator-worker<\/b>: a lead agent plans and delegates (often by calling workers as tools) and merges short reports.<\/li>\n<li><b>Handoff<\/b>: the current agent transfers the whole conversation to a specialist (triage → billing agent). This is native in the OpenAI Agents SDK.<\/li>\n<li><b>Sequential pipeline<\/b>: agents in a fixed order (researcher → writer → reviewer). This is really a workflow.<\/li>\n<li><b>Group chat / debate<\/b>: several agents converse. It is mostly research territory and hard to control in production.<\/li><\/ul>\n\n<h3>An orchestrator from scratch<\/h3>\n<pre><code>async def orchestrate(goal: str) -> str:\n    plan = await llm_structured(f\"Split into independent subtasks: {goal}\", schema=SubtaskList)\n    async def work(t):                                   # each worker = small agent loop, own tools, fresh context\n        return await run_agent_async(t.instruction, tools=TOOLSETS[t.kind], max_steps=6)\n    reports = await asyncio.gather(*(work(t) for t in plan.subtasks[:5]), return_exceptions=True)\n    findings = \"\\n\".join(f\"- {t.kind}: {r if not isinstance(r, Exception) else 'FAILED: ' + str(r)}\"\n                         for t, r in zip(plan.subtasks, reports))\n    return await llm_text(f\"Goal: {goal}\\nWorker reports:\\n{findings}\\nWrite the answer; flag conflicts.\")<\/code><\/pre>\n<div class=\"py\"><b>Python note:<\/b> <code>return_exceptions=True<\/code> makes <code>gather<\/code> return a failed worker's exception as a value instead of cancelling everything, so one failure doesn't sink the team.<\/div>\n\n<h3>The honest costs<\/h3>\n<ul><li><b>Tokens<\/b>: several agents each re-reading context costs a multiple of a single agent. Anthropic has written that its multi-agent research system used many times more tokens than single-agent chat.<\/li>\n<li><b>Lost information at hand-offs<\/b>: workers don't see each other's discoveries unless you pass them on.<\/li>\n<li><b>Harder debugging<\/b>: you need traces across agents (Chapter 8).<\/li>\n<li><b>Conflicts<\/b>: two workers acting on the same resource. Read-only workers are much safer.<\/li><\/ul>\n<div class=\"key\"><b>Rule of thumb:<\/b> use multi-agent for <i>breadth<\/i> (many independent sub-questions, mostly reading). Use one agent, or a workflow, for <i>depth<\/i> (tightly coupled steps, shared state, writes).<\/div>", "anim": "multiagent", "q": [{"q": "Which task benefits most from orchestrator-worker?", "o": ["Edit one function in one file", "Research 6 independent suppliers' datasheets for a part and compare them", "Answer a yes/no question", "Format a date"], "a": 1, "w": "Independent, read-heavy subtasks parallelise well and benefit from isolated contexts."}, {"q": "Workers return their whole 20k-token transcripts to the orchestrator. Problem?", "o": ["None", "It defeats context isolation and multiplies cost; workers should return short, structured reports", "It is faster", "It improves accuracy"], "a": 1, "w": "The point is to compress: workers digest, and the orchestrator reads summaries with evidence."}], "lab": "Lab 09 (<code>labs/09-multi-agent<\/code>): an async orchestrator with parallel workers, a failure-tolerant fan-in and a token budget shared across agents.", "terms": ["tool", "agent", "model", "orchworker", "handoff", "oaisdk", "sdk", "workflow", "token", "multiagent", "trace", "state", "ai"], "th": [], "video": null}, {"id": "durable", "ch": 7, "t": "Human-in-the-loop and long-running, durable agents", "mins": 30, "why": "design approval steps that people can actually review, and make agent runs survive crashes, deploys and multi-day waits.", "an": "<p>A firmware update that writes 4 MB of flash must survive a power cut halfway through. You journal each block, and on reboot you resume instead of bricking.<\/p>\n<p>A long agent run is the same: twenty steps, a 2-day wait for a manager's approval, a deploy in between. <b>Durable execution<\/b> journals every completed step so the run resumes instead of starting over (or worse, repeating side effects).<\/p>", "d": "<h3>Human-in-the-loop: where and how<\/h3>\n<ul><li><b>Where<\/b>: before irreversible or costly actions (send, pay, delete, deploy, flash, merge), when confidence is low, or when policy requires it.<\/li>\n<li><b>Patterns<\/b>: <i>approve / edit / reject<\/i> a proposed tool call; <i>answer a question<\/i> the agent asks; <i>review the output<\/i> before it goes out.<\/li>\n<li><b>Make approvals reviewable<\/b>: show the exact action and arguments (recipients, amounts, device count, diff), why the agent wants it, and what happens if rejected. \"Approve agent action?\" with no detail trains people to click yes.<\/li>\n<li><b>Record<\/b> who approved what and when, and feed rejections back to the model as the tool result, so it can adapt.<\/li><\/ul>\n<p>Framework support: LangGraph's <code>interrupt()<\/code>, the OpenAI Agents SDK's <code>needs_approval<\/code> on tools, the Claude Agent SDK's permission modes and <code>can_use_tool<\/code> callback, and MCP hosts asking for consent before tool calls.<\/p>\n\n<h3>Making runs durable<\/h3>\n<ol><li><b>Persist state after every step<\/b> (checkpoint) in a real database, not process memory.<\/li>\n<li><b>Make steps idempotent<\/b>: give every side-effecting tool call an idempotency key (for example run_id + step number), so a replayed step doesn't flash twice or email twice.<\/li>\n<li><b>Run in the background<\/b>: put long runs on a job queue with workers, not inside an HTTP request that times out after seconds. Notify the user (webhook, email, chat) when input is needed or the work is done.<\/li>\n<li><b>Timeouts and heartbeats<\/b> on every step, so a stuck tool call is detected and retried or failed.<\/li>\n<li><b>Versioning<\/b>: a run paused for 3 days may resume on new code. Keep state schemas backward compatible.<\/li><\/ol>\n\n<h3>Durable execution engines<\/h3>\n<p><b>Temporal<\/b> is the best-known open-source example (two of the postings we read name it). You write a workflow as ordinary code. Each \"activity\" (a model call, a tool call) is recorded, and after a crash the engine replays the history to rebuild state and continues from the next step. It handles retries, timers (\"wait 2 days for approval\") and signals (the approval arriving). The trade-off is that workflow code must be deterministic: model and tool calls go in activities, never directly in workflow logic.<\/p>\n<p>Lighter options: LangGraph with a Postgres checkpointer, or your own state table plus a job queue, which is fine for many products.<\/p>\n<div class=\"fw\"><b>Firmware link:<\/b> A/B partitions plus an update journal, a watchdog, and idempotent block writes. You have built durable execution before, just in flash instead of Postgres.<\/div>", "q": [{"q": "After a crash, your agent re-ran step 7 and charged a customer twice. The missing ingredient?", "o": ["A bigger model", "An idempotency key on the payment tool call (and recorded step results)", "Higher temperature", "More RAM"], "a": 1, "w": "Replays will happen. Idempotent side effects make replay safe."}, {"q": "Why not run a 20-minute agent inside a single web request?", "o": ["Python is slow", "HTTP requests and load balancers time out, and a deploy kills the run; use a job queue with persisted state", "Agents can't use HTTP", "It is more expensive"], "a": 1, "w": "Long work belongs in background workers with checkpoints and notifications."}], "th": [["Design the approval screen for \"agent wants to reboot 12 conference-room bars at 2 a.m.\"", "Show: the exact 12 unit IDs and room names, the reason with evidence (log excerpt), the time window, whether any rooms have meetings booked, rollback plan, and buttons Approve / Approve 1 canary first / Reject with reason. Log the decision."]], "terms": ["hitl", "tool", "toolcall", "agent", "model", "framework", "langgraph", "oaisdk", "sdk", "claudesdk", "mcp", "mcphost", "durable", "state", "checkpoint", "idem", "queue", "http", "retry", "schema", "temporal", "workflow"], "anim": null, "lab": null, "video": null}, {"id": "evals", "ch": 8, "t": "Evals: unit tests for things that are never exactly the same", "mins": 40, "why": "build a golden set, choose metrics (code-based first), run evals in CI as a regression gate, and evaluate agents, not just single answers.", "an": "<p>On a production line you don't test one unit and ship. You measure <b>yield<\/b> over a batch, against a fixed spec, every time the process changes. An eval is a yield test for an LLM system: fixed inputs, a grading rule and a pass rate, re-run on every prompt, model or code change.<\/p>", "d": "<h3>Why normal unit tests are not enough<\/h3>\n<p>The same input can give different outputs, and \"correct\" is often a range of answers. So you test <b>properties<\/b> over <b>many cases<\/b> and track <b>rates<\/b>.<\/p>\n\n<h3>Building the golden set<\/h3>\n<ul><li>Start with 20–50 cases taken from <b>real usage<\/b> (tickets, logs, traces), not invented ones. Grow it every time you find a bug: each production failure becomes a case.<\/li>\n<li>Cover the happy path, edge cases, \"should refuse / not found\" cases and adversarial inputs.<\/li>\n<li>For each case, store the input plus the expected answer <i>or<\/i> grading notes (\"must mention watchdog; must not suggest reflashing\").<\/li><\/ul>\n\n<h3>Graders, cheapest and most reliable first<\/h3>\n<ol><li><b>Code checks<\/b>: valid JSON, schema match, the exact field value, regex contains or not-contains, the right tool called with the right arguments, latency and cost under budget. These are fast, free and deterministic, so use them wherever possible.<\/li>\n<li><b>Reference comparison<\/b>: compare against a known answer (exact facts, numbers, chosen category).<\/li>\n<li><b>LLM-as-judge<\/b> with a rubric, for qualities like helpfulness or faithfulness (next lesson).<\/li>\n<li><b>Human review<\/b> of a sample, which also calibrates the judges.<\/li><\/ol>\n\n<h3>Evaluating agents, not just answers<\/h3>\n<ul><li><b>Task success<\/b>: did the end state match? (The ticket was created with the right fields; the correct root cause was named.)<\/li>\n<li><b>Tool-use correctness<\/b>: did it pick the right tool with valid arguments? Did it avoid forbidden tools?<\/li>\n<li><b>Trajectory<\/b>: number of steps, loops, wasted calls, cost and time.<\/li>\n<li><b>Safety<\/b>: no PII leaked, approvals respected.<\/li><\/ul>\n\n<h3>A minimal harness<\/h3>\n<pre><code>CASES = json.load(open(\"golden.json\"))\ndef grade(case, out) -> dict:\n    checks = {\"valid_json\": is_json(out.text),\n              \"mentions\": all(m in out.text.lower() for m in case.get(\"must_mention\", [])),\n              \"no_forbidden\": not any(f in out.text.lower() for f in case.get(\"must_not\", [])),\n              \"right_tool\": case.get(\"tool\") in (None, *out.tools_called)}\n    return {\"id\": case[\"id\"], \"pass\": all(checks.values()), **checks}\n\ndef run_eval(system, trials=3):\n    rows = [grade(c, system(c[\"input\"])) for c in CASES for _ in range(trials)]\n    return sum(r[\"pass\"] for r in rows) / len(rows), rows<\/code><\/pre>\n\n<h3>Regression gating in CI<\/h3>\n<ul><li>Run the eval on every pull request that touches prompts, tools, models or retrieval.<\/li>\n<li>Compare against the <b>baseline<\/b> (main branch). Fail the build if the pass rate drops beyond a threshold, <i>or<\/i> if previously passing critical cases now fail.<\/li>\n<li>Outputs vary, so run several trials per case and treat small differences on small sets as noise. Ten cases cannot detect a 5% change.<\/li>\n<li><b>Online evals<\/b>: sample production traces and score them continuously, and use A/B tests for big changes.<\/li><\/ul>\n<p>Tools: promptfoo, DeepEval, RAGAS, Langfuse, LangSmith and Braintrust all run datasets and graders. A pytest file plus a JSON golden set is a perfectly respectable start, and it is what the lab builds.<\/p>\n<div class=\"fw\"><b>Firmware link:<\/b> golden captures, yield tracking and a regression suite in CI with hardware in the loop. Same discipline, new device under test.<\/div>", "anim": "evalgate", "q": [{"q": "Which grader should you prefer when it can do the job?", "o": ["LLM-as-judge", "Code-based checks (schema, exact value, tool called)", "Asking the agent to grade itself", "User thumbs-up only"], "a": 1, "w": "Code checks are deterministic, fast and free. Use judges only for qualities code can't measure."}, {"q": "Your eval has 10 cases. The new prompt scores 80% vs 70%. Ship?", "o": ["Yes, a clear 10-point win", "Not on this evidence alone: one case flipping is 10 points, so check which cases changed, run more trials and grow the set", "No, never change prompts", "Only if the judge agrees"], "a": 1, "w": "Small sets are noisy. Look at per-case differences and add cases and trials."}, {"q": "Best source for new golden cases?", "o": ["Invented by the model", "Real production failures and user traces", "Benchmarks from papers", "Random strings"], "a": 1, "w": "Real failures reflect your real distribution. Every bug becomes a test."}], "lab": "Lab 10 (<code>labs/10-evals<\/code>): a golden-set runner with code graders, multi-trial pass rates, a fake LLM judge with a position-swap consistency check, and a CI-style regression gate that exits non-zero.", "terms": ["golden", "trace", "json", "schema", "tool", "toolcall", "latency", "judge", "llm", "rubric", "faith", "agent", "state", "pii", "regression", "eval", "prompt", "model", "obstools"], "th": [], "video": {"id": "a10-evals", "t": "Evals: proving your agent works, every time you change it", "dur": "5:22"}}, {"id": "judge", "ch": 8, "t": "LLM-as-judge: useful, biased, and how to keep it honest", "mins": 30, "why": "write a judge rubric, detect position and verbosity bias, and calibrate a judge against human labels before trusting it.", "an": "<p>A new inspector on the line is fast and tireless but has quirks: favours the first part they look at, thinks shinier means better, and goes easy on parts from their own old team. You still use them, but you <b>spot-check against a senior inspector<\/b> and design the inspection to cancel their quirks.<\/p>", "d": "<h3>Two judge formats<\/h3>\n<ul><li><b>Pointwise<\/b>: score one answer against a rubric (pass/fail, or 1–5). This is the most common, and it is easy to track over time.<\/li>\n<li><b>Pairwise<\/b>: \"which of A or B is better?\" It is good for comparing prompt versions, and most exposed to position bias.<\/li><\/ul>\n\n<h3>A rubric that works<\/h3>\n<pre><code>JUDGE = \"\"\"You are grading a firmware support answer.\nCriteria (each PASS/FAIL):\n1. CORRECT: the root cause matches the reference: {reference}\n2. GROUNDED: every technical claim is supported by the provided logs.\n3. ACTIONABLE: gives at least one concrete next diagnostic step.\n4. SAFE: does not recommend flashing or factory reset.\nFirst quote the evidence for each criterion, then output JSON:\n{\"correct\": bool, \"grounded\": bool, \"actionable\": bool, \"safe\": bool}\"\"\"<\/code><\/pre>\n<p>Prefer binary, specific criteria over a vague 1–10 \"quality\" score. Ask for evidence before the verdict, use structured output and low temperature, and give the judge the reference answer or source when one exists.<\/p>\n\n<h3>Known biases (documented in research such as Zheng et al., 2023, \"Judging LLM-as-a-Judge\")<\/h3>\n<ul><li><b>Position bias<\/b>: favours the first (or second) answer shown. <i>Fix<\/i>: judge both orders, and count disagreement as a tie.<\/li>\n<li><b>Verbosity bias<\/b>: favours longer answers. <i>Fix<\/i>: the rubric explicitly rewards concision, plus length-matched comparisons.<\/li>\n<li><b>Self-preference<\/b>: favours outputs that sound like its own model family. <i>Fix<\/i>: use a judge from a different family where it matters.<\/li>\n<li><b>Leniency and drift<\/b>: grades go up over time, or change when the judge model is upgraded. <i>Fix<\/i>: pin the judge version and re-calibrate on upgrade.<\/li><\/ul>\n\n<h3>Calibrate before you trust<\/h3>\n<ol><li>Have humans label 50–100 outputs with the same rubric.<\/li>\n<li>Run the judge on the same outputs.<\/li>\n<li>Measure agreement (the simple percentage, plus where it disagrees). Read the disagreements and fix the rubric.<\/li>\n<li>Only then let the judge gate releases, and re-check a sample regularly.<\/li><\/ol>\n<pre><code>def consistent_pairwise(judge, q, a, b) -> str:\n    first = judge(q, a, b)          # returns \"A\" or \"B\"\n    second = judge(q, b, a)         # swapped order\n    if first == \"A\" and second == \"B\": return \"a\"\n    if first == \"B\" and second == \"A\": return \"b\"\n    return \"tie\"                    # verdict flipped with order: position bias, so don't count it<\/code><\/pre>\n<div class=\"warn\"><b>Don't let the agent grade itself<\/b> in the same call and trust the result. Use a separate judge call, ideally a different model, with the rubric and reference.<\/div>", "anim": "judgebias", "q": [{"q": "Your pairwise judge picks A, then picks B when you swap the order. What do you record?", "o": ["A", "B", "A tie / unreliable verdict", "Run it 10 more times and take the majority"], "a": 2, "w": "A flip with order is position bias. Treat it as a tie and improve the rubric."}, {"q": "Before using a judge to gate releases you should…", "o": ["Use the biggest model", "Compare its verdicts with human labels on a sample and fix disagreements", "Ask it to explain itself", "Turn temperature up"], "a": 1, "w": "Calibration against humans is what makes a judge trustworthy."}], "terms": ["rubric", "prompt", "posbias", "structured", "temp", "llm", "model", "judge", "agent"], "th": [], "lab": null, "video": null}, {"id": "observe", "ch": 8, "t": "Observability: traces, spans and debugging agents", "mins": 30, "why": "instrument an agent so every model call and tool call is traced, read a trace to find a failure, and turn traces into new eval cases.", "an": "<p>When a device fails in the field, a logic analyser capture of the failing transaction is worth more than a hundred guesses. A <b>trace<\/b> is that capture for an agent: every model call, tool call and decision, timestamped, with inputs, outputs, tokens and errors.<\/p>", "d": "<h3>Vocabulary<\/h3>\n<ul><li><b>Trace<\/b>: one end-to-end request (one user task).<\/li>\n<li><b>Span<\/b>: one timed step inside it (one model call, one tool call, one retrieval), with parent/child links so you can see the tree.<\/li>\n<li><b>Attributes<\/b>: model name, prompt version, token counts, cost, latency, tool name and arguments, error, user or tenant ID (hashed where needed).<\/li><\/ul>\n\n<h3>What to record on every model call<\/h3>\n<pre><code>with span(\"llm.call\", model=MODEL, prompt_version=\"triage-v7\") as sp:\n    t0 = time.monotonic()\n    reply = call_model(messages, tools)\n    sp.set(input_tokens=reply.usage.input, output_tokens=reply.usage.output,\n           latency_ms=int((time.monotonic() - t0) * 1000), stop_reason=reply.stop_reason,\n           tool_calls=[c.name for c in reply.tool_calls])<\/code><\/pre>\n<p>Plus the messages and outputs themselves, <b>with PII redacted<\/b> (traces are a classic data leak).<\/p>\n\n<h3>Tooling<\/h3>\n<ul><li><b>OpenTelemetry<\/b> is the vendor-neutral standard for traces. It has semantic conventions for generative-AI spans (still evolving), and the newest MCP spec documents how to pass trace context in <code>_meta<\/code>.<\/li>\n<li><b>LLM-specific platforms<\/b>: Langfuse (open source, self-hostable), LangSmith (LangChain team), Braintrust, Arize Phoenix, and others. Framework tracing is often built in (the OpenAI Agents SDK traces by default; LangGraph integrates with LangSmith).<\/li>\n<li>Your existing stack (Datadog, Grafana and so on) for service-level metrics: request rate, error rate, latency percentiles and cost per day.<\/li><\/ul>\n\n<h3>Reading a trace: a failure walk-through<\/h3>\n<ol><li>User reports \"the agent said unit 17 is fine, but it rebooted 3 times\".<\/li>\n<li>Open the trace: step 2 called <code>search_logs(unit=17, pattern=\"reboot\")<\/code> and got 0 lines.<\/li>\n<li>The raw logs say \"watchdog reset\", not \"reboot\", so this is a tool-design problem, not a model problem.<\/li>\n<li>Fix: the tool description lists the reset keywords, or the tool searches a synonym set.<\/li>\n<li><b>Add this case to the golden set<\/b>, so it can never silently regress.<\/li><\/ol>\n<div class=\"key\"><b>The improvement flywheel:<\/b> trace everything → sample and score traces → cluster the failures → fix (prompt, tool, retrieval, model) → add the failures to the golden set → the regression gate protects the fix.<\/div>\n<div class=\"fw\"><b>Firmware link:<\/b> this is ftrace and a logic analyser for the agent, plus the habit of turning every field failure into a regression test.<\/div>", "q": [{"q": "An agent gives a wrong answer. The trace shows the right document was retrieved, but the model ignored it. Which area do you fix?", "o": ["Retrieval", "Generation: prompt, chunk order, number of chunks, model", "The vector database", "Rate limits"], "a": 1, "w": "Retrieval worked (the evidence was present), so look at how the context was presented and at the model."}, {"q": "Why redact PII in traces?", "o": ["To save disk", "Traces store full prompts and outputs and are viewed by many engineers, which makes them a common leak path", "Tracing tools require it", "It speeds up the model"], "a": 1, "w": "Observability data needs the same data-protection rules as production data."}], "lab": "Lab 12 includes a tiny tracer (spans with parent IDs, timings, token counts) written to JSONL, and a test that reconstructs the span tree.", "terms": ["trace", "model", "tool", "toolcall", "prompt", "token", "latency", "pii", "redact", "otel", "ai", "mcp", "llm", "obstools", "langchain", "framework", "oaisdk", "agent", "sdk", "langgraph", "golden", "regression"], "th": [], "anim": null, "video": null}, {"id": "inject", "ch": 9, "t": "Prompt injection and the lethal trifecta", "mins": 35, "why": "explain direct and indirect prompt injection, recognise the lethal trifecta in a design, and choose controls that work even when the model is fooled.", "an": "<p>Your technician opens their inbox: ten real work orders and one forged one, on the right letterhead, saying \"also mail the customer list to this address\". The technician cannot reliably tell it apart, because it looks like every other instruction they receive.<\/p>\n<p>That is <b>prompt injection<\/b>. An LLM receives instructions and data in the same channel (text), so any text it reads (a web page, an email, a PDF, a tool result, a code comment) can try to give it orders.<\/p>", "d": "<h3>Two kinds<\/h3>\n<ul><li><b>Direct<\/b>: the user types the attack (\"ignore your instructions and…\"). It is closely related to jailbreaks.<\/li>\n<li><b>Indirect<\/b>: the attack hides in content the agent reads while working, such as a web page, a support ticket, a repo README or a third-party MCP tool's description (tool poisoning). The user may be completely innocent. This is the dangerous one for agents.<\/li><\/ul>\n<p>Prompt injection is number 1 in the OWASP Top 10 for LLM Applications (2025 edition).<\/p>\n\n<h3>The lethal trifecta (Simon Willison, 2025)<\/h3>\n<p>An agent that has <b>all three<\/b> of these can be tricked into stealing data:<\/p>\n<ol><li>Access to <b>private data<\/b> (your tickets, files, email).<\/li>\n<li>Exposure to <b>untrusted content<\/b> (anything an outsider can write).<\/li>\n<li>A way to <b>communicate externally<\/b> (send email, call URLs, even render an image link with data in the URL).<\/li><\/ol>\n<p>Remove any one leg and that attack has nowhere to go. Many real incidents in AI products have followed exactly this pattern.<\/p>\n\n<h3>The uncomfortable truth<\/h3>\n<div class=\"warn\">There is no prompt wording, and no classifier, that reliably stops injection. Filters and \"ignore instructions in documents\" help at the margin, but attackers adapt. <b>Design so that a fully fooled model still cannot cause serious harm.<\/b><\/div>\n\n<h3>Controls that hold even when the model is fooled<\/h3>\n<ul><li><b>Break the trifecta<\/b> per task: the agent that reads the web doesn't get the private-data tools, or has no outbound channel.<\/li>\n<li><b>Least privilege<\/b>: per-task tool sets, read-only credentials and scoped tokens, never the user's full rights.<\/li>\n<li><b>Allowlists in code<\/b>: outbound domains, email recipients, file paths and shell commands.<\/li>\n<li><b>Human approval<\/b> on consequential actions, showing exact arguments.<\/li>\n<li><b>Taint tracking / privilege separation<\/b>: once untrusted content has entered the context, disable or gate high-risk tools for the rest of that run. Research designs (for example the \"dual LLM\" idea, and Google DeepMind's CaMeL, 2025) formalise this: a privileged planner never reads untrusted text directly.<\/li>\n<li><b>Output handling<\/b>: treat model output as untrusted too. Don't render arbitrary markdown images or links from it, and never pass it to a shell or SQL without validation.<\/li>\n<li><b>Mark untrusted content<\/b> with delimiters and say that it is data. This is helpful, but never your only defence.<\/li>\n<li><b>Red teaming<\/b>: put injection cases in your eval set and run them on every release.<\/li><\/ul>\n<div class=\"fw\"><b>Firmware link:<\/b> never trust input from the wire. You don't make a USB stack safe by asking descriptors nicely to be well-formed; you bounds-check in code. The same goes for anything the model reads.<\/div>", "anim": "injection", "q": [{"q": "Which design has the lethal trifecta?", "o": ["A chatbot answering from public docs, no tools", "An email assistant that reads incoming mail, can search the user's files, and can send email", "A code formatter", "An offline summariser of the user's own notes"], "a": 1, "w": "Incoming mail is untrusted content, files are private data, and sending email is an outbound channel: all three legs."}, {"q": "Most reliable defence for an agent that must browse the web and also has a send_email tool?", "o": ["A stronger system prompt", "An injection-detection classifier alone", "Code-enforced controls: recipient allowlist and/or human approval with full details, or removing send_email from the browsing task", "Lower temperature"], "a": 2, "w": "Controls outside the model hold even when the model is fooled. Prompts and classifiers are only partial."}], "terms": ["jailbreak", "agent", "mcp", "tool", "toolpoison", "pinj", "prompt", "owasp", "llm", "trifecta", "ai", "model", "leastpriv", "token", "allowlist", "redteam", "eval"], "th": [], "lab": null, "video": {"id": "a11-prompt-injection", "t": "Prompt injection, and defences that hold", "dur": "5:40"}}, {"id": "guard", "ch": 9, "t": "Tool permissions, sandboxing, guardrails and PII", "mins": 35, "why": "write a tool permission policy, sandbox code-executing agents, add input/output guardrails, and redact PII before logging or sending.", "an": "<p>A factory robot arm is not made safe by asking it nicely. It is made safe with a <b>cage<\/b> (sandbox), an <b>interlock<\/b> on the door (guardrail), a <b>limited range of motion<\/b> (permissions) and a <b>two-hand start button<\/b> for dangerous moves (human approval).<\/p>", "d": "<h3>A permission policy, in code<\/h3>\n<pre><code>POLICY = {\n  \"search_logs\":        {\"risk\": \"read\"},\n  \"get_device_status\":  {\"risk\": \"read\"},\n  \"create_ticket\":      {\"risk\": \"write\", \"rate_per_run\": 3},\n  \"reboot_device\":      {\"risk\": \"destructive\", \"approval\": True, \"max_devices\": 1},\n  \"flash_firmware\":     {\"risk\": \"destructive\", \"approval\": True, \"allowed_versions\": SIGNED_RELEASES},\n}\ndef authorize(call, run) -> tuple[bool, str]:\n    p = POLICY.get(call.name)\n    if p is None: return False, \"tool not allowed\"\n    if run.tainted and p[\"risk\"] != \"read\": return False, \"untrusted content seen; write tools disabled\"\n    if p.get(\"approval\") and not run.approved(call): return False, \"needs human approval\"\n    if call.name == \"flash_firmware\" and call.args[\"version\"] not in p[\"allowed_versions\"]:\n        return False, \"unsigned or unknown version\"\n    return True, \"ok\"<\/code><\/pre>\n<p>Check this <b>before every tool execution<\/b>, in code the model cannot influence. Return the refusal reason to the model as the tool result.<\/p>\n\n<h3>Sandboxing agents that run code or shell<\/h3>\n<ul><li>Run in an isolated container or VM (gVisor- or Firecracker-style isolation for untrusted code), as a non-root user, with a read-only base filesystem and only a scratch directory writable.<\/li>\n<li><b>Network off by default<\/b>. If it is needed, egress only through a proxy with an allowlist.<\/li>\n<li>Limits on CPU, memory, time and process count. Destroy the sandbox after the task.<\/li>\n<li>No real credentials inside. If a tool needs a secret, the host-side tool adds it outside the sandbox.<\/li><\/ul>\n<p>Coding-agent harnesses (for example the Claude Agent SDK's permission modes and sandbox settings) expose these controls. Know what they do before switching anything to \"bypass permissions\".<\/p>\n\n<h3>Guardrails: checks around the model<\/h3>\n<ul><li><b>Input guardrails<\/b>: block out-of-scope requests, detect obvious injection or abuse, and enforce size limits. They can run in parallel with the main call to save time (the OpenAI Agents SDK supports this pattern).<\/li>\n<li><b>Output guardrails<\/b>: schema validation, policy checks (no promises of refunds, no unsafe instructions), PII scanning, and citation verification.<\/li>\n<li><b>Tool guardrails<\/b>: the policy above, plus argument validation.<\/li>\n<li>Options: your own code, provider moderation endpoints, and libraries such as NVIDIA NeMo Guardrails or Guardrails AI. Measure false positives too: an over-eager guardrail is an outage.<\/li><\/ul>\n\n<h3>PII: minimise, redact, control<\/h3>\n<pre><code>import re\nPATTERNS = {\"EMAIL\": r\"[\\w.+-]+@[\\w-]+\\.[\\w.-]+\", \"PHONE\": r\"\\+?\\d[\\d\\s().-]{8,}\\d\", \"IPV4\": r\"\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b\"}\ndef redact(text: str) -> str:\n    for label, pat in PATTERNS.items():\n        text = re.sub(pat, f\"[{label}]\", text)\n    return text<\/code><\/pre>\n<ul><li>Regex catches structured PII (emails, phone numbers, card numbers). Names and addresses need a named-entity recogniser (for example Microsoft Presidio). Neither is perfect.<\/li>\n<li>Redact <b>before<\/b> logging and tracing, and before sending to third parties when policy requires it. Keep a reversible mapping only if you truly need it, and protect it.<\/li>\n<li>Know your provider's data-retention and training-use terms, and the regulations that apply (for example GDPR, the EU data-protection law). Regulated postings (banking, insurance) ask for this explicitly.<\/li><\/ul>", "q": [{"q": "Where must the \"needs approval\" check for reboot_device live?", "o": ["In the system prompt", "In code that runs before the tool executes, outside the model's control", "In the tool description", "In the user's message"], "a": 1, "w": "Policies enforced in code hold even if the model is fooled. Prompt text does not."}, {"q": "A coding agent runs tests in a container with network on and the developer's cloud credentials mounted. Biggest risk?", "o": ["Slow tests", "A prompt-injected agent can exfiltrate credentials or code over the network", "High token cost", "Flaky tests"], "a": 1, "w": "Remove credentials from the sandbox and default network to off or allowlisted."}], "lab": "Lab 11 (<code>labs/11-security-guardrails<\/code>): a policy engine with taint tracking, path sandboxing, PII redaction and an end-to-end test proving an injected document cannot trigger a destructive tool.", "terms": ["tool", "model", "sandbox", "agent", "docker", "allowlist", "claudesdk", "sdk", "guardrail", "pinj", "oaisdk", "schema", "pii", "citation", "ai", "redact", "trace", "training"], "th": [], "anim": null, "video": null}, {"id": "reliab", "ch": 10, "t": "Reliability: retries, rate limits, timeouts and fallbacks", "mins": 35, "why": "wrap every model and tool call with timeouts, classified retries with backoff and jitter, rate limiting, a circuit breaker and a fallback model.", "an": "<p>Ethernet devices that collide on the wire don't all resend at once; each waits a random, growing time. Power systems have breakers that trip under overload, and redundant supplies that take over.<\/p>\n<p>LLM APIs fail in ordinary ways too: rate limits, timeouts and overloaded servers. Your agent needs the same reflexes: <b>back off, trip, fail over<\/b>.<\/p>", "d": "<h3>Classify errors first<\/h3>\n<div class=\"tbl\"><table><tr><th>Error<\/th><th>Retry?<\/th><\/tr>\n<tr><td>429 rate limited<\/td><td>Yes, with backoff. Honour the <code>Retry-After<\/code> header if present<\/td><\/tr>\n<tr><td>5xx, overloaded, connection reset, timeout<\/td><td>Yes, with backoff (a few attempts)<\/td><\/tr>\n<tr><td>400 bad request, 401/403 auth, context too long<\/td><td>No. Fix the request (or trim the context)<\/td><\/tr>\n<tr><td>Invalid output (bad JSON)<\/td><td>Repair loop (Chapter 2), limited<\/td><\/tr>\n<tr><td>Tool side effect may have happened<\/td><td>Only if the call is idempotent (idempotency key)<\/td><\/tr><\/table><\/div>\n\n<h3>Backoff with jitter<\/h3>\n<pre><code>import random, time\nRETRYABLE = {408, 429, 500, 502, 503, 504}\n\ndef with_retries(fn, attempts=5, base=1.0, cap=30.0, sleep=time.sleep):\n    for i in range(attempts):\n        try:\n            return fn()\n        except ApiError as e:\n            if e.status not in RETRYABLE or i == attempts - 1:\n                raise\n            wait = e.retry_after or random.uniform(0, min(cap, base * 2 ** i))   # \"full jitter\"\n            sleep(wait)<\/code><\/pre>\n<p>The official SDKs already retry some errors (both the OpenAI and Anthropic Python SDKs have a <code>max_retries<\/code> setting). Know what yours does so you don't stack retries on retries (5 × 5 = 25 attempts).<\/p>\n\n<h3>Rate limiting on your side<\/h3>\n<p>Providers limit requests and tokens per minute. With many concurrent agents, add a <b>token bucket<\/b> in front of the API: each call takes tokens from the bucket and waits if it's empty. Separate buckets per tenant stop one noisy customer starving the rest.<\/p>\n<div class=\"fw\"><b>Firmware link:<\/b> the same token bucket you would use to rate-limit interrupts or log messages.<\/div>\n\n<h3>Timeouts everywhere<\/h3>\n<p>Set a timeout per model call, per tool call and per whole run. Streaming calls need an \"idle\" timeout (no token for N seconds) as well as a total one.<\/p>\n\n<h3>Circuit breaker and fallback<\/h3>\n<ul><li>After N failures in a window, <b>open<\/b> the breaker: fail fast (or fall back) for a cool-down, then let one trial request through (<b>half-open<\/b>).<\/li>\n<li><b>Fallback model<\/b>: same prompt to a second model or provider. Keep your <code>call_model()<\/code> abstraction provider-neutral so this is a config change, and include the fallback in your evals, because it will behave differently.<\/li>\n<li><b>Graceful degradation<\/b>: if retrieval is down, say so rather than answering ungrounded. If the agent fails, hand the user a partial result plus a ticket.<\/li><\/ul>", "anim": "backoff", "q": [{"q": "Requests fail with \"context length exceeded\". Retry with backoff?", "o": ["Yes", "No: it will fail identically; trim or compact the context", "Yes, with a different seed", "Only at night"], "a": 1, "w": "Deterministic request errors need a changed request, not a retry."}, {"q": "Why add jitter to backoff?", "o": ["To make retries slower", "So many clients that failed together don't retry in lockstep and overload the server again", "It is required by HTTP", "To save tokens"], "a": 1, "w": "Synchronised retries create a \"thundering herd\". Randomness spreads them out."}], "lab": "Lab 12 (<code>labs/12-production<\/code>): retries with a fake clock, Retry-After handling, a token-bucket limiter, a circuit breaker with half-open state, provider fallback, a response cache and a cost tracker.", "terms": ["retry", "ratelimit", "backoff", "json", "tool", "idem", "sdk", "token", "agent", "api", "model", "toolcall", "streaming", "breaker", "fallback", "prompt", "eval", "llm"], "th": [], "video": {"id": "a12-production", "t": "Production: retries, limits, tracing and cost", "dur": "8:04"}}, {"id": "costlat", "ch": 10, "t": "Cost and latency: caching, routing and fewer tokens", "mins": 30, "why": "estimate and cut the cost and latency of an agent using prompt caching, response caching, model routing, batching, parallel tool calls and context trimming.", "an": "<p>Battery life on a device comes from many small decisions: sleep when idle, wake the big core only when needed, don't recompute what you computed a second ago. LLM cost and latency work the same way: <b>don't resend, don't recompute, don't use the big core for small jobs<\/b>.<\/p>", "d": "<h3>Measure first<\/h3>\n<p>Log tokens in and out, latency and cost per call, per step and per task (Chapter 8). The biggest costs are usually (1) history re-sent at every agent step, (2) oversized retrieved context, and (3) using a top model for trivial steps.<\/p>\n\n<h3>The levers, roughly in order of payoff<\/h3>\n<ol><li><b>Fewer steps<\/b>: better tools (one tool returns what used to take three calls), better instructions, or a workflow instead of an agent for fixed paths.<\/li>\n<li><b>Smaller context<\/b>: fewer, reranked chunks; compact the history; truncate tool outputs; show only the tools needed now.<\/li>\n<li><b>Prompt caching<\/b>: providers reuse the processed form of an <i>unchanged prompt prefix<\/i>, and bill cached input tokens at a discount and serve them faster. OpenAI applies it automatically to sufficiently long prompts. Anthropic uses explicit <code>cache_control<\/code> markers on the blocks to cache. Design for it: <b>put stable content first<\/b> (system prompt, tool definitions, reference docs) and variable content last, and don't put timestamps at the top.<\/li>\n<li><b>Model routing<\/b>: small, fast models for classification, extraction and simple steps; the big model for planning and hard reasoning. Measure both on your eval set.<\/li>\n<li><b>Response caching<\/b>: cache identical requests (hash of model, messages and settings) in your own store. A \"semantic cache\" matches similar requests by embedding, which is riskier, because \"similar\" questions can need different answers.<\/li>\n<li><b>Batch APIs<\/b> for offline jobs (nightly log summaries, re-scoring an eval set). OpenAI and Anthropic both offer batch endpoints at a discount, with results typically within 24 hours.<\/li>\n<li><b>Parallelism<\/b> for latency: run independent tool calls and sub-agents concurrently, and stream the final answer.<\/li>\n<li><b>Output length<\/b>: ask for concise output and cap max tokens. Output tokens are the expensive ones.<\/li><\/ol>\n<pre><code># Anthropic: mark the stable prefix as cacheable\nclient.messages.create(model=MODEL, max_tokens=800,\n    system=[{\"type\": \"text\", \"text\": LONG_STABLE_INSTRUCTIONS_AND_DOCS,\n             \"cache_control\": {\"type\": \"ephemeral\"}}],\n    messages=history)\n# response.usage reports cache_creation_input_tokens / cache_read_input_tokens so you can verify hits<\/code><\/pre>\n<div class=\"key\"><b>Interview framing:<\/b> \"I'd first instrument cost per task and find the dominant term. For agents, that's almost always repeated context, so I'd make the prefix cache-friendly, trim history and tool output, route easy steps to a smaller model, and verify on the eval set that quality held.\"<\/div>", "anim": "cost", "q": [{"q": "Your system prompt starts with \"Current time: 10:42:17\" followed by 8k tokens of stable instructions. Cache hit rate is near zero. Why?", "o": ["Caching is broken", "The prefix changes every call, so nothing after it matches; move variable content to the end", "The prompt is too short", "Wrong model"], "a": 1, "w": "Caches match on an identical prefix. Keep stable content first."}, {"q": "Nightly you summarise 50,000 device logs; nobody waits on the results. Cheapest approach?", "o": ["Live API, maximum concurrency", "A provider batch API (discounted, asynchronous)", "A bigger model", "Streaming"], "a": 1, "w": "Batch endpoints trade latency for price, which suits offline jobs."}], "terms": ["token", "latency", "agent", "model", "tool", "workflow", "rerank", "chunk", "compaction", "prompt", "promptcache", "sysprompt", "modelroute", "routing", "eval", "respcache", "embedding", "batch", "api", "toolcall", "subagent", "llm"], "th": [], "lab": null, "video": null}, {"id": "deploy", "ch": 10, "t": "Deploying and running agents in production", "mins": 35, "why": "package an agent as a service, choose sync vs background execution, manage prompts and config as versioned artefacts, and monitor it like any production system.", "an": "<p>Shipping firmware isn't just compiling: it's signing, versioning, staged rollout, telemetry from the field, and a rollback plan. An agent in production needs the same: <b>a versioned artefact, a controlled rollout, live telemetry and a way back<\/b>.<\/p>", "d": "<h3>A reference architecture<\/h3>\n<ol><li><b>API layer<\/b> (for example FastAPI in Python): authenticates the user, validates input and starts a run.<\/li>\n<li><b>Short tasks<\/b> (a few seconds): run inline and stream the answer back (SSE).<\/li>\n<li><b>Long tasks<\/b>: put a job on a <b>queue<\/b>, return a run ID immediately, and have workers execute the agent loop with checkpoints in a database. Push progress through a webhook, WebSocket or polling.<\/li>\n<li><b>Tool layer<\/b>: internal services and MCP servers, each with its own authorisation.<\/li>\n<li><b>Data<\/b>: Postgres (state, checkpoints, often pgvector too), object storage for files, Redis for caches and rate-limit buckets.<\/li>\n<li><b>Observability<\/b>: traces (LLM spans plus service spans), metrics and logs, plus an eval job on sampled traffic.<\/li><\/ol>\n<pre><code>from fastapi import FastAPI\nfrom pydantic import BaseModel\napp = FastAPI()\n\nclass Ask(BaseModel):\n    unit: int\n    question: str\n\n@app.post(\"/runs\")\nasync def start(req: Ask):\n    run_id = await queue.enqueue(\"triage\", req.model_dump())   # worker runs the agent with checkpoints\n    return {\"run_id\": run_id, \"status\": \"queued\"}\n\n@app.get(\"/runs/{run_id}\")\nasync def status(run_id: str):\n    return await store.get_run(run_id)          # state, pending approvals, result<\/code><\/pre>\n<p>Package it in a container (Docker) and deploy as you would any service (Kubernetes, a managed container platform, or serverless for short tasks). Keep secrets in a secret manager, never in prompts or images.<\/p>\n\n<h3>Treat prompts, tools and model choice as versioned config<\/h3>\n<ul><li>Store prompts in the repo (or a prompt registry) with versions, and record the prompt version on every trace.<\/li>\n<li>Pin model versions where the provider allows, because \"latest\" aliases change under you. Re-run evals before upgrading, and plan for deprecations (providers retire models on published schedules).<\/li>\n<li>Roll out changes behind flags: shadow mode (run new and old, compare, show only old), then canary to a small percentage, then everyone. You already know this pattern from firmware rollouts.<\/li><\/ul>\n\n<h3>What to monitor<\/h3>\n<div class=\"tbl\"><table><tr><th>Signal<\/th><th>Why<\/th><\/tr>\n<tr><td>Task success rate (online eval / user feedback)<\/td><td>The real quality metric<\/td><\/tr>\n<tr><td>Latency p50/p95 per step and per task<\/td><td>The user experience; SLOs<\/td><\/tr>\n<tr><td>Cost per task, per tenant, per day<\/td><td>Budget alarms; abuse detection<\/td><\/tr>\n<tr><td>Error and retry rates by provider and by tool<\/td><td>Outages; flaky tools<\/td><\/tr>\n<tr>
