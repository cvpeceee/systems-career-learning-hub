"t":"TrustZone","m":"ARM's hardware split between a normal world and a secure world.","a":"A shop with a locked back office."},{"t":"coroutine","m":"A function that can pause and later resume where it left off.","a":"A bookmark in a story you come back to."},{"t":"IP","m":"Internet Protocol address (a network address); also Intellectual Property \u2014 a licensed chip design block.","a":"A street address for a computer (or a licensed blueprint for a chip part)."},{"t":"RoCE","m":"RDMA over Converged Ethernet: running RDMA on normal Ethernet networks.","a":"Express parcel lockers built on ordinary roads."},{"t":"InfiniBand","m":"A very low-latency, high-bandwidth network used in supercomputers and AI clusters.","a":"A private high-speed rail line between data-centre machines."},{"t":"NVLink","m":"NVIDIA's direct high-speed link between GPUs.","a":"A private corridor connecting two GPU rooms."},{"t":"NVSwitch","m":"NVIDIA's switch chip that connects many GPUs with NVLink at full speed.","a":"A central hallway junction linking every GPU room."},{"t":"vLLM","m":"An open-source engine for serving LLMs fast, using paged KV-cache memory.","a":"A restaurant system that packs tables tightly so more diners fit."},{"t":"OAuth","m":"A standard that lets an app act for you without your password (delegated access tokens).","a":"Giving a valet a key that only starts the car, not opens the boot."},{"t":"QoS","m":"Quality of service: marking network packets so live audio and video go ahead of bulk traffic.","a":"An ambulance lane on the highway.","say":"Q o S","src":"07"},{"t":"SerDes","m":"Serializer/Deserializer: circuits that turn parallel data into a fast serial stream and back.","a":"Turning a crowd into a single-file line to fit through a door, then back into a crowd."},{"t":"XID","m":"NVIDIA GPU error code reported by the driver (e.g. XID 79 = GPU fell off the bus).","a":"A car's dashboard fault code."},{"t":"SOF","m":"Start Of Frame: a USB packet sent every 1 ms (or 125 \u00b5s) to mark time; also Sound Open Firmware.","a":"A metronome tick that keeps everyone in time."},{"t":"FreeRTOS","m":"A popular small open-source real-time OS for microcontrollers.","a":"A tiny reliable timetable manager for small chips."},{"t":"EtherCAT","m":"A real-time industrial Ethernet bus where one frame passes through every device on the fly.","a":"A train passing every station, each passenger grabbing their mail without it stopping."},{"t":"BusyBox","m":"A single small program providing many Unix commands, used in tiny Linux systems.","a":"A Swiss-army knife of Linux tools."},{"t":"CIDR","m":"Classless Inter-Domain Routing notation like 10.0.0.0/16: an address range.","a":"A postcode that covers a whole neighbourhood."},{"t":"XOR","m":"Exclusive OR: a bit operation that outputs 1 when the inputs differ.","a":"A light that turns on only if exactly one of two switches is up."},{"t":"CSP","m":"Cloud Service Provider (AWS, Azure, Google Cloud); also Content Security Policy for web pages.","a":"A company that rents out data-centre space."},{"t":"SAE","m":"Society of Automotive Engineers (e.g. SAE autonomy levels 0\u20135).","a":"The car industry's standards committee."},{"t":"Nsight","m":"NVIDIA's profiling tools (Nsight Systems / Compute) for GPU timelines and kernels.","a":"A slow-motion camera for GPU work."},{"t":"TensorRT","m":"NVIDIA's optimizer and runtime that makes trained models run fast on its GPUs.","a":"A tuning shop that makes a car faster for one track."},{"t":"PyTorch","m":"A popular Python library for building and training neural networks.","a":"A LEGO set for AI models."},{"t":"KiB","m":"Kibibyte: 1024 bytes (MiB = 1024 KiB).","a":"A slightly bigger \"thousand\" that computers like."},{"t":"UB","m":"Undefined Behavior in C/C++: code the language rules don't define, so anything can happen.","a":"Breaking a game rule so the referee may do anything."},{"t":"HW","m":"Hardware.","a":"The physical parts."},{"t":"SW","m":"Software.","a":"The instructions."},{"t":"DC","m":"Data Centre; also Direct Current.","a":"A warehouse full of servers."},{"t":"BAR","m":"Base Address Register: a PCIe register that tells the OS where a device's memory window is.","a":"The house number where a device's control panel lives."},{"t":"RX","m":"Receive (incoming data).","a":"The inbox."},{"t":"TX","m":"Transmit (outgoing data).","a":"The outbox."},{"t":"CD","m":"Continuous Delivery/Deployment: automatically releasing tested changes.","a":"A conveyor belt from the test lab to the shop shelf."},{"t":"FLOP","m":"Floating-point operation: one decimal math step (FLOPS = per second).","a":"One sum on a calculator."},{"t":"RT","m":"Real-time: must finish within a fixed deadline; also RT kernel (PREEMPT_RT).","a":"A train that must leave exactly on time."},{"t":"PREEMPT_RT","m":"The Linux real-time patch set that makes the kernel interruptible almost everywhere.","a":"Letting an ambulance cut into any lane at any moment."},{"t":"PQ","m":"Priority Queue (usually a heap); also Product Quantization for vector search.","a":"An emergency room line ordered by urgency."},{"t":"RMS","m":"Root Mean Square: a kind of average for signals; also Rate-Monotonic Scheduling.","a":"The \"effective\" strength of a wobbling signal."},{"t":"EDA","m":"Electronic Design Automation: software used to design chips; also Exploratory Data Analysis.","a":"CAD tools for chips."},{"t":"LED","m":"Light-Emitting Diode.","a":"A tiny light bulb."},{"t":"CV","m":"Computer Vision: software that understands images; CV7 is an Ambarella camera chip.","a":"Teaching a computer to see."},{"t":"MTS","m":"Member of Technical Staff: an engineering job title.","a":"A job title meaning \"engineer\"."},{"t":"OKR","m":"Objectives and Key Results: a goal-setting method.","a":"A goal plus the scoreboard to prove it."},{"t":"BOM","m":"Bill Of Materials: the list of parts in a product.","a":"A recipe's ingredient list."},{"t":"MCP","m":"Model Context Protocol: a standard for connecting AI models to tools and data.","a":"A universal adapter between an AI and its tools."},{"t":"node","m":"One point in a graph or tree; also one machine in a cluster.","a":"A city on a map, or one computer in a group."},{"t":"edge","m":"A connection between two nodes in a graph; also \"the edge\" = servers close to users.","a":"A road between two cities."},{"t":"graph","m":"A set of nodes connected by edges.","a":"A map of cities and roads."},{"t":"topological sort","m":"An ordering of tasks so every task comes after the tasks it depends on.","a":"Getting dressed: socks before shoes."},{"t":"in-degree","m":"How many arrows point into a node.","a":"How many prerequisites a task still waits for."},{"t":"idempotency key","m":"A unique ID sent with a request so the server can recognise and ignore a retry.","a":"A raffle ticket number: the same ticket can only win once."},{"t":"lease","m":"Permission that automatically expires unless renewed.","a":"A library loan with a due date."},{"t":"fencing token","m":"An ever-increasing number given to each new leader so storage rejects writes from old leaders.","a":"A newer ticket number that makes old tickets invalid."},{"t":"replica","m":"A copy of data on another machine.","a":"A photocopy kept in another office."},{"t":"partition","m":"A network split where machines can't reach each other; also a slice of data (shard).","a":"A storm cutting the phone line between two branches."},{"t":"eviction","m":"Removing an item from a cache to make room.","a":"Clearing a shelf to fit new stock."},{"t":"pointer","m":"A variable holding the memory address of something else.","a":"A note saying \"the book is on shelf 4\"."},{"t":"array","m":"Items stored side by side in memory, reached by index.","a":"A row of numbered lockers."},{"t":"hash function","m":"A function that turns any key into a fixed-size number.","a":"A machine that turns a name into a locker number."},{"t":"inference","m":"Running a trained model to get predictions (not training it).","a":"Using a recipe you already perfected."},{"t":"kernel (GPU)","m":"A function launched to run on many GPU threads at once.","a":"One worksheet handed to every student in the stadium."},{"t":"occupancy","m":"How many GPU threads/warps are active versus the maximum.","a":"How full the classrooms are."},{"t":"bandwidth","m":"How much data moves per second.","a":"How wide the motorway is."},{"t":"telemetry","m":"Measurements a device or service sends home for monitoring.","a":"A car's dashboard readings sent to the mechanic."},{"t":"rollback","m":"Going back to the previous working version.","a":"Undoing to the last saved game."},{"t":"canary","m":"Releasing a change to a small group first to catch problems.","a":"The canary in the coal mine."},{"t":"gRPC","m":"Google's RPC framework: typed remote function calls over HTTP/2 using Protocol Buffers.","a":"A phone line where both sides agreed on the exact script."},{"t":"GIL","m":"Python's Global Interpreter Lock: only one thread runs Python code at a time.","a":"One microphone passed around a panel."},{"t":"DCGM","m":"NVIDIA Data Center GPU Manager: health and telemetry for fleets of GPUs.","a":"A fleet dashboard for GPUs."},{"t":"PagedAttention","m":"vLLM's trick of storing the KV cache in fixed-size pages, like virtual memory.","a":"Storing a long conversation on loose-leaf pages instead of one giant scroll."},{"t":"GPUDirect","m":"NVIDIA tech letting NICs and storage move data straight into GPU memory, skipping the CPU.","a":"A delivery van that drives straight into the GPU's garage."},{"t":"QP","m":"Queue Pair: an RDMA send queue plus receive queue, the connection object.","a":"A pair of in/out trays between two desks."},{"t":"SaaS","m":"Software as a Service: software you use over the web on a subscription.","a":"Renting a car instead of owning one."},{"t":"VPN","m":"Virtual Private Network: an encrypted tunnel across a public network.","a":"A private tunnel under a public road."},{"t":"SYN","m":"The first packet of a TCP handshake (\"let's talk\").","a":"Knocking on the door."},{"t":"AuthN","m":"Authentication: proving who you are.","a":"Showing your ID."},{"t":"AuthZ","m":"Authorization: deciding what you are allowed to do.","a":"Checking which rooms your badge opens."},{"t":"IdP","m":"Identity Provider: the service that logs users in and vouches for them (e.g. Okta, Google).","a":"The passport office."},{"t":"KUnit","m":"The Linux kernel's built-in unit-test framework.","a":"A test bench inside the kernel."},{"t":"MLIR","m":"Multi-Level Intermediate Representation: a compiler framework used for AI and hardware compilers.","a":"A universal draft language between recipe and kitchen."},{"t":"OpenCV","m":"A widely used open-source computer-vision library.","a":"A toolbox for image processing."},{"t":"NumPy","m":"Python's core library for fast arrays and maths.","a":"A calculator for whole tables of numbers."},{"t":"CSV","m":"Comma-Separated Values: a plain-text table format.","a":"A spreadsheet saved as plain text."},{"t":"TCO","m":"Total Cost of Ownership: all costs over a product's life, not just purchase price.","a":"The car's price plus fuel, insurance and repairs."},{"t":"FFI","m":"Foreign Function Interface: calling code written in another language (e.g. Rust calling C).","a":"An interpreter between two languages."},{"t":"GitOps","m":"Managing deployments by committing desired state to Git and letting a tool apply it.","a":"Changing the plan on the noticeboard and letting the crew follow it."},{"t":"DSA","m":"Data Structures and Algorithms.","a":"The toolbox and techniques of coding interviews."},{"t":"AMR","m":"Autonomous Mobile Robot.","a":"A robot that drives itself around a warehouse."},{"t":"TARA","m":"Threat Analysis and Risk Assessment (ISO 21434 car cybersecurity).","a":"A burglary-risk survey for a car."},{"t":"YUV422","m":"A pixel format storing brightness for every pixel and colour for every second pixel.","a":"Full detail for light and shade, half detail for colour."},{"t":"RAW10","m":"Raw camera sensor data with 10 bits per pixel, before the ISP processes it.","a":"Undeveloped film."},{"t":"GiB","m":"Gibibyte: 1024 MiB.","a":"A computer-sized \"billion bytes\"."},{"t":"SmartNIC","m":"A network card with its own processors that can run networking tasks.","a":"A mailroom with its own sorting staff."},{"t":"ThreadSanitizer","m":"TSan: a tool that detects data races between threads.","a":"A referee for threads."},{"t":"OpenTelemetry","m":"The open standard and tools for traces, metrics and logs.","a":"A common language for monitoring."},{"t":"OpenID","m":"OpenID Connect: login identity on top of OAuth.","a":"Showing a passport issued by a trusted country."},{"t":"KServe","m":"A Kubernetes system for serving ML models.","a":"A model-serving counter on Kubernetes."},{"t":"SGLang","m":"A fast LLM serving engine with structured generation.","a":"Another restaurant system for serving LLMs fast."},{"t":"VLA","m":"Vision-Language-Action model: an AI that sees, understands instructions and outputs robot actions.","a":"A robot brain that looks, listens and moves."},{"t":"EU","m":"European Union.","a":"The European group of countries."},{"t":"PM","m":"Product/Program Manager; also Power Management.","a":"The person who decides what gets built and when."},{"t":"MIPS","m":"Million Instructions Per Second; also a CPU architecture family.","a":"A speedometer for a CPU."},{"t":"CoreML","m":"Apple's framework for running ML models on iPhones and Macs.","a":"Apple's on-device AI engine."},{"t":"WaitGroup","m":"Go construct that waits for a set of goroutines to finish.","a":"A teacher waiting until every student hands in their test."},{"t":"goroutine","m":"A lightweight thread managed by the Go runtime.","a":"A cheap helper you can hire by the thousand."},{"t":"HashMap","m":"Java's hash table class.","a":"Coat-check hooks numbered by ticket."},{"t":"FunctionFS","m":"A way for a normal program, not kernel code, to implement one USB function of a gadget.","a":"Letting a contractor run one counter of the shop instead of hiring a full-time employee.","say":"function F S","src":"07"},{"t":"Composite device","m":"One USB device that offers several functions at once, like camera plus mic plus buttons.","a":"A multi-tool: one handle, several blades.","say":"composite","src":"07"},{"t":"UAC / UAC2","m":"USB Audio Class (version 2 is the modern one): the standard \"I am a mic or speaker\" language.","a":"The same universal plug idea as the webcam language, but for sound.","say":"U A C","src":"07"},{"t":"CDC / ACM","m":"Communications Device Class: a standard USB serial port or network link, handy for debug consoles.","a":"A walkie-talkie channel built into the cable for engineers to talk to the device.","say":"C D C","src":"07"},{"t":"MTP","m":"Media Transfer Protocol: how a phone shows its photos as files on a computer.","a":"A librarian handing you books one at a time instead of letting you into the stacks.","say":"M T P","src":"07"},{"t":"Isochronous transfer","m":"A USB transfer type with guaranteed timing but no retries, used for live video and audio.","a":"A live TV broadcast: always on time, and a dropped frame is simply skipped, never resent.","say":"isochronous","src":"07"},{"t":"SETUP packet / control transfer","m":"The eight-byte question the host sends on endpoint zero to start every control conversation.","a":"The short form you fill in at a counter before anything else happens.","say":"setup packet","src":"07"},{"t":"STALL","m":"The device's way of saying \"I can't do that request.\"","a":"A clerk holding up a hand: \"not at this counter.\"","say":"stall","src":"07"},{"t":"VBUS","m":"The 5-volt power wire in a USB cable; seeing it tells the device a host is attached.","a":"The doorbell wire: when it carries power, someone is at the door.","say":"V bus","src":"07"},{"t":"DRD / OTG","m":"Dual-role device: one USB port that can switch between being host and being device.","a":"A person who can be either the customer or the shopkeeper depending on who walks in.","say":"D R D","src":"07"},{"t":"USB Type-C","m":"The reversible USB connector; it also negotiates power and roles through its extra pins.","a":"A smart socket that works either way up and agrees on who powers whom before turning on.","say":"Type C","src":"07"},{"t":"CC pins","m":"The configuration-channel wires in a Type-C cable used to detect orientation and talk Power Delivery.","a":"The cable's private phone line for negotiating before the main road opens.","say":"C C","src":"07"},{"t":"Alternate mode","m":"Using some Type-C wires to carry another signal, such as DisplayPort video, instead of USB data.","a":"A multi-lane road where some lanes are temporarily given to buses.","say":"alternate mode","src":"07"},{"t":"usbmon","m":"A Linux feature that records every USB packet so you can read them in Wireshark.","a":"A security camera pointed at the USB cable.","say":"USB mon","src":"07"},{"t":"LPM / U1 / U2","m":"Link power management: USB links nap between packets to save power.","a":"Lights on a motion sensor that switch off when the hallway is empty.","say":"L P M","src":"07"},{"t":"Treble","m":"Android's split between Google's system part and the vendor's hardware part, so each can update separately.","a":"A building with a fixed wall between the landlord's floors and the tenant's floors.","say":"Treble","src":"07"},{"t":"GKI","m":"Generic Kernel Image: one Google-built Linux kernel shared by many devices, with vendor drivers loaded as modules.","a":"A standard car chassis from the factory, with each brand bolting on its own parts.","say":"G K I","src":"07"},{"t":"VINTF","m":"The vendor interface manifest: the list that says which hardware services a device provides.","a":"A restaurant's posted list of dishes it promises to serve.","say":"vintf","src":"07"},{"t":"init / .rc files","m":"The first user program Android starts; its .rc files say which services start and when.","a":"The stage manager with a script that says who walks on stage and when.","say":"init","src":"07"},{"t":"adb","m":"Android Debug Bridge: the command-line tool that gives an engineer a shell and logs on a device.","a":"A service hatch into the device for the technician.","say":"A D B","src":"07"},{"t":"CTS / VTS","m":"Android's Compatibility and Vendor Test Suites, which a device must pass to ship with Google apps.","a":"The driving test every new car model must pass before it can be sold.","say":"C T S","src":"07"},{"t":"Framework layer","m":"On Android, the Java system services apps talk to, like the camera and USB services.","a":"The dining room of a restaurant: diners (apps) only ever see this room.","say":"framework layer","src":"07"},{"t":"User space","m":"Where normal programs run, outside the kernel, protected from crashing the whole system.","a":"The public area of a building, separate from the staff-only control room.","say":"user space","src":"07"},{"t":"Kernel module","m":"A piece of kernel code that can be loaded or removed while the system runs.","a":"A plug-in cartridge for a game console.","say":"kernel module","src":"07"},{"t":"DTB / overlay","m":"The compiled, binary form of the device tree that the bootloader hands to the kernel; an overlay patches it.","a":"The printed floor plan; an overlay is a sticky note added on top.","say":"D T B","src":"07"},{"t":"regmap","m":"A kernel helper that reads and writes a chip's registers over I2C or SPI with caching.","a":"A shared notebook of a chip's settings so you do not re-ask the chip every time.","say":"reg map","src":"07"},{"t":"MMIO / register","m":"Memory-mapped input/output: hardware settings that appear as memory addresses the processor writes to.","a":"Dials on a control panel that happen to be numbered like house addresses.","say":"M M I O","src":"07"},{"t":"IRQ / interrupt","m":"Interrupt request: a hardware signal that makes the processor stop and handle an event right now.","a":"A doorbell: you stop what you are doing and answer it.","say":"I R Q","src":"07"},{"t":"ISR / top half","m":"Interrupt service routine: the tiny, fast handler that runs the moment the interrupt fires.","a":"Answering the doorbell just long enough to take the parcel.","say":"I S R","src":"07"},{"t":"Workqueue / bottom half","m":"A kernel queue that runs deferred work later in a normal context where sleeping is allowed.","a":"Putting the parcel on the table to open properly after you have closed the door.","say":"workqueue","src":"07"},{"t":"Spinlock / mutex","m":"Locks that stop two pieces of code changing the same data at once; a spinlock waits busily, a mutex sleeps.","a":"A single bathroom key: a spinlock is waiting at the door, a mutex is taking a seat until called.","say":"spinlock","src":"07"},{"t":"sysfs / ioctl","m":"Ways a program talks to a driver: sysfs files for simple settings, ioctl calls for commands.","a":"Labelled switches on the wall (sysfs) and a request form at the counter (ioctl).","say":"sys F S","src":"07"},{"t":"Media controller","m":"A kernel interface that describes and connects the blocks of a camera pipeline (sensor, image processor, outputs).","a":"A train-yard map with switch levers you set before the train runs.","say":"media controller","src":"07"},{"t":"ALSA / ASoC","m":"Advanced Linux Sound Architecture: the kernel's audio system; ASoC is its part for chips on boards.","a":"The plumbing that carries sound from microphones to programs and back to speakers.","say":"ALSA","src":"07"},{"t":"MIPI CSI","m":"The fast camera interface between an image sensor and the processor.","a":"A dedicated pipe from the camera eye to the brain.","say":"C S I","src":"07"},{"t":"YUY2 / NV12 / MJPEG","m":"Ways to pack image pixels: brightness and colour stored separately (YUY2, NV12) or compressed per frame (MJPEG).","a":"Different ways to pack a suitcase: rolled, folded, or vacuum-sealed.","say":"pixel formats","src":"07"},{"t":"U-Boot / ABL / XBL","m":"Common bootloaders: U-Boot on many boards; ABL and XBL on Qualcomm chips.","a":"Different brands of stagehand, each with its own checklist.","say":"U boot","src":"07"},{"t":"Boot ROM","m":"Code burned into the chip at the factory that runs first and checks the next stage.","a":"The building's foundation stone: cannot be changed and everything rests on it.","say":"boot ROM","src":"07"},{"t":"Secure boot / chain of trust","m":"Each boot stage checks the digital signature of the next before running it.","a":"Each guard checks the next guard's badge before handing over the keys.","say":"secure boot","src":"07"},{"t":"TEE / TF-A","m":"Trusted execution environment: a walled-off secure world on the processor for keys and secrets.","a":"A bank vault inside the building that even the building manager cannot enter.","say":"T E E","src":"07"},{"t":"AVB / dm-verity","m":"Android Verified Boot and dm-verity: checks that the system partitions have not been changed, block by block.","a":"A tamper seal on every page of the rulebook.","say":"A V B","src":"07"},{"t":"A/B partitions","m":"Two copies of the system; update the idle one and switch, falling back if the new one fails.","a":"Two identical stages: rehearse on one while the show runs on the other.","say":"A B slots","src":"07"},{"t":"Yocto / BitBake","m":"A build system that compiles a whole custom Linux image from recipes; BitBake is its build engine.","a":"A bakery that follows recipe cards to bake a whole custom cake from scratch.","say":"Yocto","src":"07"},{"t":"Buildroot","m":"A simpler build system that makes a small Linux image from one configuration menu.","a":"A meal kit: fewer choices, but dinner is ready fast.","say":"Buildroot","src":"07"},{"t":"Codec","m":"Software or hardware that compresses and decompresses video or audio.","a":"Vacuum-packing clothes for travel, then unpacking them at the hotel.","say":"codec","src":"07"},{"t":"H.264 / H.265","m":"Standard video compression formats; H.265 needs about half the bits of H.264 for the same quality.","a":"Two generations of vacuum-packing: the newer one squeezes tighter.","say":"H two sixty four","src":"07"},{"t":"I-frame / keyframe","m":"A complete picture in a video stream; the frames between only store changes.","a":"A full photo every so often, with sticky notes of changes in between.","say":"I frame","src":"07"},{"t":"SVC","m":"Scalable Video Coding: video sent in layers so a slow receiver can drop layers instead of the whole picture.","a":"A layered cake: a guest with little appetite takes just the bottom layer.","say":"S V C","src":"07"},{"t":"EDID / HPD","m":"EDID is the screen's description of what it can show; hot-plug detect (HPD) is the wire that says a screen is connected.","a":"A guest's dietary card (EDID) and the doorbell that says they arrived (HPD).","say":"E D I D","src":"07"},{"t":"HDCP","m":"A copy-protection handshake on video links.","a":"A ticket check at the cinema door.","say":"H D C P","src":"07"},{"t":"DRM / KMS","m":"The Linux display system (Direct Rendering Manager) that drives screens and outputs.","a":"The stage lighting desk that decides what appears on each screen.","say":"D R M","src":"07"},{"t":"TinyUSB","m":"A small open-source USB stack used on microcontrollers.","a":"A pocket phrasebook for USB instead of the full dictionary.","say":"Tiny USB","src":"07"},{"t":"JTAG / SWD","m":"Hardware debug ports that let a debugger stop the processor and read its memory.","a":"A doctor's stethoscope plugged straight into the chip.","say":"J tag","src":"07"},{"t":"Kernel oops","m":"The kernel's crash report: which function failed, at which address, with the call stack.","a":"A black-box flight recorder printout.","say":"oops","src":"07"},{"t":"ftrace / perf","m":"Built-in Linux tracing (ftrace) and profiling (perf) tools that show where time goes.","a":"A stopwatch and a step counter clipped onto the kernel.","say":"F trace","src":"07"},{"t":"ASan / KASAN","m":"Address sanitizers: build options that catch memory bugs like overflows the moment they happen.","a":"A smoke alarm for memory mistakes.","say":"A san","src":"07"},{"t":"CI / HIL","m":"Continuous integration runs tests on every change; hardware-in-the-loop (HIL) runs them on real boards.","a":"A quality inspector at every station of the assembly line, some with real parts on the bench.","say":"C I","src":"07"},{"t":"Wi-Fi / Bluetooth","m":"Short-range radio links: Wi-Fi for network data, Bluetooth for headsets and accessories.","a":"A home phone line and a walkie-talkie.","say":"Wi-Fi and Bluetooth","src":"07"},{"t":"SBOM / CVE","m":"A software bill of materials lists every component; a CVE is a published security bug in one.","a":"An ingredients label, and a product-recall notice for one ingredient.","say":"S bomb","src":"07"},{"t":"Runtime PM / suspend","m":"Turning parts of the device off when idle and back on when needed.","a":"Motion-sensor lights for each room of the house.","say":"runtime power management","src":"07"}];
