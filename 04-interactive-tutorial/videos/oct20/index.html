</script><!--JARGON-START--><script>window.SHARED_GLOSSARY=[{"t":"DMA","m":"Direct memory access: a hardware helper that copies data to memory without the processor doing each byte.","a":"A conveyor belt that moves boxes while the worker does something else.","say":"D M A","src":"07"},{"t":"ISP","m":"Image signal processor: the chip block that turns raw sensor data into a good-looking picture.","a":"A photo lab that develops the raw film into a finished print.","say":"I S P","src":"07"},{"t":"GPU","m":"Graphics Processing Unit: a chip with thousands of small cores that do the same math on lots of data at once.","a":"A stadium of students each solving one simple sum at the same time."},{"t":"AI","m":"Artificial Intelligence: software that learns patterns from data to make predictions or decisions.","a":"A trainee who learns by looking at thousands of worked examples."},{"t":"CPU","m":"Central Processing Unit: the main general-purpose processor that runs programs step by step.","a":"The head chef who can cook anything, one dish at a time."},{"t":"DRAM","m":"Dynamic RAM: the main working memory of a computer; fast but forgets everything when power is off.","a":"A whiteboard: quick to write on, wiped when the lights go out."},{"t":"CUDA","m":"NVIDIA's programming platform for writing code that runs on its GPUs.","a":"The instruction manual for directing the stadium of students."},{"t":"RDMA","m":"Remote Direct Memory Access: one machine writes straight into another machine's memory over the network, skipping the CPU.","a":"Dropping a parcel straight into a neighbour's locker instead of handing it to their receptionist."},{"t":"PID","m":"Proportional-Integral-Derivative controller: a feedback loop that nudges a motor or heater toward a target; also Process ID in Linux.","a":"Steering a car: correct for how far off you are, how long you've been off, and how fast you're drifting."},{"t":"ROS","m":"Robot Operating System: a toolkit of libraries and message passing for building robot software.","a":"A shared intercom system so every robot part can talk to every other part."},{"t":"DT","m":"Device Tree: a text file that describes the hardware on a board so the Linux kernel knows what is there.","a":"A floor plan of the house handed to the electrician before they start."},{"t":"IOMMU","m":"Input-Output Memory Management Unit: hardware that controls which memory a device is allowed to touch.","a":"A building security guard who checks every delivery driver's badge before they enter a room."},{"t":"IRQ","m":"Interrupt Request: a signal from hardware telling the CPU \"stop and deal with me now\".","a":"A doorbell ringing while you are cooking."},{"t":"MIPI","m":"Mobile Industry Processor Interface: a family of standard high-speed wires between chips, cameras (CSI) and displays (DSI).","a":"A standard plug shape so any camera fits any phone board."},{"t":"OS","m":"Operating System: the core software (like Linux or Android) that manages hardware and runs apps.","a":"The building manager who hands out rooms, power and water to tenants."},{"t":"SDK","m":"Software Development Kit: a bundle of libraries, tools and docs for building on a platform.","a":"A toolbox that comes with a new piece of furniture."},{"t":"MMIO","m":"Memory-Mapped I/O: controlling hardware by reading and writing special memory addresses.","a":"Light switches that look like ordinary mailboxes: put a letter in and a light turns on."},{"t":"ISR","m":"Interrupt Service Routine: the short function that runs when a hardware interrupt fires.","a":"The person who jumps up to answer the doorbell."},{"t":"BSP","m":"Board Support Package: the chip vendor's bundle of bootloader, kernel, drivers and settings for one chip or board.","a":"The starter kit that comes with a new appliance: parts, manual and tools for that exact model.","say":"B S P","src":"07"},{"t":"ML","m":"Machine Learning: teaching a computer from example data instead of hand-written rules.","a":"Learning to spot ripe fruit by looking at many examples, not reading a rulebook."},{"t":"LRU","m":"Least Recently Used: a cache rule that throws out whatever was used longest ago.","a":"Clearing the fridge by tossing what nobody has touched in the longest time."},{"t":"CI","m":"Continuous Integration: every code change is automatically built and tested.","a":"A quality inspector who checks every part as soon as it comes off the line."},{"t":"API","m":"Application Programming Interface: the agreed set of functions or requests one piece of software offers another.","a":"A restaurant menu: you order from it without knowing how the kitchen works."},{"t":"RTOS","m":"Real-time operating system: a tiny scheduler that guarantees tasks run within deadlines.","a":"A strict school timetable: every class starts exactly on the bell.","say":"R toss","src":"07"},{"t":"BFS","m":"Breadth-First Search: explore a graph level by level using a queue.","a":"Ripples spreading out from a stone dropped in a pond."},{"t":"DFS","m":"Depth-First Search: explore a graph by going as deep as possible before backing up.","a":"Exploring a maze by always following one wall until a dead end, then backing up."},{"t":"VM","m":"Virtual Machine: a whole computer simulated in software on top of a real one.","a":"A flat inside an apartment block: feels like your own house, shares the building."},{"t":"RAII","m":"Resource Acquisition Is Initialization: a C++ habit where an object frees its resource automatically when it goes out of scope.","a":"A hotel key card that stops working the moment you check out."},{"t":"NIC","m":"Network Interface Card: the hardware that connects a computer to a network.","a":"The mailbox and postman's slot of a house."},{"t":"GPIO","m":"General-purpose input/output: a single pin software can switch on or off, or read.","a":"A light switch the software can flip or check.","say":"G P I O","src":"07"},{"t":"I2C","m":"A simple two-wire bus that lets a processor talk to small chips like sensors and HDMI bridges.","a":"A classroom where the teacher calls each student by number and they answer one at a time.","say":"I two C","src":"07"},{"t":"SPI","m":"A fast four-wire bus for chips like flash memory and displays.","a":"A dedicated phone line to each chip instead of a shared classroom.","say":"S P I","src":"07"},{"t":"JSON","m":"JavaScript Object Notation: a plain-text format for structured data.","a":"A neatly labelled packing list."},{"t":"OTA","m":"Over-the-air update: new software delivered to devices in the field over the network.","a":"A software home delivery, no service visit needed.","say":"O T A","src":"07"},{"t":"AWS","m":"Amazon Web Services: Amazon's cloud computing platform.","a":"Renting power and storage from a giant utility company."},{"t":"LLM","m":"Large Language Model: an AI trained on huge amounts of text to predict and generate language.","a":"An extremely well-read autocomplete."},{"t":"CAP","m":"CAP theorem: in a network split, a distributed database must choose Consistency or Availability.","a":"Two bank branches cut off by a storm: either both stop serving or they risk disagreeing."},{"t":"UI","m":"User Interface: the screens and controls a person uses.","a":"The dashboard of a car."},{"t":"ARM","m":"A family of power-efficient processor designs used in phones and embedded chips.","a":"A popular engine blueprint many car makers license."},{"t":"KV","m":"Key-Value store: a database that maps a key to a value, like a dictionary.","a":"A coat check: give a ticket, get your coat."},{"t":"TCP","m":"Transmission Control Protocol: reliable, ordered delivery of bytes over a network.","a":"Registered mail with receipts and re-sends if a letter is lost."},{"t":"UDP","m":"User Datagram Protocol: fast, connectionless packets with no delivery guarantee.","a":"Throwing postcards: fast, but some may get lost."},{"t":"SPSC","m":"Single-Producer Single-Consumer queue: one writer, one reader, can be lock-free.","a":"A one-lane drive-through: one cook passes, one customer takes."},{"t":"MPMC","m":"Multi-Producer Multi-Consumer queue: many writers and many readers share it.","a":"A busy buffet with many cooks and many diners."},{"t":"DP","m":"Dynamic Programming: solve a problem by storing answers to smaller sub-problems and reusing them; also DisplayPort.","a":"Writing intermediate sums in a notebook so you never redo them."},{"t":"QEMU","m":"A program that emulates a whole computer, so you can test kernels without real hardware.","a":"A flight simulator for software.","say":"kew em you","src":"07"},{"t":"GIC","m":"Generic Interrupt Controller: ARM's chip block that routes interrupts to CPU cores.","a":"A hotel switchboard routing doorbells to the right room."},{"t":"VFS","m":"Virtual File System: the Linux layer that makes every file system look the same to programs.","a":"A universal remote that works any TV brand."},{"t":"BMC","m":"Baseboard Management Controller: a small separate computer on a server board for remote power and health control.","a":"A building caretaker who can reboot the furnace even when the owner is away."},{"t":"SDN","m":"Software-Defined Networking: network routing decided by central software, not each box.","a":"Air traffic control directing all planes from one tower."},{"t":"OOM","m":"Out Of Memory: the system ran out of RAM; Linux may kill a process to recover.","a":"A full fridge: something must be thrown out before anything new goes in."},{"t":"GPS","m":"Global Positioning System: satellites that let a receiver compute its location.","a":"Working out where you are from how long several far-away shouts take to reach you."},{"t":"MTBF","m":"Mean Time Between Failures: average running time before something breaks.","a":"How many miles a car goes on average before a breakdown."},{"t":"NUMA","m":"Non-Uniform Memory Access: on big servers, memory near a CPU is faster than memory near another CPU.","a":"Your own kitchen cupboard is quicker than walking to the neighbour's."},{"t":"CLI","m":"Command-Line Interface: controlling a program by typing commands.","a":"Ordering by speaking exact words to the waiter instead of pointing at pictures."},{"t":"DNS","m":"Domain Name System: turns names like google.com into IP addresses.","a":"The phone book of the internet."},{"t":"NPU","m":"Neural Processing Unit: a chip block built to run AI models efficiently.","a":"A specialised calculator made just for neural-network math."},{"t":"RAM","m":"Random Access Memory: fast working memory for running programs.","a":"Your desk surface: fast to reach, limited space."},{"t":"TTL","m":"Time To Live: how long a cached value or packet is allowed to exist.","a":"A \"best before\" date on food."},{"t":"PACELC","m":"Extension of CAP: if Partitioned choose Availability or Consistency, Else choose Latency or Consistency.","a":"Even on a sunny day, a fast answer and a perfectly checked answer trade off."},{"t":"GC","m":"Garbage Collection: automatic freeing of memory a program no longer uses.","a":"A cleaner who clears away dishes nobody is using."},{"t":"SLO","m":"Service Level Objective: a target like \"99.9% of requests under 200 ms\".","a":"A pizza shop promising delivery in 30 minutes 999 times out of 1000."},{"t":"SLA","m":"Service Level Agreement: a contract promising a level of service, with penalties if missed.","a":"The written guarantee with a refund if the pizza is late."},{"t":"E2E","m":"End-to-end: across the whole path from start to finish.","a":"Timing the whole trip door to door, not just the train ride."},{"t":"OCI","m":"Oracle Cloud Infrastructure: Oracle's cloud platform; also Open Container Initiative (container format standard).","a":"Oracle's rentable data-centre city."},{"t":"ECC","m":"Error-Correcting Code memory: memory that detects and fixes flipped bits.","a":"A spell-checker built into the paper itself."},{"t":"SQL","m":"Structured Query Language: the standard language for asking questions of relational databases.","a":"A precise form you fill in to ask a librarian for books."},{"t":"NCCL","m":"NVIDIA Collective Communications Library: fast routines for GPUs to share data during training.","a":"A group chat protocol that lets GPUs pass notes as fast as possible."},{"t":"XDP","m":"eXpress Data Path: run small programs on packets at the earliest point in the Linux network driver.","a":"A bouncer at the front gate who turns people away before they enter the club."},{"t":"NMS","m":"Non-Maximum Suppression: removing overlapping duplicate detection boxes, keeping the best one.","a":"When five people point at the same bird, keep only the most confident pointer."},{"t":"V4L2","m":"Video for Linux 2: the kernel interface every Linux camera and video device uses.","a":"The standard loading dock every camera truck backs into.","say":"V four L two","src":"07"},{"t":"FP32","m":"32-bit floating-point number: standard precision for decimals.","a":"A ruler with fine millimetre marks."},{"t":"FP16","m":"16-bit floating-point: half precision, faster and smaller, less exact.","a":"A ruler with only half-centimetre marks."},{"t":"HBM","m":"High Bandwidth Memory: stacked memory placed right next to a GPU for huge data speed.","a":"A pantry built right beside the stove."},{"t":"DB","m":"Database: an organised store of data you can query.","a":"A filing cabinet with an index."},{"t":"URL","m":"Uniform Resource Locator: a web address.","a":"A street address for a web page."},{"t":"CAS","m":"Compare-And-Swap: an atomic CPU instruction that updates a value only if it still has the expected old value.","a":"\"Change the price to 6 only if the tag still says 5.\""},{"t":"CDN","m":"Content Delivery Network: servers spread around the world that cache content close to users.","a":"Local warehouses so parcels don't ship from one central depot."},{"t":"LSM","m":"Log-Structured Merge tree: a storage design that writes sequentially and merges sorted files later; also Linux Security Module.","a":"Dropping mail into a tray and sorting it in batches later."},{"t":"HTTP","m":"HyperText Transfer Protocol: the request/response language of the web.","a":"A standard way to ask a shop counter for an item and get it back."},{"t":"MCU","m":"Microcontroller: a small, low-power chip with its own memory, running firmware without a full operating system.","a":"A pocket calculator compared with a laptop.","say":"M C U","src":"07"},{"t":"GDB","m":"GNU Debugger: a tool to pause a program, inspect variables and step through code.","a":"A pause button and magnifying glass for running code."},{"t":"DPDK","m":"Data Plane Development Kit: libraries for processing packets in user space at very high speed, bypassing the kernel.","a":"A private express lane that skips the toll booths."},{"t":"TFLOP","m":"Tera floating-point operations: a trillion decimal math operations (per second when used as speed).","a":"A trillion sums."},{"t":"SIMD","m":"Single Instruction Multiple Data: one CPU instruction applied to many values at once.","a":"A cookie cutter stamping eight cookies in one press."},{"t":"ID","m":"Identifier: a unique name or number for a thing.","a":"A name tag."},{"t":"DSP","m":"Digital Signal Processor: a chip specialised for audio/radio/sensor math.","a":"A sound engineer's mixing desk in silicon."},{"t":"SSD","m":"Solid-State Drive: storage made of flash chips, no moving parts.","a":"A fast filing drawer with no motor."},{"t":"TTFT","m":"Time To First Token: how long an LLM takes before it starts answering.","a":"How long before the waiter brings the first dish."},{"t":"MQTT","m":"A lightweight publish/subscribe messaging protocol for small devices.","a":"A community notice board: post to a topic, subscribers get it."},{"t":"UART","m":"A simple serial port, often the first console you see when a board boots.","a":"A tin-can telephone straight into the board.","say":"U art","src":"07"},{"t":"HIL","m":"Hardware-In-the-Loop: testing real controller hardware against a simulated world.","a":"A pilot in a flight simulator using the real cockpit."},{"t":"QPS","m":"Queries Per Second: how many requests a system handles each second.","a":"Customers served per second at a till."},{"t":"PII","m":"Personally Identifiable Information: data that can identify a person.","a":"The contents of your wallet."},{"t":"CAN","m":"Controller Area Network: a robust bus used in cars and robots for controllers to talk.","a":"A shared walkie-talkie channel where the most urgent message always wins."},{"t":"HDR","m":"High Dynamic Range: images that keep detail in both very bright and very dark parts.","a":"Seeing both the sunny window and the dark room clearly at once."},{"t":"USB","m":"Universal Serial Bus: the standard cable/protocol for connecting devices to a computer.","a":"A universal power-and-data plug for gadgets."},{"t":"HDMI","m":"The common cable standard for sending video and audio to TVs and monitors.","a":"A garden hose for pictures and sound.","say":"H D M I","src":"07"},{"t":"ROM","m":"Read-Only Memory: memory written once at the factory, like the chip's built-in first boot code.","a":"A printed book: you can read it but not rewrite it."},{"t":"MPS","m":"NVIDIA Multi-Process Service: lets several processes share one GPU at the same time.","a":"Several families sharing one big kitchen at once."},{"t":"DGX","m":"NVIDIA's packaged AI server with 8 GPUs.","a":"A ready-built AI workstation in a box."},{"t":"STAR","m":"Situation, Task, Action, Result: a structure for answering behavioural interview questions.","a":"Telling a story with a beginning, your goal, what you did, and how it ended."},{"t":"DDS","m":"Data Distribution Service: publish/subscribe middleware used by ROS 2 and robots.","a":"A radio station network: tune in to the topic you need."},{"t":"CFS","m":"Completely Fair Scheduler: Linux's classic scheduler that shares CPU time fairly.","a":"A teacher giving every child equal turns on the swing."},{"t":"EC","m":"Erasure Coding: storing data as pieces plus parity so lost pieces can be rebuilt; also Embedded Controller.","a":"A puzzle where any 8 of 10 pieces are enough to rebuild the picture."},{"t":"FSD","m":"Tesla Full Self-Driving: Tesla's driver-assistance and autonomy software and chip.","a":"A chauffeur made of cameras and neural networks."},{"t":"GEMM","m":"General Matrix Multiply: the big matrix multiplication at the heart of neural networks.","a":"Filling a huge times-table grid."},{"t":"IPC","m":"Inter-Process Communication: ways separate programs exchange data; also Instructions Per Cycle.","a":"Passing notes between rooms."},{"t":"MIG","m":"Multi-Instance GPU: splitting one NVIDIA GPU into isolated smaller GPUs.","a":"Partitioning one big office into private cubicles."},{"t":"RPC","m":"Remote Procedure Call: calling a function that actually runs on another machine.","a":"Phoning a colleague to do a calculation for you."},{"t":"SRE","m":"Site Reliability Engineering: engineering practice for keeping services up and fast.","a":"The pit crew that keeps the race car running."},{"t":"IK","m":"Inverse Kinematics: computing joint angles so a robot hand reaches a target point.","a":"Working out how to bend your shoulder, elbow and wrist to touch your nose."},{"t":"FIFO","m":"First In, First Out: things leave in the order they arrived.","a":"A queue at a bus stop."},{"t":"LIFO","m":"Last In, First Out: the newest item leaves first.","a":"A stack of plates."},{"t":"BST","m":"Binary Search Tree: a tree where left children are smaller and right children are bigger.","a":"A guessing game: \"higher or lower?\" at every step."},{"t":"UTF","m":"Unicode Transformation Format (e.g. UTF-8): a way to store any language's characters as bytes.","a":"A universal alphabet code book."},{"t":"CMA","m":"Contiguous Memory Allocator: Linux reserves big unbroken memory blocks for devices like cameras.","a":"Reserving a whole row of seats so a group can sit together."},{"t":"TOPS","m":"Tera Operations Per Second: trillions of (usually integer AI) operations each second.","a":"How many trillion sums a chip can do per second."},{"t":"DTS","m":"Device Tree Source: the human-readable text file of a device tree.","a":"The floor plan before it is printed."},{"t":"DTB","m":"Device Tree Blob: the compiled binary device tree the bootloader hands to the kernel.","a":"The printed floor plan handed to the builder."},{"t":"NAPI","m":"New API: Linux network-driver mode that switches from interrupts to polling under heavy load.","a":"Stop answering the doorbell each time; just check the porch every few seconds when it's busy."},{"t":"TLB","m":"Translation Lookaside Buffer: a small cache of recent virtual-to-physical address translations.","a":"A sticky note of the addresses you visit most."},{"t":"MSI","m":"Message-Signaled Interrupt: a device raises an interrupt by writing to a memory address instead of a wire.","a":"Sending a text message instead of ringing a bell."},{"t":"NFS","m":"Network File System: accessing files on another computer as if local.","a":"A shared cupboard in the hallway everyone can open."},{"t":"MESI","m":"Modified/Exclusive/Shared/Invalid: a protocol that keeps CPU caches agreeing about memory.","a":"Roommates keeping their copies of a shopping list in sync."},{"t":"GMSL","m":"Gigabit Multimedia Serial Link: a long-cable serial link for cameras in cars and robots.","a":"A long, thick hose carrying camera video around a vehicle."},{"t":"KASAN","m":"Kernel Address Sanitizer: a Linux debug tool that catches bad memory accesses in the kernel.","a":"A smoke detector for memory mistakes."},{"t":"EL3","m":"Exception Level 3: the most privileged ARM mode, used by secure firmware.","a":"The master key level of the building."},{"t":"EL2","m":"Exception Level 2: ARM mode for hypervisors.","a":"The building manager level."},{"t":"EL1","m":"Exception Level 1: ARM mode for the OS kernel.","a":"The apartment owner level."},{"t":"EL0","m":"Exception Level 0: ARM mode for ordinary apps.","a":"The guest level."},{"t":"OIDC","m":"OpenID Connect: a standard for logging in with another service's identity (like \"Sign in with Google\").","a":"Showing your passport issued by a trusted country."},{"t":"INT8","m":"8-bit integer numbers: used to run AI models faster with less precision.","a":"Rounding prices to whole dollars to add them faster."},{"t":"KMD","m":"Kernel-Mode Driver: the part of a driver that runs inside the OS kernel.","a":"The engine-room crew."},{"t":"UMD","m":"User-Mode Driver: the part of a driver that runs as a normal program.","a":"The front-of-house staff."},{"t":"MTU","m":"Maximum Transmission Unit: the largest packet size a network link carries.","a":"The height limit of a tunnel."},{"t":"TLS","m":"Transport Layer Security: encryption for network connections (the \"S\" in HTTPS).","a":"A sealed, tamper-proof envelope."},{"t":"HTTPS","m":"HTTP over TLS: encrypted web traffic.","a":"Shopping at a counter behind bulletproof glass."},{"t":"SRAM","m":"Static RAM: very fast on-chip memory, used for caches.","a":"The pocket on your apron: tiny but instant."},{"t":"EKF","m":"Extended Kalman Filter: a math filter that fuses noisy sensors into a best estimate for non-linear systems.","a":"Combining a shaky compass and a guess of your speed to know where you are."},{"t":"ACPI","m":"Advanced Configuration and Power Interface: tables firmware gives the OS describing hardware and power (PC/server equivalent of device tree).","a":"The building's official spec sheet handed to the manager."},{"t":"CRDT","m":"Conflict-free Replicated Data Type: data structures that merge edits from many copies without conflicts.","a":"Shared shopping lists that always merge cleanly, whoever edits first."},{"t":"PHY","m":"The physical-layer circuit that turns bits into electrical signals on the wire.","a":"The voice box that turns your thoughts into sound waves.","say":"phy","src":"07"},{"t":"YAML","m":"A human-friendly text format for configuration files.","a":"A tidy, indented to-do list."},{"t":"MPI","m":"Message Passing Interface: standard library for programs on many computers to exchange messages.","a":"A walkie-talkie protocol for a team of computers."},{"t":"D2H","m":"Device-to-Host: data copied from the GPU/device back to the CPU's memory.","a":"Shipping finished goods back from the factory."},{"t":"H2D","m":"Host-to-Device: data copied from CPU memory to the GPU/device.","a":"Shipping raw materials to the factory."},{"t":"NAND","m":"The type of flash memory used in SSDs, phones and eMMC.","a":"Rows of tiny buckets that hold electric charge."},{"t":"THP","m":"Transparent Huge Pages: Linux automatically using big memory pages to reduce translation overhead.","a":"Using whole pallets instead of single boxes."},{"t":"RFC","m":"Request For Comments: the documents that define internet standards.","a":"The official rulebook of the internet."},{"t":"ACK","m":"Acknowledgement: a reply saying \"I got it\".","a":"A delivery signature."},{"t":"NN","m":"Neural Network: layers of simple math units that learn from data.","a":"A huge web of tiny adjustable knobs tuned by examples."},{"t":"PLL","m":"Phase-Locked Loop: a circuit that generates a stable high-frequency clock from a slower one.","a":"A drummer who listens to a slow beat and plays exactly four times faster."},{"t":"UKF","m":"Unscented Kalman Filter: a Kalman filter variant that handles curvy (non-linear) systems by testing sample points.","a":"Testing a few guesses around your estimate to see where they land."},{"t":"FSDP","m":"Fully Sharded Data Parallel: splitting a model's weights across GPUs during training.","a":"Each team member carries only part of the luggage."},{"t":"PTX","m":"NVIDIA's intermediate GPU assembly language.","a":"A recipe written in a chef's shorthand before final translation."},{"t":"MFA","m":"Multi-Factor Authentication: logging in with two or more proofs (password plus phone).","a":"A key plus a fingerprint to open the door."},{"t":"DDR","m":"Double Data Rate memory: the common type of DRAM chips.","a":"A conveyor belt that loads on both the up and down swing."},{"t":"PCI","m":"Peripheral Component Interconnect (PCIe today): the high-speed bus for cards like GPUs and NICs.","a":"A motorway between the CPU and big add-on cards."},{"t":"PCIe","m":"PCI Express: the modern high-speed serial version of PCI.","a":"A multi-lane motorway for expansion cards."},{"t":"RL","m":"Reinforcement Learning: an AI learns by trial and error with rewards.","a":"Training a dog with treats."},{"t":"JTAG","m":"A debug port on chips for halting the CPU and reading memory directly.","a":"A service hatch that lets the mechanic stop the engine mid-run."},{"t":"WAN","m":"Wide Area Network: a network spanning cities or countries.","a":"The national road network."},{"t":"LAN","m":"Local Area Network: a network within a building.","a":"The hallways inside one building."},{"t":"GRUB","m":"The common Linux bootloader on PCs.","a":"The receptionist who decides which OS gets to start."},{"t":"VLAN","m":"Virtual LAN: splitting one physical network into isolated logical networks.","a":"Coloured lanes painted on one road."},{"t":"VXLAN","m":"Virtual Extensible LAN: wrapping network packets inside UDP to build virtual networks across data centres.","a":"Putting a letter inside a bigger envelope to cross a border."},{"t":"IEEE","m":"Institute of Electrical and Electronics Engineers: the body that publishes standards like Ethernet and Wi-Fi.","a":"The rule committee for electrical things."},{"t":"OTLP","m":"OpenTelemetry Protocol: the standard wire format for sending traces, metrics and logs.","a":"A standard shipping box for monitoring data."},{"t":"TPU","m":"Tensor Processing Unit: Google's custom AI chip.","a":"Google's own specialised AI calculator."},{"t":"UEFI","m":"Unified Extensible Firmware Interface: modern PC/server firmware that starts before the OS.","a":"The building's power-on checklist before the tenants arrive."},{"t":"SMT","m":"Simultaneous Multithreading (Hyper-Threading): one core runs two threads sharing its units.","a":"One chef with two cutting boards working on two orders."},{"t":"IMU","m":"Inertial Measurement Unit: a sensor with accelerometers and gyroscopes measuring motion.","a":"Your inner ear for balance."},{"t":"RAID","m":"Redundant Array of Independent Disks: combining disks for speed or safety.","a":"Keeping copies of your notes in several notebooks."},{"t":"ACL","m":"Access Control List: a list saying who may do what to a resource.","a":"The guest list at a club door."},{"t":"ASIC","m":"Application-Specific Integrated Circuit: a chip designed for one job.","a":"A kitchen gadget that only makes waffles, but makes them perfectly."},{"t":"PSI","m":"Pressure Stall Information: Linux metrics showing how long tasks wait for CPU, memory or I/O.","a":"A gauge showing how long people wait in line."},{"t":"RTP","m":"Real-time Transport Protocol: carries audio/video packets with timestamps for live calls.","a":"Numbered, timestamped postcards for a live broadcast."},{"t":"NTP","m":"Network Time Protocol: keeps computer clocks in sync over a network.","a":"Everyone setting their watch from the town clock."},{"t":"PTP","m":"Precision Time Protocol: sub-microsecond clock sync over a network.","a":"Setting watches by laser from the town clock."},{"t":"ALU","m":"Arithmetic Logic Unit: the part of a CPU that does maths and logic.","a":"The calculator inside the chef's head."},{"t":"MMU","m":"Memory Management Unit: hardware that translates virtual addresses to physical memory and enforces protection.","a":"A post office that redirects mail from your nickname to your real address."},{"t":"RPMB","m":"Replay Protected Memory Block: a tamper-proof area in eMMC/UFS storage.","a":"A safe-deposit box inside the storage chip."},{"t":"PFC","m":"Priority Flow Control: Ethernet pause frames per traffic class, used to make RDMA lossless.","a":"Traffic lights that hold one lane only when it's jammed."},{"t":"DPU","m":"Data Processing Unit: a smart network card with its own CPUs for networking and storage tasks.","a":"A post-room with its own staff so the office workers aren't interrupted."},{"t":"ICMP","m":"Internet Control Message Protocol: network error/diagnostic messages (like ping).","a":"The road's \"road closed\" signs."},{"t":"EDF","m":"Earliest Deadline First: a scheduler that always runs the task due soonest.","a":"Doing homework due tomorrow before homework due next week."},{"t":"RTC","m":"Real-Time Clock: a chip that keeps time even when the device is off.","a":"A wristwatch with its own battery."},{"t":"APIC","m":"Advanced Programmable Interrupt Controller: x86's interrupt router.","a":"The PC's doorbell switchboard."},{"t":"DRM","m":"Direct Rendering Manager: the Linux kernel subsystem for GPUs and displays; also Digital Rights Management.","a":"The stage manager for everything shown on screen."},{"t":"BEV","m":"Bird's-Eye View: a top-down map representation built from cameras, used in self-driving.","a":"Looking at the street from a drone."},{"t":"SBOM","m":"Software Bill Of Materials: a list of every component and version in a software product.","a":"The ingredients label on food."},{"t":"VFIO","m":"Linux framework to give a VM or user program direct, safe access to a device.","a":"Handing a tenant their own private key to a room, with the guard still watching."},{"t":"RCU","m":"Read-Copy-Update: a Linux synchronisation method where readers never block and writers publish a new copy.","a":"Updating a menu by printing a new one and swapping it in, while diners still read the old one."},{"t":"CSI","m":"Camera Serial Interface (MIPI CSI-2): the standard high-speed link from camera sensor to processor.","a":"The dedicated pipe from the camera to the photo lab."},{"t":"DSI","m":"Display Serial Interface (MIPI DSI): the link from processor to a display panel.","a":"The pipe from the kitchen to the serving window."},{"t":"PTZ","m":"Pan-Tilt-Zoom: a camera that can turn, tilt and zoom.","a":"A camera on a neck that can look around."},{"t":"ASCII","m":"A basic code mapping English letters and symbols to numbers.","a":"The original alphabet code book."},{"t":"RTT","m":"Round-Trip Time: time for a message to go and the reply to come back.","a":"The echo delay across a canyon."},{"t":"BF16","m":"Brain Float 16: 16-bit number format with FP32's range but less precision, used in AI.","a":"A ruler with the same length but fewer markings."},{"t":"UUID","m":"Universally Unique Identifier: a 128-bit random ID practically never repeated.","a":"A lottery number so long no two people ever get the same one."},{"t":"HPC","m":"High-Performance Computing: supercomputing on large clusters.","a":"A whole factory working on one giant order."},{"t":"PMU","m":"Performance Monitoring Unit: CPU counters for cycles, cache misses and so on; also Power Management Unit.","a":"A fitness tracker built into the CPU."},{"t":"ECDSA","m":"Elliptic-Curve Digital Signature Algorithm: a common way to sign firmware and certificates.","a":"A wax seal only the owner's ring can make."},{"t":"TPM","m":"Trusted Platform Module: a security chip that stores keys and measures boot.","a":"A notary built into the motherboard."},{"t":"JIT","m":"Just-In-Time compilation: turning code into machine code while the program runs.","a":"A translator who translates each sentence as you speak."},{"t":"POSIX","m":"A standard set of Unix system interfaces (files, threads, signals).","a":"The common rulebook that all Unix-like systems follow."},{"t":"ONNX","m":"Open Neural Network Exchange: a portable file format for AI models.","a":"A universal shipping container for AI models."},{"t":"SHA256","m":"A cryptographic hash producing a 256-bit fingerprint of data.","a":"A fingerprint for a file: change one byte, totally different print."},{"t":"SHA","m":"Secure Hash Algorithm family: cryptographic fingerprints of data.","a":"A fingerprint for data."},{"t":"FD","m":"File Descriptor: a small number a process uses to refer to an open file, socket or device.","a":"A cloakroom ticket for an open file."},{"t":"PD","m":"USB Power Delivery: the conversation over the Type-C cable that agrees on voltage, current and roles.","a":"Two people agreeing how much to pay before handing over goods.","say":"P D","src":"07"},{"t":"ETW","m":"Event Tracing for Windows: Windows' built-in high-speed event logging.","a":"Windows' black-box flight recorder."},{"t":"SQS","m":"Amazon Simple Queue Service: a managed message queue.","a":"A managed mailbox where jobs wait to be picked up."},{"t":"CDC","m":"USB Communications Device Class (e.g. serial over USB); also Change Data Capture in databases.","a":"A standard way for a gadget to say \"I'm a serial cable\"."},{"t":"MAC","m":"Media Access Control address: a network card's hardware address; also Message Authentication Code.","a":"The serial number stamped on the mailbox."},{"t":"SM","m":"Streaming Multiprocessor: a cluster of cores inside an NVIDIA GPU.","a":"One classroom in the GPU's school."},{"t":"LFU","m":"Least Frequently Used: a cache rule that evicts what's used least often.","a":"Giving away clothes you wear the least."},{"t":"CRC","m":"Cyclic Redundancy Check: a checksum to detect corrupted data.","a":"Counting the coins in a bag before and after the trip."},{"t":"FSM","m":"Finite State Machine: a model with fixed states and rules to move between them.","a":"A traffic light cycling green, yellow, red."},{"t":"RNG","m":"Random Number Generator.","a":"A dice roller."},{"t":"LSB","m":"Least Significant Bit: the right-most bit, worth 1.","a":"The pennies column of a number."},{"t":"MSB","m":"Most Significant Bit: the left-most bit, worth the most.","a":"The thousands column."},{"t":"RAG","m":"Retrieval-Augmented Generation: an LLM looks up documents first, then answers using them.","a":"An open-book exam."},{"t":"GDPR","m":"EU General Data Protection Regulation: privacy law about personal data.","a":"Europe's privacy rulebook."},{"t":"CCPA","m":"California Consumer Privacy Act: California's privacy law.","a":"California's privacy rulebook."},{"t":"RCA","m":"Root Cause Analysis: digging to find the real underlying cause of a failure.","a":"Asking \"why?\" five times until you find the leaking pipe."},{"t":"SoC","m":"System on a chip: one chip holding the processor cores, graphics, video, USB and more.","a":"A whole city on one island: houses, factories and roads in one place.","say":"S o C","src":"07"},{"t":"FFT","m":"Fast Fourier Transform: converts a signal into its frequencies.","a":"Splitting a chord into its individual notes."},{"t":"HNSW","m":"Hierarchical Navigable Small World: a fast approximate nearest-neighbour search graph for vectors.","a":"Using highways first, then local streets, to find the nearest caf\u00e9."},{"t":"STL","m":"C++ Standard Template Library (vectors, maps, algorithms).","a":"The C++ built-in toolbox."},{"t":"FPS","m":"Frames Per Second.","a":"How many flip-book pages per second."},{"t":"GCP","m":"Google Cloud Platform.","a":"Google's rentable data-centre city."},{"t":"BIOS","m":"Basic Input/Output System: older PC firmware that starts the computer.","a":"The old-style power-on checklist."},{"t":"LB","m":"Load Balancer: spreads incoming requests across many servers.","a":"A host seating guests evenly across waiters."},{"t":"GPL","m":"GNU General Public License: open-source licence requiring shared changes to be shared too.","a":"A recipe you can use freely if you share your improvements."},{"t":"FEC","m":"Forward Error Correction: send extra data so the receiver can fix losses without asking again.","a":"Sending a spare puzzle piece with every box."},{"t":"SIMT","m":"Single Instruction Multiple Threads: NVIDIA's model where a group of threads runs the same instruction.","a":"A marching band all stepping on the same beat."},{"t":"BPF","m":"(e)BPF: small safe programs you load into the Linux kernel for tracing, networking or security.","a":"Plug-in sensors you can clip into the kernel without rebuilding it."},{"t":"eBPF","m":"Extended Berkeley Packet Filter: safe mini-programs run inside the Linux kernel.","a":"Plug-in sensors you can clip into the kernel without rebuilding it."},{"t":"RBAC","m":"Role-Based Access Control: permissions given by role, not by person.","a":"Staff badges: every \"nurse\" badge opens the same doors."},{"t":"DAG","m":"Directed Acyclic Graph: a graph with arrows and no loops, e.g. task dependencies.","a":"A recipe where steps depend on earlier steps but never loop back."},{"t":"HSM","m":"Hardware Security Module: a tamper-resistant box that stores signing keys.","a":"A bank vault for cryptographic keys."},{"t":"DVFS","m":"Dynamic Voltage and Frequency Scaling: lowering clock speed and voltage to save power.","a":"Easing off the accelerator when you don't need speed."},{"t":"DLQ","m":"Dead-Letter Queue: where messages that keep failing are parked for inspection.","a":"The lost-and-found box for undeliverable mail."},{"t":"BGP","m":"Border Gateway Protocol: how networks on the internet announce routes to each other.","a":"Countries announcing which roads lead to which cities."},{"t":"KPI","m":"Key Performance Indicator: a key number used to judge success.","a":"The scoreboard number that matters."},{"t":"NACK","m":"Negative acknowledgement: \"I didn't get that, resend\".","a":"\"Sorry, say that again?\""},{"t":"DWARF","m":"A standard format for debug info (line numbers, variable names) inside binaries.","a":"A map linking machine code back to your source lines."},{"t":"CRTP","m":"Curiously Recurring Template Pattern: a C++ trick where a class inherits from a template of itself for static polymorphism.","a":"A child teaching its parent its own name so the parent can call it directly."},{"t":"ABI","m":"Application Binary Interface: the low-level rules (calling convention, layout) compiled code must follow to interoperate.","a":"Agreeing which hand passes the plate and which receives."},{"t":"ABA","m":"A concurrency bug where a value changes A\u2192B\u2192A and a compare-and-swap wrongly thinks nothing changed.","a":"Your parking spot looks empty, but someone parked and left in between."},{"t":"NAT","m":"Network Address Translation: a router rewrites private addresses to a shared public one.","a":"One reception phone number for a whole office."},{"t":"HAL","m":"Hardware Abstraction Layer: a fixed interface Android calls, which the device maker implements for its hardware.","a":"A standard wall socket: Android plugs into the same socket, and each maker wires the house behind it.","say":"HAL","src":"07"},{"t":"MVCC","m":"Multi-Version Concurrency Control: databases keep several versions so readers don't block writers.","a":"Readers keep reading yesterday's newspaper while today's is printed."},{"t":"HID","m":"Human Interface Device: the standard language for buttons, keyboards and mice, also used for mute and call buttons.","a":"The universal remote-control language: any computer knows what \"button pressed\" means.","say":"H I D","src":"07"},{"t":"TSDB","m":"Time-Series Database: a database optimised for timestamped metrics.","a":"A logbook ruled by time."},{"t":"QUIC","m":"A fast, encrypted transport over UDP that HTTP/3 uses.","a":"A courier that combines the handshake and the first delivery."},{"t":"P2P","m":"Peer-to-peer: devices talk directly instead of through a central server; for GPUs, direct GPU-to-GPU copies.","a":"Neighbours passing things over the fence."},{"t":"VRAM","m":"Video RAM: the GPU's own memory.","a":"The GPU's private pantry."},{"t":"RMW","m":"Read-Modify-Write: read a value, change it, write it back (not atomic unless protected).","a":"Taking a book off the shelf, correcting it, putting it back."},{"t":"SSO","m":"Single Sign-On: one login gives access to many apps; also Small String Optimization in C++.","a":"One wristband for every ride in the park."},{"t":"PMIC","m":"Power Management IC: the chip that produces and sequences all the board's voltages.","a":"The fuse box and switchboard for a board."},{"t":"IIO","m":"Industrial I/O: Linux subsystem for sensors like ADCs, accelerometers and gyros.","a":"The standard socket for sensors in Linux."},{"t":"GQA","m":"Grouped-Query Attention: a transformer trick sharing key/value heads to save memory.","a":"Several students sharing one textbook."},{"t":"SPL","m":"Secondary Program Loader: a tiny first-stage bootloader that sets up RAM then loads U-Boot.","a":"The small key that opens the bigger key box."},{"t":"KCSAN","m":"Kernel Concurrency Sanitizer: finds data races in the Linux kernel.","a":"A referee who spots two players grabbing the ball at once."},{"t":"AMBA","m":"ARM's on-chip bus standards (AXI, AHB, APB).","a":"The roads inside a chip."},{"t":"AXI","m":"ARM's high-performance on-chip bus (part of AMBA).","a":"The motorway inside a chip."},{"t":"RTL","m":"Register-Transfer Level: hardware described in Verilog/VHDL before it becomes a chip.","a":"The architectural drawing of a chip."},{"t":"NMI","m":"Non-Maskable Interrupt: an interrupt that can't be ignored, used for watchdogs and crashes.","a":"The fire alarm: you can't switch it off."},{"t":"ECU","m":"Electronic Control Unit: a computer controlling one function in a car.","a":"One of a car's many small brains."},{"t":"BVH","m":"Bounding Volume Hierarchy: nested boxes used to speed up ray tracing and collision checks.","a":"Boxes inside boxes so you only open the ones that matter."},{"t":"RGB","m":"Red, Green, Blue colour values.","a":"Mixing three paint colours to make any colour."},{"t":"CNN","m":"Convolutional Neural Network: an AI model that scans images with small filters.","a":"Sliding a magnifying glass over a photo looking for patterns."},{"t":"RNN","m":"Recurrent Neural Network: an AI model that processes sequences step by step with memory.","a":"Reading a sentence word by word while remembering the gist."},{"t":"MISRA","m":"A coding standard for safe C/C++ in cars and safety systems.","a":"The strict grammar rules for safety code."},{"t":"WCET","m":"Worst-Case Execution Time: the longest a piece of code can ever take.","a":"Planning for the slowest possible commute."},{"t":"ADC","m":"Analog-to-Digital Converter: turns a voltage into a number.","a":"A thermometer that writes down the reading."},{"t":"PWM","m":"Pulse-Width Modulation: controlling power by switching on/off very fast with a varying on-time.","a":"Flicking a light switch fast to dim it."},{"t":"FOC","m":"Field-Oriented Control: an efficient way to drive brushless motors by controlling current vectors.","a":"Pushing a merry-go-round exactly sideways at the right moment."},{"t":"TSN","m":"Time-Sensitive Networking: Ethernet extensions with guaranteed timing.","a":"Reserved train slots that always run on time."},{"t":"QNX","m":"A commercial real-time OS used in cars.","a":"A strict, reliable RTOS from BlackBerry."},{"t":"ASIL","m":"Automotive Safety Integrity Level (A\u2013D) from ISO 26262: how safety-critical a function is.","a":"A danger rating: D is \"brakes\", A is \"radio\"."},{"t":"AUTOSAR","m":"A standard software architecture for car ECUs.","a":"The common floor plan for car software."},{"t":"CXL","m":"Compute Express Link: a PCIe-based link for sharing memory between CPUs and accelerators.","a":"A shared pantry door between neighbouring kitchens."},{"t":"FPGA","m":"Field-Programmable Gate Array: a chip whose hardware logic you can rewire with code.","a":"LEGO for circuits."},{"t":"ISO","m":"International Organization for Standardization; ISO 26262 is the car functional-safety standard.","a":"The world's standards committee."},{"t":"UFS","m":"Universal Flash Storage: fast phone storage replacing eMMC.","a":"A fast built-in SSD for phones."},{"t":"DHCP","m":"Dynamic Host Configuration Protocol: automatically gives devices an IP address on a network.","a":"A receptionist handing out room numbers."},{"t":"SSH","m":"Secure Shell: encrypted remote login.","a":"A secure intercom into another computer."},{"t":"KVM","m":"Kernel-based Virtual Machine: Linux's built-in hypervisor.","a":"Linux acting as a landlord for virtual tenants."},{"t":"GUI","m":"Graphical User Interface.","a":"Windows and buttons instead of typed commands."},{"t":"XML","m":"A markup text format with tags.","a":"A labelled, nested packing list."},{"t":"MPU","m":"Memory Protection Unit: simpler MMU on microcontrollers that guards memory regions.","a":"Locked cupboards in a small kitchen."},{"t":"DIMM","m":"A memory stick plugged into a motherboard.","a":"A memory bookshelf you slot in."},{"t":"LUT","m":"Look-Up Table: precomputed answers stored in a table.","a":"A times-table chart."},{"t":"CMOS","m":"The chip technology used in most image sensors and logic.","a":"The silicon \"film\" of a digital camera."},{"t":"SVE","m":"ARM Scalable Vector Extension: ARM's flexible-width SIMD instructions.","a":"A cookie cutter that can grow to any tray size."},{"t":"NEON","m":"ARM's SIMD instruction set.","a":"ARM's cookie cutter for stamping many values at once."},{"t":"JWT","m":"JSON Web Token: a signed token proving who you are to an API.","a":"A signed hall pass."},{"t":"CSR","m":"Control and Status Register: a hardware register you read/write to control a device.","a":"A switch-and-light panel on the device."},{"t":"COW","m":"Copy-On-Write: share data until someone writes, then copy.","a":"Sharing a textbook until someone wants to scribble in it."},{"t":"ALSA","m":"Advanced Linux Sound Architecture: the Linux kernel's audio framework.","a":"The standard audio socket in Linux."},{"t":"UIO","m":"Userspace I/O: a Linux framework for writing simple drivers in user space.","a":"A service hatch letting a normal program poke hardware."},{"t":"RSA","m":"A classic public-key encryption and signature algorithm.","a":"A padlock anyone can close but only the owner can open."},{"t":"UVC","m":"USB Video Class: the standard \"I am a webcam\" language every computer already understands.","a":"A universal power plug for cameras: plug in anywhere and it just works, no driver install.","say":"U V C","src":"07"},{"t":"UAC","m":"USB Audio Class (UAC2 = version 2): the standard USB language for microphones and speakers.","a":"A universal \"I'm a mic/speaker\" language."},{"t":"UAC2","m":"USB Audio Class 2: the standard USB language for microphones and speakers.","a":"A universal \"I'm a mic/speaker\" language."},{"t":"UDC","m":"USB Device Controller: the chip block that lets a gadget answer a laptop over USB.","a":"The front desk of a hotel: every guest request (the laptop) arrives there first.","say":"U D C","src":"07"},{"t":"DWC3","m":"A ready-made USB controller design that Synopsys sells and many Qualcomm and NXP chips include.","a":"A front desk bought from a furniture catalogue: many hotels have the same model, so one driver fits them all.","say":"D W C 3","src":"07"},{"t":"xHCI","m":"Extensible Host Controller Interface: the standard USB host controller in laptops and in our boards when they act as host.","a":"The hotel manager who calls guests, as opposed to the front desk that answers them.","say":"x H C I","src":"07"},{"t":"DFU","m":"Device Firmware Upgrade: a standard way to send new firmware into a device over USB.","a":"A car driving onto a service ramp so the mechanic can swap the engine software.","say":"D F U","src":"07"},{"t":"eMMC","m":"Embedded MultiMediaCard: soldered-on flash storage common in embedded boards.","a":"A built-in SD card."},{"t":"VTT","m":"WebVTT: a caption file with timestamps.","a":"Subtitles with a stopwatch."},{"t":"K8s","m":"Kubernetes: a system that runs and manages containers across many machines.","a":"An orchestra conductor for containers."},{"t":"HTTP2","m":"HTTP/2: faster web protocol multiplexing many requests over one connection.","a":"Many conversations on one phone line."},{"t":"WAL","m":"Write-Ahead Log: write the change to a log before applying it, for crash recovery.","a":"Writing in your diary before you act, so you can replay it."},{"t":"LSN","m":"Log Sequence Number: position in a database log.","a":"The page number in the diary."},{"t":"OLTP","m":"Online Transaction Processing: many small fast reads/writes (like orders).","a":"A busy shop till."},{"t":"ACID","m":"Atomicity, Consistency, Isolation, Durability: guarantees of reliable database transactions.","a":"A bank transfer that either fully happens or doesn't at all."},{"t":"LCA","m":"Lowest Common Ancestor: the deepest node that is an ancestor of two tree nodes.","a":"The closest shared grandparent in a family tree."},{"t":"LIS","m":"Longest Increasing Subsequence.","a":"The longest staircase you can climb picking steps in order."},{"t":"LCS","m":"Longest Common Subsequence.","a":"The longest shared thread between two stories."},{"t":"DFA","m":"Deterministic Finite Automaton: a state machine with exactly one next state per input.","a":"A vending machine's internal logic."},{"t":"RPO","m":"Recovery Point Objective: how much recent data you can afford to lose.","a":"How many minutes of unsaved work you can tolerate losing."},{"t":"RTO","m":"Recovery Time Objective: how quickly service must be restored; also TCP Retransmission Timeout.","a":"How fast the lights must come back on."},{"t":"GPT","m":"Generative Pre-trained Transformer: the LLM architecture family; also GUID Partition Table on disks.","a":"A prediction engine for the next word."},{"t":"TSAN","m":"ThreadSanitizer: a tool that detects data races in programs.","a":"A referee for threads."},{"t":"ASAN","m":"AddressSanitizer: a tool that catches memory errors like buffer overflows.","a":"A smoke detector for memory bugs."},{"t":"UBSAN","m":"UndefinedBehaviorSanitizer: catches undefined C/C++ behaviour like signed overflow.","a":"A rule checker for forbidden C moves."},{"t":"SPOF","m":"Single Point Of Failure.","a":"The one bridge into town."},{"t":"WAF","m":"Web Application Firewall: filters malicious web requests.","a":"A bouncer reading every request at the door."},{"t":"CSRF","m":"Cross-Site Request Forgery: tricking a logged-in browser into sending unwanted requests.","a":"Someone forging your signature on a form while you're logged in."},{"t":"XSS","m":"Cross-Site Scripting: injecting malicious scripts into web pages.","a":"Slipping a fake note into the restaurant menu."},{"t":"OWASP","m":"Open Worldwide Application Security Project: publishes common web security risks.","a":"The web's most-wanted list of security bugs."},{"t":"SLI","m":"Service Level Indicator: the measured number behind an SLO (e.g. latency).","a":"The actual stopwatch reading."},{"t":"EWMA","m":"Exponentially Weighted Moving Average: a running average where recent values count more.","a":"Your mood, influenced most by today."},{"t":"AIMD","m":"Additive Increase Multiplicative Decrease: TCP's congestion rule \u2014 speed up slowly, halve on loss.","a":"Gently pressing the gas, slamming the brake at trouble."},{"t":"BBR","m":"Google's congestion control that models bandwidth and RTT instead of reacting to loss.","a":"Driving by watching traffic speed, not waiting for crashes."},{"t":"ECN","m":"Explicit Congestion Notification: routers mark packets to signal congestion instead of dropping them.","a":"A \"slow down\" sticker on the parcel."},{"t":"TEE","m":"Trusted Execution Environment: an isolated secure area of the processor (e.g. TrustZone).","a":"A locked back office inside the shop."},{"t":"SEV","m":"AMD Secure Encrypted Virtualization: encrypts VM memory from the host.","a":"A tenant's safe the landlord can't open."},{"t":"TDX","m":"Intel Trust Domain Extensions: hardware-isolated confidential VMs.","a":"Intel's version of the tenant's safe."},{"t":"ASLR","m":"Address Space Layout Randomization: randomising memory positions to make attacks harder.","a":"Moving the valuables to a different room every night."},{"t":"TOCTOU","m":"Time-Of-Check to Time-Of-Use: a race where something changes between checking and using it.","a":"Checking the seat is empty, turning away, and someone sits before you do."},{"t":"UAF","m":"Use-After-Free: using memory after it was freed \u2014 a common security bug.","a":"Using a hotel key after checking out, while a new guest is in."},{"t":"BTF","m":"BPF Type Format: compact type info letting eBPF programs work across kernel versions.","a":"A label on each kernel structure so plug-ins know its shape."},{"t":"ELF","m":"Executable and Linkable Format: the standard file format for Linux programs and libraries.","a":"The standard box shape for programs."},{"t":"IOCTL","m":"ioctl: a catch-all Linux system call to send device-specific commands to a driver.","a":"A \"special requests\" slot on the device's door."},{"t":"URB","m":"USB Request Block: the kernel's envelope for one USB transfer request on the host side.","a":"A filled-in courier slip attached to each package.","say":"U R B","src":"07"},{"t":"NVIC","m":"Nested Vectored Interrupt Controller: the interrupt controller in ARM Cortex-M MCUs.","a":"The MCU's doorbell switchboard."},{"t":"TCM","m":"Tightly-Coupled Memory: tiny, fast memory wired directly to a core.","a":"A drawer right under the chef's hands."},{"t":"ITM","m":"Instrumentation Trace Macrocell: ARM Cortex-M block for fast printf-style tracing.","a":"A tiny live ticker tape from the chip."},{"t":"SWD","m":"Serial Wire Debug: ARM's two-wire debug port.","a":"A two-wire service hatch."},{"t":"SWO","m":"Serial Wire Output: one-wire trace output paired with SWD.","a":"The ticker-tape output wire."},{"t":"EOF","m":"End Of File.","a":"The last page of the book."},{"t":"MLP","m":"Multi-Layer Perceptron: the simplest fully-connected neural network.","a":"Stacked layers of voting knobs."},{"t":"NHWC","m":"Tensor layout: batch, height, width, channels (channels last).","a":"Storing each pixel's colours together."},{"t":"NCHW","m":"Tensor layout: batch, channels, height, width (channels first).","a":"Storing all reds, then all greens, then all blues."},{"t":"MCTS","m":"Monte Carlo Tree Search: plan by simulating many random futures.","a":"Trying out many imaginary chess games before moving."},{"t":"MPC","m":"Model Predictive Control: repeatedly plan the best control over a short future horizon.","a":"Planning the next few steering moves, then replanning each moment."},{"t":"LQR","m":"Linear Quadratic Regulator: optimal controller for linear systems balancing error and effort.","a":"The smoothest way to balance a broom on your hand."},{"t":"ZMP","m":"Zero Moment Point: the point a walking robot must keep inside its foot area to stay balanced.","a":"Keeping your weight over your feet."},{"t":"DOF","m":"Degrees Of Freedom: how many independent ways a robot/joint can move.","a":"How many hinges your arm has."},{"t":"BLDC","m":"Brushless DC motor.","a":"A motor with magnets that switch electronically."},{"t":"PMSM","m":"Permanent Magnet Synchronous Motor.","a":"A smooth, efficient magnet motor used in robots and EVs."},{"t":"SVPWM","m":"Space-Vector PWM: an efficient way to generate the three-phase voltages for a motor.","a":"Choreographing three switches to point the motor's push precisely."},{"t":"MC/DC","m":"Modified Condition/Decision Coverage: testing proves each condition in a decision independently changes the outcome.","a":"Checking each light switch really controls the light on its own."},{"t":"DO-178C","m":"The standard for safety-critical airborne software.","a":"The aviation rulebook for code."},{"t":"ARINC","m":"Aviation data bus standards (e.g. ARINC 429).","a":"The aeroplane's wiring language."},{"t":"ANN","m":"Approximate Nearest Neighbour search for vectors; also Artificial Neural Network.","a":"Finding a caf\u00e9 that's nearly the closest, very fast."},{"t":"IVF","m":"Inverted File index: vector search by first picking the nearest clusters.","a":"Looking only in the right neighbourhood before searching streets."},{"t":"BM25","m":"A classic keyword-ranking formula for search engines.","a":"Scoring documents by how often and how rarely words appear."},{"t":"POI","m":"Point Of Interest on a map.","a":"A pin on the map."},{"t":"OCSP","m":"Online Certificate Status Protocol: check whether a certificate was revoked.","a":"Phoning the bank to check a cheque hasn't been cancelled."},{"t":"PKI","m":"Public Key Infrastructure: the system of certificates and authorities that vouch for keys.","a":"The passport office of the internet."},{"t":"SPIFFE","m":"A standard for giving workloads cryptographic identities.","a":"Staff ID badges for software services."},{"t":"mTLS","m":"Mutual TLS: both client and server prove identity with certificates.","a":"Both people showing ID to each other."},{"t":"CNI","m":"Container Network Interface: plugin standard for Kubernetes pod networking.","a":"The plumbing plug for container networks."},{"t":"CRD","m":"Custom Resource Definition: adding your own object types to Kubernetes.","a":"Adding a new form type to the city office."},{"t":"GKE","m":"Google Kubernetes Engine.","a":"Google's managed Kubernetes."},{"t":"EKS","m":"Amazon Elastic Kubernetes Service.","a":"Amazon's managed Kubernetes."},{"t":"VPC","m":"Virtual Private Cloud: your private, isolated network in a cloud.","a":"Your fenced yard inside the cloud city."},{"t":"IOPS","m":"Input/Output Operations Per Second: storage speed in operations.","a":"How many drawers you can open per second."},{"t":"SAN","m":"Storage Area Network; also Subject Alternative Name in certificates.","a":"A shared storage warehouse on its own road."},{"t":"ECMP","m":"Equal-Cost Multi-Path: spreading traffic over several equally good routes.","a":"Using all open checkout lanes."},{"t":"VTEP","m":"VXLAN Tunnel Endpoint: the device that wraps/unwraps VXLAN packets.","a":"The border post that puts letters in the bigger envelope."},{"t":"VNI","m":"VXLAN Network Identifier: the 24-bit ID of a virtual network.","a":"The colour of the envelope."},{"t":"EVPN","m":"Ethernet VPN: BGP-based control plane that tells VTEPs where MACs live.","a":"A shared address book for all the border posts."},{"t":"PMTUD","m":"Path MTU Discovery: finding the largest packet size that fits the whole route.","a":"Finding the lowest bridge on your route before sending the truck."},{"t":"MSS","m":"Maximum Segment Size: largest TCP payload per packet.","a":"The biggest box that fits the truck after packing."},{"t":"DSCP","m":"Differentiated Services Code Point: packet priority marking.","a":"A \"priority\" sticker on parcels."},{"t":"RSS","m":"Receive Side Scaling: spreading incoming packets across CPU cores; also Resident Set Size (memory used).","a":"Several cashiers splitting the queue."},{"t":"GRO","m":"Generic Receive Offload: merging small incoming packets into bigger ones to save CPU.","a":"Batching letters before opening them."},{"t":"GSO","m":"Generic Segmentation Offload: splitting big sends into packets as late as possible.","a":"Packing one big shipment, splitting at the dock."},{"t":"TSO","m":"TCP Segmentation Offload: the NIC splits large TCP sends into packets.","a":"Letting the post office cut the long letter into pages."},{"t":"OTel","m":"OpenTelemetry: open standard and tools for traces, metrics and logs.","a":"A common language for monitoring."},{"t":"PDB","m":"Pod Disruption Budget: how many Kubernetes pods may be down during maintenance.","a":"\"No more than two cashiers on break at once.\""},{"t":"HPA","m":"Horizontal Pod Autoscaler: Kubernetes adds/removes pods based on load.","a":"Opening more tills when the queue grows."},{"t":"EDR","m":"Endpoint Detection and Response: security software on each computer that watches for attacks.","a":"A security camera on every computer."},{"t":"CVE","m":"Common Vulnerabilities and Exposures: a public ID for a known security bug.","a":"A case number for a known break-in method."},{"t":"SIEM","m":"Security Information and Event Management: central log collection for security analysis.","a":"The security control room."},{"t":"WFP","m":"Windows Filtering Platform: Windows API for network filtering by security products.","a":"Windows' network checkpoint."},{"t":"ETM","m":"Embedded Trace Macrocell: ARM hardware that records instruction flow.","a":"A dash-cam for the CPU."},{"t":"SBSA","m":"Server Base System Architecture: ARM's rules for standard servers.","a":"ARM's checklist for \"this is a proper server\"."},{"t":"PSCI","m":"Power State Coordination Interface: ARM firmware calls to turn CPU cores on/off.","a":"Asking the building manager to switch rooms on or off."},{"t":"ATF","m":"Arm Trusted Firmware (TF-A): ARM's reference secure firmware (BL1/BL2/BL31).","a":"The building's master security firmware."},{"t":"TF-A","m":"Trusted Firmware-A: ARM's reference secure-world boot firmware.","a":"The building's master security firmware."},{"t":"OP-TEE","m":"An open-source TEE OS running in ARM TrustZone.","a":"The OS of the locked back office."},{"t":"SMC","m":"Secure Monitor Call: an ARM instruction to ask secure firmware for a service.","a":"Knocking on the security office window."},{"t":"HVC","m":"Hypervisor Call: ARM instruction to ask the hypervisor for a service.","a":"Knocking on the building manager's door."},{"t":"MPIDR","m":"ARM register giving a core's ID in the cluster.","a":"A core's seat number."},{"t":"SMMU","m":"System MMU: ARM's IOMMU.","a":"ARM's delivery-badge checker."},{"t":"IORT","m":"ACPI table describing ARM IOMMU and interrupt mapping.","a":"The badge-checker map for ARM servers."},{"t":"MADT","m":"ACPI table listing CPUs and interrupt controllers.","a":"The roll-call of CPUs."},{"t":"GTDT","m":"ACPI table describing ARM timers.","a":"The clock list of the building."},{"t":"SPCR","m":"ACPI table describing the serial console.","a":"A note saying where the intercom is."},{"t":"EDK2","m":"The open-source UEFI firmware codebase.","a":"The reference kit for building UEFI."},{"t":"U-Boot","m":"The common open-source bootloader for embedded Linux boards.","a":"The stage hand who sets up the stage and calls the kernel on."},{"t":"Yocto","m":"A build system for making custom embedded Linux images from recipes.","a":"A recipe kitchen that bakes your own Linux distribution."},{"t":"BitBake","m":"Yocto's task engine that runs recipes.","a":"The head cook following recipes."},{"t":"SELinux","m":"Security-Enhanced Linux: rules that say exactly which program may touch which file or device, even as root.","a":"Keycards in an office: even the boss's card only opens the doors it is programmed for.","say":"S E Linux","src":"07"},{"t":"AIDL","m":"Android Interface Definition Language: the file that describes the calls between two Android processes.","a":"A menu both the waiter and the kitchen agree on, so orders are never misunderstood.","say":"A I D L","src":"07"},{"t":"HIDL","m":"The older Android interface language that AIDL replaced for hardware services.","a":"Last year's menu format, still found in older restaurants.","say":"hidle","src":"07"},{"t":"AOSP","m":"Android Open Source Project: the public Android source code a device maker builds from.","a":"The public recipe book every Android kitchen starts from.","say":"A O S P","src":"07"},{"t":"VTS","m":"Vendor Test Suite: Android tests that check HALs meet the spec.","a":"Android's inspection checklist for vendor parts."},{"t":"CTS","m":"Compatibility Test Suite: Android tests a device must pass to be \"Android\".","a":"Android's driving test."},{"t":"mutex","m":"A lock that lets only one thread at a time into a section of code.","a":"A single bathroom key on a hook."},{"t":"spinlock","m":"A lock where a waiting CPU keeps looping (\"spinning\") until it's free; used in short kernel/interrupt paths.","a":"Standing at the door rattling the handle instead of sitting down to wait."},{"t":"semaphore","m":"A counter-based lock that lets up to N users in at once.","a":"A car park with a counter of free spaces."},{"t":"deadlock","m":"Two or more threads each waiting for a lock the other holds, so none can move.","a":"Two cars facing each other on a one-lane bridge."},{"t":"race condition","m":"A bug where the result depends on the unlucky timing of two threads.","a":"Two people editing the same sentence at the same time."},{"t":"atomic","m":"An operation that happens all at once; no other thread can see it half-done.","a":"Flipping a light switch \u2014 it's either on or off, never half."},{"t":"memory barrier","m":"An instruction that stops the CPU/compiler from reordering memory reads/writes across it.","a":"A \"no overtaking\" line on the road."},{"t":"cache","m":"A small fast store of recently used data so you don't fetch it from the slow place again.","a":"Keeping the salt next to the stove instead of in the basement."},{"t":"latency","m":"How long one operation takes from request to answer.","a":"How long you wait for your coffee."},{"t":"throughput","m":"How many operations get done per second.","a":"How many coffees the caf\u00e9 serves per hour."},{"t":"tail latency","m":"The slowest requests (e.g. p99 = slower than 99% of requests).","a":"The few customers who wait far longer than everyone else."},{"t":"p99","m":"99th percentile: 99% of requests are faster than this value.","a":"The wait time that only 1 in 100 customers exceeds."},{"t":"Kernel","m":"The core of the operating system that controls memory, devices and which program runs.","a":"The building manager who owns every key and decides who uses which room.","say":"kernel","src":"07"},{"t":"Driver","m":"Kernel code that knows how to operate one kind of hardware.","a":"A translator who speaks one specific machine's language.","say":"driver","src":"07"},{"t":"Firmware","m":"Software that runs close to hardware, usually stored in flash memory on the device.","a":"The instincts built into an animal: low-level behaviour that is there from birth.","say":"firmware","src":"07"},{"t":"Bootloader","m":"The small program that runs first at power-on, sets up memory and loads the kernel.","a":"The stagehand who sets up the stage before the actors arrive.","say":"bootloader","src":"07"},{"t":"interrupt","m":"A hardware signal that makes the CPU pause and handle an urgent event.","a":"A doorbell ringing while you cook."},{"t":"scheduler","m":"The OS part that decides which task runs on which CPU and when.","a":"A teacher deciding whose turn it is."},{"t":"syscall","m":"System call: how a program asks the kernel to do something privileged (open a file, send data).","a":"Ringing the front desk to ask for something only staff can do."},{"t":"context switch","m":"The CPU saves one task's state and loads another's.","a":"A chef putting one dish aside to start another."},{"t":"page fault","m":"The CPU touched memory that isn't currently mapped, so the kernel steps in to fix it up.","a":"Opening a book to a missing page, so the librarian fetches it."},{"t":"userspace","m":"Where normal programs run, without direct hardware access.","a":"The guest floors of a hotel."},{"t":"kernel space","m":"The privileged area where the kernel and drivers run.","a":"The staff-only engine room."},{"t":"hypervisor","m":"Software that runs virtual machines and shares real hardware among them.","a":"A landlord dividing one building into flats."},{"t":"container","m":"A packaged app with its dependencies, isolated but sharing the host kernel.","a":"A shipping container: same box everywhere, shares the ship."},{"t":"ring buffer","m":"A fixed-size circular queue where the writer wraps around to the start.","a":"A rotating sushi belt."},{"t":"watchdog","m":"A timer that resets the system if software stops checking in.","a":"A dead-man's switch on a train."},{"t":"endianness","m":"The byte order a CPU uses to store multi-byte numbers (little- or big-endian).","a":"Writing a date as day-month or month-day."},{"t":"hash table","m":"A structure that stores values by key using a hash function for near-instant lookup.","a":"Coat-check hooks numbered by your ticket."},{"t":"heap","m":"A tree-shaped structure that always gives you the smallest (or largest) item quickly; also the dynamic memory area.","a":"A tournament where the champion is always on top."},{"t":"stack","m":"Last-in-first-out structure; also the memory area holding function calls.","a":"A stack of plates."},{"t":"queue","m":"First-in-first-out structure.","a":"A line at a bus stop."},{"t":"linked list","m":"A chain of nodes, each pointing to the next.","a":"A treasure hunt where each clue points to the next."},{"t":"trie","m":"A prefix tree storing strings letter by letter.","a":"A dictionary's thumb tabs: A \u2192 AP \u2192 APP."},{"t":"union-find","m":"A structure that tracks which items belong to the same group, with near-instant merge and lookup.","a":"Clubs merging: each member just remembers their club president."},{"t":"memoization","m":"Caching a function's answers so repeated calls are instant.","a":"Writing answers in the margin so you never redo the sum."},{"t":"recursion","m":"A function that solves a problem by calling itself on smaller pieces.","a":"Russian dolls: open one to find a smaller one."},{"t":"backtracking","m":"Try a choice, explore, undo it if it fails, try the next.","a":"Walking a maze and stepping back at dead ends."},{"t":"two pointers","m":"A technique moving two indices through an array to avoid nested loops.","a":"Two people walking toward each other from both ends of a hall."},{"t":"sliding window","m":"Keep a moving range over an array, updating as it slides.","a":"Looking through a train window as the view slides past."},{"t":"monotonic stack","m":"A stack kept always increasing (or decreasing) to find next-greater elements fast.","a":"A line of people where shorter people step out whenever a taller one arrives."},{"t":"binary search","m":"Find an item in sorted data by halving the range each step.","a":"Guessing a number with \"higher or lower\"."},{"t":"Big-O","m":"A way to describe how running time or memory grows as input grows.","a":"How much longer a recipe takes when you cook for 100 instead of 10."},{"t":"amortized","m":"Average cost per operation over a long sequence, even if a few are expensive.","a":"Paying a yearly gym fee but thinking of it per visit."},{"t":"Fenwick tree","m":"Binary Indexed Tree: a compact array that answers prefix sums and updates in log time.","a":"A ledger where each page stores subtotals of a power-of-two run."},{"t":"prefix sum","m":"An array where each entry is the total of everything before it.","a":"Mile markers showing distance from the start."},{"t":"consistent hashing","m":"Placing servers and keys on a ring so adding a server moves only a few keys.","a":"Seats around a round table: a new guest only bumps their neighbours."},{"t":"Bloom filter","m":"A tiny bit-array that says \"definitely not here\" or \"probably here\".","a":"A bouncer who never forgets a face but sometimes confuses two."},{"t":"sharding","m":"Splitting data across many machines by key.","a":"Splitting a phone book into A\u2013F, G\u2013M, N\u2013Z volumes."},{"t":"replication","m":"Keeping copies of data on several machines.","a":"Photocopying important documents for several offices."},{"t":"quorum","m":"The minimum number of replicas that must agree for a read or write to count.","a":"A committee needing a majority present to vote."},{"t":"consensus","m":"Getting a group of machines to agree on one value even if some fail.","a":"A jury reaching one verdict."},{"t":"Raft","m":"A consensus algorithm with an elected leader replicating a log to followers.","a":"A team captain who keeps everyone's notebook in sync."},{"t":"Paxos","m":"A classic, harder-to-explain consensus algorithm.","a":"The original, very formal committee voting procedure."},{"t":"leader election","m":"Machines choosing one coordinator, and a new one if it fails.","a":"Choosing a new team captain when the old one leaves."},{"t":"gossip","m":"Machines spread information by randomly telling a few peers, who tell others.","a":"Office rumours spreading."},{"t":"idempotent","m":"Doing it twice has the same effect as doing it once.","a":"Pressing an elevator button again doesn't call two elevators."},{"t":"backpressure","m":"A slow consumer signals producers to slow down.","a":"A full sink telling you to turn down the tap."},{"t":"circuit breaker","m":"Stop calling a failing service for a while so it can recover.","a":"A house fuse tripping to stop a fire."},{"t":"rate limiter","m":"Caps how many requests a client may make per time window.","a":"A turnstile letting one person through per second."},{"t":"token bucket","m":"A rate limiter where tokens refill at a steady rate and each request spends one.","a":"A sweets jar refilled every minute; no sweets, no entry."},{"t":"saga","m":"A long transaction split into steps, each with an undo step if a later one fails.","a":"Booking a trip: if the hotel fails, cancel the flight."},{"t":"outbox pattern","m":"Write the event to a database \"outbox\" table in the same transaction, then publish it later.","a":"Putting the letter in your out-tray with the receipt, then the courier collects it."},{"t":"warp","m":"A group of 32 GPU threads that execute the same instruction together.","a":"A rowing crew pulling oars in perfect sync."},{"t":"tensor","m":"A multi-dimensional array of numbers used in AI.","a":"A spreadsheet that can have many dimensions."},{"t":"transformer","m":"The neural network design behind LLMs, built on attention.","a":"A reader who looks at every word in relation to every other word."},{"t":"attention","m":"The transformer mechanism that weighs how much each token should look at every other token.","a":"Highlighting the words in a sentence that matter for the current word."},{"t":"KV cache","m":"Stored attention keys/values from earlier tokens so an LLM doesn't recompute them.","a":"Keeping notes of what's been said so far in a conversation."},{"t":"quantization","m":"Storing numbers with fewer bits to make models smaller and faster.","a":"Rounding prices to the nearest dollar."},{"t":"Kalman filter","m":"A math filter that blends a prediction with noisy measurements into a best estimate.","a":"Combining your guess of where the ball is with a blurry photo of it."},{"t":"SLAM","m":"Simultaneous Localization And Mapping: build a map while tracking where you are in it.","a":"Drawing a map of a dark house while feeling your way around."},{"t":"lidar","m":"A laser sensor that measures distances by timing reflected light.","a":"A bat's echolocation with lasers."},{"t":"odometry","m":"Estimating motion by counting wheel turns or tracking camera motion.","a":"Counting your steps to know how far you walked."},{"t":"debounce","m":"Ignoring the rapid flicker of a button press so it counts once.","a":"Waiting for a doorbell's jangle to stop before answering."},{"t":"Device tree","m":"A text map of the hardware on a board (which chips, on which pins and addresses) that the kernel reads at boot.","a":"The floor plan of a house, so the electrician knows where every socket is without digging into walls.","say":"device tree","src":"07"},{"t":"Gadget","m":"Linux's name for the device side of USB: the board pretends to be a webcam, mic or keyboard to a laptop.","a":"An actor in costume: the same board can play \"webcam\" or \"keyboard\" depending on the costume it wears.","say":"gadget","src":"07"},{"t":"configfs","m":"A special folder tree where you build a USB gadget by creating folders and writing small files.","a":"Building with LEGO by making folders: each folder is a brick (a function), and linking them snaps the toy together.","say":"config F S","src":"07"},{"t":"Descriptor","m":"A small table of facts the device reports about itself: who made it, what it can do.","a":"A business card plus resume the device hands over when it is first plugged in.","say":"descriptor","src":"07"},{"t":"Enumeration","m":"The first conversation after plug-in where the laptop learns what the device is and gives it an address.","a":"A new employee's first morning: show ID, get a badge number, hand in a resume, get assigned a desk.","say":"enumeration","src":"07"},{"t":"Endpoint","m":"A numbered mailbox on a USB device; each data stream uses its own.","a":"Numbered pigeonholes in an office: mail for video goes in one slot, audio in another.","say":"endpoint","src":"07"},{"t":"isochronous","m":"A USB transfer type with guaranteed timing but no retries, for audio/video.","a":"A live broadcast: on time, no re-takes."},{"t":"Bulk transfer","m":"A USB transfer type that is reliable but has no timing promise, used for files and updates.","a":"Parcel post: everything arrives intact, but not at a promised minute.","say":"bulk transfer","src":"07"},{"t":"pinctrl","m":"The Linux subsystem that sets which function each chip pin performs.","a":"The switchboard deciding what each wall socket is wired to."},{"t":"regulator","m":"A power supply component (and Linux subsystem) that provides a set voltage.","a":"A water-pressure valve."},{"t":"probe","m":"The driver function the kernel calls when it finds a device that matches the driver.","a":"The first handshake when a translator is introduced to the person they will translate for.","say":"probe","src":"07"},{"t":"workqueue","m":"A Linux mechanism to run deferred work in a kernel thread.","a":"A \"to do later\" tray."},{"t":"tasklet","m":"An older Linux mechanism for short deferred interrupt work.","a":"A quick sticky-note reminder."},{"t":"softirq","m":"A Linux deferred-interrupt context for high-rate work like networking.","a":"The back-office team that finishes what the front desk started."},{"t":"Threaded IRQ","m":"An interrupt whose slow part runs in its own kernel thread so it can sleep and talk over I2C.","a":"A receptionist who takes a message, then a colleague phones back properly.","say":"threaded I R Q","src":"07"},{"t":"secure boot","m":"Each boot stage checks the next stage's signature before running it.","a":"Each guard checks the next guard's ID badge."},{"t":"eFuse","m":"One-time programmable bits inside a chip (e.g. storing key hashes).","a":"Writing in permanent ink."},{
