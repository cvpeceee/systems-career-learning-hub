defSim('prefillDecode','LLM inference anatomy: prefill vs decode','Prefill processes all prompt tokens in parallel (compute-bound). Decode generates one token per step per sequence (memory-bound). Watch TTFT and inter-token latency.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,260); let t=0;
  const v=K.ctrls(root,[{k:'p',label:'Prompt tokens',min:64,max:8192,step:64,v:2048,on:()=>t=0},{k:'o',label:'Output tokens',min:16,max:512,step:16,v:128,on:()=>t=0},{k:'mb',label:'Model size (GB, BF16)',min:2,max:140,v:16,on:()=>t=0},{k:'bw',label:'HBM BW (TB/s)',min:0.5,max:8,step:0.25,v:3.35,on:()=>t=0}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ const params=v.mb/2*1e9; const flopsPrefill=2*params*v.p; const peak=600e12; const prefill=flopsPrefill/peak*1000; // ms
    const tpot=Math.max(v.mb/(v.bw*1000)*1000, 2*params/peak*1000); // ms per token
    const total=prefill+tpot*v.o; t+=dt*total/4; if(t>total*1.3) t=0;
    K.clear(ctx,W,H); const sc=780/total; K.rr(ctx,40,60,prefill*sc,40,6,C.pink); K.t(ctx,'prefill '+prefill.toFixed(0)+' ms',44,50,{s:11,c:C.pink});
    for(let i=0;i<v.o;i++){ const x=40+(prefill+i*tpot)*sc; if((prefill+i*tpot)<=t){ ctx.fillStyle=i%2?C.cyan:'#0e7490'; ctx.fillRect(x,60,Math.max(1,tpot*sc-0.5),40);} }
    const cx=40+Math.min(t,total)*sc; K.line(ctx,cx,40,cx,120,C.warn,2);
    K.t(ctx,'TTFT ≈ '+(prefill+tpot).toFixed(0)+' ms     TPOT ≈ '+tpot.toFixed(1)+' ms/token ('+(1000/tpot).toFixed(0)+' tok/s per sequence)     E2E ≈ '+(total/1000).toFixed(2)+' s',40,145,{b:1});
    const aiP=v.p, aiD=1; K.t(ctx,'prefill arithmetic intensity ≈ '+aiP+' FLOP/byte of weights → compute-bound',40,180,{s:12,c:C.muted}); K.t(ctx,'decode at batch 1 ≈ 1 FLOP/byte → bandwidth-bound: time/token ≈ weight bytes / HBM BW',40,200,{s:12,c:C.muted});
    ro.textContent='Simplified (ignores attention FLOPs, KV reads, kernel overheads, assumes ~600 TFLOP/s achieved). The two phases want different hardware configs → motivates disaggregated serving (separate prefill and decode pools, ship the KV cache between them), chunked prefill (split long prompts so they do not stall decodes), and batching decode to amortize weight reads.';
  });
});

defSim('kvCache','KV cache memory: contiguous vs PagedAttention','Each token of each sequence stores K and V for every layer. Contiguous preallocation wastes memory; paging allocates fixed-size blocks on demand.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let seqs=[], acc=0, id=0, rejected=0, finished=0;
  const v=K.ctrls(root,[{sel:'mode',label:'Allocator',v:'paged',opts:[['contig','contiguous: reserve max_len per request'],['paged','paged: 16-token blocks on demand']],on:rs},{k:'max',label:'max_len reserved',min:256,max:4096,step:256,v:2048,on:rs},{k:'rate',label:'Arrivals/s',min:1,max:10,v:4},{btn:'Reset',on:rs}]);
  const ro=K.readout(root); const TOTAL=96*16; // tokens of capacity (blocks*16)
  function rs(){seqs=[];rejected=0;finished=0;}
  function used(){ return seqs.reduce((s,q)=>s+(v.mode==='contig'?Math.ceil(v.max/32):Math.ceil(q.len/16)*16/16*1),0); }
  K.loop(cv,(dt)=>{ acc+=dt*v.rate;
    if(acc>1){ acc=0; const q={id:id++,len:K.ri(40,300),target:K.ri(100,700)}; const need=v.mode==='contig'?Math.ceil(v.max/32):Math.ceil(q.len/16); if(used()+need<=96) seqs.push(q); else rejected++; }
    seqs.forEach(q=>{ q.len+=dt*60; }); 
    if(v.mode==='paged'){ while(used()>96 && seqs.length){ seqs.pop(); rejected++; } }
    seqs=seqs.filter(q=>{ if(q.len>=q.target||q.len>=v.max){finished++; return false;} return true; });
    K.clear(ctx,W,H); K.t(ctx,'GPU KV cache: 96 blocks (each 16 tokens)',20,14,{s:11,c:C.muted});
    const cells=[]; seqs.forEach((q,i)=>{ const col=`hsl(${(q.id*67)%360} 70% 55%)`; const usedB=Math.ceil(q.len/16); const resB=v.mode==='contig'?Math.ceil(v.max/32):usedB; for(let b=0;b<resB;b++) cells.push({col,used:b<usedB}); });
    for(let i=0;i<96;i++){ const x=20+(i%24)*34, y=26+Math.floor(i/24)*36; const c=cells[i]; K.rr(ctx,x,y,30,30,4,c?(c.used?c.col:'#1f2937'):'#0f1626',c&&!c.used?c.col:null); if(c&&!c.used){ K.t(ctx,'res',x+15,y+15,{a:'center',s:9,c:C.dim}); } }
    const usedTok=seqs.reduce((s,q)=>s+q.len,0); const reserved=Math.min(96,cells.length)*16;
    K.t(ctx,'active sequences: '+seqs.length+'   rejected/preempted: '+rejected+'   finished: '+finished,20,180,{b:1});
    K.t(ctx,'memory holding real tokens: '+K.pct(reserved?usedTok/reserved:0),20,205,{c:C.good});
    ro.textContent='KV bytes per token = 2 (K,V) × layers × kv_heads × head_dim × bytes. Llama-3-70B (80 layers, 8 KV heads via GQA, dim 128, BF16): 2·80·8·128·2 ≈ 320 KB/token → a 4K-token sequence ≈ 1.3 GB. Contiguous reservation strands memory (internal fragmentation) and caps batch size. vLLM’s PagedAttention keeps a block table per sequence (like page tables), allocates on demand, and enables copy-on-write prefix sharing. When blocks run out: preempt (swap to CPU or recompute).';
  });
});

defSim('continuousBatching','Static vs continuous (in-flight) batching','Requests have different output lengths. Static batching waits for the longest sequence; continuous batching refills free slots every decode step.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let slots=[], queue=[], step=0, acc=0, done=0, id=0, waitSum=0, busySteps=0, slotSteps=0;
  const v=K.ctrls(root,[{sel:'mode',label:'Scheduler',v:'cont',opts:[['static','static batching'],['cont','continuous batching']],on:rs},{k:'bs',label:'Max batch',min:2,max:12,v:8,on:rs},{k:'rate',label:'Arrival prob/step',min:0.1,max:1,step:0.05,v:0.5},{k:'sp',label:'Steps/s',min:2,max:40,v:12}]);
  const ro=K.readout(root);
  function rs(){ slots=new Array(v.bs).fill(null); queue=[]; step=0; done=0; waitSum=0; busySteps=0; slotSteps=0; }
  rs();
  K.loop(cv,(dt)=>{ acc+=dt*v.sp; while(acc>1){ acc--; step++;
      if(Math.random()<v.rate) queue.push({id:id++,len:Math.random()<0.2?K.ri(40,80):K.ri(4,20),gen:0,arr:step});
      if(v.mode==='cont'){ for(let i=0;i<slots.length;i++) if(!slots[i] && queue.length){ const q=queue.shift(); waitSum+=step-q.arr; slots[i]=q; } }
      else { if(slots.every(s=>!s) && queue.length){ for(let i=0;i<slots.length && queue.length;i++){ const q=queue.shift(); waitSum+=step-q.arr; slots[i]=q; } } }
      let active=0; slots.forEach((s,i)=>{ if(s){ active++; s.gen++; if(s.gen>=s.len){ done++; slots[i]= v.mode==='static'? {done:true,id:s.id} : null; } } else if(false){} });
      if(v.mode==='static'){ const anyLive=slots.some(s=>s&&!s.done); if(!anyLive) slots=slots.map(()=>null); }
      slotSteps+=slots.length; busySteps+=slots.filter(s=>s&&!s.done).length; }
    K.clear(ctx,W,H);
    slots.forEach((s,i)=>{ const y=20+i*Math.min(28,220/slots.length); K.t(ctx,'slot '+i,10,y+10,{s:10,c:C.muted}); K.rr(ctx,60,y,500,Math.min(22,200/slots.length),4,'#0f1626');
      if(s && !s.done){ const col=`hsl(${(s.id*67)%360} 70% 55%)`; K.rr(ctx,60,y,500*s.gen/80,Math.min(22,200/slots.length),4,col); K.t(ctx,'#'+s.id+' '+s.gen+'/'+s.len,64+500*s.gen/80,y+9,{s:10}); }
      else if(s && s.done){ K.rr(ctx,60,y,500,Math.min(22,200/slots.length),4,'rgba(248,113,113,.18)'); K.t(ctx,'finished — idle until batch ends',70,y+9,{s:10,c:C.bad}); } });
    K.t(ctx,'queue: '+queue.length,600,30,{b:1}); queue.slice(0,40).forEach((q,i)=>{ K.rr(ctx,600+(i%10)*22,45+Math.floor(i/10)*22,18,18,3,`hsl(${(q.id*67)%360} 70% 55%)`); });
    K.t(ctx,'GPU slot utilization '+K.pct(slotSteps?busySteps/slotSteps:0),600,170,{b:1,c:C.good}); K.t(ctx,'avg queue wait '+(done?(waitSum/Math.max(1,done)).toFixed(1):'-')+' steps',600,195,{s:12}); K.t(ctx,'completed '+done,600,218,{s:12});
    ro.textContent='Continuous batching (Orca, 2022; vLLM, TGI, TensorRT-LLM "in-flight batching") schedules at iteration granularity: as soon as one sequence emits EOS its slot is reused. Throughput gains of several × on mixed-length traffic. Costs: ragged batches need kernels that handle variable lengths (paged attention), and admission must respect KV memory, not just slot count.';
  });
});

defSim('pipelineBubble','Model parallelism: pipeline bubbles & tensor parallel','Split a model across GPUs. Pipeline parallelism idles stages during fill/drain; more micro-batches shrink the bubble. Tensor parallel splits each layer but needs an all-reduce per layer.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let t=0;
  const v=K.ctrls(root,[{k:'p',label:'Pipeline stages (GPUs)',min:2,max:8,v:4,on:()=>t=0},{k:'m',label:'Micro-batches',min:1,max:16,v:4,on:()=>t=0},{chk:'tp',label:'show tensor-parallel comm per layer',v:false}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ t+=dt*4; const P=v.p, M=v.m; const steps=P+M-1; K.clear(ctx,W,H); const cw=Math.min(40,780/steps), ch=Math.min(30,200/P);
    for(let s=0;s<P;s++){ K.t(ctx,'GPU'+s,10,30+s*(ch+4)+ch/2,{s:11,c:C.muted}); for(let k=0;k<steps;k++){ const mb=k-s; const x=60+k*cw, y=30+s*(ch+4); const on=mb>=0&&mb<M; const vis=k<t;
        K.rr(ctx,x,y,cw-2,ch,3,on&&vis?`hsl(${mb*40%360} 70% 55%)`:(vis?'rgba(248,113,113,.15)':'#0f1626')); if(on&&vis&&cw>20) K.t(ctx,String(mb),x+cw/2-1,y+ch/2,{a:'center',s:10}); } }
    if(t>steps+3) t=0; const bubble=(P-1)/(M+P-1);
    K.t(ctx,'forward-pass bubble fraction = (p−1)/(m+p−1) = '+K.pct(bubble),60,250,{b:1,c:bubble>0.3?C.warn:C.good});
    if(v.tp) K.t(ctx,'TP: each layer does 2 all-reduces of activations (attention out-proj + MLP down-proj) → keep TP inside one NVLink domain (≤8 GPUs).',60,270,{s:11,c:C.cyan});
    ro.textContent='Inference serving trade-offs: TP lowers per-token latency (each GPU reads 1/TP of weights) but adds per-layer all-reduce latency; PP raises throughput/capacity with little communication but adds stage hops to latency; DP (replicas) scales throughput linearly; EP (expert parallel) for MoE needs all-to-all. Training adds backward passes (1F1B schedules) and gradient all-reduce.';
  });
});

defSim('kvRouting','KV-aware routing vs round-robin','Requests share prompt prefixes (system prompts, multi-turn chats). A router that knows which worker holds which prefix in its KV cache skips redundant prefill.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let workers=[], acc=0, rr=0, hits=0, total=0, flights=[], saved=0;
  const v=K.ctrls(root,[{sel:'mode',label:'Router',v:'kv',opts:[['rr','round-robin'],['ll','least-loaded'],['kv','KV-aware (prefix overlap + load)']],on:rs},{k:'nw',label:'Workers',min:2,max:6,v:4,on:rs},{k:'np',label:'Distinct prefixes',min:2,max:20,v:6,on:rs},{k:'rate',label:'Req/s',min:1,max:20,v:6}]);
  const ro=K.readout(root);
  function rs(){ workers=[]; for(let i=0;i<v.nw;i++) workers.push({cache:[],load:0}); hits=total=saved=0; rr=0; flights=[]; }
  rs();
  K.loop(cv,(dt)=>{ if(workers.length!==v.nw) rs(); acc+=dt*v.rate; workers.forEach(w=>w.load=Math.max(0,w.load-dt*1.5));
    while(acc>1){ acc--; const p=Math.floor(Math.pow(Math.random(),1.6)*v.np); let wi;
      if(v.mode==='rr'){ wi=rr++%workers.length; } else if(v.mode==='ll'){ wi=workers.map((w,i)=>[w.load,i]).sort((a,b)=>a[0]-b[0])[0][1]; }
      else { wi=workers.map((w,i)=>[(w.cache.includes(p)?-3:0)+w.load,i]).sort((a,b)=>a[0]-b[0])[0][1]; }
      const w=workers[wi]; const hit=w.cache.includes(p); total++; if(hit){hits++; saved++; w.load+=0.4;} else { w.load+=1.5; w.cache.unshift(p); if(w.cache.length>3) w.cache.pop(); } if(hit){ w.cache.splice(w.cache.indexOf(p),1); w.cache.unshift(p); }
      flights.push({p,wi,t:0,hit}); }
    flights.forEach(f=>f.t+=dt*2); flights=flights.filter(f=>f.t<1);
    K.clear(ctx,W,H); K.rr(ctx,20,120,120,50,10,'#1e1b4b',C.accent); K.t(ctx,'Router',80,145,{a:'center',b:1});
    workers.forEach((w,i)=>{ const y=20+i*(260/workers.length); K.rr(ctx,560,y,270,Math.min(50,240/workers.length),8,'#111827',C.line); K.t(ctx,'worker '+i+'  load '+w.load.toFixed(1),570,y+12,{s:11,b:1});
      w.cache.forEach((p,k)=>{ K.rr(ctx,570+k*60,y+22,54,16,3,`hsl(${p*47%360} 65% 50%)`); K.t(ctx,'pfx '+p,597+k*60,y+30,{a:'center',s:9}); }); });
    flights.forEach(f=>{ const y2=20+f.wi*(260/workers.length)+20; const x=K.lerp(140,560,f.t), y=K.lerp(145,y2,f.t); ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fillStyle=`hsl(${f.p*47%360} 65% 55%)`; ctx.fill(); if(f.hit){ctx.strokeStyle=C.good;ctx.lineWidth=2;ctx.stroke();} });
    K.t(ctx,'prefix cache hit rate: '+(total?K.pct(hits/total):'-'),20,220,{b:1,c:C.good,s:14});
    ro.textContent='Each worker caches 3 prefixes (LRU). Hits skip most prefill → lower TTFT and GPU cost. KV-aware routers (NVIDIA Dynamo’s KV router, SGLang’s cache-aware routing, llm-d) score workers by prefix overlap minus load. Pure affinity creates hot spots, so the score must balance cache reuse against queue depth.';
  });
});
})();

<script>/* js/sims-dist.js */
/* Sims for distributed systems, networking, cloud deployment */
(function(){
const {C} = SimKit;

defSim('lamportClocks','Logical time: Lamport & vector clocks','Three processes exchange messages. Lamport clocks give a total order consistent with causality; vector clocks can also detect concurrency.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let ev=[], msgs=[], lc=[0,0,0], vc=[[0,0,0],[0,0,0],[0,0,0]], t=0, acc=0;
  const v=K.ctrls(root,[{k:'sp',label:'Speed',min:1,max:10,v:4},{btn:'Reset',on:rs}]);
  const ro=K.readout(root);
  function rs(){ ev=[]; msgs=[]; lc=[0,0,0]; vc=[[0,0,0],[0,0,0],[0,0,0]]; t=0; }
  function local(p,kind,extra){ lc[p]++; vc[p][p]++; ev.push({p,t,kind,lc:lc[p],vc:vc[p].slice(),...extra}); }
  K.loop(cv,(dt)=>{ t+=dt*v.sp*0.15; acc+=dt*v.sp;
    if(acc>2.5 && t<5.5){ acc=0; const p=K.ri(0,2); if(Math.random()<0.4) local(p,'local'); else { local(p,'send'); let q=K.ri(0,2); if(q===p) q=(p+1)%3; msgs.push({from:p,to:q,ts:lc[p],vc:vc[p].slice(),t0:t,t1:t+K.rnd(0.3,0.9)}); } }
    msgs=msgs.filter(m=>{ if(t>=m.t1){ const q=m.to; lc[q]=Math.max(lc[q],m.ts)+1; for(let i=0;i<3;i++) vc[q][i]=Math.max(vc[q][i],m.vc[i]); vc[q][q]++; ev.push({p:q,t,kind:'recv',lc:lc[q],vc:vc[q].slice(),from:m}); m.done=true; return false;} return true; });
    if(t>6.5) rs();
    K.clear(ctx,W,H); const X=tt=>40+tt/6.5*800, Y=p=>50+p*90;
    [0,1,2].forEach(p=>{ K.line(ctx,40,Y(p),840,Y(p),C.line,2); K.t(ctx,'P'+p,14,Y(p),{b:1}); });
    ev.forEach(e=>{ if(e.kind==='recv'){ K.arrow(ctx,X(e.from.t0),Y(e.from.from),X(e.t),Y(e.p),'rgba(124,92,255,.6)',1.5);} });
    msgs.forEach(m=>{ const f=(t-m.t0)/(m.t1-m.t0); K.arrow(ctx,X(m.t0),Y(m.from),K.lerp(X(m.t0),X(m.t1),f),K.lerp(Y(m.from),Y(m.to),f),C.warn,1.5); });
    ev.forEach(e=>{ ctx.beginPath(); ctx.arc(X(e.t),Y(e.p),6,0,7); ctx.fillStyle={local:C.dim,send:C.accent,recv:C.cyan}[e.kind]; ctx.fill(); K.t(ctx,String(e.lc),X(e.t),Y(e.p)-14,{a:'center',s:11,b:1}); K.t(ctx,'['+e.vc.join(',')+']',X(e.t),Y(e.p)+16,{a:'center',s:9,m:1,c:C.muted}); });
    let conc=0; for(let i=0;i<ev.length;i++)for(let j=i+1;j<ev.length;j++){ const a=ev[i].vc,b=ev[j].vc; const le=a.every((x,k)=>x<=b[k]), ge=a.every((x,k)=>x>=b[k]); if(!le&&!ge) conc++; }
    ro.textContent=`events=${ev.length}  concurrent pairs (by vector clock)=${conc}\nLamport rule: on send/local ++L; on receive L=max(L,msg)+1. a→b ⇒ L(a)<L(b), but NOT the converse. Vector clocks: VC(a)<VC(b) iff a happened-before b; incomparable ⇒ concurrent (used by Dynamo-style stores to detect conflicting writes). Physical clocks drift (NTP ~ms); Spanner’s TrueTime exposes uncertainty bounds and waits them out.`;
  });
});

defSim('raft','Raft: leader election & log replication','5 servers. Click a server to crash/revive it. "Client write" appends to the leader. Watch terms, votes, heartbeats and commit index. (Simplified but faithful to the paper’s rules.)',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,340); const N=5; let nodes=[], msgs=[], time=0;
  function rt(){ return K.rnd(2.0,4.0); }
  function rs(){ nodes=[]; for(let i=0;i<N;i++) nodes.push({id:i,state:'follower',term:0,voted:null,to:rt()+i*0.3,alive:true,log:[],commit:-1,votes:0,hb:0,next:[],match:[]}); msgs=[]; }
  rs();
  const v=K.ctrls(root,[{btn:'Client write',primary:1,on:()=>{ const L=nodes.find(n=>n.alive&&n.state==='leader'); if(L){ L.log.push(L.term); flash='write appended to leader S'+L.id; } else flash='no leader — write rejected (retry later)'; }},{k:'sp',label:'Speed',min:0.2,max:3,step:0.1,v:1},{btn:'Reset cluster',on:rs}]);
  const ro=K.readout(root); let flash='';
  const pos=i=>{ const a=i/N*Math.PI*2-Math.PI/2; return [250+120*Math.cos(a),170+120*Math.sin(a)]; };
  cv.addEventListener('click',e=>{ const p=K.pos(cv,e); nodes.forEach(n=>{ const q=pos(n.id); if(Math.hypot(p.x-q[0],p.y-q[1])<34){ n.alive=!n.alive; if(n.alive){ n.state='follower'; n.to=rt(); } } }); });
  function send(from,to,m){ msgs.push(Object.assign({from,to,t:0,dur:K.rnd(0.35,0.6)},m)); }
  function lastTerm(n){ return n.log.length?n.log[n.log.length-1]:0; }
  function step(dt){ time+=dt;
    nodes.forEach(n=>{ if(!n.alive) return;
      if(n.state==='leader'){ n.hb-=dt; if(n.hb<=0){ n.hb=0.8; nodes.forEach(o=>{ if(o.id!==n.id){ const ni=n.next[o.id]; send(n.id,o.id,{type:'AE',term:n.term,prev:ni-1,prevTerm:ni-1>=0?n.log[ni-1]:0,entries:n.log.slice(ni),commit:n.commit}); } }); } }
      else { n.to-=dt; if(n.to<=0){ n.state='candidate'; n.term++; n.voted=n.id; n.votes=1; n.to=rt(); nodes.forEach(o=>{ if(o.id!==n.id) send(n.id,o.id,{type:'RV',term:n.term,lli:n.log.length-1,llt:lastTerm(n)}); }); } } });
    msgs.forEach(m=>m.t+=dt/m.dur);
    const arrived=msgs.filter(m=>m.t>=1); msgs=msgs.filter(m=>m.t<1);
    arrived.forEach(m=>{ const n=nodes[m.to]; if(!n.alive || !nodes[m.from].alive && m.type!=='RVR' && m.type!=='AER') return; if(!n.alive) return;
      if(m.term>n.term){ n.term=m.term; n.state='follower'; n.voted=null; }
      if(m.type==='RV'){ const upToDate = m.llt>lastTerm(n) || (m.llt===lastTerm(n) && m.lli>=n.log.length-1); const grant = m.term===n.term && (n.voted===null||n.voted===m.from) && upToDate; if(grant){ n.voted=m.from; n.to=rt(); } send(n.id,m.from,{type:'RVR',term:n.term,granted:grant}); }
      else if(m.type==='RVR'){ if(n.state==='candidate' && m.granted && m.term===n.term){ n.votes++; if(n.votes>N/2){ n.state='leader'; n.hb=0; n.next=nodes.map(()=>n.log.length); n.match=nodes.map(()=>-1); n.match[n.id]=n.log.length-1; flash='S'+n.id+' won election for term '+n.term; } } }
      else if(m.type==='AE'){ if(m.term<n.term){ send(n.id,m.from,{type:'AER',term:n.term,ok:false}); return; } n.state='follower'; n.to=rt();
        if(m.prev>=n.log.length || (m.prev>=0 && n.log[m.prev]!==m.prevTerm)){ send(n.id,m.from,{type:'AER',term:n.term,ok:false}); return; }
        n.log=n.log.slice(0,m.prev+1).concat(m.entries); n.commit=Math.max(n.commit,Math.min(m.commit,n.log.length-1)); send(n.id,m.from,{type:'AER',term:n.term,ok:true,match:n.log.length-1}); }
      else if(m.type==='AER'){ if(n.state!=='leader'||m.term!==n.term) return; if(m.ok){ n.match[m.from]=m.match; n.next[m.from]=m.match+1; n.match[n.id]=n.log.length-1;
          for(let idx=n.log.length-1; idx>n.commit; idx--){ const cnt=n.match.filter(x=>x>=idx).length; if(cnt>N/2 && n.log[idx]===n.term){ n.commit=idx; break; } } }
        else n.next[m.from]=Math.max(0,n.next[m.from]-1); } });
  }
  K.loop(cv,(dt)=>{ step(dt*v.sp); K.clear(ctx,W,H);
    msgs.forEach(m=>{ const a=pos(m.from), b=pos(m.to); const x=K.lerp(a[0],b[0],m.t), y=K.lerp(a[1],b[1],m.t); ctx.beginPath(); ctx.arc(x,y,m.type==='AE'?(m.entries.length?6:4):5,0,7); ctx.fillStyle={RV:C.warn,RVR:m.granted?C.good:C.bad,AE:m.entries&&m.entries.length?C.pink:C.cyan,AER:m.ok?'#67e8f9':C.bad}[m.type]; ctx.fill(); });
    nodes.forEach(n=>{ const [x,y]=pos(n.id); const col=!n.alive?'#1f2937':n.state==='leader'?C.good:n.state==='candidate'?C.warn:C.accent;
      ctx.beginPath(); ctx.arc(x,y,32,0,7); ctx.fillStyle=col; ctx.globalAlpha=n.alive?1:0.5; ctx.fill(); ctx.globalAlpha=1;
      if(n.alive && n.state!=='leader'){ ctx.beginPath(); ctx.arc(x,y,36,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,n.to)/4); ctx.strokeStyle='#fff8'; ctx.lineWidth=2; ctx.stroke(); }
      K.t(ctx,'S'+n.id,x,y-8,{a:'center',b:1,s:14,c:'#0b0f17'}); K.t(ctx,n.alive?'T'+n.term:'down',x,y+10,{a:'center',s:11,c:'#0b0f17',b:1}); });
    // logs
    K.t(ctx,'Logs (number = term of entry; solid = committed)',520,20,{s:11,c:C.muted});
    nodes.forEach((n,i)=>{ const y=40+i*56; K.t(ctx,'S'+n.id+' '+(n.alive?n.state:'crashed'),520,y+10,{s:11,b:1,c:n.state==='leader'?C.good:C.text});
      n.log.slice(-12).forEach((tm,k)=>{ const idx=Math.max(0,n.log.length-12)+k; K.rr(ctx,520+k*26,y+20,22,22,3,idx<=n.commit?`hsl(${tm*55%360} 60% 50%)`:'#111827',`hsl(${tm*55%360} 60% 50%)`); K.t(ctx,String(tm),531+k*26,y+31,{a:'center',s:10}); }); });
    K.t(ctx,'● RequestVote ● vote yes ● vote no ● heartbeat ● AppendEntries w/ data',20,325,{s:10,c:C.muted});
    const L=nodes.find(n=>n.alive&&n.state==='leader'); ro.textContent=(flash?flash+'\n':'')+(L?`Leader S${L.id}, term ${L.term}, commitIndex ${L.commit}. Crash it and watch a follower time out (randomized 2-4 s here; 150-300 ms in the paper).`:'No leader: election in progress. Split votes are resolved by randomized timeouts.')+` Majority = ${Math.floor(N/2)+1}/${N}; crash 3 and no progress is possible (safety over availability).`;
  });
});

defSim('quorum','Quorums: N, R, W and stale reads','Write v2 to W of N replicas (others lag), then read from R random replicas. If R + W > N every read quorum overlaps the write quorum.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,260); let last=null, stats={stale:0,fresh:0,wfail:0,rfail:0};
  const v=K.ctrls(root,[{k:'n',label:'N',min:3,max:9,v:5,on:clr},{k:'w',label:'W',min:1,max:9,v:3,on:clr},{k:'r',label:'R',min:1,max:9,v:3,on:clr},{k:'down',label:'Replicas down',min:0,max:5,v:0,on:clr},{btn:'One trial',primary:1,on:()=>{trial(true);}},{btn:'Run 1000',on:()=>{for(let i=0;i<1000;i++)trial(false);}}]);
  const ro=K.readout(root);
  function clr(){ stats={stale:0,fresh:0,wfail:0,rfail:0}; last=null; }
  function pick(arr,k){ const a=arr.slice().sort(()=>Math.random()-.5); return a.slice(0,k); }
  function trial(show){ const N=v.n, Wq=Math.min(v.w,N), Rq=Math.min(v.r,N); const alive=pick([...Array(N).keys()],N-Math.min(v.down,N)); const ver=new Array(N).fill(1);
    if(alive.length<Wq){ stats.wfail++; if(show) last={ver,alive,ws:[],rs:[],res:'write FAILED: fewer than W replicas reachable'}; return; }
    const ws=pick(alive,Wq); ws.forEach(i=>ver[i]=2);
    if(alive.length<Rq){ stats.rfail++; if(show) last={ver,alive,ws,rs:[],res:'read FAILED: fewer than R replicas reachable'}; return; }
    const rs=pick(alive,Rq); const got=Math.max(...rs.map(i=>ver[i])); if(got===2) stats.fresh++; else stats.stale++;
    if(show) last={ver,alive,ws,rs,res:got===2?'read returned v2 (fresh)':'read returned v1 — STALE'}; }
  K.loop(cv,()=>{ K.clear(ctx,W,H); const N=v.n;
    for(let i=0;i<N;i++){ const x=60+i*85, y=90; const alive=last?last.alive.includes(i):i>=Math.min(v.down,N); const ver=last?last.ver[i]:1; const inW=last&&last.ws.includes(i), inR=last&&last.rs.includes(i);
      ctx.beginPath(); ctx.arc(x,y,28,0,7); ctx.fillStyle=!alive?'#1f2937':ver===2?C.good:C.accent; ctx.fill(); K.t(ctx,alive?'v'+ver:'down',x,y,{a:'center',b:1,c:'#0b0f17'});
      if(inW) K.t(ctx,'W',x,y-42,{a:'center',b:1,c:C.good}); if(inR){ ctx.beginPath(); ctx.arc(x,y,34,0,7); ctx.strokeStyle=C.warn; ctx.lineWidth=3; ctx.stroke(); K.t(ctx,'R',x,y+46,{a:'center',b:1,c:C.warn}); } }
    const ok=v.r+v.w>v.n; K.t(ctx,'R + W = '+(v.r+v.w)+(ok?' > ':' ≤ ')+'N = '+v.n+(ok?'  → read & write quorums always intersect':'  → stale reads possible'),40,175,{b:1,c:ok?C.good:C.warn});
    if(last) K.t(ctx,last.res,40,200,{s:13,c:last.res.includes('STALE')||last.res.includes('FAIL')?C.bad:C.good});
    const tot=stats.stale+stats.fresh+stats.wfail+stats.rfail;
    ro.textContent=`trials=${tot}  fresh=${stats.fresh}  stale=${stats.stale} (${tot?K.pct(stats.stale/tot):'-'})  write-unavailable=${stats.wfail}  read-unavailable=${stats.rfail}\nOverlap gives "read sees latest acknowledged write" only with extra machinery (read repair, version vectors, and no sloppy quorums/hinted handoff). Linearizability needs more (e.g. consensus or read-your-quorum + write-back). Lower W = faster, more available writes; lower R = faster reads — you are trading latency/availability for consistency (PACELC).`;
  });
});

defSim('hashRing','Consistent hashing ring with virtual nodes','Keys map to the next node clockwise. Adding/removing a node moves only ~K/N keys (vs nearly all with hash mod N). Virtual nodes even out load.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,320); let nodes=['A','B','C','D'], moved=null, modMoved=null;
  const keys=[]; for(let i=0;i<300;i++) keys.push('key'+i);
  const v=K.ctrls(root,[{k:'vn',label:'Virtual nodes per server',min:1,max:64,v:8},{btn:'Add server',primary:1,on:()=>change(1)},{btn:'Remove server',on:()=>change(-1)}]);
  const ro=K.readout(root);
  function h(s){ let x=2166136261; for(let i=0;i<s.length;i++){ x^=s.charCodeAt(i); x=Math.imul(x,16777619);} x^=x>>>13; x=Math.imul(x,0x5bd1e995); x^=x>>>15; return (x>>>0)/4294967296; }
  function ring(ns){ const pts=[]; ns.forEach(n=>{ for(let k=0;k<v.vn;k++) pts.push({p:h(n+'#'+k),n}); }); return pts.sort((a,b)=>a.p-b.p); }
  function owner(pts,key){ const p=h(key); for(const q of pts) if(q.p>=p) return q.n; return pts[0].n; }
  function change(d){ const before=ring(nodes); const old=keys.map(k=>owner(before,k)); const oldMod=keys.map(k=>nodes[Math.floor(h(k)*1e6)%nodes.length]);
    if(d>0){ if(nodes.length>=8) return; nodes=nodes.concat(['E','F','G','H','I'].find(x=>!nodes.includes(x))); } else { if(nodes.length<=2) return; nodes=nodes.slice(0,-1); }
    const after=ring(nodes); moved=keys.filter((k,i)=>owner(after,k)!==old[i]).length; modMoved=keys.filter((k,i)=>nodes[Math.floor(h(k)*1e6)%nodes.length]!==oldMod[i]).length; }
  const cols={A:C.accent,B:C.cyan,C:C.good,D:C.warn,E:C.pink,F:C.orange,G:C.blue,H:'#a3e635'};
  K.loop(cv,()=>{ const pts=ring(nodes); K.clear(ctx,W,H); const cx=170,cy=160,R=130;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.stroke();
    const cnt={}; nodes.forEach(n=>cnt[n]=0);
    keys.forEach(k=>{ const p=h(k), o=owner(pts,k); cnt[o]++; const a=p*Math.PI*2-Math.PI/2; ctx.fillStyle=cols[o]; ctx.fillRect(cx+(R-12)*Math.cos(a)-1.5,cy+(R-12)*Math.sin(a)-1.5,3,3); });
    pts.forEach(q=>{ const a=q.p*Math.PI*2-Math.PI/2; ctx.beginPath(); ctx.arc(cx+R*Math.cos(a),cy+R*Math.sin(a),5,0,7); ctx.fillStyle=cols[q.n]; ctx.fill(); });
    const ideal=keys.length/nodes.length; let maxDev=0;
    nodes.forEach((n,i)=>{ const y=30+i*34; K.t(ctx,'server '+n,360,y+8,{b:1,c:cols[n]}); K.rr(ctx,450,y,cnt[n]/keys.length*nodes.length*150,16,4,cols[n]); K.t(ctx,cnt[n]+' keys',460+cnt[n]/keys.length*nodes.length*150,y+8,{s:11}); maxDev=Math.max(maxDev,Math.abs(cnt[n]-ideal)/ideal); });
    K.line(ctx,600,20,600,30+nodes.length*34,C.dim,1,[4,4]); K.t(ctx,'ideal',605,16,{s:10,c:C.dim});
    ro.textContent=`max load deviation from ideal: ${K.pct(maxDev)} (more vnodes → smoother)\n`+(moved!==null?`last change moved ${moved}/${keys.length} keys with consistent hashing vs ${modMoved}/${keys.length} with hash(key) mod N.`:'Click Add/Remove server.')+`\nUsed in Dynamo/Cassandra, memcached clients, CDNs, and LB affinity (Maglev uses a lookup-table variant; rendezvous/HRW hashing is another option).`;
  });
});

defSim('retryStorm','Retry storms & metastable failure','A brief outage makes clients retry. Without backoff/jitter/budgets the retries alone exceed capacity and the system never recovers.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let hist=[], pending=[], t=0, outageUntil=-1, acc=0;
  const v=K.ctrls(root,[{sel:'pol',label:'Client policy',v:'imm',opts:[['none','no retries'],['imm','3 immediate retries'],['exp','exp. backoff (no jitter)'],['jit','backoff + full jitter'],['bud','jitter + retry budget 10%']],on:rs},{k:'base',label:'Base load (% of capacity)',min:30,max:95,v:70},{btn:'Trigger 2 s outage',primary:1,on:()=>{outageUntil=t+2;}},{btn:'Reset',on:rs}]);
  const ro=K.readout(root); const CAP=100;
  function rs(){ hist=[]; pending=[]; t=0; outageUntil=-1; }
  K.loop(cv,(dt)=>{ acc+=dt; while(acc>0.05){ acc-=0.05; t+=0.05; const slot=0.05;
      let offered=v.base*slot; const retriesDue=pending.filter(p=>p.at<=t); pending=pending.filter(p=>p.at>t); offered+=retriesDue.length*1;
      const down=t<outageUntil; const cap=down?0:CAP*slot; let served=Math.min(offered,cap); // overload => timeouts: excess fails; when load>cap, latency grows and some served still time out
      const overload=offered>cap*1.0; const goodput= overload? served*Math.max(0,1-(offered/cap-1)) : served; const failed=offered-goodput;
      const nfail=Math.round(failed); const budget=v.pol==='bud'? v.base*slot*0.1 : Infinity; let used=0;
      for(let i=0;i<nfail;i++){ const att=(retriesDue[i]&&retriesDue[i].att)||0; if(v.pol==='none'||att>=3) continue; if(used>=budget) continue; used++;
        let delay= v.pol==='imm'?0.05: v.pol==='exp'? 0.2*Math.pow(2,att) : Math.random()*0.2*Math.pow(2,att+1); pending.push({at:t+delay,att:att+1}); }
      hist.push({off:offered/slot,good:goodput/slot,down}); if(hist.length>400) hist.shift(); }
    K.clear(ctx,W,H); const x0=40,y0=240,sc=180/300; K.line(ctx,x0,y0-CAP*sc,840,y0-CAP*sc,C.bad,1,[5,5]); K.t(ctx,'capacity',845,y0-CAP*sc,{a:'right',s:10,c:C.bad,bl:'bottom'});
    hist.forEach((h,i)=>{ const x=x0+i*2; if(h.down){ ctx.fillStyle='rgba(248,113,113,.12)'; ctx.fillRect(x,40,2,200);} ctx.fillStyle=C.warn; ctx.fillRect(x,y0-Math.min(300,h.off)*sc,2,2); ctx.fillStyle=C.good; ctx.fillRect(x,y0-h.good*sc,2,2); });
    K.t(ctx,'— offered load (incl. retries)',40,20,{c:C.warn,s:11}); K.t(ctx,'— goodput',260,20,{c:C.good,s:11});
    const lastH=hist[hist.length-1]||{off:0,good:0}; ro.textContent=`offered ${lastH.off.toFixed(0)} req/s vs capacity ${CAP}; goodput ${lastH.good.toFixed(0)}.\n`+(lastH.off>CAP*1.05&&t>outageUntil+3?'METASTABLE: the trigger is gone but retry load keeps the system overloaded. Recovery requires shedding load (drop retries, circuit-break, rate-limit at the edge).':'Backoff spreads retries in time; jitter de-synchronizes clients; a retry budget (e.g. retries ≤10% of requests, as in gRPC/Finagle) caps amplification. Also: retry only idempotent ops, propagate deadlines, and never retry at every layer (3 layers × 3 retries = 27×).');
  });
});

defSim('tcpCwnd','TCP congestion window under loss','Slow start doubles cwnd per RTT up to ssthresh, then additive increase. Loss → multiplicative decrease (fast recovery) or timeout (back to 1).',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let hist=[], cwnd=1, ss=64, rtt=0, acc=0, events=[];
  const v=K.ctrls(root,[{sel:'algo',label:'Algorithm',v:'reno',opts:[['reno','Reno/NewReno (AIMD)'],['cubic','CUBIC (Linux default)']],on:rs},{k:'loss',label:'Loss rate %',min:0,max:5,step:0.1,v:0.5},{k:'bdp',label:'Path BDP (pkts)',min:10,max:200,v:80},{chk:'rto',label:'losses are timeouts (no dup ACKs)',v:false},{k:'sp',label:'RTTs/s',min:1,max:30,v:8},{btn:'Reset',on:rs}]);
  const ro=K.readout(root); let wmax=0, tLoss=0;
  function rs(){ hist=[]; cwnd=1; ss=64; rtt=0; events=[]; wmax=0; tLoss=0; }
  K.loop(cv,(dt)=>{ acc+=dt*v.sp; while(acc>1){ acc--; rtt++;
      const queueLoss = cwnd>v.bdp*1.3; const p=v.loss/100; const lossP=1-Math.pow(1-p,cwnd); const lost=queueLoss||Math.random()<lossP;
      if(lost){ events.push({rtt,kind:v.rto?'timeout':'3 dup ACKs'}); wmax=cwnd; tLoss=rtt; if(v.rto){ ss=Math.max(2,cwnd/2); cwnd=1; } else { ss=Math.max(2,cwnd*(v.algo==='cubic'?0.7:0.5)); cwnd=ss; } }
      else if(cwnd<ss) cwnd=Math.min(cwnd*2,ss>cwnd*2?cwnd*2:ss);
      else if(v.algo==='reno') cwnd+=1;
      else { const Kc=Math.cbrt(wmax*0.3/0.4); const tt=(rtt-tLoss)*0.25; cwnd=Math.max(cwnd+0.5, 0.4*Math.pow(tt-Kc,3)+wmax); }
      hist.push({c:cwnd,s:ss}); if(hist.length>200) hist.shift(); }
    K.clear(ctx,W,H); const x0=40,y0=250; const maxC=Math.max(v.bdp*1.5,...hist.map(h=>h.c)); const sy=c=>y0-c/maxC*220;
    K.line(ctx,x0,sy(v.bdp),840,sy(v.bdp),C.good,1,[5,5]); K.t(ctx,'BDP (pipe full)',845,sy(v.bdp)-8,{a:'right',s:10,c:C.good});
    ctx.beginPath(); hist.forEach((h,i)=>{ const x=x0+i*4; i?ctx.lineTo(x,sy(h.c)):ctx.moveTo(x,sy(h.c)); }); ctx.strokeStyle=C.cyan; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); hist.forEach((h,i)=>{ const x=x0+i*4; i?ctx.lineTo(x,sy(h.s)):ctx.moveTo(x,sy(h.s)); }); ctx.strokeStyle=C.warn; ctx.setLineDash([3,3]); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
    K.t(ctx,'— cwnd',40,16,{c:C.cyan,s:11}); K.t(ctx,'--- ssthresh',110,16,{c:C.warn,s:11});
    const avg=hist.length?hist.reduce((s,h)=>s+Math.min(h.c,v.bdp),0)/hist.length:0; const mathis= v.loss>0? (1.22/Math.sqrt(v.loss/100)).toFixed(1):'∞';

defSim('lpm','Longest-prefix match routing table','Type a destination IP; every matching route lights up and the most specific (longest prefix) wins — the data plane does this per packet in a trie/TCAM.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,260);
  const RT=[['0.0.0.0/0','via 192.168.1.1 (default)','eth0'],['10.0.0.0/8','via 10.255.0.1 (corp VPN)','tun0'],['10.20.0.0/16','via 10.20.0.1 (lab)','eth1'],['10.20.30.0/24','directly connected','eth2'],['10.20.30.128/25','via 10.20.30.254 (camera VLAN)','eth2.30'],['172.16.0.0/12','blackhole','—'],['192.168.1.0/24','directly connected','eth0']];
  const v=K.ctrls(root,[{text:'ip',label:'Destination IP',v:'10.20.30.200',size:16},{btn:'Random',on:()=>{ const ips=['10.20.30.200','10.20.30.5','10.20.99.1','10.1.2.3','8.8.8.8','172.20.1.1','192.168.1.77']; v._els.ip.value=ips[K.ri(0,ips.length-1)]; v.ip=v._els.ip.value; }}]);
  const ro=K.readout(root);
  function ip2n(s){ const p=s.trim().split('.').map(Number); if(p.length!==4||p.some(x=>isNaN(x)||x<0||x>255)) return null; return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3]; }
  function bin(n){ return n.toString(2).padStart(32,'0').replace(/(.{8})/g,'$1 ').trim(); }
  K.loop(cv,()=>{ K.clear(ctx,W,H); const ip=ip2n(v.ip||''); if(ip===null){ K.t(ctx,'invalid IPv4',20,20,{c:C.bad}); return; }
    K.t(ctx,'dst  '+bin(ip),20,18,{m:1,s:12,c:C.warn}); let best=-1, bestLen=-1;
    RT.forEach((r,i)=>{ const [net,len]=r[0].split('/'); const n=ip2n(net), L=+len; const mask=L===0?0:((0xffffffff<<(32-L))>>>0); const match=((ip&mask)>>>0)===((n&mask)>>>0); r.m=match; if(match&&L>bestLen){bestLen=L;best=i;} });
    RT.forEach((r,i)=>{ const y=46+i*28; const win=i===best; K.rr(ctx,20,y-11,820,24,5,win?'#14532d':r.m?'#1e1b4b':'#0f1626',win?C.good:r.m?C.accent:C.line); K.t(ctx,r[0],30,y,{m:1,s:12,b:win}); K.t(ctx,r[1],210,y,{s:12,c:C.muted}); K.t(ctx,r[2],520,y,{m:1,s:12}); K.t(ctx,win?'◀ WINNER (/'+bestLen+')':r.m?'matches':'',640,y,{s:12,b:1,c:win?C.good:C.accent}); });
    const r=RT[best]; ro.textContent=`Forward via ${r[2]} — ${r[1]}. Next: ARP (IPv4) / ND (IPv6) resolves the next-hop IP to a MAC; the frame is rewritten (new src/dst MAC, TTL−1, checksum update) at every L3 hop; IPs stay the same (absent NAT).\nHardware: TCAMs match all prefixes in parallel with priority = prefix length; software uses compressed tries (Linux FIB uses LC-trie; DPDK uses DIR-24-8).`;
  });
});

defSim('bgp','BGP route propagation, hijacks & RPKI','AS64500 originates 203.0.113.0/24. Each AS prefers the shortest AS_PATH (real BGP: local-pref first). Simulate a more-specific hijack and turn on RPKI route-origin validation.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,320);
  const AS=[{n:64500,x:90,y:160,lab:'origin'},{n:3356,x:260,y:70},{n:174,x:260,y:250},{n:2914,x:450,y:60},{n:6939,x:450,y:160},{n:1299,x:450,y:260},{n:13335,x:640,y:110,lab:'you'},{n:666,x:640,y:270,lab:'attacker'},{n:7018,x:790,y:180}];
  const L=[[0,1],[0,2],[1,3],[1,4],[2,4],[2,5],[3,6],[4,6],[4,8],[5,7],[5,8],[6,8],[7,8]];
  let routes={}, wave=[], t=0;
  const v=K.ctrls(root,[{btn:'Announce',primary:1,on:()=>start(false)},{btn:'Hijack: AS666 announces /25s',on:()=>start(true)},{chk:'rpki',label:'RPKI ROV enabled (ROA: 203.0.113.0/24 origin AS64500, maxLength /24)',v:false,on:()=>{}}]);
  const ro=K.readout(root);
  function start(hij){ routes={}; wave=[]; t=0; routes[0]={path:[64500],pfx:'/24'}; AS.forEach((a,i)=>routes[i]=routes[i]||null); queue(0,'/24',[64500]); if(hij){ routes[7]={path:[666],pfx:'/25',hijack:true}; queue(7,'/25',[666],true); } }
  function queue(from,pfx,path,hj){ L.forEach(([a,b])=>{ const to=a===from?b:b===from?a:-1; if(to<0) return; wave.push({from,to,pfx,path,hj,t:0,dur:0.8}); }); }
  start(false);
  K.loop(cv,(dt)=>{ t+=dt; wave.forEach(w=>w.t+=dt/w.dur); const arrived=wave.filter(w=>w.t>=1); wave=wave.filter(w=>w.t<1);
    arrived.forEach(w=>{ if(w.path.includes(AS[w.to].n)) return; if(w.hj && v.rpki && w.to!==7){ return; } const cur=routes[w.to]; const np=[AS[w.to].n].concat(w.path);
      const better = !cur || (w.pfx==='/25' && cur.pfx==='/24') || (w.pfx===cur.pfx && np.length<cur.path.length);
      if(better){ routes[w.to]={path:np,pfx:w.pfx,hijack:!!w.hj}; queue(w.to,w.pfx,np,w.hj); } });
    K.clear(ctx,W,H); L.forEach(([a,b])=>K.line(ctx,AS[a].x,AS[a].y,AS[b].x,AS[b].y,C.line,2));
    wave.forEach(w=>{ const a=AS[w.from], b=AS[w.to]; ctx.beginPath(); ctx.arc(K.lerp(a.x,b.x,w.t),K.lerp(a.y,b.y,w.t),5,0,7); ctx.fillStyle=w.hj?C.bad:C.good; ctx.fill(); });
    AS.forEach((a,i)=>{ const r=routes[i]; const col=!r?'#1f2937':r.hijack?'#7f1d1d':'#14532d'; K.rr(ctx,a.x-46,a.y-24,92,48,10,col,r&&r.hijack?C.bad:r?C.good:C.line); K.t(ctx,'AS'+a.n,a.x,a.y-10,{a:'center',b:1,s:12}); K.t(ctx,r?r.path.join(' ')+' '+r.pfx:(a.lab||'—'),a.x,a.y+8,{a:'center',s:9,m:1,c:C.muted}); if(a.lab) K.t(ctx,a.lab,a.x,a.y+34,{a:'center',s:10,c:C.warn}); });
    const you=routes[6]; ro.textContent=(you?`AS13335 sends traffic for 203.0.113.0/24 via path [${you.path.join(' → ')}] ${you.pfx}${you.hijack?' — HIJACKED (more-specific always wins LPM!)':''}`:'propagating…')+`\nReal best-path order: highest LOCAL_PREF (policy: customer > peer > provider), shortest AS_PATH, lowest origin, lowest MED, eBGP over iBGP, lowest IGP cost to next hop, tie-breakers. RPKI ROV drops announcements whose origin/length violate a signed ROA — it stops origin hijacks (like the 2008 Pakistan/YouTube /24) but not path forgery (BGPsec/ASPA address that).`;
  });
});

defSim('packetPath','Packet path: kernel stack vs XDP vs DPDK','Per-packet cost determines packets/second per core. At 100 Gb/s with 64-byte frames you get ~148.8 M packets/s — about 6.7 ns per packet.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let pk=[], acc=0;
  const v=K.ctrls(root,[{sel:'path',label:'Path',v:'kernel',opts:[['kernel','Linux kernel stack → socket → app'],['xdp','XDP (eBPF at driver RX hook)'],['dpdk','DPDK (kernel bypass, poll-mode)'],['rdma','RDMA (NIC does transport, zero-copy)']]},{k:'size',label:'Frame bytes',min:64,max:1500,v:64},{k:'gbps',label:'Link Gb/s',min:10,max:400,step:10,v:100}]);
  const ro=K.readout(root);
  const stages={kernel:[['NIC DMA + IRQ/NAPI',60],['skb alloc + GRO',120],['netfilter/iptables',150],['IP + TCP/UDP',200],['socket queue + wakeup',250],['copy to user (recv)',220]],xdp:[['NIC DMA (NAPI poll)',40],['XDP prog: parse + map lookup',30],['XDP_TX / REDIRECT / DROP',20]],dpdk:[['NIC DMA (poll, no IRQ)',25],['rte_mbuf from hugepage pool',10],['app parse/forward (batch 32)',25]],rdma:[['app posts WQE (doorbell)',15],['NIC: transport, DMA from app buffer',10],['remote NIC DMA into registered memory',10]]};
  K.loop(cv,(dt)=>{ const s=stages[v.path]; const ns=s.reduce((a,b)=>a+b[1],0); acc+=dt*4; if(acc>0.25){ acc=0; pk.push({t:0}); }
    pk.forEach(p=>p.t+=dt*0.5); pk=pk.filter(p=>p.t<1);
    K.clear(ctx,W,H); const w=800/s.length;
    s.forEach((st,i)=>{ const x=20+i*w; K.rr(ctx,x+4,60,w-12,70,10,'#111827',C.accent); K.t(ctx,st[0],x+w/2-4,85,{a:'center',s:10.5,b:1}); K.t(ctx,'~'+st[1]+' ns',x+w/2-4,108,{a:'center',s:11,c:C.muted}); });
    pk.forEach(p=>{ ctx.beginPath(); ctx.arc(20+p.t*800,145,5,0,7); ctx.fillStyle=C.warn; ctx.fill(); });
    const pps=v.gbps*1e9/((v.size+20)*8); const perPkt=1e9/pps; const coreMpps=1000/ns; const cores=Math.ceil(pps/1e6/coreMpps);
    K.t(ctx,'line rate: '+(pps/1e6).toFixed(1)+' Mpps → budget '+perPkt.toFixed(1)+' ns/packet',20,180,{b:1});
    K.t(ctx,'this path: ~'+ns+' ns/packet/core → '+coreMpps.toFixed(1)+' Mpps/core → need ≈ '+cores+' cores (illustrative numbers)',20,205,{b:1,c:cores>16?C.bad:C.good});
    ro.textContent='Why +20 bytes: preamble+SFD (8) + inter-frame gap (12). Kernel stack costs come from per-packet allocations, cache misses, locks, syscalls, copies. XDP keeps kernel ownership & tooling but runs before skb allocation (≈ tens of Mpps/core for drop/redirect). DPDK owns the NIC from user space: polling, hugepages, batching, run-to-completion — burns cores even when idle. RDMA offloads transport to the NIC: µs latency and near-zero CPU, needs lossless or well-managed fabric (RoCEv2 + PFC/ECN/DCQCN).';
  });
});

defSim('ringAllreduce','Ring all-reduce (NCCL-style)','Each GPU holds a gradient vector split into N chunks. Reduce-scatter (N−1 steps) then all-gather (N−1 steps). Each GPU sends 2(N−1)/N of the data — independent of N!',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let step=0, acc=0;
  const v=K.ctrls(root,[{k:'n',label:'GPUs',min:3,max:8,v:4,on:()=>step=0},{k:'gb',label:'Gradient size (GB)',min:1,max:20,v:4},{k:'bw',label:'Link BW (GB/s per direction)',min:25,max:450,step:25,v:200},{k:'sp',label:'Speed',min:1,max:10,v:3}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ const N=v.n; acc+=dt*v.sp*0.4; if(acc>1){ acc=0; step=(step+1)%(2*(N-1)+3); }
    K.clear(ctx,W,H); const cx=200,cy=150,R=105;
    // state: chunk c on gpu g has count of contributions
    const has=[]; for(let g=0;g<N;g++){ has.push([]); for(let c=0;c<N;c++) has[g].push(1); }
    const s=Math.min(step,2*(N-1));
    for(let k=0;k<s;k++){ const snap=has.map(r=>r.slice()); for(let g=0;g<N;g++){ const send=k<N-1? ((g-k)%N+N)%N : ((g+1-(k-(N-1)))%N+N)%N; const to=(g+1)%N; if(k<N-1) has[to][send]=snap[to][send]+snap[g][send]; else has[to][send]=snap[g][send]; } }
    for(let g=0;g<N;g++){ const a=g/N*Math.PI*2-Math.PI/2; const x=cx+R*Math.cos(a), y=cy+R*Math.sin(a); K.rr(ctx,x-40,y-22,80,44,8,'#111827',C.line); K.t(ctx,'GPU'+g,x,y-12,{a:'center',s:10,b:1});
      for(let c=0;c<N;c++){ const full=has[g][c]===N; ctx.fillStyle=`hsl(${c*360/N} 70% ${full?55:20+has[g][c]/N*30}%)`; ctx.fillRect(x-36+c*72/N,y-2,72/N-2,18); } 
      const b=(g+1)/N*Math.PI*2-Math.PI/2; K.arrow(ctx,cx+(R-30)*Math.cos(a+0.25),cy+(R-30)*Math.sin(a+0.25),cx+(R-30)*Math.cos(b-0.25),cy+(R-30)*Math.sin(b-0.25),s<2*(N-1)?C.warn:C.line,1.5); }
    const phase= step===0?'start: each GPU has its own gradients': step<=N-1?'reduce-scatter step '+step+'/'+(N-1)+' (send chunk, receiver adds)': step<=2*(N-1)?'all-gather step '+(step-N+1)+'/'+(N-1)+' (circulate fully-reduced chunks)':'done: every GPU has the full sum';
    K.t(ctx,phase,400,40,{b:1,c:C.warn}); K.t(ctx,'bright chunk = fully reduced (sum of all N)',400,64,{s:11,c:C.muted});
    const ring=2*(N-1)/N*v.gb/v.bw; const ps=2*v.gb*(N-1)/v.bw;
    K.t(ctx,'ring all-reduce time ≈ 2(N−1)/N · S/B = '+(ring*1000).toFixed(0)+' ms',400,110,{s:12}); K.t(ctx,'naive gather-to-one + broadcast ≈ 2(N−1)·S/B = '+(ps*1000).toFixed(0)+' ms',400,134,{s:12,c:C.muted});
    ro.textContent='Bandwidth-optimal, but latency term grows with 2(N−1) steps → NCCL also uses trees and hierarchical (intra-node NVLink, inter-node InfiniBand/RoCE) algorithms. In inference, tensor parallelism issues all-reduces every layer — small messages where latency (and NVLink/NVSwitch) dominates. Network observability roles care about exactly this: one slow link or a PFC storm stalls the whole ring.';
  });
});

defSim('loadBalancer','Load-balancing algorithms','Backends have different speeds; requests have variable cost. Compare queue buildup and tail latency.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let bk=[], acc=0, rr=0, lat=[];
  const v=K.ctrls(root,[{sel:'alg',label:'Algorithm',v:'p2c',opts:[['rr','round robin'],['rand','random'],['lc','least connections (global view)'],['p2c','power of two choices'],['hash','hash(client) affinity']]},{k:'rate',label:'Load %',min:30,max:98,v:80},{chk:'slow',label:'backend 2 degraded (3× slower)',v:true},{btn:'Reset',on:()=>{bk=[];lat=[];}}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ if(!bk.length) for(let i=0;i<6;i++) bk.push({q:[],speed:1}); bk[2].speed=v.slow?1/3:1; const cap=bk.reduce((s,b)=>s+b.speed,0)*10;
    acc+=dt*cap*v.rate/100*3; const now=performance.now()/1000;
    while(acc>1){ acc--; let i; const client=K.ri(0,20);
      if(v.alg==='rr') i=rr++%6; else if(v.alg==='rand') i=K.ri(0,5); else if(v.alg==='lc') i=bk.map((b,k)=>[b.q.length,k]).sort((a,b)=>a[0]-b[0])[0][1];
      else if(v.alg==='p2c'){ const a=K.ri(0,5), b=K.ri(0,5); i=bk[a].q.length<=bk[b].q.length?a:b; } else i=client%6;
      bk[i].q.push({t:now,w:K.rnd(0.5,1.5)}); }
    bk.forEach(b=>{ let budget=dt*10*b.speed*3; while(b.q.length && budget>0){ const r=b.q[0]; const use=Math.min(budget,r.w); r.w-=use; budget-=use; if(r.w<=1e-9){ b.q.shift(); lat.push(now-r.t); if(lat.length>500) lat.shift(); } } });
    K.clear(ctx,W,H); bk.forEach((b,i)=>{ const y=20+i*38; K.t(ctx,'backend '+i+(b.speed<1?' (slow)':''),20,y+12,{s:11,c:b.speed<1?C.warn:C.muted}); for(let k=0;k<Math.min(60,b.q.length);k++){ K.rr(ctx,140+k*11,y+2,9,20,2,b.speed<1?C.warn:C.accent); } if(b.q.length>60) K.t(ctx,'+'+(b.q.length-60),810,y+12,{s:11,c:C.bad}); });
    const s=lat.slice().sort((a,b)=>a-b); const p50=s[Math.floor(s.length*0.5)]||0, p99=s[Math.floor(s.length*0.99)]||0;
    K.t(ctx,'p50 '+(p50*1000).toFixed(0)+' ms    p99 '+(p99*1000).toFixed(0)+' ms',140,260,{b:1,s:14,c:p99>2?C.bad:C.good});
    ro.textContent='Round robin/random ignore backend state → the slow node’s queue explodes and dominates p99. Least-connections needs shared global state (hard across many LB instances). Power-of-two-choices: sample 2, pick the less loaded — exponential improvement over random with no global state (Mitzenmacher). Affinity/consistent hashing helps caches (incl. KV caches) but needs bounded-load variants to avoid hot spots.';
  });
});

defSim('cgroups','cgroup CPU quota throttling','A container with cpu.max = "quota period". A multi-threaded burst can exhaust the quota early in the period → all threads frozen until the next period: p99 latency spikes even at low average CPU.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,260); let t=0;
  const v=K.ctrls(root,[{k:'q',label:'Quota (ms per 100 ms)',min:10,max:400,step:10,v:100},{k:'th',label:'Threads busy during burst',min:1,max:8,v:6},{k:'burst',label:'Request work (CPU-ms)',min:10,max:300,step:10,v:120}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ t+=dt; K.clear(ctx,W,H); const periods=4; const pw=800/periods; let remaining=v.burst, finishAt=null, throttled=0;
    for(let p=0;p<periods;p++){ const x=20+p*pw; K.rr(ctx,x,40,pw-4,150,6,'#0f1626',C.line); K.t(ctx,'period '+p+' (100 ms)',x+6,30,{s:10,c:C.muted});
      let quota=v.q; for(let ms=0;ms<100;ms++){ if(remaining<=0) break; const use=Math.min(v.th,quota,remaining); if(use<=0){ ctx.fillStyle='rgba(248,113,113,.35)'; ctx.fillRect(x+ms*(pw-4)/100,40,(pw-4)/100+0.5,150); throttled++; continue; }
        for(let k=0;k<use;k++){ ctx.fillStyle=C.good; ctx.fillRect(x+ms*(pw-4)/100,180-k*18,(pw-4)/100+0.5,14); } quota-=use; remaining-=use; if(remaining<=0) finishAt=p*100+ms; } }
    K.t(ctx,'green = thread running · red = throttled (quota exhausted)',20,210,{s:11,c:C.muted});
    const ideal=Math.ceil(v.burst/v.th);
    K.t(ctx,'request latency: '+(finishAt!==null?finishAt+' ms':'> 400 ms')+'   (unthrottled: '+ideal+' ms)   avg CPU limit = '+(v.q/100).toFixed(1)+' cores',20,236,{b:1,c:finishAt!==null&&finishAt>ideal*1.5?C.bad:C.good});
    ro.textContent='Kubernetes CPU limits map to CFS bandwidth control (cpu.max / cfs_quota_us). The limit is enforced per period across ALL threads, so a 6-thread burst burns a "1 core" quota in ~17 ms and sleeps 83 ms. Mitigations: raise/remove limits for latency-critical pods (keep requests), shorter periods, cpu.max.burst (5.14+), right-size thread pools to the limit (GOMAXPROCS, JVM ActiveProcessorCount). Memory limits instead trigger the OOM killer.';
  });
});

defSim('k8sReconcile','Kubernetes reconciliation loop','A controller continuously drives actual state toward desired state: observe → diff → act. Kill pods or a node and watch it heal. (Level-triggered, not edge-triggered.)',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let pods=[], id=0, log=[], acc=0, nodesUp=[true,true,true];
  const v=K.ctrls(root,[{k:'rep',label:'spec.replicas',min:0,max:9,v:4},{btn:'Kill random pod',on:()=>{ const p=pods.filter(p=>p.st!=='Terminating'); if(p.length){ const x=p[K.ri(0,p.length-1)]; x.st='Terminating'; x.t=0; L('pod '+x.id+' killed'); } }},{btn:'Toggle node-2 down',on:()=>{ nodesUp[2]=!nodesUp[2]; L('node-2 '+(nodesUp[2]?'Ready':'NotReady')); if(!nodesUp[2]) pods.filter(p=>p.node===2).forEach(p=>{p.st='Terminating';p.t=0;}); }}]);
  const ro=K.readout(root);
  function L(s){ log.unshift(s); log=log.slice(0,6); }
  K.loop(cv,(dt)=>{ acc+=dt; pods.forEach(p=>{ p.t+=dt; if(p.st==='Pending'&&p.t>0.6){p.st='ContainerCreating';p.t=0;} else if(p.st==='ContainerCreating'&&p.t>1.2){p.st='Running';p.t=0;} });
    pods=pods.filter(p=>!(p.st==='Terminating'&&p.t>1));
    if(acc>0.7){ acc=0; const live=pods.filter(p=>p.st!=='Terminating'); const diff=v.rep-live.length;
      if(diff>0){ for(let i=0;i<diff;i++){ const up=[0,1,2].filter(n=>nodesUp[n]); const node=up.sort((a,b)=>pods.filter(p=>p.node===a).length-pods.filter(p=>p.node===b).length)[0]; pods.push({id:'web-'+(id++).toString(36),st:'Pending',t:0,node}); } L('reconcile: desired '+v.rep+', actual '+live.length+' → create '+diff); }
      else if(diff<0){ live.slice(0,-diff).forEach(p=>{p.st='Terminating';p.t=0;}); L('reconcile: desired '+v.rep+', actual '+live.length+' → delete '+(-diff)); } }
    K.clear(ctx,W,H); [0,1,2].forEach(n=>{ const x=20+n*275; K.rr(ctx,x,20,260,190,12,nodesUp[n]?'#0f1626':'#2a0f14',nodesUp[n]?C.line:C.bad); K.t(ctx,'node-'+n+(nodesUp[n]?'':'  NotReady'),x+10,36,{b:1,c:nodesUp[n]?C.text:C.bad});
      pods.filter(p=>p.node===n).forEach((p,k)=>{ const px=x+12+(k%2)*125, py=52+Math.floor(k/2)*48; const col={Pending:C.warn,ContainerCreating:C.cyan,Running:C.good,Terminating:C.bad}[p.st]; K.rr(ctx,px,py,115,40,8,'#111827',col,2); K.t(ctx,p.id,px+8,py+13,{s:11,b:1,m:1}); K.t(ctx,p.st,px+8,py+29,{s:10,c:col}); }); });
    K.t(ctx,'events: '+log.join('  ·  ').slice(0,140),20,232,{s:11,c:C.muted});
    ro.textContent='Controllers watch the API server (via informers/shared caches), compare spec vs status, and act idempotently. Because they re-derive the diff from current state every pass (level-triggered), missed events or crashes self-heal. Same pattern powers operators/CRDs, OpenAI-style bare-metal lifecycle controllers, and config rollout systems. Gotchas: controller fights (two controllers owning one field), thundering resyncs, finalizers blocking deletion.';
  });
});

defSim('canary','Canary rollout with automated analysis','Roll a new version through stages. A bad build raises the error rate; the analyzer compares canary vs baseline and rolls back once the difference is statistically clear.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let stage=0, t=0, cReq=0, cErr=0, bReq=0, bErr=0, state='running', badUsers=0, hist=[];
  const ST=[1,5,25,50,100];
  const v=K.ctrls(root,[{k:'bug',label:'New version error rate %',min:0.1,max:10,step:0.1,v:2.5,on:rs},{k:'base',label:'Baseline error %',min:0.1,max:3,step:0.1,v:0.5,on:rs},{k:'bake',label:'Bake time per stage (s)',min:1,max:8,v:3},{chk:'auto',label:'automated rollback',v:true},{btn:'Restart rollout',primary:1,on:rs}]);
  const ro=K.readout(root);
  function rs(){ stage=0; t=0; cReq=cErr=bReq=bErr=0; state='running'; badUsers=0; hist=[]; }
  K.loop(cv,(dt)=>{ if(state==='running'){ t+=dt; const rps=2000; const frac=ST[stage]/100; const n=rps*dt; const cn=n*frac, bn=n*(1-frac);
      const ce=cn*v.bug/100, be=bn*v.base/100; cReq+=cn; cErr+=ce; bReq+=bn; bErr+=be; badUsers+=ce-cn*v.base/100;
      const pc=cErr/Math.max(1,cReq), pb=bErr/Math.max(1,bReq); const se=Math.sqrt(pc*(1-pc)/Math.max(1,cReq)+pb*(1-pb)/Math.max(1,bReq)); const z=se>0?(pc-pb)/se:0;
      hist.push({stage,pc,pb,z}); if(hist.length>300) hist.shift();
      if(v.auto && z>3 && pc>pb*1.2){ state='rolled back at '+ST[stage]+'%'; }
      else if(t>v.bake){ if(stage<ST.length-1){ stage++; t=0; cReq=cErr=0; bReq=bErr=0; } else state='completed (100%)'; } }
    K.clear(ctx,W,H); ST.forEach((s,i)=>{ const x=20+i*165; const done=i<stage||state.startsWith('completed'); const cur=i===stage&&state==='running'; const rb=state.startsWith('rolled')&&i===stage;
      K.rr(ctx,x,20,150,46,10,rb?'#4c0519':done?'#14532d':cur?'#2e1065':'#111827',rb?C.bad:cur?C.accent:C.line,cur||rb?2:1); K.t(ctx,s+'% traffic',x+75,38,{a:'center',b:1}); if(cur) { K.rr(ctx,x+10,52,130*Math.min(1,t/v.bake),6,3,C.accent); } if(rb) K.t(ctx,'ROLLBACK',x+75,56,{a:'center',s:10,b:1,c:C.bad}); });
    const x0=20,y0=250; const maxE=Math.max(v.bug,v.base)*1.6/100; hist.forEach((h,i)=>{ const x=x0+i*2.7; ctx.fillStyle=C.bad; ctx.fillRect(x,y0-h.pc/maxE*150,2,2); ctx.fillStyle=C.good; ctx.fillRect(x,y0-h.pb/maxE*150,2,2); });
    K.t(ctx,'canary error rate',20,86,{s:11,c:C.bad}); K.t(ctx,'baseline',150,86,{s:11,c:C.good});
    const z=hist.length?hist[hist.length-1].z:0;
    ro.textContent=`state: ${state}   z-score(canary−baseline) = ${z.toFixed(1)}   extra failed requests caused ≈ ${Math.max(0,badUsers).toFixed(0)}\nSmall stages limit blast radius but need enough traffic for statistical power — at 1% of 2000 rps, a 0.5→1% shift takes a while to detect. Compare canary against a same-size baseline (not the whole fleet) to cancel time-of-day effects; gate on SLO burn rate too. Error budget = 1 − SLO (99.9% → 43 min/month).`;
  });
});

defSim('configPropagation','Global config push: blast radius','A config change goes to 240 servers in 6 regions. A bad config crashes the process that loads it. Compare instant global push with staged delivery behind health gates.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let nodes=[], t=0, state='idle', stageIdx=0, stageT=0;
  const v=K.ctrls(root,[{sel:'strat',label:'Strategy',v:'staged',opts:[['global','instant global push (what caused major outages)'],['staged','staged: canary PoP → 1 region → 25% → all, with health gates']]},{chk:'bad',label:'config is bad (e.g. regex backtracking / oversized feature file)',v:true},{chk:'lkg',label:'consumers keep last-known-good on parse failure',v:false},{btn:'Push config',primary:1,on:push}]);
  const ro=K.readout(root);
  function init(){ nodes=[]; for(let r=0;r<6;r++) for(let i=0;i<40;i++) nodes.push({r,i,ver:1,st:'ok',at:Infinity}); }
  init();
  const stages=[n=>n.r===0&&n.i<2, n=>n.r===0, n=>n.r<=1||(n.i<10), n=>true];
  function push(){ init(); t=0; state='pushing'; stageIdx=0; stageT=0;
    if(v.strat==='global') nodes.forEach(n=>n.at=K.rnd(0,1.5)); else nodes.filter(stages[0]).forEach(n=>n.at=K.rnd(0,0.5)); }
  K.loop(cv,(dt)=>{ t+=dt; if(state==='pushing'){ nodes.forEach(n=>{ if(t>=n.at && n.ver===1){ n.ver=2; if(v.bad) n.st=v.lkg?'lkg':'crash'; } });
      if(v.strat==='staged'){ stageT+=dt; const inStage=nodes.filter(stages[stageIdx]); const applied=inStage.every(n=>n.ver===2);
        if(applied && stageT>2){ const unhealthy=inStage.filter(n=>n.st==='crash').length; if(unhealthy>0){ state='HALTED by health gate at stage '+(stageIdx+1)+' → auto-revert'; nodes.filter(n=>n.st==='crash').forEach(n=>{n.at=Infinity;}); setTimeout(()=>{ nodes.forEach(n=>{ if(n.ver===2){n.ver=1; n.st='ok';} }); },1200); }
          else if(stageIdx<stages.length-1){ stageIdx++; stageT=0; nodes.filter(n=>stages[stageIdx](n)&&n.ver===1).forEach(n=>n.at=t+K.rnd(0,0.8)); } else state='complete'; } }
      else if(nodes.every(n=>n.ver===2)) state='complete'; }
    K.clear(ctx,W,H); for(let r=0;r<6;r++){ const x=20+(r%3)*280, y=20+Math.floor(r/3)*130; K.rr(ctx,x,y,265,115,10,'#0f1626',C.line); K.t(ctx,['us-east','us-west','eu-west','eu-central','ap-south','ap-northeast'][r],x+10,y+14,{s:11,b:1,c:C.muted}); }
    nodes.forEach(n=>{ const x=30+(n.r%3)*280+(n.i%10)*25, y=40+Math.floor(n.r/3)*130+Math.floor(n.i/10)*21; const col= n.st==='crash'?C.bad: n.st==='lkg'?C.warn: n.ver===2?C.cyan:C.good; K.rr(ctx,x,y,20,16,3,col); });
    const crashed=nodes.filter(n=>n.st==='crash').length;
    K.t(ctx,'state: '+state+'    servers down: '+crashed+'/240  ('+K.pct(crashed/240)+' of capacity)',20,285,{b:1,c:crashed>40?C.bad:crashed?C.warn:C.good});
    ro.textContent='Green = old config, cyan = new config healthy, red = crashed, amber = rejected new config, serving last-known-good.\nReal incidents: Cloudflare 2 Jul 2019 (WAF regex with catastrophic backtracking pushed globally → CPU exhaustion), CrowdStrike 19 Jul 2024 (channel file 291 content update → Windows kernel crashes on ~8.5M hosts). Lessons: treat config/content as code (validation, fuzzing, canary, staged rollout), fail static (keep LKG) instead of crashing, a global kill switch, and decouple config consumers from a single global push.';
  });
});

defSim('flakyCI','Flaky tests at scale','If each of N tests flakes independently with probability p, a run is green with probability (1−p)^N. Retries hide flakes — and real bugs.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,260); let grid=[], acc=0, runs=0, greens=0;
  const v=K.ctrls(root,[{k:'n',label:'Tests',min:100,max:20000,step:100,v:5000,on:rs},{k:'p',label:'Flake rate per test (%)',min:0,max:0.5,step:0.01,v:0.05,on:rs},{k:'r',label:'Auto-retries per failed test',min:0,max:3,v:0,on:rs}]);
  const ro=K.readout(root);
  function rs(){ runs=0; greens=0; grid=[]; }
  K.loop(cv,(dt)=>{ acc+=dt; if(acc>0.3){ acc=0; runs++; const pfail=Math.pow(v.p/100,v.r+1); const pg=Math.pow(1-pfail,v.n); const g=Math.random()<pg; if(g) greens++; grid.push(g); if(grid.length>200) grid.shift(); }
    K.clear(ctx,W,H); grid.forEach((g,i)=>{ K.rr(ctx,20+(i%40)*20.5,20+Math.floor(i/40)*22,17,18,3,g?C.good:C.bad); });
    const pfail=Math.pow(v.p/100,v.r+1); const pg=Math.pow(1-pfail,v.n);
    K.t(ctx,'P(green build) = (1 − p^(r+1))^N = '+K.pct(pg),20,150,{b:1,s:14,c:pg>0.9?C.good:pg>0.5?C.warn:C.bad});
    K.t(ctx,'observed: '+greens+'/'+runs+' green',20,176,{s:12,c:C.muted});
    K.t(ctx,'even 0.05% flake rate × 5000 tests → only '+K.pct(Math.pow(1-0.0005,5000))+' green without retries',20,200,{s:12,c:C.muted});
    ro.textContent='Staff-level answer: measure flakiness per test (rerun on known-good commits), quarantine with an owner + SLA, make tests hermetic (no network, fixed seeds, fake clocks, isolated tmp dirs), and run only affected tests via a build graph (Bazel-style). Retries are a tourniquet: they also mask real races — the exact concurrency bugs systems code has. For hardware-in-the-loop farms, separate infra failures (board offline) from product failures.';
  });
});
})();

</script>
<script>/* js/sims-misc.js */
/* Sims for security, observability, robotics, system design, coding */
(function(){
const {C} = SimKit;

defSim('jwtInspector','JWT anatomy & validation','header.payload.signature (base64url). Edit claims, tamper without the key, try alg:none. Uses a TOY keyed hash for illustration — real JWTs use HMAC-SHA256, RSA or ECDSA.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,250);
  const v=K.ctrls(root,[{sel:'role',label:'role claim',v:'viewer',opts:[['viewer','viewer'],['admin','admin']]},{k:'exp',label:'exp (min from now)',min:-30,max:60,v:15},{sel:'aud',label:'aud',v:'camera-api',opts:[['camera-api','camera-api'],['billing-api','billing-api']]},{chk:'tamper',label:'attacker changes role → admin WITHOUT key',v:false},{chk:'none',label:'attacker sets alg: "none"',v:false},{chk:'allow',label:'server pins alg allowlist [ES256]',v:true}]);
  const ro=K.readout(root);
  const b64=s=>btoa(s).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
  function toy(s,key){ let h=2166136261^key.length; for(const ch of key+s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return h.toString(16).padStart(8,'0').repeat(4); }
  K.loop(cv,()=>{ const alg=v.none?'none':'ES256'; const header=JSON.stringify({alg,typ:'JWT',kid:'k1'}); const now=1790000000;
    const claims={sub:'device-7f3a',iss:'https://idp.example.com',aud:v.aud,role:v.role,exp:now+v.exp*60,iat:now};
    const signedClaims=JSON.stringify(claims); const sig=v.none?'':toy(b64(header)+'.'+b64(signedClaims),'server-key');
    const sentClaims=v.tamper?JSON.stringify(Object.assign({},claims,{role:'admin'})):signedClaims;
    const token=b64(header)+'.'+b64(sentClaims)+'.'+sig;
    K.clear(ctx,W,H); const parts=token.split('.'); const cols=[C.pink,C.accent,C.cyan]; let x=20,y=24;
    parts.forEach((p,i)=>{ const s=(i?'.':'')+p; for(let k=0;k<s.length;k+=96){ K.t(ctx,s.slice(k,k+96),x,y,{m:1,s:11,c:cols[i]}); y+=16; } });
    K.t(ctx,'header: '+header,20,y+14,{m:1,s:11,c:C.pink}); K.t(ctx,'payload: '+sentClaims.slice(0,110),20,y+32,{m:1,s:11,c:C.accent});
    const checks=[]; const expected=toy(parts[0]+'.'+parts[1],'server-key');
    if(alg==='none') checks.push([!v.allow?'⚠ alg none ACCEPTED (library misconfig) — anyone can forge':'alg "none" rejected by allowlist', !v.allow?0:1, true]);
    else checks.push(['signature '+(expected===parts[2]?'valid':'INVALID (payload changed after signing)'), expected===parts[2]?1:0]);
    checks.push(['exp '+(v.exp>0?'in future':'EXPIRED'), v.exp>0?1:0]);
    checks.push(['aud '+(v.aud==='camera-api'?'matches this API':'WRONG audience (token for another service)'), v.aud==='camera-api'?1:0]);
    checks.push(['iss trusted & kid found in JWKS',1]);
    checks.forEach((c,i)=>K.t(ctx,(c[1]?'✓ ':'✗ ')+c[0],20,y+64+i*20,{s:12,b:1,c:c[1]?C.good:C.bad}));
    const ok=checks.every(c=>c[1]) && !(alg==='none'&&!v.allow?false:false);
    const accepted = alg==='none' ? !v.allow : checks.every(c=>c[1]);
    ro.textContent=(accepted?'Server ACCEPTS token → authZ then checks role="'+(v.tamper?'admin':v.role)+'" against the policy.':'Server REJECTS with 401.')+'\nJWTs are signed, not encrypted: anyone can read the payload. Statelessness means revocation is hard → short exp + refresh tokens, or introspection for high-risk ops. Validate alg (allowlist), signature, exp/nbf (allow small clock skew), iss, aud. Authentication proves who; authorization (RBAC/ABAC/ReBAC) decides what.';
  });
});

defSim('oauthFlow','OAuth 2.0 Authorization Code + PKCE (with OIDC)','Step through the redirect dance. Then let an attacker steal the authorization code and see what PKCE does.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,340); let step=0, auto=true, acc=0;
  const v=K.ctrls(root,[{chk:'pkce',label:'PKCE enabled',v:true,on:()=>step=0},{chk:'steal',label:'malicious app intercepts the code',v:false,on:()=>step=0},{btn:'Step',on:()=>{auto=false;step++;}},{btn:'Auto',on:()=>{auto=true;}}]);
  const ro=K.readout(root); const lanes=['User / Browser','Client app','Authorization server (IdP)','Resource API'];
  function msgs(){ const m=[[1,1,'generate code_verifier (random 43-128 chars); code_challenge = BASE64URL(SHA256(verifier))'],[1,0,'302 → /authorize?response_type=code&client_id&redirect_uri&scope=openid camera:read&state&'+(v.pkce?'code_challenge&method=S256':'(no challenge)')],[0,2,'GET /authorize … user logs in (+MFA) and consents'],[2,0,'302 → redirect_uri?code=abc&state=xyz']];
    if(v.steal){ m.push([0,-1,'⚠ attacker app registered same custom URI scheme grabs code=abc']); m.push([-1,2,'POST /token code=abc '+(v.pkce?'(attacker lacks code_verifier)':'') ]); m.push([2,-1, v.pkce?'400 invalid_grant: SHA256(verifier) ≠ challenge':'200 tokens issued TO THE ATTACKER ✗']); return m; }
    m.push([0,1,'browser delivers code; client checks state (CSRF)']); m.push([1,2,'POST /token grant_type=authorization_code&code=abc'+(v.pkce?'&code_verifier=…':'')]); m.push([2,1,'200 { access_token, id_token (OIDC, JWT), refresh_token, expires_in }']); m.push([1,1,'validate id_token: sig, iss, aud=client_id, nonce, exp → user is authenticated']); m.push([1,3,'GET /cameras  Authorization: Bearer access_token']); m.push([3,3,'validate token (JWKS sig or introspection), scopes → 200']); return m; }
  K.loop(cv,(dt)=>{ const m=msgs(); if(auto){ acc+=dt; if(acc>1.6){ acc=0; step=(step+1)%(m.length+2); } } const shown=Math.min(step,m.length);
    K.clear(ctx,W,H); const lx=i=>i===-1?800:90+i*210; lanes.forEach((l,i)=>{ K.rr(ctx,lx(i)-80,8,160,26,6,'#1e1b4b',C.accent); K.t(ctx,l,lx(i),21,{a:'center',s:11,b:1}); K.line(ctx,lx(i),34,lx(i),330,C.line,1,[3,4]); });
    if(v.steal){ K.rr(ctx,730,8,140,26,6,'#4c0519',C.bad); K.t(ctx,'Attacker',800,21,{a:'center',s:11,b:1}); K.line(ctx,800,34,800,330,C.bad,1,[3,4]); }
    for(let i=0;i<shown;i++){ const [a,b,txt]=m[i]; const y=50+i*27; const bad=txt.startsWith('⚠')||txt.includes('ATTACKER')||a===-1||b===-1; const good=txt.includes('invalid_grant');
      if(a===b){ K.rr(ctx,lx(a)-6,y-8,12,16,3,C.warn); K.t(ctx,txt,lx(a)+12,y,{s:10.5,c:C.muted}); }
      else { K.arrow(ctx,lx(a),y,lx(b),y,good?C.good:bad?C.bad:C.cyan,1.8); K.t(ctx,txt.slice(0,95),Math.min(lx(a),lx(b))+6,y-8,{s:10,c:good?C.good:bad?'#fecaca':C.text}); } }
    ro.textContent=v.steal?(v.pkce?'PKCE binds the code to the client instance that started the flow: only the holder of code_verifier can redeem it. Public clients (mobile, SPA, CLI, devices) MUST use it; OAuth 2.1 requires it for all.':'Without PKCE a public client has no secret, so a stolen code is as good as a token.'):'OAuth = delegated AUTHORIZATION (access_token for an API). OIDC adds AUTHENTICATION (id_token about the user). Never use the access token as proof of identity in the client; never put tokens in URLs (implicit flow is deprecated). Devices without browsers use the Device Authorization Grant (RFC 8628).';
  });
});

defSim('mtlsHandshake','TLS 1.3 with mutual auth (mTLS)','One round trip to keys. With mTLS the server sends CertificateRequest and the client proves possession of its private key. Typical for service-to-service zero trust (SPIFFE IDs in the cert SAN).',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,320); let step=0, acc=0;
  const v=K.ctrls(root,[{chk:'m',label:'mutual TLS',v:true,on:()=>step=0},{sel:'cc',label:'client cert',v:'ok',opts:[['ok','valid, issued by mesh CA'],['exp','expired'],['ca','signed by unknown CA']],on:()=>step=0}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ acc+=dt; if(acc>1.1){ acc=0; step++; }
    const m=[[0,'ClientHello: TLS1.3, cipher suites, key_share (X25519 pub), SNI, ALPN h2']];
    m.push([1,'ServerHello: key_share  → both derive handshake keys (ECDHE)']); m.push([1,'{EncryptedExtensions}']); if(v.m) m.push([1,'{CertificateRequest}']); m.push([1,'{Certificate: spiffe://prod/ns/video/sa/encoder}']); m.push([1,'{CertificateVerify: sig over transcript}']); m.push([1,'{Finished: HMAC over transcript}']);
    if(v.m){ m.push([0,'{Certificate: spiffe://prod/ns/web/sa/frontend}']); if(v.cc!=='ok'){ m.push([1,'alert: '+(v.cc==='exp'?'certificate_expired':'unknown_ca')+' → connection closed']); } else { m.push([0,'{CertificateVerify}']); m.push([0,'{Finished}']); m.push([0,'[application data] — authZ: is frontend allowed to call encoder?']); } }
    else { m.push([0,'{Finished}']); m.push([0,'[application data] — server knows nothing about client identity']); }
    if(step>m.length+3) step=0;
    K.clear(ctx,W,H); K.rr(ctx,20,10,150,30,8,'#1e1b4b',C.accent); K.t(ctx,'client (frontend)',95,25,{a:'center',b:1,s:12}); K.rr(ctx,690,10,150,30,8,'#1e1b4b',C.accent); K.t(ctx,'server (encoder)',765,25,{a:'center',b:1,s:12});
    K.line(ctx,95,40,95,315,C.line,1,[3,3]); K.line(ctx,765,40,765,315,C.line,1,[3,3]);
    m.slice(0,step).forEach((x,i)=>{ const y=56+i*22; const bad=x[1].startsWith('alert'); const enc=x[1].startsWith('{')||x[1].startsWith('['); const a=x[0]?765:95, b=x[0]?95:765; K.arrow(ctx,a,y,b,y,bad?C.bad:enc?C.good:C.warn,1.6); K.t(ctx,x[1],430,y-7,{a:'center',s:10.5,c:bad?C.bad:C.text}); });
    ro.textContent='{braces} = encrypted with handshake keys. TLS 1.3: 1-RTT full handshake, 0-RTT resumption (replayable — only for idempotent requests), forward secrecy always (ephemeral ECDHE), no RSA key transport. Zero trust = authenticate & authorize every request based on workload identity + device posture, not network location. Operational pain is cert issuance/rotation: short-lived certs (hours) from an automated CA (SPIRE, Istio, cert-manager).';
  });
});

defSim('sensorPipeline','Endpoint sensor event pipeline','Kernel hooks emit events (exec, file, network) into a ring buffer; a user-space agent consumes, enriches and ships them. Tune rates and in-kernel filtering; watch drops and overhead.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let rb=0, drops=0, sent=0, acc=0, pk=[];
  const v=K.ctrls(root,[{k:'rate',label:'Raw events/s (k)',min:5,max:400,step:5,v:120},{k:'filt',label:'In-kernel filter drop %',min:0,max:95,step:5,v:60},{k:'cons',label:'Agent consume (k/s)',min:10,max:200,step:5,v:60},{k:'size',label:'Ring buffer (k events)',min:8,max:256,step:8,v:64},{btn:'Reset',on:()=>{rb=0;drops=0;sent=0;}}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ const inflow=v.rate*(1-v.filt/100)*dt; const out=Math.min(rb+inflow, v.cons*dt); rb=rb+inflow-out; if(rb>v.size){ drops+=rb-v.size; rb=v.size; } sent+=out;
    acc+=dt*12; if(acc>1){ acc=0; pk.push({x:0,k:K.ri(0,2),f:Math.random()<v.filt/100}); } pk.forEach(p=>p.x+=dt*0.5); pk=pk.filter(p=>p.x<1&&!(p.f&&p.x>0.32));

defSim('tailLatency','Fan-out amplifies tail latency','A request fans out to N leaf servers and waits for all. Each leaf is slow 1% of the time. Hedged requests send a backup after p95.',function(root,K){

  const ro=K.readout(root);
  function leaf(){ return Math.random()<v.p/100? K.rnd(200,1000) : K.rnd(5,15); }
  K.loop(cv,(dt)=>{ acc+=dt*60; while(acc>1){ acc--; let mx=0; for(let i=0;i<v.n;i++){ let l=leaf(); if(v.hedge && l>15){ l=Math.min(l,15+leaf()); } mx=Math.max(mx,l); } samples.push(mx); if(samples.length>1500) samples.shift(); }
    K.clear(ctx,W,H); const bins=new Array(50).fill(0); samples.forEach(s=>bins[Math.min(49,Math.floor(s/20))]++); const mb=Math.max(...bins,1);

    for(let i=0;i<=5;i++) K.t(ctx,(i*200)+' ms',30+i*160,215,{s:10,c:C.dim});
    const s=samples.slice().sort((a,b)=>a-b); const q=p=>s[Math.floor(s.length*p)]||0; const theory=1-Math.pow(1-v.p/100,v.n);

});

defSim('amdahl','Amdahl vs Gustafson: speedup limits','Speedup = 1 / ((1−p) + p/N). Even 5% serial code caps speedup at 20×.',function(root,K){

  const v=K.ctrls(root,[{k:'p',label:'Parallel fraction %',min:50,max:99.9,step:0.1,v:95},{k:'n',label:'Cores',min:1,max:256,v:64},{chk:'g',label:'show Gustafson (scaled problem)',v:false}]);
  const ro=K.readout(root);
  K.loop(cv,()=>{ const p=v.p/100; K.clear(ctx,W,H); const x0=50,y0=210,w=780,h=180; const maxS=Math.max(20,v.g?256:1/(1-p)+2);
    K.line(ctx,x0,y0,x0+w,y0,C.dim); K.line(ctx,x0,y0,x0,y0-h,C.dim);
    ctx.beginPath(); for(let n=1;n<=256;n++){ const s=1/((1-p)+p/n); const x=x0+n/256*w, y=y0-s/maxS*h; n===1?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.strokeStyle=C.cyan; ctx.lineWidth=2.5; ctx.stroke();
    if(v.g){ ctx.beginPath(); for(let n=1;n<=256;n++){ const s=(1-p)+p*n; const x=x0+n/256*w, y=y0-Math.min(maxS,s)/maxS*h; n===1?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.strokeStyle=C.pink; ctx.stroke(); }
    const s=1/((1-p)+p/v.n); const X=x0+v.n/256*w, Y=y0-s/maxS*h; ctx.beginPath(); ctx.arc(X,Y,6,0,7); ctx.fillStyle=C.warn; ctx.fill();
    K.t(ctx,'speedup on '+v.n+' cores: '+s.toFixed(1)+'×   (limit '+(1/(1-p)).toFixed(0)+'×)   efficiency '+K.pct(s/v.n),60,24,{b:1});
    ro.textContent='Amdahl (fixed problem) explains why the serial driver/launch path, a global lock, or a single-threaded scheduler eventually dominates. Gustafson (pink): grow the problem with the machine and parallel work dominates — the reason big batches and big clusters still pay off. Real systems are worse than Amdahl: contention and coherence traffic add a term that grows with N (Universal Scalability Law).';
  });
});

defSim('pid','PID tuner: robot joint position control','A joint (inertia + friction) driven by a torque-limited motor. Tune Kp, Ki, Kd; add sensor noise and saturation. Watch overshoot, settling, steady-state error.',function(root,K){

      let u=v.kp*err+v.ki*integ+v.kd*dFilt; let us=v.sat?K.clamp(u,-8,8):u; if(!(v.aw && us!==u)) integ+=err*h;
      const acc=(us-1.2*vel-v.load*Math.sin(x))/1.0; vel+=acc*h; x+=vel*h; }
    hist.push({x,sp}); if(hist.length>420) hist.shift();

    ctx.beginPath(); hist.forEach((p,i)=>{ const X=20+i*600/420, Y=y0-p.x*sc; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.strokeStyle=C.cyan; ctx.lineWidth=2; ctx.stroke();

    ro.textContent=`overshoot ≈ ${K.pct(os)}   steady-state error ≈ ${(sp-x).toFixed(3)} rad\nKp: stiffness (faster, more overshoot). Ki: removes steady-state error from gravity/friction but winds up during saturation → huge overshoot (toggle anti-windup off with the torque limit on!). Kd: damping, but amplifies sensor noise → filter the derivative and differentiate the measurement, not the error. Real robot joints: cascaded loops (current 10-40 kHz → velocity → position 1 kHz) + feedforward (gravity comp, inertia) so PID only corrects residuals.`;

defSim('arm2link','2-link arm: forward & inverse kinematics','Click inside the workspace to set a target. IK solves elbow-up/elbow-down analytically; near full extension the Jacobian becomes singular.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,320); let tgt={x:140,y:-60}, th=[0.3,0.8], cur=[0.3,0.8];
  const v=K.ctrls(root,[{k:'l1',label:'L1',min:60,max:160,v:120},{k:'l2',label:'L2',min:40,max:140,v:90},{sel:'el',label:'Solution',v:'up',opts:[['up','elbow up'],['down','elbow down']]}]);

  K.loop(cv,(dt)=>{ const l1=v.l1,l2=v.l2; const d=Math.hypot(tgt.x,tgt.y); const reach=d<=l1+l2 && d>=Math.abs(l1-l2); let msg='';
    if(reach){ const c2=(tgt.x*tgt.x+tgt.y*tgt.y-l1*l1-l2*l2)/(2*l1*l2); const s2=(v.el==='up'?1:-1)*Math.sqrt(Math.max(0,1-c2*c2)); const t2=Math.atan2(s2,c2); const t1=Math.atan2(tgt.y,tgt.x)-Math.atan2(l2*s2,l1+l2*c2); th=[t1,t2]; } else msg='target unreachable → clamp to boundary or reject';
    cur=cur.map((c,i)=>c+(th[i]-c)*Math.min(1,dt*5));
    K.clear(ctx,W,H); ctx.beginPath(); ctx.arc(O.x,O.y,l1+l2,0,7); ctx.fillStyle='rgba(124,92,255,.07)'; ctx.fill(); ctx.beginPath(); ctx.arc(O.x,O.y,Math.abs(l1-l2),0,7); ctx.fillStyle=C.bg; ctx.fill(); ctx.strokeStyle=C.grid; ctx.beginPath(); ctx.arc(O.x,O.y,l1+l2,0,7); ctx.stroke();
    const j1={x:O.x+l1*Math.cos(cur[0]),y:O.y-l1*Math.sin(cur[0])}; const ee={x:j1.x+l2*Math.cos(cur[0]+cur[1]),y:j1.y-l2*Math.sin(cur[0]+cur[1])};
    K.line(ctx,O.x,O.y,j1.x,j1.y,C.cyan,10); K.line(ctx,j1.x,j1.y,ee.x,ee.y,C.accent,8); [O,j1].forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fillStyle=C.warn;ctx.fill();});
    ctx.beginPath(); ctx.arc(O.x+tgt.x,O.y-tgt.y,7,0,7); ctx.strokeStyle=reach?C.good:C.bad; ctx.lineWidth=2; ctx.stroke();

    K.t(ctx,'det(J) = L1·L2·sinθ2 = '+det.toFixed(0),560,120,{s:12,c:Math.abs(det)<1500?C.bad:C.good}); if(Math.abs(det)<1500) K.t(ctx,'near singularity: tiny ee motion needs huge joint speed',560,140,{s:11,c:C.bad}); if(msg) K.t(ctx,msg,560,165,{s:11,c:C.bad});
    ro.textContent='Humanoid arms have 7 DoF (redundant): IK becomes an optimization (damped least squares / QP with joint limits, collision, and secondary objectives in the null space). Real controllers run IK/whole-body control at 100s of Hz, joint servo loops at kHz — the timing and determinism side is where embedded engineers add value.';
  });

defSim('backpressure','Queues, Little’s law & backpressure','Producer at λ, consumer at μ. Unbounded queues turn overload into unbounded latency and memory. Bounded queues force a decision: block (backpressure) or shed.',function(root,K){

  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ const inflow=v.lam*dt*(0.7+Math.random()*0.6); let acc_=inflow; prodEff=v.lam;
    if(v.pol!=='unb'){ const room=50-q; if(acc_>room){ if(v.pol==='block'){ blocked+=acc_-room; prodEff=v.mu; } else dropped+=acc_-room; acc_=room; } }
    q=Math.max(0,q+acc_-v.mu*dt*(0.7+Math.random()*0.6)); hist.push(q); if(hist.length>400) hist.shift();
    K.clear(ctx,W,H); const mq=Math.max(60,...hist); ctx.beginPath(); hist.forEach((h,i)=>{ const x=20+i*2, y=200-h/mq*170; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.strokeStyle=C.cyan; ctx.lineWidth=2; ctx.stroke();
    if(v.pol!=='unb') K.line(ctx,20,200-50/mq*170,820,200-50/mq*170,C.bad,1,[5,5]);
    const W_=q/Math.max(1,Math.min(v.lam,v.mu)); const rho=v.lam/v.mu;
    K.t(ctx,'queue length L = '+q.toFixed(0)+'    wait W = L/λ ≈ '+(W_*1000).toFixed(0)+' ms    utilization ρ = λ/μ = '+rho.toFixed(2),20,225,{b:1,c:rho>=1?C.bad:C.good});
    ro.textContent=`dropped ${dropped.toFixed(0)}  ·  producer blocked (work pushed upstream) ${blocked.toFixed(0)}\nLittle's law L = λW holds for any stable queue. M/M/1: W = 1/(μ−λ) → latency explodes as ρ→1, so run critical paths at ≤70-80%. Backpressure must propagate to the source (TCP windows, gRPC flow control, Reactive Streams demand, bounded channels); shedding should be explicit (429/503 with Retry-After). Conferencing video prefers drop-oldest: a fresh frame beats a complete but stale one.`;

defSim('cacheAside','Cache-aside: TTLs, hit rate & thundering herd','Zipf-distributed keys hit a cache in front of a DB. When a hot key expires, many concurrent misses stampede the DB unless requests are coalesced.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,260); let cache={}, hist=[], hits=0, miss=0, t=0;
  const v=K.ctrls(root,[{k:'ttl',label:'TTL (s)',min:1,max:20,v:5},{k:'size',label:'Cache capacity (keys)',min:10,max:500,step:10,v:100},{chk:'sf',label:'single-flight / request coalescing',v:false},{chk:'jit',label:'TTL jitter ±20%',v:false}]);
  const ro=K.readout(root);
  function zipf(){ return Math.floor(Math.pow(Math.random(),3)*2000); }
  K.loop(cv,(dt)=>{ t+=dt; let db=0; const reqs=Math.round(3000*dt); const inflight={};
    for(let i=0;i<reqs;i++){ const k=zipf(); const e=cache[k]; if(e && e.exp>t){ hits++; e.last=t; } else { miss++; if(v.sf){ if(!inflight[k]){ inflight[k]=1; db++; } } else db++; const ttl=v.ttl*(v.jit?K.rnd(0.8,1.2):1); cache[k]={exp:t+ttl,last:t}; } }
    const keys=Object.keys(cache); if(keys.length>v.size){ keys.sort((a,b)=>cache[a].last-cache[b].last).slice(0,keys.length-v.size).forEach(k=>delete cache[k]); }
    hist.push(db/dt); if(hist.length>400) hist.shift();
    K.clear(ctx,W,H); const mx=Math.max(500,...hist); ctx.beginPath(); hist.forEach((h,i)=>{ const x=20+i*2, y=200-h/mx*170; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.strokeStyle=C.warn; ctx.lineWidth=1.5; ctx.stroke();
    K.t(ctx,'DB queries/s (spikes = synchronized expiry / stampede)',20,16,{s:11,c:C.warn}); K.t(ctx,'hit rate '+K.pct(hits/Math.max(1,hits+miss)),20,225,{b:1,s:14,c:C.good});
    ro.textContent='Cache-aside: read → miss → load from DB → populate. Problems: stampede on hot-key expiry (fix: single-flight, probabilistic early refresh, stale-while-revalidate), synchronized expiry (fix: TTL jitter), invalidation races (delete-after-write can resurrect stale data; use versioning/leases as in Facebook’s memcache paper), and cold-start after cache restart (warmup, gradual traffic).';
  });
});
