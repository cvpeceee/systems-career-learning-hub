<script>/* js/content/m10-sec.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'sec',num:10,icon:'🛡️',short:'Security & identity',title:'Security & Identity Systems',tier:'adjacent',
summary:'Tokens and JWTs, OAuth 2.0/OIDC flows, mTLS and workload identity (zero trust), and endpoint sensors with kernel hooks.',
why:'CrowdStrike (Continuous Identity, Sensor), OpenAI Identity Infrastructure, Palo Alto, Microsoft and Cisco need security-minded systems engineers. Kernel hooks for sensors reuse your driver skills; identity infra is distributed systems with sharp edges.',
lessons:[
{id:'tokens',title:'Tokens, sessions and JWTs',minutes:25,skills:['identity','secure-coding'],sims:['jwtInspector'],
analogy:R`A JWT is a <b>festival wristband</b>: anyone can read what’s printed on it (claims are just base64), but the hologram (signature) proves the box office issued it. Once you’re wearing it, security can’t easily take it back until it expires — so wristbands should expire quickly.`,
body:R`<h3>Session cookies vs bearer tokens</h3><p>Server-side sessions: random ID cookie → session store lookup (easy revocation, needs shared store). Self-contained tokens (JWT, RFC 7519): claims + signature, verified locally by any service (no lookup) → scale and decoupling, but <b>revocation is hard</b> — mitigate with short lifetimes (5–15 min access tokens), refresh tokens (rotated, server-tracked), and deny-lists for emergencies.</p>
<h3>JWT anatomy (sim)</h3><p><code>base64url(header).base64url(payload).base64url(signature)</code>. Header: <code>alg</code> (RS256/ES256/EdDSA asymmetric; HS256 shared secret), <code>kid</code> (key ID for rotation via JWKS endpoint). Registered claims: <code>iss</code>, <code>sub</code>, <code>aud</code>, <code>exp</code>, <code>nbf</code>, <code>iat</code>, <code>jti</code>. Payload is NOT encrypted (use JWE if needed).</p>
<h3>Validation checklist (where real bugs live)</h3><ol><li>Pin allowed algorithms server-side; reject <code>alg: none</code>; prevent RS→HS confusion (attacker signs with the public key as HMAC secret).</li><li>Verify signature with key from trusted JWKS by <code>kid</code> (cache with rotation; don’t fetch arbitrary <code>jku</code> URLs).</li><li>Check <code>exp</code>/<code>nbf</code> with small clock skew allowance, <code>iss</code> and <code>aud</code> (a token for service A must not work at B).</li><li>Constant-time comparisons; size limits; never log full tokens.</li></ol>
<h3>Token binding and sender constraints</h3><p>Bearer tokens can be replayed if stolen. Sender-constrained tokens: mTLS-bound (RFC 8705) or DPoP (RFC 9449; client proves possession of a key per request). Continuous identity (CrowdStrike role) goes further: evaluate risk signals continuously (device posture, behaviour, location) and revoke/step-up mid-session.</p>
<h3>Key management</h3><p>Private keys in HSM/KMS; rotation with overlapping validity (publish new key in JWKS before signing with it); short-lived certificates; audit logs.</p>`,
poly:R`Devices authenticate to cloud services with device certificates/tokens provisioned at manufacturing; you may have dealt with secure element provisioning, token refresh on flaky networks, and clock issues on devices without RTC (exp checks fail!). That last one is a great real-world gotcha to mention.`,
quiz:[
{q:'Is a JWT payload confidential?',opts:['Yes, it’s encrypted','No — base64url-encoded, readable by anyone; signature only provides integrity','Only with HS256','Only over TLS'],a:1,exp:'Use JWE for confidentiality.'},
{q:'Server accepts tokens with header alg "none". Impact?',opts:['None','Attackers can forge arbitrary unsigned tokens','Slower','Only expired tokens accepted'],a:1,exp:'Pin algorithms server-side.'},
{q:'A device with no RTC boots with clock = 1970 and rejects all tokens. Why?',opts:['Bad signature','nbf/iat checks fail (token "not yet valid") or TLS cert validity fails','Wrong aud','Network'],a:1,exp:'Get secure time (NTP/roughtime) before validation, or allow server-side checks.'},
{q:'Main downside of long-lived self-contained access tokens?',opts:['Size','Hard to revoke if stolen','Slow verification','Need DB'],a:1,exp:'Use short-lived access + rotated refresh tokens.'}],
challenge:{prompt:R`<p>Implement a JWT verifier in Python (using the <code>cryptography</code> library for RS256/ES256, not a JWT library): parse, base64url-decode, verify signature with a JWKS keyed by kid, enforce allowed algs, exp/nbf with 60 s skew, iss and aud. Write negative tests: alg none, HS256 with public key, expired, wrong aud, unknown kid, tampered payload.</p>`,
hints:['base64url padding: add "=" * (-len(s) % 4).','Signing input is the ASCII bytes of "header.payload".','ES256 signatures in JWT are raw r||s (64 bytes), not DER — convert before verifying.'],
solution:R`def verify(token, jwks, iss, aud, now, algs=("RS256","ES256")):
    h64, p64, s64 = token.split(".")
    hdr = json.loads(b64d(h64)); claims = json.loads(b64d(p64))
    if hdr.get("alg") not in algs: raise Invalid("alg")
    key = jwks.get(hdr.get("kid")) or raise_(Invalid("kid"))
    msg, sig = f"{h64}.{p64}".encode(), b64d(s64)
    if hdr["alg"] == "RS256": key.verify(sig, msg, padding.PKCS1v15(), hashes.SHA256())
    else: key.verify(encode_dss_signature(int.from_bytes(sig[:32], "big"), int.from_bytes(sig[32:], "big")), msg, ec.ECDSA(hashes.SHA256()))
    if claims["iss"] != iss or aud not in (claims["aud"] if isinstance(claims["aud"], list) else [claims["aud"]]): raise Invalid("iss/aud")
    if not (claims.get("nbf", 0) - 60 <= now < claims["exp"] + 60): raise Invalid("time")
    return claims`},
interview:[{q:'"How would you design token revocation for a large system using JWTs?"',a:'Short access token TTL (minutes) so revocation is bounded; refresh tokens stored server-side and revocable (rotation with reuse detection); emergency deny-list keyed by jti/sub distributed to verifiers (bloom filter + pub/sub, small because TTL is short); session/risk events trigger revocation (continuous access evaluation); sender-constrained tokens to reduce theft value. Trade-off latency vs revocation speed explicitly.'}],
resources:[['RFC 7519: JSON Web Token','https://www.rfc-editor.org/rfc/rfc7519'],['RFC 8725: JWT Best Current Practices','https://www.rfc-editor.org/rfc/rfc8725'],['OWASP JWT Cheat Sheet','https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html']]},
{id:'oauth',title:'OAuth 2.0 and OpenID Connect flows',minutes:30,skills:['identity','zerotrust'],sims:['oauthFlow'],
analogy:R`OAuth is a <b>valet key</b>: you give the parking attendant a key that only starts the car and opens the driver door, not the trunk — without handing over your house keys (password). OIDC adds a <b>name tag</b> (ID token) so the app also knows who you are.`,
body:R`<h3>Roles</h3><p>Resource owner (user), client (app), authorization server (AS/IdP), resource server (API). OAuth is <b>delegated authorization</b>; OIDC layers <b>authentication</b> on top (ID token JWT, userinfo, discovery, standard scopes <code>openid profile email</code>).</p>
<h3>Authorization Code + PKCE (sim)</h3><ol><li>Client generates <code>code_verifier</code> (random) and <code>code_challenge = BASE64URL(SHA256(verifier))</code>, plus <code>state</code> (CSRF) and <code>nonce</code> (ID token replay).</li><li>Redirect user to AS <code>/authorize?response_type=code&amp;client_id&amp;redirect_uri&amp;scope&amp;state&amp;code_challenge&amp;code_challenge_method=S256</code>.</li><li>User authenticates (MFA) and consents; AS redirects back with <code>code</code> and <code>state</code>.</li><li>Client POSTs to <code>/token</code> with code + code_verifier (+ client auth for confidential clients). AS verifies hash matches challenge → issues access token, refresh token, ID token.</li><li>Client calls API with <code>Authorization: Bearer</code>; API validates token (JWT locally or introspection).</li></ol><p>PKCE defeats authorization-code interception (malicious apps registering the same custom URI scheme). OAuth 2.1 / RFC 9700 (security BCP) require PKCE for all clients and deprecate the implicit and password grants.</p>
<h3>Other grants</h3><ul><li><b>Client credentials</b>: service-to-service (no user).</li><li><b>Device authorization grant</b> (RFC 8628): input-constrained devices show a code; user approves on phone — conference room devices and TVs use this!</li><li><b>Refresh token</b> with rotation; <b>token exchange</b> (RFC 8693) for delegation chains across services.</li></ul>
<h3>Common vulnerabilities</h3><p>Open redirect_uri matching (must be exact), missing state (CSRF login), token leakage via referrer/logs, mix-up attacks with multiple AS (use <code>iss</code> in response), over-broad scopes, storing tokens in localStorage (XSS exfiltration) — prefer BFF pattern with httpOnly cookies for browser apps.</p>
<h3>Identity infrastructure at scale (OpenAI/CrowdStrike roles)</h3><p>Hundreds of millions of users: AS availability is critical (everything depends on login) → multi-region active-active, signing keys in HSM with regional replicas, token validation offline at edges, rate limiting/bot defense on login, session stores with consistent hashing, audit pipelines, and abuse/fraud signals feeding risk-based authentication.</p>`,
poly:R`Microsoft Teams Rooms and Zoom Rooms devices sign in using the OAuth device authorization grant — you may have implemented or debugged that flow on Poly devices. It’s a perfect bridge example for identity interviews.`,
quiz:[
{q:'What attack does PKCE prevent?',opts:['XSS','Authorization code interception/injection by a malicious app','SQL injection','DDoS'],a:1,exp:'Only the party holding the code_verifier can redeem the code.'},
{q:'Purpose of the state parameter?',opts:['Store tokens','CSRF protection binding the callback to the user’s session','Encrypt the code','Pick the scope'],a:1,exp:'Prevents attacker-initiated login callbacks.'},
{q:'A conference-room device with no keyboard should use…',opts:['Password grant','Device authorization grant (user approves on another device)','Implicit grant','Client credentials as the user'],a:1,exp:'RFC 8628 device flow.'},
{q:'OIDC adds to OAuth…',opts:['Encryption','Authentication: an ID token with user identity, plus discovery/userinfo','Rate limiting','Refresh tokens'],a:1,exp:'OAuth alone is about authorization.'}],
challenge:{prompt:R`<p>Run Keycloak (Docker) locally. Build a minimal Python/Flask (or Go) web app implementing Authorization Code + PKCE + OIDC login manually (no OAuth library): generate verifier/challenge, state, nonce; handle callback; exchange code; validate ID token (signature via JWKS, iss, aud, nonce, exp). Then implement the device authorization grant for a CLI.</p>`,
hints:['Keycloak discovery: <code>/realms/myrealm/.well-known/openid-configuration</code>.','Store verifier, state, nonce in the server-side session before redirect.','Device flow: POST /device → show user_code; poll /token with grant_type=urn:ietf:params:oauth:grant-type:device_code respecting interval.'],
solution:R`verifier = base64url(os.urandom(32)); challenge = base64url(sha256(verifier.encode()).digest())
session.update(verifier=verifier, state=rand(), nonce=rand())
redirect(f"{AUTHZ}?response_type=code&client_id={CID}&redirect_uri={CB}&scope=openid%20profile"
         f"&state={session['state']}&nonce={session['nonce']}&code_challenge={challenge}&code_challenge_method=S256")
# callback: check state; POST token endpoint with code, redirect_uri, client_id, code_verifier;
# validate id_token: sig via JWKS(kid), iss == discovery issuer, aud == CID, nonce == session nonce, exp.`},
interview:[{q:'"Design the identity/auth system for a consumer AI product with 500M users."',a:'Components: IdP (OIDC) with social + email + enterprise SSO (SAML/OIDC federation), MFA/passkeys (WebAuthn), session service, token service (short-lived JWT access tokens signed by KMS/HSM keys with JWKS rotation), API gateway validation, authorization service (RBAC/ABAC, org/workspace membership), audit logging, abuse detection and rate limits on auth endpoints. Availability: multi-region active-active with replicated user store; degrade gracefully (existing tokens keep working if IdP is down). Privacy/compliance considerations. Capacity: logins/s, token validations/s (all local).'}],
resources:[['RFC 6749: OAuth 2.0','https://www.rfc-editor.org/rfc/rfc6749'],['RFC 7636: PKCE','https://www.rfc-editor.org/rfc/rfc7636'],['RFC 9700: OAuth 2.0 Security Best Current Practice','https://www.rfc-editor.org/rfc/rfc9700'],['RFC 8628: Device Authorization Grant','https://www.rfc-editor.org/rfc/rfc8628'],['OpenID Connect Core 1.0','https://openid.net/specs/openid-connect-core-1_0.html']]},
{id:'mtls',title:'TLS 1.3, mTLS and workload identity (zero trust)',minutes:30,skills:['zerotrust','identity','tcpip'],sims:['mtlsHandshake'],
analogy:R`Zero trust is a <b>hospital where every door checks your badge</b>, not just the front entrance. mTLS is both sides showing badges: the server proves it’s the real pharmacy, and the client proves it’s an authorized nurse — every single time.`,
body:R`<h3>TLS 1.3 handshake (sim)</h3><p>1-RTT: ClientHello (supported ciphers, key share for ECDHE, SNI, ALPN) → ServerHello (chosen key share) + encrypted extensions + Certificate + CertificateVerify (signature over transcript) + Finished. Keys derive via HKDF from the ECDHE secret → <b>forward secrecy</b>. 0-RTT resumption sends early data with a PSK (replayable! only for idempotent requests). In <b>mTLS</b>, the server sends CertificateRequest and the client presents its certificate + CertificateVerify.</p>
<h3>Certificates and PKI</h3><p>X.509 chain: leaf → intermediate(s) → root in trust store. Validate: signature chain, validity period, name (SAN), key usage, revocation (OCSP stapling; CRLs; increasingly short-lived certs make revocation less critical). Private CAs for internal services; automation (ACME, cert-manager); rotation before expiry — expired certs remain one of the most common outage causes.</p>
<h3>Workload identity</h3><p><b>SPIFFE</b> defines IDs like <code>spiffe://prod.example.com/ns/payments/sa/api</code> and SVIDs (short-lived X.509 or JWT); <b>SPIRE</b> issues them after attesting the workload (K8s service account, node attestation via TPM/cloud instance identity). Service meshes (Istio, Linkerd) automate mTLS between pods with SPIFFE-compatible identities, and authorization policies are written against identities, not IPs.</p>
<h3>Zero trust architecture</h3><p>Google <b>BeyondCorp</b>: no privileged network; every request authenticated (user + device), authorized by policy using context (device posture from endpoint agents, location, risk), and encrypted. Components: identity-aware proxy, device inventory & trust tiers, policy engine, continuous evaluation. NIST SP 800-207 formalizes it. Endpoint sensors (next lesson) feed device posture.</p>
<h3>Hardware roots of trust</h3><p>TPM-based measured boot and remote attestation (quotes over PCRs), secure enclaves, and confidential computing (AMD SEV-SNP, Intel TDX, NVIDIA H100 confidential computing) extend zero trust down to the platform — connecting to Module 3’s secure boot.</p>`,
poly:R`Poly devices use certificates for 802.1X network auth, TLS to provisioning servers and SIP/TLS — you know cert provisioning and rotation pain (factory-installed certs, expiry in the field). Your secure-boot chain experience extends naturally into TPM attestation and workload identity.`,
quiz:[
{q:'What gives TLS 1.3 forward secrecy?',opts:['RSA key transport','Ephemeral (EC)DHE key exchange for every handshake','Long certificates','0-RTT'],a:1,exp:'Compromise of the server’s long-term key doesn’t reveal past session keys.'},
{q:'Why is TLS 1.3 0-RTT data dangerous for POST /transfer?',opts:['Not encrypted','Early data can be replayed by an attacker','Slower','Breaks certificates'],a:1,exp:'Only allow idempotent requests in 0-RTT.'},
{q:'In SPIFFE/SPIRE, how does a workload get its identity?',opts:['Hardcoded secrets','Agent attests the workload (e.g. K8s SA, node attestation) and issues a short-lived SVID','IP address','Manual CSR'],a:1,exp:'Attestation-based, automatically rotated.'},
{q:'Core idea of BeyondCorp/zero trust?',opts:['Stronger VPN','No implicit trust from network location; authenticate and authorize every request with user + device context','Firewall everything','Air-gap'],a:1,exp:'Access decisions based on identity and device state.'}],
challenge:{prompt:R`<p>Create a private CA with <code>openssl</code> (or <code>step-ca</code>), issue server and client certs with SAN URIs in SPIFFE format, and build a Go or Python server requiring mTLS that authorizes clients by their SPIFFE ID. Capture the handshake with Wireshark (using SSLKEYLOGFILE) and annotate each message. Then implement automatic cert rotation without dropping connections.</p>`,
hints:['<code>openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 ...</code> for the CA.','Python: <code>ssl.SSLContext.verify_mode = CERT_REQUIRED</code>, <code>load_verify_locations</code>, then read <code>getpeercert()</code> SAN URI.','Rotation: reload certificate via callback (Go tls.Config.GetCertificate) on file change.'],
solution:R`<p>Server: TLS config with ClientAuth=RequireAndVerifyClientCert, ClientCAs=private CA; middleware extracts URI SAN, checks against allow-list (spiffe://lab/ns/web/sa/frontend). Wireshark (with key log): ClientHello (key_share, SNI), ServerHello, {EncryptedExtensions, CertificateRequest, Certificate, CertificateVerify, Finished}, client {Certificate, CertificateVerify, Finished}. Rotation: GetCertificate returns the latest loaded cert; existing connections continue with old cert.</p>`},
interview:[{q:'"How would you roll out mTLS across 2,000 services without an outage?"',a:'Deploy identity issuance (SPIRE/mesh CA) first; enable permissive mode (accept plaintext and mTLS) and measure mTLS coverage; migrate service by service with telemetry; then enforce per namespace; authorization policies in audit mode before deny; automated cert rotation with alerts on expiry; break-glass procedures; handle non-mesh clients (gateways). Communicate timeline and provide paved-road libraries.'}],
resources:[['RFC 8446: TLS 1.3','https://www.rfc-editor.org/rfc/rfc8446'],['The Illustrated TLS 1.3 Connection','https://tls13.xargs.org/'],['SPIFFE overview','https://spiffe.io/docs/latest/spiffe-about/overview/'],['BeyondCorp: A New Approach to Enterprise Security','https://research.google/pubs/beyondcorp-a-new-approach-to-enterprise-security/'],['NIST SP 800-207 Zero Trust Architecture','https://csrc.nist.gov/pubs/sp/800/207/final']]},
{id:'sensor',title:'Endpoint sensors: kernel hooks, event pipelines, safe updates',minutes:35,skills:['endpoint','linux-kernel','ebpf','secure-coding','kernel-debug'],sims:['sensorPipeline'],
analogy:R`An endpoint sensor is a <b>building security system</b>: motion detectors at every door (kernel hooks) send events to a guard desk (user-space agent) that filters and correlates them, and sends summaries to headquarters (cloud). If detectors spam the desk or the desk falls asleep, the building slows down or goes unprotected — and if a faulty detector update shorts the wiring, every building goes dark at once.`,
body:R`<h3>Where sensors hook (sim)</h3><ul><li><b>Linux</b>: historically kernel modules (kprobes, LSM hooks via out-of-tree modules, syscall table hooking — fragile and now discouraged), audit subsystem, fanotify (file access), and now <b>eBPF</b>: tracepoints/kprobes/fentry for process exec/exit, file and network events, <b>BPF LSM</b> (KRSI) for enforcement (deny exec, deny file open), ring buffers for events. Benefits: verifier-enforced safety (can’t crash the kernel), CO-RE portability across kernel versions.</li><li><b>Windows</b>: kernel drivers with callbacks (PsSetCreateProcessNotifyRoutineEx, ObRegisterCallbacks, minifilter drivers for file I/O, WFP for network, ETW providers).</li><li><b>macOS</b>: kernel extensions deprecated → <b>Endpoint Security framework</b> (user-space system extension receiving AUTH and NOTIFY events with deadlines) and Network Extension.</li></ul>
<h3>Event pipeline engineering</h3><p>Volume: a busy server produces 10^4–10^5 events/s (exec, open, connect). Design: in-kernel filtering (drop noise early: known-good paths, rate limits), per-CPU lock-free ring buffers to user space, bounded memory, backpressure policy (drop low-priority with counters, never block the kernel path; AUTH decisions must meet deadlines or default-allow/deny), user-space correlation (process tree, lineage), local detection rules, compression/batching to cloud, offline buffering. Performance budgets: &lt;1–2% CPU, minimal latency added to exec/open.</p>
<h3>Robustness and safe updates</h3><p>July 2024: a faulty content (configuration) update to a Windows kernel-mode sensor triggered an out-of-bounds read, crashing ~8.5 million machines in boot loops. Lessons for sensor engineers: kernel code must validate all inputs including vendor content (bounds checks, fuzzing of parsers), staged rollouts for content as well as code, customer-controlled update rings, crash-loop detection with automatic safe mode/rollback, and moving logic out of the kernel where possible (eBPF, user-space ES).</p>
<h3>Debugging skills (CrowdStrike Sensor role)</h3><p>Memory corruption (ASan/KASAN, Driver Verifier on Windows, crash dump analysis with WinDbg/crash), race conditions in callbacks, deadlocks from blocking in hooks, performance regressions from hot-path hooks; cross-platform C/C++ with RAII and careful IPC between components.</p>`,
poly:R`This is your sweet spot for a security pivot: kernel drivers, IRQ/callback context rules, lock-free rings, and memory-safety discipline are exactly what sensor teams need. Frame your driver robustness practices (input validation of firmware/config blobs, fuzzing ioctls) as security engineering.`,
quiz:[
{q:'Main advantage of eBPF-based sensors over custom kernel modules?',opts:['Faster always','Verifier-enforced safety (no kernel crashes from bugs) and portability via CO-RE','No privileges needed','Windows support'],a:1,exp:'Programs are verified before load.'},
{q:'A sensor’s user-space consumer falls behind. In the kernel hook you should…',opts:['Block until there’s space','Drop (or sample) low-priority events and count drops, never stall the kernel path','Crash','Allocate unbounded memory'],a:1,exp:'Backpressure must not harm the host.'},
{q:'macOS replaced kexts for security vendors with…',opts:['DTrace','Endpoint Security framework (user-space system extensions)','eBPF','Kernel modules'],a:1,exp:'ES provides AUTH/NOTIFY events.'},
{q:'Key lesson of the July 2024 sensor outage?',opts:['Use more RAM','Content/config updates to kernel components need validation and staged rollout like code','Disable sensors','Use Linux'],a:1,exp:'A content file triggered an out-of-bounds read in kernel mode.'}],
challenge:{prompt:R`<p>Build a mini Linux sensor with libbpf (C) or bpftrace prototype → libbpf: capture process exec (sched_process_exec tracepoint) and outbound connects (fentry/tcp_connect or kprobe), send to user space via BPF ring buffer, build a process tree in user space, and flag "shell spawned by a web server process". Add an in-kernel filter map (allow-listed binaries) and measure overhead with a fork/exec benchmark.</p>`,
hints:['bpftrace prototype: <code>tracepoint:sched:sched_process_exec { printf("%d %s\n", pid, str(args->filename)); }</code>.','Use <code>BPF_MAP_TYPE_RINGBUF</code> with <code>bpf_ringbuf_reserve/submit</code>.','Overhead: time 100k fork+exec of /bin/true with and without the program loaded.'],
solution:R`<p>Kernel side: tracepoint program reserves an event {pid, ppid, comm, filename}, checks allow-list hash map keyed by filename hash, submits. User side: ring_buffer__poll loop updates pid→{ppid, comm} map; rule: if comm in {sh, bash} and parent comm in {nginx, httpd, java} → alert. Typical overhead: low single-digit percent on exec-heavy microbenchmarks; near zero for normal workloads.</p>`},
interview:[{q:'"Design an endpoint telemetry sensor for Linux servers that must not hurt performance."',a:'Hooks via eBPF (tracepoints/LSM) with in-kernel filtering and per-CPU ring buffers; user-space agent with bounded queues, priority classes, sampling under load, and local correlation; resource limits via cgroups for the agent itself; kernel version portability (CO-RE, fallbacks); safe update pipeline for code and detection content (validation, fuzzing, staged rings, automatic rollback on crash loops); telemetry on drops/latency; privacy controls. Quantify CPU budget and event rates.'}],
resources:[['Kernel docs: BPF LSM (KRSI)','https://docs.kernel.org/bpf/prog_lsm.html'],['Apple Endpoint Security documentation','https://developer.apple.com/documentation/endpointsecurity'],['ebpf.io','https://ebpf.io/'],['CrowdStrike: Channel File 291 incident root cause analysis (PDF)','https://www.crowdstrike.com/wp-content/uploads/2024/08/Channel-File-291-Incident-Root-Cause-Analysis-08.06.2024.pdf']]}
]});

<script>/* js/content/m11-obs.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'obs',num:11,icon:'🔭',short:'Observability & profiling',title:'Observability & Profiling',tier:'core',
summary:'Metrics design and cardinality, latency distributions and tracing, eBPF as a universal probe, and CPU profiling with flame graphs up to fleet-wide continuous profiling.',
why:'NVIDIA Principal Profiling Services, Clockwork Network Observability, Cloudflare, Google infra and every SRE-adjacent principal role. It is also how you prove impact: numbers before and after.',
lessons:[
{id:'metrics',title:'Metrics, logs, traces — and the cardinality trap',minutes:25,skills:['observability','storage-data','go-rust'],sims:['cardinality'],
analogy:R`Metrics are a <b>car dashboard</b> (few gauges, always on), logs are the <b>mechanic’s notebook</b> (detailed, searchable, expensive), traces are a <b>GPS track of one trip</b>. Adding a label to a metric is like adding a gauge per passenger — fine for 4 passengers, catastrophic for a bus line with a million riders.`,
body:R`<h3>The three pillars (plus profiles)</h3><ul><li><b>Metrics</b>: numeric time series identified by name + labels. Cheap to store/query when cardinality is bounded. Types: counter (monotonic; use rate()), gauge, histogram (buckets → quantile estimation; aggregatable across instances, unlike client-side summaries), native/exponential histograms.</li><li><b>Logs</b>: discrete events, structured (JSON/logfmt) with request IDs; sampling and levels control cost.</li><li><b>Traces</b>: spans with parent/child relations across services (W3C traceparent header propagation); sampling (head-based vs tail-based to keep slow/error traces).</li><li><b>Profiles</b>: where CPU/memory goes (continuous profiling — last lesson).</li></ul>
<h3>Cardinality (sim)</h3><p>Series count = product of distinct label values. <code>http_requests_total{service, endpoint, status, pod}</code> with 50 endpoints × 10 statuses × 200 pods = 100k series per service — OK. Add <code>user_id</code> with 1M users → 10^11 → the TSDB falls over (memory per active series ~ few KB in Prometheus). Rules: never label with unbounded IDs (user, request, IP, full URL); put those in logs/traces/exemplars; use recording rules for pre-aggregation; drop labels at ingestion (relabeling).</p>
<h3>What to measure</h3><p><b>RED</b> for services (Rate, Errors, Duration), <b>USE</b> for resources (Utilization, Saturation, Errors — Brendan Gregg), Google’s four golden signals (latency, traffic, errors, saturation). SLIs should reflect user experience (successful requests under latency threshold), measured as close to the user as possible.</p>
<h3>Pipeline architecture</h3><p>Instrumentation (OpenTelemetry SDKs, auto-instrumentation, eBPF-based) → collectors/agents (batching, sampling, enrichment, relabel) → transport (OTLP, Kafka buffer) → storage (Prometheus/Mimir/M3/Monarch for metrics; Loki/Elastic/ClickHouse for logs; Tempo/Jaeger for traces) → query, dashboards, alerting. Scale concerns: ingestion bursts during incidents (when you need it most), multi-tenancy limits, retention tiers and downsampling, and meta-monitoring.</p>
<h3>Alerting</h3><p>Alert on symptoms (SLO burn rates), not causes; multi-window multi-burn-rate alerts reduce noise; every page must be actionable with a runbook.</p>`,
poly:R`Fleet device telemetry (call quality, CPU temps, crash counts per firmware version) is a cardinality design problem: device_id is unbounded — aggregate by model/firmware/region in metrics and keep per-device data in logs/events. Great concrete example for interviews.`,
quiz:[
{q:'Labels: region(10) × endpoint(40) × status(8) × instance(500). Series count?',opts:['558','1.6M','16,000','160,000'],a:1,exp:'10×40×8×500 = 1,600,000 — instance is the multiplier to watch.'},
{q:'Why are histograms preferred over summaries for latency across many pods?',opts:['Smaller','Histogram buckets can be aggregated across instances before computing quantiles; summary quantiles cannot be averaged','More accurate always','Required by Prometheus'],a:1,exp:'Averaging p99s is mathematically meaningless.'},
{q:'Where should request_id go?',opts:['Metric label','Logs/traces (or exemplars), not metric labels','Nowhere','Hostname'],a:1,exp:'Unbounded cardinality.'},
{q:'USE method applies to…',opts:['Services','Resources (CPU, disk, NIC): utilization, saturation, errors','Users','Logs'],a:1,exp:'RED is for services.'}],
challenge:{prompt:R`<p>Instrument a small HTTP service (Go or Python) with OpenTelemetry: RED metrics with a latency histogram, traces with a downstream call, and structured logs carrying trace IDs. Run the OTel Collector + Prometheus + Grafana + Jaeger via docker compose. Write an SLO (99% of requests &lt; 200 ms) and a multi-window burn-rate alert rule, then inject latency and watch it fire.</p>`,
hints:['Use exemplars to link histogram buckets to trace IDs.','Burn rate: error_ratio / (1 − SLO); page if 1h burn > 14.4 and 5m burn > 14.4.','Inject latency with a sleep toggled by an env var/endpoint.'],
solution:R`# Prometheus rule (latency SLO as "bad" = slower than 200ms)
- alert: LatencySLOFastBurn
  expr: |
    (1 - sum(rate(http_server_duration_bucket{le="0.2"}[1h])) / sum(rate(http_server_duration_count[1h]))) / 0.01 > 14.4
    and
    (1 - sum(rate(http_server_duration_bucket{le="0.2"}[5m])) / sum(rate(http_server_duration_count[5m]))) / 0.01 > 14.4
  labels: {severity: page}`},
interview:[{q:'"Design a metrics platform for 100k hosts."',a:'Agents with local aggregation and relabeling; push via OTLP to a regional ingestion tier (sharded by series hash, replicated), backed by a horizontally scalable TSDB with object-storage long-term retention and downsampling; per-tenant limits on series/ingest; query frontends with caching and query splitting; cardinality analytics and guardrails; meta-monitoring; capacity: series count (e.g. 100k hosts × 2k series = 200M active series), samples/s at 15 s scrape (~13M/s), bytes/sample after compression (~1–2).'}],
resources:[['OpenTelemetry documentation','https://opentelemetry.io/docs/'],['Prometheus: metric and label naming','https://prometheus.io/docs/practices/naming/'],['Brendan Gregg: The USE Method','https://www.brendangregg.com/usemethod.html'],['Google SRE Workbook: Alerting on SLOs','https://sre.google/workbook/alerting-on-slos/']]},
{id:'tail',title:'Latency distributions, tail at scale, and tracing',minutes:30,skills:['observability','perf-eng','dist-sys'],sims:['tailLatency'],
analogy:R`A web page that fans out to 100 servers is a <b>group dinner that can’t start until the last friend arrives</b>. Even if each friend is late only 1% of the time, with 100 friends someone is almost always late.`,
body:R`<h3>Averages lie</h3><p>Latency distributions are skewed and often multi-modal (cache hit vs miss, GC pause, retry). Report percentiles (p50, p90, p99, p99.9) and look at full histograms/heatmaps. Coordinated omission: load generators that wait for responses under-report tail latency when the system stalls (use constant-rate tools like wrk2).</p>
<h3>Tail at scale (sim)</h3><p>If one server’s p99 is 10 ms (1% slow), a request fanning out to N servers and waiting for all sees at least one slow response with probability 1 − 0.99^N: N=100 → 63%. So the user’s median becomes the backend’s p99. Techniques (Dean & Barroso, "The Tail at Scale"): <b>hedged requests</b> (send a second request after the p95 wait; cancel loser), <b>tied requests</b> (enqueue on two servers, cancel when one starts), micro-partitioning and selective replication of hot data, latency-induced probation (temporarily remove slow servers), and good-enough results (return partial results for search-like workloads).</p>
<h3>Sources of tail latency</h3><p>Queueing (utilization > 70–80% → latency explodes: M/M/1 waiting time ∝ ρ/(1−ρ)), GC pauses, CPU throttling, noisy neighbors, background tasks (compaction, log rotation), page faults/THP compaction, power-saving C-states, network retransmission timeouts (200 ms RTO min!), lock contention.</p>
<h3>Distributed tracing</h3><p>Traces show where time goes across services: critical path analysis, fan-out patterns, serialization, retries. Propagate context (W3C traceparent) through queues and async boundaries; tail-based sampling keeps the interesting traces (errors, slow) at manageable cost. Combine with exemplars (metric → trace) and continuous profiling (trace → code).</p>`,
poly:R`Conferencing systems care about jitter (variance of latency) and the tail directly — one slow frame per second is a visible stutter. You already think in percentiles for audio/video; carry that into backend design interviews and mention jitter buffers as a "hedge against the tail".`,
quiz:[
{q:'Each of 50 backends is slow 1% of the time; a request waits for all 50. Probability the request is slow?',opts:['1%','~39%','50%','~99%'],a:1,exp:'1 − 0.99^50 ≈ 0.395.'},
{q:'A hedged request is…',opts:['Retry after failure','A duplicate request sent after a short delay (e.g. p95) to another replica; first response wins','Encrypted request','A cached response'],a:1,exp:'Cuts tail latency with modest extra load (~5%).'},
{q:'Server utilization goes from 50% to 90%. In an M/M/1 model, average queueing delay multiplies by about…',opts:['1.8×','9×','2×','No change'],a:1,exp:'ρ/(1−ρ): 1 → 9.'},
{q:'"Coordinated omission" in load testing causes…',opts:['Overestimated tail','Underestimated tail latency because the generator stops sending while the server stalls','Crashes','Accurate results'],a:1,exp:'Use constant-throughput generators and record intended start times.'}],
challenge:{prompt:R`<p>Simulate in Python: a frontend fanning out to N backends with lognormal latencies plus 1% chance of a 100 ms stall. Plot frontend p50/p99 vs N (1..200). Implement hedging after the p95 delay and show p99 improvement and extra load. Then add server queueing (utilization 50/70/90%) and show the hockey stick.</p>`,
hints:['Frontend latency = max of N backend latencies.','Hedge: for each backend call, if latency > d, latency = min(latency, d + new_sample).','Extra load = fraction of calls exceeding d.'],
solution:R`def call(hedge_at=None):
    t = sample()
    if hedge_at is not None and t > hedge_at:
        t = min(t, hedge_at + sample())     # second request to another replica
    return t
def frontend(n, hedge_at=None): return max(call(hedge_at) for _ in range(n))
# Expect: without hedging p50 at N=100 ≈ backend p99; with hedging at backend p95, frontend p99 drops several-fold for ~5% extra load.`},
interview:[{q:'"Our p99 latency doubled after a deploy but p50 is unchanged. How do you investigate?"',a:'Compare distributions (heatmaps) before/after by endpoint, instance, zone; check if a subset of hosts/requests is affected (exemplars, traces of slow requests, critical path); look for new synchronous dependencies, retries, GC/allocation changes (profiles diff), lock contention, cache hit rate shifts; correlate with canary vs baseline; roll back if SLO burning. Then root cause with profiling and fix.'}],
resources:[['Dean & Barroso: The Tail at Scale (CACM 2013)','https://research.google/pubs/the-tail-at-scale/'],['Gil Tene: How NOT to Measure Latency (talk)','https://www.youtube.com/watch?v=lJ8ydIuPFeU'],['OpenTelemetry: traces concepts','https://opentelemetry.io/docs/concepts/signals/traces/']]},
{id:'ebpf',title:'eBPF: safe programmable probes in the kernel',minutes:30,skills:['ebpf','linux-kernel','observability'],sims:['ebpfHooks'],
analogy:R`eBPF is like installing <b>tiny certified sensors</b> anywhere in a running factory without stopping the machines. An inspector (the verifier) checks every sensor design before installation so it can’t jam the machinery.`,
body:R`<h3>How it works</h3><ol><li>Write a program in restricted C (or bpftrace/BCC); compile to BPF bytecode (clang -target bpf).</li><li><code>bpf()</code> syscall loads it; the <b>verifier</b> walks all paths: bounded loops, valid memory access (bounds checks), no uninitialized reads, helper function whitelist per program type, stack ≤ 512 bytes, complexity limits.</li><li>JIT compiles to native code; attach to a hook.</li><li>Programs communicate via <b>maps</b> (hash, array, per-CPU, LRU, ring buffer, stack traces) shared with user space.</li></ol>
<h3>Hook points (sim)</h3><ul><li><b>kprobes/kretprobes</b> (any kernel function; unstable ABI), <b>fentry/fexit</b> (BTF-based, faster), <b>tracepoints</b> (stable), <b>uprobes</b> (user functions, e.g. SSL_write in libssl, malloc), <b>USDT</b> probes.</li><li><b>perf events</b>: sampling CPU at 99 Hz with stack traces → profilers.</li><li>Networking: <b>XDP</b>, <b>tc</b>, socket filters, sockops, cgroup hooks (Cilium implements K8s networking and policy).</li><li><b>LSM</b> hooks (security enforcement), <b>sched_ext</b> (custom schedulers in BPF, Linux 6.12+).</li></ul>
<h3>CO-RE and BTF</h3><p>Compile Once – Run Everywhere: BTF type info in the kernel lets libbpf relocate struct field offsets at load time, so one binary works across kernel versions (essential for fleet tools and sensors).</p>
<h3>Classic tools (bcc/bpftrace)</h3><p><code>execsnoop</code>, <code>opensnoop</code>, <code>biolatency</code> (block I/O latency histogram), <code>runqlat</code> (scheduler run-queue latency), <code>tcpretrans</code>, <code>offcputime</code> (where threads block), <code>profile</code>. One-liner: <code>bpftrace -e 'kprobe:do_sys_openat2 { @[comm] = count(); }'</code>.</p>
<h3>Overhead and pitfalls</h3><p>Overhead per event ~50–200 ns for kprobes (fentry less); hooking very hot functions (millions/s) adds up. Use in-kernel aggregation (histograms in maps) instead of sending every event. Kernel version differences in function names/inlining break kprobes; prefer tracepoints. Requires CAP_BPF/CAP_PERFMON (or root).</p>`,
poly:R`On embedded targets with recent kernels (Qualcomm/NXP BSPs on 5.15+/6.x), eBPF tools can measure driver latencies (IRQ to buffer done, V4L2 dequeue latency) without rebuilding the kernel — a practical tool you can bring to your current job and talk about immediately.`,
quiz:[
{q:'What prevents an eBPF program from crashing the kernel?',opts:['Running in user space','The verifier statically checks memory safety, termination and allowed helpers before load','Hardware isolation','It can crash'],a:1,exp:'Plus JIT hardening and limited helpers.'},
{q:'Which hook type is a stable ABI across kernel versions?',opts:['kprobes','Tracepoints','Raw function addresses','uprobes on kernel'],a:1,exp:'kprobes attach to internal functions that may change or be inlined.'},
{q:'You want a latency histogram of block I/O with minimal overhead. Best approach?',opts:['Send every event to user space','Aggregate into a BPF histogram map in kernel, read periodically','strace','printk'],a:1,exp:'In-kernel aggregation is the main eBPF efficiency trick.'},
{q:'What does CO-RE solve?',opts:['Security','Portability: struct offsets relocated at load using BTF so one binary runs on many kernels','JIT speed','Map size'],a:1,exp:'Removes the need to compile on each target (BCC’s approach).'}],
challenge:{prompt:R`<p>Using bpftrace, answer on your Linux machine: (1) which processes open the most files; (2) histogram of read() sizes; (3) run-queue latency distribution while running <code>stress-ng --cpu</code>; (4) time between <code>irq_handler_entry</code> and <code>irq_handler_exit</code> per IRQ. Then port (3) to libbpf C with a ring buffer or histogram map.</p>`,
hints:['(1) <code>tracepoint:syscalls:sys_enter_openat { @[comm] = count(); }</code>','(2) <code>tracepoint:syscalls:sys_exit_read /args->ret > 0/ { @ = hist(args->ret); }</code>','(4) store nsecs at entry keyed by irq in a map; at exit compute delta into @us[irq] = hist(...).'],
solution:R`bpftrace -e '
tracepoint:irq:irq_handler_entry { @start[args->irq] = nsecs; }
tracepoint:irq:irq_handler_exit /@start[args->irq]/ {
  @usecs[args->irq] = hist((nsecs - @start[args->irq]) / 1000);
  delete(@start[args->irq]);
}'`},
interview:[{q:'"How would you find why a service has periodic 50 ms stalls?"',a:'Correlate stalls with system activity: runqlat (CPU contention), offcputime (blocking on locks/I/O), biolatency, page fault/compaction tracepoints, GC logs, cgroup throttling, softirq time, NIC drops. eBPF lets you capture stack traces only during stalls (conditional). Then fix the root cause and keep a lightweight probe as a regression detector.'}],
resources:[['ebpf.io','https://ebpf.io/'],['bpftrace (GitHub)','https://github.com/bpftrace/bpftrace'],['Brendan Gregg: Linux eBPF tracing tools','https://www.brendangregg.com/ebpf.html'],['libbpf-bootstrap (GitHub)','https://github.com/libbpf/libbpf-bootstrap']]},
{id:'profiling',title:'CPU profiling, flame graphs and continuous fleet profiling',minutes:30,skills:['profiling-svc','perf-eng','observability'],sims:['flameGraph','amdahl'],
analogy:R`A flame graph is an <b>aerial photo of a traffic jam</b>: wide roads = where most cars (CPU samples) are. You don’t optimize the scenic side street; you widen the highway everyone is stuck on. Amdahl’s law reminds you that widening a road only 5% of cars use can’t fix the commute.`,
body:R`<h3>Sampling profilers</h3><p><code>perf record -F 99 -g -p PID -- sleep 30</code> samples stacks 99 times/s per CPU (odd frequency avoids lockstep with timers). Stack walking needs frame pointers (<code>-fno-omit-frame-pointer</code>; Fedora/Ubuntu re-enabled them distro-wide in 2023–24), DWARF unwinding (expensive), or LBR/ORC. Symbols need debug info; JITs need perf maps. Off-CPU profiling (scheduler events, offcputime) shows blocking time that on-CPU profilers miss.</p>
<h3>Reading flame graphs (sim)</h3><p>x-axis = stack population sorted alphabetically (not time), width = fraction of samples, y = stack depth (callers below callees). Look for wide plateaus (functions doing work themselves), unexpected frames (locking, memcpy, page faults, logging, JSON), and compare with <b>differential flame graphs</b> before/after changes. Icicle (inverted) graphs group by callee.</p>
<h3>Amdahl and Gustafson (sim 2)</h3><p>Speedup = 1 / ((1−p) + p/s): optimizing 20% of runtime infinitely gives at most 1.25×. Parallelizing with 5% serial code caps speedup at 20× regardless of cores. Gustafson: with bigger problems, parallel portion grows. Use these to prioritize and to sanity-check claims.</p>
<h3>Hardware counters and microarchitecture</h3><p><code>perf stat</code> (IPC, cache/TLB misses, branch mispredicts), top-down analysis, and PMU sampling on specific events (e.g. sample on LLC misses to find memory-bound code). GPU equivalents: CUPTI PC sampling, Nsight.</p>
<h3>Continuous profiling at fleet scale (NVIDIA Profiling Services role)</h3><p>Always-on, low-overhead (≤1%) sampling across all hosts (Google-Wide Profiling, Parca, Pyroscope/Grafana, Datadog). Architecture: node agents (eBPF perf-event sampling with stack unwinding in kernel, symbolization offloaded centrally) → aggregation by service/version/host → columnar storage (pprof format) → query/merge/diff UIs. Uses: find fleet-wide hot functions (a 1% improvement in a common library saves thousands of cores), regression detection per release, cost attribution. For GPUs: periodic counter collection and PC sampling via CUPTI/DCGM with job attribution, care about overhead and interference with production workloads.</p>`,
poly:R`Profiling camera firmware on ARM with perf and flame graphs (or vendor tools like Snapdragon Profiler / Ambarella’s) to remove a hot memcpy or a logging hotspot is a concrete, quantifiable story. Bring a before/after flame graph to interviews if allowed.`,
quiz:[
{q:'In a CPU flame graph, the x-axis represents…',opts:['Time','Sample population (sorted alphabetically), width = share of CPU','Memory','Thread ID'],a:1,exp:'It is not a timeline (that’s a flame chart).'},
{q:'A function takes 30% of runtime. You make it 3× faster. Overall speedup?',opts:['3×','1.25×','1.3×','2×'],a:1,exp:'1 / (0.7 + 0.3/3) = 1/0.8 = 1.25.'},
{q:'Why sample at 99 Hz rather than 100 Hz?',opts:['Faster','Avoid lockstep with periodic activity that could bias samples','Kernel limit','Smaller files'],a:1,exp:'Aliasing with 100 Hz timers.'},
{q:'Your service is slow but CPU flame graph shows little CPU use. Next?',opts:['Buy faster CPUs','Off-CPU analysis (blocking on locks, I/O, sleeps)','More threads','Nothing'],a:1,exp:'Time spent waiting isn’t in on-CPU profiles.'}],
challenge:{prompt:R`<p>Take a C++ program you know (or a JSON parsing benchmark). Build with <code>-O2 -g -fno-omit-frame-pointer</code>, profile with <code>perf record -F 999 -g</code>, generate a flame graph with Brendan Gregg’s FlameGraph scripts, find the top hotspot, optimize it, and produce a differential flame graph. Report speedup and compare to the Amdahl prediction.</p>`,

<script>/* js/content/m12-robo.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'robo',num:12,icon:'🤖',short:'Robotics & control',title:'Robotics & Control (Optimus track)',tier:'optional',
summary:'PID and feedback control, kinematics, ROS 2 and DDS, real-time control loops on Linux, and edge perception — the bridge from conferencing devices to humanoids.',
why:'Your dream (Tesla Optimus) and also redeployable to automotive (Ford, GM), Google Platforms & Devices. Robotics employers hire systems people who understand control loops, latency budgets and sensors — not only ML.',
lessons:[
{id:'pid',title:'Feedback control and PID tuning',minutes:30,skills:['control'],sims:['pid'],
analogy:R`PID is <b>steering a car to stay in lane</b>. P: turn proportional to how far off you are. I: if a crosswind keeps pushing you, gradually add steady correction. D: if you’re swinging toward the center fast, ease off before overshooting.`,
body:R`<h3>The controller</h3><p>u(t) = Kp·e(t) + Ki·∫e dt + Kd·de/dt, e = setpoint − measurement. Discrete form at period T: <code>integral += e*T; deriv = (e - e_prev)/T; u = Kp*e + Ki*integral + Kd*deriv</code>.</p>
<ul><li><b>P</b> reduces error but leaves steady-state error with constant disturbances (e.g. gravity on a joint) and causes oscillation if too high.</li><li><b>I</b> removes steady-state error but adds phase lag → overshoot; <b>integral windup</b> when the actuator saturates (clamp the integral, conditional integration, or back-calculation).</li><li><b>D</b> adds damping but amplifies sensor noise → low-pass filter the derivative, and differentiate the measurement (not error) to avoid "derivative kick" on setpoint steps.</li></ul>
<h3>Tuning (sim)</h3><p>Start with P until oscillation, add D for damping, add a little I for steady-state. Ziegler–Nichols gives a starting point (from ultimate gain Ku and period Tu: Kp=0.6Ku, Ki=1.2Ku/Tu, Kd=0.075KuTu), usually too aggressive. Metrics: rise time, overshoot, settling time, steady-state error; robustness margins (gain/phase margin).</p>
<h3>Systems realities</h3><ul><li><b>Sample rate</b>: 10–20× the closed-loop bandwidth; joint current loops 10–40 kHz on the motor driver MCU, position/velocity loops 1–4 kHz, whole-body control ~500 Hz–1 kHz, planning 10–100 Hz.</li><li><b>Latency and jitter</b> act like phase lag → instability (next lessons).</li><li><b>Feedforward</b> (gravity compensation, inverse dynamics) does most of the work; PID corrects residual error. Cascaded loops (current → velocity → position).</li><li>Beyond PID: LQR, MPC (model predictive control — solve an optimization each cycle), impedance/admittance control for safe contact, and learned policies (RL) running at control rates on top of low-level PD.</li></ul>`,
poly:R`Auto-exposure and auto-white-balance in your ISP pipelines are feedback controllers with frame delay; PTZ camera tracking is a position control loop. You’ve tuned loops already — call them what they are in robotics interviews.`,
quiz:[
{q:'A joint holding a weight against gravity with P-only control shows…',opts:['Zero error','Steady-state error (needs I or gravity feedforward)','Oscillation always','Instability'],a:1,exp:'P needs nonzero error to produce the torque that balances gravity.'},
{q:'Actuator saturated for 2 s, then the system overshoots badly. Cause?',opts:['D too high','Integral windup','Sensor noise','Sample rate too high'],a:1,exp:'Integral accumulated while output was clamped.'},
{q:'Why low-pass filter the derivative term?',opts:['Reduce overshoot','Derivative amplifies high-frequency sensor noise','Increase speed','Remove steady-state error'],a:1,exp:'Differentiation boosts noise proportional to frequency.'},
{q:'Typical rate for a humanoid’s joint position/torque control loop?',opts:['1 Hz','30 Hz','~1 kHz (current loops even faster)','1 MHz'],a:2,exp:'High-bandwidth loops for stability and contact.'}],
challenge:{prompt:R`<p>Write a C++ (or Python) simulation of a DC motor + inertia (first-order electrical, second-order mechanical) with a PID position controller at 1 kHz. Add: actuator saturation with anti-windup, derivative on measurement with a low-pass filter, sensor noise, and a 2 ms loop delay. Tune for &lt;5% overshoot and report step response metrics. Then add gravity feedforward for a pendulum load.</p>`,
hints:['Integrate dynamics with a smaller step (e.g. 0.1 ms) than the controller period.','Anti-windup: only integrate when output not saturated or error drives out of saturation.','Delay: keep a FIFO of commands; apply the command from 2 ms ago.'],
solution:R`struct PID { double kp, ki, kd, tf, T, umin, umax, i = 0, d = 0, yprev = 0;
  double step(double r, double y) {
    double e = r - y;
    double draw = -(y - yprev) / T; yprev = y;               // derivative on measurement
    d += (T / (tf + T)) * (draw - d);                          // 1st-order low-pass
    double u = kp * e + i + kd * d;
    double us = std::clamp(u, umin, umax);
    if (u == us || (u > umax && e < 0) || (u < umin && e > 0)) i += ki * e * T;  // conditional integration
    return us;
  } };`},
interview:[{q:'"How would you tune and validate a control loop for a new robot joint?"',a:'System identification (step/chirp tests → plant model), design inner current loop then velocity then position (cascade), add feedforward (gravity, friction, inertia), choose sample rates relative to bandwidth, tune with margins (Bode/Nyquist), test saturation and anti-windup, noise filtering, latency/jitter sensitivity, and safety limits (torque/velocity/position, watchdogs). Validate in simulation, HIL, then hardware with gradually increasing gains; log everything.'}],
resources:[['Brian Douglas: Understanding PID Control (video)','https://www.youtube.com/watch?v=wkfEZmsQqiA'],['Brian Douglas: Control lectures channel','https://www.youtube.com/user/ControlLectures'],['Underactuated Robotics (MIT, Russ Tedrake)','https://underactuated.csail.mit.edu/']]},
{id:'kin',title:'Kinematics: forward, inverse, Jacobians',minutes:30,skills:['control'],sims:['arm2link'],
analogy:R`Forward kinematics is <b>"if I bend my shoulder and elbow this much, where is my hand?"</b> Inverse kinematics is the harder question: <b>"to touch that cup, how should I bend?"</b> — often with several answers (elbow up or down) or none (out of reach).`,
body:R`<h3>Forward kinematics (sim)</h3><p>2-link planar arm: x = L1 cos θ1 + L2 cos(θ1+θ2), y = L1 sin θ1 + L2 sin(θ1+θ2). In 3D, chain homogeneous transforms (4×4: rotation + translation) per joint — Denavit–Hartenberg parameters or the product-of-exponentials formulation (screw theory, Modern Robotics). Rotations: rotation matrices, quaternions (no gimbal lock, cheap interpolation via slerp), avoid Euler angles for computation.</p>
<h3>Inverse kinematics</h3><p>Analytic for simple arms: law of cosines gives cos θ2 = (x²+y²−L1²−L2²)/(2L1L2); two solutions (elbow up/down); no solution if |cos θ2| &gt; 1 (unreachable). For 7-DoF arms and humanoids: numerical IK using the <b>Jacobian</b> J (maps joint velocities to end-effector velocities, ẋ = J q̇): iterate q += J⁺ (x_target − x(q)) with damped least squares (J^T(JJ^T + λ²I)^-1) to stay stable near <b>singularities</b> (where J loses rank — arm fully stretched). Redundancy (more joints than task DoF) allows secondary objectives in the null space (avoid joint limits, keep balance).</p>
<h3>Dynamics and humanoids</h3><p>Equations of motion M(q)q̈ + C(q,q̇)q̇ + g(q) = τ + Jᵀf. Efficient algorithms: Recursive Newton–Euler (inverse dynamics, O(n)), Articulated Body Algorithm (forward dynamics). Humanoids add floating base, contact constraints, balance (ZMP / capture point / centroidal dynamics), and whole-body control solving a QP each cycle (tasks: foot contacts, CoM, hands, posture) at ~1 kHz — a real-time performance problem: matrix math with deterministic timing, often in C++ with Eigen/Pinocchio on CPU, with neural policies on GPUs/NPUs above.</p>
<h3>Systems angle</h3><p>Numerical robustness (singularities, floating-point), deterministic compute time (no allocation in the loop, fixed iteration counts), and calibration (kinematic parameters from manufacturing tolerances) — all areas where a systems engineer adds value.</p>`,
poly:R`PTZ cameras and speaker-tracking framing do 2-DoF kinematics with motors and calibration; your understanding of fixed-point/real-time constraints on embedded processors maps to deterministic kinematics/dynamics code on robot controllers.`,
quiz:[
{q:'2-link arm with L1 = L2 = 1. Target at distance 2.5 from base. IK solutions?',opts:['Two','One','None — out of reach (max 2)','Infinite'],a:2,exp:'Workspace radius ≤ L1+L2 = 2.'},
{q:'At a singularity the Jacobian…',opts:['Is identity','Loses rank: some end-effector directions become impossible and joint velocities blow up','Is zero','Is symmetric'],a:1,exp:'Damped least squares keeps IK stable there.'},
{q:'Why are quaternions preferred over Euler angles in robot software?',opts:['Easier to read','No gimbal lock, numerically stable composition and interpolation','Fewer numbers than 3','Required by ROS'],a:1,exp:'4 numbers, unit norm, smooth slerp.'},
{q:'A 7-DoF arm doing a 6-DoF task has…',opts:['No solutions','A 1-D null space for secondary objectives','Singularities everywhere','Must lock a joint'],a:1,exp:'Redundancy lets you optimize posture/limits.'}],
challenge:{prompt:R`<p>Implement in Python/NumPy (then C++/Eigen): FK for a 3-link planar arm, analytic IK for 2 links, and Jacobian-based damped-least-squares IK for 3 links tracking a circular trajectory at 1 kHz. Plot joint angles and manipulability (sqrt(det(JJᵀ))). Measure worst-case iteration time in C++ and make it allocation-free.</p>`,
hints:['J columns for planar revolute joint i: [-(y_e − y_i), (x_e − x_i)].','DLS: dq = Jᵀ (J Jᵀ + λ² I)^-1 e, λ ≈ 0.01–0.1.','Eigen fixed-size matrices (Matrix<double,2,3>) avoid heap allocation.'],
solution:R`def ik_dls(q, target, L, lam=0.05, iters=20):
    for _ in range(iters):
        pts = fk_points(q, L)                       # joint positions incl. end effector
        e = target - pts[-1]
        if np.linalg.norm(e) < 1e-5: break
        J = np.zeros((2, len(q)))
        for i in range(len(q)):
            r = pts[-1] - pts[i]; J[:, i] = [-r[1], r[0]]
        q = q + J.T @ np.linalg.solve(J @ J.T + lam**2 * np.eye(2), e)
    return q`},
interview:[{q:'"How does a humanoid robot decide joint torques each control cycle?"',a:'High-level policy/planner gives targets (footsteps, hand poses) at 10–100 Hz; whole-body controller at ~500–1000 Hz solves a QP with dynamics and contact constraints (or a learned policy outputs joint targets) producing joint torques/positions; joint-level controllers (PD + feedforward) at kHz; motor drivers run current loops at 10s of kHz. State estimation fuses IMU, joint encoders, foot force sensors. Discuss timing budgets, deterministic execution, and safety layers.'}],
resources:[['Modern Robotics (Lynch & Park) Coursera specialization','https://www.coursera.org/specializations/modernrobotics'],['Modern Robotics book (free PDF via Northwestern)','https://hades.mech.northwestern.edu/index.php/Modern_Robotics'],['Underactuated Robotics (MIT)','https://underactuated.csail.mit.edu/']]},
{id:'ros2',title:'ROS 2, DDS and QoS',minutes:30,skills:['ros2','dist-sys'],sims:['ros2Graph'],
analogy:R`ROS 2 is a <b>newsroom</b>: nodes are reporters and editors; topics are news wires (publish/subscribe); services are phone calls (request/response); actions are assignments with progress updates. DDS is the wire service that delivers news, and QoS is the delivery contract: "every bulletin, guaranteed" vs "just the latest headline".`,
body:R`<h3>Concepts (sim)</h3><ul><li><b>Nodes</b> in processes; composition puts multiple nodes in one process for zero-copy intra-process communication.</li><li><b>Topics</b> (pub/sub, typed messages), <b>services</b> (RPC), <b>actions</b> (goal/feedback/result with cancel), <b>parameters</b>, <b>launch</b> files, <b>tf2</b> (coordinate frame tree over time).</li><li><b>Executors</b> schedule callbacks: single-threaded vs multi-threaded, callback groups (mutually exclusive/reentrant). Executor design affects latency and determinism (events executor, rclcpp static executors).</li></ul>
<h3>DDS underneath</h3><p>ROS 2 uses DDS/RTPS (Fast DDS, Cyclone DDS, Connext) or Zenoh (rmw_zenoh): discovery via multicast (SPDP/SEDP), peer-to-peer data over UDP, shared memory transports for large messages (images, point clouds) — iceoryx/loaned messages for true zero copy.</p>
<h3>QoS policies</h3><table><tr><th>Policy</th><th>Options</th><th>Use</th></tr><tr><td>Reliability</td><td>reliable / best_effort</td><td>commands reliable; high-rate sensors best-effort</td></tr><tr><td>History/Depth</td><td>keep_last N / keep_all</td><td>sensors keep_last 1–5</td></tr><tr><td>Durability</td><td>volatile / transient_local</td><td>late joiners get last map/config</td></tr><tr><td>Deadline, Lifespan, Liveliness</td><td>periods/timeouts</td><td>detect stale publishers, drop old data</td></tr></table><p>QoS must be <b>compatible</b>: a reliable subscriber won’t match a best-effort publisher (silent no-data bug — check <code>ros2 topic info -v</code>).</p>
<h3>Performance and real-time</h3><p>Serialization costs (CDR) for large messages; avoid copies with loaned messages; pin executors to cores with real-time priority; avoid dynamic allocation in callbacks; measure end-to-end latency with ros2_tracing (LTTng). Micro-ROS runs on MCUs (motor controllers). For production robots, many companies use custom middleware but ROS 2 concepts (pub/sub graphs, QoS, time sync) are universal.</p>`,
poly:R`A conference device is a ROS-like graph already: camera node → framing node → encoder node → network node, plus audio, control services and config parameters. If you’ve used GStreamer pipelines or D-Bus services, map them to ROS 2 topics/services in interviews. Ambarella also publishes cooper-ros for their SoCs.`,
quiz:[
{q:'Camera publishes best_effort; your node subscribes reliable. Result?',opts:['Works','No messages: incompatible QoS (subscriber requests stronger guarantee)','Duplicates','Crash'],a:1,exp:'Requested reliability must be ≤ offered.'},
{q:'Which QoS lets a late-joining node receive the last published map?',opts:['best_effort','transient_local durability','keep_all history only','deadline'],a:1,exp:'Publisher stores and replays last N samples.'},
{q:'Best way to pass 4K images between nodes with minimal latency?',opts:['Serialize to JSON','Compose nodes in one process (intra-process) or use shared-memory/loaned messages','Use services','Use parameters'],a:1,exp:'Avoids serialization and copies.'},
{q:'ROS 2 actions are appropriate for…',opts:['High-rate sensor data','Long-running goals with feedback and cancellation (e.g. navigate to pose)','Parameters','Logging'],a:1,exp:'Topics for streams, services for quick RPC.'}],
challenge:{prompt:R`<p>Install ROS 2 (Jazzy) in Docker. Build a C++ package with: a camera-like publisher (synthetic 1080p images at 30 Hz), a processing node (blur via OpenCV), and a subscriber measuring end-to-end latency using header stamps. Compare latency/CPU for: separate processes with default DDS, composition with intra-process comms, and best_effort vs reliable QoS. Visualize the graph with rqt_graph.</p>`,
hints:['Use <code>sensor_msgs/msg/Image</code> and <code>rclcpp::SensorDataQoS()</code>.','Composition: register components with RCLCPP_COMPONENTS_REGISTER_NODE and use a component container.','Enable intra-process: <code>rclcpp::NodeOptions().use_intra_process_comms(true)</code> and publish unique_ptr messages.'],
solution:R`<p>Expected: separate processes add serialization + copy (multiple ms for 6 MB images); composition with unique_ptr publishing achieves near-zero-copy (sub-ms); reliable QoS can add latency/backlog under load when the subscriber is slow; best_effort with keep_last(1) keeps latency bounded by dropping. Report a table.</p>`},
interview:[{q:'"Design the software architecture for a mobile manipulator robot."',a:'Layers: hardware abstraction (ros2_control, real-time joint controllers), state estimation (IMU/odometry fusion, localization), perception (camera/LiDAR nodes on GPU/NPU), planning (navigation, motion planning MoveIt), behaviour/task layer, fleet/cloud interface. Communication via pub/sub with QoS per stream, time sync (PTP), real-time partitioning (RT cores for control, non-RT for perception), logging/replay (rosbag/MCAP), safety (e-stop chain independent of software), OTA updates.'}],
resources:[['ROS 2 Jazzy documentation','https://docs.ros.org/en/jazzy/'],['ROS 2 QoS settings concepts','https://docs.ros.org/en/jazzy/Concepts/Intermediate/About-Quality-of-Service-Settings.html'],['ROS 2 tutorials (albanna)','https://albanna-tutorials.com/ros2/index.html'],['Ambarella cooper-ros (GitHub)','https://github.com/Ambarella-Inc/cooper-ros']]},
{id:'rt',title:'Real-time Linux and control-loop timing',minutes:30,skills:['realtime','linux-kernel','control'],sims:['controlLoopJitter'],
analogy:R`A control loop is a <b>drummer keeping time for a band</b>. Average tempo doesn’t matter if the drummer occasionally pauses for half a beat — the band (robot) stumbles. Real-time engineering is about the worst beat, not the average.`,
body:R`<h3>Hard vs soft real time</h3><p>Hard: missing a deadline is a failure (motor current loops, safety). Soft: occasional misses degrade quality (video frames). Metrics: <b>latency</b> (event → response), <b>jitter</b> (variation of period), <b>worst-case execution time</b>. Measure worst case over hours under stress, not averages.</p>
<h3>PREEMPT_RT</h3><p>Merged into mainline in Linux 6.12 (2024). Makes most of the kernel preemptible: spinlocks become sleeping rt_mutexes with priority inheritance, interrupt handlers run as threads (prioritizable), softirqs in threads. Typical worst-case latencies drop from milliseconds to tens of µs on good hardware. Tools: <code>cyclictest</code> (measures timer wakeup latency), <code>hwlatdetect</code> (SMIs/firmware stalls), <code>rtla</code> (timerlat/osnoise tracers).</p>
<h3>Writing an RT control thread</h3><ol><li><code>SCHED_FIFO</code> priority (e.g. 80), CPU pinned (isolcpus/cpusets, nohz_full on that core, IRQ affinity away).</li><li><code>mlockall(MCL_CURRENT|MCL_FUTURE)</code> and prefault stack/heap — no page faults in the loop.</li><li>Absolute-time periodic wakeups: <code>clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME, &amp;next)</code> (relative sleeps accumulate drift).</li><li>No dynamic allocation, no blocking syscalls, no unbounded locks in the loop; communicate with non-RT threads via lock-free SPSC rings (Module 4); avoid priority inversion (PI mutexes).</li><li>Disable deep CPU C-states and frequency scaling on RT cores; watch SMIs and thermal throttling.</li></ol>
<h3>Effect of jitter on control (sim)</h3><p>Delay and jitter add phase lag; beyond a point the loop goes unstable or performance degrades (overshoot, vibration). Mitigations: timestamp sensor data and compensate, run control on a dedicated MCU/RTOS (Zephyr, FreeRTOS) or real-time core with Linux handling higher-level tasks (heterogeneous SoCs: Cortex-A + Cortex-R/M, e.g. i.MX8 M4 core with remoteproc/RPMsg), EtherCAT for deterministic fieldbus with distributed clocks.</p>`,
poly:R`Audio processing on your devices is soft/firm real time (missed deadlines = clicks). i.MX8 parts you’ve worked with have Cortex-M cores for real-time tasks via RPMsg — exactly the heterogeneous architecture robots use (Linux for perception/planning, MCU/RT core for motor control).`,
quiz:[
{q:'Why use clock_nanosleep with TIMER_ABSTIME for periodic loops?',opts:['Higher resolution','Avoids cumulative drift from execution time and wakeup latency','Lower CPU','Required by POSIX'],a:1,exp:'Next deadline = previous deadline + period.'},
{q:'What does mlockall() prevent?',opts:['Interrupts','Page faults (paging out/lazy allocation) causing unbounded latency in the RT loop','Preemption','Cache misses'],a:1,exp:'Lock and prefault memory before entering the loop.'},
{q:'Under PREEMPT_RT, most spinlocks become…',opts:['Faster spinlocks','Sleeping rt_mutexes with priority inheritance','Disabled','Atomics'],a:1,exp:'Allows preemption inside critical sections.'},
{q:'cyclictest reports max latency 2 ms once per hour on an otherwise good system. Suspect?',opts:['Bad code','SMIs/firmware, C-state exits, or an IRQ/softirq on the RT core','Network','Nothing'],a:1,exp:'Use hwlatdetect, osnoise/timerlat tracers.'}],
challenge:{prompt:R`<p>On a Linux machine (ideally with a PREEMPT_RT kernel), write a 1 kHz control loop in C++ following the RT checklist; log per-cycle wakeup latency to a lock-free ring drained by a non-RT thread. Run <code>stress-ng --cpu 4 --io 2 --vm 2</code> and compare histograms: SCHED_OTHER vs SCHED_FIFO vs FIFO + isolated core. Validate with cyclictest.</p>`,
hints:['<code>cyclictest -m -Sp90 -i1000 -h400 -D10m</code> for histograms.','Boot params: <code>isolcpus=3 nohz_full=3 rcu_nocbs=3</code>; move IRQs via /proc/irq/*/smp_affinity.','Prefault: touch a large stack array at startup; reserve vectors before the loop.'],
solution:R`timespec next; clock_gettime(CLOCK_MONOTONIC, &next);
for (;;) {
  next.tv_nsec += 1'000'000; if (next.tv_nsec >= 1'000'000'000) { next.tv_nsec -= 1'000'000'000; ++next.tv_sec; }
  clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME, &next, nullptr);
  timespec now; clock_gettime(CLOCK_MONOTONIC, &now);
  int64_t lat_ns = (now.tv_sec - next.tv_sec) * 1'000'000'000LL + (now.tv_nsec - next.tv_nsec);
  ring.push(lat_ns);                        // SPSC, never blocks
  control_step();                           // bounded, allocation-free
}`},
interview:[{q:'"How would you guarantee a 1 kHz control loop on a Linux-based robot computer?"',a:'PREEMPT_RT kernel, isolated cores with nohz_full and IRQ affinity, SCHED_FIFO with PI mutexes, mlockall/prefault, absolute-time wakeups, allocation-free bounded code, lock-free IPC to non-RT parts, BIOS tuning (disable C-states/SMT where needed), continuous latency monitoring in production with watchdog fallback (safe stop), and consider offloading the tightest loops to an MCU/RT core. Validate with long stress tests and report worst-case, not averages.'}],
resources:[['Linux Foundation: Real-Time Linux wiki (PREEMPT_RT)','https://wiki.linuxfoundation.org/realtime/start'],['cyclictest documentation','https://wiki.linuxfoundation.org/realtime/documentation/howto/tools/cyclictest/start'],['Kernel docs: RTLA (real-time Linux analysis)','https://docs.kernel.org/tools/rtla/index.html']]},
{id:'perception',title:'Edge perception: from sensor to inference within a latency budget',minutes:30,skills:['edge-ai','camera-isp','gpu-arch'],sims:['cameraPipeline','roofline'],
analogy:R`Edge perception is a <b>relay race against a stopwatch</b>: photons → sensor → ISP → neural net → tracker → planner. Each runner has a time slice; if the neural net runner dawdles, the robot reacts to a world that has already changed.`,
body:R`<h3>Budget the pipeline (sim 1)</h3><p>For a robot walking at 1.5 m/s, 100 ms perception latency means acting on a world 15 cm stale. Budget example at 30 fps: exposure+readout 10–33 ms (rolling shutter), ISP 5 ms, resize/normalize 2 ms (do on ISP/VPU, not CPU), inference 10–20 ms, post-processing (NMS, tracking) 2–5 ms, transport to planner 1 ms. Pipelining raises throughput but not latency; timestamps at exposure (not arrival) are essential for fusion.</p>
<h3>Making models fit (sim 2: roofline)</h3><ul><li><b>Quantization</b>: INT8 (post-training calibration or QAT), FP16/BF16, INT4 for LLM-like models; NPUs (Ambarella CVflow, Qualcomm Hexagon/HTP, NVIDIA Jetson DLA) are optimized for INT8.</li><li>Compilation: TensorRT, ONNX Runtime with execution providers, TVM, vendor toolchains (Ambarella CVflow tools, Qualcomm AI Engine Direct/QNN) — fusing ops, choosing layouts, and handling unsupported ops (fallback to CPU kills latency).</li><li>Architecture choices: efficient backbones, resolution vs accuracy trade-offs, batch=1 latency optimization, multi-camera batching.</li><li>Memory bandwidth on SoCs is shared with ISP/encoder → roofline thinking applies (many edge models are memory-bound at batch 1).</li></ul>
<h3>Sensor fusion and state estimation</h3><p>Combine camera, IMU, joint encoders, LiDAR/depth with Kalman filters (EKF/UKF) or factor graphs; requires synchronized clocks (PTP, hardware trigger), calibrated extrinsics, and latency compensation. Visual-inertial odometry (VIO) is a classic robotics pipeline running on edge SoCs.</p>
<h3>Humanoid relevance</h3><p>Tesla Optimus reuses FSD-style vision (multi-camera, neural nets on custom inference hardware) — vision-only perception with end-to-end networks. Systems work: camera bring-up, ISP tuning, time sync, zero-copy pipelines, NPU scheduling, thermal/power budgets — exactly your Poly toolbox.</p>`,
poly:R`This is the most direct transfer: Ambarella CV7 runs CNNs on CVflow for speaker framing; you’ve dealt with ISP → NPU zero-copy, model conversion, and frame-latency budgets. Lead robotics interviews with this lesson’s vocabulary plus your concrete numbers.`,
quiz:[
{q:'Robot moves at 2 m/s; perception latency 80 ms. Position staleness?',opts:['1.6 cm','16 cm','1.6 m','0.16 cm'],a:1,exp:'2 × 0.08 = 0.16 m.'},
{q:'Pipelining a 4-stage perception chain (each 10 ms) mostly improves…',opts:['Latency','Throughput (frames/s), latency remains ~40 ms','Accuracy','Power'],a:1,exp:'Latency is still the sum of stages.'},
{q:'An unsupported op forces a CPU fallback in the middle of an NPU graph. Typical impact?',opts:['None','Large latency increase from copies and slow CPU execution','Better accuracy','Lower power'],a:1,exp:'Replace/rewrite the op or move it to the end.'},
{q:'Why timestamp camera frames at exposure time?',opts:['Logging','Accurate fusion with IMU/encoders and latency compensation','Compression','Required by V4L2'],a:1,exp:'Arrival time includes variable pipeline delays.'}],
challenge:{prompt:R`<p>Take a YOLO-family model, export to ONNX, and benchmark on your laptop CPU/GPU with ONNX Runtime at FP32 vs FP16 vs INT8 (static quantization with a calibration set). Build a camera → inference → tracking loop, measure per-stage latency, and write a budget table. If you have an Ambarella or Jetson board, follow the vendor conversion flow (e.g. Ultralytics Ambarella integration) and compare.</p>`,
hints:['<code>yolo export model=yolov8n.pt format=onnx</code> (Ultralytics).','ONNX Runtime quantization: <code>quantize_static</code> with a CalibrationDataReader.','Use perf counters/timestamps per stage; report p50 and p99.'],
solution:R`<p>Expected: FP16 on GPU gives ~1.5–2× over FP32; INT8 on CPU gives 2–4× over FP32 with small mAP drop if calibrated well; pre/post-processing often dominate after the model gets fast — move resize/normalize to GPU/ISP and use efficient NMS. Deliver a budget table and a list of next optimizations.</p>`},
interview:[{q:'"Design the perception compute pipeline for a humanoid with 8 cameras."',a:'Camera interfaces (GMSL/MIPI) with hardware sync triggers and PTP time; ISP processing on SoC; zero-copy buffers to NPU/GPU; batched multi-camera inference (shared backbone, BEV fusion), latency budget per stage with deadlines; scheduler prioritizing safety-critical networks; thermal/power envelope; fallbacks when a camera fails; logging for data engine (triggered clips) with bandwidth limits; OTA model updates with shadow mode evaluation. Quantify bandwidth (8 × 1080p30 RAW12 ≈ 8 × 93 MB/s).'}],
resources:[['Ultralytics: Ambarella integration','https://docs.ultralytics.com/integrations/ambarella'],['Coursera: Computer Vision with Embedded Machine Learning','https://www.coursera.org/learn/computer-vision-with-embedded-machine-learning'],['OpenCV free bootcamp','https://opencv.org/university/free-opencv-course/'],['Qualcomm Academy: AI for Qualcomm Robotics','https://www.academy.qualcomm.com/course-catalog/AI-for-Qualcomm-Robotics']]}
]});
})();
