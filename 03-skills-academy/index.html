{t:'Deep dive: preemption & fairness',ask:'High-priority job arrives and the cluster is full. What happens?',a:R`<p>Policy: guaranteed quota is always reclaimable; burst usage is preemptible. Pick victims minimizing lost work (time since last checkpoint × GPUs) and respecting gang semantics (preempt whole jobs, never partial). Give victims a grace period (SIGTERM → checkpoint) before kill. Avoid thrashing with minimum runtimes and preemption budgets. Fair share computed on decayed GPU-hours so bursty teams aren’t punished forever.</p>`,nodes:[['ckpt','Checkpoint store',450,300]],edges:[['agents','ckpt','save/restore']]},
{t:'Failure modes',ask:'What fails, and how do you handle it?',a:R`<ul><li>GPU/NVLink/IB failures mid-job (frequent at scale) → health controller marks node bad, job restarts from checkpoint on spare capacity (keep a hot-spare pool ~1–2%).</li><li>Scheduler crash → leader election with standby; state in store; idempotent reconciliation of allocations.</li><li>Stragglers (slow GPU) → detect via step-time telemetry, swap node.</li><li>Agent/network partition → lease expiry semantics; don’t double-allocate (fencing tokens).</li><li>Bad driver/firmware rollout → canary per rack (ties to OS image pipeline).</li></ul>`,nodes:[],edges:[]},
{t:'Staff-level trade-offs',ask:'What would you call out as the key trade-offs?',a:R`<ul><li>Utilization vs wait time for big jobs (reservations idle GPUs; backfill mitigates, needs accurate runtime estimates).</li><li>Build on Kubernetes (ecosystem; needs Kueue/Volcano for gang + custom topology plugins) vs Slurm (HPC-native gang/topology) vs custom.</li><li>Centralized scheduler simplicity vs scale; at 10k GPUs centralized is fine — say so.</li><li>Metrics to run the business: allocation %, effective utilization (MFU), queue wait p95 by priority, goodput lost to failures/preemption.</li></ul>`,nodes:[],edges:[]}
]});

D({id:'inference',icon:'🧠',title:'Design an LLM inference serving platform',tags:['llm-serving','dist-sys','lb-traffic','k8s'],for:'Anthropic Cloud Inference, NVIDIA Dynamo, Microsoft CoreAI, Google Cloud AI',
steps:[
{t:'Clarify requirements',ask:'What do you need to know?',a:R`<ul><li>Models: sizes (8B–400B+, MoE?), context lengths, number of versions live.</li><li>Traffic: 50k req/min peak, avg 2k input / 400 output tokens, streaming, multi-turn sessions with shared prefixes.</li><li>SLOs: TTFT p99 < 1 s for interactive tier, ITL p99 < 60 ms; batch tier cheaper/slower.</li><li>Multi-region, multi-cloud capacity; tenants with rate limits and priorities.</li></ul>`,nodes:[['client','Clients (API/SDK)',60,180]],edges:[]},
{t:'Estimate',ask:'How many GPUs?',a:R`<p>Output: 50k/min × 400 = 333k tok/s output; input prefill 50k/min × 2k = 1.67M tok/s. Suppose a 70B FP8 replica on 8×H100 sustains ~3k output tok/s at SLO with continuous batching and prefill capacity ~30k tok/s → decode needs ~110 nodes; prefill ~56 nodes (less with prefix caching hit rate 50%: ~28). With 30% headroom and N+1 regions: ~200–250 nodes (1,600–2,000 GPUs). KV per token 160 KB (FP8, GQA) → 2.4k-token sessions ≈ 400 MB each.</p>`,nodes:[],edges:[]},
{t:'API',ask:'Define the external API and internal interfaces.',a:R`<pre>POST /v1/messages {model, messages[], max_tokens, stream: true, priority}
-> SSE stream of tokens; usage {input_tokens, output_tokens, cached_tokens}
Internal: Router.Route(req) -> worker; Engine.Generate(stream); KV.Transfer(blocks, dst)</pre><p>Idempotency keys for retries; request IDs for tracing; per-tenant API keys.</p>`,nodes:[['gw','API gateway: auth, quotas, rate limit',250,180]],edges:[['client','gw','HTTPS/SSE']]},
{t:'High-level design',ask:'Lay out the request path.',a:R`<ul><li>Global LB (anycast/GeoDNS) → regional gateway (auth, rate limiting, tokenization optional).</li><li><b>KV-aware router</b>: scores workers by prefix cache overlap and load.</li><li><b>Prefill pool</b> and <b>decode pool</b> (disaggregated for big models; KV transferred via NIXL/RDMA). Engines (vLLM/SGLang/TRT-LLM) with continuous batching, paged KV, CUDA graphs.</li><li>Model registry + weight distribution (P2P, NVMe caches). Autoscaler on queue depth/KV utilization. Telemetry pipeline.</li></ul>`,nodes:[['router','KV-aware router',450,180],['prefill','Prefill pool',650,90],['decode','Decode pool',650,270],['registry','Model registry + weights',450,320]],edges:[['gw','router',''],['router','prefill','new prompt'],['prefill','decode','KV transfer (RDMA)'],['router','decode','session affinity'],['registry','decode','weights'],['registry','prefill','']]},
{t:'Deep dive: scheduling inside a replica',ask:'How do you meet TTFT and ITL together?',a:R`<p>Iteration-level scheduling with a token budget per step; chunked prefill so prefills don’t stall decodes; priority classes (interactive before batch); admission based on KV block availability with preemption (swap to host vs recompute); prefix caching with LRU over block hashes; speculative decoding where acceptance is high; CUDA graphs per batch bucket. Track goodput (requests meeting SLO), not raw throughput.</p>`,nodes:[],edges:[]},
{t:'Deep dive: rollout & capacity',ask:'How do you ship a new model/engine version safely?',a:R`<p>Weights pre-staged on nodes; new version deployed to a canary slice with shadow traffic → compare quality evals, latency, error rate; ramp by traffic weight per tier; keep old replicas warm until bake completes; instant rollback by router weights. Capacity: predictive scaling (diurnal), warm pools because cold start (weights load) takes minutes; spillover across regions/clouds with latency-aware routing.</p>`,nodes:[['ctrl','Rollout + autoscaler control plane',250,320]],edges:[['ctrl','router','weights'],['ctrl','registry','']]},
{t:'Failure modes',ask:'What breaks?',a:R`<ul><li>GPU/node failure kills a TP group → in-flight requests retried (idempotent, partial streams resumed or restarted); router health checks eject replica.</li><li>Overload → shed batch tier first, cap max_tokens, 429 with Retry-After; avoid retry storms (budgets).</li><li>Prefix-cache hot spots → bounded-load routing.</li><li>KV transfer bottleneck → co-locate prefill/decode in same rack, fall back to local prefill for short prompts.</li><li>Bad engine build → canary catches latency regressions.</li></ul>`,nodes:[],edges:[]},
{t:'Staff-level trade-offs',ask:'Key trade-offs to articulate?',a:R`<ul><li>Disaggregation complexity vs ITL stability (worth it for large models / long prompts).</li><li>Larger batch = cheaper tokens but worse latency — expose as product tiers.</li><li>Cache affinity vs load balance; TP degree vs number of replicas (latency vs throughput, failure blast radius).</li><li>Build vs adopt (vLLM/SGLang/Dynamo) — adopt engines, own routing/scheduling/rollout where differentiation lies.</li></ul>`,nodes:[],edges:[]}
]});

D({id:'config',icon:'⚙️',title:'Design a global configuration rollout system',tags:['deploy','dist-sys','cicd'],for:'Cloudflare Principal (Config, Test, Deployment), Google infra, Anthropic Inference Velocity',
steps:[
{t:'Clarify requirements',ask:'What matters?',a:R`<ul><li>~300 PoPs, 100k machines; configs from many teams (WAF rules, routing, feature flags); change rate ~thousands/day.</li><li>Propagation: emergency path < 30 s globally; normal path staged over minutes–hours.</li><li>Safety: no global outage from a single bad change; automatic rollback; audit trail.</li><li>Consumers in C++/Rust/Go on edge machines; must keep working if the control plane is down.</li></ul>`,nodes:[['eng','Engineers / automation',60,60]],edges:[]},
{t:'Estimate',ask:'Sizes and fan-out?',a:R`<p>Config snapshot sizes from KB (flags) to hundreds of MB (rule sets/ML models). Deltas typically small. 100k consumers × 1 update/min = ~1.7k fetches/s — trivial if served from regional relays and local caches; push notifications with versions, pull content via content-addressed blobs (CDN-friendly).</p>`,nodes:[],edges:[]},
{t:'API & model',ask:'How do you represent a config change?',a:R`<pre>ConfigChange { id, owner, schema_version, payload_ref (content hash),
                validation_results, rollout_policy {stages, bake, health_gates},
                emergency: bool, author, reviewers }
Consumer API: Subscribe(namespace) -> stream<Version>; Fetch(hash) -> blob; Report(version, health)</pre>`,nodes:[['repo','Git + schema validation + tests',250,60]],edges:[['eng','repo','PR']]},
{t:'High-level design',ask:'Components?',a:R`<ul><li>Source of truth in git with CI: schema checks, semantic validators (regex complexity, rule linting), unit tests against recorded traffic.</li><li>Release controller: state machine per change across stages (canary machines → canary PoPs → region waves → global).</li><li>Distribution: versioned snapshot store (replicated KV / object store) + regional relays (fan-out), consumers watch and fetch.</li><li>Health mediation: subscribes to telemetry (error rates, CPU, crashes) per stage; gates promotion; triggers rollback.</li><li>Consumer library: validate-on-receive, atomic swap, last-known-good, version reporting.</li></ul>`,nodes:[['rel','Release controller',450,60],['kv','Versioned snapshot store',450,190],['relay','Regional relays',650,190],['edge','Edge consumers (LKG cache)',650,310],['healthm','Health mediation',250,310]],edges:[['repo','rel','approved'],['rel','kv','publish vN'],['kv','relay',''],['relay','edge','watch/fetch'],['edge','healthm','telemetry'],['healthm','rel','gate/rollback']]},
{t:'Deep dive: health mediation',ask:'How do you decide a stage is healthy?',a:R`<p>Compare canary cohort vs control cohort on SLIs (5xx rate, latency p99, CPU, crash loops, config apply failures) using statistical tests with minimum sample sizes; config-specific signals (rule match rates exploding). Bake time per stage scaled to risk; automatic rollback to last-known-good on failure, notify owner; emergency changes skip some bake but never skip validation and canary-machine stage.</p>`,nodes:[],edges:[]},
{t:'Failure modes',ask:'What can go wrong?',a:R`<ul><li>Config that crashes consumers (parser bug) → consumer-side validation in a sandbox/subprocess and LKG fallback; crash-loop detection reverts automatically.</li><li>Control plane down → edges keep LKG (fail static); emergency break-glass path.</li><li>Version skew between binaries and config schema → schema versioning, consumers accept N-1..N+1.</li><li>Partial propagation → convergence dashboards and alerts on stragglers.</li><li>Distribution system itself as SPOF → multi-region store, relays independent.</li></ul>`,nodes:[],edges:[]},
{t:'Staff-level trade-offs',ask:'What would you emphasize?',a:R`<ul><li>Speed vs safety: two lanes (normal staged, emergency fast) with explicit risk acceptance.</li><li>Push vs pull: push notifications + pull content (best of both).</li><li>Central validation vs consumer validation: both; defense in depth.</li><li>Organizational: config ownership, change review norms, blameless postmortems — the system encodes culture.</li></ul>`,nodes:[],edges:[]}
]});

D({id:'telemetry',icon:'🔭',title:'Design a telemetry pipeline for 10M devices / 100k servers',tags:['observability','storage-data','dist-sys'],for:'Clockwork Network Observability, NVIDIA Profiling Services, CrowdStrike, Google infra',
steps:[
{t:'Clarify requirements',ask:'What questions first?',a:R`<ul><li>Signals: metrics (counters/gauges/histograms), events/logs, traces, profiles? Per-device vs aggregated?</li><li>Freshness: dashboards within 30 s; alerts within 1 min; ad-hoc queries over 30 days; long-term rollups 13 months.</li><li>Volume and burstiness (incidents produce spikes); device connectivity intermittent.</li><li>Privacy/compliance (PII), multi-tenancy (customers see their own devices).</li></ul>`,nodes:[['dev','Devices / hosts (agents)',60,180]],edges:[]},
{t:'Estimate',ask:'How much data?',a:R`<p>10M devices × 1 event/10 s × 500 B = 500 MB/s (1M events/s) ≈ 43 TB/day raw; metrics from 100k servers × 2k series / 15 s ≈ 13M samples/s (~1.5 bytes/sample compressed ≈ 20 MB/s). Kafka: ~100–200 partitions for events. Storage: columnar compression 5–10× → ~5 TB/day events.</p>`,nodes:[],edges:[]},
{t:'High-level design',ask:'Draw the pipeline.',a:R`<ul><li>Agents: local batching, compression, sampling, cardinality guardrails, offline buffer, backoff with jitter.</li><li>Ingestion gateways (stateless, auth, rate limits) → durable log (Kafka) partitioned by tenant/device hash.</li><li>Stream processors: enrichment (device metadata), aggregation (rollups), anomaly detection, alert evaluation.</li><li>Stores: TSDB for metrics (Mimir/M3/Monarch-like), columnar store for events (ClickHouse/BigQuery), object storage for raw archive.</li><li>Query layer + dashboards + alerting.</li></ul>`,nodes:[['ingest','Ingestion gateways',250,180],['kafka','Durable log (Kafka)',450,180],['stream','Stream processing (rollups, alerts)',650,90],['tsdb','TSDB (metrics)',650,200],['olap','Columnar events store',650,310],['query','Query + dashboards',450,320]],edges:[['dev','ingest','batched OTLP'],['ingest','kafka',''],['kafka','stream',''],['stream','tsdb','rollups'],['kafka','olap','raw events'],['tsdb','query',''],['olap','query','']]},
{t:'Deep dive: cardinality & cost',ask:'How do you keep it affordable?',a:R`<p>Per-tenant series limits enforced at ingestion with feedback to owners; label allow-lists; device_id never a metric label (events only); recording rules/streaming rollups; tiered retention (raw 7 days, 1-min rollups 90 days, 1-h rollups 13 months); sampling of high-volume events with weights for unbiased estimates; tail-based sampling for traces.</p>`,nodes:[],edges:[]},
{t:'Failure modes',ask:'What breaks during an incident?',a:R`<ul><li>Ingest surge when everything is failing (exactly when you need data) → over-provision ingest, prioritize alert-critical streams, shed debug-level data first.</li><li>Reconnect storms from devices after an outage → jittered backoff and server-side admission control.</li><li>Kafka consumer lag → autoscale processors, alert on lag age.</li><li>Clock skew on devices → server receive timestamps alongside device timestamps.</li><li>Meta-monitoring: a separate, minimal pipeline watches the main one.</li></ul>`,nodes:[],edges:[]},
{t:'Staff-level trade-offs',ask:'Key trade-offs?',a:R`<ul><li>Freshness vs cost (stream processing vs batch).</li><li>Build vs buy (vendor costs scale with cardinality; in-house needs a team).</li><li>Push vs pull collection; agent footprint on constrained devices (CPU/RAM/bandwidth budgets).</li><li>Schema governance (OpenTelemetry semantic conventions) for long-term usability.</li></ul>`,nodes:[],edges:[]}
]});

D({id:'ota',icon:'📦',title:'Design OTA firmware updates for a device fleet',tags:['deploy','firmware','bringup','identity'],for:'Google Platforms & Devices, Ford, GM, Poly-like device makers, Tesla Optimus fleet',
steps:[
{t:'Clarify requirements',ask:'What do you need to know?',a:R`<ul><li>Fleet: 2M devices, many hardware SKUs/board revisions; connectivity (enterprise networks with proxies, cellular for vehicles/robots).</li><li>Image sizes (400 MB full, deltas 20–50 MB); update cadence monthly + emergency security fixes.</li><li>Safety: never brick; updates only when device idle (not during a meeting / while a robot is working).</li><li>Security: signed images, secure boot chain, anti-rollback.</li></ul>`,nodes:[['build','Build + sign pipeline',60,60]],edges:[]},
{t:'Estimate',ask:'Bandwidth and timing?',a:R`<p>Full image to 2M devices = 800 TB; deltas reduce to ~80 TB. Over 14 days ≈ 66 MB/s average (+ peaks) → CDN distribution. Device download at 5 Mb/s → 50 MB delta in ~80 s; install with A/B in background; reboot during maintenance window.</p>`,nodes:[],edges:[]},
{t:'High-level design',ask:'Components?',a:R`<ul><li>Build pipeline: reproducible images, SBOM, signing with HSM-held keys (offline root, online intermediate), delta generation per source version.</li><li>Update service: device inventory (SKU, current version, ring), rollout policies (rings, percentages, maintenance windows), assignment API.</li><li>CDN for artifacts; device agent polls with jitter or receives push nudge.</li><li>Device: download → verify signature/hash → write inactive slot → mark pending → reboot → health checks → commit or automatic rollback (boot counter).</li><li>Telemetry: update state machine events, post-update health (crash rate, boot time, key product metrics).</li></ul>`,nodes:[['upd','Update service (rings, policies)',300,60],['inv','Device inventory',300,190],['cdn','CDN (artifacts)',540,60],['devc','Device agent + A/B slots',540,250],['tele','Health telemetry',300,320]],edges:[['build','upd','release'],['build','cdn','artifacts'],['upd','inv',''],['devc','upd','check-in'],['cdn','devc','download'],['devc','tele','post-update health'],['tele','upd','halt/continue']]},
{t:'Deep dive: on-device safety',ask:'How do you guarantee no bricks?',a:R`<p>A/B partitions (or A/B + recovery), bootloader boot counter: new slot marked "trying" with N attempts; userspace health service commits only after checks pass (services up, network reachable, camera/audio self-test). Power-loss safety: write inactive slot only; atomic slot switch. Anti-rollback with eFuse/RPMB version counters — but allow rollback to the previous slot within the same security version. Watchdog resets fall back to the old slot.</p>`,nodes:[],edges:[]},
{t:'Deep dive: rollout policy',ask:'How do you stage it?',a:R`<p>Rings: internal dogfood → beta customers → 1% → 5% → 25% → 100%, stratified across SKUs, regions, network types. Automatic halt if update failure rate or post-update crash/KPI regressions exceed thresholds versus control cohort. Customer-controlled windows and deferral for enterprises. Emergency security lane with smaller rings but same safety mechanisms.</p>`,nodes:[],edges:[]},
{t:'Failure modes',ask:'What can go wrong?',a:R`<ul><li>Bad image passes tests but breaks a rare board revision → stratified canaries by SKU/rev, hardware-in-the-loop for each rev.</li><li>Signing key compromise → offline root, key rotation plan, revocation in bootloader.</li><li>CDN/backend overload → jittered polling, rate-limited assignment.</li><li>Devices offline for months → multi-hop updates or full images; minimum supported source versions.</li><li>Update during critical use → maintenance windows, user deferral, robots only update when docked.</li></ul>`,nodes:[],edges:[]},
{t:'Staff-level trade-offs',ask:'What would you highlight?',a:R`<ul><li>Delta vs full images (bandwidth vs complexity and failure modes).</li><li>Speed of security patching vs risk.</li><li>Fleet heterogeneity cost — push for fewer SKUs/board revs (organizational influence!).</li><li>Metrics: % fleet on latest within N days, update failure rate, rollback rate, bricked devices (target 0).</li></ul>`,nodes:[],edges:[]}
]});

D({id:'ratelimit',icon:'🚦',title:'Design a distributed rate limiter / API quota service',tags:['lb-traffic','dist-sys','identity'],for:'Cloudflare, Walmart, JPMorgan, OpenAI/Anthropic API platforms',
steps:[
{t:'Clarify requirements',ask:'What questions?',a:R`<ul><li>Limits per API key, per IP, per org; requests/s and tokens/min (LLM APIs); burst allowance.</li><li>Scale: 1M req/s across 20 regions, 500 gateway nodes.</li><li>Accuracy: exact vs approximate (within 5–10%); latency budget < 1 ms added.</li><li>Behavior on limiter failure: fail open or closed?</li></ul>`,nodes:[['cl','Clients',60,180]],edges:[]},
{t:'Algorithms',ask:'Which algorithm(s)?',a:R`<p>Token bucket (bursty, simple state: tokens + timestamp), sliding window counter (approximate smoothness, two counters per key), fixed window (cheap, edge bursts), sliding log (exact, expensive memory). Use token bucket for request rates; for token-based LLM quotas, deduct estimated tokens at admission and reconcile actual usage after completion.</p>`,nodes:[],edges:[]},
{t:'High-level design',ask:'Where does state live?',a:R`<ul><li>Gateways enforce locally with in-memory buckets (fast path), periodically syncing usage to a regional store (Redis cluster) — each gateway gets a share of the global limit, rebalanced based on observed traffic.</li><li>For strict limits: atomic Redis Lua scripts per request (adds ~0.5 ms RTT) or consistent-hash requests by key to an owner node.</li><li>Global limits across regions: async aggregation with per-region allotments.</li><li>Config service for limits per plan; observability for throttles.</li></ul>`,nodes:[['gwr','Gateways (local buckets)',260,180],['redis','Regional counter store',480,90],['agg','Global aggregator',480,280],['cfg','Limits config',260,320]],edges:[['cl','gwr','requests'],['gwr','redis','sync usage'],['redis','agg','async'],['agg','gwr','allotments'],['cfg','gwr','plans']]},
{t:'Failure modes',ask:'What if Redis is down?',a:R`<ul><li>Fail open with local-only limits (protect availability) for most APIs; fail closed for abuse-sensitive endpoints.</li><li>Hot keys (one huge customer) → dedicated shards, local pre-aggregation.</li><li>Clock skew → use store time or monotonic local time.</li><li>Retry storms from throttled clients → Retry-After headers, client SDK backoff with jitter.</li></ul>`,nodes:[],edges:[]},
{t:'Staff-level trade-offs',ask:'Key trade-offs?',a:R`<ul><li>Accuracy vs latency vs cost (local approximation vs central exactness).</li><li>Fairness across tenants under global overload (weighted fair queuing, priority tiers).</li><li>Product communication: limits visible in headers, dashboards; predictable behavior matters as much as precision.</li></ul>`,nodes:[],edges:[]}
]});

/* ---------------- pages ---------------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

A.pageDesign=function(){ const S=A.state;
  let h=`<h1>🏛️ System design drills</h1><div class="card"><p>Interactive walkthroughs for staff-level design rounds. Each step poses the question first — <b>answer out loud or on paper (45-minute clock, no AI)</b>, then reveal the coach’s answer and watch the architecture diagram grow. Finish all steps to log the drill (+60 XP).</p></div><div class="grid g2" style="margin-top:14px">`;
  A.drills.forEach(d=>{ const done=S.drills[d.id]; h+=`<div class="card mod ${done?'':''}" data-go="#/design/${d.id}"><div class="flex"><span class="ic">${d.icon}</span><div><b>${esc(d.title)}</b><div class="small muted">${d.steps.length} steps · for: ${esc(d.for)}</div></div></div>${done?'<div class="small" style="color:var(--good);margin-top:6px">✓ completed '+esc(String(done))+'</div>':''}</div>`; });
  A.main(h+'</div>'); };

A.pageDrill=function(id){ const S=A.state; const d=A.drills.find(x=>x.id===id); if(!d) return A.main('<p>Drill not found.</p>');
  let cur=0; const revealed=new Set();
  const nodeMap={}; d.steps.forEach((s,si)=>s.nodes.forEach(n=>nodeMap[n[0]]={id:n[0],label:n[1],x:n[2],y:n[3],step:si}));
  const edgesAll=[]; d.steps.forEach((s,si)=>s.edges.forEach(e=>edgesAll.push({a:e[0],b:e[1],l:e[2],step:si})));
  let h=`<div class="crumb"><a href="#/design">Design drills</a> / ${esc(d.title)}</div><h1>${d.icon} ${esc(d.title)}</h1><p class="muted small">Relevant for: ${esc(d.for)}</p>
  <div class="timer" style="margin-bottom:10px"><span id="dclock">45:00</span><button class="btn small primary" id="dstart">▶ Start 45-min clock</button><button class="btn small" id="dpause">⏸</button></div>
  <div class="flex" id="steps" style="flex-wrap:wrap;gap:6px;margin-bottom:12px"></div>
  <div class="diagram card"><svg id="dsvg" viewBox="0 0 860 380" style="width:100%;height:auto"></svg></div>
  <div class="card" id="stepcard" style="margin-top:12px"></div>
  <div class="navrow"><button class="btn" id="dprev">← Previous step</button><button class="btn primary" id="dnext">Next step →</button></div>`;
  A.main(h);
  const svg=$('#dsvg');
  function drawDiagram(){ let s='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c8db5"/></marker></defs>';
    edgesAll.filter(e=>e.step<=cur && nodeMap[e.a] && nodeMap[e.b]).forEach(e=>{ const A1=nodeMap[e.a], B=nodeMap[e.b]; const x1=A1.x+80,y1=A1.y+20,x2=B.x+80,y2=B.y+20; const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1; const sx=x1+dx/L*60, sy=y1+dy/L*24, ex=x2-dx/L*84, ey=y2-dy/L*26; const isNew=e.step===cur;
      s+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${isNew?'#22d3ee':'#56627d'}" stroke-width="${isNew?2.4:1.6}" marker-end="url(#ah)" class="${isNew?'edge-new':''}"/>`; if(e.l) s+=`<text x="${(sx+ex)/2}" y="${(sy+ey)/2-5}" fill="#93a1b8" font-size="11" text-anchor="middle">${esc(e.l)}</text>`; });
    Object.values(nodeMap).filter(n=>n.step<=cur).forEach(n=>{ const isNew=n.step===cur; s+=`<g class="${isNew?'node-new':''}" style="transform-origin:${n.x+80}px ${n.y+20}px"><rect x="${n.x}" y="${n.y}" width="160" height="40" rx="10" fill="${isNew?'#1d2b4a':'#141c2c'}" stroke="${isNew?'#a78bfa':'#2f3b55'}" stroke-width="${isNew?2:1.2}"/><text x="${n.x+80}" y="${n.y+24}" fill="#e6ecf7" font-size="11.5" text-anchor="middle">${esc(n.label.length>30?n.label.slice(0,29)+'…':n.label)}</text></g>`; });
    if(!Object.values(nodeMap).some(n=>n.step<=cur)) s+='<text x="430" y="190" fill="#56627d" font-size="14" text-anchor="middle">Diagram grows as you progress</text>';
    svg.innerHTML=s; }
  function drawSteps(){ $('#steps').innerHTML=d.steps.map((s,i)=>`<button class="step ${i===cur?'cur':''} ${revealed.has(i)?'on':''}" data-s="${i}">${i+1}. ${esc(s.t)}</button>`).join(''); document.querySelectorAll('#steps [data-s]').forEach(b=>b.onclick=()=>{ cur=+b.dataset.s; render(); }); }
  function render(){ const s=d.steps[cur]; drawSteps(); drawDiagram();
    $('#stepcard').innerHTML=`<div class="small muted">Step ${cur+1} of ${d.steps.length}</div><h2 style="margin-top:4px">${esc(s.t)}</h2><div class="callout"><b>Your turn:</b> ${esc(s.ask)} <span class="small muted">(think/write for 2–5 minutes first)</span></div>${revealed.has(cur)?`<div class="body">${A.util.prep(s.a)}</div>`:`<button class="btn primary" id="reveal">🔓 Reveal coach answer</button>`}`;
    const rb=$('#reveal'); if(rb) rb.onclick=()=>{ revealed.add(cur); render(); checkDone(); };
    $('#dprev').disabled=cur===0; $('#dnext').textContent=cur===d.steps.length-1?'Finish drill ✓':'Next step →'; }
  function checkDone(){ if(revealed.size===d.steps.length && !S.drills[d.id]){ S.drills[d.id]=new Date().toISOString().slice(0,10); A.award(60,'design drill complete'); A.confetti(); } }
  $('#dprev').onclick=()=>{ if(cur>0){ cur--; render(); } };
  $('#dnext').onclick=()=>{ revealed.add(cur); if(cur<d.steps.length-1){ cur++; render(); } else { render(); checkDone(); if(S.drills[d.id]) A.toast('Drill logged ✓'); } };
  let left=45*60, run=false, lt=0; const clk=$('#dclock'); const iv=setInterval(()=>{ if(!document.body.contains(clk)){ clearInterval(iv); return; } if(run){ const n=performance.now(); left-=(n-lt)/1000; lt=n; } const v=Math.max(0,Math.round(left)); clk.textContent=String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0'); clk.style.color=left<300?'var(--bad)':''; },250);
  $('#dstart').onclick=()=>{ if(!run){ run=true; lt=performance.now(); } }; $('#dpause').onclick=()=>{ run=false; };
  render(); };
})();

</script>

<script>/* js/skillmap.js */

(function(){
const A=window.ACADEMY, esc=s=>A.util.esc(s);
A.pageSkills=function(){

  <div class="card"><div class="ctrls" style="margin:0 0 10px">
   <label>Source <select id="fSrc"><option value="new">Oct alerts only</option><option value="all">Alerts + Sep saved</option><option value="saved">Sep saved only</option></select></label>

   <canvas id="bub" style="width:100%;aspect-ratio:900/480;background:#070b14;border-radius:12px"></canvas><div id="tip" class="readout">Hover a bubble.</div></div>

  A.main(h);
  const cv=document.getElementById('bub'); const W=900,H=480; const dpr=Math.min(2,devicePixelRatio||1); cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  let pts=[], t0=performance.now();
  function jobsFor(s){ return D.jobs.filter(j=>j.skills.includes(s.id) && (st.src==='all'||(st.src==='new'?j.source==='oct-alerts':j.source==='sep-saved')) && (st.comp==='all'||j.company===st.comp)); }

  const col={core:'#7c5cff',adjacent:'#22d3ee',optional:'#94a3b8'};
  function draw(){ const k=Math.min(1,(performance.now()-t0)/700); const e=1-Math.pow(1-k,3); ctx.fillStyle='#070b14'; ctx.fillRect(0,0,W,H);
    const x0=70,x1=870,y0=430,y1=30; ctx.strokeStyle='#1b2536'; for(let i=1;i<=5;i++){ const x=x0+(i-0.5)/5*(x1-x0), y=y0-(i-0.5)/5*(y0-y1); ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); ctx.fillStyle='#64748b'; ctx.font='11px system-ui'; ctx.textAlign='center'; ctx.fillText(i,x,y0+16); ctx.textAlign='right'; ctx.fillText(i,x0-8,y+4); }

    ctx.fillStyle='rgba(52,211,153,.06)'; ctx.fillRect(x0+(3.5/5)*(x1-x0)*0.98,y1,(x1-x0)*0.32,(y0-y1)*0.3); ctx.fillStyle='#34d39988'; ctx.textAlign='right'; ctx.fillText('sweet spot: durable + redeployable',x1-6,y1+14);
    const F=filtered(); const maxN=Math.max(1,...F.map(f=>f.n)); pts=[];
    const jitter={}; F.forEach(f=>{ const key=f.s.aiHard+','+f.s.robotics; jitter[key]=(jitter[key]||0)+1; const j=jitter[key]-1; const ang=j*2.4, rad=j?14+j*7:0;
      const x=x0+(f.s.aiHard-0.5)/5*(x1-x0)+Math.cos(ang)*rad, y=y0-(f.s.robotics-0.5)/5*(y0-y1)+Math.sin(ang)*rad; const r=(6+Math.sqrt(f.n/maxN)*26)*e; pts.push({x,y,r,f});
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=col[f.s.tier]+(st.sel===f.s.id?'ff':'88'); ctx.fill(); ctx.strokeStyle=f.s.polyBuilds==='yes'?'#fbbf24':f.s.polyBuilds==='partial'?'#fbbf2466':'transparent'; ctx.lineWidth=2; ctx.stroke();
      if(r>15){ ctx.fillStyle='#fff'; ctx.font='bold 10px system-ui'; ctx.textAlign='center'; ctx.fillText(f.s.name.split(/[ (]/)[0].slice(0,12),x,y+3); } });
    ctx.textAlign='left'; [['core','#7c5cff'],['adjacent','#22d3ee'],['optional','#94a3b8']].forEach((l,i)=>{ ctx.fillStyle=l[1]; ctx.beginPath(); ctx.arc(x0+10+i*90,y1-14,6,0,7); ctx.fill(); ctx.fillStyle='#cbd5e1'; ctx.fillText(l[0],x0+20+i*90,y1-10); }); ctx.strokeStyle='#fbbf24'; ctx.beginPath(); ctx.arc(x0+300,y1-14,6,0,7); ctx.stroke(); ctx.fillStyle='#cbd5e1'; ctx.fillText('gold ring = builds on Poly',x0+310,y1-10);
    if(k<1) requestAnimationFrame(draw); }
  function hit(ev){ const r=cv.getBoundingClientRect(); const x=(ev.clientX-r.left)*W/r.width, y=(ev.clientY-r.top)*H/r.height; return pts.filter(p=>Math.hypot(p.x-x,p.y-y)<p.r).sort((a,b)=>a.r-b.r)[0]; }
  cv.onmousemove=ev=>{ const p=hit(ev); const tip=document.getElementById('tip'); if(!p){ tip.textContent='Hover a bubble.'; return; } const s=p.f.s; tip.textContent=`${s.name} — ${p.f.n} job(s) [${jobsFor(s).map(j=>j.company).filter((v,i,a)=>a.indexOf(v)===i).join(', ')}]\ntier ${s.tier} · AI-hard ${s.aiHard}/5 · robotics ${s.robotics}/5 · Poly: ${s.polyBuilds} (${s.polyNote})`; };
  cv.onclick=ev=>{ const p=hit(ev); if(p) select(p.f.s.id); };
  function select(id){ st.sel=id; const s=D.skills.find(x=>x.id===id); const js=jobsFor(s); const ls=[]; A.modules.forEach(m=>m.lessons.forEach(l=>{ if((l.skills||[]).includes(id)) ls.push([m,l]); }));
    document.getElementById('detail').innerHTML=`<h3>${esc(s.name)}</h3><div><span class="tag ${s.tier}">${s.tier}</span><span class="tag">AI-hard ${s.aiHard}/5</span><span class="tag">robotics ${s.robotics}/5</span><span class="tag">Poly: ${s.polyBuilds}</span></div><p class="small">${esc(s.polyNote)}</p><b>${js.length} job(s) in current filter</b><ul class="small">${js.map(j=>`<li>${esc(j.company)} — ${esc(j.title)} <span class="tag ${j.evidence==='sampled'?'verified':'inferred'}">${j.evidence}</span></li>`).join('')}</ul><b>Lessons teaching it</b><div class="small">${ls.map(([m,l])=>`<a href="#/l/${m.id}/${l.id}">${m.icon} ${esc(l.title)}</a>`).join('<br>')||'<span class="muted">Covered via practice (gym/drills)</span>'}</div>`; t0=performance.now()-700; draw(); }
  function top10(){ document.getElementById('top10').innerHTML=D.topNewAlertSkills.map(s=>`<li><a href="#" data-sk="${s.id}">${esc(s.name)}</a> — <b>${s.newAlertCount}</b> postings <span class="small muted">(${s.companies.length} cos)</span></li>`).join(''); document.querySelectorAll('[data-sk]').forEach(a=>a.onclick=e=>{e.preventDefault(); select(a.dataset.sk);}); }
  function heat(){ const F=filtered().sort((a,b)=>b.n-a.n); const cs=comps.filter(c=>D.jobs.some(j=>j.company===c && (st.src==='all'||(st.src==='new'?j.source==='oct-alerts':j.source==='sep-saved')))); 
    let t='<table class="heat"><tr><th></th>'+cs.map(c=>`<th class="rot"><div>${esc(c)}</div></th>`).join('')+'<th>Σ</th></tr>';
    F.forEach(f=>{ t+=`<tr><td class="sk" data-sk="${f.s.id}"><span class="tag ${f.s.tier}" style="margin:0 6px 0 0">${f.s.tier[0].toUpperCase()}</span>${esc(f.s.name)}</td>`; cs.forEach(c=>{ const n=jobsFor(f.s).filter(j=>j.company===c).length; t+=`<td style="background:${n?`rgba(124,92,255,${0.25+Math.min(1,n/4)*0.75})`:'#0f1522'}" title="${esc(c)}: ${n}">${n||''}</td>`; }); t+=`<td><b>${f.n}</b></td></tr>`; });
    document.getElementById('heat').innerHTML=t+'</table>'; document.querySelectorAll('#heat [data-sk]').forEach(td=>td.onclick=()=>{ select(td.dataset.sk); window.scrollTo({top:0,behavior:'smooth'}); }); }
  const upd=()=>{ t0=performance.now(); draw(); heat(); };
  document.getElementById('fSrc').onchange=e=>{st.src=e.target.value; upd();}; document.getElementById('fTier').onchange=e=>{st.tier=e.target.value; upd();}; document.getElementById('fComp').onchange=e=>{st.comp=e.target.value; upd();}; document.getElementById('fPoly').onchange=e=>{st.poly=e.target.checked; upd();};

<script>/* js/core.js */
/* Skills Academy core: state, gamification, router, renderers. Vanilla JS, works from file:// */
(function(){
const A = window.ACADEMY;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const unent = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
const prep = s => String(s||'').replace(/<pre>([\s\S]*?)<\/pre>|<code>([\s\S]*?)<\/code>/g,(m,pre,code)=> pre!==undefined ? '<pre><code>'+esc(unent(pre.replace(/^\n/,'')))+'</code></pre>' : '<code>'+esc(unent(code))+'</code>');
A.util = { esc, prep };

/* ---------------- state ---------------- */
const KEY='skillsAcademy.v2';
const S = Object.assign({xp:0,done:{},quiz:{},chal:{},gym:{},drills:{},streak:{last:null,count:0,best:0},badges:{},lens:null,honor:0,visited:{}}, JSON.parse(localStorage.getItem(KEY)||'{}'));
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
A.state = S;
const today = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function bumpStreak(){ const t=today(); if(S.streak.last===t) return; const y=new Date(Date.now()-864e5); const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0'); S.streak.count = S.streak.last===ys ? S.streak.count+1 : 1; S.streak.last=t; S.streak.best=Math.max(S.streak.best,S.streak.count); }
const LEVELS=['Bring-up Apprentice','Driver Journeyman','Kernel Hacker','Perf Whisperer','Systems Sensei','Staff Material','Principal Architect','Distinguished Engineer','Fellow'];
function levelInfo(xp){ let lvl=1, need=200, base=0; while(xp>=base+need){ base+=need; lvl++; need=Math.round(need*1.25); } return {lvl, title:LEVELS[Math.min(LEVELS.length-1,lvl-1)], into:xp-base, need}; }
function award(n, why){ const before=levelInfo(S.xp).lvl; S.xp+=n; bumpStreak(); checkBadges(); save(); toast('+'+n+' XP · '+why); const after=levelInfo(S.xp); if(after.lvl>before){ setTimeout(()=>{toast('LEVEL UP! Lv '+after.lvl+' — '+after.title); confetti();},700); } renderTop(); }
A.award = award;

/* ---------------- helpers ---------------- */
function allLessons(){ const out=[]; A.modules.forEach(m=>m.lessons.forEach(l=>out.push({m,l}))); return out; }
function modProgress(m){ const d=m.lessons.filter(l=>S.done[m.id+'/'+l.id]).length; return {d, n:m.lessons.length, f:m.lessons.length?d/m.lessons.length:0}; }
function lensSkills(){ if(!S.lens) return null; const j=A.jobs.find(j=>j.id===S.lens); return j? new Set(j.skills):null; }
function lessonLensed(l){ const ls=lensSkills(); return ls && (l.skills||[]).some(s=>ls.has(s)); }
function moduleLensed(m){ return m.lessons.some(lessonLensed); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2300); }
function confetti(){ const c=document.createElement('canvas'); c.className='confetti'; c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c); const x=c.getContext('2d'); const P=[]; for(let i=0;i<160;i++) P.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-14-2,c:`hsl(${Math.random()*360} 90% 60%)`,s:4+Math.random()*5,r:Math.random()*6}); let f=0; (function a(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=0.2; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); x.restore();}); if(++f<120) requestAnimationFrame(a); else c.remove(); })(); }

/* ---------------- badges ---------------- */
function badgeDefs(){ const b=A.modules.map(m=>({id:'mod-'+m.id,e:m.icon,n:m.short||m.title,test:()=>modProgress(m).f===1}));
  const quizRight=Object.values(S.quiz).filter(x=>x===true).length; const gymSolved=Object.values(S.gym).filter(g=>g.solved).length;
  return b.concat([{id:'first',e:'🚀',n:'First lesson',test:()=>Object.keys(S.done).length>=1},{id:'ten',e:'🔟',n:'10 lessons',test:()=>Object.keys(S.done).length>=10},{id:'half',e:'🌗',n:'Half the academy',test:()=>Object.keys(S.done).length>=Math.ceil(allLessons().length/2)},
    {id:'quiz25',e:'🎯',n:'25 quiz hits',test:()=>quizRight>=25},{id:'quiz100',e:'🏹',n:'100 quiz hits',test:()=>quizRight>=100},{id:'streak3',e:'🔥',n:'3-day streak',test:()=>S.streak.best>=3},{id:'streak7',e:'☄️',n:'7-day streak',test:()=>S.streak.best>=7},
    {id:'gym5',e:'🏋️',n:'5 gym problems',test:()=>gymSolved>=5},{id:'gym20',e:'🥇',n:'All gym problems',test:()=>gymSolved>=A.gym.length},{id:'honor10',e:'🛡️',n:'10 no-AI attempts',test:()=>S.honor>=10},{id:'arch',e:'🏛️',n:'All design drills',test:()=>A.drills.every(d=>S.drills[d.id])}]); }
function checkBadges(){ badgeDefs().forEach(b=>{ if(!S.badges[b.id] && b.test()){ S.badges[b.id]=today(); setTimeout(()=>{ toast('Badge unlocked: '+b.e+' '+b.n); confetti(); },400); } }); }

/* ---------------- layout ---------------- */
function renderSide(){ const r=location.hash||'#/';
  const link=(h,ic,t,extra='')=>`<a href="${h}" class="${r===h||(h!=='#/'&&r.startsWith(h+'/'))?'active':''}">${ic} ${t}${extra}</a>`;
  let h=`<div class="brand"><div class="logo">⚡</div><div>Skills Academy<div class="small muted" style="font-weight:500">Chandra Vig · v2</div></div></div><nav class="nav">`+
  link('#/','🏠','Dashboard')+link('#/path','🧭','Learning path')+link('#/skills','🗺️','Skill map')+link('#/jobs','🎯','Job lens')+link('#/gym','🏋️','Interview gym')+link('#/design','🏛️','Design drills')+link('#/progress','🏅','Progress & badges')+
  `<div class="sec">Modules</div>`;
  A.modules.forEach(m=>{ const p=modProgress(m); h+=link('#/m/'+m.id,m.icon,(m.short||m.title),`<span class="mprog">${p.d}/${p.n}${moduleLensed(m)?' 🎯':''}</span>`); });
  h+=`<div class="sec">v1 hub</div><a href="../learning-hub/index.html">📦 Learning Hub v1 <span class="small muted">(tar.gz package)</span></a></nav>`;
  $('#side').innerHTML=h; }
function renderTop(){ const L=levelInfo(S.xp); const lens=S.lens&&A.jobs.find(j=>j.id===S.lens);
  $('#top').innerHTML=`<span class="pill">⭐ Lv ${L.lvl} · ${L.title}</span><div class="xpbar" title="${L.into}/${L.need} XP to next level"><i style="width:${(L.into/L.need*100).toFixed(1)}%"></i></div><span class="pill">✨ ${S.xp} XP</span><span class="pill">🔥 ${S.streak.count}-day streak</span>`+(lens?`<span class="pill" style="border-color:var(--warn)">🎯 Lens: ${esc(lens.company)} — ${esc(lens.short)} <a href="#" id="clrLens" style="margin-left:6px">✕</a></span>`:`<a class="pill" href="#/jobs">🎯 pick a job lens</a>`);
  const c=$('#clrLens'); if(c) c.onclick=e=>{e.preventDefault(); S.lens=null; save(); route();}; }

/* ---------------- radar ---------------- */
function radar(canvas){ const ctx=canvas.getContext('2d'); const W=canvas.width=520, H=canvas.height=420; const cx=W/2, cy=H/2+6, R=150; const mods=A.modules; const n=mods.length; let t=0;
  function frame(){ t=Math.min(1,t+0.03); ctx.clearRect(0,0,W,H);
    for(let ring=1;ring<=4;ring++){ ctx.beginPath(); for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2-Math.PI/2; const x=cx+R*ring/4*Math.cos(a), y=cy+R*ring/4*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.strokeStyle='#26324a'; ctx.stroke(); }
    mods.forEach((m,i)=>{ const a=i/n*Math.PI*2-Math.PI/2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a)); ctx.strokeStyle='#1b2536'; ctx.stroke(); ctx.fillStyle='#93a1b8'; ctx.font='11px system-ui'; ctx.textAlign=Math.cos(a)>0.2?'left':Math.cos(a)<-0.2?'right':'center'; ctx.fillText(m.icon+' '+(m.short||m.title),cx+(R+14)*Math.cos(a),cy+(R+14)*Math.sin(a)+4); });
    ctx.beginPath(); mods.forEach((m,i)=>{ const p=modProgress(m); const quizBonus=m.lessons.reduce((s,l)=>s+(l.quiz||[]).filter((q,k)=>S.quiz[m.id+'/'+l.id+'/'+k]===true).length,0)/Math.max(1,m.lessons.reduce((s,l)=>s+(l.quiz||[]).length,0)); const v=Math.max(0.04,(p.f*0.75+quizBonus*0.25))*t; const a=i/n*Math.PI*2-Math.PI/2; const x=cx+R*v*Math.cos(a), y=cy+R*v*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath();
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R); g.addColorStop(0,'rgba(124,92,255,.55)'); g.addColorStop(1,'rgba(34,211,238,.35)'); ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2; ctx.stroke();
    if(t<1) requestAnimationFrame(frame); }
  frame(); }

/* ---------------- pages ---------------- */
function nextLesson(){ for(const id of A.path.order){ const [m,l]=id.split('/'); if(!S.done[id]) { const mod=A.modules.find(x=>x.id===m); const les=mod&&mod.lessons.find(x=>x.id===l); if(les) return {m:mod,l:les}; } } return null; }
function pageHome(){ const tot=allLessons().length, done=Object.keys(S.done).length; const nl=nextLesson(); const quizN=allLessons().reduce((s,x)=>s+(x.l.quiz||[]).length,0);
  let h=`<div class="hero"><div class="card"><div class="big">Deep systems, playable.</div><p class="muted">${A.modules.length} modules · ${tot} lessons · ${Object.keys(SIMS).length} interactive simulations · ${quizN} quiz questions · ${A.gym.length} gym problems · ${A.drills.length} design drills. Built from your Oct 2026 job alerts + your Sep skill map. Core systems first, then GPU/inference and distributed/networking, with robotics woven in.</p>
  <div class="stat"><div><b>${done}/${tot}</b><span>lessons done</span></div><div><b>${Object.values(S.quiz).filter(x=>x===true).length}</b><span>quiz hits</span></div><div><b>${Object.values(S.gym).filter(g=>g.solved).length}/${A.gym.length}</b><span>gym solved</span></div><div><b>${Object.keys(S.badges).length}</b><span>badges</span></div></div>
  <div class="flex" style="margin-top:16px">${nl?`<a class="btn primary" href="#/l/${nl.m.id}/${nl.l.id}">▶ Continue: ${esc(nl.m.icon+' '+nl.l.title)}</a>`:'<span class="pill">🎉 Path complete</span>'}<a class="btn" href="#/path">🧭 Learning path</a><a class="btn" href="#/jobs">🎯 Job lens</a><a class="btn" href="#/gym">🏋️ Gym</a></div></div>
  <div class="card" style="text-align:center"><h3 style="margin:0">Skill radar</h3><canvas id="radar" style="width:100%;max-width:520px"></canvas><div class="small muted">Fills as you finish lessons (75%) and ace quizzes (25%).</div></div></div>
  <h2 style="margin-top:26px">Modules</h2><div class="grid g3">`;
  A.modules.forEach(m=>{ const p=modProgress(m); h+=`<div class="card mod ${moduleLensed(m)?'lensed':''}" data-go="#/m/${m.id}"><div class="flex"><span class="ic">${m.icon}</span><div><div class="small muted">Module ${m.num} · <span class="tag ${m.tier}">${m.tier}</span></div><b>${esc(m.title)}</b></div></div><p class="small muted" style="margin:8px 0 0">${esc(m.summary)}</p><div class="bar"><i style="width:${p.f*100}%"></i></div><div class="small muted" style="margin-top:4px">${p.d}/${p.n} lessons${S.badges['mod-'+m.id]?' · 🏅':''}</div></div>`; });
  h+='</div>'; main(h); radar($('#radar')); }

function pageModule(id){ const m=A.modules.find(x=>x.id===id); if(!m) return main('<p>Module not found.</p>'); const p=modProgress(m);
  let h=`<div class="crumb"><a href="#/">Dashboard</a> / Module ${m.num}</div><div class="card"><div class="flex"><span style="font-size:42px">${m.icon}</span><div><h1 style="margin:0">${esc(m.title)}</h1><span class="tag ${m.tier}">${m.tier}</span> <span class="small muted">${p.d}/${p.n} complete</span></div></div><p>${esc(m.summary)}</p>${m.why?`<div class="callout"><b>Why it matters for your targets:</b> ${m.why}</div>`:''}</div><div class="lessonlist" style="margin-top:14px">`;
  m.lessons.forEach((l,i)=>{ const d=S.done[m.id+'/'+l.id]; h+=`<div class="li ${d?'done':''} ${lessonLensed(l)?'lensed':''}" data-go="#/l/${m.id}/${l.id}"><span class="chk">${d?'✓':i+1}</span><div style="flex:1"><b>${esc(l.title)}</b><div class="small muted">${l.minutes||25} min · ${(l.sims||[]).length} sim(s) · ${(l.quiz||[]).length} quiz Qs${lessonLensed(l)?' · 🎯 needed for lens':''}</div></div><span class="small muted">→</span></div>`; });
  main(h+'</div>'); }

function pageLesson(mid,lid){ const m=A.modules.find(x=>x.id===mid); const l=m&&m.lessons.find(x=>x.id===lid); if(!l) return main('<p>Lesson not found.</p>');
  const key=mid+'/'+lid; S.visited[key]=1; save(); const idx=m.lessons.indexOf(l); const all=allLessons(); const gi=all.findIndex(x=>x.l===l); const prev=all[gi-1], next=all[gi+1];
  const skillNames=(l.skills||[]).map(s=>{ const sk=A.skills&&A.skills.skills.find(x=>x.id===s); return sk?sk.name:s; });
  let h=`<div class="crumb"><a href="#/">Dashboard</a> / <a href="#/m/${m.id}">${m.icon} ${esc(m.title)}</a> / Lesson ${idx+1}</div>
  <div class="lesson-head"><div><h1>${esc(l.title)}</h1><div>${skillNames.map(n=>`<span class="tag">${esc(n)}</span>`).join('')} <span class="small muted">· ~${l.minutes||25} min</span></div></div>
  <div>${S.done[key]?'<span class="pill" style="border-color:var(--good)">✓ completed</span>':'<button class="btn good" id="complete">✓ Mark lesson complete (+50 XP)</button>'}</div></div>
  <div class="analogy"><b>Analogy hook · </b>${l.analogy}</div>
  <div class="body">${prep(l.body)}</div>
  <div id="sims"></div>
  <div class="poly"><h4>🔌 Poly connection</h4>${prep(l.poly)}</div>`;
  if(l.quiz&&l.quiz.length){ h+=`<div class="section quiz"><h3>🧠 Quiz</h3>`; l.quiz.forEach((q,k)=>{ const qk=key+'/'+k; const st=S.quiz[qk]; h+=`<div class="q ${st!==undefined?'done':''}" data-qk="${qk}" data-a="${q.a}"><div class="kind">${q.code?'predict the output / behavior':'multiple choice'}</div><div><b>${prep(q.q)}</b></div>${q.code?'<pre>'+esc(q.code)+'</pre>':''}${q.opts.map((o,i)=>`<button class="opt ${st!==undefined&&i===q.a?'right':''}" data-i="${i}">${String.fromCharCode(65+i)}. ${prep(o)}</button>`).join('')}<div class="exp">${prep(q.exp)}</div></div>`; }); h+='</div>'; }
  if(l.challenge){ const c=l.challenge; h+=`<div class="section"><h3>🛠️ Hands-on challenge</h3><div class="card">${prep(c.prompt)}<div id="hints"></div><div class="flex" style="margin-top:10px"><button class="btn" id="hintBtn">💡 Reveal hint 1/${c.hints.length}</button><button class="btn" id="solBtn">🔓 Show solution sketch</button>${S.chal[key]?'<span class="pill">✓ attempted</span>':'<button class="btn good" id="chalDone">I attempted it myself (+20 XP)</button>'}</div><div id="sol" style="display:none;margin-top:10px">${c.solution.trim().startsWith('<')?prep(c.solution):'<pre>'+esc(c.solution)+'</pre>'}</div></div></div>`; }
  if(l.interview&&l.interview.length){ h+=`<div class="section"><h3>🎤 Interview angle</h3>`; l.interview.forEach(iq=>{ h+=`<details class="iq"><summary>${prep(iq.q)}</summary><div style="margin-top:8px">${prep(iq.a)}</div></details>`; }); h+='</div>'; }
  if(l.resources&&l.resources.length){ h+=`<div class="section res"><h3>📚 Further resources</h3>`+l.resources.map(r=>`<a href="${r[1]}" target="_blank" rel="noopener">↗ ${esc(r[0])}</a>`).join('')+'</div>'; }
  h+=`<div class="navrow">${prev?`<a class="btn" href="#/l/${prev.m.id}/${prev.l.id}">← ${esc(prev.l.title)}</a>`:'<span></span>'}${next?`<a class="btn primary" href="#/l/${next.m.id}/${next.l.id}">${esc(next.l.title)} →</a>`:''}</div>`;
  main(h);
  (l.sims||[]).forEach(s=>mountSim($('#sims'),s));
  const cb=$('#complete'); if(cb) cb.onclick=()=>{ S.done[key]=today(); award(50,'lesson complete'); const mp=modProgress(m); if(mp.f===1) confetti(); route(); };
  document.querySelectorAll('.q').forEach(qe=>{ qe.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const qk=qe.dataset.qk, a=+qe.dataset.a, i=+b.dataset.i; if(qe.classList.contains('done')) return;
    if(i===a){ b.classList.add('right'); qe.classList.add('done'); if(S.quiz[qk]===undefined){ S.quiz[qk]=true; award(10,'quiz correct'); } }
    else { b.classList.add('wrong'); if(S.quiz[qk]===undefined){ S.quiz[qk]=false; save(); } setTimeout(()=>{ qe.querySelector(`.opt[data-i="${a}"]`).classList.add('right'); qe.classList.add('done'); },500); } }); });
  if(l.challenge){ let hi=0; const hb=$('#hintBtn'); hb.onclick=()=>{ if(hi<l.challenge.hints.length){ const d=document.createElement('div'); d.className='hint'; d.innerHTML='💡 <b>Hint '+(hi+1)+':</b> '+prep(l.challenge.hints[hi]); $('#hints').appendChild(d); hi++; hb.textContent=hi<l.challenge.hints.length?'💡 Reveal hint '+(hi+1)+'/'+l.challenge.hints.length:'All hints shown'; if(hi>=l.challenge.hints.length) hb.disabled=true; } };
    $('#solBtn').onclick=()=>{ const s=$('#sol'); s.style.display=s.style.display==='none'?'block':'none'; };
    const cd=$('#chalDone'); if(cd) cd.onclick=()=>{ S.chal[key]=1; award(20,'challenge attempted'); route(); }; }
}

function pagePath(){ let h=`<h1>🧭 Learning path</h1><p class="muted">Ordered by your priority: deepen the systems core (which every target job tests), then GPU/inference and distributed/networking, with robotics threaded through so the Optimus option stays alive. Mapped to the 6–12 month plan; ~5-6 focused hours/week of academy time plus Poly work and the gym.</p>`;
  A.path.phases.forEach(ph=>{ const ids=ph.lessons; const done=ids.filter(id=>S.done[id]).length; h+=`<div class="phase"><h2>${esc(ph.title)} <span class="small muted">${done}/${ids.length}</span></h2><p class="muted">${ph.desc}</p><div class="lessonlist">`;
    ids.forEach(id=>{ const [mid,lid]=id.split('/'); const m=A.modules.find(x=>x.id===mid); const l=m&&m.lessons.find(x=>x.id===lid); if(!l) return; const d=S.done[id]; h+=`<div class="li ${d?'done':''} ${lessonLensed(l)?'lensed':''}" data-go="#/l/${mid}/${lid}"><span class="chk">${d?'✓':''}</span><span>${m.icon}</span><div style="flex:1"><b>${esc(l.title)}</b> <span class="small muted">· ${esc(m.short||m.title)}</span></div></div>`; });
    h+=`</div>${ph.also?`<div class="callout small">${ph.also}</div>`:''}</div>`; });
  main(h); }

function pageJobs(){ let h=`<h1>🎯 Job lens</h1><p class="muted">Pick a target role. The app highlights (🎯 / amber border) every module and lesson that teaches a skill that job asks for, and shows your readiness. Requirements were sampled from live postings where available (✓ sampled) or inferred from the title (≈ inferred).</p><div class="grid g2">`;
  A.jobs.forEach(j=>{ const ls=new Set(j.skills); const needed=allLessons().filter(x=>(x.l.skills||[]).some(s=>ls.has(s))); const d=needed.filter(x=>S.done[x.m.id+'/'+x.l.id]).length; const on=S.lens===j.id;
    h+=`<div class="card ${on?'mod lensed':''}"><div class="flex" style="justify-content:space-between"><div><b>${esc(j.company)}</b> <span class="tag ${j.evidence==='sampled'?'verified':'inferred'}">${j.evidence==='sampled'?'✓ sampled':'≈ inferred'}</span><div>${esc(j.title)}</div></div><button class="btn ${on?'good':'primary'} small" data-lens="${j.id}">${on?'Active':'Use lens'}</button></div>
    <div class="small muted" style="margin:6px 0">${j.skills.map(s=>{const sk=A.skills.skills.find(x=>x.id===s); return '<span class="tag">'+esc(sk?sk.name:s)+'</span>';}).join('')}</div>
    <div class="mod"><div class="bar"><i style="width:${needed.length?d/needed.length*100:0}%"></i></div></div><div class="small muted">Readiness: ${d}/${needed.length} relevant lessons done${j.note?' · '+esc(j.note):''}</div></div>`; });
  main(h+'</div>');
  document.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{ S.lens=S.lens===b.dataset.lens?null:b.dataset.lens; save(); route(); }); }

function pageProgress(){ const defs=badgeDefs(); let h=`<h1>🏅 Progress & badges</h1><div class="card"><div class="stat"><div><b>${S.xp}</b><span>XP</span></div><div><b>${levelInfo(S.xp).lvl}</b><span>${levelInfo(S.xp).title}</span></div><div><b>${S.streak.count} / ${S.streak.best}</b><span>streak now / best</span></div><div><b>${Object.keys(S.done).length}</b><span>lessons</span></div><div><b>${S.honor}</b><span>no-AI gym attempts</span></div></div></div><h2 style="margin-top:20px">Badges</h2><div>`;
  defs.forEach(b=>{ h+=`<div class="badge ${S.badges[b.id]?'on':''}" title="${S.badges[b.id]?'earned '+S.badges[b.id]:'locked'}"><span class="e">${b.e}</span>${esc(b.n)}</div>`; });
  h+=`</div><h2 style="margin-top:20px">Per-module</h2><div class="grid g3">`+A.modules.map(m=>{const p=modProgress(m); return `<div class="card mod" data-go="#/m/${m.id}"><b>${m.icon} ${esc(m.short||m.title)}</b><div class="bar"><i style="width:${p.f*100}%"></i></div><div class="small muted">${p.d}/${p.n}</div></div>`;}).join('')+`</div>
  <h2 style="margin-top:20px">Backup</h2><div class="flex"><button class="btn" id="exp">⬇ Export progress JSON</button><label class="btn">⬆ Import<input type="file" id="imp" accept=".json" style="display:none"></label><button class="btn" id="rst" style="border-color:var(--bad)">Reset all progress</button></div><p class="small muted">Progress lives in this browser’s localStorage (key ${KEY}). Export before switching computers/browsers.</p>`;
  main(h);
  $('#exp').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); a.download='skills-academy-progress.json'; a.click(); };
  $('#imp').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ Object.assign(S,JSON.parse(t)); save(); toast('Progress imported'); route(); }catch(err){ toast('Invalid file'); } }); };
  $('#rst').onclick=()=>{ if(confirm('Reset ALL progress?')){ localStorage.removeItem(KEY); location.reload(); } }; }

/* ---------------- router ---------------- */
function main(h){ $('#main').innerHTML=h; document.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{ if(e.target.closest('a,button')) return; location.hash=el.dataset.go; }); window.scrollTo(0,0); }
A.main = main;
function route(){ const h=location.hash||'#/'; const p=h.slice(2).split('/'); renderSide(); renderTop();
  try{
    if(p[0]===''||p[0]===undefined) pageHome();
    else if(p[0]==='m') pageModule(p[1]);
    else if(p[0]==='l') pageLesson(p[1],p[2]);
    else if(p[0]==='path') pagePath();
    else if(p[0]==='jobs') pageJobs();
    else if(p[0]==='progress') pageProgress();
    else if(p[0]==='skills') A.pageSkills();
    else if(p[0]==='gym') p[1]?A.pageGymProblem(p[1]):A.pageGym();
    else if(p[0]==='design') p[1]?A.pageDrill(p[1]):A.pageDesign();
    else pageHome();
  }catch(e){ console.error(e); main('<div class="card"><h2>Render error</h2><pre>'+esc(e.stack||e)+'</pre></div>'); }
}
A.route = route; A.save = save; A.toast=toast; A.confetti=confetti; A.modProgress=modProgress;
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', ()=>{ A.modules.sort((a,b)=>a.num-b.num); route(); });
})();

</script>
