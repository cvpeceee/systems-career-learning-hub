{id:'sched',title:'The scheduler: CFS/EEVDF, priorities & RT classes',minutes:30,skills:['linux-kernel','realtime','concurrency'],sims:['scheduler'],
analogy:R`A <b>fair playground slide</b>: each kid keeps a tally of how long they have slid (vruntime). The kid with the smallest tally goes next. Bigger kids (higher weight, lower nice) get their tally increased more slowly, so they go more often. Emergency vehicles (SCHED_FIFO) skip the line entirely.`,
body:R`<p>Linux schedules threads (tasks). Classes in priority order: <b>stop</b> → <b>deadline</b> (SCHED_DEADLINE, EDF + CBS reservations) → <b>real-time</b> (SCHED_FIFO, SCHED_RR, priorities 1–99) → <b>fair</b> (SCHED_OTHER/BATCH/IDLE) → idle. A runnable RT task always preempts fair tasks on that CPU (subject to RT throttling: by default RT may use 950 ms per 1 s so a runaway FIFO task cannot lock the box).</p>
<h3>Fair scheduling</h3><p>CFS (2007–2023) tracked per-task <b>vruntime</b> = actual runtime × (1024 / weight) in a red-black tree and picked the leftmost (smallest). Nice levels map to weights (nice 0 = 1024; each step ≈ 1.25×). Since Linux 6.6, <b>EEVDF</b> replaces the pick logic: each task has a lag (service owed vs received) and a virtual deadline; the scheduler picks the eligible task with the earliest deadline, giving latency-sensitive tasks with short slices better wakeup latency while keeping fairness. Same intuition as the sim.</p>
<h3>Multi-core realities</h3><ul><li>Per-CPU runqueues; <b>load balancing</b> migrates tasks across a hierarchy of scheduling domains (SMT siblings → cores → NUMA nodes). Migration costs cache warmth; NUMA balancing moves memory or tasks.</li><li><b>Wakeup placement</b>: wake_affine heuristics decide whether to run the wakee near the waker (shared cache) or on an idle CPU.</li><li>Heterogeneous CPUs (big.LITTLE / Intel P/E-cores): Energy Aware Scheduling uses capacity and energy models — very relevant on mobile/embedded SoCs.</li><li><b>cgroups</b> CPU controller: shares (cpu.weight) and bandwidth limits (cpu.max) — the cause of container throttling (Module 9).</li></ul>
<h3>Preemption models</h3><p>PREEMPT_NONE (server throughput), PREEMPT_VOLUNTARY, PREEMPT (full kernel preemption except in critical sections), PREEMPT_RT (sleeping spinlocks, threaded IRQs; mainline since 6.12), plus 6.13’s lazy preemption. Real-time = bounded worst-case latency, not speed.</p>
<h3>Tools</h3><p><code>chrt</code>, <code>taskset</code>, <code>nice</code>, <code>/proc/PID/sched</code>, <code>perf sched latency</code>, <code>trace-cmd</code> with <code>sched_switch/sched_wakeup</code>, <code>runqlat</code> (BCC/bpftrace) for run-queue latency histograms. And sched_ext (6.12+) lets you write schedulers in eBPF.</p>
<div class="callout gotcha"><b>Gotchas:</b> a SCHED_FIFO thread spinning on a lock held by a SCHED_OTHER thread on the same CPU → livelock until RT throttling; priority inversion without PI mutexes (Module 4); <code>sched_yield()</code> semantics differ between classes; RT priority does nothing about page faults or blocking I/O inside the loop.</div>`,
poly:R`Audio capture/playback threads and video encode threads in conferencing devices often run SCHED_FIFO; UI and logging run CFS. If you ever saw audio glitches under heavy logging or a firmware update, that is this lesson. The same reasoning applies directly to robot control loops (Module 12) — an excellent "redeployable" talking point.`,
quiz:[
{q:'Two CPU-bound tasks: nice 0 and nice 5 on one CPU. Approximate CPU split?',opts:['50/50','~75/25','~90/10','100/0'],a:1,exp:'Weights 1024 vs 335 → ~75% / 25%.'},
{q:'A SCHED_FIFO priority-50 thread becomes runnable while a nice -20 SCHED_OTHER thread runs on that CPU. What happens?',opts:['It waits for the timeslice','It preempts immediately','It runs on another CPU only','Nothing until the CFS thread sleeps'],a:1,exp:'RT classes always preempt fair-class tasks.'},
{q:'Since Linux 6.6 the fair class pick algorithm is…',opts:['O(1) scheduler','BFS','EEVDF','Round robin'],a:2,exp:'EEVDF (Earliest Eligible Virtual Deadline First) replaced CFS’s pick logic.'},
{q:'Which tool shows a histogram of how long runnable tasks wait for a CPU?',opts:['top','runqlat (BCC/bpftrace) or perf sched latency','iostat','strace'],a:1,exp:'Run-queue latency is a key saturation metric (USE method).'}],
challenge:{prompt:R`<p>Write a C++ program with 4 CPU-bound threads at nice 0, 5, 10 and one SCHED_FIFO thread that wakes every 1 ms to do 100 µs of work, all pinned to one CPU. Measure each thread’s CPU share (<code>getrusage</code>/<code>/proc/self/task/*/stat</code>) and the FIFO thread’s wakeup latency distribution. Then remove the FIFO priority and compare.</p>`,
hints:['<code>pthread_setschedparam</code> with SCHED_FIFO requires CAP_SYS_NICE (or root / rtprio limits).','Use <code>clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME, ...)</code> for the periodic loop and record actual − expected wake time.','Pin with <code>sched_setaffinity</code> to one CPU for a clean experiment.'],
solution:R`<p>Expected: fair threads split by weight (≈ 1024:335:110 → 70%:23%:7% of the remaining ~90% after the FIFO thread’s 10%); FIFO wakeup latency stays in tens of µs (max dominated by kernel non-preemptible sections and IRQs). As SCHED_OTHER, the periodic thread’s latency grows to milliseconds (it must wait for its EEVDF turn behind CPU hogs).</p>`},
interview:[{q:'"How does the Linux scheduler decide what runs next, and how would you guarantee a 1 kHz loop meets its deadlines?"',a:'Class hierarchy; within fair class weights/vruntime/EEVDF; per-CPU runqueues and balancing. For a 1 kHz loop: SCHED_FIFO (or SCHED_DEADLINE with runtime/period), PREEMPT_RT kernel, isolate a CPU (isolcpus/nohz_full, IRQ affinity), mlockall + prefault, no allocations/syscalls that block in the loop, measure max latency with cyclictest under load, and a watchdog for overruns. Mention priority inheritance for shared locks.'}],
resources:[['Kernel docs: CFS design','https://docs.kernel.org/scheduler/sched-design-CFS.html'],['Kernel docs: EEVDF scheduler','https://docs.kernel.org/scheduler/sched-eevdf.html'],['Kernel docs: deadline scheduling','https://docs.kernel.org/scheduler/sched-deadline.html'],['LWN.net (kernel news & deep dives)','https://lwn.net/']]}
]});

<script>/* js/content/m03-embedded.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'embedded',num:3,icon:'🔧',short:'Embedded bring-up',title:'Embedded Platforms & Bring-up',tier:'core',
summary:'Boot flow and secure boot, BSPs and reproducible OS images, peripheral buses on the wire, camera/ISP pipelines, power and clocks.',
why:'Bring-up/BSP appears in Cisco, Google Embedded, NVIDIA kernel CSP ("lead hardware bring-up, BSP development"), OpenAI Compute Foundations (OS images, boot, firmware qualification) and Ford. It is also the most robotics-redeployable skill you own.',
lessons:[
{id:'boot',title:'Boot flow: ROM → SPL → U-Boot → kernel → init',minutes:30,skills:['bringup','firmware','zerotrust'],sims:['bootStepper'],
analogy:R`Booting is a <b>relay race in the dark</b>. Each runner can only see the next few meters: the Boot ROM knows just enough to find the first runner (SPL) and check its badge (signature); SPL turns on the stadium lights (DRAM); U-Boot reads the race plan (DTB, bootargs) and hands the baton to Linux, which finally wakes the whole crowd (init, services).`,
body:R`<h3>Stages on a typical ARM SoC (i.MX8M, Qualcomm, Ambarella)</h3><ol>
<li><b>Power-on reset</b>: the PMIC sequences rails in a required order; clocks (crystal, PLLs) stabilize; reset deasserts. Wrong sequencing can latch up or brown out silicon.</li>
<li><b>Boot ROM</b> (mask ROM, immutable): samples boot-mode pins/eFuses, initializes a minimal boot device (eMMC/SD/QSPI/NAND/USB serial download), loads the first-stage image into on-chip SRAM, and verifies its signature against a key hash fused into OTP (NXP HAB/AHAB, Qualcomm secure boot). This is the hardware <b>root of trust</b>.</li>
<li><b>SPL / TF-A BL2</b> (runs in SRAM): DDR controller init and <b>DDR training</b> (board-specific timing), loads BL31 (Arm Trusted Firmware secure monitor, EL3: PSCI power management, SMC services), optionally OP-TEE (secure world, EL1-S), and U-Boot proper.</li>
<li><b>U-Boot</b>: environment, drivers for storage/network/display, <code>bootcmd</code> script, loads kernel Image, DTB (+ overlays) and initramfs, verifies FIT image signatures for a chain of trust, fixes up DT (memory size, MAC addresses), sets <code>bootargs</code>, jumps to the kernel at EL2/EL1.</li>
<li><b>Kernel</b>: decompress (if zImage), early arch setup, MMU on, <code>earlycon</code>, unflatten DT, memory init, initcalls by level, driver probes (with deferral), mount rootfs (initramfs → switch_root), exec <code>/sbin/init</code>.</li>
<li><b>User space</b>: systemd/busybox init, udev coldplug, services, your application. A/B partitions + boot counters enable safe OTA rollback (Mender, RAUC, SWUpdate, Android A/B).</li></ol>
<h3>Debugging by symptom (sim)</h3><table><tr><th>Symptom</th><th>Likely stage</th><th>First moves</th></tr>
<tr><td>No UART output at all</td><td>power/ROM/signature</td><td>scope rails & reset, check boot pins/fuses, serial-download mode (NXP uuu, QDL for Qualcomm)</td></tr>
<tr><td>SPL banner then hang</td><td>DDR</td><td>DDR config for board rev, run vendor DDR stress/calibration tool</td></tr>
<tr><td>"Starting kernel ..." then silence</td><td>early kernel</td><td><code>earlycon</code>, correct DTB, check load addresses overlapping, <code>initcall_debug</code></td></tr>
<tr><td>VFS: Unable to mount root fs</td><td>rootfs</td><td><code>root=</code>, <code>rootwait</code>, storage driver built-in, partition UUID</td></tr></table>
<h3>Boot time</h3><p>Products have budgets ("camera live in <10 s"). Measure with <code>grabserial</code> timestamps, <code>initcall_debug</code>, <code>systemd-analyze blame/critical-chain</code>, bootchart. Wins: Falcon mode (SPL boots Linux directly), uncompressed kernel on fast storage, deferring non-critical modules, parallel service startup, avoiding udev settle, a static /dev, and read-only squashfs rootfs.</p>
<h3>Datacenter parallel</h3><p>Servers have the same chain: BMC firmware → UEFI (PEI/DXE) → PXE/HTTP boot → GRUB/shim (Secure Boot, signed kernels) → kernel → initramfs → provisioning agent. OpenAI’s Compute Foundations and NVIDIA CSP roles want someone who can debug a node "from power-on to workload-ready" — your embedded boot knowledge maps one-to-one.</p>`,
poly:R`You have bring-up scars on multiple SoC families. Turn them into a crisp structured story: symptom → hypothesis by stage → instrument (UART, JTAG, scope on rails, ROM error codes) → root cause (e.g. DDR timing for a new memory vendor on a board spin) → fix + prevention (board-rev detection in SPL, factory test). That is a staff-level bring-up narrative.`,
quiz:[
{q:'Which component is the immutable root of trust in secure boot?',opts:['U-Boot','The Boot ROM plus the key hash fused into OTP/eFuses','The kernel','systemd'],a:1,exp:'Mask ROM code can’t be modified; it verifies the first loaded stage against fused keys.'},
{q:'Board prints the SPL banner then hangs before U-Boot. Most likely?',opts:['Wrong rootfs','DDR initialization/training failure','Kernel config','Missing systemd unit'],a:1,exp:'SPL’s main job is DDR init; U-Boot proper lives in DRAM.'},
{q:'"Starting kernel ..." and then nothing on the console. Best first step?',opts:['Reflash rootfs','Add earlycon (and verify the DTB/console settings)','Increase RAM','Disable SELinux'],a:1,exp:'earlycon gives output before the real console driver probes.'},
{q:'Why use A/B partitions for OTA updates?',opts:['Faster downloads','Update the inactive slot and switch atomically; boot counter rollback if the new slot fails','Encrypt data','Smaller images'],a:1,exp:'Atomic switch + automatic fallback prevents bricking a fleet.'}],
challenge:{prompt:R`<p>In QEMU (<code>qemu-system-aarch64 -M virt</code>), build U-Boot and a kernel, boot with an initramfs, then: (1) add <code>initcall_debug printk.time=1</code> and find the 5 slowest initcalls; (2) introduce a wrong <code>root=</code> and capture the panic; (3) create a FIT image with kernel+DTB and enable signature verification in U-Boot; (4) write a one-page "boot debug flowchart" for your team.</p>`,
hints:['Buildroot can produce all pieces for qemu_aarch64_virt_defconfig in one go.','<code>dmesg | grep "initcall" | sort -t" " -k8 -n</code> (format varies; look for "returned 0 after N usecs").','FIT signing: <code>mkimage -f image.its -K u-boot.dtb -k keys -r image.itb</code> embeds the public key into U-Boot’s control DTB.'],
solution:R`<p>Deliverables: list of slow initcalls with owners and fixes (e.g. make a driver async with PROBE_PREFER_ASYNCHRONOUS, defer a module), the captured "VFS: Unable to mount root fs" panic with explanation, a signed FIT that boots and a tampered one that U-Boot rejects ("Bad Data Hash"/signature verify failed), and a flowchart keyed on the last message seen.</p>`},
interview:[{q:'"Describe the boot process of an embedded Linux device and how you would cut boot time from 20 s to 5 s."',a:'Walk the stages with responsibilities; measure first (UART timestamps, initcall_debug, systemd-analyze); then attack the biggest bars: storage throughput and image size (compression choice), U-Boot delays (bootdelay=0, skip unused init), kernel (built-in only what is needed for camera path, async probe, defer modules), user space (critical chain, socket activation, read-only rootfs), application (lazy init, warm caches). Quantify each win and protect it with a boot-time regression test in CI.'}],
resources:[['U-Boot documentation','https://docs.u-boot.org/'],['Bootlin embedded Linux training materials','https://bootlin.com/docs/'],['Udemy: Embedded Linux Step by Step (BeagleBone)','https://www.udemy.com/course/embedded-linux-step-by-step-using-beaglebone/']]},
{id:'yocto',title:'BSPs & reproducible OS images (Yocto/Buildroot)',minutes:30,skills:['yocto','provisioning','cicd'],sims:['yoctoLayers'],
analogy:R`Yocto is a <b>layered recipe book</b>. The base cookbook (poky) has general recipes; the silicon vendor adds a chapter (meta-imx) that overrides a few dishes for its kitchen; your product layer adds sticky notes (bbappends) on top. The chef (BitBake) follows the highest-priority recipe and applies every sticky note that matches.`,
body:R`<p>A <b>BSP</b> (board support package) is everything that makes a generic OS run on specific hardware: bootloader config, DDR settings, kernel fork/patches/defconfig, DT, firmware blobs (VPU, Wi-Fi, ISP tuning), and user-space vendor libraries (GPU/VPU/camera HAL). Vendors ship BSPs as Yocto layers (NXP meta-imx, Qualcomm meta-qcom) or SDK tarballs.</p>
<h3>Yocto essentials</h3><ul><li><b>Recipes</b> (.bb) describe how to fetch, patch, configure, compile, install and package a component. <b>bbappend</b> files modify recipes from other layers (add patches, config fragments, change PACKAGECONFIG).</li>
<li><b>Layers</b> with <code>BBFILE_PRIORITY</code>; <code>PREFERRED_PROVIDER_virtual/kernel</code> and <code>PREFERRED_VERSION</code> pick implementations (sim).</li>
<li><b>MACHINE</b> (board), <b>DISTRO</b> (policy: init system, features), <b>IMAGE</b> (package set). Separation lets one product layer build for several boards.</li>
<li><b>sstate cache</b> and hash equivalence make rebuilds incremental and shareable across CI machines; <b>reproducible builds</b> (same inputs → bit-identical outputs) are on by default in recent releases — crucial for security audits and fleet rollouts.</li>
<li><b>SBOM</b> (SPDX) generation and CVE checking (<code>cve-check</code>) are increasingly required by customers and regulators.</li>
<li>The <b>SDK/eSDK</b> gives application developers a matching cross-toolchain and sysroot.</li></ul>
<p><b>Buildroot</b> is the simpler alternative: Kconfig-driven, single-image focus, no binary package feed; great for small, fixed-function devices and fast iteration.</p>
<h3>Kernel management strategy</h3><p>Vendor kernels lag mainline and carry thousands of patches. Senior-level opinions: keep your patches as a minimal, documented series on top of the vendor tag; upstream what you can; track LTS; rebase on a schedule; use config fragments rather than full defconfig copies; automate boot tests on real hardware (LAVA, labgrid) per merge request.</p>
<h3>Fleet/datacenter parallel</h3><p>OpenAI Compute Foundations: "reproducible OS-image builds, package and repository workflows … qualify kernels, modules, drivers, packages, and firmware … canary, rollback". Same problem at a different scale: pin inputs, build hermetically, sign artifacts, test on representative hardware SKUs, roll out progressively, keep the previous image bootable.</p>
<div class="callout gotcha"><b>Gotchas:</b> bbappend version mismatch silently not applying (or erroring) after a vendor upgrade; editing vendor layers in place (lost on next update); host contamination (non-hermetic builds); license compliance for GPL components and firmware redistribution.</div>`,
poly:R`Poly ships images for multiple SoC vendors — that is multi-BSP management, kernel patch-stack hygiene, firmware blob versioning, and SBOM/CVE response. Describe a time you upgraded a vendor BSP: how you scoped the delta, ran it through HIL tests, and rolled it out to devices in stages. That one story covers yocto, cicd and deploy skills.`,
quiz:[
{q:'Two layers both provide gstreamer1.0; meta-imx has priority 8, poky priority 5. Which recipe is used (no PREFERRED_VERSION)?',opts:['poky’s','meta-imx’s','both','build error'],a:1,exp:'Higher BBFILE_PRIORITY wins among layers providing the same recipe.'},
{q:'Where should product-specific kernel patches live?',opts:['Edit the vendor layer directly','In your own layer via a bbappend + patch files/config fragments','In the build directory','On the target'],a:1,exp:'Keeps vendor updates clean and changes reviewable.'},
{q:'What does sstate cache provide?',opts:['Runtime state','Reuse of task outputs across builds/machines when inputs hash the same','Kernel debugging','Package signing'],a:1,exp:'Shared state turns hours-long builds into minutes when little changed.'},
{q:'A customer demands an SBOM for each firmware release. In Yocto you…',opts:['Write it by hand','Enable SPDX SBOM generation (create-spdx, default in recent releases)','Cannot','Use strace'],a:1,exp:'Yocto produces SPDX documents per image.'}],
challenge:{prompt:R`<p>Create a Yocto layer <code>meta-chandra</code> for <code>qemuarm64</code>: an image recipe with your app, a kernel bbappend adding a config fragment (enable ftrace and KASAN for a debug variant), a systemd service, and a read-only rootfs with an overlay for <code>/var</code>. Enable SPDX output and produce a CVE report. Document how a CI job would build, sign and boot-test it in QEMU.</p>`,
hints:['<code>bitbake-layers create-layer</code> then <code>bitbake-layers add-layer</code>.','Kernel fragment: <code>SRC_URI += "file://debug.cfg"</code> in <code>linux-yocto_%.bbappend</code>.','<code>IMAGE_FEATURES += "read-only-rootfs"</code>; <code>INHERIT += "cve-check"</code>.'],
solution:R`<p>Layer tree: conf/layer.conf (priority 10, LAYERSERIES_COMPAT), recipes-core/images/chandra-image.bb (require core-image-minimal, IMAGE_INSTALL:append), recipes-kernel/linux/linux-yocto_%.bbappend (+ files/debug.cfg), recipes-apps/myapp/myapp_1.0.bb (inherit systemd, SYSTEMD_SERVICE). CI: pinned layer SHAs (kas/repo manifest), shared sstate mirror, build → sign (FIT/verity) → runqemu boot test with expect script → publish artifacts + SPDX + CVE report.</p>`},
interview:[{q:'"How would you manage a vendor BSP upgrade across a fleet of 100k devices?"',a:'Inventory deltas (kernel version jump, firmware blobs, userspace libs), build with pinned manifests, run automated HIL regression (boot, camera/audio quality metrics, thermal, power), dogfood internally, staged rollout (1% → 10% → 50% → 100%) with health telemetry and automatic halt, A/B partitions for rollback, and keep the old image buildable. Communicate risk and timeline to stakeholders. This mirrors fleet OS-image rollouts in datacenters.'}],
resources:[['Yocto Project documentation','https://docs.yoctoproject.org/'],['Bootlin Yocto/Buildroot training materials','https://bootlin.com/docs/'],['Buildroot manual','https://buildroot.org/downloads/manual/manual.html']]},
{id:'buses',title:'Peripheral buses on the wire: I²C, SPI, UART, MIPI',minutes:30,skills:['buses','bringup','drivers'],sims:['i2cBus'],
analogy:R`I²C is a <b>meeting room with one microphone and a polite protocol</b>: everyone shares two wires, the chair (master) calls a name (address), the named person says "here" (ACK). SPI is <b>direct phone lines</b> with a dedicated select wire per person — faster, no politeness overhead. MIPI CSI-2 is a <b>multi-lane highway</b> for pixels.`,
body:R`<h3>I²C</h3><p>Two open-drain lines (SCL clock, SDA data) with pull-ups; 7-bit addresses (10-bit rare); speeds 100 kHz, 400 kHz, 1 MHz (Fm+), 3.4 MHz (HS). A transaction: START, address + R/W, ACK, data bytes each ACKed, optional repeated START, STOP. Because lines are pulled up by resistors, <b>rise time = RC</b>: too large pull-ups or long cables with high capacitance violate the spec (sim). Features & pitfalls: clock stretching, multi-master arbitration, bus lock-up (a slave holding SDA low after a reset mid-transaction → recover by toggling SCL 9 times; Linux supports bus recovery via GPIOs), address conflicts (use muxes like PCA9548 / i2c-mux).</p>
<p>Linux: <code>i2c_transfer()</code> with <code>struct i2c_msg</code>, or <b>regmap</b> (caching, endianness, bulk access, debugfs). Tools: <code>i2cdetect</code>, <code>i2cget/i2cset</code>, <code>i2ctransfer</code>. SMBus is a stricter subset with defined commands.</p>
<h3>SPI</h3><p>Push-pull SCLK, MOSI, MISO, one chip-select per device; full duplex, tens of MHz, no addressing or ACK (you find out data is wrong only by checking it). Modes 0–3 = clock polarity/phase — mismatch gives shifted bits. Used for flash, displays, ADCs, IMUs, some sensors. QSPI/OSPI (4/8 data lines) for boot flash.</p>
<h3>UART</h3><p>Asynchronous: both sides must agree on baud rate (±2–3% tolerance); 8N1 framing. Still the bring-up lifeline (console) and common for GPS, BT modules, motor controllers. RS-485 adds differential multi-drop.</p>
<h3>MIPI CSI-2 / DSI and others</h3><p>High-speed differential lanes (D-PHY up to ~2.5 Gb/s/lane, C-PHY), packets with virtual channels and data types (RAW10, YUV422). Bring-up issues: lane count/order, link frequency (<code>link-frequencies</code> in DT must match sensor PLL config), continuous vs non-continuous clock, deskew. Lontium-style bridges convert HDMI↔MIPI. Also know: <b>CAN/CAN-FD</b> (automotive/robots — Ford role), <b>EtherCAT</b> (robot joints), <b>PCIe</b> (Module 2/5), <b>USB</b> (UVC cameras).</p>
<h3>Bring-up method</h3><ol><li>Power & reset sequencing per datasheet (scope).</li><li>Read a chip ID register — the "hello world" of every device.</li><li>Logic analyzer/protocol decoder (Saleae, sigrok) to compare expected vs actual.</li><li>Only then the full driver.</li></ol>`,
poly:R`Lontium HDMI bridges on I²C, image sensors on I²C control + MIPI data, codecs on I²S + I²C — you live here. Interviewers love "tell me about a bus-level bug": e.g. intermittent NACKs only at 400 kHz on one board revision traced with a scope to slow rise time from added capacitance on a flex cable; fix by changing pull-ups. Quantify with the RC formula from the sim.`,
quiz:[
{q:'Pull-up 10 kΩ, bus capacitance 200 pF. Rise time (0.8473·RC) ≈ ? And is it OK for 400 kHz (max 300 ns)?',opts:['~170 ns, OK','~1.7 µs, too slow','~17 ns, OK','~0.5 µs, OK'],a:1,exp:'0.8473 × 10e3 × 200e-12 ≈ 1.69 µs ≫ 300 ns. Lower Rp (e.g. 2.2 kΩ) or capacitance.'},
{q:'A device datasheet says I²C address 0x34 (8-bit write address). In Linux DT reg you put…',opts:['0x34','0x1a','0x68','0x17'],a:1,exp:'Linux uses 7-bit addresses: 0x34 >> 1 = 0x1a.'},
{q:'After a SoC reset mid-transfer the I²C bus is stuck with SDA low. Standard recovery?',opts:['Power-cycle the board only','Clock SCL up to 9 times until the slave releases SDA, then generate STOP','Increase speed','Swap SDA/SCL'],a:1,exp:'The slave is waiting to finish a byte; extra clocks let it complete.'},
{q:'SPI reads return data shifted by one bit. Most likely cause?',opts:['Wrong chip address','Wrong SPI mode (CPOL/CPHA)','Missing pull-ups','Baud mismatch'],a:1,exp:'Clock phase/polarity mismatch samples on the wrong edge.'}],
challenge:{prompt:R`<p>Write a Linux I²C client driver using <b>regmap</b> for a fictional temperature sensor (ID register 0x00 = 0x5A, temperature at 0x01–0x02 big-endian, config at 0x03). Expose it via the hwmon subsystem. Add runtime PM (power off between reads) and robust error handling for NACKs. Test against an emulated device with the kernel’s i2c-stub or a QEMU model.</p>`,
hints:['<code>devm_regmap_init_i2c(client, &cfg)</code> with <code>.reg_bits=8, .val_bits=8</code>; use <code>regmap_bulk_read</code> for the 16-bit value.','<code>devm_hwmon_device_register_with_info()</code> + <code>hwmon_chip_info</code> with temp input channel.','<code>i2c-stub</code>: <code>modprobe i2c-stub chip_addr=0x48</code> then preload registers with i2cset.'],
solution:R`static int ts_read(struct device *dev, enum hwmon_sensor_types t, u32 attr, int ch, long *val) {
  struct ts *s = dev_get_drvdata(dev); __be16 raw; int ret;
  ret = pm_runtime_resume_and_get(dev); if (ret) return ret;
  ret = regmap_bulk_read(s->map, 0x01, &raw, 2);
  pm_runtime_mark_last_busy(dev); pm_runtime_put_autosuspend(dev);
  if (ret) return ret;                       // -ENXIO/-EREMOTEIO on NACK
  *val = (s16)be16_to_cpu(raw) * 1000 / 256; // millidegrees per hwmon ABI
  return 0;
}
// probe: regmap init, read ID (0x5A) else -ENODEV, enable runtime PM with autosuspend, register hwmon.`},
interview:[{q:'"A sensor works on the bench but fails intermittently in the product enclosure. How do you debug?"',a:'Reproduce and characterize (temperature? vibration? only with other peripherals active? only at certain bus speed?); instrument (bus error counters, logic analyzer on SDA/SCL with protocol decode, scope for rise times/ringing/ground bounce); hypotheses: signal integrity from longer harness (capacitance), EMI from nearby switching regulators/motors, power droop when other loads switch, clock stretching timeouts, address conflict with added device. Fix + verify with margin testing (slow/fast corners), and add telemetry for NACK counts in the field.'}],
resources:[['Kernel docs: I2C subsystem','https://docs.kernel.org/i2c/index.html'],['Kernel docs: SPI subsystem','https://docs.kernel.org/spi/index.html'],['Ben Eater: build an 8-bit computer (buses, clocks)','https://eater.net/8bit']]},
{id:'camera',title:'Camera & video pipelines, power and clocks',minutes:35,skills:['camera-isp','firmware','edge-ai','perf-eng'],sims:['cameraPipeline'],
analogy:R`A video pipeline is a <b>bucket brigade at a fire</b>: each person (stage) passes buckets (frames) along. The line moves only as fast as the slowest person; extra buckets waiting between people (queues) smooth out stumbles but every waiting bucket means the water arrives later.`,
body:R`<h3>The path of a photon</h3><ol><li><b>Sensor</b>: exposure (rolling vs global shutter), readout over MIPI CSI-2 in RAW Bayer (RAW10/12). Sensor timing (HTS/VTS, PLL) determines frame rate and link frequency.</li><li><b>CSI receiver</b> deserializes into memory (or streams directly into the ISP inline).</li><li><b>ISP</b>: black level, defect pixel correction, lens shading, demosaic, white balance, color correction, gamma/tone mapping, noise reduction, sharpening, HDR merge; plus <b>3A</b> loops (auto exposure, auto white balance, auto focus) that read statistics each frame and program the sensor/ISP for future frames — a control system with frame-latency delays.</li><li><b>Scaler/compositor</b>, dewarp (fisheye/speaker tracking), possibly CV/NN inference on an NPU (Ambarella CVflow, Qualcomm Hexagon) for framing/people detection.</li><li><b>Encoder</b> (H.264/H.265/AV1) with rate control (CBR/VBR), GOP structure (I/P/B frames — B-frames add latency, so conferencing avoids them), slices for error resilience.</li><li>Packetization (RTP), network, jitter buffer, decode, render.</li></ol>
<h3>Latency and throughput math</h3><p>Throughput is set by the slowest stage; latency is the sum of stage times plus queueing (sim). At 30 fps the frame interval is 33.3 ms; each queued buffer can add one interval. Glass-to-glass latency for conferencing targets ~100–200 ms end to end; robots doing visual servoing want tens of ms. Bandwidth: 1080p60 NV12 = 1920×1080×1.5×60 ≈ 187 MB/s per pass through memory — every extra copy or format conversion costs memory bandwidth and power.</p>
<h3>Linux frameworks</h3><p><b>V4L2</b> (video nodes, subdevices, media controller graph, request API), <b>libcamera</b> (modern camera stack with pipeline handlers and IPA modules for 3A), <b>GStreamer</b> (application pipelines, zero-copy with dmabuf), <b>DRM/KMS</b> for display. Android uses Camera HAL3. Zero copy via dma-buf across camera → encoder → display.</p>
<h3>Power, clocks and thermal</h3><p>Dynamic power ∝ C·V²·f. <b>DVFS</b> (cpufreq/devfreq) trades frequency and voltage; clock gating stops clocks to idle blocks; power gating removes power from domains (genpd); <b>runtime PM</b> lets drivers suspend devices when idle; system suspend (s2idle/deep) for standby. Thermal zones and cooling devices throttle when hot — a camera bar in a hot conference room that throttles its encoder drops frames. The Linux <b>common clock framework</b> models the clock tree (<code>clk_prepare_enable</code>, <code>clk_set_rate</code>, <code>/sys/kernel/debug/clk/clk_summary</code>); the regulator framework models rails.</p>`,
poly:R`This is literally your product: a conferencing camera/bar on Ambarella CV7 or Qualcomm with sensor → ISP → CV (speaker framing) → encoder → network. Talk numbers: frame budget per stage, buffer counts chosen and why, how you diagnosed frame drops (per-stage timestamps, V4L2 sequence gaps, encoder queue depth), thermal throttling under 4K. Google Embedded lists "computer vision, video" as preferred — your strongest match.`,
quiz:[
{q:'A 30 fps pipeline has stages of 20, 5, 28 and 15 ms. What is the max throughput and minimum latency (no queueing)?',opts:['30 fps, 68 ms','~35 fps limited by 28 ms stage, 68 ms','~17 fps, 28 ms','60 fps, 34 ms'],a:1,exp:'Slowest stage 28 ms → ~35.7 fps capacity (so 30 fps sustainable); latency = sum = 68 ms.'},
{q:'Why do conferencing encoders typically avoid B-frames?',opts:['Worse quality','B-frames reference future frames → added encode/decode latency','Not supported','They use more power'],a:1,exp:'The encoder must buffer future frames before emitting a B-frame.'},
{q:'Dynamic power scales roughly with…',opts:['f','V·f','C·V²·f','V³'],a:2,exp:'Lowering voltage (with frequency) gives the biggest savings — the basis of DVFS.'},
{q:'Adding more buffers to every queue in a live video pipeline mainly…',opts:['Reduces latency','Absorbs jitter but increases latency','Increases fps beyond the slowest stage','Saves memory'],a:1,exp:'Queues can’t raise throughput above the bottleneck; they trade latency for smoothness.'}],
challenge:{prompt:R`<p>Build a GStreamer pipeline on a Linux laptop or SBC: <code>v4l2src ! videoconvert ! x264enc tune=zerolatency ! rtph264pay ! udpsink</code> and a receiver. Measure glass-to-glass latency by filming a millisecond clock on screen with the camera and comparing. Then: remove the videoconvert copy (pick a native format), set <code>x264enc speed-preset=ultrafast key-int-max=60 bframes=0</code>, shrink queues, and report each change’s effect.</p>`,

solution:R`<p>Expected: default x264enc can add hundreds of ms (lookahead, B-frames); zerolatency + ultrafast brings encode to a few ms; leaky single-buffer queues and a small jitter buffer cut another tens of ms; removing videoconvert reduces CPU. Report a table: change → latency → CPU% → visual quality. This mirrors device tuning and is a strong interview artifact.</p>`},

<script>/* js/content/m04-conc.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'conc',num:4,icon:'⚡',short:'Concurrency & perf',title:'Concurrency & Performance',tier:'core',
summary:'Caches and memory hierarchy, false sharing, locks vs spinlocks vs lock-free, ring buffers and ABA, deadlock and priority inversion.',
why:'NVIDIA CUDA driver ("OS concurrency, multithreading, computer architecture, cache coherency"), CrowdStrike sensor ("lock-free algorithms"), Unity core engine, Cloudflare and every principal role probe this. It also underpins real-time robotics.',
lessons:[
{id:'cache',title:'The memory hierarchy: caches, lines, prefetchers, TLBs',minutes:30,skills:['arch-perf','perf-eng'],sims:['cacheSim'],
analogy:R`Your CPU is a <b>chef</b>. L1 is the cutting board (tiny, instant), L2 the counter, L3 the shared pantry, DRAM the grocery store across town, and an SSD is a farm in another state. The chef never fetches one onion — he grabs the whole 64-byte crate (cache line). Recipes that use neighboring ingredients (sequential access) fly; recipes that zigzag across the store starve.`,
body:R`<h3>Numbers to know (order of magnitude, modern x86/ARM server)</h3><table><tr><th>Level</th><th>Size</th><th>Latency</th></tr><tr><td>Register</td><td>~KB</td><td>0 cycles</td></tr><tr><td>L1d</td><td>32–64 KB/core</td><td>~4–5 cycles (~1 ns)</td></tr><tr><td>L2</td><td>0.5–2 MB/core</td><td>~12–15 cycles</td></tr><tr><td>L3/LLC</td><td>tens–hundreds MB shared</td><td>~40–70 cycles</td></tr><tr><td>DRAM</td><td>GB</td><td>~80–120 ns (300+ cycles); remote NUMA ×1.5–2</td></tr></table>
<p>Caches are organized as <b>sets × ways</b>; an address maps to a set via index bits, and lines compete within the set. Misses are <b>compulsory</b> (first touch), <b>capacity</b> (working set too big), or <b>conflict</b> (too many hot lines map to one set — e.g. power-of-two strides). Hardware <b>prefetchers</b> detect sequential and strided streams and fetch ahead; random pointer chasing defeats them and exposes full memory latency.</p>
<h3>What the sim shows</h3><p>Row-major traversal of a matrix touches each line once and uses all 16 floats in it; column-major traversal with a large stride uses one float per line fetched → up to 16× more memory traffic, plus TLB misses when stride crosses pages. Classic remedies: loop interchange, <b>tiling/blocking</b> (process a block that fits in L1/L2), structure-of-arrays (SoA) instead of array-of-structures (AoS) when you scan a single field, and avoiding pointer-heavy structures (linked lists, std::map) in hot paths in favor of contiguous arrays (std::vector, flat hash maps, B-trees).</p>
<h3>TLB and huge pages</h3><p>Each 4 KB page needs a TLB entry; a 1536-entry L2 TLB covers only 6 MB. Huge pages (2 MB / 1 GB) reduce TLB misses for large working sets (databases, GPU drivers pinning memory, DPDK). Transparent huge pages help but can cause latency spikes from compaction.</p>
<h3>Measuring</h3><p><code>perf stat -e cycles,instructions,cache-misses,L1-dcache-load-misses,LLC-load-misses,dTLB-load-misses</code>; IPC (instructions per cycle) &lt;1 on a modern core often signals memory-bound code. Top-down microarchitecture analysis (Intel TMA: frontend-bound / bad speculation / backend-bound (memory/core) / retiring) tells you where cycles go. <code>perf c2c</code> finds cache-line contention.</p>
<div class="callout num"><b>Rule of thumb:</b> Memory bandwidth per core is ~10–20 GB/s; a full DRAM miss costs as much as ~hundreds of simple ALU ops. Algorithms with better Big-O but worse locality often lose for realistic n.</div>`,
poly:R`On Ambarella/Qualcomm SoCs, DDR bandwidth is shared among CPU, ISP, encoder and NPU. Copying frames with memcpy and format conversion on the CPU thrashes caches and steals bandwidth. Your experience with dma-buf zero-copy and cache maintenance for DMA (Module 2) is the embedded flavor of this lesson.`,
quiz:[
{q:'Summing a 4096×4096 float matrix column-by-column (row-major storage) vs row-by-row. Roughly how much more memory traffic?',opts:['Same','~2×','Up to ~16× (one useful float per 64-byte line)','1000×'],a:2,exp:'Each 64B line holds 16 floats; column traversal with 16 KB stride uses one per fetch (and evicts before reuse).'},
{q:'Which miss type does tiling primarily eliminate?',opts:['Compulsory','Capacity (and conflict) misses by keeping a block resident','Coherence misses','TLB-only misses'],a:1,exp:'Blocking keeps the working set within a cache level for reuse.'},
{q:'IPC of 0.4 on a 4-wide core suggests…',opts:['Perfect code','Likely memory-bound/stalled; check cache/TLB misses','Branch-free code','Compute bound'],a:1,exp:'Low IPC means the core is mostly waiting.'},
{q:'Why can std::list iteration be 10× slower than std::vector for the same element count?',opts:['More instructions only','Pointer chasing defeats prefetching and spreads nodes across lines/pages','Vector uses SIMD always','List is thread-safe'],a:1,exp:'Each node access is a dependent load with likely cache miss.'}],
challenge:{prompt:R`<p>Write a C++ benchmark: (1) sum a 64 MB array sequentially vs with stride 16, 64, 4096 floats; (2) linked-list traversal vs vector with the same values (shuffle node allocation); (3) naive vs tiled matrix multiply (1024×1024). Report time, GB/s and <code>perf stat</code> cache-miss counts. Explain each result with the hierarchy numbers.</p>`,
hints:['Use <code>std::chrono::steady_clock</code>, run each test several times, and use the result (e.g. print sum) so the compiler can’t delete the loop.','For the list, allocate nodes then shuffle the next pointers to defeat allocator locality.','Tile size: pick B so 3·B²·4 bytes fits in L1/L2 (e.g. B=32 or 64).'],
solution:R`for (int ii = 0; ii < N; ii += B)
  for (int kk = 0; kk < N; kk += B)
    for (int jj = 0; jj < N; jj += B)
      for (int i = ii; i < ii + B; ++i)
        for (int k = kk; k < kk + B; ++k) {
          float a = A[i*N + k];
          for (int j = jj; j < jj + B; ++j) C[i*N + j] += a * Bm[k*N + j];  // i-k-j order: unit stride inner loop
        }
// Expect: tiled + i-k-j ordering 5-20x faster than naive i-j-k; shuffled list ~ DRAM latency per element.`},
interview:[{q:'"This service got 3× slower after we switched from a vector to a map. Why?"',a:'Tree maps allocate per node → pointer chasing, cache/TLB misses, allocator overhead, and branch mispredicts on comparisons. Measure with perf stat (LLC misses, IPC). Alternatives: sorted vector + binary search for read-mostly data, open-addressing flat hash map, or B-tree. Discuss the access pattern and mutation rate before choosing.'}],
resources:[['Ulrich Drepper: What Every Programmer Should Know About Memory','https://people.freebsd.org/~lstewart/articles/cpumemory.pdf'],['CS:APP (Bryant & O’Hallaron)','https://csapp.cs.cmu.edu/'],['Casey Muratori: Performance-Aware Programming','https://www.computerenhance.com/p/table-of-contents'],['Brendan Gregg: perf examples','https://www.brendangregg.com/perf.html']]},
{id:'falseshare',title:'Cache coherence and false sharing',minutes:25,skills:['arch-perf','concurrency','perf-eng'],sims:['falseSharing'],
analogy:R`Two roommates share <b>one notebook</b> but write on different pages. Every time one writes, the other must hand the whole notebook over. They never touch the same words, yet they spend all day passing the notebook — that is false sharing.`,
body:R`<h3>MESI in one paragraph</h3><p>Each cache line in each core is Modified, Exclusive, Shared or Invalid (plus O/F variants: MOESI, MESIF). To write, a core needs the line in M/E state, which means <b>invalidating all other copies</b> via the coherence protocol (snooping or directory). A line that ping-pongs between cores costs ~50–200 cycles per transfer (more across sockets/NUMA nodes) instead of ~1 cycle for an L1 hit.</p>
<h3>False sharing</h3><p>Two threads write different variables that happen to live on the same 64-byte line (128 bytes effectively on some Intel parts due to adjacent-line prefetch; 128 B lines on Apple M-series). Classic culprits: an array of per-thread counters, adjacent fields in a struct written by producer and consumer, lock + data protected by different locks in one struct. Fix: pad/align to the line size: <code>alignas(std::hardware_destructive_interference_size)</code> (C++17; often 64) or <code>alignas(64)</code>; per-CPU data in the kernel (<code>DEFINE_PER_CPU</code>, <code>____cacheline_aligned_in_smp</code>); or restructure so each thread accumulates locally and merges once.</p>
<h3>True sharing</h3><p>One hot atomic counter incremented by 32 threads is <b>true</b> sharing — padding doesn’t help. Options: sharded counters (per-thread/per-CPU, sum on read — Linux <code>percpu_counter</code>), batching updates, or relaxing requirements (approximate counts).</p>
<h3>Finding it</h3><p><code>perf c2c record/report</code> shows HITM (hit-modified) loads on contended lines with source offsets. Symptoms: performance gets <i>worse</i> as you add threads; high cycles on simple increments.</p>
<pre>struct alignas(64) PaddedCounter { std::atomic&lt;uint64_t&gt; v{0}; };
PaddedCounter counters[NTHREADS];   // each on its own line</pre>`,
poly:R`In a multi-threaded media pipeline (capture thread, encoder thread, network thread), shared stats structs updated by each thread are a frequent false-sharing source on 4–8 core ARM SoCs. A quick perf c2c pass is an easy, impressive win to describe.`,
quiz:[
{q:'8 threads each increment their own element of <code>long counts[8]</code>. Scaling is terrible. Why?',opts:['Atomic overhead','All 8 longs share one 64-byte line → coherence ping-pong (false sharing)','Compiler bug','Too many threads'],a:1,exp:'8 × 8 bytes = 64 bytes = one line.'},
{q:'Does padding fix 32 threads doing fetch_add on one global atomic?',opts:['Yes','No — it is true sharing; shard the counter instead'],a:1,exp:'The same bytes are written by all threads.'},
{q:'Which tool directly reports contended cache lines (HITM)?',opts:['perf c2c','strace','valgrind memcheck','ltrace'],a:0,exp:'perf c2c (cache-to-cache) analyzes shared-line contention.'},
{q:'Linux kernel idiom to avoid this for per-CPU stats?',opts:['spinlock around counter','per-CPU variables / percpu_counter','volatile','RCU only'],a:1,exp:'Each CPU updates its own copy; readers sum.'}],
challenge:{prompt:R`<p>Benchmark a parallel histogram (256 bins, 100M random bytes, 1–16 threads) in three versions: shared atomic bins, per-thread bins packed in one array, per-thread bins padded to 64 bytes and merged at end. Plot throughput vs threads. Run <code>perf c2c</code> on the packed version and show the hot line.</p>`,
hints:['Per-thread local arrays on the stack (then merge) is often the best of all.','Use std::thread and a barrier to start threads simultaneously.','Pin threads (pthread_setaffinity_np) to reduce noise.'],
solution:R`<p>Expect: shared atomics scale negatively; packed per-thread bins only slightly better when adjacent threads’ bins share lines at boundaries (and much worse if you interleave bins by thread); thread-local + merge scales nearly linearly until memory bandwidth limits. perf c2c shows HITM concentrated on the shared bin lines.</p>`},
interview:[{q:'"Adding threads made our service slower. Walk me through your investigation."',a:'Check for contention: lock profiling (perf lock, off-CPU flame graphs), cache-line contention (perf c2c), memory bandwidth saturation (pcm/uncore counters), NUMA remote accesses (numastat), and Amdahl serial portions. Fix by sharding state, padding, batching, reducing shared writes, NUMA-aware placement. Demonstrate with a before/after scaling curve.'}],
resources:[['Preshing on Programming (atomics, memory, caches)','https://preshing.com/'],['perf c2c man page','https://man7.org/linux/man-pages/man1/perf-c2c.1.html'],['cppreference: hardware_destructive_interference_size','https://en.cppreference.com/w/cpp/thread/hardware_destructive_interference_size']]},
{id:'locks',title:'Mutex vs spinlock vs atomics: choosing synchronization',minutes:30,skills:['concurrency','lockfree','linux-kernel'],sims:['lockRace'],
analogy:R`A <b>mutex</b> is a single bathroom with a waiting room: if it’s occupied you sit down and nap until called (sleep + wakeup). A <b>spinlock</b> is standing at the door jiggling the handle — great if the person inside will be out in seconds, awful if they’re taking a shower. <b>Lock-free</b> is a buffet where everyone grabs simultaneously and retries if someone snatched the same item.`,
body:R`<h3>Mechanics</h3><ul><li><b>std::mutex / pthread_mutex</b> on Linux is a <b>futex</b>: uncontended lock/unlock are a single atomic op in user space (~20 ns); contended waiters call <code>futex(FUTEX_WAIT)</code> and sleep; unlock with waiters does <code>FUTEX_WAKE</code>. Context switch + wakeup latency is microseconds. Glibc adaptive mutexes spin briefly before sleeping.</li>
<li><b>Spinlocks</b> busy-wait. In the kernel, <code>spin_lock</code> also disables preemption; <code>spin_lock_irqsave</code> also disables local interrupts — required if the lock is taken in IRQ context. You must never sleep while holding one. Modern kernel spinlocks are queued (qspinlock/MCS) to avoid cache-line storms. In user space, spinning is risky: if the holder is preempted, spinners waste whole time slices.</li>
<li><b>Reader-writer locks</b> help only when reads dominate and critical sections are long; otherwise the extra atomic on the reader count is a contention point. The kernel prefers <b>RCU</b> for read-mostly data (readers take no lock at all; writers copy-update and wait for a grace period) and <b>seqlocks</b> for small frequently read data (time).</li>
<li><b>Atomics</b>: a single counter or flag needs no lock; compare-and-swap loops build lock-free structures (next lessons). Contended atomics still bounce cache lines.</li></ul>
<h3>Choosing (what the sim visualizes)</h3><table><tr><th>Situation</th><th>Choice</th></tr><tr><td>Short critical section, can’t sleep (IRQ/kernel)</td><td>spinlock (irqsave if shared with IRQ)</td></tr><tr><td>User space, critical section may block or is long</td><td>mutex (+ condition variable)</td></tr><tr><td>Read-mostly, rare updates</td><td>RCU / shared_ptr snapshot / seqlock</td></tr><tr><td>Single-producer single-consumer handoff</td><td>lock-free ring buffer</td></tr><tr><td>High-rate counters</td><td>per-thread/per-CPU sharding</td></tr></table>
<h3>Condition variables</h3><p>Always wait in a loop on a predicate (spurious wakeups, stolen wakeups): <code>cv.wait(lk, []{ return !q.empty(); });</code>. Notify after changing state under the mutex. Lost-wakeup bug: checking the predicate without the lock.</p>
<h3>Contention is the real enemy</h3><p>No lock is fast under heavy contention. Senior answers reduce sharing: partition data (per-core queues, sharded maps), shorten critical sections (compute outside, swap pointers inside), batch, or use message passing.</p>`,
poly:R`Your drivers use spinlocks with IRQ handlers and mutexes in ioctl paths; user-space media code uses std::mutex/condition variables between pipeline threads. A strong story: you found a mutex held across a blocking I²C transaction in a hot path and restructured it (copy config under lock, perform I/O outside), cutting frame jitter.`,
quiz:[
{q:'A kernel driver’s data is accessed in an IRQ handler and in process context. In process context you must use…',opts:['mutex_lock','spin_lock_irqsave','spin_lock only','no lock'],a:1,exp:'Otherwise the IRQ can fire on the same CPU while you hold the lock → deadlock.'},
{q:'What happens in the uncontended std::mutex lock path on Linux?',opts:['A syscall every time','A single atomic CAS in user space (futex fast path)','A context switch','Disabling interrupts'],a:1,exp:'Futexes only enter the kernel when there is contention.'},
{q:'Predict the bug:',code:R`std::unique_lock lk(m);
if (q.empty()) cv.wait(lk);
auto x = q.front(); q.pop();`,opts:['None','Spurious/stolen wakeup can leave q empty → UB on front()','Deadlock always','Compile error'],a:1,exp:'Use while/predicate form of wait.'},
{q:'Read-mostly routing table updated once a minute, read millions of times/s. Best?',opts:['Global mutex','RW lock','RCU-style pointer swap (readers lock-free)','Spinlock'],a:2,exp:'Readers pay nothing; writers publish a new copy atomically.'}],
challenge:{prompt:R`<p>Implement a bounded blocking queue in C++ (mutex + two condition variables) with <code>push</code>, <code>pop</code>, <code>try_pop_for(timeout)</code> and <code>close()</code> (wakes all waiters; pop returns empty optional after drain). Write a stress test with 4 producers/4 consumers verifying every item is consumed exactly once. Then compare throughput against a spinlock version and explain.</p>`,
hints:['Two CVs: not_full and not_empty. Wait with predicates that also check <code>closed_</code>.','close(): set flag under lock, then notify_all on both CVs.','Verify with per-item counters (std::atomic<int> seen[N]) after join.'],
solution:R`template<class T> class BQ {
  std::mutex m; std::condition_variable nf, ne; std::deque<T> q; size_t cap; bool closed=false;
public:
  explicit BQ(size_t c):cap(c){}
  bool push(T v){ std::unique_lock l(m); nf.wait(l,[&]{return closed||q.size()<cap;});
    if(closed) return false; q.push_back(std::move(v)); l.unlock(); ne.notify_one(); return true; }
  std::optional<T> pop(){ std::unique_lock l(m); ne.wait(l,[&]{return closed||!q.empty();});
    if(q.empty()) return std::nullopt; T v=std::move(q.front()); q.pop_front(); l.unlock(); nf.notify_one(); return v; }
  void close(){ { std::lock_guard l(m); closed=true; } nf.notify_all(); ne.notify_all(); }
};`},
interview:[{q:'"When would you use a spinlock over a mutex?"',a:'When the critical section is very short and bounded, the holder cannot be preempted/sleep (kernel with preemption disabled, IRQ context), and waiting by sleeping would cost more than spinning (context switch ~µs). In user space, prefer mutexes (adaptive) because the holder can be descheduled. Mention irqsave variants, priority/real-time concerns, and that contention should be reduced structurally first.'}],
resources:[['Kernel docs: Unreliable guide to locking','https://docs.kernel.org/kernel-hacking/locking.html'],['Ulrich Drepper: Futexes Are Tricky','https://www.akkadia.org/drepper/futex.pdf'],['Paul McKenney: Is Parallel Programming Hard? (perfbook)','https://mirrors.edge.kernel.org/pub/linux/kernel/people/paulmck/perfbook/perfbook.html'],['Educative: Modern C++ Concurrency in Practice','https://www.educative.io/courses/modern-cpp-concurrency-in-practice-get-the-most-out-of-any-machine']]},
{id:'lockfree',title:'Lock-free ring buffers, CAS, and the ABA problem',minutes:35,skills:['lockfree','memmodel','concurrency'],sims:['spscRing'],
analogy:R`An SPSC ring buffer is a <b>sushi conveyor</b> with one chef and one diner. The chef only moves the "placed" marker; the diner only moves the "eaten" marker. Because each marker has exactly one writer, they never need to argue — they only need to make sure the plate is on the belt <i>before</i> the marker says so (release/acquire).`,
body:R`<h3>SPSC ring</h3><pre>template&lt;class T, size_t N&gt; // N power of two
class Spsc {
  alignas(64) std::atomic&lt;size_t&gt; head{0};  // written by producer
  alignas(64) std::atomic&lt;size_t&gt; tail{0};  // written by consumer
  T buf[N];
public:
  bool push(const T&amp; v) {
    size_t h = head.load(std::memory_order_relaxed);
    if (h - tail.load(std::memory_order_acquire) == N) return false;  // full
    buf[h &amp; (N-1)] = v;
    head.store(h + 1, std::memory_order_release);   // publish slot
    return true;
  }
  bool pop(T&amp; out) {
    size_t t = tail.load(std::memory_order_relaxed);
    if (head.load(std::memory_order_acquire) == t) return false;     // empty
    out = buf[t &amp; (N-1)];
    tail.store(t + 1, std::memory_order_release);   // free slot
    return true;
  }
};</pre>
<p>Key points: monotonically increasing indices with masking (no ambiguity between full and empty), each index written by only one thread, release on publish / acquire on observe, indices on separate cache lines, and optionally caching the other side’s index locally to reduce coherence traffic (as in rigtorp’s SPSCQueue and DPDK rte_ring). This is exactly how DMA descriptor rings (Module 2) and kernel io_uring SQ/CQ rings work.</p>
<h3>MPMC and CAS</h3><p>With multiple producers, the head is contended: producers CAS (compare_exchange) to claim slots, and need per-slot sequence numbers to know when a slot is fully written (Vyukov bounded MPMC queue). Lock-free means <i>some</i> thread always makes progress; wait-free means <i>every</i> thread does in bounded steps.</p>
<h3>ABA</h3><p>Treiber stack pop: read top=A, read A->next=B, CAS(top, A, B). Meanwhile another thread pops A, pops B, pushes A back (same address, maybe reused memory). CAS succeeds because top is "A" again, installing freed B → corruption. Fixes: tagged pointers (version counter + pointer in a 128-bit CAS, or using spare bits), <b>hazard pointers</b>, epoch-based reclamation, RCU, or avoiding node reuse. Memory reclamation is the hard part of lock-free design.</p>
<h3>When not to go lock-free</h3><p>Lock-free code is harder to verify (use TSan, relacy, model checking/CDSChecker), can be slower than a good mutex under low contention, and gives no fairness guarantees. Use it in hot, well-understood paths (SPSC handoffs between real-time and non-real-time threads, telemetry buffers, driver rings).</p>`,
poly:R`Frame handoff from a capture callback to an encoder thread, or audio buffers between a real-time audio thread and network thread, are textbook SPSC rings — and audio threads must never block on a mutex. CrowdStrike’s sensor role explicitly lists lock-free algorithms for event pipelines; your driver rings are proof you understand the pattern.`,
quiz:[
{q:'Why can the SPSC ring use relaxed loads for its own index?',opts:['It can’t','Only that thread writes it, so it always sees its latest value','Relaxed is always safe','Because of padding'],a:1,exp:'A thread always observes its own writes in program order.'},
{q:'Producer writes buf[h] then head.store(h+1, relaxed). Bug?',opts:['No','Consumer may see new head before the slot data → read stale element','Deadlock','Overflow'],a:1,exp:'Needs release (paired with consumer acquire).'},
{q:'The ABA problem arises because…',opts:['CAS compares values, not history — a value can change and change back','Atomics are slow','Pointers are 64-bit','Of false sharing'],a:0,exp:'Same bits, different meaning (reused node).'},
{q:'Lock-free guarantees…',opts:['Every thread completes in bounded steps','System-wide progress: some thread always completes','No contention','Better performance always'],a:1,exp:'That is lock-freedom; per-thread bound is wait-freedom.'}],
challenge:{prompt:R`<p>Implement the SPSC ring above, then (1) add cached remote indices to cut cross-core traffic, (2) benchmark ops/s between two pinned threads vs a mutex+deque queue, (3) run under ThreadSanitizer, then deliberately change the release to relaxed and see whether TSan (or an ARM machine) catches it. Bonus: implement Vyukov’s bounded MPMC queue.</p>`,
hints:['Producer keeps <code>tailCache</code>; only reload tail (acquire) when the ring looks full.','Expect 50–200M ops/s for SPSC vs ~5–20M for mutex queue on the same core pair.','Vyukov: each cell has <code>std::atomic&lt;size_t&gt; seq</code>; producer CAS on enqueue_pos when cell.seq == pos.'],
solution:R`bool push(const T& v) {
  size_t h = head.load(std::memory_order_relaxed);
  if (h - tailCache == N) {                         // looks full: refresh
    tailCache = tail.load(std::memory_order_acquire);
    if (h - tailCache == N) return false;
  }
  buf[h & (N-1)] = v;
  head.store(h + 1, std::memory_order_release);
  return true;
}  // tailCache lives on the producer's cache line; symmetric headCache for the consumer`},
interview:[{q:'"Design a lock-free queue for passing events from a kernel driver to user space."',a:'Use a shared-memory ring (like perf ring buffer / io_uring / BPF ringbuf): kernel is the single producer per CPU, user space consumes; head/tail indices with release/acquire (smp_store_release/smp_load_acquire), power-of-two size, overflow policy (drop + counter vs block), wakeup via eventfd/poll only when the consumer is idle to avoid syscalls per event, per-CPU rings to avoid producer contention, and records with length headers for variable-size events. Discuss memory ordering on ARM and testing with fault injection.'}],
resources:[['Preshing: An Introduction to Lock-Free Programming','https://preshing.com/20120612/an-introduction-to-lock-free-programming/'],['rigtorp/MPMCQueue (bounded MPMC queue in the Vyukov style)','https://github.com/rigtorp/MPMCQueue'],['rigtorp/SPSCQueue','https://github.com/rigtorp/SPSCQueue'],['Kernel docs: circular buffers','https://docs.kernel.org/core-api/circular-buffers.html']]},
{id:'deadlock',title:'Deadlock, livelock, and priority inversion',minutes:25,skills:['concurrency','realtime','linux-kernel','kernel-debug'],sims:['priorityInversion'],
analogy:R`Priority inversion is the <b>ambulance stuck behind a garbage truck</b> that is itself stuck behind a parked car: the most urgent vehicle waits on the least urgent one, and medium traffic keeps the parked car from ever moving. Priority inheritance temporarily gives the parked car a siren.`,
body:R`<h3>Deadlock</h3><p>Coffman conditions — all four must hold: mutual exclusion, hold-and-wait, no preemption, circular wait. Break any one: global <b>lock ordering</b> (most practical; Linux enforces with <b>lockdep</b>, which detects potential inversions at runtime even if they never actually deadlock), <code>std::scoped_lock(a, b)</code> (deadlock-avoidance algorithm for multiple mutexes), try-lock with back-off, or fewer locks. Common hidden cycles: calling a callback while holding a lock, logging that takes a lock, a lock taken in both process and IRQ context without irqsave, and <code>flush_work()</code> on a work item that takes the lock you hold.</p>
<h3>Livelock and starvation</h3><p>Livelock: threads keep reacting to each other without progress (two polite people in a hallway; CAS loops with symmetric retry). Fix with randomized back-off. Starvation: unfair locks or readers starving writers.</p>
<h3>Priority inversion (sim)</h3><p>Low-priority task L holds a mutex; high-priority H blocks on it; medium M (CPU-bound) preempts L, so H waits on M indefinitely. Famous case: <b>Mars Pathfinder</b> (1997) resets, fixed by enabling priority inheritance in VxWorks. Solutions: <b>priority inheritance</b> (L temporarily runs at H’s priority while holding the lock — Linux <code>PTHREAD_PRIO_INHERIT</code>, rt_mutex, all sleeping locks in PREEMPT_RT), <b>priority ceiling</b> (lock has a ceiling priority), or avoid sharing locks across priority levels (lock-free handoff).</p>
<h3>Debugging deadlocks</h3><p>Kernel: lockdep splats, hung task detector, <code>echo t &gt; /proc/sysrq-trigger</code> (all task stacks), <code>echo l</code> (backtrace all CPUs). User space: gdb <code>thread apply all bt</code>, pstack, TSan’s lock-order-inversion detector, and core dumps from watchdogs.</p>`,
poly:R`Device firmware with real-time audio threads and normal-priority control threads is prime territory for priority inversion: if the audio thread takes a mutex also used by a logging/config thread, audio glitches appear under load. For Optimus-style robots, control loops at 1 kHz have the same issue — this lesson is directly redeployable.`,
quiz:[
{q:'Which single policy most commonly prevents deadlocks in large codebases?',opts:['Use more threads','Global lock ordering (enforced with lockdep or code review)','Spinlocks everywhere','Disable preemption'],a:1,exp:'Removes circular wait.'},
{q:'Priority inheritance means…',opts:['Children inherit thread priority','A lock holder temporarily runs at the highest priority of its waiters','Priorities are averaged','Locks have no owner'],a:1,exp:'Prevents medium-priority tasks from preempting the holder.'},
{q:'Thread A: lock(m1); lock(m2). Thread B: lock(m2); lock(m1). What does lockdep do?',opts:['Nothing unless a deadlock actually happens','Reports the possible circular dependency the first time both orders are observed','Fixes it','Crashes the kernel'],a:1,exp:'Lockdep tracks lock classes and order graphs to report potential deadlocks.'},
{q:'Mars Pathfinder resets were caused by…',opts:['Radiation','Priority inversion on a shared bus mutex, fixed by enabling priority inheritance','Memory leak','Stack overflow'],a:1,exp:'The watchdog reset the system when a high-priority task missed deadlines.'}],
challenge:{prompt:R`<p>Reproduce priority inversion on Linux: three SCHED_FIFO threads (prio 10/20/30) pinned to one CPU; L takes a mutex and does work; H wants the mutex; M burns CPU. Measure H’s wait time. Then set the mutex protocol to <code>PTHREAD_PRIO_INHERIT</code> and measure again. (Run as root or with CAP_SYS_NICE.)</p>`,
hints:['<code>pthread_attr_setschedpolicy(&a, SCHED_FIFO)</code> + <code>pthread_attr_setinheritsched(&a, PTHREAD_EXPLICIT_SCHED)</code>.','<code>pthread_mutexattr_setprotocol(&ma, PTHREAD_PRIO_INHERIT)</code>.','Pin with <code>pthread_setaffinity_np</code> to CPU 0 so they truly compete.'],
solution:R`<p>Without PI, H’s wait ≈ M’s entire burn duration (unbounded inversion). With PI, H waits only for L’s remaining critical section. Show timestamps per thread and explain. Note that std::mutex doesn’t expose the protocol — use pthread directly or a wrapper.</p>`},
interview:[{q:'"You have a hang in production with no reproduction. How do you approach it?"',a:'Capture state: core dump or all-thread backtraces (gdb, sysrq-t, hung task detector), lock ownership (glibc mutex __owner field, lockdep in debug builds), and recent logs/metrics. Look for cycles in waits-for graph, locks held across blocking calls/callbacks, IRQ-context lock misuse, and priority issues. Add prevention: lock ordering docs, lockdep/TSan in CI, watchdogs that dump state, timeouts with diagnostics.'}],
resources:[['What really happened on Mars? (Pathfinder)','https://www.cs.cornell.edu/courses/cs614/1999sp/papers/pathfinder.html'],['Kernel docs: lockdep design','https://docs.kernel.org/locking/lockdep-design.html'],['Kernel docs: RT-mutex design','https://docs.kernel.org/locking/rt-mutex-design.html']]}
]});
})();
