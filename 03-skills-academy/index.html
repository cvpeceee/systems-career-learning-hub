{id:'replication',title:'Replication, quorums and consistency trade-offs',minutes:30,skills:['dist-sys','storage-data'],sims:['quorum'],
analogy:R`Quorums are a <b>committee rule</b>: a decision needs W signatures, and when you ask "what did we decide?" you poll R members. If W + R exceeds the committee size, at least one person you poll must have signed the latest decision.`,
body:R`<h3>Replication styles</h3><ul><li><b>Single-leader</b> (primary/backup, Raft): simple consistency; leader is a bottleneck and failover point. Async replication risks losing acknowledged writes on failover; sync replication costs latency.</li><li><b>Multi-leader</b>: multiple regions accept writes → conflicts (LWW, CRDTs, app merge).</li><li><b>Leaderless</b> (Dynamo, Cassandra): clients write to W of N replicas and read from R. With W + R &gt; N reads overlap writes (sim). Repair via read-repair, hinted handoff and anti-entropy (Merkle trees). Sloppy quorums improve availability but break the overlap guarantee.</li></ul>
<h3>Quorum math (sim)</h3><p>N=3, W=2, R=2 tolerates one failure for both reads and writes. W=3,R=1 gives fast reads but any single failure blocks writes. W=1,R=1 is fast and available but may read stale data. Note: even W+R&gt;N isn’t full linearizability without extra mechanisms (read repair synchronization, concurrent writes with LWW).</p>
<h3>Tail latency and quorums</h3><p>Waiting for the fastest W of N responses cuts tail latency vs waiting for all; hedged requests further cut p99 (send a backup request after p95 latency).</p>
<h3>Replication lag anomalies</h3><p>Read-your-writes violations (user updates profile, refreshes, sees old one) → route user’s reads to leader for a while or track a version token. Monotonic reads → stick sessions to one replica. Consistent prefix → causal ordering within partitions.</p>
<h3>Durability and failure domains</h3><p>Place replicas across racks/zones; recognize correlated failures (same power, same bad deploy, same kernel bug). Erasure coding (e.g. RS(10,4)) gives durability at 1.4× storage vs 3× for replication at the cost of repair bandwidth and read latency. Chain replication offers strong consistency with high throughput (write to head, read from tail).</p>
<h3>Change data capture and logs</h3><p>Many systems treat a replicated log (Kafka) as the source of truth and derive views — JPMorgan’s payments data platform-type roles care about exactly-once processing (idempotent producers + transactional consumers), ordering per key and replay.</p>`,
poly:R`Device configuration sync between a cloud management portal and thousands of endpoints is a replication problem with long partitions (devices offline for weeks). You likely designed version numbers/desired-vs-reported state — that is leaderless convergence with a single authority, a great interview example.`,

{id:'partition',title:'Partitioning and consistent hashing',minutes:25,skills:['dist-sys','lb-traffic','storage-data'],sims:['hashRing'],
analogy:R`Consistent hashing is <b>seating guests around a round table by name</b>; each host serves the guests clockwise until the next host. When a host leaves, only their guests move to the neighbor — not everyone in the room.`,
body:R`<h3>Why not hash mod N?</h3><p><code>server = hash(key) % N</code> remaps ~all keys when N changes (N→N+1 moves fraction N/(N+1)). For caches that means a cold-cache stampede; for storage, massive data movement.</p>
<h3>Consistent hashing (sim)</h3><p>Hash servers and keys onto a ring [0, 2^32); a key belongs to the first server clockwise. Adding/removing a server moves only ~1/N of keys. Use <b>virtual nodes</b> (100–200 tokens per server) to even out load and allow weighting by capacity. Variants: <b>rendezvous (HRW) hashing</b> (pick the server with highest hash(key, server); simple, no ring), <b>jump consistent hash</b> (Google; tiny, fast, servers must be numbered), <b>Maglev hashing</b> (lookup table for load balancers with minimal disruption), and <b>consistent hashing with bounded loads</b> (Google/Vimeo; caps each server at (1+ε)×average to avoid hot spots).</p>
<h3>Range partitioning</h3><p>Keys sorted into ranges (Bigtable tablets, Spanner splits, CockroachDB ranges) — supports range scans, needs split/merge and a metadata service mapping ranges to servers. Hot ranges (monotonic keys like timestamps) → add hash prefix or split by load.</p>
<h3>Hot keys and rebalancing</h3><ul><li>Celebrity/hot key problems: replicate hot keys, add random suffix and fan-out reads, local caching with request coalescing.</li><li>Rebalancing should be gradual and throttled (moving data competes with production traffic); avoid auto-rebalancing during incidents.</li><li>Request routing: client-side (smart clients with partition map), routing tier (proxies), or any-node forwarding (gossip-based map).</li></ul>
<h3>Secondary indexes</h3><p>Local (document-partitioned: writes cheap, reads scatter-gather) vs global (term-partitioned: reads targeted, writes cross partitions, usually async).</p>`,
poly:R`Mapping thousands of devices to backend shards (telemetry ingestion, device twin service) uses exactly this. Load balancers you will build or operate (Module 8) use Maglev-style consistent hashing for connection affinity.`,

{q:'With consistent hashing, adding an 11th server moves about…',opts:['1/11 of keys','10/11 of keys','half','all'],a:0,exp:'Only keys in the new server’s arcs move.'},
{q:'Purpose of virtual nodes?',opts:['Security','Smoother load distribution and weighted capacity','Fewer hashes','Replication only'],a:1,exp:'Many small arcs per server average out variance.'},

challenge:{prompt:R`<p>Implement in C++ or Python: (1) a consistent hash ring with virtual nodes and weights; (2) rendezvous hashing; (3) jump consistent hash. For 1M keys, measure load standard deviation across 10 servers for vnodes = 1, 10, 100, 1000, and the fraction of keys moved when adding a server. Add "bounded loads" and show the max load drops.</p>`,
hints:['Ring: sorted vector of (hash, server); lookup with lower_bound, wrap around.','Jump hash is ~10 lines: see Lamping & Veach paper.','Bounded loads: if the chosen server is at capacity ceil((1+ε)·avg), continue clockwise.'],
solution:R`int32_t jump_hash(uint64_t key, int32_t buckets) {   // Lamping & Veach
  int64_t b = -1, j = 0;
  while (j < buckets) {
    b = j;
    key = key * 2862933555777941757ULL + 1;
    j = (b + 1) * (double(1LL << 31) / double((key >> 33) + 1));
  }
  return b;
}`},

{id:'failure',title:'Failure handling: timeouts, retries, idempotency, metastability',minutes:35,skills:['dist-sys','deploy','sysdesign'],sims:['retryStorm'],
analogy:R`Retries are like <b>everyone redialing a busy pizza shop</b>. A few redials help; when the shop is overwhelmed, everyone redialing every second guarantees nobody gets through — and the shop stays jammed even after the rush ends. Idempotency is the order number that stops you from getting five pizzas when you called five times.`,
body:R`<h3>Partial failure is the default</h3><p>A timeout means "unknown outcome": the request may have been lost, processed, or still in flight. Therefore every retried operation must be <b>idempotent</b> or deduplicated: idempotency keys stored with results (Stripe-style), conditional writes (compare-and-set on version), at-least-once delivery + dedup = effectively-once.</p>
<h3>Retry discipline</h3><ul><li><b>Exponential backoff with jitter</b>: sleep = random(0, min(cap, base·2^attempt)) ("full jitter") prevents synchronized retry waves.</li><li><b>Retry budgets</b>: retries ≤ 10% of requests per client/service; retry only at one layer (retries at each of 5 layers multiply: 3^5 = 243×).</li><li><b>Deadlines</b> propagated (gRPC deadline) so downstream work stops when the caller gave up.</li><li><b>Circuit breakers</b> stop calling a failing dependency; <b>load shedding</b> rejects early (cheap 503) instead of timing out expensive work; <b>admission control</b> by priority.</li></ul>
<h3>Metastable failures (sim)</h3><p>A trigger (brief overload, cache flush, GC pause) pushes a system into a bad state that sustains itself even after the trigger is removed — typically via retry amplification or cache misses hammering the database. Signature: load drops back to normal but goodput doesn’t recover until operators shed load. Prevention: retry budgets, shedding by queue age (drop requests whose deadline already passed), LIFO under overload, bounded queues, warm-up limits for caches, and capacity headroom.</p>
<h3>Other failure modes to name in interviews</h3><ul><li>Gray failures (slow, not dead) → outlier detection, hedging.</li><li>Thundering herd after recovery → jittered reconnects, token buckets.</li><li>Poison pill messages → DLQ after N attempts.</li><li>Split brain → fencing tokens/leases, quorum.</li><li>Cascading failure across services → bulkheads (separate pools), timeouts shorter than callers’.</li><li>Bad config/deploy (most common outage cause) → Module 9.</li></ul>
<div class="callout num"><b>Numbers:</b> with 3 retries per layer and 4 layers, a single user request can become 4^4 = 256 calls at the bottom during an outage.</div>`,
poly:R`Devices reconnecting to the cloud after a regional outage produce a thundering herd. If you implemented reconnect backoff with jitter in device firmware or saw a fleet DDoS your own backend, that is a perfect incident story with real-world numbers.`,
quiz:[
{q:'Client times out on "charge card $50". Safest retry?',opts:['Retry immediately','Retry with the same idempotency key so the server deduplicates','Never retry','Retry with a new request ID'],a:1,exp:'Outcome unknown; the key makes the operation idempotent.'},
{q:'Why add jitter to exponential backoff?',opts:['Security','Desynchronize clients so retries don’t arrive in waves','Lower latency','Required by HTTP'],a:1,exp:'Without jitter, clients that failed together retry together.'},
{q:'A system stays overloaded after the triggering spike ends, sustained by retries. This is…',opts:['A memory leak','A metastable failure','Normal autoscaling','Split brain'],a:1,exp:'Requires load shedding/retry budgets to escape.'},
{q:'Retries should generally happen…',opts:['At every layer','At one layer (usually closest to the user or a smart client) with a budget','Never','Only in the database'],a:1,exp:'Layered retries multiply load exponentially.'}],
challenge:{prompt:R`<p>Write a token-bucket-protected service and a client simulator (Python asyncio). Implement: retries with full-jitter backoff, a client-side retry budget (10%), a circuit breaker (closed/open/half-open) and server-side load shedding by queue age. Inject a 30-second overload and show goodput recovery with and without these mechanisms.</p>`,

solution:R`class Breaker:
    def __init__(s, fail_thresh=5, cooldown=10): s.state='closed'; s.fails=0; s.opened=0; s.t=fail_thresh; s.cd=cooldown
    def allow(s, now):
        if s.state == 'open' and now - s.opened > s.cd: s.state = 'half'
        return s.state != 'open'
    def record(s, ok, now):
        if ok: s.fails = 0; s.state = 'closed'
        else:
            s.fails += 1
            if s.state == 'half' or s.fails >= s.t: s.state = 'open'; s.opened = now`},

summary:'TCP internals and congestion control, IP forwarding and longest-prefix match, BGP, the Linux packet path with XDP/DPDK and SDN control vs data planes, RDMA/RoCE for AI fabrics, and load balancing.',
why:'Google NetSoft & Distributed Cloud Networking, F5, Cisco, Clockwork Network Observability, Cloudflare and NVIDIA DGX Cloud need deep networking. AI clusters made RDMA/RoCE and collective traffic a hot skill.',
lessons:[
{id:'tcp',title:'TCP deep dive: handshakes, windows, congestion control',minutes:35,skills:['tcpip','perf-eng'],sims:['tcpCwnd'],
analogy:R`TCP congestion control is <b>merging onto a highway in fog</b>. You speed up gently (slow start doubles each RTT, then additive increase) until you hear a crash (loss), then brake hard (multiplicative decrease). BBR instead watches the road: it measures how fast cars actually get through and how long the trip takes, and drives at that pace.`,
body:R`<h3>Connection lifecycle</h3><p>3-way handshake (SYN, SYN-ACK, ACK) costs 1 RTT before data (TFO and TLS 1.3 0-RTT shave this). Teardown with FIN/ACK; the active closer enters <b>TIME_WAIT</b> for 2×MSL to absorb stray packets — high-rate short connections exhaust ephemeral ports (fix: connection pooling/keepalive, <code>SO_REUSEADDR</code>, more source IPs). SYN floods defended by SYN cookies. Listen backlog: SYN queue + accept queue (<code>somaxconn</code>).</p>
<h3>Flow control vs congestion control</h3><p><b>Flow control</b> protects the receiver: advertised receive window (rwnd, with window scaling). <b>Congestion control</b> protects the network: sender’s cwnd. Effective window = min(cwnd, rwnd); throughput ≈ window / RTT. <b>Bandwidth-delay product</b>: 10 Gb/s × 50 ms = 62.5 MB must be in flight — buffers (<code>tcp_rmem/wmem</code>) must be at least that large.</p>
<h3>Algorithms (sim)</h3><ul><li><b>Reno/NewReno</b> (RFC 5681): slow start (cwnd doubles per RTT until ssthresh), congestion avoidance (+1 MSS per RTT), fast retransmit on 3 duplicate ACKs, fast recovery (halve cwnd), timeout → cwnd=1.</li><li><b>CUBIC</b> (Linux default, RFC 9438): cubic function of time since last loss — probes faster on high-BDP paths, RTT-fair-ish.</li><li><b>BBR</b>: model-based — estimates bottleneck bandwidth and min RTT, paces at that rate; not loss-driven → great on lossy long paths, but fairness interactions with CUBIC are a known issue (BBRv2/v3 addresses).</li><li><b>DCTCP</b>: datacenter; uses ECN marking fraction to cut cwnd proportionally → low queues and latency.</li></ul>
<p>Loss recovery: SACK, RACK-TLP (time-based loss detection), RTO with min 200 ms in Linux (a killer for datacenter tail latency; incast). <b>Mathis formula</b>: throughput ≈ MSS/RTT × 1.22/√p — 1% loss on a 100 ms path caps a Reno flow at ~1.4 Mb/s with 1460-byte MSS.</p>
<h3>Linux tuning & debugging</h3><p><code>ss -ti</code> (cwnd, rtt, retrans per socket), <code>nstat</code>/<code>netstat -s</code> counters, tcpdump/Wireshark, <code>tcp_congestion_control</code>, pacing (fq qdisc), GRO/GSO/TSO offloads, busy polling, <code>TCP_NODELAY</code> (Nagle + delayed ACK = 40 ms stalls for small writes). Head-of-line blocking motivates QUIC (UDP-based, streams, 0-RTT, connection migration).</p>`,
poly:R`Video conferencing over WAN is a congestion-control problem: real-time media uses UDP with its own congestion controllers (Google GCC, delay-based) because TCP retransmission latency is unacceptable. Your ability to contrast media transport with TCP is a differentiator for networking roles.`,
quiz:[
{q:'A 1 Gb/s link with 80 ms RTT. Minimum window to fill it?',opts:['1 MB','10 MB','100 KB','80 MB'],a:1,exp:'BDP = 1e9/8 × 0.08 = 10 MB.'},
{q:'Reno receives 3 duplicate ACKs. What happens?',opts:['cwnd = 1','Fast retransmit; cwnd roughly halved (fast recovery)','Connection reset','cwnd doubles'],a:1,exp:'Timeout is the severe case (cwnd → 1).'},
{q:'Small request/response protocol sees 40 ms latency spikes. Likely?',opts:['Packet loss','Nagle’s algorithm interacting with delayed ACKs; set TCP_NODELAY','DNS','MTU'],a:1,exp:'Classic small-write stall.'},
{q:'Why does BBR handle random (non-congestion) loss better than CUBIC?',opts:['It ignores ACKs','It doesn’t treat loss as the primary congestion signal; it paces to measured bandwidth','It uses UDP','It retransmits more'],a:1,exp:'Loss-based algorithms back off on every loss.'}],
challenge:{prompt:R`<p>On two Linux VMs (or network namespaces with veth), use <code>tc qdisc add dev veth0 root netem delay 50ms loss 1%</code> and run <code>iperf3</code> with cubic vs bbr. Record throughput and <code>ss -ti</code> cwnd over time. Then set rate limit 100 Mbit with a large buffer and observe bufferbloat (RTT rise) for cubic vs bbr. Explain with the sim’s model.</p>`,
hints:['<code>ip netns add a; ip link add va type veth peer name vb; ip link set vb netns a</code>…','<code>iperf3 -C bbr</code> picks congestion control per test.','Bufferbloat: <code>tc qdisc add dev X root tbf rate 100mbit burst 32kbit latency 400ms</code>, ping during the transfer.'],
solution:R`<p>Expected: with 1% loss + 50 ms, CUBIC achieves a fraction of capacity (Mathis), BBR near link rate. With a deep buffer, CUBIC fills it (ping RTT rises by hundreds of ms); BBR keeps queues small. Mention fq qdisc for pacing and the fairness caveat when they compete.</p>`},
interview:[{q:'"A service’s throughput between two regions is far below link capacity. Debug it."',a:'Compute BDP and check socket buffers/window scaling (ss -ti: rwnd-limited vs cwnd-limited), look at retransmissions/loss (nstat, tcpdump), RTT, congestion algorithm, MTU/PMTUD blackholes (MSS clamping), NIC offloads and CPU (single flow on one core), middleboxes. Fixes: tune buffers, BBR, parallel streams, fix loss source. Show you can read a tcptrace/Wireshark time-sequence graph.'}],
resources:[['RFC 5681: TCP Congestion Control','https://www.rfc-editor.org/rfc/rfc5681'],['RFC 9438: CUBIC','https://www.rfc-editor.org/rfc/rfc9438'],['BBR: Congestion-Based Congestion Control (ACM Queue)','https://queue.acm.org/detail.cfm?id=3022184'],['High Performance Browser Networking (Grigorik), free online','https://hpbn.co/']]},
{id:'ip',title:'IP forwarding, L2/L3 and longest-prefix match',minutes:30,skills:['routing','dataplane','tcpip'],sims:['lpm'],
analogy:R`A router is a <b>postal sorting center</b>. It doesn’t know every house; it knows "anything for 10.0.0.0/8 goes to truck A, 10.1.0.0/16 to truck B". The most specific matching rule wins — that’s longest-prefix match.`,
body:R`<h3>Layers in practice</h3><p><b>L2</b> (Ethernet): MAC learning switches, VLANs (802.1Q), STP or better L3 designs, ARP/ND resolve IP→MAC. <b>L3</b> (IP): routing between subnets via forwarding tables (FIB) built from routing protocols (RIB). Datacenters use <b>Clos/leaf-spine</b> fabrics with ECMP (equal-cost multipath, hashing 5-tuples onto paths) and BGP as the IGP; overlays (VXLAN with EVPN control plane) give tenants virtual L2/L3 networks over the IP underlay.</p>
<h3>Longest-prefix match (sim)</h3><p>A FIB lookup finds the most specific prefix containing the destination. Data structures: binary/path-compressed tries (Patricia), multibit tries (stride 8/16), Linux’s LC-trie (<code>fib_trie</code>), DIR-24-8 (DPDK: 2^24 table + second level; 1–2 memory accesses), and hardware <b>TCAM</b> (ternary match in parallel, one cycle, but power-hungry and small — full Internet table ~1M IPv4 routes stresses TCAM sizes).</p>
<h3>Forwarding path</h3><p>Ingress → parse → ACL → LPM → next hop (ECMP group) → rewrite (MAC, TTL−1, checksum) → queue (QoS classes, DSCP) → egress. Control plane (routing protocols, ARP, management) runs on a CPU; data plane in ASICs at Tb/s (Broadcom Tomahawk/Jericho, Cisco Silicon One) or in software (DPDK, VPP, XDP) at tens–hundreds of Gb/s. Programmable data planes: P4.</p>
<h3>MTU and fragmentation</h3><p>Ethernet 1500 (jumbo 9000 in DCs). Overlays add headers (VXLAN +50 bytes) → PMTUD; ICMP blocked → blackholes; MSS clamping. IPv6 forbids router fragmentation.</p>
<h3>Linux as a router</h3><p><code>ip route</code>, policy routing (<code>ip rule</code>, multiple tables), VRFs, network namespaces, bridges, <code>nftables</code>/iptables (netfilter hooks), conntrack (stateful NAT; table exhaustion is a classic outage), and switchdev offload (SONiC on Cisco/whitebox switches runs Linux with ASIC offload through SAI).</p>`,
poly:R`Conference devices sit on enterprise networks with VLANs, QoS (DSCP marking for voice/video), 802.1X and multicast — and you’ve probably debugged MTU or QoS issues for customers. Cisco’s principal role lists SONiC/ONIE/BMC — your Linux + board bring-up background makes switch platform work a natural transition.`,
quiz:[
{q:'FIB: 10.0.0.0/8→A, 10.1.0.0/16→B, 10.1.2.0/24→C, 0.0.0.0/0→D. Destination 10.1.3.7 goes to…',opts:['A','B','C','D'],a:1,exp:'Matches /8 and /16; /24 doesn’t contain 10.1.3.x → longest is /16 → B.'},
{q:'Why do switches use TCAM for lookups?',opts:['Cheap','Parallel ternary matching in one cycle for LPM/ACLs','Lower power','Unlimited size'],a:1,exp:'Speed at the cost of power/area.'},
{q:'VXLAN adds ~50 bytes. Hosts send 1500-byte packets on a 1500-MTU underlay. Result?',opts:['Fine','Drops/fragmentation unless underlay MTU raised or inner MTU/MSS lowered','Faster','Encryption'],a:1,exp:'Raise underlay MTU (e.g. 9000) or clamp.'},
{q:'ECMP hashes on the 5-tuple so that…',opts:['Packets are encrypted','Each flow stays on one path (no reordering) while flows spread across paths','All packets use all paths','Routing converges'],a:1,exp:'Per-flow hashing avoids TCP reordering; large "elephant" flows can still collide.'}],
challenge:{prompt:R`<p>Implement an IPv4 LPM in C++ two ways: a binary trie and DIR-24-8. Load a real BGP table dump (or 900k random prefixes), then benchmark lookups/sec for 10M random addresses and memory use. Verify both give identical results.</p>`,
hints:['Binary trie: walk 32 bits max, remember last node with a next hop.','DIR-24-8: tbl24[2^24] entries; if prefix ≤ 24 fill a range; if > 24 point to a 256-entry tbl8 group.','Insert prefixes in increasing length order for DIR-24-8 so longer ones overwrite.'],
solution:R`uint16_t lookup(uint32_t ip) {                  // DIR-24-8
  uint32_t e = tbl24[ip >> 8];
  if (!(e & 0x8000)) return e;                    // direct next hop
  return tbl8[((e & 0x7fff) << 8) | (ip & 0xff)]; // second level
}  // ~1-2 memory accesses; tens of Mlookups/s per core vs trie's up to 32 dependent loads`},
interview:[{q:'"How does a packet get from a VM in one datacenter to a VM in another?"',a:'Walk it: guest kernel routing → virtio → host vswitch/eBPF data plane (encap VXLAN/Geneve, security policy, NAT) → NIC (offloads) → ToR/leaf (ECMP) → spine → border/WAN routers (BGP, MPLS/SR) → remote DC fabric → decap → VM. Mention control planes programming each hop (SDN controllers, BGP EVPN), MTU, and where to measure (counters, mirroring, INT telemetry).'}],
resources:[['Linux kernel docs: networking','https://docs.kernel.org/networking/index.html'],['DPDK LPM library documentation','https://doc.dpdk.org/guides/prog_guide/lpm_lib.html'],['SONiC (GitHub)','https://github.com/sonic-net/SONiC']]},
{id:'bgp',title:'BGP: how the Internet (and datacenters) route',minutes:30,skills:['routing'],sims:['bgp'],
analogy:R`BGP is <b>gossip between neighborhoods about who can deliver mail where</b>. Each neighborhood tells neighbors "I can reach X via this path of neighborhoods". Everyone picks the path they like best (policy first, then shortest), and nobody verifies claims unless they check a signed registry (RPKI).`,
body:R`<h3>Basics</h3><p>BGP-4 (RFC 4271) is a path-vector protocol over TCP port 179 between peers. <b>eBGP</b> between autonomous systems (ASes), <b>iBGP</b> within an AS (full mesh or route reflectors). Routes carry attributes: AS_PATH (loop prevention, path length), NEXT_HOP, LOCAL_PREF (prefer egress within AS), MED (hint to neighbor which entry to use), communities (tags for policy), ORIGIN.</p>
<h3>Best path selection (simplified order)</h3><ol><li>Highest LOCAL_PREF</li><li>Shortest AS_PATH</li><li>Lowest ORIGIN</li><li>Lowest MED (same neighbor AS)</li><li>eBGP over iBGP</li><li>Lowest IGP cost to next hop (hot-potato)</li><li>Tie-breakers (router ID)</li></ol><p>Policy is economic: prefer customer routes > peer > provider; don’t export peer/provider routes to other peers/providers (Gao-Rexford "valley-free").</p>
<h3>Convergence and failure (sim)</h3><p>When a link fails, withdrawals propagate; path exploration can take seconds to minutes on the Internet (MRAI timers). Datacenters tune aggressively (BFD for sub-second failure detection, ECMP with fast reroute). Route flap damping suppresses unstable prefixes.</p>
<h3>Security</h3><p>BGP trusts announcements: <b>hijacks</b> (more-specific prefix announced by the wrong AS; e.g. 2008 Pakistan/YouTube) and <b>route leaks</b> (2019 Verizon/Cloudflare incident). Defenses: <b>RPKI</b> ROAs + Route Origin Validation (drop invalid), IRR filtering, max-prefix limits, BGPsec/ASPA (path validation, emerging).</p>
<h3>BGP in the datacenter (RFC 7938)</h3><p>Hyperscalers run eBGP between every tier of the Clos fabric (each ToR its own ASN), using ECMP for multipath and BGP for anycast service VIPs (load balancers announce the same /32 from many locations; Cloudflare and Google front ends). EVPN (BGP address family) distributes MAC/IP reachability for VXLAN overlays — central to F5/Cisco roles.</p>`,
poly:R`Less direct for Poly, but enterprise video endpoints rely on anycast-served cloud services (Zoom/Teams edges) — understanding why a user in Chicago hits a far region during a route leak is useful customer-escalation knowledge. Treat BGP as new territory: learn the attributes and selection order cold.`,
quiz:[
{q:'Router has two routes: LOCAL_PREF 200 with AS_PATH length 5, and LOCAL_PREF 100 with length 2. Which wins?',opts:['Length 2','LOCAL_PREF 200 (checked first)','Lowest router ID','ECMP both'],a:1,exp:'LOCAL_PREF precedes AS_PATH length.'},
{q:'How does BGP prevent loops between ASes?',opts:['TTL','A router rejects routes whose AS_PATH contains its own ASN','Split horizon only','Spanning tree'],a:1,exp:'AS_PATH loop detection.'},
{q:'An attacker announces a more-specific /24 of your /22. Traffic…',opts:['Ignores it','Prefers the /24 everywhere it propagates (LPM) → hijack','Is load-balanced','Is dropped'],a:1,exp:'RPKI ROV with max-length helps drop it.'},
{q:'Why do datacenters use BFD with BGP?',opts:['Encryption','Sub-second failure detection vs slow BGP hold timers','Load balancing','Route compression'],a:1,exp:'Default hold time is 90–180 s.'}],
challenge:{prompt:R`<p>Build a 4-AS lab with FRRouting in containers (containerlab or docker-compose): configure eBGP sessions, announce prefixes, set LOCAL_PREF and AS-path prepending to steer traffic, then shut a link and time convergence with and without BFD. Finally, simulate a hijack and block it with a prefix filter.</p>`,
hints:['FRR config: <code>router bgp 65001</code> / <code>neighbor 10.0.12.2 remote-as 65002</code> / <code>network 192.0.2.0/24</code>.','Prepending: route-map with <code>set as-path prepend 65001 65001</code> outbound.','<code>show bgp ipv4 unicast</code> and <code>show bgp summary</code>; enable BFD with <code>neighbor X bfd</code>.'],
solution:R`<p>Expected: prepending shifts inbound traffic away; LOCAL_PREF shifts outbound; convergence without BFD bounded by hold timer (default 180 s in FRR is configurable; set 9/3 for lab) vs ~ms–1 s with BFD; a more-specific hijack attracts traffic until filtered by prefix-list or RPKI-like policy.</p>`},
interview:[{q:'"Explain how an anycast service handles a datacenter failure."',a:'Each site announces the same prefix via BGP; routers choose the nearest by BGP policy/IGP. When a site fails (or health checks fail), it withdraws the announcement; neighbors reconverge to the next-best site in seconds; TCP connections to the failed site break (stateless or short-lived protocols tolerate this, and L4 LBs with consistent hashing limit disruption on changes). Discuss draining (gradual withdraw, MED/prepend), capacity spillover, and health checks tied to announcements.'}],

{id:'dataplane',title:'The Linux packet path, XDP/DPDK, and control vs data plane (SDN)',minutes:35,skills:['dataplane','ebpf','linux-kernel'],sims:['packetPath'],
analogy:R`The Linux network stack is a <b>full-service airport</b> (security, customs, baggage — flexible but slow per passenger). XDP is a <b>bouncer at the curb</b> who can turn people away or redirect them before they enter the building. DPDK is a <b>private airstrip</b> run by your app that bypasses the airport entirely.`,
body:R`<h3>Receive path (sim)</h3><ol><li>NIC DMA-writes frames into RX ring buffers (Module 2’s DMA ring), may compute checksums, RSS hashes flows onto multiple queues/CPUs.</li><li>Interrupt → NAPI schedules polling (softirq <code>NET_RX</code>); budgeted polling under load avoids interrupt storms.</li><li><b>XDP hook</b> runs an eBPF program on the raw buffer in the driver, before sk_buff allocation: XDP_DROP, XDP_PASS, XDP_TX (bounce back), XDP_REDIRECT (to another NIC, CPU, or AF_XDP socket). Tens of Mpps per core for DDoS filtering and L4 load balancing (Facebook Katran, Cloudflare).</li><li>sk_buff allocated; GRO coalesces segments; <b>tc ingress</b> (eBPF/cls), netfilter PREROUTING (conntrack, NAT), routing decision, INPUT or FORWARD, then TCP/UDP stack → socket buffer → wakeup → <code>recvmsg</code> copy to user.</li></ol>
<p>Costs per packet: interrupts, sk_buff alloc, cache misses, locks, syscalls, copies. At 10 Gb/s with 64-byte packets that’s 14.88 Mpps → 67 ns per packet budget.</p>
<h3>Kernel bypass</h3><ul><li><b>DPDK</b>: user-space poll-mode drivers own the NIC (via VFIO), hugepage mempools, lockless rings, run-to-completion or pipeline models on dedicated cores; 100% CPU even idle; you reimplement the stack you need. Used in VPP (vector packet processing), F5, telco, cloud gateways.</li><li><b>AF_XDP</b>: zero-copy sockets fed by XDP redirect, keeping kernel driver ownership.</li><li><b>io_uring</b> and kernel TLS/sendfile/MSG_ZEROCOPY reduce syscall and copy overhead without bypass.</li><li>SmartNICs/DPUs (NVIDIA BlueField) offload vswitch, encryption, storage.</li></ul>
<h3>Control plane vs data plane</h3><p>Data plane forwards packets per rules at line rate; control plane computes the rules (routing protocols, controllers); management plane configures and observes. <b>SDN</b> centralizes control logic (OpenFlow historically; now gRPC/gNMI/P4Runtime) programming many data planes: Google’s B4/Andromeda/Orion, cloud VPCs. Design principles for Google NetSoft-type roles: intent-based config, consistency of rule updates across devices (two-phase/versioned updates to avoid transient loops/blackholes), fail-static behaviour (data plane keeps forwarding when controller is down), scale of state (millions of flows), and verification (network modeling/verification of reachability before pushing).</p>`,
poly:R`Your NAPI-style thinking from video capture drivers (interrupt → bottom half → buffer handoff) is identical to NIC receive. Lontium/Qualcomm drivers with DMA rings make you credible for NIC driver and DPDK/XDP discussions — emphasize that.`,
quiz:[
{q:'Where does XDP run?',opts:['In user space','In the NIC driver’s receive path before sk_buff allocation','In the TCP stack','In iptables'],a:1,exp:'Earliest software hook; enables very cheap drops/redirects.'},
{q:'Per-packet time budget at 14.88 Mpps on one core?',opts:['~670 ns','~67 ns','~6.7 µs','~6.7 ns'],a:1,exp:'1 / 14.88e6 ≈ 67 ns.'},
{q:'Main downside of DPDK poll-mode drivers?',opts:['Slow','Dedicated cores spin at 100% and you lose the kernel stack’s features/tools','Requires Windows','No hugepages'],a:1,exp:'Trade CPU and operability for throughput/latency.'},
{q:'"Fail static" in SDN means…',opts:['Controller failures drop all traffic','Data plane continues forwarding with last-known-good rules when the controller is unavailable','Static routes only','No updates'],a:1,exp:'Decouples availability of forwarding from control-plane availability.'}],
challenge:{prompt:R`<p>Work through the xdp-tutorial basic and packet01–03 lessons: write an XDP program that counts packets per protocol into a BPF map, then drops UDP to a specific port, then rewrites/redirects ICMP echo (XDP_TX). Measure drop rate with <code>pktgen</code> or <code>trafgen</code> vs an iptables DROP rule.</p>`,
hints:['Use libbpf + clang -target bpf; attach with <code>ip link set dev X xdp obj prog.o sec xdp</code>.','Bounds-check every header access against <code>data_end</code> or the verifier rejects the program.','Use a <code>BPF_MAP_TYPE_PERCPU_ARRAY</code> for counters to avoid atomics.'],
solution:R`SEC("xdp")
int drop_udp_9999(struct xdp_md *ctx) {
  void *data = (void *)(long)ctx->data, *end = (void *)(long)ctx->data_end;
  struct ethhdr *eth = data;            if ((void *)(eth + 1) > end) return XDP_PASS;
  if (eth->h_proto != bpf_htons(ETH_P_IP)) return XDP_PASS;
  struct iphdr *ip = (void *)(eth + 1); if ((void *)(ip + 1) > end) return XDP_PASS;
  if (ip->protocol != IPPROTO_UDP) return XDP_PASS;
  struct udphdr *udp = (void *)ip + ip->ihl * 4; if ((void *)(udp + 1) > end) return XDP_PASS;
  return udp->dest == bpf_htons(9999) ? XDP_DROP : XDP_PASS;
}`},
interview:[{q:'"Design a software L4 load balancer handling 10M packets/s per host."',a:'XDP/eBPF or DPDK data plane; RSS across queues/cores; per-core state with no locks; consistent hashing (Maglev) on 5-tuple to backends with a connection table for stickiness during changes; direct server return or encap (IP-in-IP/GUE) to backends; health checks and control plane updating maps atomically; BGP/ECMP anycast to spread across LB hosts; observability counters per VIP. Mention per-packet budget and cache efficiency.'}],
resources:[['xdp-project/xdp-tutorial','https://github.com/xdp-project/xdp-tutorial'],['DPDK documentation','https://doc.dpdk.org/guides/'],['ebpf.io: What is eBPF?','https://ebpf.io/what-is-ebpf/'],['Andromeda: Google cloud network virtualization (NSDI 2018)','https://research.google/pubs/andromeda-performance-isolation-and-velocity-at-scale-in-cloud-network-virtualization/']]},
{id:'rdma',title:'RDMA, RoCE and AI cluster networking',minutes:35,skills:['rdma','model-parallel','observability'],sims:['ringAllreduce'],
analogy:R`TCP is <b>mailing a package through the post office</b> (CPU handles every step). RDMA is <b>having a key to your friend’s mailbox</b>: your NIC drops data straight into their memory without waking their CPU. Lossless Ethernet (RoCE) requires that the road never drops packages, so traffic lights (PFC) stop cars when a lane is full — which can cause gridlock if misconfigured.`,
body:R`<h3>RDMA model</h3><p>Applications register memory regions (pinned, with keys), create <b>queue pairs</b> (QPs: send + receive queues) and completion queues, and post work requests directly to the NIC from user space (kernel bypass via verbs, <code>libibverbs</code>). Operations: SEND/RECV (two-sided), RDMA WRITE/READ (one-sided — remote CPU uninvolved), atomics. Transports: RC (reliable connected), UD (datagram), DC/SRD variants. Latency ~1–2 µs, line-rate 400 Gb/s with near-zero CPU.</p>
<h3>Fabrics</h3><ul><li><b>InfiniBand</b>: credit-based lossless link layer, subnet manager, adaptive routing, SHARP in-network reductions; dominant in NVIDIA DGX SuperPODs.</li><li><b>RoCEv2</b>: RDMA over UDP/IP Ethernet; needs (near-)lossless behaviour: <b>PFC</b> (per-priority pause frames) + <b>ECN</b> with <b>DCQCN</b> congestion control. Risks: PFC storms, head-of-line blocking, deadlocks in cyclic buffer dependencies; hence careful QoS config and monitoring. Newer: Ultra Ethernet Consortium, AWS SRD/EFA (multipath, out-of-order tolerant), NVIDIA Spectrum-X adaptive routing.</li></ul>
<h3>AI traffic patterns</h3><p>Training: synchronized collectives (all-reduce, all-gather, reduce-scatter, all-to-all for MoE) across thousands of GPUs; the slowest link stalls everyone (tail at scale!). Ring all-reduce (sim) is bandwidth-optimal; trees/hierarchical algorithms cut latency; NCCL topology-aware selection uses NVLink within nodes and rails (one NIC per GPU, rail-optimized fabrics) across nodes with GPUDirect RDMA. Inference: KV transfers for disaggregation (NIXL), expert all-to-all.</p>
<h3>Observability (Clockwork, NVIDIA DGX Cloud roles)</h3><p>What to measure: per-port/queue counters (PFC pause frames sent/received, ECN marks, drops, buffer occupancy), NIC counters (out-of-sequence, retransmits, CNPs), collective-level timings (NCCL profiler/tracing; which rank is slow), link flaps and optics errors (FEC corrected/uncorrected), and correlation with job step times. Techniques: high-frequency telemetry (gNMI streaming, INT/IFA in-band telemetry), host eBPF probes, synthetic probes (pingmesh), and job-aware attribution. Common root causes: one bad cable/optic, PFC misconfig, ECMP hash collisions of elephant flows, a straggler GPU.</p>`,
poly:R`New territory but the mental model is familiar: DMA descriptors, rings, doorbells and completion queues are exactly what an RDMA NIC exposes to user space. Explaining verbs as "a user-space DMA engine interface" anchors it to your driver work.`,
quiz:[
{q:'In an RDMA WRITE, the remote CPU…',opts:['Copies the data','Is not involved; the remote NIC writes into registered memory','Gets an interrupt per byte','Runs TCP'],a:1,exp:'One-sided operations bypass the remote CPU.'},
{q:'Why does RoCEv2 need PFC/ECN tuning?',opts:['Encryption','RDMA transports perform badly with loss; the fabric must be (near) lossless with congestion signals','Routing','MTU'],a:1,exp:'Go-back-N recovery in classic RoCE NICs collapses throughput under loss.'},
{q:'A 1,024-GPU training job’s step time spikes periodically. First suspicion in the network?',opts:['DNS','A straggler link/rank (bad optic, PFC storm, hash collision) stalling collectives','TLS','BGP'],a:1,exp:'Synchronous collectives are only as fast as the slowest participant.'},
{q:'Ring all-reduce bandwidth per GPU is roughly independent of N because…',opts:['It uses multicast','Each GPU sends 2(N−1)/N of the data regardless of N','N is small','It compresses data'],a:1,exp:'Latency grows with N, but bandwidth term stays ~2×data.'}],
challenge:{prompt:R`<p>Without RDMA hardware, use Soft-RoCE (<code>rdma_rxe</code>) between two VMs/namespaces: run <code>ib_write_bw</code> and <code>ib_write_lat</code> from perftest, then write a minimal verbs program (register MR, create QP, exchange QP info over TCP, post RDMA WRITE, poll CQ). Document each object’s role in a diagram.</p>`,
hints:['<code>rdma link add rxe0 type rxe netdev eth0</code>.','Connection setup: transition QP RESET→INIT→RTR→RTS with remote QPN, LID/GID, PSN.','Use the RDMA Aware Programming manual examples as a template.'],
solution:R`<p>Objects: device context → protection domain → memory region (lkey/rkey) → completion queue → queue pair (RC). Flow: exchange (QPN, GID, rkey, addr) out-of-band; modify QP to RTR/RTS; post IBV_WR_RDMA_WRITE with remote addr/rkey; poll CQ for IBV_WC_SUCCESS. Soft-RoCE latency is tens of µs (software) vs ~1–2 µs on real NICs.</p>`},
interview:[{q:'"How would you build network observability for a GPU training cluster?"',a:'Layers: fabric telemetry (streaming switch counters at seconds or sub-second granularity: PFC, ECN, drops, buffers, FEC), NIC/host counters (RDMA retransmits, CNPs) via node agents/eBPF, collective-level traces from NCCL, and job metadata to map ranks↔hosts↔links. Store in time-series + trace stores with cardinality control; detect stragglers by comparing per-rank timings; automate isolation of bad links. Discuss overhead, clock sync for correlation (PTP), and alerting on SLOs like step-time regression.'}],
resources:[['NVIDIA RDMA Aware Networks Programming User Manual','https://docs.nvidia.com/networking/display/RDMAAwareProgrammingv17'],['NCCL documentation','https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/index.html'],['RoCE explained (video)','https://www.youtube.com/watch?v=dLw5bA5ziwU'],['linux-rdma/perftest','https://github.com/linux-rdma/perftest']]},
{id:'lb',title:'Load balancing: L4 vs L7, algorithms, health',minutes:30,skills:['lb-traffic','dist-sys','dataplane'],sims:['loadBalancer'],
analogy:R`A load balancer is a <b>maître d’</b>. Round-robin seats parties in strict rotation even if one waiter is swamped; least-connections watches each waiter’s tables; power-of-two-choices glances at two random waiters and picks the less busy — nearly as good as checking everyone, at a fraction of the effort.`,
body:R`<h3>L4 vs L7</h3><p><b>L4</b> balances TCP/UDP flows by 5-tuple: fast, protocol-agnostic, connection-level (Maglev, Katran, AWS NLB, F5 BIG-IP L4). <b>L7</b> terminates connections and routes requests (HTTP path/header, gRPC method), retries, TLS termination, auth, rate limiting (Envoy, NGINX, HAProxy, F5 L7). L7 balances per request — essential for HTTP/2/gRPC where one connection carries many streams (L4 would pin all to one backend).</p>
<h3>Algorithms (sim)</h3><ul><li><b>Round robin / weighted RR</b>: ignores load; fine for homogeneous fast requests.</li><li><b>Least connections / least outstanding requests</b>: adapts to slow backends; needs global view (each LB sees only its own traffic).</li><li><b>Power of two choices (P2C)</b>: pick 2 random backends, choose less loaded → exponential improvement in max load vs random, robust with stale info (Envoy default for least-request).</li><li><b>Consistent hashing / Maglev / ring-hash</b>: affinity (caches, sessions), minimal disruption on backend changes.</li><li><b>Latency-aware / EWMA</b> (Finagle), and <b>weighted by capacity</b> for heterogeneous fleets.</li></ul>
<h3>Health and resilience</h3><p>Active health checks (probe endpoints) + passive outlier detection (eject backends with high error/latency rates); slow start for new backends (ramp weight up — cold caches/JIT); connection draining on removal; panic thresholds (if too many backends unhealthy, spread load anyway rather than overloading the few). Global load balancing via DNS (GeoDNS, latency-based) or anycast.</p>
<h3>Zoom out: the request path at a large company</h3><p>Anycast VIP → edge L4 LB (ECMP to LB hosts, consistent hashing) → L7 proxies (TLS, routing, WAF) → service mesh sidecars (mTLS, retries, per-request balancing) → backends. F5’s principal role and Cloudflare’s products live in this path.</p>`,
poly:R`Poly devices connect to cloud services (provisioning, telemetry, meeting services) through this exact chain; and if you ever added server-side features for device management, you designed for backend affinity and health checking. Emphasize F5/Cisco customer-facing debugging of LB issues.`,
quiz:[
{q:'gRPC clients through an L4 load balancer show one backend overloaded. Why?',opts:['Bug in gRPC','Long-lived HTTP/2 connections multiplex many requests; L4 balances connections, not requests','DNS caching','TLS'],a:1,exp:'Use L7 or client-side balancing.'},
{q:'Power-of-two-choices improves over random selection because…',opts:['It checks all servers','Comparing just two random servers dramatically reduces max load (log log n vs log n / log log n)','It uses hashing','It’s deterministic'],a:1,exp:'The classic balls-into-bins result.'},
{q:'Purpose of slow start for a new backend?',opts:['Encrypt traffic','Gradually ramp traffic while caches/JIT warm, avoiding instant overload','Delay health checks','Reduce cost'],a:1,exp:'Prevents a cold instance from being crushed by least-conn picking it heavily.'},
{q:'If 80% of backends fail health checks, a "panic threshold" makes the LB…',opts:['Return 503 everywhere','Ignore health status and spread load across all backends','Shut down','Pick one backend'],a:1,exp:'Avoids concentrating all traffic on the few remaining hosts.'}],
challenge:{prompt:R`<p>Simulate in Python: 20 heterogeneous backends (some 2× slower), Poisson request arrivals, service times lognormal. Compare RR, random, least-outstanding (global), P2C, and consistent hashing for p50/p99 latency and max utilization. Then make the load info stale (updated every 100 ms) and see which algorithms degrade.</p>`,
hints:['Use heapq for event simulation (arrival and completion events).','For staleness, give the balancer a snapshot of outstanding counts refreshed periodically.','Least-outstanding with stale data causes herding (everyone picks the same "idle" backend).'],
solution:R`<p>Expected: RR and random have poor p99 due to slow backends; global least-outstanding is best with fresh info but herds with stale info; P2C stays robust with stale info; consistent hashing has load imbalance without bounded loads but provides affinity. Present a table and recommend P2C least-request + outlier detection + slow start.</p>`},
interview:[{q:'"Design the load balancing layer for a global API."',a:'GeoDNS/anycast for region selection with health-based failover; L4 tier (ECMP + Maglev hashing, DSR) for scale; L7 proxies (Envoy) for TLS, routing, retries with budgets, P2C least-request, outlier detection, slow start, draining; config pushed via xDS from a control plane with staged rollout; observability per route/backend; DDoS protection at edge. Capacity: connections, TLS handshakes/s, bandwidth.'}],
resources:[['Maglev paper (Google, NSDI 2016)','https://research.google/pubs/maglev-a-fast-and-reliable-software-network-load-balancer/'],['Envoy: load balancing overview','https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/load_balancing/overview'],['Mitzenmacher: The Power of Two Choices in Randomized Load Balancing','https://www.eecs.harvard.edu/~michaelm/postscripts/mythesis.pdf']]}
]});
})();

<script>/* js/content/m09-cloud.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'cloud',num:9,icon:'☁️',short:'Cloud & deployment',title:'Cloud Infrastructure & Safe Deployment',tier:'adjacent',
summary:'Containers from kernel primitives up, Kubernetes controllers and scheduling, canary/progressive delivery with error budgets, global configuration delivery, and testing/CI at scale.',
why:'Kubernetes (13 Oct roles) and public cloud (14) appear across Anthropic, OpenAI, NVIDIA DGX Cloud, Cloudflare, Walmart, GM. Cloudflare’s Principal Config/Test/Deploy and Anthropic Inference Velocity are literally about safe change. Your device OTA experience transfers directly.',
lessons:[
{id:'containers',title:'Containers are just Linux: namespaces, cgroups, images',minutes:30,skills:['k8s','linux-kernel','cloud'],sims:['cgroups'],
analogy:R`A container is an <b>apartment in a shared building</b>: namespaces are the walls and private mailbox (what you can see), cgroups are the metered utilities with caps (what you can use), the image is the furnished move-in kit. The building’s structure (the kernel) is shared — which is why a building-level flaw affects every tenant.`,
body:R`<h3>Namespaces (isolation of views)</h3><p>pid, net, mnt, uts, ipc, user, cgroup, time. <code>unshare</code>/<code>clone</code> flags create them; <code>setns</code> joins. A container’s PID 1 must reap zombies and handle signals (use tini/dumb-init). User namespaces map container root to an unprivileged host UID (rootless containers).</p>
<h3>cgroups v2 (limits and accounting) (sim)</h3><ul><li><b>cpu</b>: <code>cpu.weight</code> (proportional share under contention) and <code>cpu.max</code> (quota/period hard cap, e.g. "50000 100000" = 0.5 CPU). CFS bandwidth throttling causes latency spikes for bursty multi-threaded apps even when average usage is below limit — watch <code>cpu.stat nr_throttled</code>. Kubernetes CPU requests → weight; limits → cpu.max.</li><li><b>memory</b>: <code>memory.max</code> (hard → OOM kill in the cgroup), <code>memory.high</code> (throttle + reclaim), page cache counts toward usage; PSI (<code>memory.pressure</code>) quantifies stall time.</li><li><b>io</b> (io.max, io.weight), <b>pids</b> (fork bombs), <b>cpuset</b> (pinning, NUMA).</li></ul>
<h3>Images and runtimes</h3><p>OCI image = layered tarballs + config; overlayfs merges read-only layers with a writable upper layer. Runtime stack: kubelet → CRI (containerd/CRI-O) → OCI runtime (runc creates namespaces/cgroups, applies seccomp, capabilities, AppArmor/SELinux, pivot_root). Sandboxed runtimes (gVisor, Kata/Firecracker microVMs) add a stronger boundary for multi-tenant code.</p>
<h3>Security posture</h3><p>Containers share the kernel → kernel exploits escape. Defense: drop capabilities, seccomp default profile, read-only root, non-root user, no privileged containers or host mounts (e.g. docker.sock), image signing (Sigstore/cosign), minimal base images, runtime detection (Falco/eBPF).</p>
<h3>GPU containers</h3><p>NVIDIA Container Toolkit injects device nodes (<code>/dev/nvidia*</code>), driver libraries matching the host kernel driver, and sets cgroup device permissions — the user-space CUDA libs in the image must be compatible with the host driver version (forward compatibility packages for datacenter GPUs).</p>`,
poly:R`Embedded Linux devices increasingly run containerized apps (balena, systemd-nspawn, Docker on ARM), and you’ve used cgroups/cpusets implicitly to isolate real-time media threads. This lesson turns kernel knowledge you already have into cloud vocabulary.`,
quiz:[
{q:'A pod has CPU limit 1 core and 8 busy threads. What happens within a 100 ms period?',opts:['Runs at 8 cores','Uses its 100 ms quota in ~12.5 ms of wall time across 8 threads, then throttled for the rest of the period','Gets OOM killed','Nothing'],a:1,exp:'CFS quota is per period across all threads → latency spikes.'},
{q:'Container exceeds memory.max. Result?',opts:['Swap to host','OOM killer kills a process in that cgroup','Pod migrates','Page cache disappears only'],a:1,exp:'memory.high would throttle first if configured.'},
{q:'Which namespace makes container root unprivileged on the host?',opts:['pid','user','net','mnt'],a:1,exp:'User namespaces map UIDs.'},
{q:'Why are containers a weaker isolation boundary than VMs?',opts:['They are slower','All containers share the host kernel; a kernel bug can lead to escape','They lack networking','Images are unsigned'],a:1,exp:'Use microVMs/gVisor for untrusted multi-tenant code.'}],
challenge:{prompt:R`<p>Build a "container" by hand: use <code>unshare --pid --fork --mount-proc --net --uts --mount</code> with a busybox rootfs and <code>pivot_root</code>; create a cgroup v2 group with <code>cpu.max = 20000 100000</code> and <code>memory.max = 64M</code>; run a CPU hog and a memory hog inside and observe throttling (<code>cpu.stat</code>) and OOM (<code>memory.events</code>). Write a 100-line Go or Python mini-runtime that automates it.</p>`,
hints:['<code>mkdir /sys/fs/cgroup/demo; echo $$ > /sys/fs/cgroup/demo/cgroup.procs</code>.','<code>stress-ng --vm 1 --vm-bytes 128M</code> for the memory hog.','Liz Rice’s "containers from scratch" talk is the canonical walkthrough.'],
solution:R`<p>Observations: cpu.stat shows nr_throttled and throttled_usec increasing; the hog uses ~20% of one CPU. memory.events shows oom_kill incremented when the hog exceeds 64M. Mini-runtime steps: clone with namespace flags → set hostname → mount proc → pivot_root to rootfs → write PID into cgroup → drop capabilities → exec command.</p>`},
interview:[{q:'"A latency-sensitive service in Kubernetes has p99 spikes but low average CPU. What do you check?"',a:'CFS throttling (container_cpu_cfs_throttled_periods_total), noisy neighbors (CPU/memory bandwidth, cache), CPU limits too low for bursty threads (remove limits, use requests + guaranteed QoS with static CPU manager for pinned cores), memory pressure/PSI and page cache reclaim, GC pauses, node-level softirq load. Validate with perf/eBPF runqlat.'}],
resources:[['Kernel docs: Control Group v2','https://docs.kernel.org/admin-guide/cgroup-v2.html'],['man7: namespaces(7)','https://man7.org/linux/man-pages/man7/namespaces.7.html'],['Liz Rice: Containers From Scratch (talk)','https://www.youtube.com/watch?v=8fi7uSYlOdc'],['NVIDIA Container Toolkit docs','https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/index.html']]},
{id:'k8s',title:'Kubernetes internals: controllers, reconciliation, scheduling',minutes:35,skills:['k8s','dist-sys','provisioning','go-rust'],sims:['k8sReconcile'],
analogy:R`Kubernetes is a <b>thermostat for software</b>. You set the desired temperature (spec); controllers keep measuring the room (status) and turning the heater on/off until they match — forever, idempotently, no matter how many times things drift.`,
body:R`<h3>Architecture</h3><p><b>API server</b> (the only component talking to <b>etcd</b>; validation, admission webhooks, RBAC), <b>controllers</b> (kube-controller-manager: Deployment, ReplicaSet, Node, Job…), <b>scheduler</b>, and per-node <b>kubelet</b> (creates pods via CRI, reports status, runs probes) + kube-proxy/CNI (networking). Everything is a declarative object with <code>spec</code> (desired) and <code>status</code> (observed).</p>
<h3>Reconciliation (sim)</h3><p>Controllers use <b>informers</b> (list + watch with resourceVersion, local cache) and a rate-limited <b>work queue</b> of object keys. <code>Reconcile(key)</code> reads current state, computes diff to desired, takes actions, updates status, and requeues on error with backoff. Properties: <b>level-triggered</b> (act on current state, not on missed events), <b>idempotent</b>, optimistic concurrency (resourceVersion conflicts → retry), owner references + garbage collection, finalizers for external cleanup. Leader election (Lease objects) ensures one active replica.</p>
<h3>Scheduler</h3><p>For each pending pod: <b>filter</b> (resources requests, taints/tolerations, node affinity, topology spread, volumes) then <b>score</b> (least allocated / bin-packing, image locality, spread), bind. Requests drive scheduling; limits drive runtime enforcement. Priority and preemption evict lower-priority pods. Extensions: scheduling framework plugins, gang scheduling for distributed jobs (Kueue, Volcano), GPU topology awareness, DRA for devices.</p>
<h3>Operators and CRDs</h3><p>Custom Resource Definitions + controllers encode operational knowledge (e.g. a GPU node lifecycle operator: drain, update driver, validate with DCGM diagnostics, uncordon). OpenAI Compute Foundations mentions "Kubernetes controllers … idempotency" for bare-metal provisioning — the same pattern with BMC/PXE as the actuator (Metal3, Tinkerbell, Cluster API).</p>
<h3>Failure modes worth knowing</h3><ul><li>etcd overload/latency (too many objects or watches, large objects) slows the whole cluster.</li><li>Thundering herd of controllers re-listing after API server restart.</li><li>PodDisruptionBudgets blocking node drains; misconfigured probes causing restart loops; DNS (CoreDNS) saturation; IP exhaustion in CNI.</li></ul>`,
poly:R`Device fleet management is reconciliation: desired config/firmware in the cloud, devices report status, an agent converges. Map your device-twin experience to controllers — "level-triggered, idempotent agents" is exactly what interviewers want to hear for Compute Foundations and platform roles.`,
quiz:[
{q:'A controller misses a watch event during a network blip. Why is that usually OK?',opts:['Events are guaranteed','Controllers are level-triggered: periodic resync/relist reconciles current state regardless of missed events','Kubelet fixes it','etcd replays it'],a:1,exp:'Design for state, not edges.'},
{q:'Two controllers update the same object concurrently. The API server…',opts:['Merges silently','Rejects the stale write (resourceVersion conflict) → retry','Crashes','Locks the object'],a:1,exp:'Optimistic concurrency control.'},
{q:'Pod requests 2 CPU, limit 4. Scheduler uses…',opts:['Limit','Request','Average','Actual usage'],a:1,exp:'Requests are for scheduling; limits are enforced at runtime.'},
{q:'Distributed training job needs 64 GPUs all at once; default scheduler places 40 then stalls. You need…',opts:['More replicas','Gang scheduling (all-or-nothing) e.g. Kueue/Volcano','Higher limits','HPA'],a:1,exp:'Partial placement wastes GPUs and can deadlock.'}],
challenge:{prompt:R`<p>Write a Kubernetes controller (Go with controller-runtime/kubebuilder, or Python kopf) for a CRD <code>GpuNodeMaintenance</code>: when created, cordon the node, drain pods respecting PDBs, run a validation Job, then uncordon and set status. It must be idempotent (safe to re-run at any step) and survive controller restarts. Test on kind.</p>`,
hints:['Store progress in status.phase; each reconcile moves at most one phase forward.','Use finalizers to uncordon if the CR is deleted mid-way.','Use the Eviction API (not Delete) to honor PDBs.'],
solution:R`func (r *Reconciler) Reconcile(ctx context.Context, req ctrl.Request) (ctrl.Result, error) {
  var m v1.GpuNodeMaintenance
  if err := r.Get(ctx, req.NamespacedName, &m); err != nil { return ctrl.Result{}, client.IgnoreNotFound(err) }
  switch m.Status.Phase {
  case "", "Cordoning": if err := r.cordon(ctx, m.Spec.Node); err != nil { return ctrl.Result{}, err }
    return r.setPhase(ctx, &m, "Draining")
  case "Draining": done, err := r.evictPods(ctx, m.Spec.Node)   // idempotent: re-lists pods each time
    if err != nil || !done { return ctrl.Result{RequeueAfter: 10 * time.Second}, err }
    return r.setPhase(ctx, &m, "Validating")
  case "Validating": ok, done, err := r.validationJob(ctx, &m)  // create-if-absent
    if !done { return ctrl.Result{RequeueAfter: 15 * time.Second}, err }
    if !ok { return r.setPhase(ctx, &m, "Failed") }
    return r.setPhase(ctx, &m, "Uncordoning")
  case "Uncordoning": if err := r.uncordon(ctx, m.Spec.Node); err != nil { return ctrl.Result{}, err }
    return r.setPhase(ctx, &m, "Done")
  }
  return ctrl.Result{}, nil
}`},
interview:[{q:'"How would you build a system that keeps 10,000 bare-metal GPU servers provisioned with the right OS, firmware and drivers?"',a:'Declarative desired state per node class (image version, firmware bundle, driver) stored in an API (CRDs); controllers reconcile via BMC/Redfish (power, boot order, firmware updates), PXE/HTTP boot into an imaging environment, then node agents verify (DCGM diagnostics, burn-in) before admitting to the scheduler. Idempotent steps with phase tracking, concurrency limits per rack/power domain, canary waves with automatic halt on health regressions, rollback image kept, inventory/telemetry, and clear separation of "fleet desired state" vs "actuators".'}],
resources:[['Kubernetes docs: Controllers','https://kubernetes.io/docs/concepts/architecture/controller/'],['Kubernetes docs: Scheduling framework','https://kubernetes.io/docs/concepts/scheduling-eviction/scheduling-framework/'],['Kubebuilder book','https://book.kubebuilder.io/'],['Borg, Omega, and Kubernetes (ACM Queue)','https://queue.acm.org/detail.cfm?id=2898444']]},
{id:'canary',title:'Progressive delivery: canaries, error budgets, rollback',minutes:30,skills:['deploy','observability','sysdesign'],sims:['canary'],
analogy:R`A canary release is <b>taste-testing a new recipe at one table</b> before serving it to the whole restaurant. If that table frowns (error rate, latency), you stop, apologize to one table and keep the old menu for everyone else.`,
body:R`<h3>Why</h3><p>Most outages are caused by changes (binaries, config, data, infrastructure). Progressive delivery limits blast radius and time-to-detect: deploy to a small slice, compare against a control, expand in waves, and roll back automatically on regression.</p>
<h3>Mechanics (sim)</h3><ul><li><b>Stages</b>: e.g. 1% → 5% → 25% → 50% → 100%, or by cell/zone/region; bake times sized to detect slow-burning issues (memory leaks, daily batch jobs).</li><li><b>Canary analysis</b>: compare canary vs baseline (not vs historical) on error rate, latency percentiles, saturation, and business metrics; statistical tests (Mann-Whitney U as in Kayenta); require enough traffic for significance.</li><li><b>Error budgets</b>: SLO 99.9% → 0.1% of requests may fail per window (~43 min/month of full outage). Burn rate alerts (e.g. 14.4× burn over 1 h) drive both alerting and release gating: out of budget → freeze risky launches.</li><li><b>Rollback</b> must be fast, tested and boring: keep previous version deployed/warm, make schema changes backward compatible (expand → migrate → contract), use feature flags to decouple deploy from release.</li></ul>
<h3>Deployment strategies</h3><p>Rolling update (K8s maxSurge/maxUnavailable), blue-green (two full environments, switch traffic), canary (traffic split via mesh/LB), shadow/dark launches (mirror traffic, discard responses), cell-based architecture (independent cells limit blast radius — AWS).</p>
<h3>For devices and fleets</h3><p>OTA updates follow the same rules with harder constraints: devices may be offline, bandwidth limited, rollbacks need A/B partitions, and a bricked device costs a truck roll. Staged rings (internal → beta customers → 1% → …), health beacons after update (boot success, crash rate, call quality metrics), and kill switches.</p>
<h3>Model rollouts (Anthropic Inference Velocity)</h3><p>New model weights or engine versions: shadow traffic for latency/quality, eval gates, canary by traffic share and customer tier, monitor TTFT/ITL, error rates and quality signals, rollback by flipping routing weights while old replicas stay warm (expensive in GPUs → capacity planning for overlap).</p>`,
poly:R`You have shipped firmware to fleets of conference devices — that is canary delivery with A/B partitions and health telemetry. Prepare one crisp story: a staged rollout that caught a regression at 1% (what metric, how fast, how you rolled back) and the process change afterwards.`,
quiz:[
{q:'SLO 99.9% monthly availability. Error budget ≈',opts:['4.3 minutes','43 minutes','7.2 hours','1 day'],a:1,exp:'0.1% of 30 days ≈ 43.2 minutes.'},
{q:'Why compare canary to a concurrent baseline rather than last week’s metrics?',opts:['Cheaper','Controls for time-of-day/traffic changes so differences are due to the release','Required by K8s','No reason'],a:1,exp:'Same time, same traffic mix, different version.'},
{q:'A DB schema change must support rollback. Pattern?',opts:['Drop old columns first','Expand (add new, write both) → migrate → contract after the new version is stable','Big-bang','Use a new DB'],a:1,exp:'Old and new code must run against the schema simultaneously.'},
{q:'A memory leak takes 6 hours to cause OOMs. Canary bake time of 15 minutes…',opts:['Catches it','Misses it — size bake times (or use leak-sensitive metrics) for slow failure modes','Doesn’t matter','Makes it worse'],a:1,exp:'Track memory growth slope as a canary metric.'}],
challenge:{prompt:R`<p>Set up a kind cluster with Argo Rollouts (or Flagger) and Prometheus: deploy a demo app, define a canary with steps 10/30/60/100% and an AnalysisTemplate failing if error rate &gt; 1% or p99 &gt; 300 ms. Deploy a "bad" version that returns 5% errors and show automatic abort and rollback. Write the runbook.</p>`,
hints:['Argo Rollouts kubectl plugin: <code>kubectl argo rollouts get rollout demo --watch</code>.','Use a fault-injecting image (env var ERROR_RATE) to create the bad version.','PromQL: <code>sum(rate(http_requests_total{code=~"5.."}[1m])) / sum(rate(http_requests_total[1m]))</code>.'],
solution:R`<p>Rollout spec with strategy.canary.steps: setWeight 10, pause 2m, analysis, setWeight 30 … AnalysisTemplate with successCondition result[0] &lt; 0.01, failureLimit 1. Bad version aborts at 10% within ~2 minutes, traffic returns to stable. Runbook: detection signal, automatic action, manual verification, communication, follow-up.</p>`},
interview:[{q:'"Design a deployment system for 5,000 microservices."',a:'Pipeline: build once, sign, promote artifacts; declarative environment configs; progressive delivery by cell/region with automated canary analysis on standard SLIs; global change calendar/freeze integration with error budgets; fast rollback (previous version warm, flags); dependency-aware ordering; audit trail. Make the safe path the easy path (paved road), measure DORA metrics, and handle config changes with the same rigor as code.'}],
resources:[['Google SRE Workbook: Canarying Releases','https://sre.google/workbook/canarying-releases/'],['Google SRE book: Embracing Risk (error budgets)','https://sre.google/sre-book/embracing-risk/'],['Argo Rollouts docs','https://argo-rollouts.readthedocs.io/'],['AWS Builders’ Library: Automating safe, hands-off deployments','https://aws.amazon.com/builders-library/automating-safe-hands-off-deployments/']]},
{id:'config',title:'Global configuration delivery',minutes:30,skills:['deploy','dist-sys','storage-data','python'],sims:['configPropagation'],
analogy:R`Pushing config globally is like <b>changing the rules of a game in every stadium at once</b>. If you announce it everywhere simultaneously and the new rule is broken, every game stops. Announce stadium by stadium, watch the first few games, and keep the old rulebook handy.`,
body:R`<h3>Why config is dangerous</h3><p>Config changes bypass the build/test rigor of code but take effect faster and more broadly. Famous outages: Cloudflare July 2019 (a WAF regex with catastrophic backtracking pushed globally in seconds → CPU exhaustion everywhere), Facebook October 2021 (a backbone configuration command withdrew BGP routes), Google and AWS incidents from quota/config pushes. Cloudflare’s Principal role for Config/Test/Deploy exists because of this.</p>
<h3>Architecture of a config delivery system (sim)</h3><ul><li><b>Source of truth</b>: versioned, reviewed (config as code in git) with schema validation, policy checks and semantic tests (e.g. regex complexity limits, rule linting), plus ownership metadata.</li><li><b>Distribution</b>: a control plane publishes versioned snapshots to a globally replicated KV store or pub/sub; edges pull or receive pushes and cache locally (Cloudflare Quicksilver, Envoy xDS, Facebook Configerator + Zeus, Google Chubby-backed). Delta vs full snapshot; fan-out trees to reach 300+ PoPs in seconds.</li><li><b>Progressive rollout</b>: canary PoPs/machines, health mediation (automated health signals gate each stage), automatic rollback to last-known-good, and the ability to go fast in emergencies (security fixes) with explicit risk acceptance.</li><li><b>Consumer safety</b>: validate on receipt, keep last-known-good when the new config fails to parse/apply (fail static), version skew tolerance (consumers handle N-1/N+1 schemas), atomic apply.</li><li><b>Observability</b>: which version is live where (convergence dashboards), and a kill switch.</li></ul>
<h3>Trade-offs to articulate</h3><p>Speed vs safety (seconds-fast global propagation is a feature for blocking attacks and a liability for bad changes); push vs pull (push = low latency, needs connection management; pull = simple, polling cost/latency); strong vs eventual consistency (most config tolerates seconds of skew; some, like security policy revocations, need acknowledgment tracking).</p>`,
poly:R`Device configuration profiles pushed from a cloud portal to fleets have the same failure modes (a bad codec setting bricks calls fleet-wide). Show you think about schema validation, last-known-good on device, and staged pushes — the same principles at a different scale.`,
quiz:[
{q:'Root cause class of the Cloudflare July 2019 outage?',opts:['BGP hijack','A WAF rule regex with catastrophic backtracking deployed globally at once, exhausting CPU','DDoS','Disk failure'],a:1,exp:'Instant global deploy of a config change without staged rollout.'},
{q:'Edge receives a config that fails validation. Best behaviour?',opts:['Crash and restart','Reject it and keep serving with last-known-good config, raising an alert','Apply partially','Delete all config'],a:1,exp:'Fail static.'},
{q:'Why need version-skew tolerance in config consumers?',opts:['Performance','During rollout, old and new binaries and configs coexist','Security','Licensing'],a:1,exp:'Rollouts are never instantaneous.'},
{q:'Health mediation in a config pipeline means…',opts:['Manual approval only','Automated health signals gate each rollout stage and trigger rollback','Encrypting configs','Doctor visits'],a:1,exp:'Stages advance only when observed health is good.'}],
challenge:{prompt:R`<p>Design and prototype (Python) a config delivery service: a publisher writes versioned configs to an etcd/Redis-like store; 50 simulated edge agents watch, validate (JSON schema + custom rule: regex compile with a timeout), apply atomically, and report version + health. Implement staged rollout (1 → 5 → all) gated by health, automatic rollback, and a convergence dashboard (text is fine).</p>`,
hints:['Model config as {version, payload, checksum}; agents keep last_good.','Use a regex complexity heuristic or run compile/match on sample inputs with a time limit in a subprocess.','Rollout controller sets "target version" per agent group; agents only apply their group’s target.'],
solution:R`<p>Components: publisher (validates, writes version N), rollout controller (state machine: canary→wave1→global, advancing after bake time if error metrics within threshold, else sets target back to N-1), agents (watch target, fetch, validate, apply atomically via swap, report). Test: publish a config with a catastrophic regex; canary agents detect CPU spike/health failure, controller rolls back, 49 agents never see it.</p>`},
interview:[{q:'"Design Cloudflare-scale config distribution to 300 data centers."',a:'Git-backed source with validation and tests; control plane producing immutable versioned snapshots; replicated KV with fan-out (regional relays) for seconds-level propagation; edge-local cache with last-known-good; staged rollout by PoP tiers with health mediation and automatic rollback; emergency fast-path with guardrails; per-change audit and ownership; convergence monitoring; chaos testing of the delivery system itself. Quantify: config size, change rate, propagation SLO.'}],
resources:[['Cloudflare: Details of the July 2, 2019 outage','https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/'],['Cloudflare: Introducing Quicksilver','https://blog.cloudflare.com/introducing-quicksilver-configuration-distribution-at-internet-scale/'],['Holistic Configuration Management at Facebook (SOSP 2015)','https://research.facebook.com/publications/holistic-configuration-management-at-facebook/'],['Envoy xDS protocol','https://www.envoyproxy.io/docs/envoy/latest/api-docs/xds_protocol']]},
{id:'testing',title:'Testing and CI at scale: flakiness, hermeticity, test pyramids',minutes:25,skills:['cicd','deploy','leadership'],sims:['flakyCI'],
analogy:R`A flaky test is a <b>smoke alarm that goes off randomly</b>. After a few false alarms people pull the batteries — and then the real fire goes unnoticed. At scale, even "rarely flaky" alarms go off constantly.`,
body:R`<h3>The math of flakiness (sim)</h3><p>If each of 2,000 tests has a 0.1% flake rate, a full run passes cleanly with probability 0.999^2000 ≈ 13.5%. Developers start re-running ("retry until green"), CI capacity balloons, and real failures hide. Google reported ~1.5% of test runs flaky and ~16% of tests with some flakiness.</p>
<h3>Causes</h3><p>Async waits with sleeps, order dependence/shared state, time and timezone, randomness without seeds, network/external services, resource exhaustion on shared runners, concurrency bugs (real bugs!), and hardware variance (HIL rigs).</p>
<h3>Strategies</h3><ul><li><b>Detect</b>: rerun failures automatically to classify (fail-then-pass = flaky), track per-test flake rate, quarantine above threshold with an owner and SLA to fix.</li><li><b>Prevent</b>: hermetic tests (no network, fixed seeds, fake clocks), deterministic simulation testing (FoundationDB-style), dependency injection, test isolation (fresh state), Bazel-style hermetic builds + remote caching.</li><li><b>Pyramid</b>: many fast unit tests, fewer integration tests, few E2E; for hardware: simulation (QEMU, Renode) → HIL → field telemetry.</li><li><b>Scale tactics</b>: test selection based on dependency graph (affected targets only), sharding, merge queues (bors/GitHub merge queue) to keep main green, pre-submit vs post-submit split.</li></ul>
<h3>Developer productivity framing (Palo Alto Sr Principal Dev Productivity role)</h3><p>Measure: build/test latency (p50/p90), queue time, flake rate, change failure rate, time to restore, DORA metrics, developer satisfaction surveys. Staff-level impact is often "cut presubmit from 45 to 12 minutes and flake rate from 8% to 0.5% for 2,000 engineers" — quantify engineer-hours saved.</p>`,
poly:R`Hardware-in-the-loop test rigs for camera/audio devices are notorious for flakiness (USB enumeration, network timing, thermal). If you improved a HIL pipeline’s reliability or built simulation-based tests for drivers, that is a dev-productivity story with a measurable outcome.`,
quiz:[
{q:'500 tests each with 1% flake rate. Probability a run is clean?',opts:['~99%','~61%','~0.66%','~50%'],a:2,exp:'0.99^500 ≈ 0.0066.'},
{q:'Best immediate handling of a newly detected flaky test?',opts:['Delete it','Quarantine (not blocking), assign owner, track fix SLA','Retry it forever silently','Ignore'],a:1,exp:'Keeps signal while ensuring it is fixed.'},
{q:'A merge queue primarily ensures…',opts:['Faster builds','Main branch stays green by testing changes in their merged order before landing','Code review','Security'],a:1,exp:'Prevents semantic conflicts breaking main.'},
{q:'Hermetic tests mean…',opts:['Encrypted','Results depend only on declared inputs (no network, clock, shared state)','Run in containers only','Written in Bazel'],a:1,exp:'Determinism enables caching and trust.'}],
challenge:{prompt:R`<p>Take a test suite (yours or an open-source project). Write a script that runs it 50 times with randomized order (pytest-randomly or gtest --gtest_shuffle --gtest_repeat), collects per-test pass/fail, computes flake rates, and outputs a quarantine list. Fix the top flaky test and write a short postmortem of the root cause.</p>`,
hints:['GoogleTest: <code>--gtest_shuffle --gtest_repeat=50 --gtest_output=json</code>.','Classify: a test with both passes and fails across identical commits is flaky.','Common fix: replace sleep with condition wait + timeout; inject a fake clock.'],
solution:R`<p>Output table: test name, runs, failures, flake rate, first failure message. Root causes typically found: time-dependent assertions, order dependence on global state, port collisions. Fix and verify with 200 runs at 0 failures.</p>`},
interview:[{q:'"You’re the new principal for developer productivity. What do you do in the first 90 days?"',a:'Listen and measure: survey developers, instrument the pipeline (build/test times, flake rates, queue times), identify top pain points by engineer-hours lost. Quick wins (remote caching, quarantine flaky tests, faster runners), then strategic investments (hermetic builds, test selection, merge queue), with a roadmap and metrics reviewed monthly. Build coalition with team leads; publish results. That is the staff/principal leadership signal.'}],
resources:[['Google Testing Blog: Flaky Tests at Google and How We Mitigate Them','https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html'],['Software Engineering at Google (free online)','https://abseil.io/resources/swe-book'],['DORA research','https://dora.dev/']]}
]});
})();
