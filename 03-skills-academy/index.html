<script>/* js/content/m05-gpu.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'gpu',num:5,icon:'🟩',short:'GPU & CUDA stack',title:'GPU Computing & the CUDA Stack',tier:'adjacent',
summary:'SIMT and warps, memory hierarchy and coalescing, occupancy and roofline, streams and CUDA Graphs, the driver stack (UMD/KMD/RM), GPU sharing (MIG/MPS/time-slicing) and Nsight profiling.',
why:'Seven NVIDIA alerts (CUDA driver perf, UMD graphs & sharing, profiling services, DevTech, DGX Cloud, kernel CSP, Dynamo) plus Anthropic/OpenAI/Google AI infra need GPU literacy. Your edge: you already think like a driver engineer — the CUDA driver is a user-mode driver + kernel-mode driver over PCIe with DMA, interrupts and virtual memory.',
lessons:[
{id:'simt',title:'SIMT execution: grids, blocks, warps, divergence',minutes:35,skills:['cuda','gpu-arch'],sims:['warpDivergence'],
analogy:R`A warp is a <b>32-person rowing crew with one coxswain</b> calling a single stroke. When the coxswain says "if you’re on the left, row; right side, rest", half the crew idles, then they swap — the boat takes two strokes’ worth of time to do one stroke of work. That is warp divergence.`,
body:R`<h3>Hierarchy</h3><p>A kernel launch creates a <b>grid</b> of <b>thread blocks</b> (CTAs); each block runs entirely on one <b>SM</b> (streaming multiprocessor) and its threads can cooperate through <b>shared memory</b> and <code>__syncthreads()</code>. The SM executes threads in groups of 32 called <b>warps</b>. Each SM has several warp schedulers (4 on recent architectures) that each issue an instruction per cycle from any <i>ready</i> warp — GPUs hide latency by having many warps in flight and switching between them for free (registers are partitioned, not saved/restored). H100: 132 SMs, up to 64 warps (2048 threads) resident per SM, 64K 32-bit registers per SM, up to 228 KB shared memory/L1 per SM.</p>
<pre>__global__ void saxpy(int n, float a, const float* x, float* y) {
  int i = blockIdx.x * blockDim.x + threadIdx.x;   // global index
  if (i &lt; n) y[i] = a * x[i] + y[i];               // bounds guard
}
saxpy&lt;&lt;&lt;(n + 255) / 256, 256&gt;&gt;&gt;(n, 2.0f, d_x, d_y);</pre>
<h3>SIMT and divergence (sim)</h3><p>All 32 threads of a warp share an instruction stream. When a branch condition differs across lanes, the warp executes both paths serially with inactive lanes masked off. Cost ≈ sum of both paths. Divergence across <i>different</i> warps is free. Since Volta, <b>independent thread scheduling</b> gives each thread its own program counter (enabling starvation-free intra-warp locks), but divergent paths still serialize; use <code>__syncwarp()</code> and the <code>*_sync</code> warp intrinsics with explicit masks (<code>__shfl_sync</code>, <code>__ballot_sync</code>).</p>
<p>Avoid divergence by: making branch conditions warp-uniform (sort/bin work so similar items share a warp), using predication-friendly code (select instead of branch for short paths), and restructuring loops with data-dependent trip counts (work queues, persistent threads).</p>
<h3>Warp-level primitives</h3><p>Shuffles move registers between lanes without shared memory: a warp reduction in 5 steps (<code>for (o=16; o&gt;0; o/=2) v += __shfl_down_sync(0xffffffff, v, o);</code>). Cooperative groups generalize this to tiles, blocks and grids.</p>
<h3>Interview depth</h3><ul><li>Why 32? A hardware design point balancing scheduling overhead vs divergence loss.</li><li>Thread vs CUDA core: a "CUDA core" is an FP32 lane; an SM schedules warps onto lanes.</li><li>GPU vs CPU: CPU minimizes latency per thread (big caches, OoO, branch prediction); GPU maximizes throughput by oversubscription and latency hiding.</li><li>Tensor Cores execute warp-wide matrix multiply-accumulate (MMA) on tiles (e.g. FP16/BF16/FP8), far exceeding FP32 SIMT throughput — the reason LLM performance is about feeding tensor cores.</li></ul>`,
poly:R`Ambarella CVflow and Qualcomm Hexagon/Adreno are also wide data-parallel engines; you have reasoned about vector widths and keeping accelerators fed. The mental model "many in-flight requests hide latency" is the same one you use for DMA queue depth.`,
quiz:[
{q:'Predict the cost:',code:R`if (threadIdx.x % 2 == 0) pathA();  // 100 cycles
else                       pathB();  // 100 cycles`,opts:['~100 cycles per warp','~200 cycles per warp (both paths serialized)','~50 cycles','~3200 cycles'],a:1,exp:'Every warp has both even and odd lanes → divergent → both paths.'},
{q:'Same code but condition is <code>(threadIdx.x / 32) % 2 == 0</code>. Cost per warp?',opts:['~100 cycles — condition is uniform within each warp','~200','~400','Undefined'],a:0,exp:'Divergence only matters within a warp.'},
{q:'How does a GPU hide a 500-cycle global memory load?',opts:['Huge L1 cache','Out-of-order execution','Switching to other ready warps each cycle (zero-cost context switch)','Branch prediction'],a:2,exp:'Many resident warps; registers stay allocated so switching is free.'},
{q:'Threads in different blocks can synchronize with __syncthreads()?',opts:['Yes','No — it is block-scoped; use kernel boundaries or cooperative grid sync'],a:1,exp:'Blocks may run in any order on any SM.'}],
challenge:{prompt:R`<p>Write a CUDA kernel computing a histogram of 256 bins over 100M bytes. Version 1: global atomics. Version 2: per-block shared-memory histograms merged with atomics. Version 3: add warp-aggregated atomics (<code>__match_any_sync</code>). Measure with Nsight Compute and explain differences. (No GPU? Use Google Colab’s free GPU or reason through it.)</p>`,
hints:['Shared-memory version: zero smem bins, <code>__syncthreads()</code>, atomicAdd into smem, <code>__syncthreads()</code>, then one thread per bin adds into global.','Contention on global atomics is the bottleneck when data is skewed (e.g. all zeros).','<code>__match_any_sync(mask, value)</code> returns lanes with the same value; leader does one atomicAdd of popcount.'],
solution:R`__global__ void hist_smem(const uint8_t* in, size_t n, unsigned* out) {
  __shared__ unsigned h[256];
  for (int i = threadIdx.x; i < 256; i += blockDim.x) h[i] = 0;
  __syncthreads();
  for (size_t i = blockIdx.x * (size_t)blockDim.x + threadIdx.x; i < n; i += (size_t)gridDim.x * blockDim.x)
    atomicAdd(&h[in[i]], 1u);                     // grid-stride loop, fast smem atomics
  __syncthreads();
  for (int i = threadIdx.x; i < 256; i += blockDim.x) atomicAdd(&out[i], h[i]);
}`},
interview:[{q:'"Explain how a GPU executes a kernel, from launch to completion."',a:'Host enqueues launch into a stream (driver writes commands to a pushbuffer/ring, rings a doorbell); the GPU front end fetches it; the compute work distributor assigns blocks to SMs as resources (registers, smem, warp slots) allow; warps are scheduled per cycle; memory accesses go through L1/shared → L2 → HBM; blocks retire and new ones launch; completion signals a semaphore/event the host can wait on. Mention occupancy limits, divergence and coalescing as the main efficiency factors.'}],
resources:[['CUDA C++ Programming Guide','https://docs.nvidia.com/cuda/cuda-programming-guide/index.html'],['NVIDIA blog: Using CUDA Warp-Level Primitives','https://developer.nvidia.com/blog/using-cuda-warp-level-primitives/'],['NVIDIA H100 Tensor Core GPU architecture overview','https://resources.nvidia.com/en-us-tensor-core']]},
{id:'memory',title:'GPU memory hierarchy and coalescing',minutes:30,skills:['cuda','gpu-arch','perf-eng'],sims:['coalescing'],
analogy:R`HBM is a <b>warehouse that only ships full pallets</b> (32-byte sectors, 128-byte lines). If 32 workers each want an item from the same pallet, one shipment serves them all (coalesced). If each wants an item from a different pallet, the warehouse ships 32 pallets and most of each is thrown away.`,
body:R`<h3>Hierarchy</h3><table><tr><th>Space</th><th>Scope</th><th>Latency / bandwidth (H100-class)</th></tr><tr><td>Registers</td><td>thread</td><td>~1 cycle; spilling goes to "local memory" (actually global, cached)</td></tr><tr><td>Shared memory / L1</td><td>block / SM</td><td>~20–30 cycles, ~tens of TB/s aggregate; 32 banks</td></tr><tr><td>L2</td><td>device</td><td>~200 cycles; 50 MB</td></tr><tr><td>HBM3 global</td><td>device</td><td>~400–600 cycles; ~3.35 TB/s</td></tr><tr><td>Host via PCIe Gen5 x16</td><td>system</td><td>~64 GB/s per direction; µs latency. NVLink ~900 GB/s total</td></tr></table>
<h3>Coalescing (sim)</h3><p>A warp’s load instruction is split into 32-byte sector requests. If lane <i>i</i> reads <code>a[base + i]</code> (4-byte floats) the warp touches 128 contiguous bytes = 4 sectors: 100% efficiency. Stride 2 → 8 sectors (50%); random → up to 32 sectors (12.5%). Misaligned base adds one extra sector. Nsight Compute reports this as "sectors per request" and "global load efficiency". Fixes: structure-of-arrays layouts, transposing through shared memory, vectorized loads (<code>float4</code>) for 16-byte per-lane accesses.</p>
<h3>Shared memory bank conflicts</h3><p>32 banks, 4 bytes wide. Lanes hitting different addresses in the same bank serialize. Classic: tile[32][32] column access → all lanes on one bank. Fix by padding: <code>__shared__ float tile[32][33];</code>.</p>
<h3>Host ↔ device</h3><ul><li><b>Pageable vs pinned</b> host memory: cudaMemcpy from pageable memory goes through a driver staging buffer; pinned (page-locked, <code>cudaMallocHost</code>) allows direct DMA and async copies overlapping compute. Over-pinning hurts the OS.</li><li><b>Unified Memory</b> (<code>cudaMallocManaged</code>): one pointer, pages migrate on fault (GPU page faults since Pascal) or with <code>cudaMemPrefetchAsync</code>; convenient, but fault storms kill performance; use hints.</li><li><b>GPUDirect RDMA / Storage</b>: NICs and NVMe DMA directly to GPU memory, bypassing host bounce buffers (driver work: pinning GPU pages, exposing BAR1 mappings, nvidia-peermem).</li></ul>
<h3>The driver angle</h3><p>The GPU has its own MMU and page tables (per-context virtual address spaces), managed by the kernel driver/RM: allocation = reserve VA + back with physical VRAM or sysmem pages + map. This is Module 2’s VM lesson with another MMU — exactly what the CUDA driver perf role means by "virtual memory".</p>`,
poly:R`Your DMA/IOMMU work (Module 2) is the host side of GPU memory management: pinning pages, scatter-gather lists, cache coherence, and IOMMU mappings. Explaining pinned vs pageable copies in terms of DMA and get_user_pages will impress driver interviewers.`,
quiz:[
{q:'A warp loads <code>float a[threadIdx.x * 32]</code>. Approximately how many 32-byte sectors?',opts:['4','8','32','1'],a:2,exp:'Each lane is 128 bytes apart → each lane needs its own sector.'},
{q:'Why is <code>__shared__ float tile[32][33]</code> used instead of [32][32] in transpose?',opts:['Alignment','Avoids bank conflicts on column access by shifting each row by one bank','More memory','Faster sync'],a:1,exp:'Row stride of 33 words maps column elements to different banks.'},
{q:'cudaMemcpyAsync from pageable memory…',opts:['Is fully asynchronous','Is staged through pinned buffers and may be effectively synchronous w.r.t. host','Fails','Uses NVLink'],a:1,exp:'True async overlap requires pinned host memory.'},
{q:'Main risk of naive Unified Memory in a hot loop?',opts:['Wrong results','Page-fault-driven migration thrash between CPU and GPU','No risk','Compile errors'],a:1,exp:'Use prefetch/advice or explicit copies.'}],
challenge:{prompt:R`<p>Implement matrix transpose (8192×8192 floats) three ways: naive, shared-memory tiled, tiled+padded. Report effective bandwidth (2·N²·4 bytes / time) vs the device peak (from <code>cudaGetDeviceProperties</code>). Use Nsight Compute to show sectors/request and shared bank conflicts for each.</p>`,
hints:['Tile 32×32 with blockDim (32,8): each thread handles 4 rows.','Read coalesced from input rows into smem, sync, write coalesced to output rows reading smem columns.','Padding the tile’s second dimension to 33 removes the 32-way bank conflict.'],
solution:R`__global__ void transpose(float* out, const float* in, int N) {
  __shared__ float t[32][33];
  int x = blockIdx.x*32 + threadIdx.x, y = blockIdx.y*32 + threadIdx.y;
  for (int j = 0; j < 32; j += 8) t[threadIdx.y + j][threadIdx.x] = in[(y + j)*N + x];
  __syncthreads();
  x = blockIdx.y*32 + threadIdx.x; y = blockIdx.x*32 + threadIdx.y;
  for (int j = 0; j < 32; j += 8) out[(y + j)*N + x] = t[threadIdx.x][threadIdx.y + j];
} // expect naive ~20-30% of peak, tiled+padded ~80-90%`},
interview:[{q:'"A kernel achieves 15% of peak memory bandwidth. How do you diagnose?"',a:'Nsight Compute memory workload analysis: sectors/request (coalescing), L1/L2 hit rates, bank conflicts, achieved occupancy (enough loads in flight?), and stall reasons (long scoreboard = memory latency). Check access patterns (AoS vs SoA, strides), alignment, vectorized loads, and whether the kernel is too small (launch overhead) or latency-bound with low parallelism. Compare to roofline.'}],
resources:[['CUDA C++ Best Practices Guide','https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/'],['NVIDIA blog: An Efficient Matrix Transpose in CUDA C/C++','https://developer.nvidia.com/blog/efficient-matrix-transpose-cuda-cc/'],['NVIDIA blog: How to Access Global Memory Efficiently','https://developer.nvidia.com/blog/how-access-global-memory-efficiently-cuda-c-kernels/']]},
{id:'occupancy',title:'Occupancy, latency hiding and the roofline model',minutes:30,skills:['cuda','perf-eng','nsight'],sims:['occupancy','roofline'],
analogy:R`Occupancy is <b>how many customers a restaurant can seat</b>. Each table needs chairs (registers) and counter space (shared memory). Greedy parties (kernels using many registers) mean fewer tables, and when the kitchen (memory) is slow, there’s nobody else to serve while waiting. The roofline tells you whether the restaurant is limited by kitchen speed (compute) or the delivery truck (memory bandwidth).`,
body:R`<h3>Occupancy (sim 1)</h3><p>Occupancy = resident warps / max warps per SM. Limits per SM (H100-ish): 64 warps, 32 blocks, 65,536 registers, up to 228 KB shared memory. A kernel using 128 registers/thread with 256-thread blocks needs 32K registers per block → only 2 blocks = 16 warps = 25% occupancy. Tools: <code>--ptxas-options=-v</code> shows registers/smem; <code>__launch_bounds__(maxThreads, minBlocks)</code> or <code>-maxrregcount</code> trades registers for occupancy (risking spills); the occupancy calculator API <code>cudaOccupancyMaxPotentialBlockSize</code>.</p>
<p><b>Higher occupancy is not always better.</b> Kernels with high instruction-level parallelism (each thread issues several independent loads) or heavy register tiling (GEMM) often run best at low occupancy. Occupancy is a means to hide latency; check stall reasons.</p>
<h3>Roofline (sim 2)</h3><p>Arithmetic intensity AI = FLOPs / bytes moved from DRAM. Attainable FLOP/s = min(peak compute, AI × peak bandwidth). The ridge point = peak / bandwidth: H100 SXM ~ 990 TFLOPS dense BF16 / 3.35 TB/s ≈ 300 FLOP/byte for tensor cores; ~67 TFLOPS FP32 → ~20 FLOP/byte. Examples: vector add AI = 1 FLOP / 12 bytes ≈ 0.08 → hopelessly memory-bound; large GEMM AI ∝ N → compute-bound; <b>LLM decode</b> with batch 1 reads every weight per token (~2 FLOPs per 2-byte weight → AI ≈ 1) → memory-bound — why batching and quantization matter (Module 6).</p>
<h3>Other limiters</h3><ul><li><b>Launch overhead</b>: ~2–5 µs per launch from the host; thousands of tiny kernels → GPU idle between them → CUDA Graphs (next lesson) or kernel fusion.</li><li><b>Tail effect / wave quantization</b>: 133 blocks on 132 SMs → second wave with 1 block → ~50% efficiency.</li><li><b>Kernel fusion</b>: combining elementwise ops avoids writing/reading intermediates to HBM (FlashAttention fuses attention to avoid materializing the N×N matrix).</li></ul>`,
poly:R`You already do per-frame budget analysis for ISP/encoder pipelines. The roofline is the same reasoning — "is this block bandwidth-bound or compute-bound?" — applied to kernels. Being able to do the decode-is-memory-bound math on a whiteboard is a strong signal for NVIDIA DevTech and inference roles.`,
quiz:[
{q:'Kernel: 64 regs/thread, 256 threads/block, no smem. 65,536 regs/SM, 64 warps max. Occupancy?',opts:['25%','50%','100%','12.5%'],a:1,exp:'64×256 = 16,384 regs per block → 65,536/16,384 = 4 blocks → 1,024 threads = 32 warps of 64 → 50%.'},
{q:'Now 32 regs/thread, 256 threads/block. Occupancy?',opts:['25%','50%','100% (8 blocks × 8 warps = 64 warps)','75%'],a:2,exp:'32×256 = 8K regs/block → 8 blocks → 2048 threads = 64 warps = 100%.'},
{q:'Vector add c=a+b (fp32) has arithmetic intensity of about…',opts:['0.08 FLOP/byte','1','10','100'],a:0,exp:'1 FLOP per 12 bytes (two loads, one store).'},
{q:'Why is batch-1 LLM decode memory-bound?',opts:['Attention is compute heavy','Each token must stream all weights from HBM for ~2 FLOPs per weight → AI≈1, far below the ridge','PCIe is slow','Tensor cores are off'],a:1,exp:'Batching reuses each loaded weight across many sequences, raising AI.'}],
challenge:{prompt:R`<p>For your GPU (or H100 numbers), compute the ridge point and place on a roofline: vector add, SGEMM 4096³, a 3×3 convolution on 1080p, softmax over 32K elements, and LLM decode of a 7B model at batch 1, 8, 64 (bf16). For each, state the bound and one optimization. Then verify two of them with Nsight Compute’s roofline chart.</p>`,
hints:['GEMM AI ≈ 2N³ / (3·N²·4 bytes) for FP32 when reading A,B and writing C once.','Decode: weights 14 GB read per step; FLOPs ≈ 2 × params × batch.','Nsight Compute: <code>ncu --set full</code> includes the roofline section.'],
solution:R`<p>Vector add: AI 0.08 → memory bound; fuse with neighbors. SGEMM 4096: AI ≈ 683 → compute bound; use tensor cores (TF32/BF16). Conv 3×3: AI ~ 4–5 (with reuse via smem) → memory/compute borderline; tile with smem or implicit GEMM. Softmax: AI ~1 → memory bound; fuse into preceding op (online softmax). Decode 7B bf16: batch 1 AI≈1, batch 8 ≈8, batch 64 ≈64 → still below ~300 ridge → memory bound until large batches; quantize weights (FP8/INT4) and batch more.</p>`},
interview:[{q:'"How would you decide whether to optimize a kernel for memory or compute?"',a:'Compute arithmetic intensity, compare to ridge point, and confirm with profiler metrics (SM throughput % vs DRAM throughput %). If memory bound: reduce bytes (fusion, compression/quantization, better reuse via tiling, coalescing). If compute bound: use tensor cores, reduce instruction count, ILP. If neither is near peak: latency-bound → more parallelism/occupancy or ILP, fix launch overhead, wave quantization.'}],
resources:[['Williams, Waterman, Patterson: Roofline (CACM 2009)','https://people.eecs.berkeley.edu/~kubitron/cs252/handouts/papers/RooflineVyNoYellow.pdf'],['Nsight Compute documentation','https://docs.nvidia.com/nsight-compute/'],['FlashAttention paper','https://arxiv.org/abs/2205.14135']]},
{id:'streams',title:'Streams, events, and CUDA Graphs',minutes:35,skills:['cuda','cuda-driver','gpu-sharing'],sims:['streamTimeline'],
analogy:R`Streams are <b>separate checkout lanes</b>: items in one lane are processed in order, different lanes run in parallel if there are cashiers (copy engines, SMs) free. CUDA Graphs are <b>pre-printed shopping lists handed to the store</b>: instead of telling the clerk each item one at a time (launch overhead), you hand over the whole list once and the store fulfills it.`,
body:R`<h3>Streams</h3><p>A stream is an in-order queue of operations (kernels, copies, event records). Work in different streams may overlap: H2D copy on one copy engine, kernel on SMs, D2H copy on another copy engine (sim). Requirements: pinned host memory, <code>cudaMemcpyAsync</code>, non-default streams. The legacy <b>default stream</b> synchronizes with all other blocking streams — a common reason overlap disappears (use <code>--default-stream per-thread</code> or <code>cudaStreamNonBlocking</code>).</p>
<p><b>Events</b> (<code>cudaEventRecord</code>, <code>cudaStreamWaitEvent</code>) express cross-stream dependencies and timing. Implicit synchronization traps: <code>cudaMalloc</code>/<code>cudaFree</code> (use stream-ordered <code>cudaMallocAsync</code>), <code>cudaMemset</code> on default stream, page-locked allocations.</p>
<h3>Under the hood (driver)</h3><p>Each stream maps to hardware channels/work queues. The UMD writes commands (method/data pairs) into a <b>pushbuffer</b> in memory, then updates GPFIFO entries and rings a <b>doorbell</b> (a user-mode-mapped register write, no syscall). Dependencies across channels are implemented with GPU semaphores (memory locations the GPU can wait on/release). Hyper-Q exposes multiple hardware queues so independent streams don’t falsely serialize.</p>
<h3>CUDA Graphs</h3><p>A graph is a DAG of nodes (kernel, memcpy, memset, host, event, child graph, conditional nodes in newer CUDA). Create by <b>stream capture</b> (<code>cudaStreamBeginCapture</code>… <code>cudaStreamEndCapture</code>) or explicit API; <b>instantiate</b> once (validation, resource setup, building the command stream), then <b>launch</b> many times with a single call. Benefits: per-kernel CPU launch overhead (~µs) amortized, GPU-side launch of dependent work with less idle time, whole-workflow optimizations. Update parameters with <code>cudaGraphExecUpdate</code> or kernel node param updates without re-instantiating. Device graph launch lets kernels launch graphs. PyTorch uses CUDA Graphs for LLM decode loops (fixed shapes, static memory addresses) — a key reason vLLM/TensorRT-LLM decode is fast.</p>
<div class="callout gotcha"><b>Gotchas:</b> captured graphs bake in pointers — buffers must stay at the same addresses (static memory pools); dynamic shapes need multiple graphs (one per batch-size bucket); illegal operations during capture (synchronous calls) invalidate it; instantiation is expensive, so cache graphs.</div>
<h3>Why the UMD Graphs job cares</h3><p>"CUDA UMD Graphs and GPU Sharing" engineers implement instantiate/launch/update in the user-mode driver: building optimal pushbuffers, minimizing CPU time per launch, handling multi-GPU and memory nodes, interacting with MPS. Interviewers will probe multithreading, data structures for DAG scheduling, lock contention in the launch path, and virtual memory.</p>`,
poly:R`A video pipeline is a DAG of hardware engines (ISP, scaler, encoder) with queue submissions and fences — exactly streams + events. If you’ve used V4L2 request API, dma-fence, or vendor submission queues on Qualcomm/Ambarella, you’ve built the same abstraction. Say so.`,
quiz:[
{q:'You issue H2D copy, kernel, D2H copy in stream 1 and the same in stream 2 with pageable host memory. Overlap?',opts:['Full overlap','Little/none — pageable copies are staged and synchronous-ish','Only kernels overlap guaranteed','Deadlock'],a:1,exp:'Pin host buffers to get async DMA overlap.'},
{q:'Main benefit of CUDA Graphs for LLM decode?',opts:['Faster math','Removes per-kernel CPU launch overhead and GPU idle gaps for many small kernels','More memory','Better accuracy'],a:1,exp:'Decode steps launch hundreds of small kernels per token.'},
{q:'Which call inside a stream-capture region breaks capture?',opts:['cudaMemcpyAsync on the capturing stream','cudaDeviceSynchronize()','kernel launch on the capturing stream','cudaEventRecord on the stream'],a:1,exp:'Synchronous operations are illegal during capture.'},
{q:'How does the UMD submit work without a syscall?',opts:['It can’t','Writes commands to a mapped pushbuffer and rings a user-mapped doorbell register','Uses ioctl every launch','Via interrupts'],a:1,exp:'Kernel involvement is mostly at setup (channel/memory creation).'}],
challenge:{prompt:R`<p>Write a CUDA program that launches 1,000 tiny kernels (each adds 1 to an array) in a loop: measure total time with plain launches vs a captured CUDA Graph launched once. Then pipeline a large dataset in 8 chunks across 4 streams (copy-in, kernel, copy-out) and show the overlap in Nsight Systems.</p>`,
hints:['Capture: <code>cudaStreamBeginCapture(s, cudaStreamCaptureModeGlobal)</code>; loop launches; <code>cudaStreamEndCapture(s, &g)</code>; <code>cudaGraphInstantiate(&ge, g, 0)</code>; <code>cudaGraphLaunch(ge, s)</code>.','Use <code>nsys profile --trace=cuda</code> and open the timeline.','Expect plain: ~2–4 µs/kernel CPU-bound; graph: much less per node.'],
solution:R`cudaGraph_t g; cudaGraphExec_t ge;
cudaStreamBeginCapture(s, cudaStreamCaptureModeGlobal);
for (int i = 0; i < 1000; ++i) inc<<<1, 256, 0, s>>>(d);
cudaStreamEndCapture(s, &g);
cudaGraphInstantiate(&ge, g, 0);                  // pay once
auto t0 = clock::now();
for (int it = 0; it < 100; ++it) cudaGraphLaunch(ge, s);
cudaStreamSynchronize(s);                         // compare with 100x1000 plain launches`},
interview:[{q:'"Design the instantiate/launch path for CUDA Graphs in a driver. What would you optimize?"',a:'Instantiate: topologically sort, assign nodes to hardware channels to maximize concurrency while minimizing cross-channel semaphores, pre-build pushbuffer segments with patchable parameter slots, pre-allocate memory nodes. Launch: one doorbell per channel, minimal CPU work (no allocation, no locks in the hot path, per-thread caches), patch only changed params on update. Concerns: thread safety (multiple host threads launching), interaction with MPS/MIG, error propagation, and observability (Nsight hooks via CUPTI). Measure CPU ns per launch and GPU idle gaps.'}],
resources:[['NVIDIA blog: Getting Started with CUDA Graphs','https://developer.nvidia.com/blog/cuda-graphs/'],['CUDA Programming Guide (see the CUDA Graphs chapter)','https://docs.nvidia.com/cuda/cuda-programming-guide/index.html'],['Nsight Systems','https://developer.nvidia.com/nsight-systems']]},
{id:'driver',title:'The GPU driver stack: UMD, KMD, RM, firmware',minutes:35,skills:['cuda-driver','drivers','linux-kernel','pcie-dma'],sims:['driverStack'],
analogy:R`The CUDA stack is a <b>restaurant</b>: your app is the diner; the runtime (libcudart) is the waiter; the user-mode driver (libcuda.so) is the head chef who writes detailed tickets; the kernel-mode driver (nvidia.ko) is the restaurant manager who owns the building, keys and health inspections; GSP firmware is the kitchen’s own foreman inside the GPU.`,
body:R`<h3>Layers (sim)</h3><ol><li><b>Application / frameworks</b> (PyTorch, TensorRT, cuBLAS, NCCL).</li><li><b>CUDA Runtime</b> (libcudart): convenient API, implicit context (primary context per device), kernel registration, lazy loading of modules.</li><li><b>CUDA Driver API / UMD</b> (libcuda.so): contexts, modules (loads PTX → JIT to SASS via the PTX compiler, or loads cubins/fatbins), memory management (VA reservation, mapping), streams/events/graphs → pushbuffers and GPFIFO entries, MPS client logic. Most launch-path performance lives here.</li><li><b>Kernel-mode driver</b> (nvidia.ko + nvidia-uvm.ko + nvidia-modeset/drm + nvidia-peermem): PCIe probing, BAR mapping, interrupt handling, channel allocation, GPU page tables and physical memory, Unified Memory page fault handling (UVM), power management, error handling (Xid errors, ECC, row remapping), ioctls from the UMD (<code>/dev/nvidia*</code>, <code>/dev/nvidia-uvm</code>).</li><li><b>Resource Manager</b> (RM) — the core of the KMD, now largely offloaded to <b>GSP</b> (GPU System Processor, a RISC-V core) firmware on Turing+; open GPU kernel modules (since R515) talk to GSP-RM via RPC.</li><li><b>Hardware</b>: host interface (PCIe/NVLink-C2C), copy engines, GPCs/SMs, MMU, HBM.</li></ol>
<h3>Request walk: cudaMalloc + launch</h3><p><code>cudaMalloc</code> → UMD allocator (often sub-allocated from a pool) → if needed ioctl to KMD/RM to allocate VRAM + map into the context’s GPU VA space (page table updates; TLB invalidate). Launch → UMD validates args, writes launch descriptor (QMD) and methods to pushbuffer, updates GPFIFO put pointer, rings doorbell (MMIO via user-mapped page; no syscall). GPU host engine fetches, schedules on SMs. Completion: semaphore release, optionally interrupt → KMD wakes waiters (or UMD spin-polls a memory location for low latency).</p>
<h3>Perf hot spots the "CUDA Driver Perf" role hunts</h3><ul><li>CPU cost per API call (locks, allocation, validation) — measured in ns; multi-threaded launch scaling.</li><li>Context creation time and module loading (lazy loading, JIT caching).</li><li>Memory allocation latency and fragmentation (stream-ordered allocator <code>cudaMallocAsync</code> with pools).</li><li>Synchronization latency (spin vs yield vs blocking sync flags), interrupt coalescing.</li><li>Page-fault handling throughput in UVM.</li><li>Tooling: perf, VTune, flame graphs on the driver, custom microbenchmarks, Nsight Systems CPU sampling, ftrace for the KMD.</li></ul>
<h3>Linux kernel engagement (CSP role)</h3><p>Cloud providers hit issues at the boundary: IOMMU/ATS settings slowing DMA, PCIe AER errors, NUMA placement of GPU-attached CPUs, VFIO passthrough and vGPU, kernel upgrades breaking the out-of-tree module (DKMS), confidential computing (encrypted bounce buffers), hugepages for pinned memory. Debug with dmesg Xid codes, <code>nvidia-smi -q</code>, <code>nvidia-bug-report.sh</code>, kdump/crash, eBPF/bpftrace on ioctls.</p>`,
poly:R`You have written exactly this split: vendor user-space libraries (UMD-like HALs) over kernel drivers with ioctls, mmap’d registers/doorbells, firmware on co-processors (Ambarella DSP/VP firmware, Qualcomm DSP via FastRPC). Frame your Poly work as "user/kernel driver co-design for accelerators" — that is the CUDA driver job description.`,
quiz:[
{q:'Which layer converts PTX to SASS at runtime?',opts:['nvidia.ko','The user-mode driver’s JIT (PTX compiler in libcuda/nvptx)','GSP firmware','cudart only'],a:1,exp:'The driver JITs PTX for the actual GPU architecture and caches the result.'},
{q:'Does a typical kernel launch require a syscall?',opts:['Yes, an ioctl each time','No — pushbuffer write + doorbell MMIO from user space','Only on Windows','Only for graphs'],a:1,exp:'Syscalls are for setup and some synchronization/blocking waits.'},
{q:'What does nvidia-uvm.ko handle?',opts:['Display','Unified Memory: GPU/CPU page faults, migration, HMM','Networking','Power capping'],a:1,exp:'UVM services replayable GPU faults and migrates pages.'},
{q:'A cloud customer sees "Xid 79" in dmesg. That indicates…',opts:['A user kernel assertion','GPU has fallen off the bus (PCIe link/power issue)','Out of memory','JIT failure'],a:1,exp:'Xid 79 = GPU fallen off the bus; check PCIe, power, thermals.'}],
challenge:{prompt:R`<p>Clone <code>NVIDIA/open-gpu-kernel-modules</code>. Find: (1) the PCI probe entry point, (2) where the ioctl dispatcher lives, (3) the RPC path to GSP. Then on a GPU box, use <code>strace -f -e ioctl</code> and <code>ltrace</code> (or bpftrace on <code>__x64_sys_ioctl</code>) while running a tiny CUDA program: count ioctls during init vs during 1,000 launches. Write a one-page explanation.</p>`,
hints:['Search <code>kernel-open/nvidia/nv.c</code> for <code>pci_driver</code> and <code>nvidia_probe</code>.','The ioctl entry is <code>nvidia_ioctl</code>; RM API goes through <code>rm_ioctl</code> into the src/nvidia tree.','Expect hundreds/thousands of ioctls during context creation and near zero per launch.'],
solution:R`<p>Probe: nv.c nvidia_probe → nv_pci_probe-style flow mapping BARs and registering with RM. Ioctls: nvidia_ioctl dispatches NV_ESC_* escapes into RM (allocation, control calls). GSP: the kernel_gsp code path sends RPCs over message queues in shared memory. Observation: init is ioctl-heavy (device open, memory, channels); steady-state launches are pure user-space doorbell writes — the core reason launch overhead is a UMD CPU-efficiency problem.</p>`},
interview:[{q:'"How would you find why cudaMalloc became 3× slower in a new driver release?"',a:'Reproduce with a microbenchmark across sizes and threads; bisect driver builds; profile with perf (user + kernel stacks) to see if time moved into the UMD allocator, ioctl/RM, page table updates or GSP RPC latency; check locks (perf lock / off-CPU), page clearing (zeroing VRAM for security), NUMA placement; compare call counts with tracing. Fix and add the benchmark to performance CI with thresholds.'}],
resources:[['NVIDIA open GPU kernel modules (GitHub)','https://github.com/NVIDIA/open-gpu-kernel-modules'],['CUDA Driver API reference','https://docs.nvidia.com/cuda/cuda-driver-api/index.html'],['NVIDIA Xid errors documentation','https://docs.nvidia.com/deploy/xid-errors/index.html']]},
{id:'sharing',title:'GPU sharing (time-slicing, MPS, MIG) and Nsight profiling',minutes:35,skills:['gpu-sharing','nsight','k8s','profiling-svc'],sims:['gpuSharing'],
analogy:R`Sharing a GPU is like sharing an <b>office building</b>. Time-slicing = tenants take turns using the whole building by the hour. MPS = several companies share open-plan floors at the same time (efficient, but one noisy tenant affects all and a fire alarm evacuates everyone). MIG = building is split into walled apartments with their own doors, plumbing and power — strong isolation, fixed sizes.`,
body:R`<h3>Options (sim)</h3><table><tr><th></th><th>Time-slicing</th><th>MPS</th><th>MIG</th></tr><tr><td>Concurrency</td><td>No (contexts alternate)</td><td>Yes: kernels from clients run concurrently</td><td>Yes: hardware partitions</td></tr><tr><td>Memory isolation</td><td>Separate VA per context</td><td>Separate VA (Volta+), shared fault domain</td><td>Dedicated memory slices + L2 + bandwidth</td></tr><tr><td>Fault isolation</td><td>Per context</td><td>Fatal fault can affect all clients</td><td>Strong (per instance)</td></tr><tr><td>QoS</td><td>Weak (context switch overhead)</td><td>Thread % limit (<code>CUDA_MPS_ACTIVE_THREAD_PERCENTAGE</code>), memory limits</td><td>Guaranteed slices (1g.10gb…7g.80gb on A100/H100)</td></tr><tr><td>Best for</td><td>Dev, bursty, low util</td><td>Many small cooperative jobs (inference, MPI ranks)</td><td>Multi-tenant, predictable QoS</td></tr></table>
<p><b>MPS internals</b>: a control daemon and server process own a single GPU context; clients connect and submit work through the server so kernels share SMs concurrently (no context switching). <b>MIG</b> partitions GPCs, L2 slices and memory controllers into up to 7 GPU instances, each further divisible into compute instances; each appears as its own device (UUID) to CUDA and Kubernetes. MPS can run inside a MIG instance. vGPU (time-sliced or MIG-backed) virtualizes GPUs for VMs.</p>
<p><b>Kubernetes</b>: the NVIDIA device plugin advertises <code>nvidia.com/gpu</code> (or MIG profiles like <code>nvidia.com/mig-1g.10gb</code>), with time-slicing replicas or MPS sharing configured in the GPU Operator; DRA (Dynamic Resource Allocation) is the newer model. Schedulers must avoid fragmentation of MIG profiles — a bin-packing problem (see the GPU job scheduler design drill).</p>
<h3>Profiling toolbox</h3><ul><li><b>Nsight Systems</b>: whole-system timeline — CPU threads, CUDA API calls, kernels, memcpys, NVTX ranges, OS runtime, NCCL. First tool: find gaps, serialization, launch overhead, CPU bottlenecks.</li><li><b>Nsight Compute</b>: per-kernel deep dive — SOL (speed-of-light) %, memory chart, warp stall reasons, source-level hotspots, roofline. Replays kernels many times to collect counters (high overhead).</li><li><b>CUPTI</b>: the profiling/tracing API underneath; used by PyTorch profiler, DCGM and custom profilers. <b>DCGM</b>: datacenter telemetry (SM activity, tensor pipe utilization, memory bandwidth, NVLink, XID, ECC) exported to Prometheus.</li><li><b>"Profiling Services"</b> (NVIDIA principal role): continuous fleet-wide profiling — low-overhead sampling (PC sampling, periodic counters), aggregating across thousands of GPUs, attribution to jobs/models, storage and query. It’s observability (Module 11) for GPUs.</li></ul>
<div class="callout gotcha"><b>Gotcha:</b> "GPU utilization" from nvidia-smi = fraction of time any kernel was running, not how many SMs are busy. A single tiny kernel looping keeps it at 100%. Use SM activity/occupancy metrics from DCGM for real efficiency.</div>`,
poly:R`Multi-stream camera devices share an ISP/encoder among clients with priorities (main video vs preview vs CV) — your own "GPU sharing" problem with QoS. For the UMD Graphs & Sharing role, connect: per-client queues, priority scheduling, fault isolation, and the cost of context switches on accelerators.`,
quiz:[
{q:'A multi-tenant cloud wants hard memory and fault isolation between customers on one A100. Choose…',opts:['Time-slicing','MPS','MIG','Unified memory'],a:2,exp:'MIG gives hardware-partitioned memory, cache and fault isolation.'},
{q:'Ten small MPI ranks each use 10% of the GPU. Best throughput option?',opts:['Time-slicing','MPS (concurrent kernels from multiple processes)','One rank only','MIG 7 slices'],a:1,exp:'MPS lets kernels from different processes share SMs concurrently.'},
{q:'nvidia-smi shows 100% GPU utilization. Does that mean all SMs are busy?',opts:['Yes','No — it means a kernel was running during the sample period'],a:1,exp:'Use DCGM SM activity/occupancy or Nsight.'},
{q:'First tool to understand why a training step has idle gaps between kernels?',opts:['Nsight Compute','Nsight Systems timeline','cuda-gdb','compute-sanitizer'],a:1,exp:'System-level timeline first; kernel-level later.'}],
challenge:{prompt:R`<p>Run two copies of an inference script (or a matmul loop) on one GPU three ways: default time-slicing, with MPS (<code>nvidia-cuda-mps-control -d</code>), and if available, two MIG instances. Record per-process latency p50/p99 and total throughput. Capture an Nsight Systems trace in each mode and explain the timeline differences. Write the policy you’d recommend for a K8s inference cluster.</p>`,
hints:['MPS: export <code>CUDA_MPS_PIPE_DIRECTORY</code>/<code>CUDA_MPS_LOG_DIRECTORY</code>, start daemon, run clients, <code>echo quit | nvidia-cuda-mps-control</code>.','MIG: <code>nvidia-smi -mig 1</code>, <code>nvidia-smi mig -cgi 3g.40gb,3g.40gb -C</code> (A100/H100, root).','Use <code>nsys profile -t cuda,nvtx</code> per process.'],
solution:R`<p>Expected: time-slicing shows alternating kernels with context-switch gaps → worst p99; MPS shows overlapping kernels, best throughput for small kernels, but a crash in one client can kill the other; MIG gives stable latency per instance and isolation, slightly lower peak throughput if load is imbalanced. Recommendation: MIG for multi-tenant/SLA-critical, MPS within a tenant for many small models, time-slicing for dev.</p>`},
interview:[{q:'"Design GPU sharing for an internal inference platform with hundreds of small models."',a:'Profile model sizes/latency SLOs; pack small models with MPS inside MIG slices per team for isolation; model multiplexing with LRU loading (weights in host memory, swap on demand) and request batching per model; scheduler aware of MIG profiles to prevent fragmentation; admission control and per-tenant quotas; telemetry via DCGM (SM activity, memory) to right-size slices; failure domains (MPS crash) handled by health checks and restarts.'}],
resources:[['NVIDIA MIG User Guide','https://docs.nvidia.com/datacenter/tesla/mig-user-guide/'],['NVIDIA MPS documentation','https://docs.nvidia.com/deploy/mps/index.html'],['Nsight Systems','https://developer.nvidia.com/nsight-systems'],['NVIDIA DCGM','https://developer.nvidia.com/dcgm']]}
]});
})();

<script>/* js/content/m06-infer.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'infer',num:6,icon:'🧠',short:'AI inference serving',title:'AI Inference Serving at Scale',tier:'adjacent',
summary:'Prefill vs decode, KV cache and PagedAttention, continuous batching, tensor/pipeline/expert parallelism, and disaggregated, KV-aware serving (Dynamo, vLLM, Triton, SGLang).',
why:'Anthropic (Cloud Inference, Inference Velocity), NVIDIA Dynamo, OpenAI, Microsoft CoreAI, Google Cloud AI and GM AI Platform all serve models. Anthropic says ML background is NOT required — they want systems engineers who understand where the latency and memory go.',
lessons:[
{id:'prefill',title:'Anatomy of LLM inference: prefill vs decode',minutes:30,skills:['llm-serving','gpu-arch','perf-eng','python'],sims:['prefillDecode'],
analogy:R`Prefill is <b>reading the whole exam question at once</b> — your eyes take in the page in parallel. Decode is <b>writing the answer one word at a time</b>, re-glancing at the question and everything you’ve written before each word. Reading is fast and parallel (compute-bound); writing is slow and sequential (memory-bound).`,
body:R`<h3>The two phases (sim)</h3><ul><li><b>Prefill</b>: all prompt tokens go through the model in one forward pass. Matmuls are [prompt_len × d] × [d × d] — large GEMMs → <b>compute-bound</b>, tensor cores busy. Produces the KV cache for every layer and the first output token. Latency metric: <b>TTFT</b> (time to first token), grows ~linearly with prompt length (quadratically for attention at long contexts).</li><li><b>Decode</b>: one new token per sequence per step. Matmuls are [batch × d] × [d × d] — for small batch this is matrix-vector → <b>memory-bound</b>: every step streams all weights from HBM. Metric: <b>TPOT/ITL</b> (time per output token / inter-token latency).</li></ul>
<h3>Back-of-envelope (interviewers love this)</h3><p>FLOPs per token ≈ 2 × parameters. A 70B model in BF16 = 140 GB weights → needs ≥2 H100-80GB just for weights. Batch-1 decode on 8×H100 with tensor parallelism: aggregate HBM ~26.8 TB/s → minimum ~140 GB / 26.8 TB/s ≈ 5.2 ms/token (≈190 tok/s) ignoring communication and KV reads. Batch 64 decode reads the same weights once per step for 64 tokens → throughput ~64× higher at nearly the same step time (until compute or KV reads dominate). That is why serving systems batch aggressively and why <b>throughput vs latency</b> is the fundamental trade-off.</p>
<h3>Where time goes in decode</h3><ol><li>Weight reads (dominant at small batch) → quantization (FP8, INT4 weight-only, AWQ/GPTQ) cuts bytes.</li><li>KV cache reads (grows with context × batch) → GQA/MQA (fewer KV heads), KV quantization, paged attention kernels.</li><li>Kernel launch overhead (hundreds of small kernels per step) → CUDA Graphs, fused kernels.</li><li>Communication for tensor parallelism (all-reduce per layer) → NVLink, overlap.</li><li>CPU-side scheduling/tokenization/sampling → must be off the critical path (async scheduling).</li></ol>
<h3>Speedups beyond batching</h3><p><b>Speculative decoding</b>: a small draft model (or extra heads like Medusa/EAGLE) proposes k tokens, the big model verifies them in one forward pass (prefill-like, parallel) → several tokens per expensive step when acceptance is high; output distribution is preserved with proper rejection sampling. <b>Prefix caching</b>: reuse KV for shared prompts (system prompts, multi-turn chats). <b>FlashAttention</b>: IO-aware fused attention.</p>
<h3>SLOs</h3><p>Production SLOs are on TTFT p50/p99 and ITL p99, plus goodput (requests/s meeting SLO). A senior answer always states which metric matters for the product (chat: TTFT and steady streaming; batch/offline: throughput/cost per token).</p>`,
poly:R`Video conferencing has the same latency vs throughput tension: encoders batch frames/slices for efficiency but each frame has a deadline. Your intuition for "deadline-driven pipelines with shared accelerators" translates directly — say it in Anthropic/NVIDIA interviews.`,
quiz:[
{q:'Which phase is typically compute-bound?',opts:['Prefill','Decode at batch 1','Tokenization','Sampling'],a:0,exp:'Prefill processes many tokens per weight load → high arithmetic intensity.'},
{q:'A 13B model in FP16 on one GPU with 2 TB/s HBM. Lower bound on batch-1 decode time per token?',opts:['~1.3 ms','~13 ms','~130 ms','~0.13 ms'],a:1,exp:'26 GB / 2 TB/s = 13 ms (weights must be read each step).'},
{q:'Increasing decode batch from 1 to 32 (enough memory) mostly…',opts:['Increases per-token latency 32×','Increases throughput ~up to 32× with modest step-time increase','Has no effect','Reduces TTFT'],a:1,exp:'Weights are read once per step and shared across sequences.'},
{q:'Speculative decoding speeds up generation because…',opts:['It skips layers','Verifying k draft tokens is one parallel (prefill-like) pass of the big model','It lowers precision','It caches outputs'],a:1,exp:'Accepted drafts yield multiple tokens per large-model step.'}],
challenge:{prompt:R`<p>Write a Python "inference calculator": inputs = params, bytes/param, layers, KV heads, head dim, GPU HBM size and bandwidth, number of GPUs, batch, prompt and output lengths. Outputs = weights memory, KV bytes per token, max batch that fits, estimated TTFT (compute-bound using peak FLOPs × MFU) and TPOT (memory-bound). Validate against a published benchmark for Llama-3-8B on one GPU.</p>`,
hints:['KV bytes/token = 2 (K and V) × layers × kv_heads × head_dim × bytes.','TTFT ≈ 2 × params × prompt_tokens / (peak_flops × MFU), MFU ~0.4–0.6.','TPOT ≈ (weight_bytes + batch × context × kv_bytes_per_token) / (bandwidth × efficiency).'],
solution:R`def kv_per_token(L, kvh, hd, b=2): return 2 * L * kvh * hd * b
def plan(P, bpp, L, kvh, hd, hbm, bw, flops, gpus=1, batch=1, ctx=4096, mfu=0.5, bw_eff=0.8):
    w = P * bpp; kv = kv_per_token(L, kvh, hd)
    free = hbm * gpus * 0.9 - w
    max_seqs = int(free // (kv * ctx))
    ttft = 2 * P * ctx / (flops * gpus * mfu)
    tpot = (w + batch * ctx * kv) / (bw * gpus * bw_eff)
    return dict(weights_GB=w/1e9, kv_MB_per_tok=kv/1e6, max_seqs=max_seqs, ttft_ms=ttft*1e3, tpot_ms=tpot*1e3)
# Llama-3-8B: L=32, kv_heads=8, head_dim=128 -> 128 KiB/token in bf16`},
interview:[{q:'"Why is LLM decode slow and what would you do about it at the systems level?"',a:'Decode is memory-bandwidth bound: each step reads all weights plus KV cache for few FLOPs. Levers: batching (continuous batching), quantization of weights and KV, GQA, tensor parallelism to aggregate bandwidth (with NVLink), CUDA Graphs/fused kernels to cut overhead, speculative decoding, prefix caching, and disaggregating prefill/decode so each runs on hardware/configs suited to it. Tie to SLOs: TTFT, ITL, and cost per million tokens.'}],

{id:'kv',title:'KV cache and PagedAttention',minutes:30,skills:['llm-serving','gpu-arch'],sims:['kvCache'],
analogy:R`The KV cache is each conversation’s <b>notebook of everything said so far</b>. Old systems reserved a whole thick notebook per guest up front (wasted pages). PagedAttention hands out <b>loose-leaf pages from a shared binder</b> as needed, with a table of contents per guest — the OS virtual-memory trick applied to attention.`,
body:R`<h3>Why a KV cache?</h3><p>Attention for a new token needs Keys and Values of all previous tokens. Recomputing them each step would make generation O(n²) in compute; caching makes each step O(n) memory reads. Size per token = 2 × layers × kv_heads × head_dim × bytes. Llama-3-70B (80 layers, 8 KV heads via GQA, head_dim 128, BF16): 2×80×8×128×2 = 320 KB/token → a 32K-token context = 10 GB for one sequence! KV memory, not compute, usually caps batch size.</p>
<h3>Fragmentation (sim)</h3><p>Naive servers pre-allocate max_seq_len contiguous KV per request: internal fragmentation (unused reserved tail), external fragmentation (holes between requests), and no sharing. Measured waste in early systems was 60–80% of KV memory.</p>
<h3>PagedAttention (vLLM)</h3><p>KV is stored in fixed-size <b>blocks</b> (e.g. 16 tokens). Each sequence has a <b>block table</b> mapping logical block → physical block, exactly like a page table. Allocation on demand; waste is &lt; one block per sequence. Attention kernels gather through the block table. Bonus features: <b>copy-on-write sharing</b> for parallel sampling/beam search and <b>prefix caching</b> (hash blocks by token content; identical system prompts share physical blocks with ref counts), plus <b>preemption</b> by swapping blocks to CPU memory or recomputing when memory is exhausted.</p>
<h3>Memory hierarchy for KV</h3><p>GPU HBM → CPU DRAM (via PCIe/NVLink-C2C) → local SSD → remote storage. Systems like NVIDIA Dynamo’s KV block manager and LMCache offload and transfer KV between tiers and between nodes (NIXL over RDMA). Policy questions: eviction (LRU with prefix awareness), when re-computation (prefill) is cheaper than transfer, and admission control.</p>
<h3>Reducing KV size</h3><ul><li><b>MQA/GQA</b>: share K/V heads across query heads (8 KV heads vs 64 Q heads → 8× smaller).</li><li><b>KV quantization</b> (FP8/INT8/INT4) with per-channel scales.</li><li><b>Sliding-window</b> or sparse attention; <b>MLA</b> (DeepSeek) compresses KV into a latent vector.</li></ul>`,
poly:R`This is virtual memory and buffer pools — your Module 2 page-walk and DMA buffer management knowledge in new clothes. Explaining PagedAttention as "page tables for KV with copy-on-write and refcounted shared pages" shows you understand it more deeply than many ML engineers.`,
quiz:[
{q:'KV bytes per token for 32 layers, 8 KV heads, head_dim 128, FP16?',opts:['32 KB','128 KB','1 MB','8 KB'],a:1,exp:'2×32×8×128×2 bytes = 131,072 bytes = 128 KiB.'},
{q:'PagedAttention is most analogous to…',opts:['TCP windows','OS virtual memory paging with page tables','RAID','Bloom filters'],a:1,exp:'Logical blocks mapped to physical blocks via per-sequence tables.'},
{q:'How does prefix caching save compute?',opts:['Smaller model','Shared prompt prefixes reuse already computed KV blocks, skipping their prefill','Fewer layers','Lower precision'],a:1,exp:'Blocks are content-hashed and shared via refcount.'},
{q:'Batch size during decode is usually limited first by…',opts:['Tensor core FLOPs','KV cache memory','PCIe','CPU'],a:1,exp:'Each sequence’s KV grows with context; HBM fills up.'}],
challenge:{prompt:R`<p>Implement a block-based KV allocator in Python or C++: <code>allocate(seq_id)</code>, <code>append_token(seq_id)</code> (allocates a new block every B tokens), <code>fork(seq_id)</code> (copy-on-write sharing), <code>free(seq_id)</code>, and prefix caching by hashing full blocks of token IDs. Simulate 1,000 requests with random prompt/output lengths and report memory utilization vs a contiguous max-length allocator.</p>`,
hints:['Physical blocks have refcounts; fork increments refcounts of all blocks in the table.','On append to a shared last block (refcount>1), copy it first (COW).','Prefix cache key: hash(parent_hash, tuple(tokens_in_block)) so identical prefixes match block by block.'],
solution:R`class KV:
    def __init__(s, nblocks, B): s.B=B; s.free=list(range(nblocks)); s.ref=[0]*nblocks; s.tab={}; s.len={}
    def _get(s):
        b = s.free.pop(); s.ref[b] = 1; return b
    def allocate(s, sid): s.tab[sid] = []; s.len[sid] = 0
    def append_token(s, sid):
        t = s.tab[sid]
        if s.len[sid] % s.B == 0: t.append(s._get())
        elif s.ref[t[-1]] > 1:                      # copy-on-write
            s.ref[t[-1]] -= 1; t[-1] = s._get()     # (copy contents here)
        s.len[sid] += 1
    def fork(s, src, dst):
        s.tab[dst] = list(s.tab[src]); s.len[dst] = s.len[src]
        for b in s.tab[dst]: s.ref[b] += 1
    def free_seq(s, sid):
        for b in s.tab.pop(sid):
            s.ref[b] -= 1
            if s.ref[b] == 0: s.free.append(b)
        del s.len[sid]`},
interview:[{q:'"Our inference servers OOM under long-context traffic. What do you do?"',a:'Measure KV usage per request and fragmentation; adopt paged KV with on-demand allocation; enforce admission control based on projected KV (prompt + max_tokens); preemption policy (swap to CPU vs recompute) with priorities; KV quantization/GQA models; route long-context requests to dedicated pools with more memory or more TP; prefix caching for repeated prompts; and expose metrics (KV utilization, preemptions, swap rate) with alerts.'}],
resources:[['Efficient Memory Management for LLM Serving with PagedAttention (vLLM, SOSP 2023)','https://arxiv.org/abs/2309.06180'],['vLLM documentation','https://docs.vllm.ai/'],['GQA paper','https://arxiv.org/abs/2305.13245']]},
{id:'batching',title:'Continuous batching and request scheduling',minutes:30,skills:['llm-serving','dist-sys','perf-eng','python'],sims:['continuousBatching'],
analogy:R`Static batching is a <b>tour bus that only leaves when full and returns when the last tourist is done</b> — everyone waits for the slowest. Continuous batching is a <b>subway</b>: at every station (decode step) passengers who reached their stop get off and new ones get on.`,
body:R`<h3>Static vs continuous (sim)</h3><p>Static batching groups N requests, runs until all finish; short requests wait for the longest (head-of-line blocking) and slots sit idle. <b>Iteration-level scheduling</b> (Orca, OSDI ’22) re-forms the batch every decode step: finished sequences leave immediately and queued requests join. Throughput improvements of several× to >20× over naive static batching were reported, with far better latency for short requests.</p>
<h3>Mixing prefill and decode</h3><p>A new request’s prefill is large and compute-heavy; inserting it stalls decode for everyone (ITL spike). Solutions: <b>chunked prefill</b> (split long prompts into chunks of, say, 512–2048 tokens and piggyback them on decode steps with a per-step token budget — Sarathi-Serve), or <b>disaggregation</b> (separate prefill and decode workers; next lesson).</p>
<h3>Scheduler policy knobs</h3><ul><li><b>Token budget</b> per step (max_num_batched_tokens) and max sequences (max_num_seqs).</li><li><b>Admission</b> based on available KV blocks; <b>preemption</b> when memory runs out (recompute vs swap), victim choice (most recent, lowest priority).</li><li><b>Fairness/priority</b>: FCFS vs shortest-job-first approximations (predicted output length), per-tenant quotas, priority classes for interactive vs batch traffic.</li><li><b>SLO-aware scheduling</b>: maximize goodput — requests completing within TTFT/ITL SLOs.</li></ul>
<h3>System view</h3><p>A modern engine’s loop: tokenizer/frontend (CPU, often separate process) → scheduler decides batch for step t → model runner launches (often a captured CUDA Graph per batch-size bucket) → sampler → detokenize/stream back. Overlapping CPU scheduling of step t+1 with GPU execution of step t avoids idle GPU (async scheduling). At cluster level a router chooses replicas (least-loaded, KV-cache-aware), with autoscaling on queue depth and KV utilization.</p>
<div class="callout num"><b>Little’s law:</b> concurrency = throughput × latency. If each request takes 10 s end-to-end and you need 500 req/s, you must hold 5,000 requests in flight — check that KV memory across replicas can hold them.</div>`,
poly:R`Your encoder/ISP scheduling with mixed-priority streams (main 4K stream vs preview vs CV inference frames) is iteration-level scheduling with deadlines. Bring that analogy plus Little’s law math to inference interviews.`,
quiz:[
{q:'In static batching, a batch has outputs of 10, 20 and 500 tokens. The 10-token request finishes after…',opts:['10 steps','500 steps (waits for the batch)','20 steps','Immediately'],a:1,exp:'Head-of-line blocking — continuous batching returns it after 10 steps.'},
{q:'Chunked prefill exists to…',opts:['Reduce model size','Bound per-step work so long prompts don’t stall decoding sequences (ITL spikes)','Increase TTFT','Remove KV cache'],a:1,exp:'Prefill chunks share each step’s token budget with decodes.'},
{q:'By Little’s law, 200 req/s with 8 s average latency means average in-flight requests of…',opts:['25','200','1,600','8'],a:2,exp:'L = λW = 200 × 8.'},
{q:'Which metric best captures "useful throughput under SLOs"?',opts:['Tokens/s','Goodput (req/s meeting TTFT and ITL SLOs)','GPU utilization','Batch size'],a:1,exp:'Raw throughput can rise while SLO attainment collapses.'}],
challenge:{prompt:R`<p>Write a discrete-event simulator in Python: Poisson arrivals, prompt lengths and output lengths from lognormal distributions, step time model = a + b·(prefill tokens) + c·(decode seqs), KV capacity in tokens. Compare static batching, continuous batching, and continuous + chunked prefill. Plot p50/p99 TTFT and ITL vs arrival rate and find each policy’s max goodput.</p>`,
hints:['Keep state: waiting queue, running set (each with remaining output tokens and context length).','Each step: pick prefill chunks up to token budget, include all running decodes, advance time by step model.','Record TTFT when a request’s prefill completes and ITL as the step durations it experiences.'],
solution:R`<p>Expected curves: static batching saturates early and has huge TTFT due to batch formation waits; continuous batching extends capacity substantially; chunked prefill keeps ITL p99 flat at high load at the cost of slightly higher TTFT for long prompts. Goodput max = highest arrival rate where p99 TTFT &lt; target and p99 ITL &lt; target.</p>`},
interview:[{q:'"Design the scheduler for an LLM serving engine."',a:'Iteration-level loop; inputs: queue with priorities/tenants, KV block availability, token budget; policy: admit while KV available (reserve projected blocks), chunk prefill, prioritize decodes for ITL, preempt lowest priority when out of blocks (swap vs recompute based on cost), fairness via weighted queues; async CPU scheduling overlapped with GPU; CUDA Graph buckets for batch sizes; metrics per step. Discuss starvation, long-context outliers, and how you validate with a simulator + load tests.'}],
resources:[['Orca: iteration-level scheduling (OSDI 22)','https://www.usenix.org/conference/osdi22/presentation/yu'],['Sarathi-Serve: chunked prefills (OSDI 24)','https://arxiv.org/abs/2403.02310'],['vLLM documentation','https://docs.vllm.ai/']]},
{id:'parallel',title:'Model parallelism: tensor, pipeline, expert, data',minutes:35,skills:['model-parallel','rdma','ml-infra'],sims:['pipelineBubble','ringAllreduce'],
analogy:R`Building a huge LEGO model with friends: <b>tensor parallel</b> = everyone builds a slice of every layer and you constantly pass pieces (high-bandwidth chatter at one table); <b>pipeline parallel</b> = assembly line, each friend owns a few floors and passes the model along (bubbles while the line fills); <b>expert parallel</b> = specialists, each request visits only a couple of them; <b>data parallel</b> = many teams each building a full copy.`,
body:R`<h3>Tensor parallelism (TP)</h3><p>Megatron-style: split weight matrices across GPUs. MLP: first linear column-split (no communication), second row-split, then an <b>all-reduce</b> of partial sums — 2 all-reduces per transformer layer (attention + MLP) in forward. Communication volume per layer ∝ batch_tokens × hidden. Needs NVLink-class bandwidth → keep TP within a node (TP ≤ 8 typically). Benefits for inference: aggregate HBM bandwidth and capacity reduce per-token latency.</p>
<h3>Pipeline parallelism (PP) (sim)</h3><p>Split layers into stages on different GPUs/nodes; activations flow point-to-point (cheap, tolerates slower interconnects). Problem: <b>pipeline bubbles</b> — with p stages and m micro-batches, bubble fraction ≈ (p−1)/(m+p−1) for GPipe-style schedules. 1F1B and interleaved schedules reduce memory and bubbles. For inference, PP raises throughput but adds latency per token (sequential hops).</p>
<h3>Expert parallelism (EP) for MoE</h3><p>Mixture-of-Experts layers route each token to top-k of E experts. Experts are spread over GPUs; tokens are exchanged with <b>all-to-all</b> before and after the expert layer. Challenges: load imbalance (hot experts), capacity factors/token dropping (training), all-to-all latency across nodes (needs RDMA, optimized kernels like DeepEP), and combining EP with TP/DP for attention.</p>
<h3>Data parallelism and collectives (sim 2)</h3><p>Training replicas compute gradients on different data and <b>all-reduce</b> them. <b>Ring all-reduce</b>: reduce-scatter then all-gather, each GPU sends 2(N−1)/N × data — bandwidth-optimal and independent of N; tree algorithms win for small messages/latency. NCCL picks ring/tree/NVLS (NVLink SHARP in-switch reduction) and uses NVLink within nodes, InfiniBand/RoCE with GPUDirect RDMA across nodes. ZeRO/FSDP shard optimizer states, gradients and parameters across DP ranks.</p>
<h3>Choosing a layout (interview)</h3><p>Rule of thumb: TP within node over NVLink; PP or EP across nodes; DP for scaling throughput. For a 70B inference service with 8×H100 nodes: TP=8 in one node (or TP=4 × 2 replicas with FP8) — trade latency vs replicas. For giant MoE (e.g. 600B+): wide EP across many GPUs with attention DP, plus prefill/decode disaggregation (DeepSeek-V3 style).</p>`,
poly:R`Distributing a multi-camera, multi-accelerator video pipeline across DSP, NPU and CPU is pipeline parallelism with bubbles and stage balancing; your bandwidth math for MIPI/PCIe/DDR links maps directly to NVLink/IB math.`,
quiz:[
{q:'Pipeline with 4 stages and 4 micro-batches (GPipe-style). Bubble fraction ≈ ?',opts:['0%','~43% (3/7)','75%','25%'],a:1,exp:'(p−1)/(m+p−1) = 3/7. More micro-batches shrink it.'},
{q:'Why keep tensor parallelism within a node?',opts:['Licensing','Two all-reduces per layer need very high bandwidth/low latency (NVLink)','PCIe is faster','It uses no communication'],a:1,exp:'Cross-node TP is communication-bound.'},
{q:'In ring all-reduce with N GPUs, data each GPU sends is about…',opts:['N × data','2(N−1)/N × data (≈2× data, independent of N)','data / N','log N × data'],a:1,exp:'Reduce-scatter + all-gather, each (N−1)/N.'},
{q:'MoE expert parallelism needs which collective around expert layers?',opts:['Broadcast','All-to-all (dispatch and combine)','Barrier only','Reduce-scatter only'],a:1,exp:'Tokens go to the GPUs owning their chosen experts and back.'}],
challenge:{prompt:R`<p>Using PyTorch with 2+ processes (CPU gloo backend is fine), implement: (1) a column-parallel and row-parallel linear layer pair with an all-reduce and verify against a single-process result; (2) time all-reduce for message sizes 1 KB–256 MB and plot bus bandwidth; (3) simulate a 4-stage pipeline with 1, 4 and 16 micro-batches and measure bubbles.</p>`,
hints:['<code>torch.distributed.init_process_group("gloo")</code>, launch with <code>torchrun --nproc_per_node=2</code>.','Column-parallel: each rank holds W[:, shard]; row-parallel: W2[shard, :], then <code>dist.all_reduce(y)</code>.','Bus bandwidth for all-reduce = size × 2(N−1)/N / time.'],
solution:R`# rank r of N; X: [b, d]; W1: [d, f]; W2: [f, d]
W1_r = W1[:, r*f//N:(r+1)*f//N]          # column split
W2_r = W2[r*f//N:(r+1)*f//N, :]          # row split
h_r = torch.relu(X @ W1_r)               # no communication
y = h_r @ W2_r                           # partial sum
dist.all_reduce(y)                       # sum partials -> equals relu(X@W1)@W2`},
interview:[{q:'"How would you shard a 400B dense model for low-latency inference on H100 nodes?"',a:'Memory: 800 GB BF16 (400 GB FP8) + KV → multiple nodes. Use FP8 weights; TP=8 within node, PP=2 across 2 nodes (or wider with fast IB) — PP adds per-token hop latency; alternatively larger NVLink domains (GB200 NVL72) allow TP/EP within the rack. Discuss all-reduce costs per layer, overlap of comm and compute, KV memory per GPU, replicas for throughput, and failure domains (one GPU failure takes down the replica → health checks, fast reload).'}],
resources:[['Megatron-LM paper','https://arxiv.org/abs/1909.08053'],['GPipe paper','https://arxiv.org/abs/1811.06965'],['NVIDIA NCCL documentation','https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/index.html'],['ZeRO paper','https://arxiv.org/abs/1910.02054']]},
{id:'scale',title:'Serving at scale: disaggregation, KV-aware routing, Dynamo/Triton/vLLM',minutes:35,skills:['llm-serving','dist-sys','k8s','lb-traffic','ml-infra'],sims:['kvRouting'],
analogy:R`A large restaurant splits <b>prep cooks</b> (prefill: chop everything for an order fast) from <b>line cooks</b> (decode: steady plating). The host (router) seats returning guests at the table where their appetizers already wait (KV-aware routing) instead of the emptiest table.`,
body:R`<h3>Disaggregated serving</h3><p>Prefill (compute-bound, bursty) and decode (memory-bound, steady) interfere when co-located. <b>Disaggregation</b> (DistServe, Splitwise, Mooncake; NVIDIA Dynamo) runs them on separate worker pools, transferring the KV cache from prefill to decode workers over NVLink/RDMA (Dynamo’s NIXL library). Benefits: tune parallelism per phase (e.g. prefill TP=4, decode TP=8 or wider EP), scale pools independently based on traffic mix (long prompts vs long outputs), and eliminate ITL spikes. Cost: KV transfer bandwidth (a 4K-token prompt on a 70B model ≈ 1.3 GB of KV) and complexity. Conditional disaggregation: short prompts prefill locally on decode workers.</p>
<h3>KV-aware routing (sim)</h3><p>With prefix caching, the best replica for a request is often the one that already holds its prefix (multi-turn chat, shared system prompts, agents re-sending long contexts). A router maintains an index of which worker holds which KV block hashes (radix tree / global KV events) and scores workers: <code>cost = α·(prefill tokens not cached) + β·(load / queue depth)</code>. Pure cache affinity causes hot spots; pure load balancing destroys cache hit rate — the trade-off you play with in the sim. SGLang’s RadixAttention and Dynamo’s KV router implement variants.</p>
<h3>The ecosystem</h3><ul><li><b>vLLM</b>: PagedAttention, continuous batching, prefix caching, many models; OpenAI-compatible server.</li><li><b>SGLang</b>: RadixAttention, structured outputs, fast scheduling.</li><li><b>TensorRT-LLM</b>: NVIDIA-optimized kernels/engines, in-flight batching, FP8/FP4.</li><li><b>Triton Inference Server</b>: general model server (multiple frameworks, dynamic batching, ensembles, model repository, metrics).</li><li><b>NVIDIA Dynamo</b>: datacenter-scale orchestration layer above engines (vLLM/SGLang/TRT-LLM): disaggregated prefill/decode, KV-aware router, KV block manager across memory tiers, NIXL transfers, SLA-based planner for autoscaling.</li></ul>
<h3>Platform concerns (Anthropic Cloud Inference / Inference Velocity)</h3><ul><li>Multi-cloud capacity (AWS, GCP, Azure; different accelerators like GPUs, TPUs, Trainium) and routing across regions with failover.</li><li><b>Model rollout</b>: weights are 100s of GB — distribution via P2P/caching, warm pools, canarying new model versions or engine builds with quality + latency gates, rollback.</li><li>Autoscaling with long cold starts (loading weights can take minutes) → predictive scaling and buffer capacity.</li><li>Rate limiting and fair sharing across customers; priority tiers; load shedding under overload.</li><li>Observability: per-request traces (queue, prefill, decode), KV hit rates, tokens/s/GPU, cost per token.</li></ul>`,
poly:R`Fleet-scale thinking from devices (OTA rollouts, telemetry, staged releases) is the same muscle Anthropic’s Inference Velocity team uses for rolling out model/engine versions. Pair this lesson with Module 9’s canary sim to tell one coherent story.`,
quiz:[
{q:'Main benefit of prefill/decode disaggregation?',opts:['Less code','Removes interference (ITL spikes) and lets each phase use its own parallelism and scaling','No KV transfer needed','Smaller models'],a:1,exp:'At the cost of KV transfer between pools.'},
{q:'Routing every request to the replica with the best prefix-cache hit rate, ignoring load, leads to…',opts:['Optimal latency','Hot spots and queueing on popular replicas','Lower hit rate','Nothing'],a:1,exp:'Balance cache affinity vs load (as in the sim).'},
{q:'Approx KV size to transfer for a 4K-token prompt at 320 KB/token?',opts:['~13 MB','~1.3 GB','~130 GB','~1.3 MB'],a:1,exp:'4096 × 320 KB ≈ 1.3 GB — needs RDMA/NVLink-class links.'},
{q:'Why are cold starts a big deal for inference autoscaling?',opts:['DNS','Loading hundreds of GB of weights onto GPUs takes minutes','CPU boot','TLS'],a:1,exp:'Requires predictive scaling, warm pools and fast weight distribution.'}],
challenge:{prompt:R`<p>Extend the routing sim idea in Python: N workers each with an LRU prefix cache (by block hash) and a queue. Generate multi-turn chat traffic (sessions re-sending growing contexts) + random one-shot requests. Implement routers: round-robin, least-loaded, consistent-hash by session, and KV-aware scored routing. Report cache hit rate, p99 TTFT and load imbalance. Bonus: add a worker failure and observe recovery.</p>`,
hints:['Represent prompts as lists of block hashes (chained hashing of 16-token blocks).','TTFT ≈ queue wait + (uncached tokens × prefill cost).','Consistent hashing by session gives affinity but rebalances poorly on failure; use bounded loads.'],
solution:R`def score(w, req, alpha=1.0, beta=50.0):
    cached = w.cache.longest_prefix(req.blocks)            # number of blocks already present
    miss_tokens = (len(req.blocks) - cached) * BLOCK
    return alpha * miss_tokens + beta * w.queue_tokens / CAPACITY
best = min(workers, key=lambda w: score(w, req))
# Expect: KV-aware scored routing gets ~consistent-hash hit rates with least-loaded tail latency.`},
interview:[{q:'"Design an LLM inference platform serving 100k requests/min across regions."',a:'Front door (auth, rate limiting, tenant quotas) → global router (region by latency/capacity, failover) → regional KV-aware router → engine pools (prefill/decode disaggregated for large models, colocated for small) on K8s with GPU scheduling; model registry and weight distribution (P2P, local NVMe caches); autoscaling on queue depth/KV utilization with warm buffer; canary for model/engine changes with quality evals and latency gates; observability (TTFT/ITL histograms per model/tenant, traces, GPU metrics); overload behaviour (shed low-priority, degrade max tokens). Do capacity math: tokens/s per GPU × GPUs needed with headroom.'}],

]});

<script>/* js/content/m07-dist.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'dist',num:7,icon:'🌐',short:'Distributed systems',title:'Distributed Systems',tier:'core',
summary:'Time and ordering, Raft consensus, replication and quorums, partitioning with consistent hashing, and failure handling: retries, idempotency, metastability.',
why:'Tied for #1 demand in your October alerts (21 roles): Anthropic Distributed Systems, Cloudflare, Google, Walmart, JPMorgan, Microsoft, OpenAI. Principal interviews test whether you reason about partial failure, not whether you memorized Paxos.',
lessons:[
{id:'time',title:'Time, ordering and causality',minutes:25,skills:['dist-sys','python'],sims:['lamportClocks'],
analogy:R`Distributed nodes are <b>pen pals on different continents with unreliable watches</b>. You can’t trust timestamps to know who wrote first, but you can know "I wrote this after reading your letter" — causality, which is what logical clocks capture.`,
body:R`<h3>Why wall clocks fail</h3><p>NTP keeps clocks within ~1–10 ms in a datacenter (worse across WAN), clocks drift (~10–100 ppm), jump on corrections, and leap seconds happen. Using wall-clock timestamps for "last write wins" silently drops writes when clocks skew. Use monotonic clocks for durations (<code>CLOCK_MONOTONIC</code>) and never for cross-machine ordering.</p>
<h3>Lamport clocks (sim)</h3><p>Each process keeps counter C. Increment before each event; send C with messages; on receive set C = max(C, msg) + 1. Guarantee: if a → b (happens-before) then C(a) &lt; C(b). The converse doesn’t hold — concurrent events may get ordered arbitrarily. Lamport + process ID gives a total order consistent with causality (useful for mutual exclusion, total-order broadcast).</p>
<h3>Vector clocks</h3><p>Each process keeps a vector of counters, one per process; compare element-wise. V(a) &lt; V(b) iff a → b; incomparable means concurrent → conflict detection (Dynamo-style stores, CRDTs). Cost grows with participants (dotted version vectors, pruning).</p>
<h3>Physical + logical</h3><p><b>Hybrid logical clocks</b> (HLC) combine wall time with a logical counter: close to physical time and causally consistent (CockroachDB, MongoDB). <b>Google TrueTime</b> exposes uncertainty intervals [earliest, latest] from GPS/atomic clocks; Spanner waits out the uncertainty ("commit wait", a few ms) to give external consistency.</p>
<h3>Consistency vocabulary (interview essentials)</h3><ul><li><b>Linearizability</b>: operations appear atomic at a point between invocation and response; real-time order respected. Single-leader consensus systems provide it.</li><li><b>Sequential consistency</b>: some total order consistent with each process’s order (not real time).</li><li><b>Causal consistency</b>: causally related ops seen in order by everyone.</li><li><b>Eventual consistency</b>: replicas converge if writes stop. Session guarantees (read-your-writes, monotonic reads) fix the most visible anomalies.</li><li><b>CAP</b>: during a partition choose consistency or availability. <b>PACELC</b>: Else (no partition) choose latency vs consistency — the more practical framing.</li></ul>`,
poly:R`Devices in a conference room (camera, mic pods, controller) coordinate state over a network with independent clocks — and you’ve probably had to align A/V timestamps (PTP/NTP, media clocks). Use that to motivate why logical vs physical time matters.`,

challenge:{prompt:R`<p>Implement vector clocks in Python for 3 replicas of a key-value store with concurrent puts. On read, return all concurrent "siblings"; implement client-side merge (e.g. set union for a shopping cart). Write tests that create concurrent updates and verify siblings are detected and later merged.</p>`,
hints:['Represent clocks as dicts node→counter.','descends(a,b): all(a.get(k,0) >= v for k,v in b.items()).','On put with context clock, discard stored versions that the new clock descends.'],
solution:R`def descends(a, b): return all(a.get(k, 0) >= v for k, v in b.items())
class Replica:
    def __init__(s, nid): s.id = nid; s.store = {}            # key -> list[(clock, value)]
    def put(s, key, value, ctx):
        clk = dict(ctx); clk[s.id] = clk.get(s.id, 0) + 1
        keep = [(c, v) for c, v in s.store.get(key, []) if not descends(clk, c)]
        s.store[key] = keep + [(clk, value)]; return clk
    def get(s, key):
        vs = s.store.get(key, []); ctx = {}
        for c, _ in vs:
            for k, n in c.items(): ctx[k] = max(ctx.get(k, 0), n)
        return [v for _, v in vs], ctx                     # siblings + merged context`},
interview:[{q:'"How do you order events across services for debugging and for correctness?"',a:'Debugging: distributed tracing with trace/span IDs (causal parent links), not timestamps. Correctness: if you need a total order, route through a single leader/log (Kafka partition, Raft log) or use consensus; if causality suffices, vector clocks/HLC; for external consistency at global scale, TrueTime-like bounded uncertainty. Mention clock skew monitoring and monotonic clocks for timeouts.'}],

{id:'raft',title:'Consensus with Raft: elections, log replication, safety',minutes:40,skills:['consensus','dist-sys','go-rust'],sims:['raft'],
analogy:R`Raft is a <b>club with an elected secretary</b>. Only the secretary writes the minutes; members copy them. If the secretary stops sending "still here" notes, someone waits a random time then calls an election. A decision is final once a majority has copied it into their notebooks.`,
body:R`<h3>Roles and terms (sim: click nodes to kill/revive)</h3><p>Each node is follower, candidate or leader. Time is divided into <b>terms</b> (monotonic integers); each term has at most one leader. Followers expect heartbeats (empty AppendEntries) from the leader; if an <b>election timeout</b> (randomized, e.g. 150–300 ms) passes, a follower increments its term, becomes candidate, votes for itself and sends RequestVote. A node grants at most one vote per term, and only to a candidate whose log is at least as up-to-date (last term, then last index) — the <b>election restriction</b> that guarantees the leader has all committed entries. Randomized timeouts make split votes rare.</p>
<h3>Log replication</h3><p>Clients send commands to the leader, which appends to its log and sends AppendEntries(prevLogIndex, prevLogTerm, entries, leaderCommit). Followers reject if their log doesn’t contain prevLogIndex with prevLogTerm (consistency check); the leader decrements nextIndex and retries, overwriting divergent follower suffixes. An entry is <b>committed</b> once stored on a majority <i>and</i> from the leader’s current term (older-term entries commit indirectly) — the subtle rule shown in Figure 8 of the paper. Committed entries are applied to the state machine in order.</p>
<h3>Safety and liveness</h3><ul><li>Safety needs only majority intersection; never depends on timing. Liveness needs a stable leader: broadcastTime ≪ electionTimeout ≪ MTBF.</li><li>5 nodes tolerate 2 failures; 3 tolerate 1. Even counts add cost without tolerance.</li><li>A partitioned old leader can’t commit (no majority); when it rejoins, it sees a higher term and steps down. Clients may get timeouts for in-flight writes → need idempotent retries.</li><li><b>Linearizable reads</b>: either go through the log, or use ReadIndex (confirm leadership with a heartbeat round) or leases (depend on bounded clock drift).</li></ul>
<h3>Production details</h3><p>Log compaction via snapshots (InstallSnapshot), membership changes (joint consensus or single-server changes), pre-vote (avoid disrupting with term inflation from a flaky node), batching and pipelining AppendEntries, fsync before acknowledging (durability!), and leader transfer for maintenance. Used in etcd (Kubernetes’ brain), Consul, CockroachDB/TiKV (multi-Raft: one group per range), Kafka KRaft.</p>
<h3>Paxos/others</h3><p>Multi-Paxos is equivalent in power; Raft is designed for understandability. Know that consensus is expensive (a majority round trip per commit, ~1 RTT + fsync) — so systems use it for metadata/coordination and shard data across many groups.</p>`,
poly:R`A fleet device management backend (config, feature flags) runs on etcd/ZooKeeper-like stores. And Kubernetes’ every decision flows through etcd’s Raft log — understanding it lets you debug "why did my K8s control plane stall" in cloud-infra interviews.`,
