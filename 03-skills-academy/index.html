<script>/* js/content/m13-design.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'design',num:13,icon:'🏛️',short:'System design (staff)',title:'System Design for Senior/Staff/Principal',tier:'core',
summary:'Interview framework and capacity estimation, queues and backpressure, caching strategy, API design, and the staff-level signals: trade-off articulation, design docs, influence.',
why:'System design (18 Oct roles) and technical leadership (18) are the gatekeepers for staff/principal levels at every company on your list. Coding gets you to the onsite; design and leadership determine the level.',
lessons:[
{id:'estimate',title:'The design interview framework and back-of-envelope math',minutes:30,skills:['sysdesign'],sims:['capacityCalc'],
analogy:R`A design interview is an <b>architect’s first client meeting</b>: you don’t draw the skyscraper immediately. You ask how many people will live there, what the budget is, what must never fail — then sketch, then zoom into the tricky parts (foundations, elevators), and explain what you chose not to build and why.`,
body:R`<h3>A 45-minute framework</h3><ol><li><b>Clarify requirements (5 min)</b>: users and use cases, functional scope (what’s in/out), non-functional: scale, latency SLOs, availability, consistency, durability, cost, security/compliance. Write them down.</li><li><b>Estimate (5 min)</b>: QPS (avg and peak = 2–10× avg), storage growth, bandwidth, memory for hot set, number of machines/GPUs. Round aggressively; state assumptions.</li><li><b>API and data model (5 min)</b>: key endpoints/messages, entities, access patterns → storage choice.</li><li><b>High-level design (10 min)</b>: boxes and arrows covering the main request path(s) end to end.</li><li><b>Deep dives (15 min)</b>: 2–3 hardest parts (often chosen by the interviewer): scaling bottleneck, consistency, failure handling, hot spots.</li><li><b>Wrap up (5 min)</b>: failure modes, monitoring, rollout, evolution, what you’d do with more time.</li></ol>
<h3>Numbers every engineer should know (approx.)</h3><table><tr><th>Operation</th><th>Time</th></tr><tr><td>L1 / L2 / DRAM access</td><td>1 ns / 4 ns / 100 ns</td></tr><tr><td>Compress 1 KB (fast codec)</td><td>~2 µs</td></tr><tr><td>Read 1 MB sequentially from memory</td><td>~10–50 µs</td></tr><tr><td>NVMe random read</td><td>~20–100 µs</td></tr><tr><td>Round trip within datacenter</td><td>~0.5 ms (much less with RDMA)</td></tr><tr><td>Read 1 MB from NVMe / HDD</td><td>~0.3 ms / ~5–10 ms</td></tr><tr><td>Cross-continent RTT</td><td>~70–150 ms</td></tr></table>
<p>Handy conversions: 1 day ≈ 86,400 s ≈ 10^5 s; 1M req/day ≈ 12 req/s; 1 billion/day ≈ 12k/s. A modern server: ~64–192 cores, 256 GB–2 TB RAM, 25–200 Gb/s NIC, ~10k–100k simple HTTP req/s. An H100: 80 GB HBM, ~1 PFLOP dense BF16.</p>
<h3>Worked example (sim)</h3><p>Telemetry: 10M devices × 1 event/10 s = 1M events/s; 500 B each → 500 MB/s ingest → 43 TB/day raw; 3× replication and 30-day retention → ~3.9 PB before compression (maybe 5–10× compression → ~0.5 PB). Partitions: at ~10 MB/s per Kafka partition → 50+ partitions (use 2–4× headroom). The sim lets you vary these and see machine counts.</p>
<h3>What changes at staff/principal</h3><p>Interviewers expect you to drive: proactively identify the hardest problem, quantify trade-offs, discuss operability (deploy, monitor, on-call), cost, migration from current state, team/organizational implications, and to be explicit about what you’d defer. Less breadth-dumping, more judgment.</p>`,
poly:R`Use device-fleet systems as your home turf: you can credibly estimate device telemetry volumes, OTA bandwidth (firmware size × devices / rollout window), and failure rates. Starting a design answer with numbers you’ve lived builds instant credibility.`,
quiz:[
{q:'500M requests/day average QPS?',opts:['~580','~5,800','~58,000','~58'],a:1,exp:'500e6 / 86,400 ≈ 5,787.'},
{q:'Peak is typically estimated as…',opts:['Equal to average','2–10× average depending on diurnal/burst patterns','100× always','Half of average'],a:1,exp:'State your assumption.'},
{q:'1 PB stored with 3× replication needs raw capacity of…',opts:['1 PB','3 PB','0.33 PB','1.5 PB'],a:1,exp:'Erasure coding (e.g. 1.4×) would cut that.'},
{q:'First thing to do when given "Design X"?',opts:['Draw the architecture','Clarify requirements, scale and constraints','Pick a database','Write code'],a:1,exp:'Requirements drive every subsequent choice.'}],
challenge:{prompt:R`<p>Without notes, do 5 estimates in 15 minutes and check later: (1) storage for 1 year of 1080p video from 100k conference rooms recording 2 h/day at 4 Mb/s; (2) GPUs needed to serve 50k tokens/s output of a 70B model at 2,500 tok/s per 8-GPU node; (3) bandwidth to OTA a 400 MB image to 1M devices over 7 days; (4) RAM for an in-memory index of 1B 64-byte keys + 8-byte values with 1.5× overhead; (5) Kafka partitions for 2 GB/s ingest.</p>`,
hints:['(1) 4 Mb/s = 0.5 MB/s; × 7,200 s × 100k × 365.','(3) 400 MB × 1M = 400 TB over 604,800 s.','(4) 72 B × 1B × 1.5.'],
solution:R`<p>(1) 0.5 MB/s × 7,200 s = 3.6 GB/room/day × 100k = 360 TB/day × 365 ≈ 131 PB/year (→ tiered storage, retention policies). (2) 50,000 / 2,500 = 20 nodes = 160 GPUs + headroom (~30%) ≈ 26 nodes. (3) 400 TB / 604,800 s ≈ 660 MB/s ≈ 5.3 Gb/s average (CDN + peak factor). (4) 72 GB × 1.5 = 108 GB → a few large-memory nodes or sharded. (5) 2 GB/s / 10 MB/s ≈ 200 partitions (+ headroom → 300–400).</p>`},
interview:[{q:'"What distinguishes a staff-level design answer from a senior one?"',a:'Staff: frames the problem and success metrics, finds the crux early, quantifies, compares 2–3 options with explicit trade-offs and a reasoned decision, covers operability/migration/cost, anticipates organizational impact and sequencing (MVP → scale), and communicates crisply while inviting challenge. Senior: solid component knowledge and a working design, less emphasis on strategy and trade-off framing.'}],
resources:[['donnemartin/system-design-primer','https://github.com/donnemartin/system-design-primer'],['Designing Data-Intensive Applications','https://dataintensive.net/'],['InterviewReady (system design course)','https://interviewready.io/'],['Jeff Dean: Numbers everyone should know (via Peter Norvig’s essay)','https://norvig.com/21-days.html#answers']]},
{id:'queues',title:'Queues, backpressure and flow control',minutes:30,skills:['sysdesign','dist-sys','concurrency'],sims:['backpressure'],
analogy:R`A queue is a <b>waiting room</b>. A small one turns people away when full (backpressure) — annoying but honest. An infinite waiting room accepts everyone and lets them wait hours; by the time they’re seen, they’ve already left (timed out), and the doctor is treating ghosts.`,
body:R`<h3>Why queues</h3><p>Decouple producers and consumers, absorb bursts, enable async processing and retries, smooth load. But queues hide overload: when arrival rate λ exceeds service rate μ, queue length grows without bound, latency grows linearly with time, and memory eventually runs out.</p>
<h3>Backpressure strategies (sim)</h3><ul><li><b>Bounded queues + block</b> producer (in-process: blocking queue; TCP: receive window; gRPC/HTTP2 flow control windows; Reactive Streams demand signaling).</li><li><b>Drop</b> with policy: tail drop, drop oldest (fresh data matters more — sensor/video), priority-based shedding, random early detection.</li><li><b>Reject early</b> (HTTP 429/503 with Retry-After) — cheapest failure; clients back off.</li><li><b>Scale consumers</b> (autoscaling on queue depth/age), but scaling has lag; still need limits.</li><li><b>Rate limit</b> producers (token bucket per tenant).</li></ul>
<h3>Queueing theory nuggets</h3><p>Little’s law L = λW. Utilization ρ = λ/μ; M/M/1 mean wait ∝ ρ/(1−ρ) → keep ρ ≤ 0.7–0.8 for latency-sensitive systems. Variance hurts: bursty arrivals or variable service times inflate queues (Kingman’s formula). Multiple servers sharing one queue (M/M/c) beat separate queues per server (why supermarkets moved to single-line).</p>
<h3>Durable message queues/logs</h3><p>Kafka (partitioned log, consumer groups, ordering per partition, retention, replay), RabbitMQ/SQS (per-message ack, visibility timeouts, DLQs), Pub/Sub. Semantics: at-most-once, at-least-once (+ idempotent consumers), exactly-once within a system (Kafka transactions). Pitfalls: consumer lag monitoring, poison messages (DLQ), hot partitions (bad keys), rebalancing storms, ordering vs parallelism trade-off.</p>
<h3>Queue age over length</h3><p>Monitor and shed by <b>age of oldest message</b> — a 10k-deep queue might be 1 s or 1 h old depending on throughput. For interactive systems, drop requests whose deadline has passed before processing them (CoDel-style "controlled delay" for RPC queues).</p>`,
poly:R`Video pipelines already do principled backpressure: drop oldest frames when the encoder falls behind rather than building latency. Present that as "freshness-first shedding policy" and contrast with a payments queue where nothing may be dropped (at-least-once + idempotency).`,
quiz:[
{q:'Producers at 1,100 msg/s, consumers at 1,000 msg/s, unbounded queue. After 1 hour?',opts:['Stable','~360,000 message backlog and growing; latency ~6 min and rising','Empty','Consumers speed up'],a:1,exp:'100/s × 3,600 s; wait time = backlog / μ = 360 s.'},
{q:'For a real-time video pipeline under overload, best drop policy?',opts:['Drop newest','Drop oldest (keep freshest frames)','Block camera','Unbounded buffer'],a:1,exp:'Old frames are worthless for live use.'},
{q:'Why alert on queue age rather than length?',opts:['Easier','Age directly reflects user-visible delay regardless of throughput','Length is unknown','Required by Kafka'],a:1,exp:'Length must be divided by throughput to mean anything.'},
{q:'Kafka guarantees ordering…',opts:['Globally','Within a partition','Never','Per consumer group only'],a:1,exp:'Choose partition keys to preserve the order you need.'}],
challenge:{prompt:R`<p>Build a pipeline in Go or Python: producer (bursty, 2× capacity for 10 s every minute) → bounded queue → worker pool → sink. Implement and compare: blocking producer, drop-oldest, reject with 429 + client backoff, and CoDel-style deadline shedding. Plot queue length, age, throughput and p99 latency over time.</p>`,
hints:['Python asyncio.Queue(maxsize=N); drop-oldest: if full, get_nowait() then put_nowait().','Deadline shedding: attach enqueue time; worker skips items older than deadline.','Measure latency from creation to completion; count drops separately.'],
solution:R`<p>Expected: blocking pushes latency back into producers (good for batch, bad for interactive); drop-oldest keeps latency bounded with data loss during bursts; 429 + backoff spreads load and keeps server healthy; deadline shedding keeps goodput high because no work is wasted on already-expired requests. Recommend per-use-case policies.</p>`},
interview:[{q:'"How do you design a system to survive 10× traffic spikes?"',a:'Admission control and rate limiting at the edge (per tenant), bounded queues with shedding policies by priority/deadline, autoscaling with buffers (and pre-scaling for known events), graceful degradation (disable expensive features, serve cached/stale), async processing for non-critical paths, capacity headroom, load testing to find breaking points, and observability on queue age/shed rates. Avoid retry amplification (budgets).'}],
resources:[['Google SRE book: Handling Overload','https://sre.google/sre-book/handling-overload/'],['Controlling Queue Delay (CoDel, ACM Queue)','https://queue.acm.org/detail.cfm?id=2209336'],['Apache Kafka documentation','https://kafka.apache.org/documentation/']]},
{id:'caching',title:'Caching strategies and consistency',minutes:30,skills:['sysdesign','storage-data','dist-sys'],sims:['cacheAside'],
analogy:R`A cache is a <b>sticky note on your monitor</b> with a phone number you look up often. Great until the number changes and you keep dialing the old one (staleness), or until everyone in the office loses their sticky notes at once and floods the directory (stampede).`,
body:R`<h3>Patterns (sim)</h3><ul><li><b>Cache-aside</b> (lazy loading): read cache → miss → read DB → populate. Writes go to DB then <b>delete</b> the cache key (not update — avoids races where an older value overwrites a newer one).</li><li><b>Read-through / write-through</b>: cache library loads/writes DB synchronously; consistent but adds write latency.</li><li><b>Write-back</b> (write-behind): write to cache, flush later — fast, risk of loss.</li><li><b>Refresh-ahead</b>: proactively refresh hot keys before TTL expires.</li></ul>
<h3>Hard problems</h3><ul><li><b>Invalidation races</b>: reader misses, reads old DB value; writer updates DB and deletes cache; reader then sets stale value → stale until TTL. Mitigations: leases (memcache at Facebook: token from cache on miss, set only valid with token, deletes invalidate tokens), versioned values, short TTLs, CDC-driven invalidation (tail the DB binlog).</li><li><b>Stampede/thundering herd</b>: hot key expires → thousands of concurrent misses hit DB. Fix: request coalescing (singleflight), lease/lock on miss, probabilistic early expiration (XFetch), serve stale while revalidating.</li><li><b>Hot keys</b>: replicate across nodes, local in-process L1 caches, key splitting.</li><li><b>Cold start/failover</b>: losing a cache tier can overload the DB (metastable failure!) → warm-up procedures, gutter pools.</li><li><b>Eviction</b>: LRU, LFU, ARC, TinyLFU (W-TinyLFU in Caffeine: excellent hit rates), TTL; size cache by working-set curve (hit rate vs size).</li></ul>
<h3>Layers of caching</h3><p>CPU caches → in-process (Caffeine, LRU map) → distributed (Redis/Memcached) → CDN/edge → client/browser. Also: KV cache in LLM serving (Module 6), page cache in kernels, DNS caches. The same principles everywhere: locality, consistency, invalidation, eviction.</p>
<h3>Numbers</h3><p>Redis: ~100k–1M ops/s per node, sub-ms latency. With 99% hit rate, DB load is 1% of reads; dropping to 95% is a 5× DB load increase — hit-rate regressions are capacity incidents.</p>`,
poly:R`Firmware and media caches on devices (decoded assets, DNS, provisioning config) and CDN-served OTA images are caching problems you know. The interview twist is consistency and stampedes — mention a time a fleet’s synchronized TTL expiry hammered a backend if it happened.`,
quiz:[
{q:'In cache-aside, after updating the DB you should usually…',opts:['Update the cache with the new value','Delete the cache key (invalidate)','Do nothing','Flush the whole cache'],a:1,exp:'Deleting avoids races where concurrent writers set values out of order.'},
{q:'Hit rate drops from 99% to 98%. DB read load…',opts:['+1%','Doubles (1% → 2% of reads)','Halves','Unchanged'],a:1,exp:'Miss rate doubled.'},
{q:'Best defense against a hot key expiry stampede?',opts:['Longer TTL only','Request coalescing / lease so one request refills while others wait or get stale data','More DB replicas only','Disable cache'],a:1,exp:'Singleflight or serve-stale-while-revalidate.'},
{q:'Facebook’s memcache leases address…',opts:['Encryption','Stale sets and thundering herds','Hashing','Replication'],a:1,exp:'A lease token gates who may populate a missed key.'}],
challenge:{prompt:R`<p>Implement a cache-aside layer in Go or Python in front of a slow "DB" (sleep 20 ms). Add: singleflight coalescing, TTL with jitter, probabilistic early refresh (XFetch), and lease-based invalidation. Load test with a Zipf key distribution and a periodic writer; measure DB QPS, hit rate, staleness incidents (reads returning a value older than the latest write by &gt;1 s).</p>`,
hints:['Singleflight: map key → future; first miss creates future, others await it.','XFetch: refresh early if now − delta·beta·log(rand()) ≥ expiry.','Lease: on miss, cache returns token; set(key, val, token) succeeds only if token still valid (delete invalidates).'],
solution:R`async def get(key):
    v = cache.get(key)
    if v and not should_early_refresh(v): return v.value
    if key in inflight: return await inflight[key]           # coalesce
    fut = inflight[key] = asyncio.get_running_loop().create_future()
    try:
        token = cache.lease(key)
        val = await db.read(key)
        cache.set_if_lease(key, val, token, ttl=TTL * random.uniform(0.9, 1.1))
        fut.set_result(val); return val
    finally:
        inflight.pop(key, None)`},
interview:[{q:'"Design caching for a product catalog with 100M items and frequent price updates."',a:'Multi-layer: CDN for static content, regional Redis for item data with cache-aside, in-process L1 for top items; prices change often → short TTL or CDC-driven invalidation from DB binlog; versioned keys to avoid stale overwrites; stampede protection; size by working set (top 5% items get 80% traffic); monitor hit rate and staleness; failure plan for cache loss (warmup, rate limiting to DB). Discuss consistency requirement: price at checkout must be read from source of truth.'}],
resources:[['Scaling Memcache at Facebook (NSDI 2013)','https://www.usenix.org/conference/nsdi13/technical-sessions/presentation/nishtala'],['AWS: Caching best practices','https://aws.amazon.com/caching/best-practices/'],['Optimal Probabilistic Cache Stampede Prevention (VLDB 2015)','https://www.vldb.org/pvldb/vol8/p886-vattani.pdf']]},
{id:'staff',title:'Staff signals: trade-offs, design docs, influence',minutes:30,skills:['leadership','sysdesign','customer-facing'],sims:['decisionMatrix'],
analogy:R`A staff engineer is a <b>ship’s navigator</b>, not the fastest rower. They read the weather (business context), chart options with risks, convince the captain and crew, and keep adjusting course — their output is mostly better decisions by many people.`,
body:R`<h3>What staff/principal interviews evaluate</h3><ul><li><b>Scope</b>: problems spanning multiple teams/quarters; ambiguous starting points.</li><li><b>Technical judgment</b>: picking the right problem, simplest robust solution, explicit trade-offs, knowing when to build vs buy vs defer.</li><li><b>Influence without authority</b>: aligning teams, resolving disagreements with data, writing.</li><li><b>Raising the bar</b>: mentoring, standards, reviews, incident culture.</li><li><b>Execution</b>: delivering in increments, de-risking early, managing dependencies.</li></ul>
<h3>Trade-off articulation (sim)</h3><p>Use a decision matrix: options × weighted criteria (latency, cost, operability, time-to-market, risk, team expertise, reversibility). The value isn’t the number — it’s making criteria and weights explicit so stakeholders can disagree productively. Distinguish one-way doors (hard to reverse: data models, public APIs, vendor lock-in) from two-way doors (feature flags, internal APIs) and move fast on the latter.</p>
<h3>Design docs</h3><p>Structure: context and problem, goals/non-goals, requirements, proposed design, alternatives considered (with why not), trade-offs, risks and mitigations, rollout/migration, testing, observability, security/privacy, cost, open questions. Keep it short enough to be read; get early feedback from skeptics; record decisions (ADRs).</p>
<h3>Behavioral stories (STAR + impact)</h3><p>Prepare 6–8 stories: technical leadership across teams, a hard bug/incident, a disagreement you resolved, a failure and what you changed, mentoring/raising others, a strategic bet (proposing work nobody asked for), customer impact. Quantify (latency −40%, field failures −60%, saved N engineer-months). Make "I" vs "we" clear.</p>
<h3>Staff archetypes</h3><p>Tech lead, architect, solver, right hand (Will Larson, Staff Engineer). Know which you are (likely "solver" for deep bring-up/perf problems + "tech lead" for driver platforms) and pick stories accordingly.</p>`,
poly:R`Your multi-vendor driver work (NXP, Qualcomm, Ambarella, Lontium) is inherently cross-team and cross-company: vendor escalations, aligning firmware/app teams, choosing platforms. Turn one platform transition (e.g. choosing/bringing up CV7) into a staff story: context, options, trade-offs, decision, execution, results, lessons.`,
quiz:[
{q:'Which is a one-way door?',opts:['Feature flag rollout','Public API/data format used by external customers','Internal config value','A/B experiment'],a:1,exp:'Hard to reverse once others depend on it.'},
{q:'The most important section of a design doc to show judgment?',opts:['Diagrams','Alternatives considered with reasons and trade-offs','Glossary','Timeline only'],a:1,exp:'Shows you explored the space and chose deliberately.'},
{q:'In a behavioral answer, staff-level impact is best shown by…',opts:['Listing technologies','Quantified outcomes across teams and how you influenced decisions','Hours worked','Lines of code'],a:1,exp:'Scope + influence + measurable results.'},
{q:'Two senior engineers disagree strongly about an architecture. Staff move?',opts:['Pick the louder one','Make criteria explicit, gather data (prototype/benchmark), time-box, decide and document; disagree-and-commit','Escalate immediately','Avoid the topic'],a:1,exp:'Structure the disagreement around evidence.'}],
challenge:{prompt:R`<p>Write a 2-page design doc for a real problem from your Poly work (sanitized): e.g. "Unified camera HAL across Qualcomm and Ambarella platforms". Include goals/non-goals, three alternatives with a decision matrix, rollout plan and metrics. Then write 6 STAR stories (≤200 words each) with quantified impact. Ask a peer to grill you.</p>`,
hints:['Non-goals are where scope discipline shows.','Alternatives: build a thin abstraction, adopt libcamera, keep vendor stacks separate with shared test suite.','Each STAR story: one sentence situation, one task, 3–4 actions (with "I"), quantified result, lesson.'],
solution:R`<p>A strong doc: crisp problem statement with cost of status quo (duplicate effort, bugs per platform), explicit criteria (time-to-bring-up next SoC, performance overhead, vendor support burden, team skills), a recommendation with risks (vendor feature gaps) and mitigations (escape hatches), phased migration (one product first), success metrics (bring-up time −50%, shared test coverage). Stories cover: bring-up crisis, perf win, cross-team alignment, mentoring, failure, customer escalation.</p>`},
interview:[{q:'"Tell me about a time you influenced a technical direction across multiple teams."',a:'Structure: context (problem and why it mattered to the business), your insight (data you gathered), options and trade-offs, how you built alignment (design doc, prototypes, 1:1s with skeptics, addressing concerns), the decision, execution with others, measurable outcomes, and what you learned. Emphasize influence without authority and durable change (standards, tools) beyond the project.'}],
resources:[['StaffEng (Will Larson)','https://staffeng.com/'],['Design Docs at Google (Malte Ubl)','https://www.industrialempathy.com/posts/design-docs-at-google/'],['The Staff Engineer’s Path (Tanya Reilly, O’Reilly)','https://www.oreilly.com/library/view/the-staff-engineers/9781098118723/']]}
]});
})();

</script>
<script>/* js/content/m14-coding.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'coding',num:14,icon:'⌨️',short:'Interview coding',title:'Interview Coding: Patterns in C++',tier:'core',
summary:'Two pointers and sliding window, graph traversal and topological sort, heaps and top-k, bit manipulation — plus a no-AI practice protocol. Pair with the Interview Gym.',
why:'Every company still runs coding rounds, even for principal roles (often systems-flavored: LRU cache, ring buffer, rate limiter, parsing). You asked to practice without AI during attempts — this module teaches the patterns; the Gym drills them under a timer.',
lessons:[
{id:'window',title:'Two pointers and sliding window',minutes:30,skills:['dsa'],sims:['slidingWindow'],
analogy:R`A sliding window is a <b>caterpillar crawling along a branch</b>: the head stretches forward to grab more (expand right), and when it’s holding too much, the tail scrunches up (shrink left). It never goes backwards, so the whole trip is linear.`,
body:R`<h3>When to reach for it</h3><p>Contiguous subarray/substring problems with a monotone condition: "longest substring with at most K distinct chars", "smallest subarray with sum ≥ S", "max sum of size-k window", "minimum window containing all chars of T". Each index enters and leaves the window at most once → O(n).</p>
<h3>Template (variable window)</h3><pre>int longestAtMostK(const std::string&amp; s, int k) {
  std::array&lt;int, 256&gt; cnt{}; int distinct = 0, best = 0;
  for (int l = 0, r = 0; r &lt; (int)s.size(); ++r) {
    if (cnt[(unsigned char)s[r]]++ == 0) ++distinct;      // expand
    while (distinct &gt; k)                                  // shrink until valid
      if (--cnt[(unsigned char)s[l++]] == 0) --distinct;
    best = std::max(best, r - l + 1);                     // window valid here
  }
  return best;
}</pre>
<h3>Two pointers variants</h3><ul><li>Opposite ends on sorted arrays: two-sum sorted, container with most water, 3-sum (sort + two pointers, O(n²)).</li><li>Fast/slow: cycle detection (Floyd), middle of linked list, remove duplicates in place.</li><li>Merge-style: merging sorted arrays/intervals.</li></ul>
<h3>Pitfalls</h3><p>Windows with negative numbers break the monotone property ("sum ≥ S" with negatives → use prefix sums + monotonic deque or hash map). Off-by-one on window length (r − l + 1). Using std::unordered_map where a fixed array suffices (slower). Exactly-K problems: atMost(K) − atMost(K−1).</p>
<h3>Monotonic deque</h3><p>Sliding window maximum in O(n): keep indices in a deque with decreasing values; pop back while smaller than the new element; pop front when it leaves the window. Systems flavor: rolling max latency over the last N samples, rate limiters with sliding logs.</p>
<h3>No-AI practice protocol</h3><ol><li>Read problem, restate, write 2–3 examples including edge cases (2 min).</li><li>Brute force first, state complexity, then optimize (5 min).</li><li>Code cleanly in a plain editor with a timer (15–20 min), talk aloud.</li><li>Test by hand with your examples; then compile and run.</li><li>Only after: compare with reference, log the pattern and your mistake in a journal. Re-solve in 3 days and 2 weeks (spaced repetition).</li></ol>`,
poly:R`Sliding windows appear in your world as moving averages for AE/AWB, rolling bitrate estimation, jitter buffers, and rate limiting of log messages. When an interviewer asks a window problem, a one-line real-world tie-in shows depth.`,
quiz:[
{q:'Time complexity of the variable sliding window template?',opts:['O(n²)','O(n) — each index enters and leaves once','O(n log n)','O(k·n)'],a:1,exp:'Amortized: l and r each move at most n times.'},
{q:'"Smallest subarray with sum ≥ S" where elements can be negative. Plain sliding window works?',opts:['Yes','No — shrinking no longer monotonically reduces the sum; use prefix sums + monotonic deque'],a:1,exp:'Monotonicity is the precondition.'},
{q:'Predict the output:',code:R`std::string s = "eceba"; // longestAtMostK(s, 2)`,opts:['2','3','4','5'],a:1,exp:'"ece" has length 3 with 2 distinct characters.'},

challenge:{prompt:R`<p>Solve without AI, timer on (25 min each): (1) Minimum Window Substring; (2) Sliding Window Maximum with a deque; (3) Longest Repeating Character Replacement. Write C++ with tests for empty input, all-same characters, and k=0. Log time taken and bugs found in your journal.</p>`,
hints:['(1) Track "need" counts and a "missing" counter; shrink while missing == 0.','(2) Deque of indices with decreasing values; front is the max.','(3) Window valid if (len − maxFreq) ≤ k; maxFreq doesn’t need to decrease when shrinking (still correct).'],
solution:R`std::string minWindow(const std::string& s, const std::string& t) {
  std::array<int,128> need{}; for (char c : t) ++need[c];
  int missing = t.size(), bestL = 0, bestLen = INT_MAX;
  for (int l = 0, r = 0; r < (int)s.size(); ++r) {
    if (need[s[r]]-- > 0) --missing;
    while (missing == 0) {
      if (r - l + 1 < bestLen) { bestLen = r - l + 1; bestL = l; }
      if (++need[s[l++]] > 0) ++missing;
    }
  }
  return bestLen == INT_MAX ? "" : s.substr(bestL, bestLen);
}`},
interview:[{q:'"How do you approach a coding problem you haven’t seen before?"',a:'Clarify inputs/outputs/constraints (n size tells you target complexity: 1e5 → O(n log n)), work examples, identify the pattern (contiguous → window/prefix sums; ordering → sort/heap; relationships → graph), state brute force and its complexity, optimize, then code with clear names and invariants, test edge cases out loud, and discuss trade-offs. Communication matters as much as the final code.'}],

{id:'graphs',title:'Graphs: BFS, DFS, topological sort, Dijkstra',minutes:35,skills:['dsa'],sims:['graphTraversal'],
analogy:R`BFS is <b>ripples in a pond</b> — explores everything 1 step away, then 2 steps — so it finds shortest paths in unweighted graphs. DFS is <b>exploring a cave with a ball of string</b> — go as deep as possible, backtrack when stuck — perfect for cycles, components and orderings.`,
body:R`<h3>Representations</h3><p>Adjacency list (<code>std::vector&lt;std::vector&lt;int&gt;&gt;</code>) for sparse graphs (O(V+E) memory); matrix for dense or tiny. Grids are implicit graphs (4/8 neighbors) — no need to build adjacency lists.</p>
<h3>BFS (sim)</h3><pre>std::vector&lt;int&gt; bfs(const std::vector&lt;std::vector&lt;int&gt;&gt;&amp; g, int src) {
  std::vector&lt;int&gt; dist(g.size(), -1); std::queue&lt;int&gt; q;
  dist[src] = 0; q.push(src);
  while (!q.empty()) {
    int u = q.front(); q.pop();
    for (int v : g[u]) if (dist[v] &lt; 0) { dist[v] = dist[u] + 1; q.push(v); }  // mark on push!
  }
  return dist;
}</pre><p>Mark visited when pushing, not when popping (otherwise nodes enter the queue multiple times). Multi-source BFS (rotting oranges, distance to nearest gateway) starts with all sources in the queue. 0-1 BFS with a deque handles 0/1 weights.</p>
<h3>DFS and cycles</h3><p>Recursive DFS risks stack overflow on deep graphs (10^5+ nodes) — use an explicit stack in production/C++ interviews. Cycle detection in directed graphs uses three colors (white/gray/black): an edge to a gray node is a back edge → cycle.</p>
<h3>Topological sort</h3><p>Kahn’s algorithm: compute in-degrees, queue nodes with 0, pop and decrement neighbors; if output size &lt; V there is a cycle. Systems applications: build systems (Bazel/Make), package dependency resolution, CUDA graph scheduling (Module 5!), service startup order (systemd), course schedules.</p>
<h3>Shortest paths</h3><ul><li><b>Dijkstra</b> (non-negative weights): min-heap of (dist, node), skip stale entries; O((V+E) log V).</li><li>Bellman-Ford (negative edges, O(VE)), Floyd-Warshall (all pairs, O(V³)), A* (heuristic).</li></ul>
<h3>Union-Find</h3><p>Disjoint sets with path compression + union by rank: near-O(1) connectivity queries; Kruskal’s MST, number of islands (offline), redundant connection.</p>`,
poly:R`Device trees are graphs; driver probe ordering with deferred probing is effectively a topological sort over dependencies (fw_devlink). Mention that when you solve course-schedule problems — it shows you see algorithms in systems.`,

{q:'Shortest path in an unweighted graph?',opts:['DFS','BFS','Dijkstra required','Topological sort'],a:1,exp:'BFS explores in order of distance.'},
{q:'Kahn’s algorithm outputs fewer nodes than V. Meaning?',opts:['Bug','The graph has a cycle','Disconnected graph','Undirected graph'],a:1,exp:'Nodes in cycles never reach in-degree 0.'},
{q:'Dijkstra fails with…',opts:['Undirected graphs','Negative edge weights','Large graphs','Cycles'],a:1,exp:'Greedy finalization assumes non-negative weights.'},
{q:'Predict:',code:R`// BFS that marks visited when POPPING instead of when pushing

challenge:{prompt:R`<p>Timer on, no AI: (1) Course Schedule II (topological order or empty if cycle); (2) Network Delay Time (Dijkstra); (3) Number of Islands with BFS and then Union-Find; (4) Word Ladder (BFS on implicit graph). C++ with tests.</p>`,
hints:['(1) Kahn with in-degree vector; return order if size == n.','(2) priority_queue<pair<int,int>, vector<...>, greater<...>>; skip if d > dist[u].','(4) Generate neighbors by changing each letter a–z and checking a hash set; erase words when visited.'],
solution:R`int networkDelay(std::vector<std::vector<int>>& times, int n, int k) {
  std::vector<std::vector<std::pair<int,int>>> g(n + 1);
  for (auto& t : times) g[t[0]].push_back({t[1], t[2]});
  std::vector<int> dist(n + 1, INT_MAX); dist[k] = 0;
  std::priority_queue<std::pair<int,int>, std::vector<std::pair<int,int>>, std::greater<>> pq;
  pq.push({0, k});
  while (!pq.empty()) {
    auto [d, u] = pq.top(); pq.pop();
    if (d > dist[u]) continue;                       // stale entry
    for (auto [v, w] : g[u]) if (d + w < dist[v]) { dist[v] = d + w; pq.push({dist[v], v}); }
  }
  int ans = *std::max_element(dist.begin() + 1, dist.end());
  return ans == INT_MAX ? -1 : ans;
}`},
interview:[{q:'"Detect a deadlock among N threads given lock wait information."',a:'Build a wait-for graph (thread → thread holding the lock it waits on); a cycle means deadlock; detect with DFS three-color or Kahn; report the cycle path. Discuss online detection (incremental), cost, and that lockdep does a static-order variant (lock classes graph). Ties graphs to systems.'}],

{id:'heaps',title:'Heaps, top-k and scheduling problems',minutes:30,skills:['dsa'],sims:['heapViz'],
analogy:R`A heap is a <b>tournament bracket</b>: every match winner moves up, so the champion (min or max) sits at the top. Adding a player or removing the champion only replays the matches along one path — log n games, not a whole new tournament.`,
body:R`<h3>Mechanics (sim)</h3><p>Binary heap in an array: children of i at 2i+1, 2i+2; parent (i−1)/2. Push: append + sift up (O(log n)). Pop: move last to root + sift down (O(log n)). Heapify an array: O(n) bottom-up (not O(n log n)). C++: <code>std::priority_queue</code> is a max-heap by default; use <code>std::greater&lt;&gt;</code> for min-heap; no decrease-key → push duplicates and skip stale entries (lazy deletion).</p>
<h3>Patterns</h3><ul><li><b>Top-k largest</b>: maintain a min-heap of size k; push each element, pop if size &gt; k → O(n log k), O(k) memory — works on streams. Alternative: <code>std::nth_element</code> (quickselect) O(n) average when all data is in memory.</li><li><b>K-way merge</b>: heap of (value, list index) — merging sorted runs (external sort, LSM compaction, merging log streams by timestamp).</li><li><b>Two heaps</b>: running median (max-heap low half, min-heap high half).</li><li><b>Scheduling/intervals</b>: meeting rooms II (min-heap of end times), task scheduler with cooldown, CPU scheduling simulations, timers (timer wheels vs heaps — kernels use hierarchical timer wheels for O(1)).</li></ul>
<h3>Systems connections</h3><p>Event-driven simulators (the discrete-event sims in this academy) use heaps of next-event times; Dijkstra; Linux CFS used a red-black tree keyed by vruntime (EEVDF now) — like a heap but supports arbitrary removal; heavy hitters in telemetry (top-k talkers) use count-min sketch + heap for streaming.</p>
<h3>Complexity cheat sheet</h3><table><tr><th>Approach</th><th>Time</th><th>Memory</th></tr><tr><td>Sort then take k</td><td>O(n log n)</td><td>O(n)</td></tr><tr><td>Min-heap size k</td><td>O(n log k)</td><td>O(k)</td></tr><tr><td>Quickselect</td><td>O(n) avg, O(n²) worst</td><td>O(1) extra</td></tr><tr><td>Bucket sort by frequency</td><td>O(n)</td><td>O(n)</td></tr></table>`,
poly:R`Scheduling multiple camera/encoder jobs by deadline is an earliest-deadline-first heap; timer management in your drivers (hrtimers use a red-black tree) is the kernel version. Use these as you talk through solutions.`,
quiz:[
{q:'Top-10 most frequent IPs from a 1B-line log streamed once. Best?',opts:['Sort all','Hash map counts + min-heap of size 10 (or count-min sketch + heap if memory constrained)','Max-heap of all','BFS'],a:1,exp:'O(n log k) with bounded heap.'},
{q:'Complexity of building a heap from n unsorted elements with bottom-up heapify?',opts:['O(n log n)','O(n)','O(log n)','O(n²)'],a:1,exp:'Most nodes are near the leaves and sift down little.'},
{q:'std::priority_queue<int> by default is…',opts:['Min-heap','Max-heap','Sorted vector','FIFO'],a:1,exp:'Use std::greater<int> for min-heap.'},
{q:'Meeting rooms II (min rooms needed) uses a min-heap of…',opts:['Start times','End times of ongoing meetings','Durations','Room IDs'],a:1,exp:'Pop rooms that freed before the next start.'}],
challenge:{prompt:R`<p>Timer on: (1) Top K Frequent Elements (heap and bucket versions); (2) Merge K Sorted Lists; (3) Find Median from Data Stream; (4) Task Scheduler. Then implement your own binary heap template with push/pop/top and a decrease-key using an index map (useful for Dijkstra/LRU-ish schedulers).</p>`,
hints:['Median: keep sizes balanced (|lo| == |hi| or |lo| == |hi|+1).','Decrease-key: maintain pos[id] updated on every swap.','Task scheduler: answer = max(n_tasks, (maxFreq−1)·(cooldown+1) + countOfMaxFreq).'],
solution:R`class MedianFinder {
  std::priority_queue<int> lo;                                   // max-heap
  std::priority_queue<int, std::vector<int>, std::greater<>> hi; // min-heap
public:
  void addNum(int x) {
    lo.push(x); hi.push(lo.top()); lo.pop();
    if (hi.size() > lo.size()) { lo.push(hi.top()); hi.pop(); }
  }
  double findMedian() const { return lo.size() > hi.size() ? lo.top() : (lo.top() + (double)hi.top()) / 2; }
};`},
interview:[{q:'"Design a timer facility for 1M concurrent timeouts (e.g. connection idle timers)."',a:'Options: binary heap O(log n) per insert/cancel (needs index for cancel), hierarchical timing wheel O(1) insert/cancel with coarse granularity (Linux timer wheel, Kafka purgatory, Netty HashedWheelTimer), or red-black tree for high resolution (hrtimers). Choose by precision needs, cancel rate (most idle timers are cancelled before firing → wheel wins), and memory. Discuss batching expirations and clock source.'}],

{id:'bits',title:'Bit manipulation for systems interviews',minutes:25,skills:['dsa','cpp'],sims:['bitPlayground'],
analogy:R`Bits are <b>a row of light switches</b>. Masks are stencils you lay over the row: AND keeps only the switches under the holes, OR flips selected ones on, XOR toggles them, and shifts slide the whole row left or right.`,
body:R`<h3>Essential idioms (sim)</h3><table><tr><th>Goal</th><th>Expression</th></tr><tr><td>Test bit k</td><td><code>(x &gt;&gt; k) &amp; 1</code></td></tr><tr><td>Set / clear / toggle bit k</td><td><code>x | (1u&lt;&lt;k)</code>, <code>x &amp; ~(1u&lt;&lt;k)</code>, <code>x ^ (1u&lt;&lt;k)</code></td></tr><tr><td>Lowest set bit</td><td><code>x &amp; -x</code></td></tr><tr><td>Clear lowest set bit</td><td><code>x &amp; (x - 1)</code></td></tr><tr><td>Power of two?</td><td><code>x &amp;&amp; !(x &amp; (x - 1))</code></td></tr><tr><td>Popcount / leading / trailing zeros</td><td><code>std::popcount</code>, <code>std::countl_zero</code>, <code>std::countr_zero</code> (C++20 &lt;bit&gt;)</td></tr><tr><td>Round up to multiple of power-of-two A</td><td><code>(x + A - 1) &amp; ~(A - 1)</code></td></tr><tr><td>Extract field bits [hi:lo]</td><td><code>(x &gt;&gt; lo) &amp; ((1u &lt;&lt; (hi - lo + 1)) - 1)</code></td></tr></table>
<h3>Gotchas (the senior-level part)</h3><ul><li>Shifting by ≥ width or shifting negative signed values is <b>UB</b> (Module 1); use unsigned types (<code>uint32_t</code>) for bit work; <code>1 &lt;&lt; 31</code> on int is UB pre-C++20 — write <code>1u &lt;&lt; 31</code>.</li><li>Right-shifting signed negative numbers is implementation-defined before C++20 (arithmetic in practice).</li><li>Integer promotion: <code>uint8_t</code> operands promote to int: <code>~b</code> on uint8_t gives a negative int.</li><li>Endianness: bit layout in registers vs byte order in memory/network (<code>htonl</code>, <code>std::byteswap</code> C++23); bit-fields have implementation-defined layout — don’t use them for hardware registers or wire formats; use masks and shifts.</li></ul>
<h3>Classic problems</h3><p>Single number (XOR all), counting bits DP (<code>bits[i] = bits[i &gt;&gt; 1] + (i &amp; 1)</code>), reverse bits, subsets via bitmask enumeration (<code>for (s = mask; s; s = (s - 1) &amp; mask)</code>), Gray code, bitboards, bitmap allocators (find first zero bit), Bloom filters (k hash functions into a bit array).</p>
<h3>Register manipulation (drivers)</h3><pre>#define CTRL_EN      BIT(0)
#define CTRL_MODE    GENMASK(5, 4)
u32 v = readl(base + CTRL);
v &amp;= ~CTRL_MODE;
v |= FIELD_PREP(CTRL_MODE, 2) | CTRL_EN;   // read-modify-write
writel(v, base + CTRL);                     // beware: RMW on shared registers needs locking</pre>`,
poly:R`You do this daily: register fields, GENMASK/FIELD_PREP, endianness of I²C register maps on Lontium chips. In interviews, mention the RMW race on shared registers and W1C (write-1-to-clear) status registers — instant credibility.`,
quiz:[
{q:'Predict:',code:R`uint32_t x = 0b10110000;
uint32_t y = x & (x - 1);   // ?`,opts:['0b10100000','0b10110001','0b00010000','0b10101111'],a:0,exp:'Clears the lowest set bit (bit 4).'},
{q:'Predict:',code:R`uint8_t b = 0x0F;
auto r = ~b;   // type and value?`,opts:['uint8_t 0xF0','int -16 (0xFFFFFFF0) due to integer promotion','uint8_t 0x0F','UB'],a:1,exp:'b promotes to int before ~.'},
{q:'Fastest way to check power of two for unsigned x > 0?',opts:['Loop dividing by 2','(x & (x − 1)) == 0','log2 and compare','popcount > 1'],a:1,exp:'A power of two has exactly one set bit.'},
{q:'Why avoid C bit-fields for hardware register layouts?',opts:['Slow','Bit order/packing is implementation-defined; RMW semantics are hidden','Not allowed in C++','Too large'],a:1,exp:'Use explicit masks and shifts with readl/writel.'}],
challenge:{prompt:R`<p>Timer on: (1) Reverse Bits; (2) Counting Bits in O(n); (3) Implement a 64-bit bitmap allocator: <code>alloc()</code> returns the lowest free index using <code>std::countr_zero(~word)</code>, <code>free(i)</code>; scale to 1M bits with a two-level summary bitmap for O(1)-ish search. (4) Write FIELD_GET/FIELD_PREP equivalents as constexpr C++ templates with static_asserts.</p>`,
hints:['Reverse bits by swapping halves: 16, 8, 4, 2, 1 with masks.','Summary bitmap: bit j set if word j is full; search summary for first zero.','constexpr template<uint32_t Mask> uint32_t prep(uint32_t v) { return (v << std::countr_zero(Mask)) & Mask; }'],
solution:R`uint32_t reverseBits(uint32_t x) {
  x = (x >> 16) | (x << 16);
  x = ((x & 0xff00ff00u) >> 8) | ((x & 0x00ff00ffu) << 8);
  x = ((x & 0xf0f0f0f0u) >> 4) | ((x & 0x0f0f0f0fu) << 4);
  x = ((x & 0xccccccccu) >> 2) | ((x & 0x33333333u) << 2);
  x = ((x & 0xaaaaaaaau) >> 1) | ((x & 0x55555555u) << 1);
  return x;
}
int alloc64(uint64_t& w) { if (~w == 0) return -1; int i = std::countr_zero(~w); w |= 1ull << i; return i; }`},

]});

P({id:'lru',title:'LRU Cache',cat:'Design / hashing',diff:'Medium',mins:25,tags:['dsa','cpp'],
prompt:R`<p>Design a cache with capacity <code>C</code> supporting <code>get(key)</code> → value or -1 and <code>put(key, value)</code>, both in <b>O(1)</b>. When full, evict the least recently used entry. A <code>get</code> or <code>put</code> counts as a use.</p>`,
examples:R`LRUCache c(2); c.put(1,1); c.put(2,2); c.get(1) -> 1
c.put(3,3)   // evicts key 2
c.get(2) -> -1; c.put(4,4) // evicts key 1
c.get(1) -> -1; c.get(3) -> 3; c.get(4) -> 4`,
hints:['You need O(1) lookup (hash map) AND O(1) reordering (doubly linked list).','Store list iterators in the map: unordered_map<int, list<pair<int,int>>::iterator>.','std::list::splice moves a node to the front in O(1) without invalidating iterators.'],
solution:R`class LRUCache {
  int cap;
  std::list<std::pair<int,int>> lst;                                 // front = most recent
  std::unordered_map<int, std::list<std::pair<int,int>>::iterator> idx;
public:
  explicit LRUCache(int c) : cap(c) { idx.reserve(c * 2); }
  int get(int k) {
    auto it = idx.find(k);
    if (it == idx.end()) return -1;
    lst.splice(lst.begin(), lst, it->second);                       // O(1) move to front
    return it->second->second;
  }
  void put(int k, int v) {
    if (auto it = idx.find(k); it != idx.end()) {
      it->second->second = v; lst.splice(lst.begin(), lst, it->second); return;
    }
    if ((int)lst.size() == cap) { idx.erase(lst.back().first); lst.pop_back(); }
    lst.emplace_front(k, v); idx[k] = lst.begin();
  }
};`,
complexity:'O(1) per op; O(C) memory.',
followups:['Make it thread-safe: one mutex is simplest; sharded LRUs (per-shard locks) scale better; approximate LRU (CLOCK) avoids moving nodes on every read.','How do Linux page cache / memcached approximate LRU? (active/inactive lists, segmented LRU)','Add TTL expiry and a size-in-bytes capacity.']});

P({id:'ring',title:'Fixed-size Ring Buffer',cat:'Systems / arrays',diff:'Easy',mins:15,tags:['dsa','lockfree','drivers'],
prompt:R`<p>Implement a fixed-capacity circular buffer of <code>int</code> with <code>push(x)</code> (returns false when full), <code>pop(&out)</code> (false when empty), <code>size()</code>, plus an <code>overwrite</code> mode where push on full drops the oldest element. No dynamic allocation after construction.</p>`,
examples:R`RingBuffer rb(3); push 1,2,3 -> true; push 4 -> false
pop -> 1; push 4 -> true; contents in order: 2,3,4
overwrite mode, cap 3: push 1,2,3,4 -> contents 2,3,4`,
hints:['Track head (next write), tail (next read) and count — or use monotonically increasing indices and mask with a power-of-two capacity.','With head/tail only (no count), full and empty look the same; either waste one slot or keep a count.','Overwrite mode: when full, advance tail before writing.'],
solution:R`class RingBuffer {
  std::vector<int> buf; size_t head = 0, tail = 0, n = 0; bool overwrite;
public:
  RingBuffer(size_t cap, bool ow = false) : buf(cap), overwrite(ow) {}
  bool push(int x) {
    if (n == buf.size()) {
      if (!overwrite) return false;
      tail = (tail + 1) % buf.size(); --n;                 // drop oldest
    }
    buf[head] = x; head = (head + 1) % buf.size(); ++n; return true;
  }
  bool pop(int& out) {
    if (n == 0) return false;
    out = buf[tail]; tail = (tail + 1) % buf.size(); --n; return true;
  }
  size_t size() const { return n; }
};`,
complexity:'O(1) per op, O(capacity) memory.',
followups:['Make it lock-free SPSC (Module 4: release/acquire on indices, cache-line padding).','Why power-of-two capacity? (mask instead of modulo; monotonic indices remove the full/empty ambiguity)','How does a NIC RX descriptor ring differ? (ownership bits, DMA, doorbells)']});

P({id:'ratelimit',title:'Token Bucket Rate Limiter',cat:'Systems design / coding',diff:'Medium',mins:20,tags:['dsa','lb-traffic','dist-sys'],
prompt:R`<p>Implement <code>bool allow(const std::string& clientId, int64_t nowMs)</code> enforcing for each client a token bucket with capacity <code>B</code> and refill rate <code>R</code> tokens/second. Each request consumes one token. Time is passed in (testable). Memory should not grow without bound for idle clients.</p>`,
examples:R`B=2, R=1/s. client "a": t=0 allow, t=0 allow, t=0 deny,
t=500 deny (0.5 tokens), t=1000 allow, t=3000 allow, t=3000 allow, t=3000 deny`,
hints:['Store per client: tokens (double) and lastRefill time. Refill lazily on each call: tokens = min(B, tokens + elapsed*R).','Use integer micro-tokens to avoid floating point drift if you like.','Evict idle clients: a full bucket is equivalent to no entry — remove entries that would be full (or use an LRU with a cap).'],
solution:R`class RateLimiter {
  struct Bucket { double tokens; int64_t last; };
  std::unordered_map<std::string, Bucket> m; double cap, rate;    // rate in tokens per ms
public:
  RateLimiter(double B, double perSec) : cap(B), rate(perSec / 1000.0) {}
  bool allow(const std::string& id, int64_t now) {
    auto [it, fresh] = m.try_emplace(id, Bucket{cap, now});
    Bucket& b = it->second;
    b.tokens = std::min(cap, b.tokens + (now - b.last) * rate);
    b.last = now;
    if (b.tokens >= 1.0) { b.tokens -= 1.0; return true; }
    return false;
  }
  void gc(int64_t now) {                                          // call periodically
    for (auto it = m.begin(); it != m.end();)
      if (it->second.tokens + (now - it->second.last) * rate >= cap) it = m.erase(it); else ++it;
  }
};`,
complexity:'O(1) amortized per call; memory O(active clients).',
followups:['Distributed version across 50 gateway nodes: local buckets with share of global rate, Redis Lua script (atomic), or approximate with gossip; trade accuracy vs latency.','Sliding window log vs sliding window counter vs token bucket vs leaky bucket.','Thread safety: striped locks by hash(clientId), or atomics with CAS on packed state.']});

P({id:'bqueue',title:'Thread-safe Bounded Blocking Queue',cat:'Concurrency',diff:'Medium',mins:25,tags:['concurrency','cpp'],
prompt:R`<p>Implement a generic <code>BoundedQueue&lt;T&gt;</code> with <code>void push(T)</code> (blocks when full), <code>T pop()</code> (blocks when empty), <code>bool try_pop_for(T&, std::chrono::milliseconds)</code>, and <code>close()</code> so that blocked consumers wake up and return failure once drained. Must be correct with many producers and consumers.</p>`,
examples:R`4 producers x 100k items, 4 consumers: every item consumed exactly once;
close() after producers join -> consumers drain remaining items then exit.`,
hints:['One mutex + two condition variables (notFull, notEmpty).','Always wait with a predicate (spurious wakeups); predicates must include the closed flag.','Notify after unlocking to reduce contention; notify_all on close.'],
solution:R`template <class T> class BoundedQueue {
  std::mutex m; std::condition_variable notFull, notEmpty;
  std::deque<T> q; const size_t cap; bool closed = false;
public:
  explicit BoundedQueue(size_t c) : cap(c) {}
  bool push(T v) {
    std::unique_lock lk(m);
    notFull.wait(lk, [&] { return closed || q.size() < cap; });
    if (closed) return false;
    q.push_back(std::move(v)); lk.unlock(); notEmpty.notify_one(); return true;
  }
  std::optional<T> pop() {
    std::unique_lock lk(m);
    notEmpty.wait(lk, [&] { return closed || !q.empty(); });
    if (q.empty()) return std::nullopt;                      // closed and drained
    T v = std::move(q.front()); q.pop_front(); lk.unlock(); notFull.notify_one(); return v;
  }
  bool try_pop_for(T& out, std::chrono::milliseconds d) {
    std::unique_lock lk(m);
    if (!notEmpty.wait_for(lk, d, [&] { return closed || !q.empty(); }) || q.empty()) return false;
    out = std::move(q.front()); q.pop_front(); lk.unlock(); notFull.notify_one(); return true;
  }
  void close() { { std::lock_guard lk(m); closed = true; } notFull.notify_all(); notEmpty.notify_all(); }
};`,
complexity:'O(1) per op plus blocking; contention on one mutex.',
followups:['How would you reduce contention? (two-lock queue: separate head/tail locks; lock-free MPMC like Vyukov)','What happens if T’s move constructor throws?','Add batching: pop up to N items at once to amortize locking.']});

P({id:'bits',title:'Single Number III (bit tricks)',cat:'Bit manipulation',diff:'Medium',mins:15,tags:['dsa','cpp'],
prompt:R`<p>Every element appears exactly twice except two elements which appear once. Find those two in O(n) time and O(1) extra space.</p>`,
examples:R`[1,2,1,3,2,5] -> {3,5}
[-1,0] -> {-1,0}`,
hints:['XOR of all numbers = a ^ b (pairs cancel).','a ^ b is non-zero; pick any set bit — it distinguishes a from b.','Lowest set bit: x & -x (use unsigned to avoid overflow on INT_MIN).'],
solution:R`std::pair<int,int> singleNumberIII(const std::vector<int>& nums) {
  uint32_t x = 0;
  for (int v : nums) x ^= (uint32_t)v;           // a ^ b
  uint32_t low = x & (~x + 1);                   // lowest set bit (x & -x on unsigned)
  int a = 0, b = 0;
  for (int v : nums) ((uint32_t)v & low ? a : b) ^= v;
  return {a, b};
}`,
complexity:'O(n) time, O(1) space.',
followups:['Single Number II (every other element appears 3 times): count bits mod 3 or use the ones/twos state machine.','Why use unsigned for x & -x?','Popcount of a 64-bit word without builtins (SWAR).']});

P({id:'intervals',title:'Merge & Insert Intervals',cat:'Sorting / intervals',diff:'Medium',mins:20,tags:['dsa'],
prompt:R`<p>(a) Given a list of intervals [start, end], merge all overlapping intervals. (b) Given sorted non-overlapping intervals and a new interval, insert and merge in O(n).</p>`,
examples:R`merge([[1,3],[2,6],[8,10],[15,18]]) -> [[1,6],[8,10],[15,18]]
merge([[1,4],[4,5]]) -> [[1,5]]
insert([[1,3],[6,9]], [2,5]) -> [[1,5],[6,9]]`,
hints:['Sort by start; then a new interval overlaps the last merged one iff start <= last.end.','For insert: copy intervals ending before new.start; merge all overlapping; copy the rest.','Decide whether touching intervals ([1,4],[4,5]) merge — clarify with the interviewer.'],
solution:R`std::vector<std::array<int,2>> merge(std::vector<std::array<int,2>> v) {
  std::sort(v.begin(), v.end());
  std::vector<std::array<int,2>> out;
  for (auto& iv : v) {
    if (!out.empty() && iv[0] <= out.back()[1]) out.back()[1] = std::max(out.back()[1], iv[1]);
    else out.push_back(iv);
  }
  return out;
}
std::vector<std::array<int,2>> insert(const std::vector<std::array<int,2>>& v, std::array<int,2> n) {
  std::vector<std::array<int,2>> out; size_t i = 0;
  while (i < v.size() && v[i][1] < n[0]) out.push_back(v[i++]);
  while (i < v.size() && v[i][0] <= n[1]) { n[0] = std::min(n[0], v[i][0]); n[1] = std::max(n[1], v[i][1]); ++i; }
  out.push_back(n);
  while (i < v.size()) out.push_back(v[i++]);
  return out;
}`,
complexity:'merge O(n log n); insert O(n).',
followups:['Meeting rooms II: minimum rooms (min-heap of end times or sweep line).','Interval tree for dynamic stabbing queries (e.g. memory region lookup in a kernel: maple tree/VMA tree).','Merging memory regions in a physical memory allocator (memblock).']});

P({id:'topk',title:'Top K Frequent Elements',cat:'Heaps / hashing',diff:'Medium',mins:15,tags:['dsa'],
prompt:R`<p>Given an integer array and k, return the k most frequent elements (any order). Aim better than O(n log n).</p>`,
examples:R`[1,1,1,2,2,3], k=2 -> [1,2]
[4], k=1 -> [4]`,
hints:['Count with a hash map.','Min-heap of size k keyed by frequency → O(n log k).','Bucket sort by frequency (frequency ≤ n) → O(n).'],
solution:R`std::vector<int> topKFrequent(const std::vector<int>& nums, int k) {
  std::unordered_map<int,int> cnt; for (int x : nums) ++cnt[x];
  using P = std::pair<int,int>;                                  // (freq, value)
  std::priority_queue<P, std::vector<P>, std::greater<P>> pq;    // min-heap
  for (auto& [v, f] : cnt) { pq.push({f, v}); if ((int)pq.size() > k) pq.pop(); }
  std::vector<int> out; while (!pq.empty()) { out.push_back(pq.top().second); pq.pop(); }
  return out;
}`,
complexity:'O(n log k) time, O(n) space (bucket version O(n)).',
followups:['Streaming heavy hitters with bounded memory: Count-Min Sketch + heap, Misra-Gries / Space-Saving.','Top-k across 1,000 machines: local top-k is not enough for exact answers — discuss two-round algorithms or approximate.','Top talkers in a NIC telemetry pipeline at 10 Mpps.']});

P({id:'topo',title:'Build Order (Topological Sort)',cat:'Graphs',diff:'Medium',mins:20,tags:['dsa','yocto','cicd'],
prompt:R`<p>Given n packages (0..n-1) and dependency pairs [a, b] meaning "a depends on b" (b must build first), return a valid build order or an empty list if there is a cycle.</p>`,
examples:R`n=4, deps=[[1,0],[2,0],[3,1],[3,2]] -> [0,1,2,3] or [0,2,1,3]
n=2, deps=[[0,1],[1,0]] -> [] (cycle)`,
hints:['Edge b -> a; in-degree of a = number of its dependencies.','Kahn: queue all in-degree-0 nodes; pop, append, decrement neighbors.','If output size < n there is a cycle; for reporting the cycle use DFS with colors.'],
solution:R`std::vector<int> buildOrder(int n, const std::vector<std::pair<int,int>>& deps) {
  std::vector<std::vector<int>> g(n); std::vector<int> indeg(n, 0);
  for (auto [a, b] : deps) { g[b].push_back(a); ++indeg[a]; }
  std::queue<int> q; for (int i = 0; i < n; ++i) if (!indeg[i]) q.push(i);
  std::vector<int> order;
  while (!q.empty()) {
    int u = q.front(); q.pop(); order.push_back(u);
    for (int v : g[u]) if (--indeg[v] == 0) q.push(v);
  }
  return (int)order.size() == n ? order : std::vector<int>{};
}`,
complexity:'O(V + E).',
followups:['Parallel build: how many workers can be busy at each step? (levels of the DAG; critical path length)','Incremental rebuilds when one package changes (reverse dependency closure).','How BitBake/Bazel schedule tasks with this.']});

P({id:'islands',title:'Number of Islands (grid BFS)',cat:'Graphs',diff:'Medium',mins:15,tags:['dsa'],
prompt:R`<p>Given an m×n grid of '1' (land) and '0' (water), count islands (4-directionally connected land).</p>`,
examples:R`11110
11010
11000
00000  -> 1
11000
11000
00100
00011  -> 3`,
hints:['Scan cells; on unvisited land, BFS/DFS to mark the whole island and increment the count.','Mark visited by mutating the grid (or a visited array) when pushing to the queue.','Avoid recursion depth issues on 1000×1000 grids: use an explicit queue/stack.'],
solution:R`int numIslands(std::vector<std::string>& g) {
  int m = g.size(), n = m ? g[0].size() : 0, count = 0;
  const int dr[4] = {1, -1, 0, 0}, dc[4] = {0, 0, 1, -1};
  std::queue<std::pair<int,int>> q;
  for (int r = 0; r < m; ++r) for (int c = 0; c < n; ++c) {
    if (g[r][c] != '1') continue;
    ++count; g[r][c] = '0'; q.push({r, c});
    while (!q.empty()) {
      auto [y, x] = q.front(); q.pop();
      for (int d = 0; d < 4; ++d) {
        int ny = y + dr[d], nx = x + dc[d];
        if (ny >= 0 && ny < m && nx >= 0 && nx < n && g[ny][nx] == '1') { g[ny][nx] = '0'; q.push({ny, nx}); }
      }
    }
  }
  return count;
}`,
complexity:'O(m·n) time, O(min(m,n)) queue space typically.',
followups:['Union-Find version; online version where land is added one cell at a time (Number of Islands II).','Connected-component labeling in image processing (two-pass algorithm) — relevant to camera/CV pipelines.','Parallelize over tiles and merge boundaries.']});

P({id:'trie',title:'Trie with Prefix Search',cat:'Trees / strings',diff:'Medium',mins:20,tags:['dsa','routing'],
prompt:R`<p>Implement <code>insert(word)</code>, <code>search(word)</code>, <code>startsWith(prefix)</code> and <code>top3(prefix)</code> returning up to 3 lexicographically smallest words with that prefix (autocomplete). Lowercase a–z only.</p>`,
examples:R`insert "car","card","care","cat","dog"
search("car") -> true; search("ca") -> false; startsWith("ca") -> true
top3("car") -> ["car","card","care"]`,
hints:['Node: array<unique_ptr<Node>,26> children + bool end.','top3: walk to the prefix node, then DFS children in order a..z, stop after 3.','Memory-heavy? Consider compressed (radix) tries — the same structure as an IP LPM trie.'],
solution:R`struct Trie {
  struct Node { std::array<std::unique_ptr<Node>, 26> ch; bool end = false; };
  Node root;
  void insert(const std::string& w) {
    Node* n = &root;
    for (char c : w) { auto& p = n->ch[c - 'a']; if (!p) p = std::make_unique<Node>(); n = p.get(); }
    n->end = true;
  }
  const Node* walk(const std::string& s) const {
    const Node* n = &root;
    for (char c : s) { n = n->ch[c - 'a'].get(); if (!n) return nullptr; }
    return n;
  }
  bool search(const std::string& w) const { auto n = walk(w); return n && n->end; }
  bool startsWith(const std::string& p) const { return walk(p) != nullptr; }
  std::vector<std::string> top3(std::string p) const {
    std::vector<std::string> out; const Node* n = walk(p); if (!n) return out;
    std::function<void(const Node*)> dfs = [&](const Node* x) {
      if (out.size() == 3) return;
      if (x->end) out.push_back(p);
      for (int i = 0; i < 26 && out.size() < 3; ++i)
        if (x->ch[i]) { p.push_back('a' + i); dfs(x->ch[i].get()); p.pop_back(); }
    };
    dfs(n); return out;
  }
};`,
complexity:'insert/search O(L); top3 O(L + visited nodes).',
followups:['Store top-3 at each node for O(L) autocomplete at the cost of memory/update time.','Radix/Patricia trie and its use in routing tables (Module 8).','Concurrency: read-mostly trie with RCU-style copy-on-write updates.']});

P({id:'timekv',title:'Time-based Key-Value Store',cat:'Binary search / design',diff:'Medium',mins:20,tags:['dsa','storage-data','dist-sys'],
prompt:R`<p>Implement <code>set(key, value, timestamp)</code> and <code>get(key, timestamp)</code> returning the value with the largest timestamp ≤ the given timestamp ("" if none). Timestamps for a key arrive strictly increasing.</p>`,
examples:R`set("foo","bar",1); get("foo",1) -> "bar"; get("foo",3) -> "bar"
set("foo","bar2",4); get("foo",4) -> "bar2"; get("foo",5) -> "bar2"; get("foo",0) -> ""`,
hints:['Per key keep a vector of (timestamp, value) — already sorted because timestamps increase.','get: upper_bound on timestamp, then step back one.','This is MVCC in miniature (snapshot reads at a timestamp).'],
solution:R`class TimeMap {
  std::unordered_map<std::string, std::vector<std::pair<int, std::string>>> m;
public:
  void set(const std::string& k, std::string v, int t) { m[k].emplace_back(t, std::move(v)); }
  std::string get(const std::string& k, int t) const {
    auto it = m.find(k); if (it == m.end()) return "";
    const auto& vec = it->second;
    auto ub = std::upper_bound(vec.begin(), vec.end(), t,
                               [](int ts, const auto& p) { return ts < p.first; });
    return ub == vec.begin() ? "" : std::prev(ub)->second;
  }
};`,
complexity:'set O(1) amortized; get O(log n).',
followups:['Out-of-order timestamps (use std::map per key or sort on read).','Garbage collection of old versions (watermark below oldest active snapshot) — how databases vacuum.','Distributed: how do you assign timestamps? (HLC, TrueTime — Module 7)']});

P({id:'rotated',title:'Search in Rotated Sorted Array',cat:'Binary search',diff:'Medium',mins:15,tags:['dsa'],
prompt:R`<p>A sorted array of distinct integers was rotated at an unknown pivot. Find the index of target in O(log n), or -1.</p>`,
examples:R`[4,5,6,7,0,1,2], target 0 -> 4
[4,5,6,7,0,1,2], target 3 -> -1
[1], target 0 -> -1`,
hints:['At each step at least one half [lo..mid] or [mid..hi] is sorted.','Check whether target lies inside the sorted half; otherwise go to the other half.','Use mid = lo + (hi - lo) / 2 to avoid overflow.'],
solution:R`int search(const std::vector<int>& a, int target) {
  int lo = 0, hi = (int)a.size() - 1;
  while (lo <= hi) {
    int mid = lo + (hi - lo) / 2;
    if (a[mid] == target) return mid;
    if (a[lo] <= a[mid]) {                                  // left half sorted
      if (a[lo] <= target && target < a[mid]) hi = mid - 1; else lo = mid + 1;
    } else {                                                // right half sorted
      if (a[mid] < target && target <= a[hi]) lo = mid + 1; else hi = mid - 1;
    }
  }
  return -1;
}`,
complexity:'O(log n).',
followups:['With duplicates the worst case becomes O(n) — why?','Binary search on the answer: "minimum capacity to ship packages in D days".','Find the rotation point; lower_bound/upper_bound semantics.']});

P({id:'pool',title:'Fixed-size Block Pool Allocator',cat:'Systems / memory',diff:'Medium',mins:25,tags:['cpp','memmodel','realtime'],
prompt:R`<p>Implement a pool allocator for fixed-size blocks (e.g. 64 bytes) carved from one pre-allocated buffer: <code>void* alloc()</code> (nullptr when exhausted) and <code>void free(void*)</code>, both O(1), no system allocator calls after construction. Blocks must be suitably aligned. Discuss making it thread-safe.</p>`,
examples:R`Pool p(64, 1000); void* a = p.alloc(); void* b = p.alloc();
p.free(a); void* c = p.alloc();   // c == a (LIFO reuse is fine)
after 1000 allocs without frees -> alloc() returns nullptr`,
hints:['Intrusive free list: store the "next" pointer inside each free block (block size ≥ sizeof(void*)).','Round block size up to alignment: (size + align - 1) & ~(align - 1).','Thread safety: mutex, per-thread caches, or a lock-free Treiber stack (watch out for ABA — tagged pointers).'],
solution:R`class Pool {
  struct Node { Node* next; };
  std::unique_ptr<std::byte[]> mem; Node* head = nullptr; size_t bs;
public:
  Pool(size_t blockSize, size_t count, size_t align = alignof(std::max_align_t)) {
    bs = (std::max(blockSize, sizeof(Node)) + align - 1) & ~(align - 1);
    mem.reset(new std::byte[bs * count + align]);
    auto base = reinterpret_cast<uintptr_t>(mem.get());
    base = (base + align - 1) & ~(uintptr_t)(align - 1);            // align first block
    for (size_t i = count; i-- > 0;) {                             // build free list
      auto* n = reinterpret_cast<Node*>(base + i * bs); n->next = head; head = n;
    }
  }
  void* alloc() { if (!head) return nullptr; Node* n = head; head = n->next; return n; }
  void free(void* p) { auto* n = static_cast<Node*>(p); n->next = head; head = n; }
};`,
complexity:'O(1) alloc/free; O(count·blockSize) memory, zero fragmentation for that size.',
followups:['Where is this used? (kernel slab/kmem_cache, DPDK mempools, real-time control loops, network buffers)','Detect double free / use-after-free in debug builds (poisoning, canaries).','Per-CPU magazines to remove contention (like SLUB per-CPU freelists, tcmalloc thread caches).']});

P({id:'hashring',title:'Consistent Hash Ring',cat:'Distributed systems coding',diff:'Medium',mins:20,tags:['dist-sys','lb-traffic','dsa'],
prompt:R`<p>Implement a consistent hash ring: <code>addNode(name, vnodes)</code>, <code>removeNode(name)</code>, <code>getNode(key)</code>. Use virtual nodes for balance. Moving from N to N+1 nodes should remap only ~1/(N+1) of keys.</p>`,
examples:R`ring.addNode("A",100); ring.addNode("B",100); ring.addNode("C",100);
getNode("user:42") -> "B" (deterministic)
removeNode("B") -> keys previously on A or C stay put`,
hints:['std::map<uint64_t, std::string> from token hash to node; lookup with lower_bound and wrap to begin().','Token for vnode i: hash(name + "#" + i).','Use a good 64-bit hash (e.g. std::hash is fine for exercises; FNV-1a or xxhash in practice).'],
solution:R`class HashRing {
  std::map<uint64_t, std::string> ring;
  static uint64_t h(const std::string& s) {                      // FNV-1a 64
    uint64_t x = 1469598103934665603ULL;
    for (unsigned char c : s) { x ^= c; x *= 1099511628211ULL; }
    return x;
  }
public:
  void addNode(const std::string& n, int v) { for (int i = 0; i < v; ++i) ring[h(n + "#" + std::to_string(i))] = n; }
  void removeNode(const std::string& n) {
    for (auto it = ring.begin(); it != ring.end();) it = (it->second == n) ? ring.erase(it) : std::next(it);
  }
  const std::string* getNode(const std::string& key) const {
    if (ring.empty()) return nullptr;
    auto it = ring.lower_bound(h(key));
    if (it == ring.end()) it = ring.begin();                     // wrap around
    return &it->second;
  }
};`,
complexity:'getNode O(log(N·V)); add/remove O(V log(N·V)).',
followups:['Replication: return the next R distinct nodes clockwise.','Bounded-load consistent hashing; rendezvous hashing; jump hash (Module 7).','Weighted nodes (vnodes proportional to capacity).']});

P({id:'rotate',title:'Rotate Image In Place (90°)',cat:'Arrays / matrices',diff:'Medium',mins:15,tags:['dsa','camera-isp'],
prompt:R`<p>Rotate an n×n matrix (an image) 90° clockwise in place, O(1) extra memory.</p>`,
examples:R`[[1,2,3],
 [4,5,6],
 [7,8,9]]  ->  [[7,4,1],[8,5,2],[9,6,3]]`,
hints:['Clockwise rotation = transpose, then reverse each row.','Or rotate layer by layer, cycling 4 elements at a time.','Think about cache behavior for large images: transposes are cache-unfriendly → tile them.'],
solution:R`void rotate(std::vector<std::vector<int>>& m) {
  int n = m.size();
  for (int i = 0; i < n; ++i)
    for (int j = i + 1; j < n; ++j) std::swap(m[i][j], m[j][i]);   // transpose
  for (auto& row : m) std::reverse(row.begin(), row.end());         // mirror
}`,
complexity:'O(n²) time, O(1) extra space.',
followups:['Non-square images (needs a new buffer, or cycle-following in-place transposition).','How would an ISP/GPU do rotation? (tiled transposes in shared memory, hardware rotators, DMA 2D engines)','Spiral order traversal as a warm-up variant.']});

P({id:'decode',title:'Decode String (stack parsing)',cat:'Stacks / parsing',diff:'Medium',mins:20,tags:['dsa'],
prompt:R`<p>Decode strings like <code>3[a2[c]]</code> → <code>accaccacc</code>. Format: k[encoded] repeats encoded k times; nesting allowed; input is valid; digits only appear as repeat counts.</p>`,
examples:R`"3[a]2[bc]" -> "aaabcbc"
"3[a2[c]]" -> "accaccacc"
"2[abc]3[cd]ef" -> "abcabccdcdcdef"`,
hints:['Two stacks: counts and partial strings; or recursion with an index reference.','On "[": push current string and count, reset. On "]": pop, repeat current, append to previous.','Counts can be multi-digit (e.g. 12[a]).'],
solution:R`std::string decodeString(const std::string& s) {
  std::vector<int> counts; std::vector<std::string> strs;
  std::string cur; int k = 0;
  for (char c : s) {
    if (isdigit((unsigned char)c)) k = k * 10 + (c - '0');
    else if (c == '[') { counts.push_back(k); strs.push_back(std::move(cur)); cur.clear(); k = 0; }
    else if (c == ']') {
      std::string prev = std::move(strs.back()); strs.pop_back();
      int n = counts.back(); counts.pop_back();
      prev.reserve(prev.size() + cur.size() * n);
      for (int i = 0; i < n; ++i) prev += cur;
      cur = std::move(prev);
    } else cur.push_back(c);
  }
  return cur;
}`,
complexity:'O(output length).',
followups:['Validate malformed input and bound output size (decompression bombs!).','Write a tokenizer + recursive descent parser for a tiny config language.','Parse a device register dump "0x1A=0x03;0x1B=0xFF" robustly.']});

P({id:'revk',title:'Reverse Linked List (and in k-groups)',cat:'Linked lists',diff:'Hard',mins:25,tags:['dsa','cpp'],
prompt:R`<p>(a) Reverse a singly linked list iteratively. (b) Reverse nodes in groups of k (leftover nodes at the end stay as is). Use O(1) extra space and don’t change node values.</p>`,
examples:R`1->2->3->4->5, reverse -> 5->4->3->2->1
1->2->3->4->5, k=2 -> 2->1->4->3->5
1->2->3->4->5, k=3 -> 3->2->1->4->5`,
hints:['Iterative reverse: prev=nullptr; while(cur){ next=cur->next; cur->next=prev; prev=cur; cur=next; }','For k-groups use a dummy head; check k nodes exist before reversing a group.','Keep pointers: groupPrev (node before group) and groupNext (node after group).'],
solution:R`struct Node { int v; Node* next; };
Node* reverse(Node* h) { Node* p = nullptr; while (h) { Node* n = h->next; h->next = p; p = h; h = n; } return p; }
Node* reverseKGroup(Node* head, int k) {
  Node dummy{0, head}; Node* gp = &dummy;
  for (;;) {
    Node* kth = gp; for (int i = 0; i < k && kth; ++i) kth = kth->next;
    if (!kth) break;                                   // fewer than k left
    Node* gn = kth->next; Node* prev = gn; Node* cur = gp->next;
    while (cur != gn) { Node* n = cur->next; cur->next = prev; prev = cur; cur = n; }
    Node* first = gp->next; gp->next = kth; gp = first; // first is now the group tail
  }
  return dummy.next;
}`,
complexity:'O(n) time, O(1) space.',
followups:['Detect a cycle (Floyd) and find its start.','Linux list_head: intrusive doubly linked lists and container_of — why intrusive?','Lock-free singly linked stack and the ABA problem (Module 4).']});

P({id:'dijkstra',title:'Cheapest Network Path (Dijkstra)',cat:'Graphs',diff:'Medium',mins:20,tags:['dsa','routing'],
prompt:R`<p>Given a directed weighted graph of n routers (1..n) and links (u, v, latencyMs), return the time for a signal from k to reach all routers, or -1 if some are unreachable. Also return the path to a given router.</p>`,
examples:R`times=[[2,1,1],[2,3,1],[3,4,1]], n=4, k=2 -> 2
times=[[1,2,1]], n=2, k=2 -> -1`,
hints:['Min-heap of (dist, node); skip stale entries where d > dist[u].','Keep parent[] to reconstruct paths.','Weights must be non-negative; otherwise Bellman-Ford.'],
solution:R`std::pair<int, std::vector<int>> delayAndPath(int n, int k, int target, const std::vector<std::array<int,3>>& e) {
  std::vector<std::vector<std::pair<int,int>>> g(n + 1);
  for (auto& [u, v, w] : e) g[u].push_back({v, w});
  std::vector<int> dist(n + 1, INT_MAX), parent(n + 1, -1); dist[k] = 0;
  std::priority_queue<std::pair<int,int>, std::vector<std::pair<int,int>>, std::greater<>> pq; pq.push({0, k});
  while (!pq.empty()) {
    auto [d, u] = pq.top(); pq.pop();
    if (d > dist[u]) continue;
    for (auto [v, w] : g[u]) if (d + w < dist[v]) { dist[v] = d + w; parent[v] = u; pq.push({dist[v], v}); }
  }
  int worst = *std::max_element(dist.begin() + 1, dist.end());
  std::vector<int> path; for (int x = target; x != -1 && dist[target] != INT_MAX; x = parent[x]) path.push_back(x);
  std::reverse(path.begin(), path.end());
  return {worst == INT_MAX ? -1 : worst, path};
}`,
complexity:'O((V + E) log V).',
followups:['OSPF/IS-IS run Dijkstra (SPF) on link-state databases — incremental SPF.','K shortest paths / ECMP: keep all equal-cost parents.','A* with a heuristic for grid robots (Module 12).']});

P({id:'pingpong',title:'Ping-Pong Threads (ordering with CVs)',cat:'Concurrency',diff:'Medium',mins:20,tags:['concurrency','cpp'],
prompt:R`<p>Two threads print "ping" and "pong" alternately N times each, starting with ping: ping pong ping pong … Use std::thread, std::mutex and std::condition_variable (no sleeps). Then generalize to M threads printing in round-robin order.</p>`,
examples:R`N=3 -> ping pong ping pong ping pong`,
hints:['Shared state: turn (0 or 1) protected by the mutex.','Each thread waits until turn == myId, prints, flips turn, notifies.','Generalize: turn = (turn + 1) % M and notify_all (or one CV per thread to avoid thundering herd).'],
solution:R`void roundRobin(int M, int N) {
  std::mutex m; std::condition_variable cv; int turn = 0;
  std::vector<std::thread> ts;
  for (int id = 0; id < M; ++id)
    ts.emplace_back([&, id] {
      for (int i = 0; i < N; ++i) {
        std::unique_lock lk(m);
        cv.wait(lk, [&] { return turn == id; });
        std::printf("%s ", id == 0 ? "ping" : id == 1 ? "pong" : "pang");
        turn = (turn + 1) % M;
        lk.unlock();
        cv.notify_all();
      }
    });
  for (auto& t : ts) t.join();
}`,
complexity:'Each handoff = context switch (~µs); notify_all wakes M threads (use per-thread CVs/semaphores for large M).',
followups:['Use C++20 std::binary_semaphore array instead (each thread releases the next).','Why can’t you use a spin on an atomic here efficiently with many threads?','How would you measure handoff latency? (pinning, rdtsc/steady_clock)']});

P({id:'slidemax',title:'Sliding Window Maximum',cat:'Deque / windows',diff:'Hard',mins:20,tags:['dsa','observability'],
prompt:R`<p>Given an array and window size k, return the max of each window as it slides by one. O(n) required. (Real-world: rolling max latency over the last k samples.)</p>`,
examples:R`[1,3,-1,-3,5,3,6,7], k=3 -> [3,3,5,5,6,7]`,
hints:['A heap gives O(n log n); for O(n) use a deque of indices.','Keep deque values decreasing: pop back while a[back] <= a[i].','Pop front when it falls out of the window (index <= i - k).'],
solution:R`std::vector<int> maxSlidingWindow(const std::vector<int>& a, int k) {
  std::deque<int> dq; std::vector<int> out;
  for (int i = 0; i < (int)a.size(); ++i) {
    while (!dq.empty() && a[dq.back()] <= a[i]) dq.pop_back();
    dq.push_back(i);
    if (dq.front() <= i - k) dq.pop_front();
    if (i >= k - 1) out.push_back(a[dq.front()]);
  }
  return out;
}`,
complexity:'O(n) amortized; O(k) space.',
followups:['Sliding window median (two heaps with lazy deletion or an order-statistics tree).','Time-based windows (last 60 s) with uneven sample arrival.','Approximate percentiles over windows (t-digest, HDR histogram).']});

P({id:'aligned',title:'aligned_malloc / aligned_free',cat:'Embedded classic',diff:'Easy',mins:15,tags:['cpp','pcie-dma','memmodel'],
prompt:R`<p>Using only <code>malloc</code>/<code>free</code>, implement <code>void* aligned_malloc(size_t size, size_t align)</code> (align is a power of two) and <code>aligned_free(void*)</code>. Common in embedded/DMA interviews (buffers must be cache-line or page aligned).</p>`,
examples:R`p = aligned_malloc(100, 64); ((uintptr_t)p % 64) == 0
aligned_free(p);  // frees the original malloc block`,
hints:['Over-allocate size + align - 1 + sizeof(void*).','Round the address up to the alignment, leaving room just before it to store the original pointer.','aligned_free reads the stored pointer at ((void**)p)[-1].'],
solution:R`void* aligned_malloc(size_t size, size_t align) {
  if (align & (align - 1)) return nullptr;                       // must be power of two
  void* raw = std::malloc(size + align - 1 + sizeof(void*));
  if (!raw) return nullptr;
  uintptr_t start = reinterpret_cast<uintptr_t>(raw) + sizeof(void*);
  uintptr_t aligned = (start + align - 1) & ~(uintptr_t)(align - 1);
  reinterpret_cast<void**>(aligned)[-1] = raw;                    // stash original
  return reinterpret_cast<void*>(aligned);
}
void aligned_free(void* p) { if (p) std::free(reinterpret_cast<void**>(p)[-1]); }`,
complexity:'O(1); wastes up to align - 1 + sizeof(void*) bytes.',
followups:['Standard alternatives: posix_memalign, C11 aligned_alloc (size must be a multiple of align), C++17 aligned new.','Why do DMA buffers need cache-line alignment? (partial-line cache maintenance corrupts neighbors)','In the kernel: dma_alloc_coherent vs kmalloc + dma_map_single.']});

{t:'Clarify requirements',ask:'What would you ask before drawing anything?',a:R`<ul><li>Workloads: large distributed training (64–4,096 GPUs, days), fine-tuning (8–64 GPUs, hours), batch inference/evals (1–8 GPUs, minutes), interactive notebooks.</li><li>Tenants/teams with quotas and priorities; fairness vs utilization goals; preemption allowed?</li><li>Hardware: 1,250 nodes × 8 H100 with NVLink; InfiniBand rails; topology (racks, spines); some MIG-capable for small jobs.</li><li>SLOs: scheduling latency (seconds–minutes), utilization target (>85% allocated), max queue wait for high priority.</li><li>Failure rates: GPUs/nodes fail daily at this scale → checkpoint/restart semantics.</li></ul>`,nodes:[['users','Teams / CLI / API',60,60]],edges:[]},

Node { id, rack, spine, gpus[8]{health, mig_profile}, ib_rails, state }

{t:'High-level design',ask:'Draw the main components and flow.',a:R`<ul><li><b>Admission</b>: validate, quota check, assign priority.</li><li><b>Queue manager</b>: per-tenant queues; fair-share ordering (dominant resource fairness / weighted fair queuing over GPU-hours).</li><li><b>Scheduler core</b>: gang-aware, topology-aware placement (all-or-nothing reservations); backfill small jobs into holes while reserving for big jobs (EASY backfilling).</li><li><b>Node agents</b> (kubelet-like): launch containers, report health (DCGM), enforce allocations (cgroups/device plugin).</li><li><b>Health controller</b>: drains failing nodes, triggers job restarts from checkpoints.</li></ul>`,nodes:[['queue','Fair-share queues',450,60],['sched','Scheduler core (gang + topology)',450,190],['agents','Node agents + DCGM',680,190],['health','Health controller',680,300]],edges:[['api','queue',''],['queue','sched','next job'],['sched','store','alloc'],['sched','agents','bind'],['agents','health','telemetry'],['health','sched','drain/requeue']]},
