<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills Academy v2 — Chandra Vig (portable)</title>
<meta name="description" content="Deep, interactive systems learning: C++, Linux kernel, embedded bring-up, concurrency, CUDA, inference serving, distributed systems, networking, cloud, security, observability, robotics, system design, interview coding.">
<style>
:root{
  --bg:#0b0f17;--bg2:#111827;--panel:#151d2b;--panel2:#1b2536;--line:#26324a;
  --text:#e6edf7;--muted:#93a1b8;--dim:#64748b;
  --accent:#7c5cff;--accent2:#22d3ee;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--pink:#f472b6;
  --radius:14px;--shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
body{background:radial-gradient(1200px 600px at 10% -10%,#1d1b4b55,transparent),radial-gradient(900px 500px at 110% 10%,#0e4f5c44,transparent),var(--bg);min-height:100vh}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
code{font-family:var(--mono);background:#0f1726;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:.88em;color:#c4b5fd}
pre{font-family:var(--mono);background:#0a1020;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;font-size:13px;line-height:1.5;color:#d1e2ff}
pre code{background:none;border:0;padding:0;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:.2em 0 .5em}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:0 0 250px;background:linear-gradient(180deg,#0f1522,#0b0f17);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px;margin:4px 6px 14px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--pink),var(--accent));display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 0 20px #7c5cff66;animation:spin 12s linear infinite}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
.nav a:hover{background:var(--panel);color:var(--text);text-decoration:none}
.nav a.active{background:linear-gradient(90deg,#7c5cff33,transparent);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:14px 10px 4px}
.nav .mprog{margin-left:auto;font-size:11px;color:var(--dim)}
.main{flex:1;min-width:0;padding:22px 30px 80px;max-width:1180px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.xpbar{flex:1;min-width:180px;height:10px;background:#0f1726;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.card{background:linear-gradient(180deg,var(--panel),#121a28);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mod{cursor:pointer;transition:transform .18s,border-color .18s;position:relative;overflow:hidden}
.mod:hover{transform:translateY(-3px);border-color:var(--accent)}
.mod .ic{font-size:28px}
.mod .bar{height:6px;background:#0f1726;border-radius:9px;overflow:hidden;margin-top:10px}
.mod .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent2))}
.mod.lensed{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn),0 0 24px #fbbf2433}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#1f2a40;color:var(--muted);margin:2px 4px 2px 0}
.tag.core{background:#7c5cff26;color:#c4b5fd}.tag.adjacent{background:#22d3ee22;color:#67e8f9}.tag.optional{background:#64748b33;color:#cbd5e1}
.tag.inferred{background:#fbbf2422;color:#fcd34d}.tag.verified{background:#34d39922;color:#6ee7b7}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;transition:all .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(90deg,var(--accent),#5b8cff);border-color:transparent}
.btn.good{background:#065f46;border-color:#10b981}
.btn.small{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.lesson-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.crumb{color:var(--dim);font-size:13px;margin-bottom:6px}
.analogy{border-left:4px solid var(--pink);background:linear-gradient(90deg,#f472b61a,transparent);padding:14px 16px;border-radius:0 12px 12px 0;margin:14px 0;font-size:15.5px}
.analogy b{color:var(--pink)}
.body p,.body li{color:#d5deec}
.body h3{color:#fff;margin-top:22px}
.body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
.body td,.body th{border:1px solid var(--line);padding:6px 9px;text-align:left}
.body th{background:#121a2a}
.callout{background:#0f1a2e;border:1px solid #2b3d63;border-radius:12px;padding:12px 14px;margin:12px 0}
.callout.gotcha{border-color:#7f1d1d;background:#2a0f14}
.callout.gotcha b:first-child{color:var(--bad)}
.callout.num{border-color:#14532d;background:#0c1f17}
.poly{border:1px solid #0e7490;background:linear-gradient(135deg,#083344,#0b1220);border-radius:14px;padding:14px 16px;margin:16px 0}
.poly h4{color:var(--accent2);margin:0 0 6px}
.section{margin-top:26px}
.section>h3{display:flex;align-items:center;gap:8px}
.sim{background:#0a0f1c;border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0;position:relative}
.sim .sim-title{font-weight:800;font-size:14px;color:#fff;display:flex;gap:8px;align-items:center}
.sim .sim-title:before{content:"▶";font-size:10px;color:var(--good);background:#064e3b;border-radius:6px;padding:2px 6px}
.sim .sim-desc{font-size:13px;color:var(--muted);margin:2px 0 8px}
.sim canvas{width:100%;display:block;border-radius:10px;background:#070b14}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.ctrls label{display:flex;align-items:center;gap:8px}
.ctrls input[type=range]{accent-color:var(--accent);width:130px}
.ctrls select,.ctrls input[type=text],.ctrls input[type=number]{background:#0f1726;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.ctrls .val{color:#fff;font-family:var(--mono);min-width:34px}
.readout{font-family:var(--mono);font-size:12.5px;color:#cfe3ff;background:#0d1424;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.quiz .q{background:#0f1626;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.quiz .q .kind{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.quiz .opt{display:block;width:100%;text-align:left;background:#121b2c;border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:9px;margin:6px 0;cursor:pointer;font-size:14px;transition:all .15s}
.quiz .opt:hover{border-color:var(--accent)}
.quiz .opt.right{background:#064e3b;border-color:var(--good)}
.quiz .opt.wrong{background:#4c0519;border-color:var(--bad);animation:shake .35s}
.quiz .exp{font-size:13.5px;color:#cbd5e1;margin-top:8px;padding:8px 10px;border-left:3px solid var(--accent2);background:#0b1730;display:none}
.quiz .q.done .exp{display:block}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{background:#1a1730;border:1px dashed #5b4bb7;border-radius:10px;padding:10px 12px;margin:8px 0;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
details.iq{background:#0f1626;border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:10px 14px}
details.iq summary{cursor:pointer;font-weight:700}
details.iq[open] summary{color:var(--accent2)}
.res a{display:block;padding:4px 0}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap}
.toast{position:fixed;right:22px;bottom:22px;background:linear-gradient(90deg,#4c1d95,#155e75);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:800;z-index:99;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:stretch}
@media(max-width:900px){.hero{grid-template-columns:1fr}.side{display:none}.main{padding:14px}}
.big{font-size:40px;font-weight:900;background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.stat div{background:#0f1626;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:86px;height:96px;border-radius:16px;background:#0f1626;border:1px solid var(--line);margin:4px;font-size:11px;text-align:center;color:var(--dim);filter:grayscale(1);opacity:.55;padding:4px}
.badge .e{font-size:30px}
.badge.on{filter:none;opacity:1;color:#fff;border-color:var(--warn);box-shadow:0 0 18px #fbbf2433;animation:pop .5s}
.lessonlist .li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#0f1626;cursor:pointer;transition:all .15s}
.lessonlist .li:hover{border-color:var(--accent)}
.lessonlist .li.done{border-color:#065f46}
.lessonlist .li .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:0 0 22px}
.lessonlist .li.done .chk{background:var(--good);border-color:var(--good);color:#04241a}
.lessonlist .li.lensed{box-shadow:inset 3px 0 0 var(--warn)}
.heat{border-collapse:collapse;font-size:11px}
.heat th{position:sticky;top:0;background:#0f1522;padding:4px;font-weight:600;color:var(--muted)}
.heat th.rot{height:120px;white-space:nowrap;vertical-align:bottom}
.heat th.rot>div{transform:rotate(-55deg);width:22px;transform-origin:left bottom;translate:12px 0}
.heat td{width:22px;height:20px;border:1px solid #0b0f17;text-align:center}
.heat td.sk{width:auto;text-align:left;padding:0 8px;white-space:nowrap;color:#d5deec;font-size:12px;cursor:pointer}
.heatwrap{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:12px}
.timer{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:.05em}
textarea.code{width:100%;min-height:300px;background:#070b14;color:#d1e2ff;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 var(--mono);resize:vertical;tab-size:4}
.honor{background:#2a1f05;border:1px solid #92400e;border-radius:12px;padding:12px 14px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:#0f1626;opacity:.45;transition:opacity .3s}
.step.on{opacity:1;border-color:var(--accent)}
.step.cur{box-shadow:0 0 0 1px var(--accent),0 0 20px #7c5cff33}
.diagram svg{width:100%;height:auto;background:#070b14;border-radius:12px;border:1px solid var(--line)}
.diagram .node{transition:opacity .5s,transform .5s}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.kbd{font-family:var(--mono);background:#1f2937;border-radius:5px;padding:0 5px;border:1px solid #374151;font-size:12px}
.phase{border-left:3px solid var(--accent);padding-left:14px;margin:18px 0}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.search{background:#0f1726;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 12px;width:100%}
/* design drill + misc additions */
button.step{display:inline-block;margin:0;padding:6px 10px;color:inherit;cursor:pointer;font:inherit;font-size:13px;opacity:.6}
button.step.on{opacity:1}
.node-new{animation:popIn .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.edge-new{stroke-dasharray:6 5;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.body table{border-collapse:collapse;margin:10px 0;font-size:14px}
.body th,.body td{border:1px solid #26324a;padding:6px 9px;text-align:left;vertical-align:top}
.body th{background:#131b2b}

<script>/* js/sims-core.js */
/* Sim toolkit: every interactive demo registers here. Logical canvas coords, CSS-scaled. */
(function(G){
  const SIMS = G.SIMS = {};
  const C = { bg:'#070b14', grid:'#162036', text:'#e6edf7', muted:'#93a1b8', dim:'#4b5a75',
    accent:'#7c5cff', cyan:'#22d3ee', good:'#34d399', warn:'#fbbf24', bad:'#f87171', pink:'#f472b6',
    blue:'#60a5fa', orange:'#fb923c', panel:'#121a2a', line:'#26324a' };
  const K = {
    C,
    canvas(root, h, w){
      w = w || 860; const cv = document.createElement('canvas');
      const dpr = Math.min(2, G.devicePixelRatio || 1);
      cv.width = w*dpr; cv.height = h*dpr; cv.style.aspectRatio = w+'/'+h;
      const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
      root.appendChild(cv);
      cv._lw = w; cv._lh = h;
      return { cv, ctx, W:w, H:h };
    },
    pos(cv, ev){ const r = cv.getBoundingClientRect(); return { x:(ev.clientX-r.left)*cv._lw/r.width, y:(ev.clientY-r.top)*cv._lh/r.height }; },
    ctrls(root, defs){
      const box = document.createElement('div'); box.className='ctrls'; root.appendChild(box);
      const v = {}; const els = {};
      defs.forEach(d=>{
        if(d.btn){ const b=document.createElement('button'); b.className='btn small'+(d.primary?' primary':''); b.textContent=d.btn; b.onclick=()=>d.on(b); box.appendChild(b); els[d.id||d.btn]=b; return; }
        const l=document.createElement('label');
        if(d.sel){ l.innerHTML=(d.label||'')+' '; const s=document.createElement('select'); (d.opts).forEach(o=>{const op=document.createElement('option'); op.value=o[0]; op.textContent=o[1]; s.appendChild(op);}); s.value=d.v; v[d.sel]=d.v; s.onchange=()=>{v[d.sel]=s.value; d.on&&d.on(s.value);}; l.appendChild(s); els[d.sel]=s; }
        else if(d.chk){ const c=document.createElement('input'); c.type='checkbox'; c.checked=!!d.v; v[d.chk]=!!d.v; c.onchange=()=>{v[d.chk]=c.checked; d.on&&d.on(c.checked);}; l.appendChild(c); l.appendChild(document.createTextNode(' '+d.label)); els[d.chk]=c; }
        else if(d.text){ l.innerHTML=(d.label||'')+' '; const t=document.createElement('input'); t.type='text'; t.value=d.v; t.size=d.size||12; v[d.text]=d.v; t.oninput=()=>{v[d.text]=t.value; d.on&&d.on(t.value);}; l.appendChild(t); els[d.text]=t; }
        else { l.innerHTML=(d.label||d.k)+' '; const r=document.createElement('input'); r.type='range'; r.min=d.min; r.max=d.max; r.step=d.step||1; r.value=d.v; v[d.k]=+d.v;
          const sp=document.createElement('span'); sp.className='val'; const f=d.fmt||(x=>x); sp.textContent=f(+d.v);
          r.oninput=()=>{v[d.k]=+r.value; sp.textContent=f(+r.value); d.on&&d.on(+r.value);}; l.appendChild(r); l.appendChild(sp); els[d.k]=r; }
        box.appendChild(l);
      });
      v._els = els; return v;
    },
    readout(root){ const d=document.createElement('div'); d.className='readout'; root.appendChild(d); return d; },
    loop(cv, fn){ let last=performance.now(); let alive=true;
      function f(t){ if(!cv.isConnected){ if(alive && cv._started){alive=false; return;} }
        cv._started = cv._started || cv.isConnected; const dt=Math.max(0,Math.min(0.05,(t-last)/1000)); last=Math.max(last,t);
        try{ fn(dt,t/1000); }catch(e){ console.error(e); return; }
        if(cv.isConnected || !cv._started) requestAnimationFrame(f); }
      requestAnimationFrame(f); },
    rr(ctx,x,y,w,h,r,fill,stroke,lw){ if(!(w>0)||!(h>0)) return; r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
      if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke();} },
    t(ctx,s,x,y,o){ o=o||{}; ctx.fillStyle=o.c||C.text; ctx.font=(o.b?'bold ':'')+(o.s||12)+'px '+(o.m?'ui-monospace,Menlo,Consolas,monospace':'system-ui,sans-serif'); ctx.textAlign=o.a||'left'; ctx.textBaseline=o.bl||'middle'; ctx.fillText(s,x,y); },
    line(ctx,x1,y1,x2,y2,c,w,dash){ ctx.beginPath(); ctx.setLineDash(dash||[]); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle=c||C.line; ctx.lineWidth=w||1; ctx.stroke(); ctx.setLineDash([]); },
    arrow(ctx,x1,y1,x2,y2,c,w){ K.line(ctx,x1,y1,x2,y2,c,w); const a=Math.atan2(y2-y1,x2-x1); ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-8*Math.cos(a-0.4),y2-8*Math.sin(a-0.4)); ctx.lineTo(x2-8*Math.cos(a+0.4),y2-8*Math.sin(a+0.4)); ctx.closePath(); ctx.fillStyle=c||C.line; ctx.fill(); },
    clear(ctx,W,H){ ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H); },
    lerp(a,b,t){return a+(b-a)*t;}, clamp(x,a,b){return Math.max(a,Math.min(b,x));},
    rnd(a,b){return a+Math.random()*(b-a);}, ri(a,b){return Math.floor(a+Math.random()*(b-a+1));},
    pct(p){ return (p*100).toFixed(1)+'%'; }
  };
  G.SimKit = K;
  G.defSim = function(name, title, desc, fn){ SIMS[name] = { title, desc, fn }; };
  G.mountSim = function(el, name){
    const s = SIMS[name]; const wrap = document.createElement('div'); wrap.className='sim'; wrap.dataset.sim=name;
    if(!s){ wrap.innerHTML='<div class="sim-title">Missing sim: '+name+'</div>'; el.appendChild(wrap); console.error('Missing sim '+name); return; }
    wrap.innerHTML='<div class="sim-title">'+s.title+'</div><div class="sim-desc">'+s.desc+'</div>';
    const body=document.createElement('div'); wrap.appendChild(body); el.appendChild(wrap);
    try{ s.fn(body, K); }catch(e){ console.error('Sim '+name+' failed', e); body.innerHTML='<div class="readout">Sim error: '+e.message+'</div>'; }
  };
})(window);

</script>
<script>/* js/sims-systems.js */
/* Sims for C/C++, kernel, embedded, concurrency modules */
(function(){
const {C} = SimKit;

/* ---------- 1. RAII / stack-heap stepper ---------- */
defSim('memLayout','Stack vs heap stepper: RAII vs raw new','Step through the code. Toggle "throw" to see what RAII guarantees when an exception unwinds the stack.',function(root,K){
  const code=['void process(Frame* f) {','  auto buf = std::make_unique<uint8_t[]>(4096);','  int* raw = new int[256];        // raw owner','  std::vector<int> v(64);','  decode(f, buf.get(), v);        // may throw','  delete[] raw;','}                                 // scope exit'];
  const S={normal:[
    {l:0,st:['f'],hp:[],n:'Frame for process() pushed: return addr, saved regs, param f.'},
    {l:1,st:['f','buf'],hp:[['A','4096 B','buf']],n:'unique_ptr lives on the stack; owns heap block A.'},
    {l:2,st:['f','buf','raw'],hp:[['A','4096 B','buf'],['B','1 KiB','raw']],n:'Raw pointer owns block B — nothing will free it automatically.'},
    {l:3,st:['f','buf','raw','v'],hp:[['A','4096 B','buf'],['B','1 KiB','raw'],['V','256 B','v']],n:'vector: 24-byte handle on stack (ptr,size,cap) → heap block V.'},
    {l:4,st:['f','buf','raw','v'],hp:[['A','4096 B','buf'],['B','1 KiB','raw'],['V','256 B','v']],n:'decode() succeeds.'},
    {l:5,st:['f','buf','raw','v'],hp:[['A','4096 B','buf'],['V','256 B','v']],n:'Manual delete[] frees B.'},
    {l:6,st:[],hp:[],n:'Scope exit: destructors run in reverse order (v, raw-is-trivial, buf). All memory freed.'}],
   throws:[
    {l:0,st:['f'],hp:[],n:'Frame pushed.'},
    {l:1,st:['f','buf'],hp:[['A','4096 B','buf']],n:'unique_ptr owns A.'},
    {l:2,st:['f','buf','raw'],hp:[['A','4096 B','buf'],['B','1 KiB','raw']],n:'raw owns B.'},
    {l:3,st:['f','buf','raw','v'],hp:[['A','4096 B','buf'],['B','1 KiB','raw'],['V','256 B','v']],n:'vector allocates V.'},
    {l:4,st:['f','buf','raw','v'],hp:[['A','4096 B','buf'],['B','1 KiB','raw'],['V','256 B','v']],n:'decode() THROWS. Unwinder starts walking frames.',ex:1},
    {l:6,st:[],hp:[['B','1 KiB','LEAKED']],n:'Unwinding runs destructors of v and buf → A,V freed. delete[] raw was skipped: B LEAKS. Fix: std::unique_ptr<int[]> or std::vector.',ex:1}]};
  const {ctx,W,H,cv}=K.canvas(root,300); let mode='normal', i=0, auto=false, acc=0;
  const v=K.ctrls(root,[{btn:'◀ Prev',on:()=>{i=Math.max(0,i-1)}},{btn:'Next ▶',primary:1,on:()=>{i=Math.min(S[mode].length-1,i+1)}},{btn:'Auto',on:b=>{auto=!auto;b.textContent=auto?'Pause':'Auto'}},
    {chk:'thr',label:'decode() throws',on:c=>{mode=c?'throws':'normal';i=0}}]);
  const ro=K.readout(root); let anim=0;
  K.loop(cv,(dt)=>{ anim+=dt; if(auto){acc+=dt; if(acc>1.4){acc=0; i=(i+1)%S[mode].length;}}
    const s=S[mode][i]; K.clear(ctx,W,H);
    K.t(ctx,'CODE',16,16,{c:C.muted,b:1,s:11});
    code.forEach((ln,k)=>{ const y=38+k*24; if(k===s.l){K.rr(ctx,8,y-11,370,22,5,s.ex?'#4c0519':'#2e1065');} K.t(ctx,ln,14,y,{m:1,s:11.5,c:k===s.l?'#fff':C.muted}); });
    K.t(ctx,'STACK (grows ↓)',410,16,{c:C.muted,b:1,s:11}); K.t(ctx,'HEAP',640,16,{c:C.muted,b:1,s:11});
    const pos={};
    s.st.forEach((n,k)=>{ const y=32+k*42; K.rr(ctx,400,y,180,34,6,'#1e293b',C.cyan); K.t(ctx,n+(n==='v'?'  {ptr,size,cap}':n==='buf'?'  unique_ptr':n==='raw'?'  int*':'  Frame*'),410,y+17,{m:1,s:11}); pos[n]=[580,y+17]; });
    s.hp.forEach((h,k)=>{ const y=32+k*52; const leak=h[2]==='LEAKED'; const pulse=leak?0.5+0.5*Math.sin(anim*6):0;
      K.rr(ctx,640,y,190,40,8,leak?`rgba(248,113,113,${0.25+0.3*pulse})`:'#14281f',leak?C.bad:C.good,leak?2:1);
      K.t(ctx,'block '+h[0]+' · '+h[1],650,y+14,{s:11.5,b:1}); K.t(ctx,leak?'no owner → leak':'owner: '+h[2],650,y+29,{s:10.5,c:leak?C.bad:C.muted});
      const p=pos[h[2]]; if(p) K.arrow(ctx,p[0],p[1],638,y+20,C.cyan,1.5); });
    if(s.ex){ K.t(ctx,'⚡ exception in flight',410,280,{c:C.bad,b:1}); }
    ro.textContent='Step '+(i+1)+'/'+S[mode].length+': '+s.n;
  });
});

/* ---------- 2. vector growth: copy vs move ---------- */
defSim('vectorGrowth','std::vector growth: reallocation, copies vs moves','push_back elements. When size==capacity the vector reallocates and relocates every element. If the move ctor is not noexcept, it must COPY (strong exception guarantee).',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,240); let size=0,cap=0,allocs=0,copies=0,moves=0,reloc=null,acc=0,run=true;
  const v=K.ctrls(root,[{sel:'mv',label:'Element move ctor',v:'nx',opts:[['nx','noexcept move'],['thr','move may throw → copy'],['res','noexcept + reserve(N)']],on:reset},
    {sel:'gf',label:'Growth',v:'2',opts:[['2','×2 (libstdc++)'],['1.5','×1.5 (MSVC)']],on:reset},
    {k:'N',label:'Target N',min:8,max:64,v:40,on:reset},{k:'sp',label:'Speed',min:1,max:20,v:6},{btn:'Restart',on:reset}]);
  const ro=K.readout(root);
  function reset(){size=0;cap=0;allocs=0;copies=0;moves=0;reloc=null; if(v.mv==='res'){cap=v.N;allocs=1;}}
  reset();
  K.loop(cv,(dt)=>{ acc+=dt*v.sp;
    if(reloc){ reloc.t+=dt*1.5; if(reloc.t>=1){ reloc=null; } }
    else if(acc>1 && size<v.N){ acc=0;
      if(size===cap){ const nc=cap===0?1:Math.max(cap+1,Math.floor(cap*(+v.gf))); allocs++; if(v.mv==='thr') copies+=size; else moves+=size; reloc={from:cap,t:0,n:size}; cap=nc; }
      size++; }
    K.clear(ctx,W,H); const cell=Math.min(20,(W-40)/Math.max(cap,v.N));
    K.t(ctx,'capacity '+cap+'   size '+size,20,20,{b:1});
    for(let k=0;k<cap;k++){ const x=20+k*cell, y=60; K.rr(ctx,x,y,cell-2,30,3,k<size?(v.mv==='thr'?'#9a3412':'#5b21b6'):'#111827',C.line); }
    if(reloc){ const y=K.lerp(130,60,reloc.t); K.t(ctx,'old buffer (cap '+reloc.from+') → elements relocating '+(v.mv==='thr'?'by COPY':'by MOVE'),20,150,{c:v.mv==='thr'?C.orange:C.accent,s:12});
      for(let k=0;k<reloc.n;k++){ const x=20+k*cell; K.rr(ctx,x,y+0,cell-2,30,3,v.mv==='thr'?'rgba(251,146,60,.6)':'rgba(124,92,255,.6)'); } }
    const bw=Math.min(300,allocs*30);
    K.t(ctx,'heap allocations',20,200,{c:C.muted}); K.rr(ctx,140,192,bw+2,14,4,C.cyan);
    ro.textContent=`allocations=${allocs}  element moves=${moves}  element copies=${copies}\n`+(v.mv==='thr'?'vector uses std::move_if_noexcept: a throwing move ctor forces copies during reallocation → O(n) deep copies each growth.':v.mv==='res'?'reserve(N) did 1 allocation and zero relocations. Know N? reserve it.':'Amortized O(1) push_back: total relocations ≈ N·(1/(g-1)) — about N for ×2, 2N for ×1.5.');
  });
});

/* ---------- 3. struct padding ---------- */
defSim('structPadding','Struct layout & padding explorer','Each field is aligned to its natural alignment; the struct size rounds up to the largest alignment. Reorder fields and watch the waste.',function(root,K){
  const F0=[['char tag',1,1,C.pink],['double ts',8,8,C.accent],['int id',4,4,C.cyan],['short port',2,2,C.good],['char flag',1,1,C.warn],['void* ctx',8,8,C.orange],['uint16_t len',2,2,C.blue]];
  let F=F0.slice(); const {ctx,W,H,cv}=K.canvas(root,230);
  const v=K.ctrls(root,[{btn:'Original',on:()=>F=F0.slice()},{btn:'Sort by alignment ↓',on:()=>F=F0.slice().sort((a,b)=>b[2]-a[2])},{btn:'Worst order',on:()=>{F=[];const s=F0.slice().sort((a,b)=>a[2]-b[2]);while(s.length){F.push(s.shift()); if(s.length)F.push(s.pop());}}},{btn:'Shuffle',on:()=>F=F0.slice().sort(()=>Math.random()-.5)},{chk:'pack',label:'#pragma pack(1)'}]);
  const ro=K.readout(root);
  cv.addEventListener('click',e=>{const p=K.pos(cv,e); const idx=Math.floor((p.y-150)/0)||0; });
  K.loop(cv,()=>{ K.clear(ctx,W,H); let off=0, maxA=1; const cells=[];
    F.forEach(f=>{ const a=v.pack?1:f[2]; maxA=Math.max(maxA,a); const pad=(a-off%a)%a; for(let k=0;k<pad;k++)cells.push(null); off+=pad; for(let k=0;k<f[1];k++)cells.push(f); off+=f[1]; });
    const tail=(maxA-off%maxA)%maxA; for(let k=0;k<tail;k++)cells.push(null); const size=cells.length; const used=F.reduce((s,f)=>s+f[1],0);
    const cw=Math.min(22,(W-40)/Math.max(size,33));
    for(let k=0;k<size;k++){ const x=20+(k%32)*cw*1.0, y=30+Math.floor(k/32)*46; const c=cells[k];
      K.rr(ctx,x,y,cw-2,34,3,c?c[3]:'#1f2937',c?null:'#374151'); if(!c){ctx.strokeStyle='#4b5563'; K.line(ctx,x+2,y+30,x+cw-4,y+4,'#4b5563');}
      if(k%8===0)K.t(ctx,String(k),x,y+44,{s:9,c:C.dim}); }
    F.forEach((f,k)=>{ const x=20+(k%4)*210, y=150+Math.floor(k/4)*26; K.rr(ctx,x,y-8,14,14,3,f[3]); K.t(ctx,f[0]+' (size '+f[1]+', align '+(v.pack?1:f[2])+')',x+20,y,{s:11.5,m:1}); });
    ro.textContent=`sizeof = ${size} bytes   payload = ${used}   padding = ${size-used} (${K.pct((size-used)/size)})   alignof = ${maxA}\n`+(v.pack?'packed: no padding, but misaligned double/pointer loads — slow on some ARM cores, and taking &field yields a misaligned pointer (UB if dereferenced as T*). Use packing only for wire/register formats, and memcpy out of it.':'Rule of thumb: order fields by decreasing alignment. Arrays of this struct multiply the waste — and cache lines hold fewer elements.');
  });
});

/* ---------- 4. stack smashing ---------- */
defSim('stackSmash','Stack buffer overflow: canaries & return addresses','strcpy() an input into char buf[16]. Watch which saved values get overwritten and what the mitigation catches.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,230); let shown=0;
  const v=K.ctrls(root,[{k:'len',label:'Input length',min:0,max:44,v:12,on:()=>shown=0},{chk:'can',label:'-fstack-protector (canary)',v:true},{chk:'aslr',label:'ASLR/PIE',v:true}]);
  const ro=K.readout(root);
  const regions=[['char buf[16]',16,C.cyan],['canary',8,C.warn],['saved RBP',8,C.blue],['return addr',8,C.bad],['caller frame',4,C.dim]];
  K.loop(cv,(dt)=>{ shown=Math.min(v.len,shown+dt*20); K.clear(ctx,W,H); let x=20; const cw=18.5; let idx=0; const hit={};
    K.t(ctx,'low addresses → high addresses (writes go this way →)',20,16,{c:C.muted,s:11});
    regions.forEach(r=>{ if(r[0]==='canary'&&!v.can) return; K.t(ctx,r[0],x,46,{s:11,b:1,c:r[2]});
      for(let k=0;k<r[1];k++){ const w=idx<shown; if(w)hit[r[0]]=1; K.rr(ctx,x,60,cw-2,40,3,w?'#7f1d1d':'#111827',r[2]); K.t(ctx,w?'A':'·',x+cw/2-1,80,{a:'center',m:1,c:w?'#fff':C.dim}); x+=cw; idx++; } x+=6; });
    let msg='';
    if(hit['canary']&&v.can) msg='Function epilogue compares canary → mismatch → __stack_chk_fail(): "*** stack smashing detected ***" abort. Attack becomes a crash (DoS), not code execution.';
    else if(hit['return addr']) msg='Return address overwritten with 0x4141414141414141. ret jumps there → SIGSEGV, or with a crafted payload, control-flow hijack. '+(v.aslr?'ASLR forces the attacker to leak an address first.':'Without ASLR, gadget addresses are fixed → ROP chain is trivial.');
    else if(hit['saved RBP']) msg='Saved frame pointer corrupted → caller crashes after return (confusing stack traces).';
    else if(shown>15) msg='Wrote 16 bytes + NUL terminator: off-by-one already overflows!';
    else msg='Within bounds. Note strcpy writes len+1 bytes (NUL). Prefer strlcpy/snprintf/std::string or bounds-checked spans.';
    K.t(ctx,'Outcome:',20,130,{b:1}); 
    const words=msg.split(' '); let line='',yy=152; words.forEach(wd=>{ if((line+wd).length>110){K.t(ctx,line,20,yy,{s:12,c:'#fecaca'}); yy+=18; line='';} line+=wd+' ';}); K.t(ctx,line,20,yy,{s:12,c:'#fecaca'});
    ro.textContent='Bytes written: '+(v.len+1)+' (incl. NUL). Layout shown is typical x86-64 with -fstack-protector-strong; exact order is compiler-dependent.';
  });
});

/* ---------- 5. memory ordering litmus ---------- */
defSim('memoryOrder','Memory-ordering litmus lab','Run thousands of randomized executions on a simulated machine. Pick a litmus test and a hardware/ordering model; see which outcomes become possible.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,250); let hist={}, total=0, running=false;
  const v=K.ctrls(root,[{sel:'test',label:'Litmus',v:'sb',opts:[['sb','Store buffering (Dekker)'],['mp','Message passing (flag/data)']],on:clr},
    {sel:'model',label:'Model',v:'tso',opts:[['sc','seq_cst / SC machine'],['tso','x86-TSO (store buffers)'],['arm','ARM weak + relaxed atomics'],['ra','ARM + release/acquire']],on:clr},
    {btn:'Run 2000',primary:1,on:()=>{for(let i=0;i<2000;i++)trial();}},{btn:'Clear',on:clr}]);
  const ro=K.readout(root);
  function clr(){hist={};total=0;}
  function trial(){ // simulate with per-thread store buffer + optional load reordering
    const mem={x:0,y:0,data:0,flag:0}; const sb=[[],[]]; const m=v.model;
    let prog = v.test==='sb' ? [[['st','x',1],['ld','y','r1']],[['st','y',1],['ld','x','r2']]] : [[['st','data',42],['st','flag',1]],[['ld','flag','r1'],['ld','data','r2']]];
    if(m==='arm'){ prog=prog.map(p=>Math.random()<0.5?[p[1],p[0]]:p); } // relaxed: independent ops may reorder (both loads and stores)
    if(m==='ra' && v.test==='sb'){ prog=prog; } // rel/acq does NOT forbid StoreLoad reordering
    const regs={}; const pc=[0,0];
    function flush(t){ const e=sb[t].shift(); if(e) mem[e[0]]=e[1]; }
    let guard=0;
    while((pc[0]<2||pc[1]<2||sb[0].length||sb[1].length) && guard++<50){
      const t=Math.random()<0.5?0:1; const r=Math.random();
      if((m==='tso'||m==='arm'||(m==='ra'&&v.test==='sb')) && sb[t].length && r<0.35){ flush(t); continue; }
      if(pc[t]>=2){ flush(t); continue; }
      const op=prog[t][pc[t]++];
      if(op[0]==='st'){ if(m==='sc'||(m==='ra'&&v.test==='mp')) mem[op[1]]=op[2]; else sb[t].push([op[1],op[2]]); }
      else { const own=sb[t].slice().reverse().find(e=>e[0]===op[1]); regs[op[2]]= own?own[1]:mem[op[1]]; }
    }
    const key = v.test==='sb' ? `r1=${regs.r1},r2=${regs.r2}` : `flag=${regs.r1},data=${regs.r2}`;
    hist[key]=(hist[key]||0)+1; total++;
  }
  K.loop(cv,()=>{ K.clear(ctx,W,H);
    const lines = v.test==='sb'? ['T1: x.store(1); r1 = y.load();','T2: y.store(1); r2 = x.load();','Forbidden under SC: r1=0,r2=0'] : ['T1: data = 42; flag.store(1);','T2: r1 = flag.load(); r2 = data;','Bug if: flag=1 but data=0'];
    lines.forEach((l,i)=>K.t(ctx,l,20,22+i*20,{m:1,s:12,c:i===2?C.warn:C.text}));
    const keys = v.test==='sb'?['r1=0,r2=0','r1=0,r2=1','r1=1,r2=0','r1=1,r2=1']:['flag=0,data=0','flag=0,data=42','flag=1,data=0','flag=1,data=42'];
    keys.forEach((k,i)=>{ const n=hist[k]||0; const frac=total?n/total:0; const x=40+i*200, base=225, h=frac*140;
      const bad=(k==='r1=0,r2=0'||k==='flag=1,data=0'); K.rr(ctx,x,base-h,120,h,4,bad?(n?C.bad:'#3f1d24'):C.accent);
      K.t(ctx,k,x+60,base+14,{a:'center',m:1,s:11,c:bad?C.bad:C.muted}); K.t(ctx,n+' ('+K.pct(frac)+')',x+60,base-h-10,{a:'center',s:11}); });
    const badKey=v.test==='sb'?'r1=0,r2=0':'flag=1,data=0'; const seen=hist[badKey]||0;
    ro.textContent=`trials=${total}. "${badKey}" observed ${seen} times.\n`+({sc:'SC: one global interleaving — the "impossible" outcome never appears.',tso:v.test==='sb'?'x86-TSO: each core\'s store sits in its store buffer while the later load reads memory → r1=r2=0 IS observable on real x86. Only seq_cst (mfence / lock xchg) prevents it.':'x86-TSO keeps store→store and load→load order, so MP is safe on x86 even with plain stores (but the compiler may still reorder without atomics!).',arm:'ARM/POWER with relaxed atomics: loads and stores to different addresses may reorder → both bugs appear.',ra:v.test==='sb'?'release/acquire does NOT order a store before a later load (StoreLoad). Dekker still breaks — you need seq_cst.':'release store of flag + acquire load of flag creates happens-before: data=42 guaranteed. This is the canonical publish pattern.'})[v.model];
  });
});

/* ---------- 6. virtual dispatch vs templates ---------- */
defSim('vtableDispatch','Dynamic vs static dispatch','Watch a call travel: object → vptr → vtable → function (virtual), or resolve at compile time (template/CRTP) where it can be inlined.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,250); let t=0, calls=0;
  const v=K.ctrls(root,[{sel:'mode',label:'Dispatch',v:'virt',opts:[['virt','virtual (runtime)'],['crtp','template / CRTP (compile time)'],['var','std::variant + visit']]},{sel:'mix',label:'Object types in loop',v:'same',opts:[['same','all the same type'],['rand','random mix']]},{k:'sp',label:'Speed',min:1,max:10,v:4}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ t+=dt*v.sp*0.25; if(t>1){t=0;calls++;} K.clear(ctx,W,H);
    const pts = v.mode==='virt'?[[60,120,'call s->area()'],[230,120,'Shape obj\n[vptr|w|h]'],[420,120,'vtable\n[dtor|area|draw]'],[640,120,'Rect::area()']] : v.mode==='crtp'?[[60,120,'area<Rect>(s)'],[640,120,'inlined: w*h']] : [[60,120,'visit(v)'],[300,120,'switch(index)'],[640,120,'Rect branch']];
    pts.forEach((p,i)=>{ K.rr(ctx,p[0]-10,p[1]-30,160,60,10,'#1e1b4b',C.accent); p[2].split('\n').forEach((s,j)=>K.t(ctx,s,p[0]+70,p[1]-8+j*18,{a:'center',m:1,s:11.5})); if(i<pts.length-1) K.arrow(ctx,p[0]+150,p[1],pts[i+1][0]-12,p[1],C.line,1.5); });
    const seg=pts.length-1, f=t*seg, si=Math.min(seg-1,Math.floor(f)), ft=f-si; const x=K.lerp(pts[si][0]+150,pts[si+1][0]-12,ft);
    ctx.beginPath(); ctx.arc(x,120,7,0,7); ctx.fillStyle=C.warn; ctx.fill();
    const loads = v.mode==='virt'?2:0; const mispredict = v.mix==='rand' && v.mode!=='crtp';
    K.t(ctx,'dependent loads per call: '+loads+'   indirect branch: '+(v.mode==='virt'?'yes':v.mode==='var'?'jump table/branches':'none')+'   inlinable: '+(v.mode==='crtp'?'yes':'only if devirtualized'),20,200,{s:12,c:C.muted});
    K.t(ctx,mispredict?'⚠ random type mix → branch target mispredicts (~15-20 cycles each)':'✓ predictable target → BTB predicts well; cost ≈ a few cycles',20,225,{s:12,c:mispredict?C.warn:C.good});
    ro.textContent=`calls animated: ${calls}\nVirtual call cost is rarely the vtable load itself; it is the lost inlining (no constant propagation, no vectorization across the call) and mispredicted indirect branches. Templates trade that for code bloat + compile time + no runtime heterogeneity. 'final' classes and LTO enable devirtualization.`;
  });
});

/* ---------- 7. syscall path through a char driver ---------- */
defSim('syscallPath','read() on /dev/mycam: user → kernel → driver','Follow one read() across the user/kernel boundary. Toggle data availability and O_NONBLOCK.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let step=0, acc=0, auto=true;
  const v=K.ctrls(root,[{chk:'data',label:'data ready in driver FIFO',v:true,on:()=>step=0},{chk:'nb',label:'O_NONBLOCK',v:false,on:()=>step=0},{btn:'Pause/Play',on:()=>auto=!auto},{btn:'Step',on:()=>step++}]);
  const ro=K.readout(root);
  const L=[['user app','read(fd, buf, 4096)',40],['libc','syscall(SYS_read) → svc #0 / syscall',85],['entry','trap: save regs, switch to kernel stack',130],['VFS','ksys_read → vfs_read → file->f_op->read',175],['driver','mycam_read(filp, ubuf, len, ppos)',220],['hw/IRQ','DMA done IRQ → wake_up_interruptible()',265]];
  function seq(){ if(v.data) return [[0,'call'],[1,'enter'],[2,'trap'],[3,'dispatch'],[4,'copy_to_user(ubuf, kbuf, n) → may fault, returns bytes not copied'],[3,'return n'],[2,'restore regs, sysret/eret'],[0,'read returns n bytes']];
    if(v.nb) return [[0,'call'],[1,'enter'],[2,'trap'],[3,'dispatch'],[4,'FIFO empty & O_NONBLOCK → return -EAGAIN'],[0,'read returns -1, errno=EAGAIN']];
    return [[0,'call'],[1,'enter'],[2,'trap'],[3,'dispatch'],[4,'FIFO empty → wait_event_interruptible(wq, cond): task sleeps (TASK_INTERRUPTIBLE), CPU runs others'],[5,'IRQ handler: data landed, wake_up_interruptible(&wq)'],[4,'re-check condition, copy_to_user()'],[2,'return to user'],[0,'read returns n bytes']]; }
  K.loop(cv,(dt)=>{ const s=seq(); if(auto){acc+=dt; if(acc>1.1){acc=0;step++;}} if(step>=s.length+1) step=0; const cur=s[Math.min(step,s.length-1)];

defSim('irqHalves','Interrupts: top half vs bottom half','IRQs arrive at a rate. Top half must be tiny (IRQs masked on that line/CPU). Defer heavy work to a threaded IRQ / workqueue / softirq.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,260); let events=[], time=0, nextIrq=0, missed=0, handled=0, maxLat=0, pending=0, busyUntil=0, bhQueue=0, userTime=0;
  const v=K.ctrls(root,[{k:'rate',label:'IRQ rate (k/s)',min:1,max:40,v:10},{k:'work',label:'Work per IRQ (µs)',min:5,max:120,v:40},{sel:'mode',label:'Design',v:'split',opts:[['top','all work in top half'],['split','top half + threaded/bottom half']]},{btn:'Reset',on:()=>{events=[];missed=handled=maxLat=0;bhQueue=0;userTime=0;time=0;nextIrq=0;busyUntil=0;}}]);
  const ro=K.readout(root); const SPAN=2000; // µs visible
  K.loop(cv,(dt)=>{ const simdt=dt*1000; // 1 real ms = 1 sim µs * 1000 → slow motion: 1s real = 1000µs
    const end=time+simdt; const period=1000/v.rate; // µs
    while(nextIrq<end){ // arrival
      if(busyUntil>nextIrq+period && v.mode==='top'){ missed++; } else {
        const start=Math.max(nextIrq,busyUntil); const top= v.mode==='top'? v.work : 3; busyUntil=start+top; maxLat=Math.max(maxLat,start-nextIrq); events.push({s:start,e:start+top,lane:0}); handled++;
        if(v.mode==='split'){ bhQueue+=v.work; } }
      nextIrq+=period*(0.6+Math.random()*0.8); }
    // bottom half / user task consume remaining CPU
    let t=Math.max(time,busyUntil); while(t<end){ const slot=Math.min(end-t,20); if(bhQueue>0){ const w=Math.min(slot,bhQueue); bhQueue-=w; events.push({s:t,e:t+w,lane:1}); t+=w; } else { events.push({s:t,e:t+slot,lane:2}); userTime+=slot; t+=slot; } }
    time=end; events=events.filter(e=>e.e>time-SPAN);
    K.clear(ctx,W,H); const lanes=['hardirq (masked)','threaded IRQ / BH','user task'], cols=[C.bad,C.warn,C.good];
    lanes.forEach((l,i)=>{ const y=40+i*60; K.t(ctx,l,10,y+15,{s:11,c:C.muted}); K.rr(ctx,150,y,690,30,4,'#0f1626'); });
    events.forEach(e=>{ const x1=150+690*(1-(time-e.s)/SPAN), x2=150+690*(1-(time-e.e)/SPAN); if(x2<150)return; ctx.fillStyle=cols[e.lane]; ctx.fillRect(Math.max(150,x1),40+e.lane*60+3,Math.max(1,x2-Math.max(150,x1)),24); });
    K.t(ctx,'← '+SPAN+' µs window (slow-motion)',150,225,{s:11,c:C.dim});
    const util=v.rate*v.work/1000; 
    ro.textContent=`handled=${handled}  missed/coalesced IRQs=${missed}  worst IRQ entry latency=${maxLat.toFixed(0)}µs  BH backlog=${bhQueue.toFixed(0)}µs\nCPU demand from this device = ${(util*100).toFixed(0)}%`+(util>1?' → OVERLOAD: no design fixes >100% — need NAPI-style polling, coalescing, or offload.':'')+(v.mode==='top'?'\nAll-in-top-half: every other interrupt waits behind you; latency for everything else balloons.':'\nSplit: top half acks the device & schedules work in a few µs; heavy lifting runs preemptible with IRQs enabled.');
  });
});

/* ---------- 10. DMA descriptor ring ---------- */
defSim('dmaRing','DMA RX descriptor ring (NIC/camera style)','Device writes into descriptors it OWNS; driver consumes and hands them back. Tune producer/consumer rates, ring size, and IRQ coalescing.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let ring=[], head=0, tail=0, drops=0, irqs=0, done=0, accP=0, accC=0, pendingIrq=0, polling=false;
  const v=K.ctrls(root,[{k:'n',label:'Ring size',min:8,max:64,v:16,on:init},{k:'p',label:'Device rate (pkts/s)',min:1,max:60,v:14},{k:'c',label:'Driver rate',min:1,max:60,v:18},{k:'co',label:'IRQ coalesce (pkts)',min:1,max:16,v:4},{chk:'napi',label:'NAPI polling (mask IRQ while busy)',v:true}]);
  const ro=K.readout(root);
  function init(){ ring=new Array(v.n).fill(0); head=tail=0; }
  init();
  K.loop(cv,(dt)=>{ if(ring.length!==v.n) init(); const n=v.n;
    accP+=dt*v.p; while(accP>=1){ accP--; if(ring[head]===0){ ring[head]=1; head=(head+1)%n; pendingIrq++; } else drops++; }
    if(pendingIrq>=v.co && !polling){ irqs++; pendingIrq=0; if(v.napi) polling=true; }
    const canConsume = v.napi ? polling : irqs>0;
    if(canConsume){ accC+=dt*v.c; while(accC>=1){ accC--; if(ring[tail]===1){ ring[tail]=0; tail=(tail+1)%n; done++; } else { if(v.napi) polling=false; accC=0; break; } } }
    K.clear(ctx,W,H); const cx=200, cy=150, R=110;
    for(let i=0;i<n;i++){ const a=i/n*Math.PI*2-Math.PI/2; const x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
      ctx.beginPath(); ctx.arc(x,y,Math.min(14,300/n),0,7); ctx.fillStyle=ring[i]?C.accent:'#1f2937'; ctx.fill(); ctx.strokeStyle=ring[i]?'#c4b5fd':C.line; ctx.stroke(); }
    function ptr(idx,col,label,off){ const a=idx/n*Math.PI*2-Math.PI/2; K.arrow(ctx,cx+(R+48+off)*Math.cos(a),cy+(R+48+off)*Math.sin(a),cx+(R+18)*Math.cos(a),cy+(R+18)*Math.sin(a),col,2); K.t(ctx,label,cx+(R+58+off)*Math.cos(a),cy+(R+58+off)*Math.sin(a),{a:'center',s:11,c:col,b:1}); }
    ptr(head,C.good,'HW head',0); ptr(tail,C.cyan,'SW tail',14);
    const fill=ring.reduce((a,b)=>a+b,0);
    K.t(ctx,'● filled (device wrote, driver must process)',420,40,{c:'#c4b5fd'}); K.t(ctx,'● empty (owned by device, ready for DMA)',420,62,{c:C.muted});
    K.t(ctx,'ring occupancy',420,100,{s:12}); K.rr(ctx,420,110,380,18,5,'#0f1626'); K.rr(ctx,420,110,380*fill/n,18,5,fill/n>0.8?C.bad:C.accent);
    K.t(ctx,'mode: '+(polling?'POLLING (IRQ masked)':'waiting for IRQ'),420,150,{c:polling?C.warn:C.good,b:1});
    ro.textContent=`processed=${done}  dropped(ring full)=${drops}  interrupts=${irqs}  pkts/IRQ≈${irqs?(done/irqs).toFixed(1):'-'}\nGotchas: device sees descriptors only after a write barrier (dma_wmb) + doorbell/tail register write; CPU must not read buffer before checking the DONE/OWN bit with dma_rmb; non-coherent SoCs need dma_sync_single_for_cpu().`;
  });
});

/* ---------- 11. page table walk + TLB ---------- */
defSim('pageWalk','Virtual → physical: 4-level page walk & TLB','x86-64/ARM64 4 KiB pages: 9+9+9+9+12 bits. A TLB miss costs up to 4 dependent memory loads. Try access patterns & huge pages.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,290); let tlb=[], hits=0, misses=0, cur=null, phase=0, acc=0, seqAddr=0x7f3a12345000;
  const v=K.ctrls(root,[{sel:'pat',label:'Access pattern',v:'seq',opts:[['seq','sequential (stride 64B)'],['page','stride 4 KiB'],['rand','random over 1 GiB']]},{chk:'huge',label:'2 MiB huge pages',v:false},{k:'tlb',label:'TLB entries',min:4,max:64,v:16},{k:'sp',label:'Speed',min:1,max:30,v:6},{btn:'Reset stats',on:()=>{hits=misses=0;tlb=[];}}]);
  const ro=K.readout(root);
  function next(){ if(v.pat==='seq') seqAddr+=64; else if(v.pat==='page') seqAddr+=4096; else seqAddr=0x7f0000000000+Math.floor(Math.random()*(1<<30)); return seqAddr; }
  K.loop(cv,(dt)=>{ acc+=dt*v.sp; if(acc>1){ acc=0; const a=next(); const shift=v.huge?21:12; const vpn=Math.floor(a/Math.pow(2,shift)); const hit=tlb.indexOf(vpn);
      if(hit>=0){ hits++; tlb.splice(hit,1); tlb.unshift(vpn); cur={a,hit:true}; } else { misses++; tlb.unshift(vpn); if(tlb.length>v.tlb) tlb.pop(); cur={a,hit:false}; phase=0; } }
    phase+=dt*v.sp*1.2;
    K.clear(ctx,W,H); if(!cur) return; const a=cur.a; const bits=[Math.floor(a/2**39)%512,Math.floor(a/2**30)%512,Math.floor(a/2**21)%512,Math.floor(a/2**12)%512,a%4096];
    K.t(ctx,'VA 0x'+a.toString(16),20,18,{m:1,b:1});
    const names=v.huge?['PGD/L0 [47:39]','PUD/L1 [38:30]','PMD/L2 [29:21]','offset [20:0]']:['PGD/L0 [47:39]','PUD/L1 [38:30]','PMD/L2 [29:21]','PTE/L3 [20:12]','offset [11:0]'];
    const vals=v.huge?[bits[0],bits[1],bits[2],a%(2**21)]:bits;
    names.forEach((nm,i)=>{ const x=20+i*165; K.rr(ctx,x,34,155,40,6,i===names.length-1?'#0c2a1f':'#1e1b4b',C.line); K.t(ctx,nm,x+8,46,{s:10.5,c:C.muted}); K.t(ctx,String(vals[i]),x+8,63,{m:1,b:1}); });
    const levels=names.length-1;
    for(let i=0;i<levels;i++){ const x=20+i*165; const active=!cur.hit && phase>i; K.rr(ctx,x,110,155,90,8,active?'#2e1065':'#111827',active?C.accent:C.line); K.t(ctx,'table L'+i,x+8,124,{s:11,b:1}); K.t(ctx,'entry['+vals[i]+'] → next',x+8,145,{m:1,s:10.5,c:C.muted}); K.t(ctx,'~'+(i<2?'cache hit':'maybe DRAM'),x+8,165,{s:10,c:C.dim}); if(i<levels-1) K.arrow(ctx,x+155,155,x+165,155,active?C.accent:C.line); }
    K.rr(ctx,20+levels*165,110,155,90,8,'#0c2a1f',C.good); K.t(ctx,'physical page',28+levels*165,124,{s:11,b:1}); K.t(ctx,v.huge?'2 MiB frame':'4 KiB frame',28+levels*165,145,{s:10.5,c:C.muted});
    K.t(ctx,cur.hit?'TLB HIT → translation in ~1 cycle':'TLB MISS → hardware page walk ('+levels+' dependent loads)',20,225,{b:1,c:cur.hit?C.good:C.warn});
    K.t(ctx,'TLB: ',20,255,{s:11,c:C.muted}); for(let i=0;i<v.tlb;i++){ K.rr(ctx,60+i*12,247,10,16,2,i<tlb.length?C.cyan:'#1f2937'); }
    const reach=v.tlb*(v.huge?2048:4); ro.textContent=`hits=${hits} misses=${misses} hit-rate=${hits+misses?K.pct(hits/(hits+misses)):'-'}   TLB reach = ${v.tlb} × ${v.huge?'2 MiB':'4 KiB'} = ${reach>=1024?(reach/1024).toFixed(0)+' MiB':reach+' KiB'}\nRandom access over a working set ≫ TLB reach thrashes the TLB; huge pages multiply reach by 512. Context switch without ASID/PCID flushes the TLB.`;
  });
});

defSim('scheduler','Fair scheduler: vruntime & weights','Each tick the runnable task with the smallest virtual runtime runs. vruntime advances slower for heavier (lower nice) tasks.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,270); const WT={'-10':9548,'-5':3121,'0':1024,'5':335,'10':110};
  let tasks=[], acc=0, cur=-1, seq=[];
  function reset(){ tasks=[{n:'video_enc',nice:-5,vr:0,cpu:0,io:false},{n:'ui',nice:0,vr:0,cpu:0,io:false},{n:'logger',nice:10,vr:0,cpu:0,io:false},{n:'net_rx (I/O bound)',nice:0,vr:0,cpu:0,io:true,sleep:0}]; seq=[]; }
  reset();
  const v=K.ctrls(root,[{k:'n0',label:'video_enc nice',min:-10,max:10,step:5,v:-5,on:x=>tasks[0].nice=x},{k:'n2',label:'logger nice',min:-10,max:10,step:5,v:10,on:x=>tasks[2].nice=x},{k:'sp',label:'Speed',min:1,max:30,v:10},{btn:'Reset',on:reset}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ acc+=dt*v.sp; while(acc>1){ acc--; // one 1ms tick
      tasks.forEach(t=>{ if(t.io){ if(t.sleep>0){t.sleep--; if(t.sleep===0){ const minv=Math.min(...tasks.filter(x=>!x.sleep).map(x=>x.vr)); t.vr=Math.max(t.vr,minv-3); }} } });
      const run=tasks.map((t,i)=>[t,i]).filter(x=>!x[0].sleep).sort((a,b)=>a[0].vr-b[0].vr)[0]; if(!run) continue; cur=run[1]; const t=run[0];
      t.vr+=1024/WT[t.nice]; t.cpu++; seq.push(cur); if(seq.length>120) seq.shift();
      if(t.io && Math.random()<0.5) t.sleep=K.ri(3,8); }
    K.clear(ctx,W,H); const cols=[C.accent,C.cyan,C.dim,C.good]; const total=tasks.reduce((s,t)=>s+t.cpu,0)||1; const maxv=Math.max(...tasks.map(t=>t.vr))||1; const minv=Math.min(...tasks.map(t=>t.vr));
    tasks.forEach((t,i)=>{ const y=24+i*42; K.t(ctx,t.n+'  nice '+t.nice+'  w='+WT[t.nice],20,y+8,{s:11.5,b:i===cur,c:i===cur?'#fff':C.muted}); 
      const bw=(t.vr-minv+1)/(maxv-minv+1)*300; K.rr(ctx,250,y,bw,18,4,cols[i]); K.t(ctx,'vruntime '+t.vr.toFixed(1)+(t.sleep?' (sleeping)':''),560,y+9,{s:11,m:1,c:C.muted});
      K.t(ctx,K.pct(t.cpu/total)+' CPU',760,y+9,{s:11,b:1}); });
    K.t(ctx,'CPU timeline (latest ticks →)',20,200,{s:11,c:C.muted}); seq.forEach((s,i)=>{ ctx.fillStyle=cols[s]; ctx.fillRect(20+i*6.8,212,6,30); });
    ro.textContent='Weight ratio nice 0 : nice 5 ≈ 3:1 (each nice step ≈ 1.25× CPU). Sleeping task is placed near min_vruntime on wakeup so it gets prompt service but cannot bank unlimited credit. Linux 6.6+ replaced CFS picking with EEVDF (adds per-task lag/deadline for latency) — same fairness intuition. RT classes (SCHED_FIFO) always preempt these.';
  });
});

/* ---------- 15. I2C transaction ---------- */
defSim('i2cBus','I²C transaction on the wire','Register read: START · addr+W · ACK · reg · ACK · Sr · addr+R · ACK · data · NACK · STOP. Change pull-up, speed, address presence, clock stretching.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,270); let t=0;
  const v=K.ctrls(root,[{sel:'spd',label:'Speed',v:'400',opts:[['100','100 kHz standard'],['400','400 kHz fast'],['1000','1 MHz fast-plus']]},{k:'rp',label:'Pull-up (kΩ)',min:1,max:20,v:4.7,step:0.1},{k:'cb',label:'Bus capacitance (pF)',min:20,max:400,v:100,step:10},{chk:'nack',label:'device absent (addr NACK)',v:false},{chk:'str',label:'slave clock-stretches',v:false}]);
  const ro=K.readout(root);
  function bitsFor(){ const seq=[['S']]; const addr=0x1a; const push=(byte,lab)=>{ for(let i=7;i>=0;i--) seq.push(['b',(byte>>i)&1,lab]); };
    push((addr<<1)|0,'addr 0x1A + W'); seq.push(['ack',v.nack?1:0]); if(v.nack){seq.push(['P']);return seq;}
    push(0x0C,'reg 0x0C'); seq.push(['ack',0]); seq.push(['Sr']); push((addr<<1)|1,'addr + R'); seq.push(['ack',0]); if(v.str) seq.push(['stretch']); push(0x5A,'data 0x5A'); seq.push(['ack',1]); seq.push(['P']); return seq; }
  K.loop(cv,(dt)=>{ t+=dt*8; const seq=bitsFor(); const tau=v.rp*1e3*v.cb*1e-12; const period=1/(v.spd*1e3); const riseFrac=Math.min(1,0.85*tau/(period/2)); // 0.8473*RC for 30%-70%
    K.clear(ctx,W,H); const x0=60, cw=Math.max(14,(W-80)/seq.length); const ySCL=60, ySDA=150, A=40; const shown=Math.min(seq.length,Math.floor(t));
    K.t(ctx,'SCL',20,ySCL-A/2,{b:1,c:C.cyan}); K.t(ctx,'SDA',20,ySDA-A/2,{b:1,c:C.warn});
    function seg(y,x,w,from,to,col){ // with RC rise
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath(); const yv=b=>y-(b?A:0); ctx.moveTo(x,yv(from)); if(to>from){ const rx=w*riseFrac; for(let k=0;k<=10;k++){ const xx=x+rx*k/10; const p=1-Math.exp(-3*k/10); ctx.lineTo(xx,y-A*(from+(to-from)*p)); } ctx.lineTo(x+w,yv(to)); } else { ctx.lineTo(x+1,yv(to)); ctx.lineTo(x+w,yv(to)); } ctx.stroke(); }
    let prevSda=1, prevScl=1;
    for(let i=0;i<shown;i++){ const s=seq[i], x=x0+i*cw; let sda, label='', col=C.warn;
      if(s[0]==='S'||s[0]==='Sr'){ seg(ySDA,x,cw,prevSda,0,C.warn); seg(ySCL,x,cw,prevScl,1,C.cyan); prevSda=0; prevScl=1; label=s[0]; K.t(ctx,label,x+cw/2,ySDA+18,{a:'center',s:11,b:1,c:C.pink}); continue; }
      if(s[0]==='P'){ seg(ySCL,x,cw/2,prevScl,1,C.cyan); seg(ySCL,x+cw/2,cw/2,1,1,C.cyan); seg(ySDA,x,cw/2,prevSda,0,C.warn); seg(ySDA,x+cw/2,cw/2,0,1,C.warn); prevSda=1; prevScl=1; K.t(ctx,'P',x+cw/2,ySDA+18,{a:'center',s:11,b:1,c:C.pink}); continue; }
      if(s[0]==='stretch'){ seg(ySCL,x,cw,0,0,C.bad); seg(ySDA,x,cw,prevSda,prevSda,C.warn); prevScl=0; K.t(ctx,'stretch',x+cw/2,ySCL+16,{a:'center',s:10,c:C.bad}); continue; }
      sda = s[0]==='ack'? s[1] : s[1];
      seg(ySDA,x,cw,prevSda,sda,s[0]==='ack'?(s[1]?C.bad:C.good):C.warn); prevSda=sda;
      seg(ySCL,x,cw/2,prevScl,0,C.cyan); seg(ySCL,x+cw/2,cw/2,0,1,C.cyan); prevScl=1;
      K.t(ctx,s[0]==='ack'?(s[1]?'NACK':'ACK'):String(s[1]),x+cw/2,ySDA+18,{a:'center',s:10,m:1,c:s[0]==='ack'?(s[1]?C.bad:C.good):C.muted});
      if(s[2] && (i===0||seq[i-1][2]!==s[2])) K.t(ctx,s[2],x,ySDA+40,{s:10.5,c:C.accent}); }
    if(t>seq.length+6) t=0;
    const riseNs=0.8473*tau*1e9; const maxRise={100:1000,400:300,1000:120}[v.spd];
    K.t(ctx,'rise time t_r ≈ 0.847·Rp·Cb = '+riseNs.toFixed(0)+' ns  (spec max '+maxRise+' ns)',20,250,{s:12,b:1,c:riseNs>maxRise?C.bad:C.good});
    ro.textContent=(riseNs>maxRise?'⚠ Edges too slow for this speed: lower Rp or capacitance, or slow the bus. Symptom: intermittent NACKs/garbage only at 400k+ or only on long flex cables.\n':'')+(v.nack?'Address NACK → driver sees -ENXIO/-EREMOTEIO. Check: power/reset GPIO of the device, 7-bit vs 8-bit address confusion (0x1A vs 0x34), pinmux, wrong bus number in DT.':'Repeated START (Sr) keeps bus ownership between write-of-register-pointer and the read. Master NACKs the last byte to tell the slave to release SDA.')+(v.str?'\nClock stretching: slave holds SCL low while it prepares data; some SoC I²C controllers/bit-banged drivers mishandle it.':'');
  });
});

defSim('cacheSim','Cache lines & traversal order','Sum a 2D int array. Row-major walks consecutive bytes (one miss per 64B line = 16 ints); column-major jumps a whole row each access.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,290); let i=0, hits=0, misses=0, cache=[], acc=0;
  const v=K.ctrls(root,[{sel:'ord',label:'Loop order',v:'row',opts:[['row','for i, for j: a[i][j]'],['col','for j, for i: a[i][j]']],on:rs},{k:'n',label:'Matrix N×N',min:16,max:64,step:16,v:32,on:rs},{k:'lines',label:'Cache lines',min:4,max:64,v:16,on:rs},{k:'sp',label:'Speed',min:1,max:200,v:40}]);
  const ro=K.readout(root);
  function rs(){i=0;hits=misses=0;cache=[];}
  K.loop(cv,(dt)=>{ const N=v.n; acc+=dt*v.sp; let steps=Math.floor(acc); acc-=steps; let last=-1;
    while(steps-->0 && i<N*N){ const r= v.ord==='row'? Math.floor(i/N) : i%N; const c= v.ord==='row'? i%N : Math.floor(i/N); const addr=(r*N+c)*4; const line=Math.floor(addr/64);
      const k=cache.indexOf(line); if(k>=0){hits++; cache.splice(k,1);} else {misses++; if(cache.length>=v.lines) cache.pop();} cache.unshift(line); last=r*N+c; i++; }
    K.clear(ctx,W,H); const cell=Math.min(260/N,8);
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const idx=r*N+c; const line=Math.floor(idx*4/64); const inC=cache.indexOf(line)>=0; const visited = v.ord==='row'? idx<i : (c*N+r)<i;
      ctx.fillStyle= inC?'#0891b2': visited?'#312e81':'#111827'; ctx.fillRect(20+c*cell,20+r*cell,cell-0.5,cell-0.5); }
    const tot=hits+misses; const ns=hits*1+misses*80; 
    K.t(ctx,'cyan = currently cached lines, indigo = visited',320,30,{s:12,c:C.muted});
    K.t(ctx,'hits '+hits+'   misses '+misses+'   hit rate '+(tot?K.pct(hits/tot):'-'),320,60,{b:1});
    K.t(ctx,'est. time ≈ '+(ns/1000).toFixed(1)+' µs  (1 ns/hit, ~80 ns/DRAM miss)',320,85,{s:12});
    const lat=[['L1 hit','~1 ns (4 cyc)'],['L2','~4 ns'],['L3','~12-40 ns'],['DRAM','~80-120 ns'],['NVMe read','~10-100 µs']];
    lat.forEach((l,j)=>{ K.t(ctx,l[0],320,125+j*22,{s:12,c:C.muted}); K.t(ctx,l[1],420,125+j*22,{s:12,m:1}); });
    if(i>=N*N) K.t(ctx,'done — try the other order',320,250,{c:C.warn,b:1});
    ro.textContent='Row-major in C/C++: a[i][j] and a[i][j+1] are adjacent. Column walk with N*4 ≥ 64 bytes touches a new line every access; if N lines don’t fit in cache, every access misses. Real CPUs add hardware prefetchers (help strided too, up to a point) — the gap on real hardware is still 3-10×.';
  });
});

/* ---------- 19. lock contention race ---------- */
defSim('lockRace','Contention race: mutex vs spinlock vs lock-free CAS','N threads repeatedly enter a short critical section. Watch what each thread spends its time on.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let th=[], holder=-1, ops=0, burn=0, tick=0, hist=[];
  const v=K.ctrls(root,[{sel:'mode',label:'Primitive',v:'mutex',opts:[['mutex','mutex (futex: spin briefly, then sleep)'],['spin','spinlock (test-and-set)'],['cas','lock-free CAS loop']],on:rs},{k:'n',label:'Threads',min:1,max:12,v:6,on:rs},{k:'cs',label:'Critical section (ticks)',min:1,max:12,v:3},{k:'cores',label:'Cores',min:1,max:12,v:4,on:rs},{k:'sp',label:'Speed',min:1,max:30,v:12}]);
  const ro=K.readout(root); let acc=0;
  function rs(){ th=[]; for(let i=0;i<v.n;i++) th.push({st:'work',left:K.ri(2,8),hist:[]}); holder=-1; ops=0; burn=0; tick=0; }
  rs();
  K.loop(cv,(dt)=>{ acc+=dt*v.sp; while(acc>1){ acc--; tick++;
      // cores: only first `cores` runnable threads make progress (simple round-robin by tick)
      const runnable=th.map((t,i)=>i).filter(i=>th[i].st!=='sleep'); const rot=tick%Math.max(1,runnable.length); const onCpu=new Set(runnable.slice(rot).concat(runnable.slice(0,rot)).slice(0,v.cores));
      th.forEach((t,i)=>{ let mark='off';
        if(t.st==='sleep'){ mark='sleep'; }
        else if(!onCpu.has(i)){ mark='off'; }
        else if(t.st==='work'){ mark='work'; if(--t.left<=0){ t.st='want'; t.spins=0; } }
        else if(t.st==='want'){
          if(v.mode==='cas'){ // optimistic: read, compute, CAS
            t.st='cs'; t.left=v.cs; t.cas=true; mark='cs'; }
          else if(holder===-1){ holder=i; t.st='cs'; t.left=v.cs; mark='cs'; }
          else { if(v.mode==='spin'){ mark='spin'; burn++; } else { t.spins++; if(t.spins>2){ t.st='sleep'; mark='sleep'; } else { mark='spin'; burn++; } } } }
        else if(t.st==='cs'){ mark='cs'; if(--t.left<=0){
            if(v.mode==='cas'){ // succeeded only if nobody else committed during our window
              if(Math.random() < 1/Math.max(1,th.filter(x=>x.st==='cs').length)){ ops++; t.st='work'; t.left=K.ri(2,8); }
              else { t.st='want'; mark='retry'; burn+=v.cs; } }
            else { ops++; holder=-1; t.st='work'; t.left=K.ri(2,8); const sl=th.findIndex(x=>x.st==='sleep'); if(sl>=0 && v.mode==='mutex'){ th[sl].st='wake'; th[sl].left=3; } } } }
        else if(t.st==='wake'){ mark='wake'; if(--t.left<=0){ t.st='want'; t.spins=0; } }
        t.hist.push(mark); if(t.hist.length>110) t.hist.shift(); });
      th.forEach(t=>{ if(t.st==='sleep' && v.mode!=='mutex') t.st='want'; }); }
    K.clear(ctx,W,H); const col={work:C.blue,cs:C.good,spin:C.orange,sleep:'#374151',off:'#151d2b',retry:C.bad,wake:C.pink};
    th.forEach((t,i)=>{ const y=16+i*Math.min(22,240/th.length); K.t(ctx,'T'+i,10,y+6,{s:10,c:C.muted}); t.hist.forEach((m,k)=>{ ctx.fillStyle=col[m]; ctx.fillRect(34+k*7.3,y,7,Math.min(18,220/th.length)); }); });
    Object.entries({work:'own work',cs:'critical section',spin:'spinning (burning CPU)',sleep:'sleeping (futex wait)',wake:'wakeup latency',retry:'CAS failed → redo',off:'not scheduled'}).forEach((e,k)=>{ const x=20+k*120; K.rr(ctx,x,272,12,12,2,col[e[0]]); K.t(ctx,e[1],x+16,278,{s:10,c:C.muted}); });
    ro.textContent=`completed critical sections: ${ops}   wasted CPU ticks (spin/retry): ${burn}   throughput: ${(ops/Math.max(1,tick)*100).toFixed(1)} ops/100 ticks\nSpinlocks win only when hold time < context-switch cost AND threads ≤ cores (and never in user space with preemption). With threads > cores a spinner can burn a whole timeslice while the holder is descheduled. Lock-free ≠ faster under heavy contention: CAS retries + cache-line ping-pong; its real win is progress guarantees (no convoys, no priority inversion).`;
  });
});

/* ---------- 20. SPSC ring ---------- */
defSim('spscRing','Lock-free SPSC ring buffer','Producer owns head, consumer owns tail. One slot stays empty to distinguish full from empty. Toggle the classic ordering bug.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,240); const N=12; let buf=new Array(N).fill(null), head=0, tail=0, pAcc=0, cAcc=0, seq=0, stale=0, ok=0, drops=0, lastRead='';
  const v=K.ctrls(root,[{k:'p',label:'Producer rate',min:1,max:30,v:8},{k:'c',label:'Consumer rate',min:1,max:30,v:7},{chk:'bug',label:'BUG: publish head before writing data (relaxed)',v:false}]);
  const ro=K.readout(root); let pending=null;
  K.loop(cv,(dt)=>{ pAcc+=dt*v.p; cAcc+=dt*v.c;
    while(pAcc>=1){ pAcc--; const nh=(head+1)%N; if(nh===tail){ drops++; continue; }
      if(v.bug && Math.random()<0.4){ buf[head]={v:-1,ok:false}; pending={i:head,val:seq}; head=nh; } else { buf[head]={v:seq,ok:true}; head=nh; } seq++; }
    if(pending && Math.random()<0.5){ buf[pending.i]={v:pending.val,ok:true}; pending=null; }
    while(cAcc>=1){ cAcc--; if(tail===head) break; const e=buf[tail]; if(e && e.ok){ ok++; lastRead='read #'+e.v; } else { stale++; lastRead='read GARBAGE (data not yet visible)'; } buf[tail]=null; tail=(tail+1)%N; }
    K.clear(ctx,W,H); const cw=60;
    for(let i=0;i<N;i++){ const x=40+i*cw; const e=buf[i]; const occ = head>=tail ? (i>=tail&&i<head) : (i>=tail||i<head);
      K.rr(ctx,x,80,cw-6,50,6,occ?(e&&e.ok?'#2e1065':'#7f1d1d'):'#111827',C.line); K.t(ctx,occ&&e?(e.ok?'#'+e.v:'??'):'',x+cw/2-3,105,{a:'center',m:1,s:11}); K.t(ctx,String(i),x+cw/2-3,142,{a:'center',s:10,c:C.dim}); }
    K.arrow(ctx,40+head*cw+cw/2-3,40,40+head*cw+cw/2-3,76,C.good,2); K.t(ctx,'head (producer writes here)',40+head*cw,32,{s:11,c:C.good});
    K.arrow(ctx,40+tail*cw+cw/2-3,190,40+tail*cw+cw/2-3,134,C.cyan,2); K.t(ctx,'tail (consumer reads here)',40+tail*cw,200,{s:11,c:C.cyan});
    ro.textContent=`ok reads=${ok}  garbage reads=${stale}  full-drops=${drops}   last: ${lastRead}\nCorrect: write slot; head.store(nh, memory_order_release). Consumer: h = head.load(acquire); read slot; tail.store(nt, release). Producer checks fullness with tail.load(acquire). Put head and tail on different cache lines; cache the other side's index locally to cut coherence traffic. Power-of-two size lets you mask instead of modulo.`;
  });
});

/* ---------- 21. priority inversion ---------- */
defSim('priorityInversion','Priority inversion (Mars Pathfinder, 1997)','L takes a mutex, H blocks on it, M preempts L… and H waits for an unrelated task. Toggle priority inheritance.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,240); let t=0;
  const v=K.ctrls(root,[{chk:'pi',label:'priority inheritance (PTHREAD_PRIO_INHERIT / rt_mutex)',v:false,on:()=>t=0},{btn:'Replay',primary:1,on:()=>t=0}]);
  const ro=K.readout(root);
  function sched(pi){ // returns per-tick runner and states
    const T=60; const out=[]; let Lcs=8, Lwork=0, Hneed=4, Mwork=20, Hdone=-1; let lHas=false, lStarted=false;
    for(let k=0;k<T;k++){ const Hready=k>=6, Mready=k>=10 && Mwork>0; let run='idle';
      const Hblocked = Hready && Hneed>0 && lHas; const LeffHigh = pi && Hblocked;
      if(Hready && Hneed>0 && !lHas){ run='H'; Hneed--; if(Hneed===0) Hdone=k; }
      else if(LeffHigh && Lcs>0){ run='L*'; }
      else if(Mready){ run='M'; Mwork--; }
      else if(Lcs>0 || !lStarted){ run='L'; }
      if(run==='L'||run==='L*'){ if(!lStarted){lStarted=true; lHas=true;} Lcs--; if(Lcs<=0) lHas=false; }
      out.push({run,Hblocked}); }
    return {out,Hdone}; }
  K.loop(cv,(dt)=>{ t+=dt*8; const s=sched(v.pi); const shown=Math.min(60,Math.floor(t)); K.clear(ctx,W,H);
    ['H (high, 1ms deadline)','M (medium, long work)','L (low, holds mutex)'].forEach((n,i)=>{ const y=30+i*50; K.t(ctx,n,10,y+12,{s:11,c:C.muted}); K.rr(ctx,170,y,660,26,4,'#0f1626'); });
    for(let k=0;k<shown;k++){ const e=s.out[k]; const x=170+k*11; const lane={H:0,M:1,L:2,'L*':2}[e.run]; if(lane!==undefined){ ctx.fillStyle=e.run==='L*'?C.pink:[C.bad,C.warn,C.good][lane]; ctx.fillRect(x,30+lane*50+2,10,22); }
      if(e.Hblocked){ ctx.fillStyle='rgba(248,113,113,.25)'; ctx.fillRect(x,32,10,22); } }
    K.t(ctx,'shaded red = H blocked on mutex held by L',170,190,{s:11,c:C.bad}); if(v.pi) K.t(ctx,'pink = L running at H’s inherited priority',470,190,{s:11,c:C.pink});
    ro.textContent= s.Hdone>=0? `H finished at tick ${s.Hdone}. `+(v.pi?'With inheritance L is boosted, finishes its critical section quickly, H runs; M waits (correct).':'Without inheritance M (which H does not even depend on) ran first → unbounded inversion. Pathfinder\'s watchdog reset the spacecraft until JPL enabled priority inheritance on the VxWorks mutex remotely.') : 'running…';
  });
});
})();

<script>/* js/sims-gpu.js */
/* Sims for GPU/CUDA and AI inference serving */
(function(){
const {C} = SimKit;

defSim('warpDivergence','Warp divergence visualizer (SIMT)','32 lanes share one instruction stream. A data-dependent branch serializes both paths with inactive lanes masked off.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let t=0;
  const v=K.ctrls(root,[{sel:'br',label:'Branch condition',v:'half',opts:[['none','none (uniform)'],['warp','if (warpId % 2) — warp-uniform'],['half','if (threadIdx.x % 2) — alternating'],['data','if (data[i] > thr) — random 30%'],['loop','loop count = threadIdx.x % 8']]},{k:'sp',label:'Speed',min:1,max:10,v:4}]);
  const ro=K.readout(root); let pattern=null, last='';
  function mk(){ const p=[]; for(let i=0;i<32;i++){ p.push(v.br==='none'||v.br==='warp'?1:v.br==='half'?(i%2):v.br==='data'?(Math.random()<0.3?1:0):i%8); } return p; }
  K.loop(cv,(dt)=>{ if(last!==v.br){ pattern=mk(); last=v.br; t=0; } t+=dt*v.sp;
    K.clear(ctx,W,H); let phases;
    if(v.br==='loop'){ phases=[]; for(let it=0;it<8;it++) phases.push({name:'loop iter '+it, mask:pattern.map(c=>c>it)}); }
    else if(v.br==='none'||v.br==='warp') phases=[{name:'A (all lanes)',mask:pattern.map(()=>true)}];
    else phases=[{name:'if-path',mask:pattern.map(c=>c===1)},{name:'else-path',mask:pattern.map(c=>c===0)}];
    phases.push({name:'reconverge',mask:pattern.map(()=>true)});
    const cur=Math.floor(t)%(phases.length+2);
    for(let i=0;i<32;i++){ const x=20+i*25.5; K.t(ctx,String(i),x+11,18,{a:'center',s:9,c:C.dim});
      phases.forEach((ph,k)=>{ const y=30+k*Math.min(26,200/phases.length); const active=ph.mask[i]; const now=k===cur;
        K.rr(ctx,x,y,22,Math.min(22,190/phases.length),3,active?(now?C.good:'#14532d'):(now?'#3f1d24':'#111827')); }); }
    phases.forEach((ph,k)=>{ const y=30+k*Math.min(26,200/phases.length); K.t(ctx,ph.name,840,y+8,{a:'right',s:10,c:k===cur?'#fff':C.muted}); });
    const util = phases.reduce((s,p)=>s+p.mask.filter(Boolean).length,0)/(phases.length*32);
    K.t(ctx,'issue slots used: '+phases.length+' passes   SIMD efficiency: '+K.pct(util),20,262,{b:1,c:util>0.9?C.good:C.warn});
    ro.textContent='Divergence costs only within a warp; warp-uniform branches are free. Since Volta, independent thread scheduling lets diverged lanes interleave (needed for intra-warp locks) but they still do not execute simultaneously. Fixes: sort/bin work by branch, make branches warp-uniform, use predication-friendly arithmetic (select instead of if), or move rare paths to a separate kernel.';
  });
});

defSim('coalescing','Global memory coalescing & shared-memory bank conflicts','A warp’s 32 loads are merged into 32-byte sectors. Stride and alignment decide how many transactions you pay for.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280);
  const v=K.ctrls(root,[{sel:'pat',label:'Access a[f(tid)] (4B floats)',v:'1',opts:[['1','a[tid] (stride 1)'],['2','a[2*tid]'],['32','a[32*tid] (AoS / column walk)'],['off','a[tid+1] (misaligned)'],['rand','a[random]']]},{sel:'smem',label:'Shared mem s[tid*k]',v:'1',opts:[['1','k=1'],['2','k=2 (2-way conflict)'],['32','k=32 (32-way)'],['33','k=33 (padding trick)']]}]);
  const ro=K.readout(root); let t=0;
  K.loop(cv,(dt)=>{ t+=dt; K.clear(ctx,W,H); const addrs=[]; for(let i=0;i<32;i++){ addrs.push(v.pat==='1'?i:v.pat==='2'?2*i:v.pat==='32'?32*i:v.pat==='off'?i+1:Math.floor(Math.random()*1024)); }
    if(v.pat==='rand' && Math.floor(t*2)%2) {} 
    const sectors=new Set(addrs.map(a=>Math.floor(a*4/32)));
    K.t(ctx,'warp lanes',20,16,{s:11,c:C.muted});
    for(let i=0;i<32;i++){ K.rr(ctx,20+i*25.5,24,22,18,3,C.accent); }
    const maxA=Math.max(...addrs)+1; const scale=Math.min(25.5, 816/Math.max(32,maxA)*1);
    K.t(ctx,'32-byte sectors touched (each = 8 floats)',20,90,{s:11,c:C.muted});
    const secList=[...sectors].sort((a,b)=>a-b);
    secList.slice(0,64).forEach((s,k)=>{ K.rr(ctx,20+(k%32)*25.5,100+Math.floor(k/32)*24,22,18,3,C.cyan); });
    addrs.forEach((a,i)=>{ const k=secList.indexOf(Math.floor(a*4/32)); if(k<64) K.line(ctx,31+i*25.5,42,31+(k%32)*25.5,100+Math.floor(k/32)*24,'rgba(124,92,255,.35)'); });
    const useful=128, moved=sectors.size*32;
    K.t(ctx,'transactions: '+sectors.size+' sectors · bytes moved '+moved+' for 128 useful → efficiency '+K.pct(useful/moved),20,165,{b:1,c:useful/moved>0.9?C.good:C.warn});
    // shared memory banks
    const k=+v.smem; const banks=new Array(32).fill(0); for(let i=0;i<32;i++) banks[(i*k)%32]++; const way=Math.max(...banks);
    K.t(ctx,'shared memory: 32 banks × 4B; conflict degree = max lanes on one bank',20,195,{s:11,c:C.muted});
    for(let b=0;b<32;b++){ const hh=banks[b]*4; K.rr(ctx,20+b*25.5,260-Math.min(50,hh),22,Math.min(50,hh),2,banks[b]>1?C.bad:C.good); }
    K.t(ctx,way+'-way '+(way>1?'conflict → '+way+' serialized wavefronts':'(conflict-free)'),600,205,{b:1,c:way>1?C.bad:C.good});
    ro.textContent='Fix strided global access by restructuring to SoA, or stage a tile through shared memory: coalesced load into smem, then read transposed. For the transpose, declare tile[32][33] — the +1 padding column shifts each row by one bank so column reads become conflict-free.';
  });
});

defSim('occupancy','Occupancy calculator (SM resource limits)','Occupancy = resident warps / max warps per SM. Limited by registers, shared memory, block size and the block-slot cap. Numbers modeled on an A100-class SM (64 warps, 64K regs, 164 KB smem, 32 blocks).',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,220);
  const v=K.ctrls(root,[{k:'bs',label:'Threads/block',min:32,max:1024,step:32,v:256},{k:'reg',label:'Registers/thread',min:16,max:255,v:64},{k:'sm',label:'Shared mem/block (KB)',min:0,max:100,v:16}]);
  const ro=K.readout(root);
  K.loop(cv,()=>{ const warpsPerBlock=Math.ceil(v.bs/32); const regsPerWarp=Math.ceil(v.reg*32/256)*256;
    const byWarps=Math.floor(64/warpsPerBlock), byRegs=Math.floor(65536/(regsPerWarp*warpsPerBlock)), bySmem=v.sm>0?Math.floor(164/v.sm):99, byBlocks=32;
    const blocks=Math.max(0,Math.min(byWarps,byRegs,bySmem,byBlocks)); const warps=blocks*warpsPerBlock; const occ=warps/64;
    K.clear(ctx,W,H); const lim=[['warp slots',byWarps],['registers',byRegs],['shared mem',bySmem],['block slots',byBlocks]]; const minv=Math.min(...lim.map(l=>l[1]));
    lim.forEach((l,i)=>{ const y=24+i*34; K.t(ctx,l[0],20,y+9,{s:12,c:C.muted}); K.rr(ctx,130,y,Math.min(400,l[1]*12.5),20,4,l[1]===minv?C.bad:C.accent); K.t(ctx,'max '+l[1]+' blocks',140+Math.min(400,l[1]*12.5),y+10,{s:11}); });
    for(let i=0;i<64;i++){ K.rr(ctx,580+(i%8)*30,20+Math.floor(i/8)*22,26,18,3,i<warps?C.good:'#1f2937'); }
    K.t(ctx,'occupancy '+K.pct(occ)+' ('+warps+'/64 warps)',580,200,{b:1,c:occ>=0.5?C.good:C.warn});
    ro.textContent=`limiter: ${lim.find(l=>l[1]===minv)[0]}. Higher occupancy hides memory latency by having other warps ready to issue — but it is a means, not a goal: many tuned GEMM kernels run at 25-50% occupancy using ILP and big register tiles. Use __launch_bounds__ / -maxrregcount to trade registers for occupancy, and watch for spills to local memory.`;
  });
});

defSim('roofline','Roofline model','Attainable FLOP/s = min(peak compute, bandwidth × arithmetic intensity). Drag the kernel along the intensity axis.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280);
  const v=K.ctrls(root,[{sel:'gpu',label:'Device',v:'h100',opts:[['h100','H100 SXM (~990 TF dense BF16, 3.35 TB/s)'],['a100','A100 (312 TF BF16, 2.0 TB/s)'],['orin','Jetson Orin-class (≈ 100 TF sparse INT8-ish, 0.2 TB/s)']]},{sel:'k',label:'Kernel',v:'decode',opts:[['vadd','vector add (0.08 F/B)'],['decode','LLM decode GEMV, batch 1 (~1 F/B)'],['b64','decode batch 64 (~60 F/B)'],['gemm','big GEMM (~300+ F/B)']]}]);
  const ro=K.readout(root);
  K.loop(cv,()=>{ const d={h100:[990,3.35],a100:[312,2.0],orin:[100,0.2]}[v.gpu]; const ai={vadd:0.083,decode:1,b64:60,gemm:400}[v.k];
    K.clear(ctx,W,H); const x0=70,y0=240,w=740,h=210; const lx=a=>x0+(Math.log10(a)+2)/6*w; const ly=f=>y0-(Math.log10(f)+1)/4.2*h;
    K.line(ctx,x0,y0,x0+w,y0,C.dim); K.line(ctx,x0,y0,x0,y0-h,C.dim);
    for(let e=-2;e<=4;e++){ K.t(ctx,'10^'+e,lx(10**e),y0+14,{a:'center',s:10,c:C.dim}); }
    K.t(ctx,'arithmetic intensity (FLOP / byte from DRAM)',x0+w/2,y0+30,{a:'center',s:11,c:C.muted}); K.t(ctx,'TFLOP/s',x0-40,y0-h-6,{s:11,c:C.muted});
    ctx.beginPath(); for(let a=0.01;a<=10000;a*=1.1){ const f=Math.min(d[0],d[1]*a); const X=lx(a),Y=ly(f); a===0.01?ctx.moveTo(X,Y):ctx.lineTo(X,Y);} ctx.strokeStyle=C.cyan; ctx.lineWidth=3; ctx.stroke();
    const ridge=d[0]/d[1]; K.line(ctx,lx(ridge),y0,lx(ridge),ly(d[0]),C.dim,1,[4,4]); K.t(ctx,'ridge '+ridge.toFixed(0)+' F/B',lx(ridge)+4,y0-12,{s:10,c:C.muted});
    const f=Math.min(d[0],d[1]*ai); ctx.beginPath(); ctx.arc(lx(ai),ly(f),8,0,7); ctx.fillStyle=ai<ridge?C.warn:C.good; ctx.fill();
    K.t(ctx,(ai<ridge?'memory-bound':'compute-bound')+': '+f.toFixed(1)+' TF/s ('+K.pct(f/d[0])+' of peak)',lx(ai)+12,ly(f)-12,{b:1,s:12});
    ro.textContent='Decode at batch 1 reads every weight once per token → ~1-2 FLOP/byte → bandwidth-bound: tokens/s ≈ HBM BW / model bytes. Batching raises intensity (weights reused across requests) until you hit the ridge. Nsight Compute shows achieved vs peak on both axes ("Speed of Light"). TF figures are vendor dense peaks; real attainable is lower.';
  });
});

defSim('streamTimeline','Streams, async copies & CUDA Graphs','Timeline of H2D copy → kernel → D2H for 4 chunks. Compare one stream, multiple streams (overlap on copy engines), and a captured CUDA Graph (one launch, lower CPU overhead).',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let t=0;
  const v=K.ctrls(root,[{sel:'mode',label:'Mode',v:'1',opts:[['1','default stream, synchronous'],['4','4 streams + pinned memory'],['g','CUDA Graph of many tiny kernels'],['ng','same tiny kernels, individual launches']],on:()=>t=0},{k:'copy',label:'Copy ms',min:1,max:10,v:4,on:()=>t=0},{k:'kern',label:'Kernel ms',min:1,max:10,v:5,on:()=>t=0}]);
  const ro=K.readout(root);
  K.loop(cv,(dt)=>{ t+=dt*8; K.clear(ctx,W,H); const lanes=['CPU (launch API)','Copy engine H2D','Compute (SMs)','Copy engine D2H']; const ev=[];
    if(v.mode==='1'){ let c=0; for(let i=0;i<4;i++){ ev.push([0,c,c+0.5,i]); ev.push([1,c+0.5,c+0.5+v.copy,i]); c+=0.5+v.copy; ev.push([2,c,c+v.kern,i]); c+=v.kern; ev.push([3,c,c+v.copy,i]); c+=v.copy; } }
    else if(v.mode==='4'){ let h=0,k=0,d=0,cpu=0; for(let i=0;i<4;i++){ ev.push([0,cpu,cpu+0.5,i]); cpu+=0.5; const hs=Math.max(h,cpu); h=hs+v.copy; ev.push([1,hs,h,i]); const ks=Math.max(k,h); k=ks+v.kern; ev.push([2,ks,k,i]); const ds=Math.max(d,k); d=ds+v.copy; ev.push([3,ds,d,i]); } }
    else { const n=20, launch=v.mode==='g'?0.08:0.6, kd=0.3; let cpu=0, gpu=0; if(v.mode==='g'){ ev.push([0,0,1.0,'G']); cpu=1.0; } for(let i=0;i<n;i++){ if(v.mode==='ng'){ ev.push([0,cpu,cpu+launch,i%4]); cpu+=launch; } const s=Math.max(gpu, v.mode==='g'?1.0+i*0.02:cpu); gpu=s+kd; ev.push([2,s,gpu,i%4]); } }
    const end=Math.max(...ev.map(e=>e[2])); const sc=700/Math.max(end,30);
    lanes.forEach((l,i)=>{ const y=30+i*55; K.t(ctx,l,10,y+14,{s:11,c:C.muted}); K.rr(ctx,130,y,710,30,4,'#0f1626'); });
    const cols=[C.accent,C.cyan,C.good,C.warn];
    ev.forEach(e=>{ const x1=130+e[1]*sc, x2=130+Math.min(e[2],t)*sc; if(t<e[1]) return; ctx.fillStyle=e[3]==='G'?C.pink:cols[e[3]%4]; ctx.fillRect(x1,30+e[0]*55+3,Math.max(1,x2-x1-1),24); });
    K.t(ctx,'makespan: '+end.toFixed(1)+' ms',130,262,{b:1,s:13});
    ro.textContent=({'1':'Everything serialized: copy engines and SMs idle most of the time.','4':'Chunked pipeline: H2D of chunk i+1 overlaps kernel i and D2H of i-1. Requires pinned (page-locked) host memory — pageable memcpyAsync silently becomes staged/synchronous. Watch out: the legacy default stream synchronizes with all other streams (use --default-stream per-thread or explicit streams).','g':'Graph: the whole DAG is instantiated once (cudaGraphInstantiate) and launched with one cudaGraphLaunch → per-kernel CPU launch cost (~µs) disappears; driver can pre-build work submission. Key for LLM decode steps with hundreds of tiny kernels. Updates: cudaGraphExecUpdate / kernel node params; shapes must be static (hence padding/bucketing).','ng':'Launch-bound: kernels are shorter than the ~3-6 µs launch overhead, so the GPU starves waiting for the CPU. Classic decode/inference symptom: low SM utilization with gaps in Nsight Systems.'})[v.mode];
  });
});

defSim('driverStack','CUDA driver stack: UMD → KMD → GPU','Follow a kernel launch from cuLaunchKernel through the user-mode driver (pushbuffer + doorbell) to the GPU host interface. Toggle the slow path.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); let t=0;
  const v=K.ctrls(root,[{sel:'path',label:'Path',v:'fast',opts:[['fast','fast path: user-mode submission'],['slow','first launch / alloc: needs KMD (ioctl)'],['fault','UVM page fault on managed memory']]},{k:'sp',label:'Speed',min:1,max:10,v:4}]);

  const boxes={app:[20,30,'App / framework','cuLaunchKernel(f, grid, block, args, stream)'],rt:[20,85,'CUDA runtime (libcudart)','lazy context, module load, cudaLaunch → driver API'],umd:[20,140,'UMD: libcuda.so','validate, marshal params, write methods into PUSHBUFFER (GPFIFO entry)'],kmd:[460,140,'KMD: nvidia.ko','ioctl: alloc/map memory, create channel, pin, page tables'],gpu:[460,240,'GPU host / front end','fetch GPFIFO, decode methods, dispatch CTAs to SMs'],uvm:[460,30,'nvidia-uvm.ko','service GPU fault: migrate pages, update GPU PTEs']};
  K.loop(cv,(dt)=>{ t+=dt*v.sp*0.3; K.clear(ctx,W,H); K.line(ctx,0,205,440,205,C.warn,1,[6,5]); K.t(ctx,'user mode ↑  /  kernel mode ↓',20,216,{s:10,c:C.warn});
