defSim('graphTraversal','BFS / DFS / Dijkstra / A* on a grid','Click cells to toggle walls (weighted mud cells cost 5). Watch how each algorithm grows its frontier.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,300); const C_=34,R_=15, cs=24; let grid=[], state=null, acc=0;
  const v=K.ctrls(root,[{sel:'alg',label:'Algorithm',v:'bfs',opts:[['bfs','BFS (queue)'],['dfs','DFS (stack)'],['dij','Dijkstra (min-heap)'],['astar','A* (Manhattan heuristic)']],on:start},{k:'sp',label:'Speed',min:1,max:60,v:20},{btn:'Run',primary:1,on:start},{btn:'Random walls',on:()=>{gen();start();}}]);
  const ro=K.readout(root); const S=[1,7], T=[32,7];
  function gen(){ grid=[]; for(let r=0;r<R_;r++){ grid.push([]); for(let c=0;c<C_;c++) grid[r].push(Math.random()<0.18?1:Math.random()<0.12?5:0); } grid[S[1]][S[0]]=0; grid[T[1]][T[0]]=0; }
  gen();
  function start(){ state={open:[[S[0],S[1],0]],dist:{},prev:{},seen:new Set(),done:false,pops:0}; state.dist[S]=0; }
  start();
  cv.addEventListener('click',e=>{ const p=K.pos(cv,e); const c=Math.floor((p.x-10)/cs), r=Math.floor((p.y-10)/(cs*0.75)); if(grid[r]&&grid[r][c]!==undefined){ grid[r][c]=grid[r][c]===0?1:grid[r][c]===1?5:0; start(); } });
  function stepAlg(){ const st=state; if(st.done||!st.open.length){ st.done=true; return; } let cur;
    if(v.alg==='bfs') cur=st.open.shift(); else if(v.alg==='dfs') cur=st.open.pop(); else { let bi=0; const h=n=>v.alg==='astar'?Math.abs(n[0]-T[0])+Math.abs(n[1]-T[1]):0; st.open.forEach((n,i)=>{ if(n[2]+h(n)<st.open[bi][2]+h(st.open[bi])) bi=i; }); cur=st.open.splice(bi,1)[0]; }
    const key=cur[0]+','+cur[1]; if(st.seen.has(key)) return; st.seen.add(key); st.pops++;
    if(cur[0]===T[0]&&cur[1]===T[1]){ st.done=true; st.found=true; return; }
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{ const nx=cur[0]+d[0], ny=cur[1]+d[1]; if(nx<0||ny<0||nx>=C_||ny>=R_) return; const cell=grid[ny][nx]; if(cell===1) return; const nk=nx+','+ny; const w=(v.alg==='dij'||v.alg==='astar')?(cell===5?5:1):1; const nd=cur[2]+w;
      if(st.seen.has(nk)) return; if(st.dist[nk]===undefined||nd<st.dist[nk]||v.alg==='dfs'){ if(v.alg==='bfs'&&st.dist[nk]!==undefined) return; st.dist[nk]=nd; st.prev[nk]=cur[0]+','+cur[1]; st.open.push([nx,ny,nd]); } }); }
  K.loop(cv,(dt)=>{ acc+=dt*v.sp; while(acc>1){ acc--; stepAlg(); }
    K.clear(ctx,W,H); const ch=cs*0.75;
    for(let r=0;r<R_;r++) for(let c=0;c<C_;c++){ const k=c+','+r; const cell=grid[r][c]; let col=cell===1?'#374151':cell===5?'#422006':'#0f1626'; if(state.seen.has(k)) col=cell===5?'#7c2d12':'#312e81'; if(state.open.some(n=>n[0]===c&&n[1]===r)) col='#0e7490'; K.rr(ctx,10+c*cs,10+r*ch,cs-2,ch-2,3,col); }
    if(state.found){ let k=T[0]+','+T[1]; let len=0, cost=0; while(k && k!==S[0]+','+S[1]){ const [c,r]=k.split(',').map(Number); K.rr(ctx,10+c*cs+5,10+r*ch+4,cs-12,ch-10,3,C.warn); cost+=grid[r][c]===5?5:1; len++; k=state.prev[k]; } state.len=len; state.cost=cost; }
    K.rr(ctx,10+S[0]*cs,10+S[1]*ch,cs-2,ch-2,3,C.good); K.rr(ctx,10+T[0]*cs,10+T[1]*ch,cs-2,ch-2,3,C.bad);
    ro.textContent=`nodes expanded: ${state.pops}  ${state.found?`path steps ${state.len}, weighted cost ${state.cost}`:state.done?'no path':''}\nBFS: shortest by edge count (unweighted). DFS: finds a path, not the shortest; good for cycle detection/topo sort. Dijkstra: non-negative weights, O((V+E) log V). A*: Dijkstra + admissible heuristic → fewer expansions. Interview tip: BFS on implicit graphs (states = nodes) solves many "minimum steps" problems.`;
  });
});

defSim('heapViz','Top-K with a min-heap of size K','Stream numbers; keep the K largest in a min-heap. New value > heap top? replace top and sift down. O(n log k) time, O(k) memory.',function(root,K){
  const {ctx,W,H,cv}=K.canvas(root,280); let heap=[], acc=0, last=null, seen=0;
  const v=K.ctrls(root,[{k:'k',label:'K',min:3,max:15,v:7,on:()=>{heap=[];seen=0;}},{k:'sp',label:'Speed',min:1,max:10,v:3}]);
  const ro=K.readout(root);
  function up(i){ while(i>0){ const p=(i-1)>>1; if(heap[p]>heap[i]){ [heap[p],heap[i]]=[heap[i],heap[p]]; i=p; } else break; } }

(function(){ const R=String.raw;
ACADEMY.modules.push({id:'cpp',num:1,icon:'⚙️',short:'C/C++ mastery',title:'C/C++ Systems Mastery',tier:'core',
summary:'Object lifetime, RAII, move semantics, templates vs virtual dispatch, layout & UB, and the memory model — the C++ every senior systems interview probes.',
why:'C/C++ is the #1 skill across your Oct alerts (21 postings: NVIDIA driver/UMD, CrowdStrike sensor, Cisco, F5, Unity, Google). Interviewers at staff level go past syntax into lifetime, ownership, ABI and memory ordering.',
lessons:[
{id:'raii',title:'Object lifetime, RAII & ownership',minutes:30,skills:['cpp','ub-safety'],sims:['memLayout'],
analogy:R`Think of a <b>hotel key card</b>. When you check in (construct), the card is programmed; when you check out (scope exit), the desk wipes it automatically — even if you leave in a hurry through the fire exit (an exception). RAII is the rule that every resource has a key card whose lifetime is tied to a scope or an owner object.`,
body:R`<p>C++ has deterministic destruction: when an object’s lifetime ends, its destructor runs — at the closing brace for automatic objects, during stack unwinding when an exception propagates, or when its owner is destroyed. RAII (Resource Acquisition Is Initialization) exploits this by binding <b>every</b> resource — heap memory, file descriptors, mutexes, DMA buffers, GPU contexts, ioctl handles — to an object whose destructor releases it.</p>
<h3>Storage durations you must be able to explain</h3>
<table><tr><th>Duration</th><th>Where</th><th>Lifetime</th><th>Gotcha</th></tr>
<tr><td>automatic</td><td>stack frame</td><td>until scope exit</td><td>returning a pointer/reference to a local = dangling</td></tr>
<tr><td>dynamic</td><td>heap (new / malloc)</td><td>until delete/free</td><td>leaks, double free, use-after-free</td></tr>
<tr><td>static</td><td>.data/.bss</td><td>program lifetime</td><td>static init order fiasco across TUs; destruction order at exit</td></tr>
<tr><td>thread</td><td>TLS block</td><td>thread lifetime</td><td>destructors run at thread exit; costly on some ABIs</td></tr></table>
<h3>Ownership vocabulary</h3>
<ul><li><code>std::unique_ptr<T></code> — sole owner, zero overhead (same size as a raw pointer with the default deleter), move-only. Custom deleters let it own non-memory resources: <code>std::unique_ptr<FILE, decltype(&fclose)></code>.</li>
<li><code>std::shared_ptr<T></code> — shared ownership via an atomically ref-counted control block (two pointers wide). Costs: atomic increments on copy (cache-line contention across cores), an extra allocation unless you use <code>make_shared</code>, and cycles that never free (break with <code>weak_ptr</code>).</li>
<li>Raw pointers and references — <b>non-owning observers</b>. In modern code a raw <code>T*</code> should never mean "you must delete this".</li></ul>
<h3>Rule of 0 / 3 / 5</h3><p>If a class manages a resource directly, it needs a destructor, copy constructor, copy assignment, move constructor and move assignment (rule of 5) — or delete the ones that make no sense (a DMA buffer handle should usually be move-only). Better: compose classes from RAII members so the compiler-generated special members are correct (rule of 0).</p>
<div class="callout gotcha"><b>Gotcha:</b> destructors are implicitly <code>noexcept</code>. Throwing from one during unwinding calls <code>std::terminate</code>. Release functions that can fail (e.g. <code>close()</code> flushing to NFS, an ioctl to tear down a stream) must log/handle errors inside the destructor or offer an explicit <code>close()</code> that reports them.</div>
<h3>Exception safety guarantees</h3><p><b>No-throw</b> (destructors, swap, moves where possible), <b>strong</b> (commit-or-rollback: copy-and-swap), <b>basic</b> (invariants hold, no leaks, state may change). Even in codebases built with <code>-fno-exceptions</code> (common in drivers, games, embedded), RAII still matters for early returns and error paths — the <code>goto err_free</code> ladders in Linux drivers are manual RAII, and the kernel now has <code>__free()</code>/<code>guard()</code> cleanup helpers built on the compiler’s cleanup attribute.</p>
<h3>How it shows up in senior interviews</h3><p>"Design a handle class for a hardware resource", "what happens if the constructor throws halfway?" (already-constructed members are destroyed; the destructor of the object itself does not run), "why is <code>shared_ptr</code> slow in a hot path?", "how do you hand a buffer to a C API and get it back?" (<code>release()</code> / adopt).</p>`,
poly:R`Every vendor SDK you touch (NXP VPU, Qualcomm camera HAL, Ambarella IAV, Lontium register access) exposes C open/close pairs. Wrapping each in a move-only RAII class (<code>VpuSession</code>, <code>IavBuffer</code>, <code>I2cDevice</code>) eliminates the leak-on-error-path class of bugs you have probably debugged at 2 a.m. That wrapper design is a great concrete story: "I turned N manual cleanup ladders into typed owners and the leak reports went to zero."`,

challenge:{prompt:R`<p>Write a move-only RAII class <code>UniqueFd</code> for POSIX file descriptors: constructor from int, destructor closes if valid, move ctor/assignment transfer ownership (leaving the source at -1), copy deleted, <code>get()</code>, <code>release()</code>, <code>reset(int)</code>. Then use it to implement <code>UniqueFd open_dev(const char* path)</code> that returns an invalid fd on failure. Test with a mock <code>close</code> counter to prove there are no double closes when moving into a <code>std::vector<UniqueFd></code> that reallocates.</p>`,
hints:['Mark the move constructor and move assignment <code>noexcept</code> — otherwise vector reallocation will try to copy (and copying is deleted → compile error).','Move assignment must close the current fd first, and must handle self-move-assignment.','<code>release()</code> returns the fd and sets the member to -1 without closing.'],
solution:R`class UniqueFd {
  int fd_ = -1;
public:
  UniqueFd() = default;
  explicit UniqueFd(int fd) noexcept : fd_(fd) {}
  ~UniqueFd() { reset(); }
  UniqueFd(const UniqueFd&) = delete;
  UniqueFd& operator=(const UniqueFd&) = delete;
  UniqueFd(UniqueFd&& o) noexcept : fd_(std::exchange(o.fd_, -1)) {}
  UniqueFd& operator=(UniqueFd&& o) noexcept {
    if (this != &o) reset(std::exchange(o.fd_, -1));
    return *this;
  }
  int get() const noexcept { return fd_; }
  explicit operator bool() const noexcept { return fd_ >= 0; }
  int release() noexcept { return std::exchange(fd_, -1); }
  void reset(int nfd = -1) noexcept {
    if (fd_ >= 0) ::close(fd_);   // log errno on failure; never throw
    fd_ = nfd;
  }
};
UniqueFd open_dev(const char* p) { return UniqueFd(::open(p, O_RDWR | O_CLOEXEC)); }`},
interview:[{q:'"Walk me through what happens, step by step, when an exception propagates out of three nested function calls that each hold a lock_guard and a unique_ptr."',a:'Strong answer: the runtime searches for a handler (two-phase unwinding on Itanium ABI: search, then cleanup); during cleanup each frame’s landing pad runs destructors of live automatic objects in reverse construction order — unique_ptr frees, lock_guard unlocks — so no lock is left held. Mention cost model: zero-cost EH means no runtime cost on the happy path but larger binaries and slow throw; why some codebases use -fno-exceptions and error codes/expected; and that noexcept functions that throw call terminate.'},
{q:'"When would you choose shared_ptr over unique_ptr, and what are its hidden costs?"',a:'Genuinely shared lifetime with no clear owner (e.g. cache entries handed to async callbacks). Costs: control block allocation (make_shared fuses it but delays memory release until weak refs die), atomic refcount traffic, cycles requiring weak_ptr, and ambiguous ownership making reasoning harder. Senior signal: "I default to unique ownership and pass non-owning views; shared ownership is a design smell I justify explicitly."'}],

{id:'move',title:'Value categories & move semantics',minutes:30,skills:['cpp','perf-eng'],sims:['vectorGrowth'],
analogy:R`Moving house: <b>copying</b> is buying identical furniture for the new place; <b>moving</b> is putting your existing furniture on a truck and leaving the old house empty but still standing (valid, unspecified state). Move semantics let C++ hand over the truck keys instead of rebuilding the furniture.`,
body:R`<p>Every expression has a type and a <b>value category</b>: <b>lvalue</b> (has identity, can take its address: a named variable), <b>prvalue</b> (pure temporary: <code>f()</code> returning by value, <code>42</code>), <b>xvalue</b> (expiring: <code>std::move(x)</code>). Rvalue references <code>T&&</code> bind to prvalues and xvalues, which lets overload resolution pick a <i>stealing</i> constructor.</p>
<h3>What std::move actually does</h3><p>Nothing at runtime. It is a cast to <code>T&&</code> (<code>static_cast<T&&></code>) that makes the move overload eligible. The move constructor does the stealing (typically copying a pointer and nulling the source). Moving a <code>const</code> object silently falls back to copy because <code>const T&&</code> does not bind to <code>T&&</code>.</p>
<h3>Copy elision & RVO</h3><p>Since C++17, returning a prvalue (<code>return T{...};</code>) is <b>guaranteed</b> elision: the object is constructed directly in the caller’s storage — no copy or move, and the type need not even be movable. Named RVO (<code>T t; ...; return t;</code>) is optional but universal in practice; if NRVO does not apply, the return is treated as an rvalue (implicit move). So <code>return std::move(local);</code> is a <b>pessimization</b> — it disables NRVO.</p>
<h3>Why noexcept on moves matters (see the sim)</h3><p><code>std::vector</code> provides the strong exception guarantee for <code>push_back</code>. During reallocation, if moving element k throws, elements 0..k-1 have already been moved-from and cannot be restored. So vector uses <code>std::move_if_noexcept</code>: if your move constructor is not <code>noexcept</code> (and the type is copyable), it <b>copies</b> every element on every growth. A forgotten <code>noexcept</code> can turn an O(1) amortized move of a buffer handle into deep copies of megabytes.</p>
<div class="callout num"><b>Numbers:</b> growth factor g gives ≈ N/(g−1) total element relocations over N push_backs (≈N for ×2, ≈2N for ×1.5). ×1.5 lets freed blocks be reused by later allocations; ×2 never fits into the sum of previous blocks.</div>
<h3>Perfect forwarding</h3><p>In a template, <code>T&&</code> with deduced <code>T</code> is a <b>forwarding reference</b>; <code>std::forward<T>(arg)</code> preserves the caller’s category. This is how <code>emplace_back</code> and <code>make_unique</code> construct in place. Reference collapsing: <code>& &&</code> → <code>&</code>, <code>&& &&</code> → <code>&&</code>.</p>
<div class="callout gotcha"><b>Gotcha:</b> using an object after moving from it is legal but its value is unspecified (for std types: valid but unspecified; a moved-from <code>std::string</code> is usually empty, a moved-from <code>std::vector</code> is empty in practice). Only assign to it or destroy it. clang-tidy’s <code>bugprone-use-after-move</code> catches many cases.</div>`,
poly:R`Video frame queues are the perfect example: a <code>Frame</code> object holding a 3 MB NV12 buffer moving through capture → ISP post-processing → encoder → RTP packetizer. If <code>Frame</code>’s move constructor is not <code>noexcept</code>, a <code>std::deque</code>/<code>vector</code> of frames may copy pixel data on growth — an invisible 30 fps memcpy that shows up as CPU load on a Cortex-A53. Mention in interviews that you check this with a static_assert: <code>static_assert(std::is_nothrow_move_constructible_v<Frame>);</code>`,

challenge:{prompt:R`<p>Implement a minimal <code>SmallVec<T></code> with <code>push_back(const T&)</code>, <code>push_back(T&&)</code>, <code>emplace_back(Args&&...)</code> and growth ×2 using raw storage (<code>operator new</code> + placement new). Relocate with <code>std::move_if_noexcept</code>. Instrument a test type that counts copies and moves, and show the difference between a noexcept and a throwing move constructor.</p>`,
hints:['Use <code>std::uninitialized_move</code>-like logic manually: placement-new each element in the new buffer, then destroy old elements and free the old buffer.','emplace_back: <code>new (data_+size_) T(std::forward<Args>(args)...);</code>','Edge case: <code>v.push_back(v[0])</code> during reallocation — construct the new element BEFORE destroying the old buffer (or copy the argument first).'],
solution:R`template<class T> class SmallVec {
  T* d_=nullptr; size_t n_=0, cap_=0;
  void grow(){ size_t nc = cap_? cap_*2 : 1;
    T* nd = static_cast<T*>(::operator new(nc*sizeof(T)));
    for(size_t i=0;i<n_;++i){ new (nd+i) T(std::move_if_noexcept(d_[i])); }
    for(size_t i=0;i<n_;++i) d_[i].~T();
    ::operator delete(d_); d_=nd; cap_=nc; }
public:
  ~SmallVec(){ for(size_t i=0;i<n_;++i) d_[i].~T(); ::operator delete(d_); }
  template<class... A> T& emplace_back(A&&... a){
    if(n_==cap_){ T tmp(std::forward<A>(a)...); grow(); new (d_+n_) T(std::move(tmp)); }
    else new (d_+n_) T(std::forward<A>(a)...);
    return d_[n_++]; }
  void push_back(const T& x){ emplace_back(x); }
  void push_back(T&& x){ emplace_back(std::move(x)); }
};
// (Production version: exception-safe grow with rollback, copy/move of SmallVec itself.)`},
interview:[{q:'"Explain why std::vector needs noexcept move constructors, and how you would detect the problem in a large codebase."',a:'Strong-guarantee argument via move_if_noexcept; detection: static_assert(std::is_nothrow_move_constructible_v<T>) on hot types, profiling shows memcpy/copy-ctor in reallocation, clang-tidy performance-noexcept-move-constructor. Bonus: =default move ctors are noexcept iff all members’ are; a single member with a throwing move (e.g. some older std::function impls or custom types) poisons it.'},
{q:'"What is the difference between emplace_back and push_back?"',a:'emplace_back forwards constructor arguments and constructs in place; push_back takes an object (copy/move). Nuances: emplace_back can call explicit constructors (a footgun: v.emplace_back(10) on vector<vector<int>> builds a 10-element vector), and for an existing object of the right type there is no difference. Since C++17 emplace_back returns a reference.'}],

{id:'dispatch',title:'Polymorphism: virtual dispatch vs templates',minutes:25,skills:['cpp','perf-eng'],sims:['vtableDispatch'],
analogy:R`A <b>phone switchboard</b> vs a <b>direct line</b>. Virtual dispatch is the switchboard: the operator (vtable) looks up who to connect each call to at runtime — flexible, small overhead per call. Templates are direct lines wired at build time — fastest, but you need a separate wire for every pairing and the wiring closet (binary) gets big.`,
body:R`<p><b>Dynamic polymorphism</b>: each polymorphic object carries a hidden <b>vptr</b> (8 bytes on 64-bit) to its class’s vtable (an array of function pointers, plus RTTI and offset-to-top). A virtual call is: load vptr → load function pointer at a fixed slot → indirect call. Two dependent loads and an indirect branch.</p>
<p><b>Static polymorphism</b>: templates/CRTP/concepts resolve the call at compile time per instantiation — the call can be <b>inlined</b>, enabling constant propagation, vectorization and dead-code elimination across the call boundary. Costs: code bloat (one instantiation per type), longer compile times, errors at instantiation, and no runtime heterogeneity (you cannot put <code>Encoder<H264></code> and <code>Encoder<H265></code> in one container without type erasure).</p>
<h3>The real cost of virtual calls</h3><ul><li>Rarely the loads (they hit L1 when hot).</li><li><b>Lost inlining</b> — the dominant cost for tiny functions called in loops (getters, per-pixel ops).</li><li><b>Indirect branch mispredictions</b> when the dynamic type varies unpredictably (~15–20 cycles each). Sorting objects by type before processing restores predictability.</li><li>Spectre v2 mitigations (retpolines) made indirect calls much more expensive in kernels — the Linux kernel went to great lengths to devirtualize hot paths for this reason.</li></ul>
<h3>Middle grounds</h3><p><code>final</code> classes/methods + LTO enable <b>devirtualization</b>. <code>std::variant</code> + <code>std::visit</code> gives closed-set polymorphism with value semantics (jump table, no heap). <b>Type erasure</b> (<code>std::function</code>, <code>std::any</code>, hand-rolled "concept/model" with small-buffer optimization) gives value semantics with an open set of types.</p>
<h3>ABI & object model questions seniors get</h3><ul><li>Base class destructor must be <code>virtual</code> if you delete through a base pointer — else UB (typically only the base part is destroyed).</li><li>Calling a virtual function in a constructor/destructor dispatches to the class currently being constructed, not the most derived.</li><li>Multiple inheritance adds thunks that adjust <code>this</code>; virtual inheritance adds vbase offsets.</li><li>Adding a virtual function to a class in a shared library breaks ABI (vtable layout changes) — relevant for SDKs/plugins and for the CUDA driver’s stable ABI promises.</li></ul>`,
poly:R`HAL layers in conferencing devices are classic runtime polymorphism: <code>ICameraSensor</code>, <code>IVideoEncoder</code> with implementations per SoC (Ambarella vs Qualcomm vs NXP). That is the right choice at the control-plane level (called a few times per second). Per-pixel or per-packet code must never go through a virtual call per element — make the interface batch-oriented (<code>process(span<Frame>)</code>) so the virtual cost is paid once per batch. This "virtual at the boundary, templates inside" is a crisp staff-level design principle.`,

challenge:{prompt:R`<p>Benchmark three designs computing the total area of 10 million shapes (circle/rect/triangle, random mix): (1) <code>vector<unique_ptr<Shape>></code> with virtual <code>area()</code>, (2) <code>vector<variant<Circle,Rect,Tri>></code> with <code>visit</code>, (3) three separate vectors (struct-of-arrays by type). Measure with <code>-O2</code>, then sort design (1) by type and re-measure. Explain each result with perf stat (branch-misses, cache-misses).</p>`,
hints:['Use <code>std::chrono::steady_clock</code> and run each variant several times; prevent dead-code elimination by printing the sum.','Design (1) also suffers from pointer chasing: each object is a separate heap allocation.','<code>perf stat -e branch-misses,cache-misses,instructions,cycles ./bench</code>'],
solution:R`<p>Typical results (x86, 10M shapes): virtual+heap is slowest (pointer chasing → cache misses dominate, plus mispredicts on random types); sorting by type removes most mispredicts but not the cache misses; variant is 2–4× faster (contiguous, inline, predictable switch when sorted); SoA per type is fastest (no dispatch at all, vectorizable loops). Lesson: data layout usually beats dispatch mechanism; batch by type.</p>`},

{id:'ub',title:'Layout, alignment & undefined behavior',minutes:35,skills:['cpp','ub-safety','secure-coding'],sims:['structPadding','stackSmash'],
analogy:R`UB is like a <b>contract with the compiler</b>: "I promise never to do X; in exchange, optimize as aggressively as you like." When you break the promise, the compiler is not obliged to do anything sensible — it already rewrote your code assuming X never happens.`,
body:R`<h3>Layout rules</h3><p>Each type has a size and an alignment. Members are placed in declaration order, each at an offset that is a multiple of its alignment; the struct’s size rounds up to its largest member alignment so arrays stay aligned. Reordering members by decreasing alignment minimizes padding (sim above). <code>#pragma pack</code>/<code>__attribute__((packed))</code> removes padding for wire/register formats but creates misaligned members: taking their address and dereferencing as <code>T*</code> is UB and can fault on strict-alignment cores.</p>
<h3>Undefined behavior you must recognize instantly</h3><ul>
<li><b>Signed integer overflow</b> — the compiler assumes it never happens: <code>for(int i=0; i<=n; i++)</code> may be assumed finite; <code>x+1 > x</code> folds to true.</li>
<li><b>Strict aliasing</b> — accessing an object through a pointer of an incompatible type (e.g. <code>*(uint32_t*)float_ptr</code>). Use <code>memcpy</code> or C++20 <code>std::bit_cast</code>; compilers turn them into a single move.</li>
<li><b>Out-of-bounds</b> access, use-after-free, double free, null dereference (and the compiler may delete a later null check after a dereference — the famous Linux TUN driver bug, fixed with <code>-fno-delete-null-pointer-checks</code>).</li>
<li><b>Data races</b> on non-atomic objects (the whole program has UB, not just a torn value).</li>
<li>Shifting by ≥ width or shifting a negative value left; uninitialized reads; misaligned access; modifying a string literal; infinite loops without side effects (C++).</li></ul>
<h3>Why it matters at senior level</h3><p>UB is a <b>security</b> issue (most memory-corruption CVEs) and a <b>heisenbug</b> generator: code works at -O0, breaks at -O2, or breaks after a compiler upgrade. Know the tooling: <b>ASan</b> (shadow memory, ~2× slowdown: OOB, UAF), <b>UBSan</b> (cheap checks for overflow, shifts, alignment), <b>TSan</b> (data races, 5–15×), <b>MSan</b> (uninitialized reads), Valgrind, <code>-fsanitize=kernel-address</code> (KASAN) and KCSAN in the kernel, fuzzers (libFuzzer/AFL++/syzkaller).</p>
<h3>Mitigations (second sim)</h3><p>Stack canaries (<code>-fstack-protector-strong</code>), ASLR/PIE, NX/W^X, RELRO, CFI (control-flow integrity), shadow stacks (Intel CET, ARM GCS), pointer authentication (ARMv8.3 PAC) and memory tagging (ARMv8.5 MTE) — the latter two matter on modern ARM SoCs. Mitigations turn exploits into crashes; they do not make the bug go away.</p>
<div class="callout gotcha"><b>Gotcha:</b> <code>volatile</code> is NOT a synchronization primitive. It prevents the compiler from caching/eliding accesses (right for MMIO registers with readl/writel semantics) but provides no atomicity and no inter-thread ordering.</div>`,
poly:R`Register maps from Lontium/NXP datasheets are often modeled as packed structs or bitfields — bitfield layout is implementation-defined (bit order, padding), so portable drivers use explicit masks/shifts (<code>FIELD_GET/FIELD_PREP</code>). Wire formats (RTP headers, SEI messages) are another place where packed structs + type-punning creep in; <code>memcpy</code>-based parsing is both correct and just as fast. Running vendor code under ASan/UBSan in a host-side test harness is a high-leverage story.`,

{q:'Which is the correct, UB-free way to get the bits of a float as uint32_t in C++20?',opts:['<code>*(uint32_t*)&f</code>','<code>reinterpret_cast<uint32_t&>(f)</code>','<code>std::bit_cast<uint32_t>(f)</code>','a union in C++'],a:2,exp:'bit_cast (or memcpy) is defined; the others violate strict aliasing (union punning is allowed in C, not C++).'},

{q:'Your code works at -O0 but intermittently crashes at -O2 only on the device. First tool?',opts:['Add volatile everywhere','Build a host test with -fsanitize=address,undefined (and TSan if multithreaded)','Lower optimization permanently','Add printf'],a:1,exp:'Sanitizers find the UB the optimizer is exploiting; volatile/-O0 just hide it.'}],
challenge:{prompt:R`<p>Given this parser, find every UB and rewrite it safely:</p><pre>struct __attribute__((packed)) Hdr { uint8_t ver; uint32_t len; uint16_t type; };
int parse(const uint8_t* buf, int n) {
  Hdr* h = (Hdr*)buf;
  uint32_t* plen = &h->len;          // pointer to packed member
  int total = h->len + n;            // may overflow
  char name[8]; strcpy(name, (const char*)buf + 7);
  return total << 31;
}</pre>`,
hints:['Misaligned pointer to a packed member + aliasing through a cast pointer.','Signed overflow in <code>h->len + n</code> and <code>total << 31</code> (shifting into the sign bit).','strcpy with unbounded input; also no length check that n ≥ sizeof(Hdr).'],
solution:R`int parse(const uint8_t* buf, size_t n, Hdr* out) {
  if (n < 7) return -EINVAL;
  uint32_t len; memcpy(&len, buf + 1, 4); len = le32toh(len);   // explicit endianness
  uint16_t type; memcpy(&type, buf + 5, 2); type = le16toh(type);
  if (len > n - 7) return -EINVAL;                               // unsigned, no overflow
  char name[8]; size_t m = strnlen((const char*)buf + 7, n - 7);
  if (m >= sizeof name) return -ENAMETOOLONG;
  memcpy(name, buf + 7, m); name[m] = '\0';
  out->ver = buf[0]; out->len = len; out->type = type;
  return 0;
}`},
interview:[{q:'"What is undefined behavior and why does the C++ standard have it?"',a:'Behavior for which the standard imposes no requirements. It exists to allow efficient mapping to diverse hardware (no mandated overflow checks or bounds checks) and to enable optimizations based on assumptions (no aliasing, no overflow, no races). Contrast with implementation-defined (documented, e.g. sizeof(long)) and unspecified (one of several options, e.g. evaluation order). Show a concrete optimization example and the tooling you use to find it.'}],
resources:[['Clang AddressSanitizer docs','https://clang.llvm.org/docs/AddressSanitizer.html'],['Clang UndefinedBehaviorSanitizer docs','https://clang.llvm.org/docs/UndefinedBehaviorSanitizer.html'],['cppreference: undefined behavior','https://en.cppreference.com/w/cpp/language/ub'],['CS:APP (machine-level representation, buffer overflow lab)','https://csapp.cs.cmu.edu/']]},
{id:'atomics',title:'The C++ memory model & atomics',minutes:40,skills:['memmodel','concurrency','arch-perf'],sims:['memoryOrder'],
analogy:R`Each CPU core has a <b>personal outbox</b> (store buffer). Letters you write go into your outbox first and reach the shared mailroom (cache/memory) a little later — but you can already read your own letters. Two people who each write a letter and then check the mailroom for the other’s letter can both see nothing. Memory orders are the rules for when you must wait for your outbox to empty.`,
body:R`<p>The C++11 memory model defines which values a load may return in a multi-threaded program. A program with a <b>data race</b> (two unsynchronized accesses to the same non-atomic location, at least one a write) has UB. <code>std::atomic<T></code> operations never race, and their <b>memory_order</b> argument constrains how surrounding ordinary accesses may be reordered.</p>
<table><tr><th>Order</th><th>Guarantee</th><th>Typical use</th></tr>
<tr><td>relaxed</td><td>atomicity only; no ordering of other accesses</td><td>statistics counters, reference counts (increment)</td></tr>
<tr><td>release (store)</td><td>prior reads/writes cannot move after the store</td><td>publishing data: write payload, then flag.store(release)</td></tr>
<tr><td>acquire (load)</td><td>later reads/writes cannot move before the load</td><td>consuming: flag.load(acquire), then read payload</td></tr>
<tr><td>acq_rel</td><td>both, for read-modify-write</td><td>lock-free stack/queue CAS, refcount decrement-to-zero</td></tr>
<tr><td>seq_cst (default)</td><td>acq/rel + one global total order of all seq_cst ops</td><td>Dekker/Peterson-style algorithms, when in doubt</td></tr></table>
<p>A release store that is read by an acquire load creates a <b>synchronizes-with</b> edge, so everything before the release <b>happens-before</b> everything after the acquire. That is the entire mental model for message passing (sim: "MP" test).</p>
<h3>Hardware reality</h3><ul><li><b>x86-TSO</b>: the only visible reordering is StoreLoad (a later load can bypass an earlier store sitting in the store buffer). Acquire/release are free (plain MOV); seq_cst stores need <code>XCHG</code> or <code>MFENCE</code>. That is why the store-buffering (Dekker) test fails on x86 without seq_cst.</li><li><b>ARMv8/POWER</b>: weakly ordered — all four reorderings possible. ARMv8 has <code>LDAR</code>/<code>STLR</code> (acquire/release instructions) and <code>DMB</code> barriers. Code that "works on x86" frequently breaks on ARM — directly relevant to your ARM SoCs and NVIDIA Grace (ARM) servers.</li><li>The <b>compiler</b> reorders too: even on x86 you need atomics (or at least compiler barriers) — plain variables can be hoisted out of loops (<code>while(!flag);</code> becomes an infinite loop).</li></ul>
<h3>Kernel vs C++</h3><p>Linux uses its own model (LKMM): <code>READ_ONCE/WRITE_ONCE</code>, <code>smp_load_acquire/smp_store_release</code>, <code>smp_mb()</code>, plus device barriers <code>dma_wmb()/dma_rmb()</code>, <code>wmb()</code> for ordering CPU writes against device (DMA/MMIO) observation. Driver interviews love "why do you need a barrier between writing a DMA descriptor and ringing the doorbell?"</p>
<div class="callout gotcha"><b>Gotcha:</b> <code>shared_ptr</code> refcount increments are relaxed, but the decrement uses acq_rel so the thread that destroys the object sees all writes made by other owners. Getting this wrong is a classic use-after-free in hand-rolled intrusive refcounts.</div>`,
poly:R`Anywhere you have a capture thread handing frames to an encoder thread via a flag or index, you are doing message passing. On ARM (NXP i.MX, Qualcomm, Ambarella Cortex-A), a missing release/acquire can make the consumer read a stale buffer header — rare, load-dependent, and only on the device. The DMA side is the same story with device barriers: descriptor writes must be visible before the doorbell MMIO write.`,
quiz:[
{q:'Which outcome of the store-buffering test (x=1;r1=y || y=1;r2=x) is observable on real x86 with plain (relaxed/release-acquire) atomics?',opts:['Only r1=1,r2=1','r1=0,r2=0 is possible','It deadlocks','r1 and r2 are always equal'],a:1,exp:'x86 allows StoreLoad reordering via store buffers; only seq_cst (MFENCE/XCHG) forbids it.'},
{q:'Producer: <code>data = 42; ready.store(true, memory_order_release);</code> Consumer: <code>while(!ready.load(memory_order_acquire)); use(data);</code> Is reading data a race?',opts:['Yes, data is not atomic','No — release/acquire establishes happens-before','Only on ARM','Only without volatile'],a:1,exp:'The acquire load reads the value from the release store → synchronizes-with → data write happens-before the read.'},
{q:'Predict: may this loop never terminate at -O2?',code:'bool stop = false;          // plain bool, set by another thread\nvoid worker(){ while(!stop) { do_work(); } }  // do_work is inline, touches no globals',opts:['No, it always terminates','Yes — the compiler may hoist the load out of the loop (and the race is UB anyway)','Only on ARM','Only with -O3'],a:1,exp:'Without atomics the compiler may assume stop does not change; use std::atomic<bool>.'},
{q:'The right memory order for a pure statistics counter incremented by many threads and read occasionally?',opts:['seq_cst','acq_rel','relaxed','consume'],a:2,exp:'You need atomicity, not ordering with other data. (And consider per-thread counters to avoid contention.)'}],
challenge:{prompt:R`<p>Implement a <b>spin-then-yield lock</b> using <code>std::atomic<bool></code> with correct orders (acquire on lock, release on unlock) and a test-and-test-and-set loop. Then implement a <b>seqlock</b> for a struct of 4 doubles written by one thread (sensor pose at 1 kHz) and read by many. Explain each memory order you chose.</p>`,
hints:['TTAS: spin on a relaxed load while locked, then try <code>exchange(true, acquire)</code>; this avoids hammering the line with RMWs.','Seqlock writer: seq++ (odd) → write data → seq++ (even), with release semantics; reader: s1=seq.load(acquire), copy, fence(acquire), s2=seq.load(relaxed); retry if s1 odd or s1≠s2.','In C++ the data fields read in a seqlock should themselves be atomics (relaxed) to avoid a formal data race.'],
solution:R`struct SpinLock { std::atomic<bool> f{false};
  void lock(){ for(;;){ if(!f.exchange(true, std::memory_order_acquire)) return;
      while(f.load(std::memory_order_relaxed)) { _mm_pause(); /* or yield after N spins */ } } }
  void unlock(){ f.store(false, std::memory_order_release); } };

struct Pose { std::atomic<double> v[4]; };
std::atomic<uint32_t> seq{0}; Pose p;
void write(const double (&x)[4]){ uint32_t s=seq.load(std::memory_order_relaxed);
  seq.store(s+1, std::memory_order_relaxed); std::atomic_thread_fence(std::memory_order_release);
  for(int i=0;i<4;i++) p.v[i].store(x[i], std::memory_order_relaxed);
  seq.store(s+2, std::memory_order_release); }
bool read(double (&out)[4]){ uint32_t s1=seq.load(std::memory_order_acquire); if(s1&1) return false;
  for(int i=0;i<4;i++) out[i]=p.v[i].load(std::memory_order_relaxed);
  std::atomic_thread_fence(std::memory_order_acquire);
  return seq.load(std::memory_order_relaxed)==s1; }   // caller retries on false`},
interview:[{q:'"Explain acquire/release semantics and give an example where relaxed is wrong."',a:'Define synchronizes-with and happens-before; show the message-passing pattern; relaxed flag + plain data allows the consumer to see the flag but stale data on ARM (and the compiler can reorder even on x86). Mention hardware mapping (x86 free, ARM LDAR/STLR), and that seq_cst is needed for StoreLoad patterns like Dekker. Senior bonus: mention verification tools (CppMem, herd7/LKMM litmus tests, TSan) and that you would document every non-seq_cst order with a comment pairing it to its counterpart.'},
{q:'"Why do DMA drivers need dma_wmb() before writing the doorbell register?"',a:'The CPU (and the interconnect) can reorder normal memory writes (descriptor in RAM) relative to the MMIO write (doorbell). Without a barrier the device may fetch a stale descriptor. dma_wmb orders writes to coherent DMA memory; writel() itself includes a barrier before the MMIO write on most architectures, writel_relaxed() does not. Also mention dma_rmb() on the completion side when reading the status/OWN bit before the payload.'}],
resources:[['cppreference: std::memory_order','https://en.cppreference.com/w/cpp/atomic/memory_order'],['Preshing: An Introduction to Lock-Free Programming','https://preshing.com/20120612/an-introduction-to-lock-free-programming/'],['Linux memory-barriers.txt','https://www.kernel.org/doc/Documentation/memory-barriers.txt'],['Educative: Modern C++ Concurrency (Rainer Grimm)','https://www.educative.io/courses/modern-cpp-concurrency-in-practice-get-the-most-out-of-any-machine']]}
]});
})();

<script>/* js/content/m02-kernel.js */
(function(){ const R=String.raw;
ACADEMY.modules.push({id:'kernel',num:2,icon:'🐧',short:'Kernel & drivers',title:'Linux Kernel & Device Drivers',tier:'core',
summary:'Syscall path & char drivers, Device Tree & probe, interrupts, DMA rings, virtual memory/TLB, and the scheduler — with the debugging depth NVIDIA/OpenAI/Cisco interviewers expect.',
why:'Kernel internals and drivers appear in NVIDIA (CUDA driver perf, UMD, kernel CSP), OpenAI Compute Foundations, CrowdStrike sensor, Cisco and Intel postings. This is your strongest differentiator — go from "I write drivers" to "I can explain every layer and debug any of them".',
lessons:[
{id:'chardev',title:'From read() to your driver: syscalls & char devices',minutes:35,skills:['drivers','linux-kernel','kernel-debug'],sims:['syscallPath'],
analogy:R`A <b>bank teller window</b>. Customers (user processes) cannot walk into the vault (kernel memory). They slide a request slip through the window (syscall); the teller (VFS) routes it to the right department (your driver’s file_operations); cash comes back through the slot via a careful counting machine (copy_to_user) that refuses to hand money to a fake address.`,
body:R`<p>A user <code>read(fd, buf, n)</code> becomes a trap instruction (<code>syscall</code> on x86-64, <code>svc #0</code> on arm64). The CPU switches to kernel mode, saves user registers on the per-task kernel stack, and dispatches via the syscall table to <code>ksys_read → vfs_read → file->f_op->read</code> (or <code>read_iter</code>). For a character device, <code>f_op</code> points at your driver’s <code>struct file_operations</code>.</p>
<h3>Anatomy of a char driver</h3><pre>static const struct file_operations cam_fops = {
  .owner = THIS_MODULE, .open = cam_open, .release = cam_release,
  .read = cam_read, .poll = cam_poll, .unlocked_ioctl = cam_ioctl, .mmap = cam_mmap,
};
// registration: alloc_chrdev_region + cdev_add + device_create (udev makes /dev/cam0)
// or simply: misc_register(&misc) for a single node</pre>
<ul><li><b>open/release</b>: per-file state in <code>filp->private_data</code>; reference-count the device so hot-unplug while open is safe.</li>
<li><b>read/write</b>: must use <code>copy_to_user/copy_from_user</code> — user pointers may be invalid, unmapped (page fault handled), or point into kernel memory (rejected by <code>access_ok</code>; SMAP/PAN hardware enforces it). They return the number of bytes NOT copied.</li>
<li><b>Blocking</b>: if no data, sleep on a wait queue: <code>wait_event_interruptible(wq, cond)</code>; the IRQ handler calls <code>wake_up_interruptible(&wq)</code>. Return <code>-ERESTARTSYS</code> if a signal interrupts. With <code>O_NONBLOCK</code>, return <code>-EAGAIN</code>.</li>
<li><b>poll/select/epoll</b>: <code>poll_wait()</code> registers the wait queue and returns a mask (<code>EPOLLIN</code>…). Missing poll support is a common review comment.</li>
<li><b>ioctl</b>: define numbers with <code>_IOR/_IOW/_IOWR</code>; validate every field; provide <code>compat_ioctl</code> for 32-bit user space on 64-bit kernels; never trust sizes from user space.</li>
<li><b>mmap</b>: map device memory or DMA buffers into user space (<code>remap_pfn_range</code>, <code>dma_mmap_coherent</code>) for zero-copy — how V4L2, DRM and GPU drivers avoid copies.</li></ul>
<h3>Concurrency inside a driver</h3><p>Multiple processes/threads can call into your fops simultaneously, and your IRQ handler can run concurrently on another CPU. Use a <b>mutex</b> for sleeping contexts (process context, may call copy_to_user), a <b>spinlock</b> (<code>spin_lock_irqsave</code>) for data shared with interrupt context. Never sleep while holding a spinlock or in atomic context ("BUG: scheduling while atomic").</p>
<div class="callout num"><b>Cost model:</b> a null syscall is ~50–100 ns on modern x86 (more with Spectre/Meltdown mitigations like KPTI); a context switch is ~1–3 µs plus cache/TLB pollution. That is why high-rate paths batch (io_uring, mmap rings, GPU user-mode submission) instead of one syscall per item.</div>
<h3>Modern interfaces worth knowing</h3><p>Prefer existing subsystems over raw char devices: V4L2 for cameras, DRM/KMS for display, ALSA for audio, IIO for sensors, input for HID, UIO/VFIO for user-space drivers (VFIO + IOMMU is how GPUs/NICs are passed to VMs and DPDK). Interviewers like hearing "I would not write a custom char device here; I would implement the V4L2 subdev ops so GStreamer works unchanged".</p>`,
poly:R`Your camera/HDMI-bridge work already lives in V4L2 subdevices and media controller graphs. Frame the story as: "I know the path from <code>VIDIOC_DQBUF</code> in GStreamer down through videobuf2 to the CSI receiver’s IRQ handler and back" — that is exactly the user↔kernel fluency the NVIDIA CUDA driver postings list ("operating system interfaces for threads, process control, and virtual memory").`,
quiz:[
{q:'Why must a driver use <code>copy_to_user</code> instead of <code>memcpy</code> to a user pointer?',opts:['memcpy is slower','User pointers may be invalid, unmapped, or point to kernel memory; copy_to_user validates and handles faults','memcpy is not available in the kernel','It compresses data'],a:1,exp:'It checks access_ok, temporarily allows user access under SMAP/PAN, and uses exception tables to turn faults into a return value.'},
{q:'A process blocked in your driver’s read() receives SIGINT. What should read() return?',opts:['0','-EINTR always','-ERESTARTSYS (kernel converts to EINTR or restarts per SA_RESTART)','It cannot be interrupted'],a:2,exp:'wait_event_interruptible returns -ERESTARTSYS; the signal code decides restart vs EINTR.'},
{q:'What does this print in dmesg when called from an IRQ handler?',code:'irqreturn_t h(int irq, void *d){ mutex_lock(&dev->lock); /*...*/ mutex_unlock(&dev->lock); return IRQ_HANDLED; }',opts:['Nothing, it is fine','BUG: sleeping function called from invalid context (might_sleep)','A deadlock message only','Kernel panic: out of memory'],a:1,exp:'mutex_lock may sleep; hard IRQ context is atomic. Use a spinlock or move work to a threaded IRQ.'},
{q:'Best zero-copy way to give user space access to a large DMA capture buffer?',opts:['read() with copy_to_user','mmap the buffer (e.g. dma_mmap_coherent / videobuf2)','ioctl returning a kernel pointer','/proc file'],a:1,exp:'mmap maps the same physical pages into the process; never return kernel pointers.'}],
challenge:{prompt:R`<p>Write (or extend v1’s <code>projects/01-char-driver-lab/kernel_stub/fake_cdev.c</code>) a misc device <code>/dev/fifo0</code> with a 4 KiB kernel FIFO (<code>kfifo</code>): blocking read/write with wait queues, <code>O_NONBLOCK</code> support, <code>poll</code>, and an ioctl <code>FIFO_GET_LEVEL</code>. Test from user space with two processes and <code>epoll</code>. Run under a kernel with <code>CONFIG_PROVE_LOCKING</code> (lockdep) and <code>CONFIG_DEBUG_ATOMIC_SLEEP</code> in QEMU.</p>`,
hints:['<code>DEFINE_KFIFO</code> + a mutex for readers/writers; <code>kfifo_to_user</code>/<code>kfifo_from_user</code> do the copying.','Two wait queues: readers wait for "not empty", writers for "not full". Wake the other side after each operation.','poll: <code>poll_wait(f, &rq, pt); poll_wait(f, &wq, pt);</code> then return EPOLLIN|EPOLLRDNORM if !empty, EPOLLOUT if !full.'],
solution:R`static ssize_t f_read(struct file *f, char __user *ubuf, size_t n, loff_t *off) {
  unsigned int copied; int ret;
  if (mutex_lock_interruptible(&lock)) return -ERESTARTSYS;
  while (kfifo_is_empty(&fifo)) {
    mutex_unlock(&lock);
    if (f->f_flags & O_NONBLOCK) return -EAGAIN;
    if (wait_event_interruptible(rq, !kfifo_is_empty(&fifo))) return -ERESTARTSYS;
    if (mutex_lock_interruptible(&lock)) return -ERESTARTSYS;
  }
  ret = kfifo_to_user(&fifo, ubuf, n, &copied);
  mutex_unlock(&lock);
  wake_up_interruptible(&wq);           // space available for writers
  return ret ? ret : copied;
}
static __poll_t f_poll(struct file *f, poll_table *pt) {
  __poll_t m = 0; poll_wait(f, &rq, pt); poll_wait(f, &wq, pt);
  if (!kfifo_is_empty(&fifo)) m |= EPOLLIN | EPOLLRDNORM;
  if (!kfifo_is_full(&fifo))  m |= EPOLLOUT | EPOLLWRNORM;
  return m;
}`},
interview:[{q:'"Trace a read() call on a device file from user space to hardware and back. Where can it block, fault, or be interrupted?"',a:'libc wrapper → trap → entry code (save regs, switch stack, maybe KPTI CR3 switch) → syscall table → vfs_read (checks f_mode, rw_verify_area) → f_op->read. Blocking: wait queue sleep until IRQ wakes. Faults: copy_to_user page-faults in the user buffer (handled via exception table, may sleep to page in). Interruption: signal → -ERESTARTSYS. Return path: check pending work (signals, reschedule) → restore regs → sysret/eret. Bonus: io_uring and mmap rings to avoid per-op syscalls.'}],
resources:[['Linux Device Drivers, 3rd ed. (free, LWN)','https://lwn.net/Kernel/LDD3/'],['Bootlin kernel & driver training materials (free)','https://bootlin.com/docs/'],['Kernel docs: driver API','https://docs.kernel.org/driver-api/index.html'],['LiveOverflow: How do Linux kernel drivers work?','https://www.youtube.com/watch?v=juGNPLdjLH4']]},
{id:'dt',title:'Device Tree, the driver model & probe',minutes:30,skills:['drivers','bringup'],sims:['dtProbe'],
analogy:R`Device Tree is the <b>building blueprint</b> handed to a new facilities manager (the kernel). It lists rooms (devices), their addresses, which breaker powers each (regulators/clocks), and what kind of specialist each room needs (compatible strings). Specialists (drivers) register what they can service; the bus matchmaker pairs them up and calls probe().`,
body:R`<p>On ARM/RISC-V SoCs, hardware that is not discoverable (unlike PCIe/USB) is described in a <b>Device Tree</b> (.dts → compiled .dtb, passed by the bootloader). The kernel unflattens it and creates <code>platform_device</code>s (and I²C/SPI client devices for children of those controllers).</p>
<h3>The driver model in one paragraph</h3><p>Buses (<code>platform</code>, <code>i2c</code>, <code>spi</code>, <code>pci</code>, <code>usb</code>) keep lists of devices and drivers. When either side registers, the bus <code>match()</code> runs — for DT, it compares the node’s <code>compatible</code> list (most specific first) against each driver’s <code>of_match_table</code>. On match, the core calls <code>probe(dev)</code>. Everything a driver allocates with <b>devm_*</b> helpers (<code>devm_kzalloc</code>, <code>devm_ioremap_resource</code>, <code>devm_request_irq</code>, <code>devm_clk_get</code>) is released automatically on probe failure or unbind — the kernel’s RAII.</p>
<pre>camera@1a {
    compatible = "sony,imx415";
    reg = <0x1a>;                      /* I2C address */
    clocks = <&clk IMX8MP_CLK_IPP_DO_CLKO2>;
    vdd-supply = <&reg_cam_2v8>;
    reset-gpios = <&gpio4 2 GPIO_ACTIVE_LOW>;
    port { ep: endpoint { remote-endpoint = <&mipi_csi_in>; data-lanes = <1 2 3 4>; }; };
};</pre>
<h3>Probe ordering and -EPROBE_DEFER</h3><p>A camera needs its regulator, clock, GPIO controller and CSI receiver. If any provider is not yet bound, <code>devm_regulator_get()</code> returns <code>-EPROBE_DEFER</code>; the driver returns it, and the core retries deferred devices after every successful probe. Use <code>dev_err_probe()</code> to log non-defer errors. <code>fw_devlink</code> (on by default since 5.x) infers supplier/consumer links from DT phandles to order probes and avoid deferral storms. Check <code>/sys/kernel/debug/devices_deferred</code> when something never appears.</p>
<h3>Bindings and validation</h3><p>Bindings are documented as YAML schemas in <code>Documentation/devicetree/bindings</code>; <code>make dtbs_check</code> validates your .dts against them. Overlays (.dtbo) let you add a camera module or HAT without rebuilding the base DT. ACPI plays the same role on x86 servers (and on ARM servers like NVIDIA Grace).</p>
<div class="callout gotcha"><b>Gotchas:</b> wrong <code>status = "okay"</code>; pinctrl not applied (pin muxed to another function); <code>reg</code> 8-bit vs 7-bit address confusion; GPIO polarity inverted (ACTIVE_LOW); a driver built as a module that the rootfs mount needs; <code>compatible</code> typo silently binds nothing.</div>`,
poly:R`Every board revision at Poly needed DT changes for sensors, Lontium bridges, PMICs and audio codecs. Your war stories ("the HDMI bridge probed before its regulator and silently failed until we fixed fw_devlink/defer handling") are exactly what Google Embedded Platforms and Cisco platform interviews want. v1’s <code>projects/02-dt-bringup</code> has a sample DTS and validator to practice on.`,
quiz:[
{q:'Your sensor driver’s probe gets -EPROBE_DEFER from devm_regulator_get(). What should it do?',opts:['Retry in a loop with msleep','Return -EPROBE_DEFER so the core retries later','Ignore and continue without power','Panic'],a:1,exp:'Propagate it; the driver core re-probes when new drivers bind.'},
{q:'What does devm_* buy you?',opts:['Faster allocation','Automatic release of resources on probe failure or driver unbind','Allocation from DMA memory','Thread safety'],a:1,exp:'Managed resources are tied to the device’s driver binding lifetime.'},
{q:'A DT node has <code>compatible = "acme,cam-v2", "acme,cam"</code>. A driver only lists "acme,cam". Does it bind?',opts:['No, the first string must match','Yes — the list goes from most specific to most generic','Only if status is disabled','Only with an overlay'],a:1,exp:'Matching tries each compatible string; generic fallbacks are the point of the list.'},
{q:'Where do you look when a device never shows up and you suspect deferral?',opts:['/proc/interrupts','/sys/kernel/debug/devices_deferred and dmesg (dev_err_probe output)','/etc/fstab','lsusb'],a:1,exp:'debugfs lists deferred devices with reasons on recent kernels.'}],
challenge:{prompt:R`<p>Write a platform driver skeleton for a fictional "acme,led-pwm" block: DT binding YAML, a DTS node with <code>reg</code>, <code>interrupts</code>, <code>clocks</code> and a <code>vdd-supply</code>; probe using only devm_* APIs; a sysfs attribute <code>brightness</code>. Run <code>make dtbs_check</code> on your binding. Then deliberately remove the regulator node and explain the resulting log.</p>`,
hints:['<code>platform_get_irq()</code>, <code>devm_platform_ioremap_resource(pdev, 0)</code>, <code>devm_clk_get_enabled()</code>, <code>devm_regulator_get_enable()</code>.','<code>static DEVICE_ATTR_RW(brightness);</code> with show/store; add via <code>.dev_groups</code> in the platform_driver.','Without the regulator node, regulator_get returns a dummy regulator (with a warning) unless the supply is mandatory → understand <code>regulator_get_optional</code> vs <code>regulator_get</code>.'],
solution:R`static int acme_probe(struct platform_device *pdev) {
  struct device *dev = &pdev->dev; struct acme *a; int irq, ret;
  a = devm_kzalloc(dev, sizeof(*a), GFP_KERNEL); if (!a) return -ENOMEM;
  a->base = devm_platform_ioremap_resource(pdev, 0); if (IS_ERR(a->base)) return PTR_ERR(a->base);
  a->clk = devm_clk_get_enabled(dev, NULL);
  if (IS_ERR(a->clk)) return dev_err_probe(dev, PTR_ERR(a->clk), "clock\n");
  ret = devm_regulator_get_enable(dev, "vdd"); if (ret) return dev_err_probe(dev, ret, "vdd\n");
  irq = platform_get_irq(pdev, 0); if (irq < 0) return irq;
  ret = devm_request_threaded_irq(dev, irq, NULL, acme_irq_thread, IRQF_ONESHOT, "acme", a);
  if (ret) return ret;
  platform_set_drvdata(pdev, a); return 0;
}
static const struct of_device_id acme_of[] = { { .compatible = "acme,led-pwm" }, { } };
MODULE_DEVICE_TABLE(of, acme_of);`},

{id:'irq',title:'Interrupts: top halves, bottom halves & threaded IRQs',minutes:30,skills:['drivers','linux-kernel','realtime'],sims:['irqHalves'],
analogy:R`A <b>restaurant doorbell</b>. The host (top half) must answer immediately, but only to say "welcome, table 6 is yours" and write the order on a ticket — then go back to the door. The kitchen (bottom half / threaded handler) cooks. A host who personally cooks every meal leaves the next guests ringing forever.`,
body:R`<p>When a device asserts an interrupt, the interrupt controller (GIC on ARM, APIC on x86) signals a CPU, which saves state and jumps to the kernel’s IRQ entry. Linux calls the handler you registered with <code>request_irq()</code> in <b>hard IRQ context</b>: preemption disabled, that IRQ line masked, cannot sleep, should run in microseconds.</p>
<h3>Deferral mechanisms</h3><table><tr><th>Mechanism</th><th>Context</th><th>Can sleep?</th><th>Use</th></tr>
<tr><td>threaded IRQ (<code>request_threaded_irq</code>)</td><td>dedicated kthread, schedulable, RT-prioritizable</td><td>yes</td><td>default choice for most drivers; required for I²C/SPI devices (bus access sleeps)</td></tr>
<tr><td>softirq / NAPI</td><td>softirq context (or ksoftirqd under load)</td><td>no</td><td>networking, block — very high rate, per-CPU</td></tr>
<tr><td>tasklet</td><td>softirq</td><td>no</td><td>legacy; being phased out in favor of workqueues/BH workqueues</td></tr>
<tr><td>workqueue</td><td>kworker thread</td><td>yes</td><td>deferred non-urgent work, may block</td></tr></table>
<p>The top half typically: reads/acks the interrupt status register (often write-1-to-clear), grabs minimal data (e.g. a completed descriptor index), and returns <code>IRQ_WAKE_THREAD</code> or schedules NAPI. Return <code>IRQ_NONE</code> if the (possibly shared) line was not yours — the kernel detects stuck lines ("nobody cared") and disables them.</p>
<h3>Rates, coalescing and polling</h3><p>At high event rates, per-event interrupts kill throughput (the sim shows overload). Solutions: <b>interrupt coalescing</b> in hardware (fire after N events or T µs), <b>NAPI</b> (first IRQ masks further interrupts and schedules polling until the queue drains, then re-enables), busy-polling (DPDK, <code>SO_BUSY_POLL</code>). This latency-vs-throughput knob is a favorite interview discussion.</p>
<h3>Affinity, MSI-X and real-time</h3><p>PCIe devices use <b>MSI/MSI-X</b> (interrupts as memory writes), one vector per queue, spread across CPUs (<code>/proc/irq/N/smp_affinity</code>, irqbalance). For real-time, steer IRQs away from isolated control cores. With <b>PREEMPT_RT</b>, almost all handlers are forced into threads so a high-priority RT task can preempt them.</p>
<div class="callout gotcha"><b>Gotchas:</b> level-triggered interrupt not acked → interrupt storm; edge-triggered missed while masked → lost event (always re-check status in a loop); race between enabling interrupts and the first event at probe time; <code>IRQF_ONESHOT</code> required with a NULL primary handler; shared lines with devices still asserting during suspend.</div>`,
poly:R`Frame-done interrupts from CSI receivers, VPU encode-complete interrupts, Lontium bridge hot-plug/format-change GPIO interrupts — you have handled all three classes. A great story: an HDMI input format-change IRQ on an I²C bridge that must be a threaded IRQ (I²C reads sleep), plus debouncing and re-reading status in a loop to avoid losing edge events.`,
quiz:[
{q:'Why must interrupt handling for an I²C-attached chip be a threaded IRQ?',opts:['I²C is slow','Reading the chip’s status over I²C can sleep, which is forbidden in hard IRQ context','Threaded IRQs are faster','I²C chips have no IRQ line'],a:1,exp:'I²C transfers wait for the controller (completion/sleep).'},
{q:'What does NAPI do under heavy receive load?',opts:['Raises interrupt rate','Disables device interrupts and polls the RX ring in softirq until drained','Drops all packets','Moves packets to user space'],a:1,exp:'It trades interrupts for polling under load, then re-enables IRQs when idle.'},
{q:'A shared IRQ handler is called but its device did not raise the interrupt. Return…',opts:['IRQ_HANDLED','IRQ_NONE','IRQ_WAKE_THREAD','-EINVAL'],a:1,exp:'IRQ_NONE lets the core detect spurious/stuck lines and try the other handlers.'},
{q:'Predict: a level-triggered device IRQ whose status register is never cleared by the handler will…',opts:['Fire once','Fire continuously (storm) until the kernel disables the line','Be ignored','Turn into an edge interrupt'],a:1,exp:'The line stays asserted; after many unhandled/repeated IRQs the kernel prints "irq N: nobody cared" and disables it.'}],
challenge:{prompt:R`<p>In QEMU (or on a board), write a module that uses a GPIO interrupt (or a timer as a stand-in) at 10 kHz. Implement three variants: all work in the hard handler (busy-loop 50 µs), threaded IRQ, and workqueue. Measure the effect on a <code>cyclictest</code> run on the same CPU and on <code>/proc/interrupts</code> counts. Write up the latency histogram for each.</p>`,
hints:['Use an hrtimer as the "device" if you lack hardware: its callback runs in hard IRQ context.','<code>cyclictest -m -p 80 -i 200 -l 100000 -a 1</code> pins to CPU 1; pin your interrupt there too.','Use <code>trace-cmd record -e irq -e sched_switch</code> to see handler durations in kernelshark.'],
solution:R`<p>Expected: the hard-IRQ variant inflates cyclictest max latency by ≥50 µs and can starve everything at 10 kHz × 50 µs = 50% CPU in IRQ context; threaded IRQ moves the work into a SCHED_FIFO-50 thread — cyclictest at prio 80 preempts it, so its max latency recovers; workqueue runs at normal priority (CFS), so it competes with user tasks and its own latency is worst-case unbounded. Write-up should include histograms and the conclusion "keep hard handlers to ack + schedule, choose deferral by required latency and whether you sleep".</p>`},
interview:[{q:'"Compare softirqs, tasklets, workqueues and threaded IRQs. Which would you use for a camera frame-done interrupt and why?"',a:'Frame done at 30–120 Hz is low rate; the handler must record the completed buffer and wake waiters: hard handler acks + vb2_buffer_done (which is IRQ-safe) is fine, or a threaded IRQ if register access sleeps. Softirq/NAPI is for very high rates; tasklets are deprecated; workqueue for heavier non-urgent processing (stats, reconfig). Mention PREEMPT_RT behavior and priorities of IRQ threads.'}],
resources:[['Kernel docs: generic IRQ handling','https://docs.kernel.org/core-api/genericirq.html'],['Linux Device Drivers ch. 10 (interrupts)','https://lwn.net/Kernel/LDD3/'],['Real-time Linux wiki (PREEMPT_RT)','https://wiki.linuxfoundation.org/realtime/start']]},
{id:'dma',title:'DMA, descriptor rings & cache coherency',minutes:40,skills:['pcie-dma','drivers','arch-perf'],sims:['dmaRing'],
analogy:R`DMA engines are <b>forklifts</b> in a warehouse: the CPU (foreman) writes job tickets (descriptors) on a rotating board (ring) and rings a bell (doorbell). Forklifts move pallets (data) between docks and shelves without the foreman carrying anything. The board has a rule: a ticket is either "yours" or "mine" (OWN bit) — never both.`,
body:R`<p>DMA lets a device read/write system memory directly. The driver must give the device <b>bus addresses</b> (which may differ from physical addresses when an IOMMU/SMMU is present) and must manage <b>coherency</b> between CPU caches and what the device sees.</p>
<h3>The Linux DMA API</h3><ul><li><b>Coherent</b> (consistent) memory: <code>dma_alloc_coherent()</code> — CPU and device see each other’s writes without explicit syncs (uncached or snooped). Use for descriptor rings and small control structures.</li>
<li><b>Streaming</b> mappings: <code>dma_map_single()/dma_map_sg()</code> on existing buffers with a direction (TO_DEVICE / FROM_DEVICE / BIDIRECTIONAL). On non-coherent SoCs this cleans (writes back) or invalidates cache lines. Ownership rule: after map, the device owns the buffer; to touch it on the CPU, call <code>dma_sync_single_for_cpu()</code>, then <code>..._for_device()</code> to give it back.</li>
<li><code>dma_set_mask_and_coherent(dev, DMA_BIT_MASK(32))</code> declares addressing limits; without an IOMMU, a 32-bit device on a >4 GiB system uses <b>swiotlb bounce buffers</b> — a silent copy that destroys performance.</li>
<li><b>dma-buf</b> shares buffers across devices/drivers (camera → GPU → encoder → display) with fences for synchronization — zero-copy pipelines.</li></ul>
<h3>Descriptor rings (sim)</h3><p>A ring of descriptors {buffer address, length, flags, status}. RX: driver pre-posts empty buffers (device-owned); device fills one, writes status + clears OWN, maybe raises an interrupt; driver processes and re-posts. The producer and consumer indices live in device registers (head/tail) and/or memory. Key correctness points:</p>
<ol><li>Write all descriptor fields, then <code>dma_wmb()</code>, then set the OWN/valid bit — the device must never see a valid descriptor with stale fields.</li><li>Ring the doorbell (MMIO <code>writel</code>, which orders prior memory writes) — batch doorbells to cut MMIO cost (each uncached write is expensive, ~100s of ns over PCIe).</li><li>On completion, read the status/OWN bit, then <code>dma_rmb()</code>, then read length/payload.</li></ol>
<h3>IOMMU</h3><p>The IOMMU translates device-visible IOVAs to physical addresses per device (or per group), providing isolation (a buggy/malicious device cannot scribble over kernel memory), scatter-gather to contiguous IOVA, and safe device passthrough to VMs (VFIO). Costs: IOTLB misses and map/unmap overhead — high-performance drivers keep long-lived mappings or use huge IOVA pages. NVIDIA’s kernel CSP role explicitly lists "PCIe virtualization and IOMMU".</p>
<div class="callout gotcha"><b>Gotchas:</b> buffers on the stack or in vmalloc memory (not DMA-able); sharing a cache line between a DMA buffer and CPU-written data on a non-coherent system (invalidation wipes the CPU’s write) — align buffers to cache lines; forgetting <code>dma_unmap</code> (IOMMU leaks); 32-bit masks + large RAM = swiotlb.</div>`,
poly:R`NXP i.MX and Ambarella SoCs are partially non-coherent: video buffers flow through ISP/VPU DMA while the CPU touches headers/metadata. The bug where "the encoder sometimes reads a corrupted top line" is often a missed cache clean or a metadata field sharing a cache line with the DMA region. dma-buf sharing between the CSI capture driver and the encoder is the zero-copy story; quantify it ("removed one 1080p60 memcpy = ~370 MB/s of memory bandwidth").`,
quiz:[
{q:'On a non-coherent SoC, after the device DMAs a frame into memory (FROM_DEVICE), what must happen before the CPU reads it?',opts:['Nothing','Invalidate the CPU cache lines for that buffer (dma_sync_single_for_cpu / unmap)','Clean (write back) the cache','Flush the TLB'],a:1,exp:'Otherwise the CPU may read stale cached data that predates the DMA.'},
{q:'Why write the descriptor fields, then dma_wmb(), then the OWN bit?',opts:['Style preference','So the device never observes OWN=device with stale address/length fields','To flush the TLB','To wake the CPU'],a:1,exp:'Weakly ordered memory systems may make writes visible out of order.'},
{q:'A PCIe device with a 32-bit DMA mask on a 64 GB server without IOMMU will…',opts:['Fail to load','Use swiotlb bounce buffers for memory above 4 GiB (extra copies)','Corrupt memory','Automatically use 64-bit addressing'],a:1,exp:'The kernel bounces through low memory to satisfy the mask.'},
{q:'In the sim, increasing IRQ coalescing mainly trades…',opts:['Memory for CPU','Latency for fewer interrupts (higher throughput / lower CPU)','Drops for bandwidth','Nothing'],a:1,exp:'Waiting for N packets per interrupt adds latency but amortizes interrupt cost.'}],
challenge:{prompt:R`<p>Implement a user-space simulation of a NIC RX ring in C++: a "device" thread writes packets into descriptors it owns (OWN bit), a "driver" thread consumes with NAPI-like polling (budget 64), refills buffers, and updates a tail index. Use <code>std::atomic</code> with the correct acquire/release orders to stand in for dma_rmb/dma_wmb. Measure throughput and drops vs ring size and budget.</p>`,
hints:['Descriptor struct: <code>{ uint64_t addr; uint32_t len; std::atomic<uint32_t> flags; }</code>; flags bit0 = OWN_BY_DEVICE.','Device: wait for OWN set, write len/payload, then <code>flags.store(DONE, release)</code>. Driver: <code>if (flags.load(acquire) & DONE)</code> → read len/payload → refill → <code>flags.store(OWN, release)</code>.','Model an interrupt as a condition variable that the device signals only when the driver is not polling.'],
solution:R`for (;;) {                                   // driver NAPI poll
  int work = 0;
  while (work < BUDGET) {
    Desc& d = ring[tail & (N-1)];
    uint32_t f = d.flags.load(std::memory_order_acquire);   // ~ dma_rmb after status read
    if (!(f & DONE)) break;
    process(bufs[tail & (N-1)], d.len);
    d.len = BUF_SZ;
    d.flags.store(OWN, std::memory_order_release);         // ~ dma_wmb before OWN
    ++tail; ++work;
  }
  if (work < BUDGET) wait_for_irq();          // re-enable "interrupts" and sleep
}`},
interview:[{q:'"Explain coherent vs streaming DMA mappings and when you would use each."',a:'Coherent: long-lived, small, frequently accessed by both sides (rings, mailboxes); may be uncached on non-coherent HW so CPU access is slow. Streaming: per-transfer data buffers, cached for CPU efficiency, explicit ownership hand-off with map/unmap/sync. Mention directions, IOMMU, bounce buffers, dma-buf for cross-device sharing, and how you would debug corruption (CONFIG_DMA_API_DEBUG, poisoning, cache-line alignment).'}],
resources:[['Kernel docs: DMA API','https://docs.kernel.org/core-api/dma-api.html'],['Kernel docs: DMA API HOWTO','https://docs.kernel.org/core-api/dma-api-howto.html'],['Kernel docs: dma-buf','https://docs.kernel.org/driver-api/dma-buf.html']]},
{id:'vm',title:'Virtual memory: page tables, TLBs & page faults',minutes:35,skills:['linux-kernel','arch-perf','cuda-driver'],sims:['pageWalk'],
analogy:R`Virtual addresses are <b>apartment numbers</b>; physical addresses are GPS coordinates. The page table is the city directory that maps one to the other, four volumes deep. The TLB is the <b>sticky note on your fridge</b> with the dozen addresses you visit most — fast, but tiny.`,
body:R`<p>Each process has its own virtual address space; the MMU translates every access using multi-level page tables rooted at a per-process register (CR3 on x86, TTBR0 on arm64). With 4 KiB pages and 48-bit VAs: 4 levels × 9 bits + 12-bit offset (sim). A <b>TLB</b> caches translations; a miss triggers a hardware page walk (up to 4 dependent memory accesses, partially cached in paging-structure caches and L2/L3).</p>
<h3>Page faults</h3><ul><li><b>Minor</b>: page is in memory but not mapped in this process (first touch of anonymous memory → zero page allocation; shared library already in page cache; copy-on-write after fork).</li><li><b>Major</b>: data must be read from storage (file-backed mmap, swap) — milliseconds.</li><li><b>Invalid</b>: no VMA covers the address or permissions violated → SIGSEGV (user) or oops (kernel).</li></ul>
<p>Linux allocates lazily: <code>malloc(1 GiB)</code> just creates a VMA; physical pages arrive on first touch. Overcommit means allocation succeeds and the OOM killer acts later. Real-time code pre-faults and locks memory (<code>mlockall(MCL_CURRENT|MCL_FUTURE)</code>).</p>
<h3>TLB reach & huge pages</h3><p>TLB reach = entries × page size. 1,536 L2 TLB entries × 4 KiB ≈ 6 MiB — far smaller than a 100 GB working set. 2 MiB huge pages (or 1 GiB) multiply reach by 512. Options: hugetlbfs (explicit, reserved), Transparent Huge Pages (automatic, can cause compaction latency spikes — many databases disable it), and on arm64 contiguous-bit PTEs and multiple base page sizes (4K/16K/64K). DPDK and RDMA require hugepages; GPU drivers use large pages for VRAM mappings.</p>
<h3>Context switches & TLB shootdowns</h3><p>Switching address spaces would flush the TLB, but PCID (x86) / ASID (ARM) tags let entries from multiple processes coexist. When a mapping changes (munmap, migration), other CPUs that may cache it must be told: a <b>TLB shootdown</b> IPI — expensive at scale and a source of tail latency in multithreaded programs that mmap/munmap frequently.</p>
<h3>GPU & device angle</h3><p>GPUs have their own MMUs and page tables (GMMU) managed by the kernel driver; Unified Memory (UVM) adds GPU page faults and migration; IOMMUs give devices virtual addresses too; Heterogeneous Memory Management (HMM) lets devices share the CPU process page table. The CUDA driver roles ask for "virtual memory" knowledge precisely because UMD/KMD manage GPU VA spaces, mappings, pinning and fault handling.</p>`,
poly:R`On your Cortex-A SoCs, large video buffers allocated via CMA/ION/dma-heaps and mmapped into user space are exactly this topic: physically contiguous for hardware, virtually mapped for software. If you have ever chased a "first frame is slow" issue, that was page-fault cost on first touch — and pre-faulting / mlock fixed it.`,
quiz:[
{q:'How many bits index each level of a 4-level x86-64 page table with 4 KiB pages?',opts:['8','9','10','12'],a:1,exp:'512 entries × 8 bytes = 4 KiB table → 9 bits per level; 4×9+12 = 48.'},
{q:'malloc(1 GiB) succeeds instantly on Linux. Why?',opts:['Linux compresses memory','Only a virtual area is reserved; physical pages are allocated on first touch (demand paging, overcommit)','It allocates from swap','It returns cached memory'],a:1,exp:'Physical allocation happens lazily in page faults.'},
{q:'Random access over a 64 GiB array is much faster with 2 MiB pages mainly because…',opts:['Fewer page faults only','TLB reach is 512× larger, so far fewer TLB misses/page walks','DRAM is faster','The cache is bigger'],a:1,exp:'TLB misses dominate random access over large working sets.'},
{q:'What is a TLB shootdown?',opts:['A security attack','Inter-processor interrupts telling other CPUs to invalidate stale translations after a mapping change','Flushing the L1 cache','A GPU reset'],a:1,exp:'Needed for correctness when page tables change; costly at high core counts.'}],
challenge:{prompt:R`<p>Write a C program that allocates a 4 GiB buffer and measures random-access latency (pointer chasing through a random permutation) with: (a) regular pages, (b) <code>madvise(MADV_HUGEPAGE)</code>, (c) <code>MAP_HUGETLB</code>. Collect <code>perf stat -e dTLB-load-misses,page-faults</code>. Also measure first-touch time vs second pass. Explain the numbers.</p>`,
hints:['Build the chase so each element stores the index of the next: <code>next[i] = perm[(pos(i)+1) % n]</code> — defeats prefetchers.','Reserve hugetlb pages first: <code>echo 2048 > /proc/sys/vm/nr_hugepages</code>.','First pass includes page-fault (zeroing) cost: ~0.25–1 µs per 4 KiB page.'],
solution:R`<p>Typical x86 server: random chase with 4 KiB pages ≈ 100–150 ns/access (DRAM + page walk), with 2 MiB pages ≈ 80–100 ns (walk mostly gone), dTLB misses drop by >10×. First touch of 4 GiB with 4 KiB pages ≈ 1M faults ≈ 0.5–1 s; with huge pages 2,048 faults (but each zeroes 2 MiB). Conclusion: TLB reach and fault cost are first-order for big-memory systems (KV caches, model weights, packet buffers).</p>`},
interview:[{q:'"What happens on a page fault, end to end?"',a:'CPU raises a fault with the address (CR2/FAR) and error code; kernel entry → do_page_fault/handle_mm_fault: find VMA (none → SIGSEGV), check permissions, walk/allocate page-table levels, then: anonymous → allocate zeroed page; file-backed → page cache lookup, maybe I/O (major fault, sleeps); COW → copy page. Install PTE, return, the instruction retries. Mention mmap_lock contention (per-VMA locks in 6.4+), userfaultfd, and fault cost numbers.'}],
